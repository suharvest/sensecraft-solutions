esphome:
  name: warmup-seed-c3

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

uart:
  - id: uart_bus
    tx_pin: 6
    rx_pin: 7
    baud_rate: 9600
    stop_bits: 1

modbus:
  id: modbus_bus
  uart_id: uart_bus
  flow_control_pin: 4

modbus_controller:
  - id: modbus_ctrl
    address: 0x01
    modbus_id: modbus_bus
    setup_priority: -10
