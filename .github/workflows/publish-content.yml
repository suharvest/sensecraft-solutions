name: Publish Content to CDN

# Manual only, on purpose: this uploads solution content straight to the CDN
# (independent of any app release). It must never be reachable from a PR —
# pull_request/pull_request_target triggers are deliberately absent so a
# fork PR can never see OSS_ACCESS_KEY_ID/OSS_ACCESS_KEY_SECRET.
#
# OSS_ACCESS_KEY_ID/OSS_ACCESS_KEY_SECRET live in the "cdn-publish" GitHub
# Environment, which has a deployment-branch policy restricting it to `main`
# only — dispatching this workflow on any other ref makes the job fail to
# resolve the secrets before the credentials are ever touched, closing the
# "write collaborator runs a modified generator on a feature branch" hole.
on:
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Dry run: generate manifest/zips but skip the OSS upload"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: cdn-publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ossutil v2
        if: ${{ !inputs.no_upload }}
        env:
          OSSUTIL_SHA256: fbf1026bd383a5d9bee051cd64a6226c730357ba569491f7c7b91af66560ef1d
        run: |
          curl -fSL -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip
          echo "${OSSUTIL_SHA256}  ossutil.zip" | sha256sum -c -
          unzip -q ossutil.zip -d ossutil-tmp
          chmod +x ossutil-tmp/*/ossutil && sudo mv ossutil-tmp/*/ossutil /usr/local/bin/
          rm -rf ossutil.zip ossutil-tmp

      # OSS_ACCESS_KEY_ID/OSS_ACCESS_KEY_SECRET are only injected on the real
      # upload path. The dry run must not see them at all: create_solution_zip
      # follows symlinks (Path.rglob + read_bytes), so a committed solution
      # symlinking into something like /proc/self/environ would otherwise let
      # a dry run leak these secrets into the uploaded dist/ artifact.
      - name: Generate manifest (dry run, no secrets)
        if: ${{ inputs.no_upload }}
        run: |
          python3 scripts/generate_solution_manifest.py \
            --solutions-dir solutions \
            --output-dir dist \
            --no-upload

      - name: Generate manifest and publish
        if: ${{ !inputs.no_upload }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: us-east-1
        run: |
          python3 scripts/generate_solution_manifest.py \
            --solutions-dir solutions \
            --output-dir dist

      # main is protected (required "guard"/"validate" checks) so this opens
      # a PR rather than pushing straight to main — the bump still goes
      # through the same checks as any other change, and gives one last
      # manual look before it becomes the baseline for the next app build.
      #
      # NOTE: PRs opened with the default GITHUB_TOKEN do NOT trigger other
      # Actions workflows (GitHub's anti-recursion guard), so "guard"/
      # "validate" will NOT auto-run on this PR — someone has to push an
      # empty commit (or close/reopen) to kick them off before merging, or
      # this needs a PAT/GitHub App token instead of GITHUB_TOKEN.
      - name: Open PR to refresh bundled_hashes.json
        if: ${{ !inputs.no_upload }}
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore: refresh bundled_hashes.json after content publish"
          title: "chore: refresh bundled_hashes.json after content publish"
          body: |
            Auto-generated after a manual `Publish Content to CDN` run
            (${{ github.run_id }}). Reflects the content that was just
            uploaded.

            **Note:** `guard`/`validate` won't auto-run on a bot-opened PR
            (GITHUB_TOKEN can't trigger other workflows) — push an empty
            commit or close/reopen to trigger them before merging.
          branch: chore/bundled-hashes-refresh
          add-paths: solutions/bundled_hashes.json
          delete-branch: true

      - name: Upload dry-run artifacts
        if: ${{ inputs.no_upload }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solution-manifest-dry-run
          path: dist/
