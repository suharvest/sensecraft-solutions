name: ci

# Enforce the open/closed boundary AND validate every solution against the
# published contract, on every push and PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run public-repo boundary guard
        run: sh scripts/public-repo-guard.sh

  # The analytics backend config under solutions/recamera_heatmap_grafana/docker
  # is a mirror; the open-source project is the authority. Two copies drift
  # unless something compares them, and a drifted dashboard or telegraf config
  # is the kind of thing nobody notices until a deployment behaves differently
  # from the one it was tested against.
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend config matches its pinned upstream
        run: scripts/sync_retail_vision_backend.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run unified solution validation (offline)
        run: |
          uv sync
          uv run python scripts/check.py --scope full
      - name: Check dead URLs across all solutions
        run: |
          uv run python scripts/check.py --check solutionctl-network
