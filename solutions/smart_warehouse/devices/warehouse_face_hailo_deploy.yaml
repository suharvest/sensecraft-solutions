version: "1.0"
id: warehouse_face_hailo_deploy
name: Warehouse System + Face Recognition (Hailo)
type: docker_deploy

# Tier 2A variant of warehouse_deploy: same warehouse service plus the
# face_rec_api auxiliary service in ONE compose (two containers, one device).
# device_class pulls in the engine-side Hailo detection probe so the device
# model dropdown pre-selects from the probe result.

device_class: hailo

detection:
  method: local
  requirements:
    - docker_installed
    - docker_running
    - docker_compose_installed

docker:
  compose_file: assets/docker/docker-compose.face-hailo.yml
  remote_path: /home/{{username}}/mcp_warehouse

  environment:
    DB_PATH: /opt/provisioning-station/data/warehouse
    INIT_MOCK_DATA: "false"
    ENABLE_SECURITY_HEADERS: "true"
    CORS_ORIGINS: "*"

  options:
    project_name: mcp_warehouse
    remove_orphans: true
    build: false

  services:
    - name: warehouse
      port: 2125
      health_check_endpoint: /health
      required: true
    - name: face-rec
      port: 8001
      health_check_endpoint: /health
      required: true

ssh:
  port: 22
  default_user: recomputer

pre_checks:
  - type: docker_version
    min_version: "20.0"
    description: Check Docker version
  - type: docker_compose_version
    min_version: "2.0"
    description: Check Docker Compose version
  - type: port_available
    ports:
      - 2125
      - 8001
    description: Check if ports are available
  - type: disk_space
    min_gb: 4
    description: Check available disk space

post_deployment:
  open_browser: true
  url: "http://localhost:2125"

name_i18n:
  zh: 仓库管理系统 + 人脸识别（Hailo）

remote_overrides:
  compose_dir: assets/docker
  user_inputs:
    - id: host
      name: Device IP
      type: text
      required: true
      placeholder: "192.168.1.100"
      description: IP address of the target device
      name_i18n:
        zh: 设备 IP 地址
      description_i18n:
        zh: 目标设备的 IP 地址
    - id: port
      name: SSH Port
      type: text
      default: "22"
      required: false
      description: SSH port (default 22; change only for non-standard setups)
      name_i18n:
        zh: SSH 端口
      description_i18n:
        zh: "SSH 端口（默认 22，仅在非标准配置时修改）"
    - id: username
      name: SSH Username
      type: text
      default: recomputer
      required: true
      description: SSH login username
      name_i18n:
        zh: SSH 用户名
      description_i18n:
        zh: SSH 登录用户名
    - id: password
      name: SSH Password
      type: password
      required: true
      description: SSH login password
      name_i18n:
        zh: SSH 密码
      description_i18n:
        zh: SSH 登录密码
  detection:
    method: network_scan
    manual_entry: true
    requirements:
      - docker_installed
      - docker_running
  pre_checks:
    - type: docker_version
      min_version: "20.0"
      description: Check Docker version
    - type: docker_compose_version
      min_version: "2.0"
      description: Check Docker Compose version
    - type: disk_space
      min_gb: 4
      description: At least 4GB for warehouse + face recognition images
  post_deployment:
    open_browser: true
    url: "http://{{host}}:2125"
  actions:
    before:
      - name: Configure device-facing base URL for face recognition
        timeout: 60
        run: |
          # lan 模式下发给摄像头设备的识别代理地址。warehouse 跑在容器里，
          # 后端自动探测只能拿到 docker 网络地址（172.x），局域网设备连不到。
          # 这里在目标机上算出它自己的局域网 IP 写进 .env，compose 会替换
          # ${WAREHOUSE_DEVICE_BASE_URL}。
          COMPOSE_DIR="/home/{{username}}/mcp_warehouse"
          HOST_IP=$(ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1); exit}')
          ENV_FILE="$COMPOSE_DIR/.env"
          if [ -z "$HOST_IP" ]; then
            # 探测不出 IP 时**必须把旧值作废**：直接跳过会让上一次部署写下的地址留在
            # .env 里，换了网络之后设备仍按旧 IP 回调，而且全程没有任何报错——正是
            # 这个改动要消灭的那类静默失败。注释掉而不是删掉，运维还能看到原值。
            if [ -f "$ENV_FILE" ] && grep -q '^WAREHOUSE_DEVICE_BASE_URL=' "$ENV_FILE"; then
              sed -i 's|^WAREHOUSE_DEVICE_BASE_URL=|# STALE (IP detection failed, see deploy log) WAREHOUSE_DEVICE_BASE_URL=|' "$ENV_FILE"
              echo "WARN: could not determine LAN IP; invalidated the previous value in .env."
            else
              echo "WARN: could not determine LAN IP."
            fi
            echo "LAN face mode will refuse to push an unreachable address and tell you"
            echo "to set WAREHOUSE_DEVICE_BASE_URL=http://<host-lan-ip>:2125/api/face/device"
            exit 0
          fi
          mkdir -p "$COMPOSE_DIR"
          touch "$ENV_FILE"
          # 幂等：已有该键就整行替换，避免重复部署后 .env 里堆多份
          if grep -q '^WAREHOUSE_DEVICE_BASE_URL=' "$ENV_FILE"; then
            sed -i "s|^WAREHOUSE_DEVICE_BASE_URL=.*|WAREHOUSE_DEVICE_BASE_URL=http://${HOST_IP}:2125/api/face/device|" "$ENV_FILE"
          else
            echo "WAREHOUSE_DEVICE_BASE_URL=http://${HOST_IP}:2125/api/face/device" >> "$ENV_FILE"
          fi
          echo "WAREHOUSE_DEVICE_BASE_URL=http://${HOST_IP}:2125/api/face/device"
        name_i18n:
          zh: 配置人脸识别的设备回调地址
      # face-rec-api:v1.1-hailo 容器内是 HailoRT 4.21.0 用户态。HailoRT 要求
      # 宿主机驱动/固件与容器用户态**版本完全一致**，否则 VDevice.create() 直接
      # 抛 HAILO_INVALID_DRIVER_VERSION(76)，face-rec 起不来、出入库人脸门全挂。
      # 树莓派官方源的 hailo-all 只到 4.20.0，装完仍然对不上，所以这里必须跟
      # gun_detection_frigate 一样显式装 4.21.0 驱动。
      - name: Check and install HailoRT 4.21.0 driver
        sudo: true
        timeout: 600
        run: |
          REQUIRED="4.21.0"

          MODVER=$(modinfo -F version hailo_pci 2>/dev/null || echo "none")
          if echo "$MODVER" | grep -q "^${REQUIRED}"; then
            echo "HailoRT ${REQUIRED} driver already installed"
            exit 0
          fi

          echo "hailo_pci driver version: ${MODVER} (need ${REQUIRED})"
          echo "Installing HailoRT ${REQUIRED} using Frigate's official script..."
          echo "This may take 5-10 minutes (compiling kernel module)..."

          curl -sfL https://raw.githubusercontent.com/blakeblackshear/frigate/dev/docker/hailo8l/user_installation.sh -o /tmp/install_hailort.sh
          chmod +x /tmp/install_hailort.sh
          bash /tmp/install_hailort.sh
          rm -f /tmp/install_hailort.sh

          if ! lsmod | grep -q hailo_pci; then
            echo "HailoRT installed but kernel module not loaded."
            echo "Please reboot the device and retry deployment."
            exit 1
          fi

          # 新固件要重启才会真正加载；版本没对上就直接要求重启，
          # 否则容器还是会拿到 76 号错误。
          NEWVER=$(modinfo -F version hailo_pci 2>/dev/null || echo "none")
          if ! echo "$NEWVER" | grep -q "^${REQUIRED}"; then
            echo "Driver built but running module is still ${NEWVER}."
            echo "Please reboot the device and retry deployment."
            exit 1
          fi
          echo "HailoRT ${REQUIRED} installed and loaded successfully"
        name_i18n:
          zh: 检查并安装 HailoRT 4.21.0 驱动
