services:
  warehouse:
    # 按 digest 固定。`latest` 会随每次发布漂走，同一份方案在不同时间部署会拿到
    # 不同的后端。这枚 digest 是 2026-09-06 从 registry 读到的 `latest` 指向：
    #   curl -sI -H 'Accept: application/vnd.oci.image.index.v1+json' \
    #     https://sensecraft-missionpack.seeed.cn/v2/solution/warehouse/manifests/latest
    #   Docker-Content-Digest: sha256:04e26201…
    # registry 上现有的日期 tag（最新 20260820-*）都指向更早的构建，没有一个
    # 对应这枚 digest，所以只能按 digest 引用。发新版时改这一行。
    image: sensecraft-missionpack.seeed.cn/solution/warehouse@sha256:04e26201e732d11fb5a14cf1e193456386210d5fd8a4e864cc8b6d2b7a10d19d
    container_name: mcp_warehouse
    ports:
      - "2125:2125"
    environment:
      - PORT=2125
      - DATABASE_PATH=/data/warehouse.db
      - INIT_MOCK_DATA=${INIT_MOCK_DATA:-false}
      - ENABLE_SECURITY_HEADERS=${ENABLE_SECURITY_HEADERS:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - FACE_ENABLED=true
      - FACE_WE2_SIMULATOR_ENABLED=1
    volumes:
      - warehouse_data:/data
      # 客户通过智控台上传的 ERP Provider（.py）落在这里。必须是卷 ——
      # 镜像不含它（.dockerignore 排除了 mcp/providers/custom/**），不挂卷
      # 就只能活在容器可写层，`docker compose up -d` 换镜像即丢失，系统会
      # 静默回退到 DefaultProvider（本地演示数据），查询看着能跑但全是假数据。
      - warehouse_providers:/app/mcp/providers/custom
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2125/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  warehouse_data:
    driver: local
  warehouse_providers:
    driver: local
