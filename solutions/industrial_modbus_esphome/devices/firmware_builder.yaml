version: "1.0"
id: firmware_builder
name: ESPHome Firmware Builder
name_i18n:
  zh: ESPHome 固件构建器
type: script

# The ESPHome YAML is the single source of the device configuration (Wi-Fi,
# Modbus address, registers). The step only sends it to the compiler; inputs
# reach the scripts through start_command.env (the engine substitutes {{...}}
# there, not in the commands themselves).
script:
  start_command:
    env:
      COMPILER_IP: "{{compiler_ip}}"
      ESPHOME_YAML: "{{esphome_yaml}}"
    linux_macos: |
      set -eu
      CFG="${ESPHOME_YAML:-assets/esphome/xy_md02.yaml}"
      test -s "$CFG" || { echo "ESPHome YAML not found: $CFG" >&2; exit 1; }
      mkdir -p assets/firmware
      curl -fsSL -X POST -F "file=@$CFG" "http://$COMPILER_IP:6052/api/compile" -o assets/firmware/xy_md02_default.bin
      test -s assets/firmware/xy_md02_default.bin
      echo "Firmware built from $CFG"
    windows: |
      # Errors go to stderr without Write-Error: Write-Error echoes the script
      # source, and that echo would match the health check pattern.
      $ErrorActionPreference = 'Stop'
      $cfg = if ($env:ESPHOME_YAML) { $env:ESPHOME_YAML } else { 'assets\esphome\xy_md02.yaml' }
      if (-not (Test-Path -LiteralPath $cfg) -or (Get-Item -LiteralPath $cfg).Length -eq 0) { [Console]::Error.WriteLine("ESPHome YAML not found: $cfg"); exit 1 }
      New-Item -ItemType Directory -Force -Path 'assets\firmware' | Out-Null
      $out = 'assets\firmware\xy_md02_default.bin'
      curl.exe -fsSL -X POST -F "file=@$cfg" "http://$($env:COMPILER_IP):6052/api/compile" -o $out
      if ($LASTEXITCODE -ne 0) { [Console]::Error.WriteLine("Firmware build failed (curl exit $LASTEXITCODE)"); exit $LASTEXITCODE }
      if ((Get-Item -LiteralPath $out).Length -eq 0) { [Console]::Error.WriteLine('Firmware build returned an empty file'); exit 1 }
      Write-Output ('Firmware built ' + "from $cfg")
  # The start command is run like a service: without this check the step
  # would report success even when the build failed. Compiling can take
  # several minutes on a cold compiler.
  health_check:
    type: log_pattern
    pattern: "Firmware built from"
    timeout_seconds: 600

user_inputs:
  - id: compiler_ip
    name: Compiler Service IP
    name_i18n:
      zh: 编译服务 IP
    type: text
    row: 1
    default: "127.0.0.1"
    required: true
    placeholder: "127.0.0.1"
    description: IP address of the ESPHome compiler service deployed in Step 1.
    description_i18n:
      zh: 步骤 1 部署的 ESPHome 编译微服务 IP 地址。
  - id: esphome_yaml
    name: ESPHome YAML File
    name_i18n:
      zh: ESPHome YAML 文件
    type: text
    row: 2
    required: false
    placeholder: "/path/to/my-sensor.yaml"
    description: Path to the ESPHome YAML on this computer that holds Wi-Fi, Modbus address and registers. Leave empty to build the bundled XY-MD02 template; that board then opens the hotspot "xiao-rs485-fallback" to set up Wi-Fi.
    description_i18n:
      zh: 本机上的 ESPHome YAML 文件路径，Wi-Fi、Modbus 地址和寄存器都写在这份文件里。留空则编译自带的 XY-MD02 模板，烧录后板子会开出热点 “xiao-rs485-fallback” 用于配置 Wi-Fi。

post_deployment:
  open_browser: false
