<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#44566a"/>
    </marker>
  </defs>

  <rect x="30" y="120" width="130" height="52" rx="26" fill="#eef3f8" stroke="#4a6b8a" stroke-width="2"/>
  <text x="95" y="152" text-anchor="middle" font-size="14" fill="#213547">raised</text>

  <rect x="230" y="120" width="170" height="52" rx="26" fill="#fbf4e8" stroke="#a07a34" stroke-width="2"/>
  <text x="315" y="152" text-anchor="middle" font-size="14" fill="#213547">pending_confirm</text>

  <rect x="470" y="120" width="140" height="52" rx="26" fill="#f3f7f1" stroke="#5c7f52" stroke-width="2"/>
  <text x="540" y="152" text-anchor="middle" font-size="14" fill="#213547">confirmed</text>

  <rect x="690" y="60" width="150" height="52" rx="26" fill="#f6f1f8" stroke="#7a5c8a" stroke-width="2"/>
  <text x="765" y="92" text-anchor="middle" font-size="14" fill="#213547">notified</text>

  <rect x="690" y="180" width="150" height="52" rx="26" fill="#fdecec" stroke="#a34a4a" stroke-width="2"/>
  <text x="765" y="212" text-anchor="middle" font-size="14" fill="#213547">escalated</text>

  <rect x="230" y="255" width="170" height="46" rx="23" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2"/>
  <text x="315" y="284" text-anchor="middle" font-size="14" fill="#213547">dismissed</text>

  <line x1="160" y1="146" x2="226" y2="146" stroke="#44566a" stroke-width="2" marker-end="url(#b)"/>
  <text x="193" y="136" text-anchor="middle" font-size="11" fill="#5a6b7a">evidence</text>
  <text x="193" y="124" text-anchor="middle" font-size="11" fill="#5a6b7a">5 s</text>

  <line x1="400" y1="146" x2="466" y2="146" stroke="#44566a" stroke-width="2" marker-end="url(#b)"/>
  <text x="433" y="136" text-anchor="middle" font-size="11" fill="#5a6b7a">operator or</text>
  <text x="433" y="124" text-anchor="middle" font-size="11" fill="#5a6b7a">60 s timeout</text>

  <line x1="610" y1="138" x2="686" y2="96" stroke="#44566a" stroke-width="2" marker-end="url(#b)"/>
  <text x="655" y="112" text-anchor="middle" font-size="11" fill="#5a6b7a">sent &lt; 5 s</text>

  <line x1="610" y1="156" x2="686" y2="198" stroke="#44566a" stroke-width="2" marker-end="url(#b)"/>
  <text x="655" y="192" text-anchor="middle" font-size="11" fill="#5a6b7a">deadline missed</text>

  <line x1="315" y1="172" x2="315" y2="251" stroke="#44566a" stroke-width="2" marker-end="url(#b)"/>
  <text x="360" y="215" text-anchor="middle" font-size="11" fill="#5a6b7a">operator rejects</text>

  <text x="30" y="325" font-size="12" fill="#5a6b7a">Retry every 30 s after a failed send; escalated never falls back to notified, so the audit trail is not overwritten.</text>
</svg>
