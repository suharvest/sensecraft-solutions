version: "1.0"
id: preview_recamera_fall
name: Fall Detection Preview
type: video_stream

video:
  type: rtsp_proxy

mqtt:
  broker_template: "{{mqtt_broker}}"
  port_template: "{{mqtt_port}}"
  topic_template: "{{mqtt_topic}}"
  username_template: "{{mqtt_username}}"
  password_template: "{{mqtt_password}}"

overlay:
  renderer: custom
  script_file: preview/draw_fall_detection.js
  dependencies: []

display:
  aspect_ratio: "16:9"
  auto_start: false
  show_stats: true

user_inputs:
  - id: rtsp_url
    name: RTSP URL
    type: text
    required: true
    default_template: "rtsp://{{host}}:8554/live0"
    default: "rtsp://192.168.42.1:8554/live0"
    placeholder: "rtsp://192.168.42.1:8554/live0"
    description: Video stream address — auto-filled from the install step's IP
    name_i18n:
      zh: RTSP 地址
    description_i18n:
      zh: 视频流地址——自动带入安装步骤填的 IP
  - id: mqtt_broker
    name: MQTT Broker
    type: text
    required: true
    default_template: "{{host}}"
    default: "192.168.42.1"
    placeholder: "192.168.42.1"
    description: MQTT broker address — auto-filled from the install step's IP
    name_i18n:
      zh: MQTT 服务器
    description_i18n:
      zh: MQTT 服务器地址——自动带入安装步骤填的 IP
  - id: mqtt_port
    name: MQTT Port
    type: text
    required: false
    default: "1883"
    placeholder: "1883"
    name_i18n:
      zh: MQTT 端口
  - id: mqtt_topic
    name: MQTT Topic
    type: text
    required: false
    default: "recamera/fall-detection/results"
    placeholder: "recamera/fall-detection/results"
    name_i18n:
      zh: MQTT 主题
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    placeholder: "(optional)"
    name_i18n:
      zh: MQTT 用户名
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    placeholder: "(optional)"
    name_i18n:
      zh: MQTT 密码

name_i18n:
  zh: 跌倒检测预览
