version: "1.0"
id: recamera_pro_fall
name: reCamera Pro
type: recamera_pro_app

# The app ships through the device's App Center rather than with this solution:
# installing one requires a release-signed archive, and the signing chain is not
# public. So this step configures the installed app and makes it the active one.
# If the App Center on the target does not carry it, the step says so and names
# what is installed instead.
recamera_pro_app:
  app_id: fall-detection
  activation_timeout: 90
  config:
    # Everything the app publishes goes to MQTT so this preset lands on the same
    # contract as the others. The app's own default is WebSocket only, which is
    # fine for the on-device preview but invisible to Home Assistant.
    output_channels: ["ws", "mqtt"]
    dMqtt:
      sURL: "{{mqtt_host}}"
      iPort: "{{mqtt_port}}"
      sTopic: "{{device_name}}"
      sUsername: "{{mqtt_username}}"
      sPassword: "{{mqtt_password}}"
      sClientId: "recamera-pro-fall"
    # Left at the app's frozen defaults on purpose: these thresholds were tuned
    # against the held-out test set, and a solution that quietly re-tunes them
    # would invalidate the accuracy figures on the intro page.

name_i18n:
  zh: reCamera Pro

post_deployment:
  open_browser: false

user_inputs:
  - id: host
    name: Device IP
    type: text
    required: true
    placeholder: "192.168.1.100"
    description: The address you use to open the reCamera Pro console
    name_i18n:
      zh: 设备 IP
    description_i18n:
      zh: 就是你打开 reCamera Pro 控制台时用的地址
  - id: username
    name: Console Username
    type: text
    default: admin
    required: true
    description: The console account, not an SSH login
    name_i18n:
      zh: 控制台用户名
    description_i18n:
      zh: 控制台账号，不是 SSH 登录名
  - id: password
    name: Console Password
    type: password
    required: true
    description: Repeated failures make the device lock your IP for a while, so check it before retrying
    name_i18n:
      zh: 控制台密码
    description_i18n:
      zh: 连续输错会让设备按 IP 锁定一段时间，重试前先确认密码
  - id: device_name
    name: Device Name
    type: text
    default: "recamera"
    required: true
    description: First segment of the MQTT topic — name this device however you like (product line, room, or site) so several devices stay separable
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 设备名称
    description_i18n:
      zh: MQTT 主题的第一段——按你自己的习惯给这台设备取名（产品线、房间或站点都行），多台设备就不会混在一起
  - id: mqtt_host
    name: MQTT Broker Address
    type: text
    required: true
    placeholder: "192.168.1.50"
    description: This preset has no broker of its own — point it at the one Home Assistant or your alerting system already uses
    name_i18n:
      zh: MQTT 服务器地址
    description_i18n:
      zh: 这个套餐不自带 broker——填 Home Assistant 或你现有告警系统在用的那个
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    name_i18n:
      zh: MQTT 端口
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    description: Leave empty if the broker allows anonymous clients
    name_i18n:
      zh: MQTT 用户名
    description_i18n:
      zh: broker 允许匿名连接就留空
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    name_i18n:
      zh: MQTT 密码
