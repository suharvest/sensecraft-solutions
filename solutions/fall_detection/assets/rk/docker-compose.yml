# Rockchip RK3576 / RK3588 fall detection.
#
# One runtime image serves both boards — only the .rknn pose model differs, and
# that is downloaded per board at deploy time. The image carries NumPy and
# headless OpenCV but no Torch, Ultralytics, ONNX Runtime or RKNN Toolkit.
#
# RKNN Lite and librknnrt are bind-mounted from the host on purpose: the user
# library has to match the kernel NPU driver, so the host copy stays
# authoritative rather than a version baked into the image.
services:
  fall-detection:
    image: sensecraft-missionpack.seeed.cn/solution/fall-detection-rknn:0.1.0-rc2
    command: ["app.py", "--config", "/config/config.json"]
    restart: unless-stopped
    network_mode: host
    privileged: true
    depends_on:
      - mosquitto
    devices:
      - "/dev/dri:/dev/dri"
    environment:
      # RKNN Lite is reached from the host tree rather than copied over the
      # container's own site-packages. Mounting onto site-packages is what the
      # upstream compose does and it fails badly here: Rockchip ships
      # rknn_toolkit_lite2 as a wheel, so on many images it lives in ~/.local or
      # a venv rather than /usr/lib/python3/dist-packages. Docker then creates
      # the missing source path as an EMPTY directory and mounts that over
      # site-packages, so the import fails and the container crash-loops.
      PYTHONPATH: /host-pysite
    volumes:
      - /usr/lib/librknnrt.so:/usr/lib/librknnrt.so:ro
      # RKNN_SITE is written to .env by the deploy step, which locates the real
      # site-packages directory holding rknnlite on this board. An unset value
      # makes compose fail loudly instead of mounting an empty directory.
      - ${RKNN_SITE}:/host-pysite:ro
      - ./config:/config:ro
      - ./models:/models:ro
    healthcheck:
      # Importing rknnlite is the check that matters. The previous test only
      # confirmed the config and model files existed, which stayed true while
      # the app crash-looped on a failed import — the stack reported healthy
      # and published nothing.
      test: ["CMD-SHELL", "python3 -c 'import rknnlite.api' && test -r /config/config.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # These boards ship no MQTT broker, so the stack brings one. Point Home
  # Assistant or your alerting system at port 1883.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    network_mode: host
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
