# Rockchip RK3576 / RK3588 fall detection.
#
# One runtime image serves both boards — only the .rknn pose model differs, and
# that is downloaded per board at deploy time. The image carries NumPy and
# headless OpenCV but no Torch, Ultralytics, ONNX Runtime or RKNN Toolkit.
#
# librknnrt is bind-mounted from the host on purpose: the user
# library has to match the kernel NPU driver, so the host copy stays
# authoritative rather than a version baked into the image.
services:
  fall-detection:
    image: sensecraft-missionpack.seeed.cn/solution/fall-detection-rknn:0.2.0
    command: ["--config", "/config/config.json"]
    restart: unless-stopped
    network_mode: host
    privileged: true
    depends_on:
      - mosquitto
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - /usr/lib/librknnrt.so:/usr/lib/librknnrt.so:ro
      - ./config:/config:ro
      - ./models:/models:ro
    # GStreamer caches its plugin scan in /root/.cache. A tmpfs makes the scan fresh on every start.
    tmpfs:
      - /root/.cache
    healthcheck:
      test: ["CMD-SHELL", "test -r /config/config.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # These boards ship no MQTT broker, so the stack brings one. Point Home
  # Assistant or your alerting system at port 1883.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    network_mode: host
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Alarm panel — zones, timeouts, an operator confirmation page, an SQLite
  # audit trail and a webhook, on top of the detector's MQTT stream. It runs in
  # this same stack because this host already has the broker and the detector;
  # nothing about detection changes when it is here.
  #
  # network_mode: host, so the listening port comes from web.port in
  # config/alarm-panel.yaml (the deploy step writes the value from the form)
  # rather than from a ports mapping. Change it there if 8080 is taken.
  alarm-panel:
    # Pinned by digest.
    #   arm64 sha256:11623704f2af6272e9d8a7beb190439bc1631b7224f4e2ac38983810a690c618
    image: sensecraft-missionpack.seeed.cn/solution/eldercare-alarm-arm64:0.1.0@sha256:11623704f2af6272e9d8a7beb190439bc1631b7224f4e2ac38983810a690c618
    command: ["--config", "/config/config.yaml"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mosquitto
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config/alarm-panel.yaml:/config/config.yaml:ro
      - alarm-panel-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alarm-panel-data:
