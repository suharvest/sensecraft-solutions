# NRD-2. Targets offered: Jetson Orin Nano / Orin NX (TensorRT; NX accepted on owner
# decision 2026-10-08, engine built and device-run on Orin Nano only), RK3588 and
# RK3576 (RKNN). RK3576 was removed on 2026-10-08 (its first run used a
# substitute image) and restored 2026-10-08 after a package-compose run on
# cat-remote (LubanCat RK3576), see the preset comment below.
version: "1.0"
id: edge_parking_counting
name: Edge Parking Vehicle Counting
name_i18n:
  zh: 边缘停车场车辆进出计数
enabled: true
intro:
  visibility: staging
  summary: Count vehicles in and out at a car park entrance with the existing IP camera, and publish vehicles inside and free spaces over MQTT.
  summary_i18n:
    zh: 用出入口现有的网络摄像头统计车辆进出，并通过 MQTT 实时发布场内车辆数和剩余车位。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/cover-20261008.jpg
  gallery:
    - type: image
      src: gallery/panel-counting-1-before-20261009.jpg
      caption: "Entry/exit counting on Jetson Orin Nano Super: tracked vehicle #48 before it crosses the line; inside 1 / 120, in 24, out 23 today (synthetic test clip, one vehicle)"
      caption_i18n:
        zh: "Jetson Orin Nano Super 出入口计数：车辆 #48 越线前；在场 1/120，今日驶入 24、驶出 23（合成测试视频，单辆车）"
        ja: "Jetson Orin Nano Super の出入口カウント：車両 #48 がラインを越える前。場内 1/120、本日入場 24・出場 23（合成テスト映像、車両 1 台）"
    - type: image
      src: gallery/panel-counting-2-after-20261009.jpg
      caption: "Entry/exit counting on Jetson Orin Nano Super: the same vehicle after crossing; out count 23 → 24, inside 0 / 120 (synthetic test clip, one vehicle)"
      caption_i18n:
        zh: "Jetson Orin Nano Super 出入口计数：同一车辆越线后，今日驶出 23 → 24，在场 0/120（合成测试视频，单辆车）"
        ja: "Jetson Orin Nano Super の出入口カウント：同じ車両がラインを越えた後。本日出場 23 → 24、場内 0/120（合成テスト映像、車両 1 台）"
  category: vision_video_ai
  solution_type: solution
  tags: [parking, vehicle-counting, mqtt, jetson, rk3588, rk3576]
  output_interfaces:
    - type: mqtt
      port: 1883
      topic: <site>/parking/<entrance>/crossing
      schema_type: json
      description: One record per vehicle crossing the line - direction (in/out), vehicle type, vehicles inside and free spaces after it. Sent to your own MQTT server.
      description_i18n:
        zh: 每辆车越线一条记录：方向（驶入/驶出）、车型、越线后的场内车辆数和剩余车位。发送到你自己的 MQTT 服务器。
    - type: mqtt
      port: 1883
      topic: <site>/parking/<entrance>/occupancy
      schema_type: json
      description: Vehicles inside, total spaces, free spaces and today's in/out totals, sent after every crossing.
      description_i18n:
        zh: 场内车辆数、车位总数、剩余车位和今日进出总数，每次越线后发送。
    - type: http
      port: 8099
      endpoint: /healthz
      method: GET
      schema_type: json
      description: Service status - whether the camera picture is being received and how many frames per second are processed.
      description_i18n:
        zh: 服务状态：是否收到摄像头画面、每秒处理多少帧。
  input_requirements:
    - type: rtsp
      description: An IP camera at the entrance with an RTSP stream (H.264 or H.265), mounted so vehicles cross the picture fully in view.
      description_i18n:
        zh: 出入口的网络摄像头，提供 RTSP 视频流（H.264 或 H.265），固定安装，车辆整车入镜穿过画面。
  device_catalog:
    recomputer_j30:
      description: Analyses the camera picture and counts vehicles, 30 frames per second measured. Jetson Orin Nano module with JetPack 6.2.
      description_i18n:
        zh: 分析摄像头画面并统计进出车辆，实测每秒处理 30 帧。Jetson Orin Nano 模组，需 JetPack 6.2。
    recomputer_j40:
      description: Analyses the camera picture and counts vehicles. Jetson Orin NX module with JetPack 6.2.
      description_i18n:
        zh: 分析摄像头画面并统计进出车辆。Jetson Orin NX 模组，需 JetPack 6.2。
    recomputer_rk3588:
      description: Analyses the camera picture and counts vehicles, about 3 frames per second; suited to barrier entrances where vehicles slow down.
      description_i18n: {zh: 分析摄像头画面并统计进出车辆，每秒处理约 3 帧，适合车辆减速通过的道闸出入口。}
    recomputer_rk3576:
      description: Analyses the camera picture and counts vehicles, 30 frames per second measured.
      description_i18n: {zh: 分析摄像头画面并统计进出车辆，实测每秒处理 30 帧。}
    generic_ip_camera:
      name: IP Camera
      name_i18n:
        zh: IP 摄像头
      description: The entrance camera you already have; it must provide an RTSP stream.
      description_i18n:
        zh: 出入口现有的摄像头，需支持 RTSP 视频流。
  presets:
    - id: ip_camera_box
      name: IP Camera + Edge Compute Box
      name_i18n:
        zh: IP 摄像头 + 边缘算力盒子
        ja: IP カメラ + エッジコンピューティングボックス
      description: Keep your entrance camera and add a reComputer next to it. reComputer J30 / J40 (Jetson Orin Nano / Orin NX, JetPack 6.2), RK3588 or RK3576. Measured on Orin Nano and RK3576, 30 frames per second; RK3588 about 3, suited to barrier entrances where vehicles slow down.
      description_i18n:
        zh: 沿用出入口现有摄像头，旁边加一台 reComputer。reComputer J30 / J40（Jetson Orin Nano / Orin NX，JetPack 6.2）、RK3588 或 RK3576；实测 Orin Nano 和 RK3576 每秒处理 30 帧，RK3588 每秒约 3 帧，适合车辆减速通过的道闸出入口。
        ja: 出入口の既存カメラをそのまま使い、隣に reComputer を 1 台追加します。reComputer J30 / J40（Jetson Orin Nano / Orin NX、JetPack 6.2）、RK3588 または RK3576 を使います。実測で Orin Nano と RK3576 は毎秒 30 フレーム、RK3588 は毎秒約 3 フレームを処理し、車両が減速して通過するゲート出入口に向いています。
      # `verified: [hardware]` reflects the Jetson, RK3588 and RK3576 targets.
      # - Jetson: device run 2026-10-08 on Jetson Orin Nano (acceptance
      #   receipt orin-nano/edge_parking_counting): package compose + locally
      #   built image, synthetic 640x360 30 fps clip (one vehicle crossing every
      #   6 s) over RTSP. 29.98 fps processed (NVDEC, no fallback), inference p50
      #   3.58 / p95 3.64 ms, 41/41 expected crossings, ready 11.9 s. Not
      #   covered: accuracy on real gate video, multi-stream capacity, SenseCraft
      #   one-click path, public image.
      # - RK3588: device run 2026-10-08 on Radxa Rock 5T (acceptance
      #   receipt radxa/edge_parking_counting): package compose with the
      #   librga.so.2 and host GStreamer mounts, locally built image 6a5c781d,
      #   real 1280x720 H.264 5 fps parking-lot clip looped over RTSP. 3.0 fps
      #   processed of 5 (about 26 % dropped, cause not diagnosed), RKNN p50
      #   17.8 / p95 20.0 ms, MPP decode, 107 MQTT events with contiguous seq.
      #   Not covered: accuracy (clip loops every 10 s), r2 image, public
      #   artifact.
      # - RK3576: device run 2026-10-08 on cat-remote (LubanCat RK3576, Debian,
      #   librknnrt 2.3.2): docker_remote_deployer order reproduced by hand
      #   (after_upload library auto-detect -> .env, model fallback download,
      #   form-input config render, compose up, 8099 readiness = 5 s), published
      #   image nrd-parking-rk:20261008 @df4bb508, synthetic 640x360 30 fps
      #   clip over RTSP (count-synthetic-120s.mp4, one vehicle crossing every
      #   6 s). 29-30 fps processed (MPP decode, no fallback, 0 hook drops),
      #   19 crossings in ~115 s (9 in / 10 out), runtime RSS ~146 MB, ~15 % of
      #   one core. Per-frame NPU time is not exposed by /healthz, so the
      #   description leaves that cell empty. Not covered: accuracy on real
      #   gate video, multi-stream capacity, the app's one-click UI path.
      # - Deploy-form inputs (2026-10-08) render the config on the device; run
      #   on RK3576 (above), not yet on Jetson or RK3588.
      # - 2026-10-09: line orientation / position / entry side / vehicles inside
      #   removed from the deploy form; step 2 opens /counting/editor
      #   (nrd-parking 20261009 images) where the line is drawn and saved
      #   (state_dir/app-options.override.json overrides the rendered counting
      #   section, including capacity) and vehicles inside are set.
      # - 2026-10-09 (20261009b images): the override keeps only line / in_side;
      #   capacity follows the deploy form on every redeploy, the saved line stays.
      verified:
        - hardware
      device_groups:
        - id: compute
          name: Counting Device
          name_i18n:
            zh: 计数设备
          type: single
          required: true
          description: The device that analyses the camera picture. reComputer J30 / J40 (Jetson Orin Nano / Orin NX) or RK3576 for entrances where vehicles drive through; RK3588 for barrier entrances where they slow down.
          description_i18n:
            zh: 分析摄像头画面的设备。车辆直接驶过的出入口选 reComputer J30 / J40（Jetson Orin Nano / Orin NX）或 RK3576；车辆减速通过的道闸出入口可选 RK3588。
          options:
            - device_ref: recomputer_j30
            - device_ref: recomputer_j40
            - device_ref: recomputer_rk3588
            - device_ref: recomputer_rk3576
          default: recomputer_j30
        - id: camera
          name: Entrance Camera
          name_i18n:
            zh: 出入口摄像头
          type: single
          required: true
          options:
            - device_ref: generic_ip_camera
          default: generic_ip_camera
  stats:
    difficulty: advanced
    estimated_time: 60min
  links: {}
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
