version: "1.0"
id: health_verify
name: Verify parking health
name_i18n:
  zh: 验证停车服务健康状态
type: http_debug
http_debug:
  endpoints:
    - id: healthz
      name: Native health endpoint
      name_i18n: {zh: 原生健康端点}
      url_template: http://{{host}}:{{port}}/healthz
      expected_status: 200
user_inputs:
  - id: host
    name: Jetson host
    name_i18n: {zh: Jetson 主机地址}
    type: text
    required: true
  - id: port
    name: Health port
    name_i18n: {zh: 健康端口}
    type: text
    default: "8099"
    required: false
    description: HTTP health port from the mounted application config.
    description_i18n: {zh: 挂载应用配置中的 HTTP 健康端口。}
