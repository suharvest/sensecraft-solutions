version: "1.0"
id: jetson_counting
name: reComputer J30 / J40 Vehicle Counting
name_i18n:
  zh: reComputer J30 / J40 车辆计数
type: docker_deploy
# Runtime image: compose default (nrd-parking-jetson:20261009b, pinned by digest).
# Model: count_vehicle416_orin_nano bundle, TensorRT FP16 engine built on
# Jetson Orin Nano or Orin NX (reComputer J30 / J40) / L4T R36.4 / TensorRT 10.3
# (the before action enforces it). Engines are built on Orin Nano; Orin NX is the
# same Ampere SM 8.7 family and is accepted on owner decision 2026-10-08 (not
# device-run on NX).
# config/counting.json is rendered from the deploy inputs (after_upload).
# Device run 2026-10-07/08 (Orin Nano, receipt acceptance-20261008/orin-nano/
# edge_parking_counting): synthetic 640x360 30 fps clip, 29.98 fps processed,
# NVDEC, inference p50 3.58 / p95 3.64 ms, 41/41 crossings, ready 11.9 s.
# That run drove the package compose directly with an edited config; the
# input-rendering path was not run on device.
device_class: jetson
docker:
  compose_file: assets/docker-compose.jetson.yml
  compose_dir: assets
  remote_path: /home/{{username}}/edge-parking-counting
  options:
    project_name: edge_parking_counting_jetson
    remove_orphans: false
  services:
    - name: parking
      required: true
  environment:
    PARKING_MODELS_DIR: "./models"  # local: next to the compose file; remote: remote_overrides.environment
    PARKING_HEALTH_PORT: "{{health_port}}"
ssh:
  port: 22
  default_user: recomputer
  auth_methods: [password]
  connection_timeout: 30
  command_timeout: 3600
pre_checks:
  - type: disk_space
    min_gb: 0.5
    description: At least 0.5 GB free for logs and runtime files.
  - type: nvidia_runtime
    description: The NVIDIA container runtime must be installed (it comes with JetPack).
deploy_timeout: 3600
post_deployment:
  open_browser: false
files:
  # count_vehicle416_orin_nano: 9982435 bytes, published 2026-10-08; after_upload unpacks it into models/.
  - url: https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/count_vehicle416_orin_nano-9a5b949eab79.tar.gz
    remote_path: /home/{{username}}/edge-parking-counting/models/count_vehicle416_orin_nano-9a5b949eab79.tar.gz
    checksum:
      sha256: 9a5b949eab79792796855acad6f5827b03da2d774fffb16850e7e883f2694b5e
actions:
  before:
    - name: Fix Docker iptables for JetPack 6.x
      # The jetson device profile applies this over SSH (remote view only).
      # Run locally it needs passwordless sudo; without it the step prints the
      # commands and continues, because this stack uses host networking and
      # does not depend on Docker's iptables rules.
      ignore_error: true
      run: |
        set -e
        CONF="/etc/systemd/system/docker.service.d/disable-raw-table.conf"
        if [ -f "$CONF" ] && grep -q "DOCKER_INSECURE_NO_IPTABLES_RAW=1" "$CONF" 2>/dev/null; then
          echo "Docker iptables fix already applied"
          exit 0
        fi
        if ! head -1 /etc/nv_tegra_release 2>/dev/null | grep -q "R36"; then
          echo "Not JetPack 6.x — fix not needed"
          exit 0
        fi
        if ! sudo -n true 2>/dev/null; then
          echo "WARNING: Docker iptables fix not applied (needs sudo). To apply it, write" >&2
          echo "  [Service]" >&2
          echo "  Environment=\"DOCKER_INSECURE_NO_IPTABLES_RAW=1\"" >&2
          echo "to $CONF, then run: sudo systemctl daemon-reload && sudo systemctl restart docker" >&2
          exit 1
        fi
        echo "Applying Docker iptables raw table fix for JetPack 6.x..."
        sudo mkdir -p /etc/systemd/system/docker.service.d
        printf '[Service]\nEnvironment="DOCKER_INSECURE_NO_IPTABLES_RAW=1"\n' | sudo tee "$CONF" > /dev/null
        sudo systemctl daemon-reload
        sudo systemctl restart docker
        sleep 2
        echo "Docker iptables fix applied"
      name_i18n:
        zh: 修复 JetPack 6.x Docker 网络问题
    - name: Check the Jetson module and JetPack version
      name_i18n: {zh: 检查 Jetson 模组与 JetPack 版本}
      ignore_error: false
      run: |
        set -eu
        # The prebuilt TensorRT engines only load on the module/JetPack they were built on.
        want="p3767-0000 p3767-0001 p3767-0003 p3767-0004"
        compat=$(tr '\0' ' ' </proc/device-tree/compatible 2>/dev/null || true)
        rel=$(head -1 /etc/nv_tegra_release 2>/dev/null || true)
        trt=$(dpkg-query -W -f='${Version}' libnvinfer10 2>/dev/null || true)
        echo "module:   ${compat:-unknown}"
        echo "L4T:      ${rel:-unknown}"
        echo "TensorRT: ${trt:-not found}"
        ok=0
        for m in $want; do
          case " $compat " in *" nvidia,$m "*) ok=1 ;; esac
        done
        if [ "$ok" -ne 1 ]; then
          echo "UNSUPPORTED_JETSON_MODULE: this solution runs on Jetson Orin Nano or Orin NX (reComputer J30 / J40); this board reports '${compat:-unknown}'." >&2
          exit 1
        fi
        case "$rel" in
          "# R36 (release), REVISION: 4."*) ;;
          *) echo "UNSUPPORTED_JETPACK: the engines were built on L4T R36.4 (JetPack 6.2); this board reports '${rel:-unknown}'." >&2; exit 1 ;;
        esac
        case "$trt" in
          10.3.*) ;;
          *) echo "UNSUPPORTED_TENSORRT: the engines were built with TensorRT 10.3; this board has '${trt:-none}'." >&2; exit 1 ;;
        esac
        echo "Jetson module and JetPack match the prebuilt engines"
  after_upload:
    - name: Download the vehicle model
      name_i18n: {zh: 下载车辆识别模型}
      timeout: 1800
      run: |
        set -eu
        # Local deploy: assets/models, which PARKING_MODELS_DIR (./models) mounts
        # from the compose file's directory.
        MODELS_DIR="assets/models"
        BUNDLE="count_vehicle416_orin_nano-9a5b949eab79.tar.gz"
        BUNDLE_SHA="9a5b949eab79792796855acad6f5827b03da2d774fffb16850e7e883f2694b5e"
        URL="https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/count_vehicle416_orin_nano-9a5b949eab79.tar.gz"
        mkdir -p "$MODELS_DIR"
        have_models() {
          echo "73363ee8c48eb80195f12dbf5958284e0200955251f406118ff50153f8a2111d  $MODELS_DIR/vehicle416.fp16.engine" | sha256sum -c - >/dev/null 2>&1 || return 1
        }
        if have_models; then
          echo "Model files already present"
        else
          if ! echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE" | sha256sum -c - >/dev/null 2>&1; then
            # files: 字段在 after_upload 之前放好 bundle；本地部署与不认 files: 的老引擎走这里的下载兜底。
            curl -fSL --retry 3 -o "$MODELS_DIR/$BUNDLE.part" "$URL"
            echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE.part" | sha256sum -c -
            mv -f "$MODELS_DIR/$BUNDLE.part" "$MODELS_DIR/$BUNDLE"
          fi
          tar -xzf "$MODELS_DIR/$BUNDLE" --no-same-owner -C "$MODELS_DIR"
          echo "73363ee8c48eb80195f12dbf5958284e0200955251f406118ff50153f8a2111d  $MODELS_DIR/vehicle416.fp16.engine" | sha256sum -c -
        fi
        ls -l "$MODELS_DIR"
    - name: Write the counting settings
      name_i18n: {zh: 写入计数设置}
      env:
        SITE_ID: '{{site_id}}'
        CAMERA_ID: '{{camera_id}}'
        RTSP_URL: '{{rtsp_url}}'
        MQTT_HOST: '{{mqtt_host}}'
        MQTT_PORT: '{{mqtt_port}}'
        MQTT_USERNAME: '{{mqtt_username}}'
        MQTT_PASSWORD: '{{mqtt_password}}'
        CAPACITY: '{{capacity}}'
        HTTP_PORT: '{{http_port}}'
        HEALTH_PORT: '{{health_port}}'
        MODEL_SHA256: '73363ee8c48eb80195f12dbf5958284e0200955251f406118ff50153f8a2111d'
      run: |
        set -e
        # Local deploy: actions run from the solution directory; the preset is
        # rendered in place next to the compose file in assets/.
        CONFIG="assets/config/counting.json"
        if [ ! -f "$CONFIG" ]; then
          echo "$CONFIG not found in $PWD" >&2
          exit 1
        fi
        mkdir -p "$(dirname "$CONFIG")/../data"
        python3 - "$CONFIG" <<'PY'
        import json, os, sys

        path = sys.argv[1]
        with open(path) as handle:
            config = json.load(handle)
        if config.get("schema") != "vb.config/1":
            raise SystemExit(f"{path} is not a vb.config/1 preset")


        def env_int(name, low, high, label):
            raw = os.environ.get(name, "").strip()
            try:
                value = int(raw)
            except ValueError:
                raise SystemExit(f"{label} must be a whole number, got {raw!r}")
            if not low <= value <= high:
                raise SystemExit(f"{label} must be between {low} and {high}, got {value}")
            return value


        site_id = os.environ["SITE_ID"].strip()
        camera_id = os.environ["CAMERA_ID"].strip()
        device_id = f"{site_id}-{camera_id}"
        if len(device_id) > 32:
            raise SystemExit("Site ID + camera ID are too long together; keep them to 31 characters in total")
        mqtt_port = env_int("MQTT_PORT", 1, 65535, "MQTT port")
        http_port = env_int("HTTP_PORT", 1, 65535, "Counter port")
        capacity = env_int("CAPACITY", 0, 100000, "Total spaces")
        rtsp_url = os.environ["RTSP_URL"].strip()
        if not rtsp_url.lower().startswith(("rtsp://", "rtsps://")):
            raise SystemExit("Camera stream URL must start with rtsp://")

        config["device_id"] = device_id
        config["state_dir"] = "/data/edge-parking"
        if os.environ.get("MODEL_SHA256"):
            config.setdefault("backend", {})["model_sha256"] = os.environ["MODEL_SHA256"]
        health = config.setdefault("health", {})
        health["host"] = "0.0.0.0"
        if os.environ.get("HEALTH_PORT"):
            health["port"] = env_int("HEALTH_PORT", 1, 65535, "Status port")

        mqtt = config.setdefault("mqtt", {})
        mqtt["host"] = os.environ["MQTT_HOST"].strip()
        mqtt["port"] = mqtt_port
        mqtt["client_id"] = device_id
        mqtt["username"] = os.environ.get("MQTT_USERNAME", "")
        mqtt["password"] = os.environ.get("MQTT_PASSWORD", "")
        mqtt["topic_root"] = f"{site_id}/parking/{device_id}"

        template = (config.get("streams") or [{}])[0]
        options = dict(template.get("options") or {})
        if os.environ.get("STREAM_CODEC"):
            options["codec"] = os.environ["STREAM_CODEC"]
        config["streams_file"] = ""
        config["streams"] = [{
            "stream_id": camera_id,
            "url": rtsp_url,
            "name": "",
            "transport": template.get("transport", "tcp"),
            "score_threshold": None,
            "options": options,
        }]

        app = config.setdefault("app", {}).setdefault("options", {})
        app["site_id"] = site_id
        app_mqtt = app.setdefault("mqtt", {})
        app_mqtt["host"] = mqtt["host"]
        app_mqtt["port"] = mqtt_port
        app_mqtt["username"] = mqtt["username"]
        app_mqtt["password"] = mqtt["password"]
        app.setdefault("http", {})["port"] = http_port
        app["state_dir"] = "/data/edge-parking"
        counting = app.setdefault("counting", {})
        # Line, entry side and vehicles already inside are set on /counting/editor after
        # deploy; the app keeps them in state_dir (line and entry side in
        # app-options.override.json, vehicles inside in the occupancy state), so a
        # redeploy does not reset them. capacity and the other counting keys below
        # apply on every deploy (the override holds only line / in_side since the
        # 20261009b images). First-start defaults: vertical line through the
        # middle, standard entry side, 0 vehicles inside.
        counting["line"] = {"a": [0.5, 0.05], "b": [0.5, 0.95]}
        counting["in_side"] = "positive"
        counting["capacity"] = capacity
        counting["initial_occupancy"] = 0

        tmp = path + ".tmp"
        with open(tmp, "w") as handle:
            json.dump(config, handle, indent=2, ensure_ascii=False)
            handle.write("\n")
        os.replace(tmp, path)
        print(f"config  = {path}")
        print(f"camera  = {camera_id} -> topics {site_id}/parking/{camera_id}/crossing and /occupancy")
        print(f"line    = {counting['line']} in_side={counting['in_side']}")
        PY
  after:
    - name: Wait for the counting service to start
      name_i18n:
        zh: 等待计数服务启动
      timeout: 130
      ignore_error: false
      env:
        PARKING_HEALTH_PORT: "{{health_port}}"
        PARKING_HEALTH_DEADLINE_SECONDS: "120"
      run: |
        set -e
        python3 - <<'PY'
        import json
        import math
        import os
        import signal
        import time
        import urllib.error
        import urllib.request

        raw_port = os.environ.get("PARKING_HEALTH_PORT", "")
        try:
            port = int(raw_port)
        except (TypeError, ValueError):
            print("Invalid PARKING_HEALTH_PORT: expected an integer", flush=True)
            raise SystemExit(2)
        if not 1 <= port <= 65535:
            print("Invalid PARKING_HEALTH_PORT: expected 1..65535", flush=True)
            raise SystemExit(2)
        try:
            deadline_seconds = float(os.environ.get("PARKING_HEALTH_DEADLINE_SECONDS", "120"))
        except ValueError:
            print("Invalid PARKING_HEALTH_DEADLINE_SECONDS", flush=True)
            raise SystemExit(2)
        if not math.isfinite(deadline_seconds) or deadline_seconds <= 0:
            print("Invalid PARKING_HEALTH_DEADLINE_SECONDS: expected a positive value", flush=True)
            raise SystemExit(2)

        url = f"http://127.0.0.1:{port}/healthz"
        opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
        deadline = time.monotonic() + deadline_seconds
        last_reason = "no response"

        def request_timeout(_signum, _frame):
            raise TimeoutError("request budget expired")

        signal.signal(signal.SIGALRM, request_timeout)
        while time.monotonic() < deadline:
            request_budget = min(2.0, deadline - time.monotonic())
            if request_budget <= 0:
                break
            try:
                request = urllib.request.Request(url, method="GET")
                signal.setitimer(signal.ITIMER_REAL, request_budget)
                with opener.open(request, timeout=request_budget) as response:
                    if response.status != 200:
                        last_reason = f"HTTP {response.status}"
                    else:
                        try:
                            payload = response.read(1024 * 1024 + 1)
                            if len(payload) > 1024 * 1024:
                                last_reason = "HTTP 200 response exceeds 1 MiB"
                                continue
                            body = json.loads(payload.decode("utf-8"))
                        except (UnicodeDecodeError, json.JSONDecodeError):
                            last_reason = "HTTP 200 with non-JSON response"
                        else:
                            if (time.monotonic() < deadline
                                    and isinstance(body, dict)
                                    and body.get("status") == "ok"):
                                print(f"Readiness confirmed at {url}", flush=True)
                                raise SystemExit(0)
                            last_reason = "HTTP 200 JSON status is not ok"
            except urllib.error.HTTPError as error:
                last_reason = f"HTTP {error.code}"
            except (urllib.error.URLError, TimeoutError, OSError) as error:
                last_reason = f"connection error: {error.__class__.__name__}"
            finally:
                signal.setitimer(signal.ITIMER_REAL, 0)
            remaining = deadline - time.monotonic()
            if remaining > 0:
                time.sleep(min(0.5, remaining))

        print(f"Readiness check failed after {deadline_seconds:g}s: {last_reason}", flush=True)
        raise SystemExit(1)
        PY
user_inputs:
  - id: rtsp_url
    name: Camera stream URL
    name_i18n: {zh: 摄像头视频流地址}
    type: text
    required: true
    placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
    description: RTSP address of the entrance camera. Open it in VLC first; a wrong path, user name or password is the most common failure.
    description_i18n: {zh: 出入口摄像头的 RTSP 地址。先用 VLC 打开试一下；路径、用户名或密码写错是最常见的失败原因。}
  - id: mqtt_host
    name: MQTT server address
    name_i18n: {zh: MQTT 服务器地址}
    type: text
    required: true
    placeholder: "192.168.1.50"
    description: IP address or host name of the MQTT server that receives the counts. It must be reachable from this device.
    description_i18n: {zh: 接收计数结果的 MQTT 服务器 IP 或主机名，这台设备必须能连上它。}
  - id: mqtt_port
    name: MQTT port
    name_i18n: {zh: MQTT 端口}
    type: text
    default: "1883"
    required: true
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  - id: mqtt_username
    name: MQTT user name
    name_i18n: {zh: MQTT 用户名}
    type: text
    required: false
    description: Leave empty if the server accepts anonymous connections.
    description_i18n: {zh: 服务器允许匿名连接时留空。}
  - id: mqtt_password
    name: MQTT password
    name_i18n: {zh: MQTT 密码}
    type: password
    required: false
  - id: site_id
    name: Site ID
    name_i18n: {zh: 停车场编号}
    type: text
    default: "demo-lot"
    required: true
    description: First part of every MQTT topic; use one value per car park. Letters, digits, - and _ only, up to 16 characters.
    description_i18n: {zh: 每条 MQTT 主题的第一段，一个停车场用一个值。只能用字母、数字、- 和 _，最多 16 个字符。}
    validation:
      pattern: "^[A-Za-z0-9_-]{1,16}$"
  - id: camera_id
    name: Entrance ID
    name_i18n: {zh: 出入口编号}
    type: text
    default: "gate-a"
    required: true
    description: Names this entrance in topics and events. Letters, digits, - and _ only, up to 15 characters.
    description_i18n: {zh: 在主题和事件里标识这个出入口。只能用字母、数字、- 和 _，最多 15 个字符。}
    validation:
      pattern: "^[A-Za-z0-9_-]{1,15}$"
  - id: capacity
    name: Total spaces
    name_i18n: {zh: 车位总数}
    type: text
    default: "120"
    required: true
    description: Used to report free spaces. Enter 0 if you only need in/out counts.
    description_i18n: {zh: 用来计算剩余车位。只需要进出数量时填 0。}
    validation:
      pattern: "^[0-9]{1,6}$"
  - id: http_port
    name: Counter service port
    name_i18n: {zh: 计数服务端口}
    type: text
    default: "8080"
    required: true
    description: Local port the counting service listens on. Change it only if another program on this device already uses 8080.
    description_i18n: {zh: 计数服务在本机监听的端口。只有这台设备上已有其他程序占用 8080 时才需要修改。}
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  - id: health_port
    name: Status port
    name_i18n: {zh: 状态检查端口}
    type: text
    default: "8099"
    required: true
    description: Port for the service status check. Change it only if another program on this device already uses 8099, and enter the same value in the check step.
    description_i18n: {zh: 服务状态检查使用的端口。只有这台设备上已有其他程序占用 8099 时才需要修改，并在检查步骤里填同一个值。}
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
remote_overrides:
  # Remote deploy: the actions as they run over SSH, with absolute paths
  # under the SSH user's home. A full copy, because remote_overrides.actions
  # replaces the base actions wholesale.
  actions:
    before:
      - name: Check the Jetson module and JetPack version
        name_i18n: {zh: 检查 Jetson 模组与 JetPack 版本}
        ignore_error: false
        run: |
          set -eu
          # The prebuilt TensorRT engines only load on the module/JetPack they were built on.
          want="p3767-0000 p3767-0001 p3767-0003 p3767-0004"
          compat=$(tr '\0' ' ' </proc/device-tree/compatible 2>/dev/null || true)
          rel=$(head -1 /etc/nv_tegra_release 2>/dev/null || true)
          trt=$(dpkg-query -W -f='${Version}' libnvinfer10 2>/dev/null || true)
          echo "module:   ${compat:-unknown}"
          echo "L4T:      ${rel:-unknown}"
          echo "TensorRT: ${trt:-not found}"
          ok=0
          for m in $want; do
            case " $compat " in *" nvidia,$m "*) ok=1 ;; esac
          done
          if [ "$ok" -ne 1 ]; then
            echo "UNSUPPORTED_JETSON_MODULE: this solution runs on Jetson Orin Nano or Orin NX (reComputer J30 / J40); this board reports '${compat:-unknown}'." >&2
            exit 1
          fi
          case "$rel" in
            "# R36 (release), REVISION: 4."*) ;;
            *) echo "UNSUPPORTED_JETPACK: the engines were built on L4T R36.4 (JetPack 6.2); this board reports '${rel:-unknown}'." >&2; exit 1 ;;
          esac
          case "$trt" in
            10.3.*) ;;
            *) echo "UNSUPPORTED_TENSORRT: the engines were built with TensorRT 10.3; this board has '${trt:-none}'." >&2; exit 1 ;;
          esac
          echo "Jetson module and JetPack match the prebuilt engines"
    after_upload:
      - name: Download the vehicle model
        name_i18n: {zh: 下载车辆识别模型}
        timeout: 1800
        run: |
          set -eu
          MODELS_DIR="/home/{{username}}/edge-parking-counting/models"
          BUNDLE="count_vehicle416_orin_nano-9a5b949eab79.tar.gz"
          BUNDLE_SHA="9a5b949eab79792796855acad6f5827b03da2d774fffb16850e7e883f2694b5e"
          URL="https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/count_vehicle416_orin_nano-9a5b949eab79.tar.gz"
          mkdir -p "$MODELS_DIR"
          have_models() {
            echo "73363ee8c48eb80195f12dbf5958284e0200955251f406118ff50153f8a2111d  $MODELS_DIR/vehicle416.fp16.engine" | sha256sum -c - >/dev/null 2>&1 || return 1
          }
          if have_models; then
            echo "Model files already present"
          else
            if ! echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE" | sha256sum -c - >/dev/null 2>&1; then
              # files: 字段在 after_upload 之前放好 bundle；本地部署与不认 files: 的老引擎走这里的下载兜底。
              curl -fSL --retry 3 -o "$MODELS_DIR/$BUNDLE.part" "$URL"
              echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE.part" | sha256sum -c -
              mv -f "$MODELS_DIR/$BUNDLE.part" "$MODELS_DIR/$BUNDLE"
            fi
            tar -xzf "$MODELS_DIR/$BUNDLE" --no-same-owner -C "$MODELS_DIR"
            echo "73363ee8c48eb80195f12dbf5958284e0200955251f406118ff50153f8a2111d  $MODELS_DIR/vehicle416.fp16.engine" | sha256sum -c -
          fi
          ls -l "$MODELS_DIR"
      - name: Write the counting settings
        name_i18n: {zh: 写入计数设置}
        env:
          SITE_ID: '{{site_id}}'
          CAMERA_ID: '{{camera_id}}'
          RTSP_URL: '{{rtsp_url}}'
          MQTT_HOST: '{{mqtt_host}}'
          MQTT_PORT: '{{mqtt_port}}'
          MQTT_USERNAME: '{{mqtt_username}}'
          MQTT_PASSWORD: '{{mqtt_password}}'
          CAPACITY: '{{capacity}}'
          HTTP_PORT: '{{http_port}}'
          HEALTH_PORT: '{{health_port}}'
          MODEL_SHA256: '73363ee8c48eb80195f12dbf5958284e0200955251f406118ff50153f8a2111d'
        run: |
          set -e
          CONFIG=""
          for r in "/home/{{username}}/edge-parking-counting/jetson_counting" "assets"; do
            if [ -f "$r/config/counting.json" ]; then CONFIG="$r/config/counting.json"; break; fi
          done
          if [ -z "$CONFIG" ]; then
            echo "config/counting.json not found (tried /home/{{username}}/edge-parking-counting/jetson_counting and assets)" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$CONFIG")/../data"
          python3 - "$CONFIG" <<'PY'
          import json, os, sys

          path = sys.argv[1]
          with open(path) as handle:
              config = json.load(handle)
          if config.get("schema") != "vb.config/1":
              raise SystemExit(f"{path} is not a vb.config/1 preset")


          def env_int(name, low, high, label):
              raw = os.environ.get(name, "").strip()
              try:
                  value = int(raw)
              except ValueError:
                  raise SystemExit(f"{label} must be a whole number, got {raw!r}")
              if not low <= value <= high:
                  raise SystemExit(f"{label} must be between {low} and {high}, got {value}")
              return value


          site_id = os.environ["SITE_ID"].strip()
          camera_id = os.environ["CAMERA_ID"].strip()
          device_id = f"{site_id}-{camera_id}"
          if len(device_id) > 32:
              raise SystemExit("Site ID + camera ID are too long together; keep them to 31 characters in total")
          mqtt_port = env_int("MQTT_PORT", 1, 65535, "MQTT port")
          http_port = env_int("HTTP_PORT", 1, 65535, "Counter port")
          capacity = env_int("CAPACITY", 0, 100000, "Total spaces")
          rtsp_url = os.environ["RTSP_URL"].strip()
          if not rtsp_url.lower().startswith(("rtsp://", "rtsps://")):
              raise SystemExit("Camera stream URL must start with rtsp://")

          config["device_id"] = device_id
          config["state_dir"] = "/data/edge-parking"
          if os.environ.get("MODEL_SHA256"):
              config.setdefault("backend", {})["model_sha256"] = os.environ["MODEL_SHA256"]
          health = config.setdefault("health", {})
          health["host"] = "0.0.0.0"
          if os.environ.get("HEALTH_PORT"):
              health["port"] = env_int("HEALTH_PORT", 1, 65535, "Status port")

          mqtt = config.setdefault("mqtt", {})
          mqtt["host"] = os.environ["MQTT_HOST"].strip()
          mqtt["port"] = mqtt_port
          mqtt["client_id"] = device_id
          mqtt["username"] = os.environ.get("MQTT_USERNAME", "")
          mqtt["password"] = os.environ.get("MQTT_PASSWORD", "")
          mqtt["topic_root"] = f"{site_id}/parking/{device_id}"

          template = (config.get("streams") or [{}])[0]
          options = dict(template.get("options") or {})
          if os.environ.get("STREAM_CODEC"):
              options["codec"] = os.environ["STREAM_CODEC"]
          config["streams_file"] = ""
          config["streams"] = [{
              "stream_id": camera_id,
              "url": rtsp_url,
              "name": "",
              "transport": template.get("transport", "tcp"),
              "score_threshold": None,
              "options": options,
          }]

          app = config.setdefault("app", {}).setdefault("options", {})
          app["site_id"] = site_id
          app_mqtt = app.setdefault("mqtt", {})
          app_mqtt["host"] = mqtt["host"]
          app_mqtt["port"] = mqtt_port
          app_mqtt["username"] = mqtt["username"]
          app_mqtt["password"] = mqtt["password"]
          app.setdefault("http", {})["port"] = http_port
          app["state_dir"] = "/data/edge-parking"
          counting = app.setdefault("counting", {})
          # Line, entry side and vehicles already inside are set on /counting/editor after
          # deploy; the app keeps them in state_dir (line and entry side in
          # app-options.override.json, vehicles inside in the occupancy state), so a
          # redeploy does not reset them. capacity and the other counting keys below
          # apply on every deploy (the override holds only line / in_side since the
          # 20261009b images). First-start defaults: vertical line through the
          # middle, standard entry side, 0 vehicles inside.
          counting["line"] = {"a": [0.5, 0.05], "b": [0.5, 0.95]}
          counting["in_side"] = "positive"
          counting["capacity"] = capacity
          counting["initial_occupancy"] = 0

          tmp = path + ".tmp"
          with open(tmp, "w") as handle:
              json.dump(config, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          os.replace(tmp, path)
          print(f"config  = {path}")
          print(f"camera  = {camera_id} -> topics {site_id}/parking/{camera_id}/crossing and /occupancy")
          print(f"line    = {counting['line']} in_side={counting['in_side']}")
          PY
    after:
      - name: Wait for the counting service to start
        name_i18n:
          zh: 等待计数服务启动
        timeout: 130
        ignore_error: false
        env:
          PARKING_HEALTH_PORT: "{{health_port}}"
          PARKING_HEALTH_DEADLINE_SECONDS: "120"
        run: |
          set -e
          python3 - <<'PY'
          import json
          import math
          import os
          import signal
          import time
          import urllib.error
          import urllib.request

          raw_port = os.environ.get("PARKING_HEALTH_PORT", "")
          try:
              port = int(raw_port)
          except (TypeError, ValueError):
              print("Invalid PARKING_HEALTH_PORT: expected an integer", flush=True)
              raise SystemExit(2)
          if not 1 <= port <= 65535:
              print("Invalid PARKING_HEALTH_PORT: expected 1..65535", flush=True)
              raise SystemExit(2)
          try:
              deadline_seconds = float(os.environ.get("PARKING_HEALTH_DEADLINE_SECONDS", "120"))
          except ValueError:
              print("Invalid PARKING_HEALTH_DEADLINE_SECONDS", flush=True)
              raise SystemExit(2)
          if not math.isfinite(deadline_seconds) or deadline_seconds <= 0:
              print("Invalid PARKING_HEALTH_DEADLINE_SECONDS: expected a positive value", flush=True)
              raise SystemExit(2)

          url = f"http://127.0.0.1:{port}/healthz"
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          deadline = time.monotonic() + deadline_seconds
          last_reason = "no response"

          def request_timeout(_signum, _frame):
              raise TimeoutError("request budget expired")

          signal.signal(signal.SIGALRM, request_timeout)
          while time.monotonic() < deadline:
              request_budget = min(2.0, deadline - time.monotonic())
              if request_budget <= 0:
                  break
              try:
                  request = urllib.request.Request(url, method="GET")
                  signal.setitimer(signal.ITIMER_REAL, request_budget)
                  with opener.open(request, timeout=request_budget) as response:
                      if response.status != 200:
                          last_reason = f"HTTP {response.status}"
                      else:
                          try:
                              payload = response.read(1024 * 1024 + 1)
                              if len(payload) > 1024 * 1024:
                                  last_reason = "HTTP 200 response exceeds 1 MiB"
                                  continue
                              body = json.loads(payload.decode("utf-8"))
                          except (UnicodeDecodeError, json.JSONDecodeError):
                              last_reason = "HTTP 200 with non-JSON response"
                          else:
                              if (time.monotonic() < deadline
                                      and isinstance(body, dict)
                                      and body.get("status") == "ok"):
                                  print(f"Readiness confirmed at {url}", flush=True)
                                  raise SystemExit(0)
                              last_reason = "HTTP 200 JSON status is not ok"
              except urllib.error.HTTPError as error:
                  last_reason = f"HTTP {error.code}"
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  last_reason = f"connection error: {error.__class__.__name__}"
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
              remaining = deadline - time.monotonic()
              if remaining > 0:
                  time.sleep(min(0.5, remaining))

          print(f"Readiness check failed after {deadline_seconds:g}s: {last_reason}", flush=True)
          raise SystemExit(1)
          PY
  environment:
    PARKING_MODELS_DIR: "/home/{{username}}/edge-parking-counting/models"
    PARKING_HEALTH_PORT: "{{health_port}}"
