version: "1.0"
id: health_verify_rk
name: Verify RK parking health
name_i18n: {zh: 验证 RK 停车服务健康状态}
type: http_debug
http_debug:
  endpoints:
    - id: healthz
      name: Native RK health endpoint
      name_i18n: {zh: 原生 RK 健康端点}
      url_template: http://{{host}}:8099/healthz
      expected_status: 200
user_inputs:
  - id: host
    name: RK host
    name_i18n: {zh: RK 主机地址}
    type: text
    required: true
