version: "1.0"
id: speech_deploy
name: Speech Service
type: docker_deploy

# Single source-of-truth device YAML. Backend derives docker_local and
# docker_remote views via derive_docker_views().
#
# device_class=jetson injects the shared iptables raw-table workaround
# (scope=remote, ignore_error=false) and /etc/nv_tegra_release detection
# probe from devices/profiles/jetson.yaml. The legacy speech.yaml hand-
# wrote an iptables fix named "JetPack 6.2" — byte-equivalent to the
# profile's "6.x" entry — and is removed here in favour of the profile.
device_class: jetson

docker:
  compose_file: assets/docker/speech/docker-compose.yml
  options:
    project_name: reachy-jetson-voice
  environment:
    OVS_PROFILE: "jetson-edgellm-v090-moss"
    LANGUAGE_MODE: "multilanguage"
  services:
    - name: speech
      port: 8621
      health_check_endpoint: /health
      required: true

ssh:
  port: 22
  default_user: recomputer

pre_checks:
  - type: disk_space
    min_gb: 10
    description: At least 10GB for speech service Docker image

post_deployment:
  open_browser: true
  url: http://localhost:8621

name_i18n:
  zh: 语音服务

remote_overrides:
  remote_path: /home/{{username}}/reachy-jetson-voice
  compose_dir: assets/docker/speech
  detection:
    method: network_scan
    manual_entry: true
  environment:
    OVS_PROFILE: "{{OVS_PROFILE}}"
    LANGUAGE_MODE: "multilanguage"
  pre_checks:
    - type: disk_space
      min_gb: 3
      description: At least 3GB for speech service Docker image
  post_deployment:
    open_browser: false
  user_inputs:
    - id: host
      name: Device IP
      type: text
      required: true
      name_i18n:
        zh: 设备 IP
    - id: username
      name: SSH Username
      type: text
      default: recomputer
      required: true
      name_i18n:
        zh: SSH 用户名
    - id: password
      name: SSH Password
      type: password
      required: true
      name_i18n:
        zh: SSH 密码
    - id: OVS_PROFILE
      name: Speech Profile (ASR + TTS)
      type: select
      default: "jetson-edgellm-v090-moss"
      reconfigurable: true
      description: "ASR + TTS engine combination on the v0.9.0 voice stack. Qwen3 ASR is multilingual (Chinese + English); MOSS-TTS-Nano gives the most natural, expressive voice (default voice: Yuewen)."
      options:
        - value: "jetson-edgellm-v090-moss"
          label: "Qwen3 ASR + MOSS-TTS-Nano (Yuewen voice)"
          label_i18n:
            zh: "Qwen3 ASR + MOSS-TTS-Nano（Yuewen 音色）"
      name_i18n:
        zh: 语音方案（ASR + TTS）
      description_i18n:
        zh: "v0.9.0 语音栈的 ASR + TTS 引擎组合。Qwen3 ASR 多语种（中文 + 英文）；MOSS-TTS-Nano 音色最自然、表现力最强（默认音色 Yuewen）。"
      default_i18n:
        zh: "jetson-edgellm-v090-moss"
