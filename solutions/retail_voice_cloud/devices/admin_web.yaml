version: "1.0"
id: admin_web
name: Open the Admin Console
name_i18n:
  zh: 打开管理后台
type: web_dashboard
inherit_host_from: cloud_stack

# 用 web_dashboard 而不是 preview：这套链路的输出是转写文本与库里的记录，
# 没有逐帧画面可叠加渲染，voice-web 自己那套页面已经把它渲染好了。
# host 复用部署步骤填的栈主机地址，用户不用再填一遍。

web_dashboard:
  url: "http://{{deploy.host}}:3000/"
  title: Voice Admin Console
  description: >-
    Log in with the account you created on the stack host. Recordings shows the
    redacted transcripts — the original text is never written to the database,
    so what is on screen is all there is. Deletion and export are admin-only.
  description_i18n:
    zh: >-
      用你在栈主机上创建的账号登录。「录音」页显示的是脱敏后的转写——
      原文从不写进数据库，屏幕上看到的就是系统里全部的内容。删除与导出仅 admin 可用。
