version: "1.0"
id: recamera_pro_eldercare
name: Deploy Eldercare Monitor App
name_i18n:
  zh: 部署居家看护应用
type: recamera_pro_app

recamera_pro_app:
  app_id: eldercare-monitor
  package: https://sensecraft-statics.seeed.cc/solution-app/eldercare_safety/eldercare-monitor-0.1.5-arm64.tar.gz
  signature: https://sensecraft-statics.seeed.cc/solution-app/eldercare_safety/eldercare-monitor-0.1.5-arm64.tar.gz.sig
  activation_timeout: 90
  config:
    output_channels: ["ws"]
  config_when:
    - when_present: mqtt_host
      config:
        output_channels: ["ws", "mqtt"]
        dMqtt:
          sURL: "{{mqtt_host}}"
          iPort: "{{mqtt_port}}"
          sTopic: "{{device_name}}"
          sUsername: "{{mqtt_username}}"
          sPassword: "{{mqtt_password}}"
          sClientId: "recamera-pro-eldercare"

ssh:
  port: 443
  default_user: admin
  connection_timeout: 30

post_deployment:
  open_browser: false

user_inputs:
  - id: device_name
    name: Device Name
    name_i18n:
      zh: 设备名称
    type: text
    default: "eldercare_camera"
    required: true
    description: Unique identifier for this camera used in alert topics and telemetry
    description_i18n:
      zh: 设备唯一标识，将作为告警与遥测 MQTT 主题的前缀
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
  - id: mqtt_host
    name: MQTT Broker Host (Optional)
    name_i18n:
      zh: MQTT 服务器地址（可选）
    type: text
    required: false
    placeholder: "192.168.1.50"
    description: Leave empty to only view alerts on the device web page. Fill in to forward fall and voice alert events to Home Assistant or IoT gateway.
    description_i18n:
      zh: 留空则仅在设备自带 Web 页面查看告警；填入地址可将跌倒与语音求助告警实时推送到 Home Assistant 或物联网平台。
  - id: mqtt_port
    name: MQTT Port
    name_i18n:
      zh: MQTT 端口
    type: text
    default: "1883"
    required: true
  - id: mqtt_username
    name: MQTT Username
    name_i18n:
      zh: MQTT 用户名
    type: text
    required: false
    description: Leave empty for anonymous connection
    description_i18n:
      zh: 匿名连接时可留空
  - id: mqtt_password
    name: MQTT Password
    name_i18n:
      zh: MQTT 密码
    type: password
    required: false
