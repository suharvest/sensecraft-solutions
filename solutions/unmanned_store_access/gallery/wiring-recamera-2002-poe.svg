<circle class="p" cx="380" cy="240" r="5"/>
<text class="t s" x="394" y="244">GND</text>
<line class="w" x1="280" y1="240" x2="380" y2="240"/>
<text class="t s" x="546" y="184" text-anchor="end">COM</text>
<circle class="p" cx="560" cy="180" r="5"/>
<circle class="p" cx="660" cy="180" r="5"/>
<line class="w" x1="560" y1="180" x2="660" y2="180"/>
<text class="t s" x="546" y="224" text-anchor="end">NO</text>
<circle class="p" cx="560" cy="220" r="5"/>
<circle class="p" cx="660" cy="220" r="5"/>
<line class="w" x1="560" y1="220" x2="660" y2="220"/>
<text class="t s" x="676" y="184">开门输入 1 / Unlock input 1</text>
<text class="t s" x="676" y="224">开门输入 2 / Unlock input 2</text>
<text class="t m" x="470" y="268" text-anchor="middle">Fail-safe maglock: COM/NC</text>
<text class="t m" x="765" y="268" text-anchor="middle">断电开电磁锁接 COM/NC</text>
<text class="t h" x="30" y="36">reCamera 2002 HQ PoE → Relay → Door controller</text>
<text class="t m" x="30" y="320">排针只有 GND / GPIO488 / GPIO487 / TX / GPIO490 / RX，没有供电脚；电平未文档化，接线前用万用表确认</text>
<text class="t m" x="30" y="344">The header carries GND / GPIO488 / GPIO487 / TX / GPIO490 / RX and no supply pin; power the relay from a separate 3.3–5V supply sharing GND</text>
