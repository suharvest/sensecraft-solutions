<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="reCamera 2002 HQ PoE → Relay → Door controller">
<title>reCamera 2002 HQ PoE → Relay → Door controller</title>
<style>.b{fill:#fff;stroke:#1f2733;stroke-width:2}.p{fill:#1f2733}.w{stroke:#1f2733;stroke-width:2.5;fill:none}.t{font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2733}.h{font-size:17px;font-weight:600}.s{font-size:13px}.m{font-size:12px;fill:#5b6472}</style>
<rect x="0" y="0" width="900" height="380" fill="#fff"/>
<rect class="b" x="30" y="60" width="250" height="220" rx="8"/>
<text class="t h" x="155" y="92" text-anchor="middle">reCamera 2002 HQ PoE</text>
