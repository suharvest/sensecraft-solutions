# Door-side stack for P2 (reComputer Industrial J20) and P3 (J30/J40/R2000 or a
# standard reCamera). Copied from the upstream skeleton
# platforms/compose/docker-compose.yml (unmanned-store-access @ 95f314a) with
# the `web` service removed — the console runs on the cloud host, once, not on
# every door.
#
# BOTH IMAGES ARE PUBLISHED.
#
#   face-rec-api  The upstream recognition service, published 2026-09-08 as
#                 solution/face-rec-api:0.1.1-usa-jetson (linux/arm64, built
#                 from face_rec_api Dockerfile.jetson-usa). The default below is
#                 a DIGEST, not a tag, and that is deliberate: two doors running
#                 the same tag but different digests would hold embeddings that
#                 are not comparable, and the failure shows up as people not
#                 being recognised rather than as a version mismatch.
#                 FACE_REC_API_IMAGE still overrides it, for a site that pins a
#                 different build.
#                 The image carries no weights. TensorRT engines are JetPack +
#                 SM specific and the InsightFace-derived weights are under a
#                 non-commercial licence, so both stay on the host and are bind
#                 mounted at /models. 0.1.1 builds the engines from the mounted
#                 ONNX on first start (scripts/build_engine.py, run by the
#                 entrypoint); 0.1.0 could not — it had neither the weights nor
#                 a builder, and the container died on `detector engine not
#                 found`.
#                 CUDA / TensorRT libs and the TensorRT Python bindings come
#                 from the host JetPack install, so the container needs
#                 `runtime: nvidia` and the four host mounts below. Each one was
#                 established by an error: no tensorrt module, then
#                 libnvinfer.so.10, then libcudla.so.1
#                 (unmanned-store-access evaluation/runs/2026-09-08-orin-nx-acceptance-2).
#   access-node   This project's own device-side process, published as
#                 solution/unmanned-store-access-node:0.1.1 for linux/amd64 and
#                 linux/arm64. It reads the access-node.json in ../edge/config,
#                 pulls RTSP, asks face-rec-api for an embedding and a liveness
#                 score, decides locally, and pulses a dry-contact relay. The
#                 command plane, the versioned face database and the local
#                 hash-chained audit log run in the same process.
#                 It carries no weights: recognition and liveness both happen in
#                 face-rec-api, and access-node only matches against the face
#                 database version it has on disk.
#                 ACCESS_NODE_IMAGE overrides the default, for a site that pins
#                 a digest or runs its own build.
#
# Service boundaries, which are also the security boundaries: face-rec-api only
# produces embeddings and a liveness score; access-node makes every decision and
# owns the actuator; nothing else may write to the door.

name: unmanned-store-access-edge

x-logging: &bounded_logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  face-rec-api:
    image: ${FACE_REC_API_IMAGE:-sensecraft-missionpack.seeed.cn/solution/face-rec-api@sha256:0b0f37e2b170194f3e5b0577b6cd18ef6565143b7e637bd5d0ffb383aec0d5a1}
    container_name: usa-face-rec-api
    restart: unless-stopped
    <<: *bounded_logs
    runtime: nvidia
    ports: ["18080:8080"]
    volumes:
      # The weights and the engines built from them. MODELS_DIR must hold an
      # onnx/ subdirectory with scrfd_10g.onnx and arcface_mobilefacenet.onnx;
      # the deploy step downloads them there.
      - ${MODELS_DIR:-/opt/usa/models}:/models
      # The TensorRT Python bindings. They are part of JetPack and cannot be
      # pip-installed, so the host copy is mounted onto the container's
      # site-packages. Mount the bindings directory itself, not the whole host
      # dist-packages — that would drop a full set of host-built packages onto
      # the container's import path.
      - ${TRT_PYTHON_DIR:-/usr/lib/python3.10/dist-packages/tensorrt}:/usr/local/lib/python3.10/dist-packages/tensorrt:ro
      # libnvinfer / libnvdla_compiler / the Tegra stack.
      - /usr/lib/aarch64-linux-gnu:/opt/host-libs:ro
      # libcudla.so.1 lives here, not in /usr/lib/aarch64-linux-gnu.
      - ${CUDA_TARGET_LIB:-/usr/local/cuda/targets/aarch64-linux/lib}:/opt/host-cuda-libs:ro
    environment:
      LD_LIBRARY_PATH: /opt/host-libs:/opt/host-cuda-libs:/usr/local/cuda/lib64:/usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu
    healthcheck:
      # The adapter demands /health.liveness == "loaded" at startup. Upstream
      # silently degrades to "keep recognising, skip liveness" when the model
      # file is missing; for a door that degradation is an open door, so the
      # adapter refuses to start instead.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start builds three TensorRT engines from ONNX before uvicorn
      # binds the port. Measured on a reComputer J4012 (L4T R36.4.3, TensorRT
      # 10.3, sm=87): detector 61 s, embedder 62 s, liveness 73 s, /health
      # answering 214 s after `docker run`. Later starts reuse the cached
      # engines and skip the build.
      # Without a start_period the healthcheck fails three times during that
      # build and access-node's service_healthy dependency gives up.
      start_period: ${FACE_REC_START_PERIOD:-900s}

  access-node:
    image: ${ACCESS_NODE_IMAGE:-sensecraft-missionpack.seeed.cn/solution/unmanned-store-access-node:0.1.1}
    container_name: usa-access-node
    restart: unless-stopped
    <<: *bounded_logs
    depends_on:
      face-rec-api:
        condition: service_healthy
    # The door actuator is a sysfs GPIO, an opto-isolated DO, or a libgpiod
    # character device on the host.
    #
    # Which one depends on the kernel, not on preference: Tegra 5.15 (JetPack 6,
    # reComputer J30/J40) does not export /sys/class/gpio at all — the directory
    # does not exist, and binding it fails the container outright. Those hosts
    # set GPIO_SYSFS_DIR to an empty directory and drive the door through
    # /dev/gpiochipN with actuator.backend = "libgpiod" instead. The 4.9/5.10
    # kernels (J20, reCamera) keep the sysfs default below.
    #
    # Mounting all of /sys is not acceptable here and not necessary: bind only
    # the gpio class.
    devices:
      - ${GPIO_CHARDEV:-/dev/gpiochip0}:${GPIO_CHARDEV:-/dev/gpiochip0}
    volumes:
      - ${GPIO_SYSFS_DIR:-/sys/class/gpio}:/sys/class/gpio
      - facedb:/var/lib/unmanned-store-access/facedb
      - audit:/var/lib/unmanned-store-access/audit
      - ./config/access-node.json:/etc/unmanned-store-access/access-node.json:ro
      # The pin lock and owner marker (core_access/pinlock.py). Bind it from the
      # host so a device agent running outside the container holds the SAME lock
      # on the same pin — two processes pulsing one door relay is either a
      # duplicate deployment or a pin misassignment, and the node refuses to
      # start rather than fight over the contact.
      - /run/unmanned-store-access:/run/unmanned-store-access
    environment:
      USA_CONFIG: /etc/unmanned-store-access/access-node.json
      USA_FACE_REC_API: http://face-rec-api:8080
      USA_MQTT_HOST: ${MQTT_HOST:?set MQTT_HOST}
      USA_MQTT_PORT: ${MQTT_PORT:-8883}
      USA_MQTT_TLS: ${MQTT_TLS:-1}
      USA_DEVICE_ID: ${DEVICE_ID:?set DEVICE_ID}
      USA_DOOR_ID: ${DOOR_ID:-front}
      # The RTSP URL the wizard asked for. It is also written into
      # config/access-node.json; the environment wins because the orchestration
      # layer is newer than the template.
      USA_RTSP_URL: ${RTSP_URL:?set RTSP_URL}
      USA_FACEDB_URL: ${FACEDB_URL:?set FACEDB_URL}
    healthcheck:
      # /readyz, not /healthz. Liveness ("is the process up") is almost always
      # 200 and restarting on a degraded upstream only loses the events the
      # restart drops. Readiness is the one that answers "can this door be
      # opened by a face right now": face-rec-api reachable with liveness
      # loaded, camera streaming, face database non-empty, pin lock held.
      test: ["CMD", "access-node", "healthcheck",
             "--url", "http://127.0.0.1:8099/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  facedb:
  audit:
