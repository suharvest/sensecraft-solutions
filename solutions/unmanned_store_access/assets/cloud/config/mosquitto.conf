# Bench broker configuration — anonymous, plaintext, single listener.
#
# THIS IS NOT A PRODUCTION CONFIGURATION. `access/v1/commands/{door_id}` is an
# unlock channel; a broker that accepts anonymous publishes on it means anyone
# who can reach port 1883 can open the door. The design spec requires TLS,
# per-device identities and topic ACLs, and none of the three is here.
#
# To make this deployable, replace the two `allow_anonymous`/`listener` lines
# with a TLS listener on 8883, a `password_file`, and an `acl_file` that gives
# each door device write access to its own events/status/receipts topics and
# read access only to its own commands topic. Then set MQTT_PORT=8883 and
# MQTT_TLS=1 for the console and every device.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Retained messages matter here and must survive a broker restart: the status
# topic's last-will is retained so a console that subscribes late still sees a
# dropped device as offline. The commands topic is never retained.
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
