      caption_i18n:
        zh: 办公区里两个人朝镜头走来——绿框是人脸模板判定为已登记的人，红框是判定为未登记的人。两个判定都由 reCamera Pro 离线跑一段素材视频得到；这里展示的只是人脸匹配这一步，不是门禁放行判定，也不是门口现场实拍
    - type: image
      src: gallery/console-devices-live.png
      caption: The management console listing a live reCamera PoE unit — active face-library version and heartbeat per device
      caption_i18n:
