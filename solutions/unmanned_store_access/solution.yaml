# Unmanned store face access. Upstream repo: ~/project/unmanned-store-access
# (HEAD 95f314a at packaging time). Design spec: seeed-solutions-hub
# docs/specs/f1-unmanned-store-access-spec.md.
#
# NO DOOR HAS BEEN OPENED BY ANY OF THIS. The upstream milestone is C1 — a pure
# software loop on a macOS development machine with a FakeActuator, an
# in-memory MQTT broker and a FakeRecognizer. Six of the seven boundary files
# in evaluation/runs/2026-09-06-c1-software/ carry `status: pending` with every
# tier empty; the seventh holds loopback timings that must not be read as
# device-side numbers. No preset carries `verified:`, and none may until the
# C2 hardware pass records GPIO/DO voltage, current, polarity, relay trigger
# and lock action.
#
# Two exceptions, and only two. First, P1 / reCamera Pro: the whole library
# distribution path ran on real hardware at 192.168.3.53 on 2026-09-07 — the
# consistency gate reported problems: [], full activation measured 62.2 ms (v1)
# and 45.4 ms (v2) end to end including download, per-file SHA, HMAC signature
# check, atomic current switch, gallery write and the loopback op:reload ack;
# an up-to-date no-op round took 6.2 ms. A version with one byte changed in
# gallery.json and a manifest signed with the wrong key were both rejected on
# the device, which stayed on the previous version. Recognition event to GPIO
# pin readback measured n=22, p50 1.448 ms / p95 2.709 ms — but the input was
# injected synthetic recognition events, not a person, the readback is sysfs so
# the values are an upper bound, and no external circuit was ever connected.
# Source: unmanned-store-access evaluation/runs/2026-09-07-recamera-pro-p1/.
# The thresholds remain uncalibrated (calibration = pending) and gpio130's
# physical identity, level and available current are still unmeasured, so P1 is
# "software verified on real hardware", not a door acceptance.
#
# Second: the face library distribution path has run on a
# standard reCamera at 192.168.42.1 across two probe runs — poll, Range
# download, per-file SHA, manifest signature, atomic switch, gallery write and
# reload ack, plus resume after an interrupted download and rejection of a
# version that does not verify. Full activation measured p50 491.6 ms / p95
# 507.8 ms over 20 runs on a 2-person, 16.5 KB library. Source:
# evaluation/runs/2026-09-06-recamera-std-p3-r2/results.md. Both are library
# numbers, not door numbers.
#
# reCamera PoE (standard SG2002 firmware plus a baseboard header GPIO) is
# covered as a second door option under P1. Its device-side code is self-tested
# only — nothing about it has been on hardware, so every PoE figure in this
# package reads "pending hardware".
# Recognition, liveness and any recognition-to-relay latency remain unmeasured:
# nobody stood in front of the lens during either run (each run sampled 220
# frames, all reading face_count: 0 — see
# evaluation/runs/2026-09-06-recamera-std-p3/results.md and
# evaluation/runs/2026-09-06-recamera-std-p3-r2/results.md).
#
# LICENCE, in one line so nobody has to go looking: the face detection and
# embedding weights (InsightFace buffalo_l) are NON-COMMERCIAL. They are not
# redistributed here, and a commercial deployment must replace the backbone and
# rebuild every face library version. See gallery/ATTRIBUTION.md and the
# licensing section of the description.
#
# SAFETY, likewise: the lock is always behind a relay or dry contact on its own
# 12/24 V supply. active_high, pulse_ms, relay_contact and fail_mode are
# configured per installation and deliberately have no defaults — a fail-safe
# magnetic lock wired to the normally-open contact stands open permanently.
version: "1.0"
id: unmanned_store_access
name: Unmanned Store Face Access
name_i18n:
  zh: 无人门店人脸门禁

intro:
  summary: >-
    Recognise a face at the door, require passive liveness, check the person,
    schedule and blocklist, and pulse a relay that switches an independently
    powered lock — with the face library versioned in the cloud, pulled over
    HTTP with SHA and signature checks, and every decision written to a
    hash-chained audit log.
  summary_i18n:
    zh: >-
      门口识别人脸，强制通过静默活体，再核对人员、时段与黑名单，最后给继电器
      一个脉冲去切换独立供电的门锁——人脸库在云端版本化，设备走 HTTP 拉取并校验
      SHA 与签名，每一次判定都写进带哈希链的审计日志。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/architecture.svg
  gallery:
    - type: image
      src: gallery/architecture.svg
      caption: Cloud face library and console above the presets — every one of them ends at a relay and a lock on its own supply
      caption_i18n:
        zh: 上方是云端人脸库与管理界面，下方是各个套餐——每一个都终结于继电器和独立供电的门锁
    - type: image
      src: gallery/ui-events.png
      caption: Access events with the decision reason and the audit chain hash. Synthetic demo data — the people, scores and events are fixtures, not field results
      caption_i18n:
        zh: 门禁事件列表，带判定原因与审计链哈希。合成演示数据——人员、分数与事件都是测试夹具，不是现场结果
    - type: image
      src: gallery/ui-persons.png
      caption: The person library — enrol from 3–8 images, delete with a barrier, roll back only where the barrier allows. Synthetic demo data; no face image was enrolled
      caption_i18n:
        zh: 人员库——3–8 张图注册、删除写入屏障、回滚受屏障约束。合成演示数据，没有注册过任何真实人脸
    - type: image
      src: gallery/ui-devices.png
      caption: Device status and remote unlock, with the receipt that comes back. Synthetic demo data; the offline device is a replayed retained LWT
      caption_i18n:
        zh: 设备状态与远程开门，以及回来的回执。合成演示数据；显示离线的设备是回放的 retained LWT
  category: sensing
  solution_type: solution
  tags:
    - access-control
    - face-recognition
    - liveness
    - anti-spoofing
    - mqtt
    - relay
    - unmanned-store
    - audit-log

  output_interfaces:
    - type: mqtt
      port: 8883
      topic: access/v1/events
      description: >-
        One JSON message per recognition decision — allowed and denied alike.
        Carries the event id, the corrected timestamp, the device, the person
        or anonymous id, the similarity score, the liveness block, the decision
        with its reason, the door action taken, the actuator id, the face
        library version and the model sha. `facedb_version` is null before the
        first successful sync — that is "no library at all", which is a
        different thing from version 0 and is reported as the distinct denial
        reason `no_facedb`.
      schema_type: json
      payload_example: '{"schema":"access-event/v1","event_id":"6f1a2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d","time":"2026-09-06T03:20:11Z","device_id":"door-front-01","person_id":"p_alice","anonymous_id":null,"score":0.7412,"threshold":0.62,"liveness":{"passed":true,"score":0.958},"decision":{"allow":true,"reason":"allowed"},"door_action":"pulse","actuator_id":"door-front","facedb_version":3,"model_sha":"3a7f...","clock":{"valid":true,"reason":null,"offset_ms":12}}'
      description_i18n:
        zh: >-
          每一次识别判定一条 JSON——放行与拒绝都发。内容包括事件 id、经修正的时间戳、
          设备、人员或匿名 id、相似度分数、活体块、带原因的判定、执行的门控动作、
          执行器 id、人脸库版本与模型 sha。首次同步成功之前 `facedb_version` 是
          null——那是"根本没有库"，与版本 0 不是一回事，会以单独的拒绝原因
          `no_facedb` 上报。
    - type: mqtt
      port: 8883
      topic: access/v1/commands/{door_id}
      description: >-
        Remote unlock, hold-open and lock. The gate is strict: an exact field
        set, a UUIDv4 command id, an RFC3339 `issued_at` with a timezone, a TTL
        bound, and a per-identity replay table. A redelivered command does not
        open the door a second time — it replays the original receipt, so the
        caller still gets something to reconcile against. Never retained: a
        retained unlock would replay on every reconnect.
      schema_type: json
      payload_example: '{"command_id":"6f1a2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d","door_id":"door-front","action":"unlock","params":{"pulse_ms":1500},"issued_at":"2026-09-06T03:20:11Z","ttl":30,"identity":"console-operator"}'
      description_i18n:
        zh: >-
          远程开门、常开与锁定。闸门是严格的：字段集必须精确匹配、command_id 必须是
          UUIDv4、`issued_at` 必须是带时区的 RFC3339、TTL 有上界，并有按身份隔离的
          重放表。重复投递不会第二次开门——它回放原来那张回执，调用方仍拿得到可对账的
          凭据。绝不 retained：retained 的开门指令会在每次重连时重放一遍。
    - type: mqtt
      port: 8883
      topic: access/v1/status/{device_id}
      description: >-
        A 30-second heartbeat plus a retained last-will. The payload carries the
        actuator health, the face library version and model tag, and whether
        liveness is loaded. The last will is retained and says offline, so a
        console that subscribes after a device drops still sees it as down
        rather than as never-seen.
      schema_type: json
      description_i18n:
        zh: >-
          30 秒心跳加一条 retained 遗嘱。载荷带执行器健康、人脸库版本与 model tag，
          以及活体是否已加载。遗嘱是 retained 的离线状态，因此设备掉线之后才订阅的
          控制台看到的是"已离线"，而不是"从没见过这台设备"。
    - type: http
      port: 8080
      endpoint: /v1/facedb/current, /v1/facedb/{version}
      description: >-
        The whole face library distribution surface — two endpoints, no MQTT
        push. Devices poll `current`, compare the version, and only then fetch
        files, with `Range` for chunked and resumable downloads. Activation
        latency therefore equals the poll period (30 s by default); that is the
        price paid for a device side that needs nothing but an HTTP client, and
        for never having a "notification lost but library changed" state.
      schema_type: json
      description_i18n:
        zh: >-
          人脸库下发的全部接口——两条，没有 MQTT 推送。设备轮询 `current` 比对版本，
          变了才取文件，分块与断点续传走标准 `Range`。因此激活时延等于轮询周期
          （默认 30 s）；换来的是设备侧只需要一个 HTTP 客户端，也不存在"通知丢了
          但库已经变了"的不一致态。
    - type: http
      port: 8088
      endpoint: /api/events, /api/devices, /api/persons, /api/audit/verify
      description: >-
        The management console's API behind a shared-token gate with three
        roles — viewer reads, operator issues unlock/hold_open/lock, admin
        enrols, deletes and rolls back. There is no anonymous read, and the
        service refuses to start with no token configured. A shared token over
        plain HTTP is not authentication: terminate TLS in front of it.
      schema_type: json
      description_i18n:
        zh: >-
          管理界面的 API，走共享 token 闸门，三档角色——viewer 只读，operator 可下发
          unlock / hold_open / lock，admin 可注册、删除与回滚。没有匿名读，一个 token
          都没配时服务直接拒绝启动。共享 token 走明文 HTTP 等于没有鉴权，必须在
          反代后面终止 TLS。
    - type: dry_contact
      port: null
      endpoint: 'COM / NO (NC on the SPDT alternative)'
      description: >-
        The physical output of every preset: a relay's mechanical contact, not
        a voltage. Idle, mid-pulse and powered-off all read 0 V across
        `COM`/`NO` on a meter — nothing on this side is ever driven or
        pulled. A door controller wires its own input across those two
        terminals; whoever owns that controller decides what a momentary
        closure does, and the lock, the lock's supply and the controller
        itself are outside this design's BOM. `relay_contact` (`NO`/`NC`) and
        `fail_mode` describe the state of this contact and of the
        controller's input, not the lock, and neither has a default.
      schema_type: null
      description_i18n:
        zh: >-
          每个套餐真正对外的物理输出：一个继电器的机械触点，不是一路电压。
          空闲、脉冲中、掉电三种状态，用万用表量 `COM`/`NO` 都读到 0
          V——这一侧从不被我们驱动或拉低。门控控制器把自己的输入接到这两个端子上，
          瞬时闭合之后怎么动作由控制器的所有者决定；锁、锁电源与门控控制器本身
          都不在本方案 BOM 内。`relay_contact`（`NO`/`NC`）与 `fail_mode`
          描述的是这个触点与门控输入端的状态，不是锁，因此都不设默认值。

  input_requirements:
    - type: rtsp
      description: >-
        A camera at the door at roughly face height, framed so one face fills a
        usable part of the frame at the distance people actually stop. P1 uses
        the reCamera's own sensor; P2 and P3 accept any RTSP stream; P4 uses
        the Grove Vision AI V2's sensor. Backlit doorways and glass reflections
        are the usual failure modes and have not been characterised.
      required: true
      description_i18n:
        zh: >-
          门口一台大致齐面部高度的摄像头，取景要让人真正停下来的距离上，单张人脸
          在画面里占到可用比例。P1 用 reCamera 自带传感器；P2 / P3 接任意 RTSP 流；
          P4 用 Grove Vision AI V2 的传感器。逆光门口与玻璃反光是常见失效模式，
          本方案没有刻画过它们的边界。
    - type: other
      description: >-
        A relay module (see `output_interfaces` type `dry_contact`) between
        the compute board's GPIO/DO and a door controller of the site's own
        choosing. This design's BOM ends at the relay's `COM`/`NO` contact —
        the door controller, the lock and the lock's supply are not part of
        it and are not substitutable with a GPIO pin: a lock draws 300 mA to
        1 A, while a GPIO pin or an opto-isolated DO carries milliamps.
      required: true
      description_i18n:
        zh: >-
          一个继电器模块（见 `output_interfaces` 里 `dry_contact` 那一条），
          接在计算板的 GPIO/DO 与现场自选的门控控制器之间。本方案的 BOM 到继电器的
          `COM`/`NO` 触点为止——门控控制器、锁与锁电源都不在其中，也不能用 GPIO
          引脚替代：锁的工作电流 300 mA–1 A，而 GPIO 引脚和光隔 DO 只有 mA 级。
    - type: other
      description: >-
        A host for the cloud side — the face library server, the management
        console and an MQTT broker. Any amd64 or arm64 Linux box with Docker
        works; it does not need a GPU. It must be reachable from every door
        device, and its clock must be right, because devices with no RTC take
        their time correction from its HTTP `Date` header.
      required: true
      description_i18n:
        zh: >-
          一台承载云端的主机——人脸库服务、管理界面与 MQTT broker。任意装了 Docker 的
          amd64 或 arm64 Linux 机器都行，不需要 GPU。它必须对每一台门口设备可达，
          并且自身时钟必须准确——没有 RTC 的设备靠它的 HTTP `Date` 头做时间修正。

  device_catalog:
    external_cloud_host:
      name: Cloud / On-Prem Host
      name_i18n:
        zh: 云端 / 本地服务器
      description: >-
        Runs the face library server, the management console and the MQTT
        broker in containers. Present in every preset — the library and the
        console are shared infrastructure, not per-preset extras. Neither
        container image has been pushed to a registry yet.
      description_i18n:
        zh: >-
          以容器运行人脸库服务、管理界面与 MQTT broker。每个套餐都要它——人脸库与
          管理界面是共用基础设施，不是某个套餐的附加项。两个容器镜像都还没有推送到
          registry。
    recamera_pro:
      description: >-
        Runs recognition, liveness and the door logic on the camera itself. It
        is a Buildroot device with no Docker, no dpkg and no systemd: the app
        runs as a root appmgr kit app, so this preset extends the camera's
        existing face-recognition app rather than installing a package. Its
        native outputs swing 12–21 V, and a UART or CAN pin can be reconfigured
        to 3.3 V instead. The device survey found `gpio131` already exported by
        another application, so no pin may be assumed free.
      description_i18n:
        zh: >-
          识别、活体与门控判定都跑在摄像头本机。它是 Buildroot 设备，没有 docker、
          没有 dpkg、没有 systemd：应用以 root 身份作为 appmgr kit app 运行，
          因此这个套餐是在摄像头已有的人脸识别应用上做扩展，而不是装一个包。
          它的原生输出摆幅 12–21 V，也可以把 UART 或 CAN 脚改配成 3.3 V。
          真机盘点发现 `gpio131` 已被另一个应用 export，所以任何引脚都不能假定空闲。
    recamera_2002:
      description: >-
        The standard reCamera, and a different shape from the Pro rather than a
        variant of it. It already recognises faces on its own — an App Center
        application does detection, embedding, a two-head texture liveness with
        blink fusion, and matching, entirely on the camera — and its control
        plane is MQTT, not the Pro's loopback HTTP. It drives no lock: events
        leave over MQTT and the relay sits at the gateway, which is why it
        belongs to the MQTT preset rather than the on-device one. What gets
        installed on it is a small standard-library daemon that pulls the face
        library, maps the native result stream onto the event contract, and pins
        every threshold in one file against the recognition process's actual
        arguments. One variant is the exception to "drives no lock": the
        2002 HQ PoE carries a 6-pin header on its baseboard with three IO lines
        (D1 = sysfs 490, the only one not multiplexed; CLK = 487; SMD = 488), so
        a relay can sit on the camera itself and it becomes a second door option
        under the on-device preset. Nothing about that path has been on
        hardware: the header's level polarity and available drive current are
        undocumented by the vendor and unmeasured, so it is pending hardware and
        no lock may be wired before a meter and an LED have confirmed them.
      description_i18n:
        zh: >-
          标准版 reCamera，与 Pro 是两种形态，不是同一形态的变体。它本身就会识别人脸
          ——一个 App Center 应用在摄像头内完成检测、嵌入、双头纹理活体加眨眼融合与匹配
          ——而它的控制面是 MQTT，不是 Pro 的回环 HTTP。它不驱动任何锁：事件经 MQTT 发出，
          继电器在网关侧，这正是它属于 MQTT 套餐而不是端侧直控套餐的原因。装在它上面的是
          一个纯标准库的小守护进程，负责拉人脸库、把原生结果流映射成事件契约，
          并把所有阈值钉在一个文件里，与识别进程的实际启动参数逐项比对。
          "不驱动任何锁"有一个例外：2002 HQ PoE 的底板上有一组 6-pin 排针，三路 IO
          （D1 = sysfs 490，唯一一路非复用；CLK = 487；SMD = 488），继电器可以接在
          摄像头自己身上，于是它成为端侧直控套餐的第二个门口设备选项。这条路径的任何
          一项都没上过硬件：排针的电平极性与可供电流厂商没写、也没有实测，所以它是
          待真机状态，万用表与 LED 确认之前不得接锁。
    recomputer_j20:
      description: >-
        The industrial box preset. Recognition runs in containers against an
        existing RTSP camera, and the door is driven from an opto-isolated
        digital output — sysfs 463/464/465/462 for DO1–DO4 per the design spec,
        pending confirmation on hardware of whether the target image exposes
        them that way or through Jetson.GPIO. The DO switches the relay; it
        never carries lock current.
      description_i18n:
        zh: >-
          工业盒子套餐。识别在容器里跑，接现有 RTSP 摄像头，门控由光隔数字输出驱动——
          按设计 spec，DO1–DO4 是 sysfs 463/464/465/462，目标镜像究竟以这种方式
          还是通过 Jetson.GPIO 暴露它们，需要在真机上确认。DO 只负责切换继电器，
          绝不承载锁电流。
    recomputer_j40:
      description: >-
        The compute host for the MQTT-relay preset — any of these boxes, or a
        standard reCamera. It has no local door wiring at all: the unlock
        travels over MQTT to a relay node elsewhere, which is what makes this
        the preset for doors that are not next to the compute.
      description_i18n:
        zh: >-
          MQTT 继电器套餐的计算主机——这几款盒子任选其一，或者一台标准 reCamera。
          它本机完全没有门控接线：开门指令经 MQTT 发到别处的继电器节点，
          这正是"门不在计算机旁边"时选这个套餐的原因。
    recomputer_j30:
      description: >-
        The smaller Orin Nano option for the same role. It carries recognition
        the same way and has no local door wiring either; whether it has enough
        headroom for the recognition service alongside whatever else the site
        runs on it has not been measured.
      description_i18n:
        zh: >-
          同一角色下更小的 Orin Nano 选项。它以同样的方式承载识别，本机同样没有门控接线；
          它在站点其他负载之外还剩多少余量跑识别服务，没有测过。
    generic_modbus_relay_gateway:
      name: SenseCAP R1000 + Modbus Relay
      name_i18n:
        zh: SenseCAP R1000 + Modbus 继电器
      description: >-
        One of the two relay options for the MQTT preset. The unlock is written
        as a point on the gateway, going through its point-command path rather
        than around it. Suits sites that already run an R1000 for other
        industrial IO.
      description_i18n:
        zh: >-
          MQTT 套餐的两个继电器选项之一。开门写成网关上的一个点位，走它自己的点位
          指令通道而不是绕过它。适合站点上本来就用 R1000 接其他工业 IO 的情况。
    xiao_esp32s3:
      description: >-
        The other relay option for the MQTT preset, and the door-side board of
        the P4 preset. It subscribes to one topic, drives one dry contact, and
        ends the pulse from its own firmware timer — a dropped packet cannot
        leave the door standing open. The `set` topic must never be retained.
      description_i18n:
        zh: >-
          MQTT 套餐的另一个继电器选项，同时也是 P4 套餐的门侧板。它订阅一个 topic、
          驱动一路干接点，脉冲由固件自己的定时器结束——丢包不会让门一直开着。
          `set` topic 绝不能是 retained。
    grove_vision_ai:
      purchase:
        require:
          version: [v2]
      description: >-
        Detection and embedding on the WE2, over UART to the XIAO which does
        the matching. It has **no liveness model** — none exists for this chip
        in any of the source repositories — so the P4 preset is restricted to
        an allowlist within a schedule and must not be used on a door where a
        printed photo held up to the camera would be a problem.
      description_i18n:
        zh: >-
          检测与嵌入在 WE2 上完成，经 UART 交给 XIAO 做匹配。它**没有活体模型**——
          所有来源仓库里都没有这颗芯片的活体实现——因此 P4 套餐被限制为"时段内的
          白名单"，且不得用于"举一张打印照片给摄像头就会出事"的门。
    generic_relay_module:
      name: Grove Relay
      name_i18n:
        zh: Grove 继电器
      product_url: https://www.seeedstudio.com/Grove-Relay.html
      description: >-
        SKU 103020005. SPST-NO, opto-isolated, 3.3-5 V trigger, mechanical
        (non-SSR) contact — nothing downstream of `COM`/`NO` carries any
        voltage of ours, in any state. This is the whole output of every
        preset: whoever owns the door controller wires its input to `COM` and
        `NO` and decides what a momentary closure does from there. It has no
        `NC` terminal, so a door controller whose input is normally-closed
        instead needs SKU 103020012 (Grove - SPDT Relay(30A)) in its place.
        `relay_contact` has no default value on purpose — get NO/NC backwards
        and the controller reads the wrong idle state, which is not the same
        failure as leaving a lock open, but is just as invisible until
        someone tests it.
      description_i18n:
        zh: >-
          SKU 103020005。SPST-NO、光耦隔离、3.3–5 V 触发、机械触点（非
          SSR）——`COM`/`NO` 下游任何状态都不出现我们的电压。这就是每个套餐的
          全部输出：门控控制器的所有者把自己输入接到 `COM` 和 `NO`，瞬时闭合之后
          怎么动作由他决定。它没有 `NC` 端子，门控输入是常闭型的话要换成 SKU
          103020012（Grove - SPDT Relay(30A)）。`relay_contact` 故意不设默认值——
          NO/NC 接反，门控读到的空闲态就是错的，这不等同于把锁开着，但同样要等
          有人测试才会发现。
    generic_relay_module_spdt:
      name: Grove - SPDT Relay(30A)
      name_i18n:
        zh: Grove - SPDT 继电器（30A）
      product_url: https://www.seeedstudio.com/Grove-SPDT-Relay-30A.html
      description: >-
        SKU 103020012. The alternative to the default Grove Relay, for a door
        controller whose input is normally-closed and therefore needs `NC` as
        well as `COM`/`NO`. Its 3.3 V trigger reliability is not documented by
        the vendor (the datasheet gives only a 5 V nominal coil) and has not
        been measured on any preset's GPIO/DO — confirm on hardware before
        relying on it, or feed the relay's own VCC/GND from a separate 5 V
        source.
      description_i18n:
        zh: >-
          SKU 103020012。默认 Grove Relay 的备选——门控输入是常闭型、需要 `NC`
          而不只是 `COM`/`NO` 时才用它。厂商没有文档化 3.3 V 触发可靠性
          （数据手册只写了 5 V 标称线圈），任何一个套餐的 GPIO/DO 上都没有实测过，
          上板前先确认，或者给继电器的 VCC/GND 单独接一路 5 V 电源。
    generic_relay_module_xiao:
      name: XIAO 1-Channel Relay
      name_i18n:
        zh: XIAO 1-Channel Relay
      product_url: https://www.seeedstudio.com/Relay-add-on-module-for-XIAO-p-6310.html
      description: >-
        SKU 114993555. A stackable add-on board for the XIAO ESP32-S3 rather
        than a Grove-cabled module — driven by the XIAO's own D1 pin, which
        the board's schematic (Hongfa HF32FA-G relay, NPN low-side driver)
        wires as active-high: GPIO high closes the relay. It exposes only two
        screw-terminal contacts — SPST-NO, no `NC` — rated 10 A / 250 VAC, so
        only a fail-secure posture is physically possible with this module; a
        door controller that needs `NC` (fail-safe) requires the Grove Relay
        or the Grove - SPDT Relay(30A) instead. The coil draws its 5 V from
        the XIAO's own USB/VBUS rail, not a separate supply, and there is no
        opto-isolation between the control side and the coil driver — the
        contact side (`NO` to the door controller) is the only isolated part.
        No wiki page exists for it (product page and schematic PDF only).
        Source: internal schematic review, `docs/reports/f1-relay-module-selection-2026-09-07.md`
        appendix B. There is no cataloged accessory family for this SKU yet —
        the Grove Relay (103020005) is a documented substitute when a
        standalone Grove-cabled relay is preferred over the add-on board.
      description_i18n:
        zh: >-
          SKU 114993555。XIAO ESP32-S3 的叠板式扩展板，不是 Grove 排线模组——
          由 XIAO 自己的 D1 引脚驱动，原理图（Hongfa HF32FA-G 继电器、NPN
          低边驱动）走线是高电平触发：GPIO 拉高即吸合。对外只引出 2 个螺丝端子——
          SPST-NO，没有 `NC`，额定 10A/250VAC，因此这颗模块物理上只能做
          fail-secure；门控输入需要 `NC`（fail-safe）就要换成 Grove Relay 或
          Grove - SPDT Relay(30A)。线圈的 5V 取自 XIAO 自身的 USB/VBUS 轨，不是
          独立供电；控制侧与线圈驱动之间没有光耦隔离——只有触点侧（`NO` 到门控
          输入）是隔离的。没有独立 wiki 页（只有商品页和原理图 PDF）。来源：
          内部原理图核实，`docs/reports/f1-relay-module-selection-2026-09-07.md`
          附录 B。这颗 SKU 目前没有对应的采购族——如果更想用独立的 Grove 排线
          继电器而不是这块扩展板，Grove Relay（103020005）是有文档记录的替代。
    generic_rtsp_camera:
      name: RTSP / IP Camera
      name_i18n:
        zh: RTSP / IP 摄像头
      description: Any RTSP camera at the door, for the presets that do not carry their own sensor
      description_i18n:
        zh: 门口任意一台 RTSP 摄像头，供不自带传感器的套餐使用

  presets:
    - id: p1_recamera_pro
      name: On-Device — reCamera Pro / PoE
      name_i18n:
        zh: 端侧直控 —— reCamera Pro / PoE
      badge: Library/GPIO paths verified on hardware; door and registration not production-ready
      badge_i18n:
        zh: 库下发/GPIO 回读真机已验；开门与注册链路未达可生产状态
      description: >-
        Everything at the door: the camera recognises, checks liveness, decides
        and pulses its own GPIO into a relay. Nothing but the face library and
        the audit upload crosses the network, so the door keeps working while
        the network is down. What gets installed is a small standard-library
        daemon that runs beside the camera's existing face-recognition app —
        pulling the signed face library, mapping the app's result stream onto
        the event contract, and driving one sysfs GPIO. It does not take over
        appmgr, the recognition app, or its launch arguments. The steps are
        manual because that daemon is a flat set of Python modules under
        /userdata/f1-access, not an installable package and not an appmgr app:
        the recamera_pro_app deployer activates an already-installed appmgr app,
        which is not what this is. On this preset the library path and a
        synthetic-event GPIO readback have run on hardware; the lock has never
        been connected. Registration through the console is not usable in
        production on this device today: no cloud embedder yet produces
        vectors in the Pro's own model space (`rv1126b:scrfd500m+mbf512@fp16`);
        see the guide's Step 3 known limitation. The standard reCamera path
        (P5) does not have this gap.
      description_i18n:
        zh: >-
          全部动作在门口完成：摄像头识别、验活体、做判定，再用自己的 GPIO 给继电器
          一个脉冲。除了人脸库与审计上传，没有别的东西过网络，所以网络断了门依然能开。
          装上去的是一个纯标准库的小守护进程，跑在摄像头已有的人脸识别应用**旁边**：
          拉签名人脸库、把应用的结果流映射成事件契约、驱动一路 sysfs GPIO。
          它不接管 appmgr、不接管识别应用、也不改它的启动参数。步骤之所以是人工步骤，
          是因为这个守护进程是 /userdata/f1-access 下一组平铺的 Python 模块，
          既不是安装包也不是 appmgr app——recamera_pro_app 部署器激活的是已安装的
          appmgr app，与这里不是一回事。本套餐的库下发链路与注入合成事件的 GPIO
          回读已在真机跑通；锁从未接过。经管理界面注册目前在这台设备上不可用于
          生产：还没有云端嵌入器能产出 Pro 自己模型空间（`rv1126b:scrfd500m+mbf512@fp16`）
          的向量；见指南步骤 3 的已知限制。标准版 reCamera 路径（P5）没有这个缺口。
      device_groups:
        - id: cloud
          name: Cloud Host
          name_i18n:
            zh: 云端主机
          type: single
          required: true
          options:
            - device_ref: external_cloud_host
          default: external_cloud_host
        - id: door
          name: Door Camera
          name_i18n:
            zh: 门口摄像头
          type: single
          required: true
          options:
            - device_ref: recamera_pro
            - device_ref: recamera_2002
          default: recamera_pro
        - id: relay
          name: Relay
          name_i18n:
            zh: 继电器
          type: single
          required: true
          options:
            - device_ref: generic_relay_module
            - device_ref: generic_relay_module_spdt
          default: generic_relay_module

    - id: p2_industrial_box
      name: Industrial Box — reComputer Industrial J20
      name_i18n:
        zh: 工业盒子 —— reComputer Industrial J20
      badge: Untested on hardware
      badge_i18n:
        zh: 未上板验证
      description: >-
        For a door that already has a camera. The J20 pulls the existing RTSP
        stream, runs recognition and liveness in containers, and drives the
        relay from an opto-isolated digital output. The isolation is the point:
        the lock's supply and the compute's supply never share a return path.
      description_i18n:
        zh: >-
          适合门口已经有摄像头的场合。J20 拉取现有 RTSP 流，在容器里跑识别与活体，
          再用光隔数字输出驱动继电器。隔离本身就是重点：锁的供电与计算的供电不共用
          回流路径。
      device_groups:
        - id: cloud
          name: Cloud Host
          name_i18n:
            zh: 云端主机
          type: single
          required: true
          options:
            - device_ref: external_cloud_host
          default: external_cloud_host
        - id: compute
          name: Access Host
          name_i18n:
            zh: 门禁主机
          type: single
          required: true
          options:
            - device_ref: recomputer_j20
          default: recomputer_j20
        - id: camera
          name: Camera
          name_i18n:
            zh: 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_rtsp_camera
          default: generic_rtsp_camera
        - id: relay
          name: Relay
          name_i18n:
            zh: 继电器
          type: single
          required: true
          options:
            - device_ref: generic_relay_module
            - device_ref: generic_relay_module_spdt
          default: generic_relay_module

    - id: p3_mqtt_relay
      name: MQTT Relay — Compute Away From the Door
      name_i18n:
        zh: MQTT 继电器 —— 计算不在门口
      badge: Untested on hardware
      badge_i18n:
        zh: 未上板验证
      description: >-
        For when the box that can run recognition is nowhere near the door, or
        when one box serves several doors. Recognition runs in containers on a
        J30/J40/R2000 against an existing RTSP stream; the unlock travels over
        MQTT to a relay node — either an R1000 writing a Modbus point or a XIAO
        ESP32 driving a Grove Relay. The extra hop is the cost, and it is why
        this preset has its own latency boundary rather than sharing the direct
        one. A standard reCamera reaches the same relay node but installs
        differently enough to have its own preset: it recognises on the camera
        and never runs a recognition container.
      description_i18n:
        zh: >-
          适合能跑识别的盒子离门很远，或者一台盒子管好几道门的场合。识别在
          J30/J40/R2000 上以容器运行，接现有 RTSP 流；开门指令经 MQTT 发到继电器节点——
          要么是 R1000 写一个 Modbus 点位，要么是 XIAO ESP32 驱动一个 Grove 继电器。
          代价是多一跳，这也是它单列一个时延边界而不与端侧直控共用的原因。
          标准版 reCamera 接的是同一个继电器节点，但安装方式差别够大，单列一个套餐：
          它在摄像头内识别，不跑任何识别容器。
      device_groups:
        - id: cloud
          name: Cloud Host
          name_i18n:
            zh: 云端主机
          type: single
          required: true
          options:
            - device_ref: external_cloud_host
          default: external_cloud_host
        - id: compute
          name: Access Host
          name_i18n:
            zh: 门禁主机
          type: single
          required: true
          options:
            - device_ref: recomputer_j40
            - device_ref: recomputer_j30
          default: recomputer_j40
        - id: camera
          name: Camera
          name_i18n:
            zh: 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_rtsp_camera
          default: generic_rtsp_camera
        - id: relay
          name: Relay Node
          name_i18n:
            zh: 继电器节点
          type: single
          required: true
          options:
            - device_ref: generic_modbus_relay_gateway
            - device_ref: xiao_esp32s3
          default: xiao_esp32s3
        - id: relay_module
          name: Relay
          name_i18n:
            zh: 继电器
          type: single
          required: true
          options:
            - device_ref: generic_relay_module
            - device_ref: generic_relay_module_xiao
          default: generic_relay_module

    - id: p5_recamera_std
      name: Standard reCamera — On-Camera Loop, Gateway Relay
      name_i18n:
        zh: 标准版 reCamera —— 摄像头内闭环，网关侧继电器
      badge: Library path verified on hardware; door path untested
      badge_i18n:
        zh: 拉库链路已上板验证；门控链路未验证
      description: >-
        The standard reCamera already recognises faces by itself — detection,
        embedding, a two-head texture liveness with blink fusion and matching all
        run on the camera, in one native process. So this preset installs no
        recognition container and pulls no RTSP off the camera. What it adds is a
        small standard-library daemon that does the three things the camera does
        not do on its own: pull the versioned face library, map the camera's
        native result stream onto the event contract, and pin every threshold in
        one file, checked against the recognition process's actual command line
        so that a threshold cannot quietly differ between the two. The camera
        drives no lock; events leave over MQTT and the relay is at the gateway.
        The library path — poll, chunked download, per-file SHA, signature,
        atomic switch, reload — has been exercised on a real unit. The door path
        has not: nobody has stood in front of the lens, no relay has been wired,
        and the thresholds are the device's shipped values, not calibrated ones.
      description_i18n:
        zh: >-
          标准版 reCamera 本身就会识别人脸——检测、嵌入、双头纹理活体加眨眼融合、匹配，
          全部在摄像头内的同一个原生进程里完成。因此这个套餐不装任何识别容器，
          也不从摄像头拉 RTSP。它加的是一个纯标准库的小守护进程，做摄像头自己不做的
          三件事：拉版本化人脸库、把摄像头原生的结果流映射成事件契约、把所有阈值钉在
          一个文件里并与识别进程的实际命令行逐项比对，让两边的阈值不可能悄悄不一致。
          摄像头不驱动任何锁；事件经 MQTT 发出，继电器在网关侧。
          拉库这条链路——轮询、分块下载、逐文件 SHA、验签、原子切换、reload——已经在
          真机上跑过。门控那条没有：没有人站到镜头前，没有接过继电器，
          阈值用的是设备出厂的现值，不是标定结果。
      device_groups:
        - id: cloud
          name: Cloud Host
          name_i18n:
            zh: 云端主机
          type: single
          required: true
          options:
            - device_ref: external_cloud_host
          default: external_cloud_host
        - id: door
          name: Door Camera
          name_i18n:
            zh: 门口摄像头
          type: single
          required: true
          options:
            - device_ref: recamera_2002
          default: recamera_2002
        - id: relay
          name: Relay Node
          name_i18n:
            zh: 继电器节点
          type: single
          required: true
          options:
            - device_ref: generic_modbus_relay_gateway
            - device_ref: xiao_esp32s3
          default: xiao_esp32s3
        - id: relay_module
          name: Relay
          name_i18n:
            zh: 继电器
          type: single
          required: true
          options:
            - device_ref: generic_relay_module_xiao
            - device_ref: generic_relay_module
          default: generic_relay_module_xiao

    - id: p4_xiao_grove
      name: XIAO + Grove Vision AI V2 — No Liveness
      name_i18n:
        zh: XIAO + Grove Vision AI V2 —— 无活体
      badge: Firmware not built
      badge_i18n:
        zh: 固件未构建
      description: >-
        The cheapest door: a Grove Vision AI V2 detects and embeds, a XIAO
        ESP32-S3 matches against a library held in its own flash and drives a
        Grove Relay. It pulls the same versioned library over the same HTTP
        endpoints. It has no liveness model, so the policy is deliberately
        weakened to an allowlist within a schedule, single-shot — do not put it
        on a door where a printed photograph would matter. The firmware exists
        as source on a branch and has not been built; the flash steps carry no
        binary yet.
      description_i18n:
        zh: >-
          最便宜的一道门：Grove Vision AI V2 做检测与嵌入，XIAO ESP32-S3 用自己
          flash 里的人脸库做匹配并驱动一个 Grove 继电器。它用同样的 HTTP 接口拉取
          同一份版本化人脸库。它没有活体模型，因此策略被刻意降权成"时段内白名单、
          单次开门"——不要把它装在"举一张打印照片就会出事"的门上。固件目前只有分支上的
          源码，尚未构建，烧录步骤里还没有二进制。
      device_groups:
        - id: cloud
          name: Cloud Host
          name_i18n:
            zh: 云端主机
          type: single
          required: true
          options:
            - device_ref: external_cloud_host
          default: external_cloud_host
        - id: vision
          name: Vision Module
          name_i18n:
            zh: 视觉模组
          type: single
          required: true
          options:
            - device_ref: grove_vision_ai
          default: grove_vision_ai
        - id: controller
          name: Door Controller
          name_i18n:
            zh: 门控主板
          type: single
          required: true
          options:
            - device_ref: xiao_esp32s3
          default: xiao_esp32s3
        - id: relay
          name: Relay
          name_i18n:
            zh: 继电器
          type: single
          required: true
          options:
            - device_ref: generic_relay_module
          default: generic_relay_module

