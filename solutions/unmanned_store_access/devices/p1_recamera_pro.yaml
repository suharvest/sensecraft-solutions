version: "1.0"
id: p1_recamera_pro
name: Activate and Configure F1 Door Access
name_i18n:
  zh: 激活并配置 F1 门禁
type: recamera_pro_app

# f1-access >= 0.1.5 (unmanned-store-access branch feat/f1-access-config-push)
# accepts the access-side settings as appmgr config items and, on start, writes
# appdata/f1-access/face-recognition.conf and facedb.key (0600) from them, then
# clears facedb_secret from config.json so GET /api/appMgr/config no longer
# returns it. Verified on a reCamera Pro 2026-09-15 (192.168.10.33): conf and
# key written, secret cleared, gate armed on the pushed gpio, re-POST is a noop.
# Older f1-access versions reject these keys as unknown parameters (HTTP 400).
#
# The deployer substitutes {{placeholders}} inside `config` and coerces
# numeric-looking strings to numbers; appmgr type-checks the result.
#   - active_high and pulse_ms are literals: a placeholder would arrive as the
#     string "true", which appmgr's boolean check rejects.
#   - device_id must not be all digits (it would be coerced to int).
#   - cmd_port is not set: the package default (8126) avoids appmgr's result
#     hub on 8125.
recamera_pro_app:
  app_id: f1-access
  activation_timeout: 180
  require_installed: true
  config:
    liveness_enabled: true
    min_face_px: 40
    f1_conf: /userdata/local/appdata/f1-access/face-recognition.conf
    device_id: "{{device_id}}"
    facedb_url: "http://{{facedb_host}}:{{facedb_port}}"
    facedb_key_id: facedb-key-1
    facedb_secret: "{{facedb_signing_key}}"
    mqtt_host: "{{facedb_host}}"
    match_threshold: "{{match_threshold}}"
    gpio: "{{gpio}}"
    active_high: true
    pulse_ms: 1500
    relay_contact: "{{relay_contact}}"
    fail_mode: "{{fail_mode}}"

# The App renders its connection panel from this block; the credentials are the
# camera web console's and the transport is HTTPS.
ssh:
  port: 443
  default_user: admin
  connection_timeout: 30

post_deployment:
  open_browser: false

user_inputs:
  - id: device_id
    name: Door Name
    type: text
    default: "door-1"
    required: true
    validation:
      pattern: "^[A-Za-z][A-Za-z0-9_-]*$"
    description: Shown in the console's device list. Letters, digits, - and _, starting with a letter.
    name_i18n:
      zh: 门名称
    description_i18n:
      zh: 显示在管理界面的设备列表中。字母开头，可用字母、数字、- 和 _。
  - id: facedb_host
    name: Server IP
    type: text
    required: true
    default_template: "{{p1_cloud_facedb.host}}"
    placeholder: "192.168.1.50"
    description: The server from Step 1. Leave the filled-in value unless you deployed Step 1 on this computer; then enter this computer's IP.
    name_i18n:
      zh: 服务器 IP
    description_i18n:
      zh: 步骤 1 的服务器。步骤 1 部署在这台电脑上时，填这台电脑的 IP。
  - id: facedb_port
    name: Face Library Port
    type: text
    default: "8080"
    default_template: "{{facedb_port}}"
    required: true
    name_i18n:
      zh: 人脸库端口
  - id: match_threshold
    name: Match Threshold
    type: text
    default: "0.40"
    default_template: "{{match_threshold}}"
    required: true
    name_i18n:
      zh: 匹配阈值
  - id: facedb_signing_key
    name: Library Signing Key
    type: password
    required: true
    default_template: "{{facedb_signing_key}}"
    generate: hex32
    name_i18n:
      zh: 人脸库签名密钥
  - id: gpio
    name: GPIO Number
    type: text
    default: "130"
    required: true
    validation:
      pattern: "^[0-9]+$"
    description: The GPIO the relay SIG wire is connected to in Step 3.
    name_i18n:
      zh: GPIO 编号
    description_i18n:
      zh: 步骤 3 中继电器 SIG 线接的 GPIO。
  - id: relay_contact
    name: Relay Contact
    type: select
    required: true
    options:
      - value: "NC"
        label: COM + NC — fail-safe magnetic lock (unlocks on power loss)
        label_i18n:
          zh: COM + NC——断电即开的电磁锁
      - value: "NO"
        label: COM + NO — fail-secure strike (stays locked on power loss)
        label_i18n:
          zh: COM + NO——断电即锁的电插锁
    name_i18n:
      zh: 继电器触点
  - id: fail_mode
    name: Door State on Power Loss
    type: select
    required: true
    options:
      - value: "fail_safe"
        label: Unlocked (fail-safe)
        label_i18n:
          zh: 打开（fail-safe）
      - value: "fail_secure"
        label: Locked (fail-secure)
        label_i18n:
          zh: 锁住（fail-secure）
    name_i18n:
      zh: 断电后门的状态
