version: "1.0"
id: p1_recamera_pro
name: Activate F1 Door Access from the App Center
name_i18n:
  zh: 从应用市场激活 F1 门禁
type: recamera_pro_app

# f1-access is a published reCamera Pro App Center package (catalog
# https://sensecraft-statics.seeed.cc/solution-app/recamera_pro/catalog.json,
# app id "f1-access", confirmed present 2026-09-07). It is a single kit app
# that combines the recognition cascade of the face-recognition app (SCRFD-500M
# detection, ArcFace embedding, gallery match, fused liveness) with the door
# logic that used to run as a separate sidecar daemon: it drives one sysfs GPIO
# dry contact and publishes access/v1/events. Because it ships through the App
# Center rather than with this solution, this step only configures an app that
# is already installed and makes it the active one — appmgr on a reCamera Pro
# is a single-active supervisor, so activating f1-access stops whatever app was
# running before (retail-vision, fall-detection, the plain face-recognition
# app, ...). If the device does not have f1-access installed, install it from
# the App Center first; this step does not upload or install packages, because
# installation requires a release-signed archive from a private packaging
# chain (see spec/device.schema.json RecameraProAppConfig).
#
# Fields, source solutions/unmanned_store_access-adjacent upstream
# platforms/recamera-pro/app/README.md §6 (unmanned-store-access repo):
#   - liveness_enabled: true is mandatory, not a preference. The app manifest
#     ships liveness_enabled=false by default (the plain face-recognition app
#     can skip liveness); f1-access's own consistency gate refuses to arm the
#     door when it is false, because a door that reports a liveness verdict it
#     never computed is worse than a door that refuses to start.
#   - min_face_px: 40 matches the recognition app's own default; left explicit
#     here rather than silently inherited, so a future manifest change does not
#     silently loosen it.
#   - access.f1_conf points at the ini file (facedb URL/key, GPIO pin, wiring
#     posture, policy thresholds) that actually arms the gate. Its value here
#     is the manifest's own default path; the file's *contents* are NOT
#     delivered by this step. It carries the facedb HMAC key and the measured
#     wiring posture (relay_contact / fail_mode / gpio) — those are per-device
#     credentials and per-installation electrical facts, prepared on the
#     device itself in the next step (devices/p1_recamera_pro_wiring.yaml). An
#     app freshly activated with no such file present stays "disarmed":
#     recognition keeps running, but no pin is exported and no access event is
#     published — see that step's gate check.
#
# activation_timeout is raised from the deployer's 60 s default to 180 s
# because the manifest lists six .rknn models (detection, embedding, two
# liveness heads, depth liveness, plus the gallery matcher's own tables) that
# all have to load before appmgr reports the app active.
recamera_pro_app:
  app_id: f1-access
  activation_timeout: 180
  require_installed: true
  config:
    liveness_enabled: true
    min_face_px: 40
    f1_conf: /userdata/local/appdata/f1-access/face-recognition.conf

# The App renders its connection panel from this block, and the panel — not
# user_inputs — supplies host/username/password. Without it the form showed a
# default user of "recomputer" on port 22, neither of which applies here: the
# credentials are the web console's and the transport is HTTPS, not SSH.
ssh:
  port: 443
  default_user: admin
  connection_timeout: 30

post_deployment:
  open_browser: false
