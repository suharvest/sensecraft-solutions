version: "1.0"
id: cloud_facedb
name: Face Library and Management Console
name_i18n:
  zh: 人脸库服务与管理界面
type: docker_deploy

# One compose project brings up the face library server, the MQTT broker and
# the management console; they share the `facedb` volume.

docker:
  compose_file: assets/cloud/docker-compose.yml
  compose_dir: assets/cloud
  options:
    project_name: unmanned_store_access_cloud
    remove_orphans: true
  services:
    - name: facedb
      port: 8080
      required: true
    - name: mosquitto
      port: 1883
      required: true
    - name: web
      port: 8088
      required: true

ssh:
  port: 22
  default_user: ubuntu
  auth_methods:
    - password
  connection_timeout: 30
  command_timeout: 600

pre_checks:
  - type: disk_space
    min_gb: 5
    description: Images, event database and face library versions.

deploy_timeout: 1800

post_deployment:
  open_browser: false

remote_overrides:
  remote_path: /home/{{username}}/unmanned-store-access
  compose_dir: assets/cloud
  detection:
    method: network_scan
    manual_entry: true

  actions:
    before:
      - name: Check docker and the clock
        run: |
          set -e
          if ! docker info >/dev/null 2>&1; then
            echo "Docker is not usable by this user. Install docker and add the user to the docker group." >&2
            exit 1
          fi
          docker compose version >/dev/null 2>&1 || {
            echo "The docker compose plugin is missing. Install docker-compose-plugin." >&2
            exit 1
          }
          echo "host time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if command -v timedatectl >/dev/null 2>&1; then
            timedatectl show -p NTPSynchronized --value | grep -q yes || \
              echo "WARNING: NTP is not synchronised on this host. Door devices take their time correction from it." >&2
          fi
        name_i18n:
          zh: 检查 docker 与时钟

    after_upload:
      - name: Clean macOS sidecar files and write the environment file
        run: |
          set -e
          WORKDIR="/home/{{username}}/unmanned-store-access/cloud_facedb"
          find "$WORKDIR" -name '._*' -delete 2>/dev/null || true
          find "$WORKDIR" -name '.DS_Store' -delete 2>/dev/null || true
          umask 077
          # The compose file mounts this at /run/secrets/facedb.key.
          mkdir -p "$WORKDIR/assets/cloud/secret"
          printf '%s' '{{facedb_signing_key}}' > "$WORKDIR/assets/cloud/secret/facedb.key"
          chmod 600 "$WORKDIR/assets/cloud/secret/facedb.key"
          cat > "$WORKDIR/.env" <<EOF
          USA_FACEDB_KEY_ID=facedb-key-1
          USA_MATCH_THRESHOLD={{match_threshold}}
          USA_WEB_TOKENS={{web_admin_token}}:admin
          USA_DEVICE_ENDPOINTS={{device_endpoints}}
          USA_FACE_REC_API={{face_rec_api_url}}
          MQTT_HOST=127.0.0.1
          MQTT_PORT=1883
          MQTT_TLS=0
          FACEDB_PORT={{facedb_port}}
          WEB_PORT={{web_port}}
          USA_ALLOW_FAKE=$( [ -n "{{face_rec_api_url}}" ] && echo 0 || echo 1 )
          EOF
          echo ".env written with mode $(stat -c '%a' "$WORKDIR/.env" 2>/dev/null || stat -f '%Lp' "$WORKDIR/.env")"
        name_i18n:
          zh: 清理 macOS 附属文件并写入环境文件

    after:
      - name: Confirm the library, broker and console answer
        timeout: 180
        run: |
          set -e
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:{{facedb_port}}/v1/facedb/current" || echo 000)
            case "$CODE" in
              200) echo "facedb server up, a version is already published"; break ;;
              404) echo "facedb server up, no version published yet (expected before the first enrolment)"; break ;;
              *)   sleep 5 ;;
            esac
          done
          docker exec usa-mosquitto sh -c "mosquitto_sub -h 127.0.0.1 -t 'access/v1/#' -C 0 -W 2" >/dev/null 2>&1 || true
          URL="http://127.0.0.1:{{web_port}}"
          for i in $(seq 1 30); do
            curl -fsS "$URL/api/health" >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS "$URL/api/health" || { echo "console did not come up" >&2; docker logs --tail 40 usa-web 2>&1 || true; exit 1; }
          echo
          ANON=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/events")
          echo "anonymous GET /api/events -> HTTP $ANON (401 or 403 expected)"
          docker ps --filter name=usa- --no-trunc
        ignore_error: true
        name_i18n:
          zh: 确认人脸库、broker 与管理界面已响应

  user_inputs:
    - id: host
      name: Server IP
      type: text
      required: true
      placeholder: "192.168.1.50"
      description: Must be reachable from the door devices.
      name_i18n:
        zh: 服务器 IP
      description_i18n:
        zh: 门口设备必须能访问这个地址。
    - id: username
      name: SSH Username
      type: text
      default: ubuntu
      required: true
      name_i18n:
        zh: SSH 用户名
    - id: password
      name: SSH Password
      type: password
      required: true
      name_i18n:
        zh: SSH 密码
    - id: facedb_port
      name: Face Library Port
      type: text
      default: "8080"
      required: true
      validation:
        pattern: "^[0-9]{2,5}$"
      name_i18n:
        zh: 人脸库端口
    - id: web_port
      name: Console Port
      type: text
      default: "8088"
      required: true
      validation:
        pattern: "^[0-9]{2,5}$"
      name_i18n:
        zh: 管理界面端口
    - id: match_threshold
      name: Match Threshold
      type: text
      default: "0.40"
      required: true
      validation:
        pattern: "^0\\.[0-9]{1,3}$"
      description: Devices must use the same value.
      name_i18n:
        zh: 匹配阈值
      description_i18n:
        zh: 各门口设备须填同一个值。
    - id: face_rec_api_url
      name: Recognition Service URL (for enrolment)
      type: text
      required: false
      placeholder: "http://192.168.1.60:18080"
      description: Where the console computes face features when you enrol someone. If left empty, enrolled people will not be recognised.
      name_i18n:
        zh: 识别服务地址（注册用）
      description_i18n:
        zh: 注册人员时管理界面调用的识别服务。留空时注册的人不会被识别。
    - id: device_endpoints
      name: Device Control Endpoints (JSON)
      type: text
      required: false
      default: "[]"
      placeholder: '[{"device_id":"recamera-std-01","host":"192.168.42.1","port":1883}]'
      description: Standard reCamera devices to show on the console's device page. Leave `[]` for other presets.
      name_i18n:
        zh: 设备控制端点（JSON）
      description_i18n:
        zh: 要在管理界面设备页显示的标准版 reCamera。其他套餐保持 `[]`。
    - id: facedb_signing_key
      name: Library Signing Key
      type: password
      required: true
      generate: hex32
      name_i18n:
        zh: 人脸库签名密钥
    - id: web_admin_token
      name: Console Admin Token
      type: password
      required: true
      generate: hex32
      description: Used to sign in to the management console.
      name_i18n:
        zh: 管理界面 admin token
      description_i18n:
        zh: 登录管理界面时使用。
