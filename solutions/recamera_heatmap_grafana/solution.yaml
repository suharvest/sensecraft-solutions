version: '1.0'
id: recamera_heatmap_grafana
name: Smart Retail People Flow Heatmap
intro:
  summary: See which shelves attract customers, which aisles get ignored — works with reCamera, IP cameras + AI boxes, pick the best fit for your store
  description_file: description.md
  cover_image: gallery/cover.svg
  gallery:
    - type: image
      src: gallery/grafana-dashboard.png
      caption: Grafana Dashboard with Live Feed
      caption_i18n:
        zh: Grafana 数据看板（含实时画面）
    - type: image
      src: gallery/heatmap-demo.png
      caption: Spatial Heatmap Visualization
      caption_i18n:
        zh: 空间热力图可视化
    - type: image
      src: gallery/architecture.svg
      caption: System Architecture
      caption_i18n:
        zh: 系统架构
  category: sensing
  solution_type: solution


  tags:
    - recamera
    - jetson
    - heatmap
    - grafana
    - influxdb
    - yolo
    - privacy
    - analytics
    - retail

  input_requirements:
    - type: rtsp
      description: reCamera or IP camera with RTSP stream
      description_i18n:
        zh: 带 RTSP 视频流的 reCamera 或 IP 摄像头
  device_catalog:
    recamera_2002:
      description: AI camera that detects people and automatically protects privacy
      description_i18n:
        zh: AI 摄像头，自动识别人员位置并打码保护隐私
    recamera_pro:
      description: Newer all-in-one camera — detection, tracking, dwell states and entry/exit counting on device
      description_i18n:
        zh: 更新一代的一体机——检测、跟踪、驻足状态和进出店计数全部在设备本地完成
    recomputer_r11:
      description: Edge computing device for running Grafana dashboard
      description_i18n:
        zh: 边缘计算设备，运行 Grafana 看板
    recomputer_rk3588:
      description: Runs the detector on the RK3588 NPU, with headroom for extra streams
      description_i18n:
        zh: 在 RK3588 NPU 上运行检测，可支撑更多路视频
    recomputer_rk3576:
      description: Runs the detector on the RK3576 NPU
      description_i18n:
        zh: 在 RK3576 NPU 上运行检测
    generic_ip_camera:
      name: IP Camera
      name_i18n:
        zh: IP 摄像头
      description: Any RTSP camera you already own, supplying the video the detector watches
      description_i18n:
        zh: 你已有的任意 RTSP 摄像头，为检测器提供视频
    recomputer_r20_industrial:
      description: Runs the detector on a Hailo-8 accelerator, native C++ hot path
      description_i18n:
        zh: 在 Hailo-8 加速器上运行检测，热路径为原生 C++
      purchase:
        require:
          ai_accelerator: [hailo-8]
    recomputer_j40:
      description: GPU-accelerated edge AI device for multi-camera detection
      description_i18n:
        zh: GPU 加速边缘 AI 设备，支持多摄像头检测
    recomputer_j50:
      description: High-performance edge AI for multi-camera detection
      description_i18n:
        zh: 高性能边缘 AI 设备，支持多摄像头检测
  stats:
    deployed_count: 0
    likes_count: 0
    difficulty: beginner
    estimated_time: 15min
  links: {}
  presets:
    - id: recamera
      name: AI Camera Direct
      description: Plug in a reCamera and start tracking — built-in AI, no extra hardware
      verified:
        - deploy-smoke
      device_groups:
        - id: camera
          name: AI Camera
          type: single
          required: true
          options:
            - device_ref: recamera_2002
          default: recamera_2002
          name_i18n:
            zh: AI 摄像头
        - id: server
          name: Backend Server
          type: single
          required: true
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11
          name_i18n:
            zh: 后端服务器
      links:
        wiki: https://wiki.seeedstudio.com/integration_of_real-time_heat_map_with_grafana_data_dashboard/
        wiki_i18n:
          zh: https://wiki.seeedstudio.com/cn/integration_of_real-time_heat_map_with_grafana_data_dashboard/
        github: https://github.com/xr686/reCamera-with-Heatmap
      name_i18n:
        zh: AI 摄像头直连
      description_i18n:
        zh: 接上 reCamera 就能用，摄像头自带 AI 识别，不需要额外设备
    - id: recamera_pro
      name: reCamera Pro
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: Newer hardware, same one-camera setup. The analytics app ships in the device's App Center; this preset points it at your dashboard.
      description_i18n:
        zh: 更新一代硬件，同样一台摄像头搞定。分析应用随设备应用中心分发，本套餐负责把它接到你的看板。
      device_groups:
        - id: camera
          name: Camera
          type: single
          required: true
          options:
            - device_ref: recamera_pro
          default: recamera_pro
          name_i18n:
            zh: 摄像头
        - id: server
          name: Backend Server
          type: single
          required: true
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11
          name_i18n:
            zh: 后端服务器
      name_i18n:
        zh: reCamera Pro

    - id: rk
      name: IP Camera + Rockchip NPU
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: Keep your current IP cameras — a Rockchip board runs the detector locally.
      description_i18n:
        zh: 保留现有 IP 摄像头，由瑞芯微板卡在本地跑检测。
      # Verified on both boards against a live RTSP source: image built on the
      # board, MPP hardware decode confirmed active (the CPU decoder is never
      # loaded), 13.2 fps on RK3588 and 13.3 on RK3576, MQTT pinned at 1.00
      # msg/s, 70/70 messages passing the contract validator.
      verified:
        - hardware
      device_groups:
        - id: compute
          name: Detector Host
          type: single
          required: true
          options:
            - device_ref: recomputer_rk3588
            - device_ref: recomputer_rk3576
          default: recomputer_rk3588
          name_i18n:
            zh: 检测主机
        - id: camera
          name: IP Camera
          type: single
          required: true
          options:
            - device_ref: generic_ip_camera
          default: generic_ip_camera
          name_i18n:
            zh: IP 摄像头
      name_i18n:
        zh: IP 摄像头 + 瑞芯微 NPU

    - id: hailo
      name: IP Camera + Raspberry Pi 5 (Hailo)
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: Keep your current IP cameras — a Hailo-8 accelerator runs the detector with a native C++ hot path.
      description_i18n:
        zh: 保留现有 IP 摄像头，由 Hailo-8 加速器跑检测，热路径为原生 C++。
      # Verified against a live RTSP source: 440 frames in 30.7 s = 14.3 fps
      # tracking a 15 fps camera, MQTT at 0.94 msg/s, on-chip NMS, and 84
      # person records with no coordinate out of range. Unpaced, the same
      # pipeline reached 234 fps — roughly 15x the source rate.
      verified:
        - hardware
      device_groups:
        - id: compute
          name: Detector Host
          type: single
          required: true
          options:
            - device_ref: recomputer_r20_industrial
          default: recomputer_r20_industrial
          name_i18n:
            zh: 检测主机
        - id: camera
          name: IP Camera
          type: single
          required: true
          options:
            - device_ref: generic_ip_camera
          default: generic_ip_camera
          name_i18n:
            zh: IP 摄像头
      name_i18n:
        zh: IP 摄像头 + 树莓派 5（Hailo）

    - id: jetson
      name: Upgrade Existing Cameras
      description: Keep your current IP cameras, add an AI box to enable heatmap analytics
      device_groups:
        - id: jetson_device
          name: Jetson Edge Device
          type: single
          required: true
          options:
            - device_ref: recomputer_j40
            - device_ref: recomputer_j50
          default: recomputer_j40
          name_i18n:
            zh: Jetson 边缘设备
      links:
        github: https://github.com/bleaaach/yolo11-grafana-influxdb
      name_i18n:
        zh: 传统摄像头改造
      description_i18n:
        zh: 保留现有 IP 摄像头，加一台 AI 盒子就能开启热力图分析
  summary_i18n:
    zh: 看清哪个货架前人多、哪条过道没人走——支持 reCamera、IP 摄像头 + AI 盒子，按需选设备
  description_file_i18n:
    zh: description_zh.md
deployment:
  guide_file: guide.md
  selection_mode: sequential
  post_deployment:
    autostart:
      enabled: true
      mode: fullscreen
      url: http://localhost:3000
  guide_file_i18n:
    zh: guide_zh.md
name_i18n:
  zh: 智慧零售人流热力图
