# MQTT is the only ingest path. Every detector — reCamera, reCamera Pro,
# Jetson, RK, Hailo — publishes to the broker and Telegraf is the single
# writer into InfluxDB. Detectors never write to InfluxDB directly: with
# several devices on one backend that was two write paths into the same
# measurement, one of them carrying no device tag.
#
# Contract: VisionPayload, the format the reCamera retail-vision C++ app
# already emits (sscma-example-sg200x/solutions/retail-vision).
#
#   topic: <installation>/retail-vision/results/<camera-id>
#   {
#     "timestamp": 1709500000000, "frame_width": 1280, "frame_height": 720,
#     "zone": {"occupancy_count":3, "browsing_count":1, "engaged_count":1,
#              "assist_count":0, "peak_customer":5, "avg_dwell_time":8.5,
#              "avg_engagement_time":4.2, "avg_velocity":0.45,
#              "entry_count":12, "exit_count":10},
#     "persons": [{"slot":0, "track_id":7, "state":"engaged",
#                  "cx_pct":41.2, "cy_pct":63.8, "dwell_duration":5.2,
#                  "confidence":0.85, "velocity":{"speed_m_s":0.42},
#                  "bbox":{"x":120,"y":85,"width":210,"height":480}}]
#   }
#
# One batched message per publish interval, not one per detected person:
# with several cameras on one broker the per-detection rate is what falls
# over first.
#
# slot / cx_pct / cy_pct are the three fields added on top of what
# retail-vision 1.4.0 publishes — see the solution's description for why
# each one is needed.
[agent]
  interval = "5s"
  flush_interval = "5s"
  # The container hostname says nothing useful and would tag every series.
  omit_hostname = true

# Counts arrive as floats: json_v2 types every JSON number as float64 unless
# told otherwise, and a bucket that already holds floats rejects an integer
# write for the same field with a 422 field-type conflict. The dashboards round
# for display rather than the schema changing under existing deployments.
# Zone-level metrics -> measurement "zone".
#
# Two inputs rather than two [[json_v2]] blocks under one input: several
# json_v2 configs on the same parser collapse into a single measurement
# (the last measurement_name wins), which silently merged the zone counters
# into the per-person rows.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["+/retail-vision/results/+"]
  qos = 0
  client_id = "telegraf-zone"
  topic_tag = ""
  data_format = "json_v2"

  # device = installation (store, floor); stream = one camera on it.
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/retail-vision/results/+"
    tags = "device/_/_/stream"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "zone"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "zone"
      disable_prepend_keys = true

# One row per tracked person -> measurement "persons".
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["+/retail-vision/results/+"]
  qos = 0
  client_id = "telegraf-persons"
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/retail-vision/results/+"
    tags = "device/_/_/stream"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "persons"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "persons"
      disable_prepend_keys = true
      # "slot" is the person's index inside the batch. Every person in one
      # message shares a timestamp, so without a distinguishing tag InfluxDB
      # overwrites them down to a single row per frame. Index, not track_id:
      # bounded by people-per-frame instead of growing without limit.
      tags = ["slot", "state"]

# --- reCamera Pro -----------------------------------------------------------
# The Pro publishes the same VisionPayload, but its output sink derives the
# topic itself as <installation>/<app-id>/<task>, so there is no camera-id
# segment to parse. A Pro carries one camera, so the stream tag is set
# statically and everything downstream sees the same shape.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["+/retail-vision/tracking"]
  qos = 0
  client_id = "telegraf-zone-pro"
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/retail-vision/tracking"
    tags = "device/_/_"

  [inputs.mqtt_consumer.tags]
    stream = "cam-01"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "zone"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "zone"
      disable_prepend_keys = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["+/retail-vision/tracking"]
  qos = 0
  client_id = "telegraf-persons-pro"
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/retail-vision/tracking"
    tags = "device/_/_"

  [inputs.mqtt_consumer.tags]
    stream = "cam-01"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "persons"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "persons"
      disable_prepend_keys = true
      tags = ["slot", "state"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "recamera-heatmap-token"
  organization = "seeed"
  bucket = "recamera"
