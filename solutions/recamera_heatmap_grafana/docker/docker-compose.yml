services:
  influxdb:
    image: influxdb:2.7
    container_name: recamera-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD:-adminpassword}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG:-seeed}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-recamera}
      - DOCKER_INFLUXDB_INIT_RETENTION=7d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=recamera-heatmap-token
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: recamera-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Serves the spatial heatmap and proxies its InfluxDB queries, so the
  # browser never needs the token or a reachable port 8086.
  heatmap:
    image: node:22-alpine
    container_name: recamera-heatmap
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "8080:80"
    volumes:
      - ./heatmap-demo:/app:ro
      - heatmap-config:/data
    environment:
      - CONFIG_PATH=/data/config.json
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=recamera-heatmap-token
      - INFLUX_ORG=seeed
      - INFLUX_BUCKET=recamera
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # Live video. Detectors publish analytics over MQTT and never carry video;
  # the picture comes straight from each camera's own RTSP server, which
  # go2rtc re-publishes as WebRTC because browsers cannot play RTSP and
  # Grafana has no panel that speaks it. It doubles as the ONVIF client that
  # discovers those cameras in the first place.
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: recamera-go2rtc
    # Host networking is not a shortcut here: ONVIF discovery is UDP multicast
    # to 239.255.255.250, which does not cross a bridge network, and WebRTC
    # wants its own port reachable directly.
    network_mode: host
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml
    restart: unless-stopped

  # Single ingest path for every detector: reCamera, reCamera Pro, Jetson,
  # RK and Hailo all publish here and Telegraf writes to InfluxDB.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: recamera-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  telegraf:
    image: telegraf:1.33
    container_name: recamera-telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  heatmap-config:

networks:
  default:
    name: recamera-heatmap-network
