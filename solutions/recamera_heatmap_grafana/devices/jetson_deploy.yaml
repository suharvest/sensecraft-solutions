version: "1.0"
id: jetson_deploy
name: NVIDIA Jetson Detector
type: docker_deploy

# device_class=jetson pulls in the shared Jetson pre-deploy fixes (the
# iptables raw-table workaround for JetPack 6.x) and the hardware detection
# probe (test -f /etc/nv_tegra_release) from devices/profiles/jetson.yaml.
device_class: jetson

detection:
  method: network_scan
  manual_entry: true

docker:
  compose_file: ../docker/docker-compose.jetson.yml
  remote_path: /home/{{username}}/retail-vision-jetson
  options:
    project_name: retail-vision-jetson
    remove_orphans: true
  services:
    - name: retail-vision
      required: true

ssh:
  default_user: seeed

user_inputs:
  - id: rtsp_url
    name: RTSP Camera URL
    type: text
    placeholder: "rtsp://192.168.1.50:554/stream"
    description: RTSP stream of the camera this Jetson watches
    required: true
    name_i18n:
      zh: RTSP 摄像头地址
    description_i18n:
      zh: 这台 Jetson 要看的摄像头 RTSP 地址
  - id: device_name
    name: Installation Name
    type: text
    default: "store-01"
    required: true
    row: 1
    description: First segment of the MQTT topic — a store, floor or site name keeps several installations apart on one broker
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
      message: Letters, digits, hyphen and underscore only
    name_i18n:
      zh: 安装点名称
    description_i18n:
      zh: MQTT 主题的第一段——用门店、楼层或站点名区分同一 broker 上的多个安装点
  - id: stream_id
    name: Camera ID
    type: text
    default: "cam-01"
    required: true
    row: 1
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
      message: Letters, digits, hyphen and underscore only
    name_i18n:
      zh: 摄像头编号
  - id: mqtt_host
    name: MQTT Broker
    type: text
    default: "127.0.0.1"
    required: true
    row: 2
    description: Where the dashboard backend runs. Leave at 127.0.0.1 if you deployed it on this same Jetson.
    name_i18n:
      zh: MQTT 服务器
    description_i18n:
      zh: 看板后端所在地址。如果后端就部署在这台 Jetson 上，保持 127.0.0.1
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    row: 2
    validation:
      pattern: "^[0-9]{1,5}$"
      message: Port number only
    name_i18n:
      zh: MQTT 端口

pre_checks:
  - type: docker
    description: Docker must be installed and running
  - type: disk_space
    min_gb: 4
    description: At least 4GB for the detector image

actions:
  before:
    - name: Write the detector config
      run: |
        set -e
        CONFIG_DIR="{{remote_path}}/jetson-config"
        mkdir -p "$CONFIG_DIR"
        cat > "$CONFIG_DIR/config.json" <<EOF
        {
          "installation": "{{device_name}}",
          "backend": "tensorrt",
          "model_path": "/models/yolo11n.engine",
          "input_size": 640,
          "score_threshold": 0.35,
          "nms_threshold": 0.45,
          "publish_hz": 1.0,
          "window_duration": 60.0,
          "frame_width": 1280,
          "frame_height": 720,
          "video": {
            "backend": "cv2_ffmpeg",
            "strict": false,
            "fallback": "none",
            "read_timeout_ms": 5000,
            "reopen_delay_ms": 1000,
            "read_failure_limit": 10
          },
          "tracker": {
            "iou_threshold": 0.2,
            "dist_threshold": 0.15,
            "dwell_speed_threshold": 10.0,
            "dwell_min_duration": 1.5,
            "dwell_assistance_threshold": 20.0,
            "avg_person_height_m": 1.7
          },
          "mqtt": {
            "host": "{{mqtt_host}}",
            "port": {{mqtt_port}},
            "client_id": "retail-vision-jetson",
            "username": "",
            "password": "",
            "tls": false
          },
          "streams": [
            {
              "id": "{{stream_id}}",
              "rtsp_url": "{{rtsp_url}}",
              "enabled": true,
              "reconnect_delay_ms": 1000,
              "frame_width": 1280,
              "frame_height": 720,
              "transport": "tcp"
            }
          ]
        }
        EOF

    - name: Build the TensorRT engine for this board
      # A TensorRT plan is tied to the GPU architecture and to the TensorRT
      # build that produced it, so it cannot ship in the image — it is built
      # here, once, into a named volume that later deployments reuse. Takes
      # 2-5 minutes the first time and is skipped afterwards.
      run: |
        set -e
        # The runtime image talks to TensorRT directly and carries no torch or
        # ultralytics — that is why it is 233 MB instead of 2.4 GB. Exporting a
        # .engine still needs ultralytics, so the export runs once in the fat
        # upstream image, pinned by digest, and that image is never part of the
        # running deployment.
        IMAGE=sensecraft-missionpack.seeed.cn/solution/retail-vision-jetson:0.2.0
        BUILDER=crpi-z7h4oz0xl00q2129.cn-hangzhou.personal.cr.aliyuncs.com/lorraine-jetson/yolo11-jetson@sha256:bd17225df0f5bf10d89f945b7730c45d3e7f408f8cc835ee270e775906cff96e
        VOLUME=retail-vision-jetson-models

        if docker run --rm -v "$VOLUME":/models --entrypoint sh "$IMAGE" \
             -c 'test -s /models/yolo11n.engine' 2>/dev/null; then
          echo "TensorRT engine already built, reusing it"
          exit 0
        fi

        echo "Building the TensorRT engine (2-5 minutes, once per board)..."
        docker run --rm --runtime nvidia \
          -e NVIDIA_VISIBLE_DEVICES=all \
          -e NVIDIA_DRIVER_CAPABILITIES=compute,utility \
          -v /usr/local/cuda:/usr/local/cuda:ro \
          -v /usr/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu \
          -v /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra \
          -v /usr/lib/python3.10/dist-packages/tensorrt:/usr/lib/python3.10/dist-packages/tensorrt:ro \
          -v "$VOLUME":/models \
          --entrypoint python3 "$BUILDER" -c '
        import shutil
        from ultralytics import YOLO
        out = YOLO("/app/yolo11n.pt").export(format="engine", half=True, imgsz=640)
        shutil.move(str(out), "/models/yolo11n.engine")
        print("engine written to /models/yolo11n.engine")
        '
        docker run --rm -v "$VOLUME":/models --entrypoint sh "$IMAGE" \
          -c 'ls -l /models/yolo11n.engine'
      name_i18n:
        zh: 为这块板卡编译 TensorRT engine

post_deployment:
  open_browser: false

name_i18n:
  zh: NVIDIA Jetson 检测器
