version: "1.0"
id: hailo_deploy
name: Hailo-8 Detector
type: docker_deploy

detection:
  method: network_scan
  manual_entry: true

docker:
  compose_file: docker/docker-compose.hailo.yml
  remote_path: /home/{{username}}/retail-vision-hailo
  environment:
    STREAMS: "{{stream_id}}|{{rtsp_url}}"
    INSTALLATION_ID: "{{device_name}}"
    MQTT_HOST: "{{mqtt_host}}"
    MQTT_PORT: "{{mqtt_port}}"
  options:
    project_name: retail-vision-hailo
    remove_orphans: true
  services:
    - name: retail-vision
      required: true

ssh:
  default_user: pi

# Fetched from Hailo's own Model Zoo rather than re-hosted, pinned by digest.
# App-side prefetch: the provisioning station downloads this once and pushes
# it over SSH, landing at hailo-models/yolov8n.hef relative to this
# deployment's remote dir (config.id "hailo_deploy" under docker.remote_path)
# — the same directory compose's `./hailo-models` mount resolves against.
# On an offline device this is the only path in; when online it just saves
# the redundant on-device curl below. Old engines that don't know `files:`
# fall through to that curl step unchanged.
files:
  - url: https://hailo-model-zoo.s3.eu-west-2.amazonaws.com/ModelZoo/Compiled/v2.15.0/hailo8/yolov8n.hef
    remote_path: hailo-models/yolov8n.hef
    checksum:
      sha256: 4f250daa6ac16e030cfaaf164e1cbdfe83e5852c81ae6c339c94857dd2b7b8d2

user_inputs:
  - id: rtsp_url
    name: RTSP Camera URL
    type: text
    placeholder: "rtsp://192.168.1.50:554/stream"
    description: RTSP stream of the camera this board watches
    required: true
    name_i18n:
      zh: RTSP 摄像头地址
    description_i18n:
      zh: 这块板子要看的摄像头 RTSP 地址
  - id: device_name
    name: Installation Name
    type: text
    default: "store-01"
    required: true
    row: 1
    description: First segment of the MQTT topic — a store, floor or site name keeps several installations apart on one broker
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
      message: Letters, digits, hyphen and underscore only
    name_i18n:
      zh: 安装点名称
    description_i18n:
      zh: MQTT 主题的第一段——用门店、楼层或站点名区分同一 broker 上的多个安装点
  - id: stream_id
    name: Camera ID
    type: text
    default: "cam-01"
    required: true
    row: 1
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
      message: Letters, digits, hyphen and underscore only
    name_i18n:
      zh: 摄像头编号
  - id: mqtt_host
    name: MQTT Broker
    type: text
    default: "127.0.0.1"
    required: true
    row: 2
    description: Where the dashboard backend runs. Leave at 127.0.0.1 if you deployed it on this same board.
    name_i18n:
      zh: MQTT 服务器
    description_i18n:
      zh: 看板后端所在地址。如果后端就部署在这块板子上，保持 127.0.0.1
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    row: 2
    validation:
      pattern: "^[0-9]{1,5}$"
      message: Port number only
    name_i18n:
      zh: MQTT 端口

pre_checks:
  - type: docker_version
    min_version: "20.0"
    description: Docker must be installed and running
  - type: disk_space
    min_gb: 1
    description: At least 1GB for the detector image

actions:
  before:
    - name: Check the Hailo runtime
      # The plugin, the user library and the kernel driver must be one and the
      # same HailoRT version. Rather than let a mismatch surface as a cryptic
      # runtime failure, fail here and name what is actually installed.
      run: |
        set -e
        if [ ! -c /dev/hailo0 ]; then
          echo "/dev/hailo0 not present — is the Hailo-8 seated and its driver loaded?" >&2
          exit 1
        fi
        if [ ! -f /usr/lib/libhailort.so.4.21.0 ]; then
          echo "libhailort.so.4.21.0 not found — this deployment is ABI-locked to HailoRT 4.21." >&2
          echo "Installed instead:" >&2
          ls /usr/lib/libhailort.so.* 2>/dev/null >&2 || true
          exit 1
        fi
        if [ ! -f /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgsthailo.so ]; then
          echo "libgsthailo.so not found — install the HailoRT GStreamer plugin." >&2
          exit 1
        fi
        cat /sys/module/hailo_pci/version 2>/dev/null || true
        command -v hailortcli >/dev/null 2>&1 && hailortcli fw-control identify 2>/dev/null | head -4 || true
      name_i18n:
        zh: 检查 Hailo 运行时

  after_upload:
    - name: Download the detection model
      # Fetched from Hailo's own Model Zoo rather than re-hosted, and pinned by
      # digest. NMS runs on-chip in this HEF, so the detector only walks the
      # decoded class-0 block — no DFL decode, no CPU NMS.
      #
      # 这一步必须在 after_upload，不能在 before，两个原因：
      #   1. compose 的挂载是 `./hailo-models`，按 **compose 文件所在目录**
      #      解析，而 compose 要等上传之后才在设备上；
      #   2. 引擎上传前会先清理远端目录，before 阶段建的目录会被抹掉。
      run: |
        set -e
        # 老引擎不认设备级 files: 声明时的兜底路径；新引擎已把模型经 files:
        # 放到位，这里的下载会因 sha256 命中而直接跳过。
        # 不要用 {{remote_path}} / {{device_id}}：引擎 action 的模板上下文里
        # 没有这两个变量（base.py:95-108 只放 user_inputs 默认值 + 连接信息），
        # 未命中的 {{}} 被静默替换成空串 → MODELS_DIR=/hailo-models →
        # `mkdir -p` 打在根目录上、非 root 直接 Permission denied，部署停在
        # 这一步（2026-09-20 在 Raspberry Pi 5 上复现）。
        # 改为在已上传的内容里定位 compose 文件，不依赖任何引擎变量；
        # 找不到就明确报错，而不是往错误的位置写。
        ROOT="/home/{{username}}/retail-vision-hailo"
        COMPOSE=$(find "$ROOT" -maxdepth 3 -name 'docker-compose.hailo.yml' -print -quit 2>/dev/null || true)
        if [ -z "$COMPOSE" ]; then
          echo "在 $ROOT 下找不到已上传的 docker-compose.hailo.yml" >&2
          exit 1
        fi
        MODELS_DIR="$(dirname "$COMPOSE")/hailo-models"
        URL=https://hailo-model-zoo.s3.eu-west-2.amazonaws.com/ModelZoo/Compiled/v2.15.0/hailo8/yolov8n.hef
        SHA=4f250daa6ac16e030cfaaf164e1cbdfe83e5852c81ae6c339c94857dd2b7b8d2
        mkdir -p "$MODELS_DIR"
        if [ -s "$MODELS_DIR/yolov8n.hef" ] && \
           echo "$SHA  $MODELS_DIR/yolov8n.hef" | sha256sum -c - >/dev/null 2>&1; then
          echo "model already present and verified"
          exit 0
        fi
        curl -fSL --retry 3 --continue-at - -o "$MODELS_DIR/yolov8n.hef.part" "$URL"
        echo "$SHA  $MODELS_DIR/yolov8n.hef.part" | sha256sum -c -
        mv -f "$MODELS_DIR/yolov8n.hef.part" "$MODELS_DIR/yolov8n.hef"
        ls -l "$MODELS_DIR/yolov8n.hef"
      name_i18n:
        zh: 下载检测模型

post_deployment:
  open_browser: false

name_i18n:
  zh: Hailo-8 检测器
