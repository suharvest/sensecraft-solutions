version: "1.0"
id: rk_deploy
name: Rockchip NPU Detector
type: docker_deploy

detection:
  method: network_scan
  manual_entry: true

docker:
  # Shares the docker/ directory with the backend stack — one copy of the
  # grafana, mosquitto, telegraf and heatmap-demo trees for every preset.
  compose_file: docker/docker-compose.rknn.yml
  remote_path: /home/{{username}}/retail-vision-rknn
  options:
    project_name: retail-vision-rknn
    remove_orphans: true
  services:
    - name: retail-vision
      required: true

ssh:
  default_user: radxa

# The model is the one fall_detection already publishes, reused rather than
# re-hosted. Split into two entries (not one {{board}}-templated entry) so
# each carries its own sha256 and only the board the user actually picked
# gets downloaded. App-side prefetch lands the file at
# rknn-models/<name> relative to this deployment's remote dir (config.id
# "rk_deploy" under docker.remote_path) — the same directory the curl
# fallback below stages into. Offline devices depend on this; online
# devices just skip the redundant curl. Old engines that don't know
# `files:` fall through to that curl step unchanged.
files:
  - url: https://sensecraft-statics.seeed.cc/solution-app/fall_detection/models/yolo11n_pose_rawhead_fp16.rk3588.rknn
    remote_path: rknn-models/yolo11n_pose_rawhead_fp16.rk3588.rknn
    checksum:
      sha256: 22f00270870b25dc013e4e8e39aed98f82bcabb69b9272302280a6b8b8f48d5c
    when:
      field: board
      value: rk3588
  - url: https://sensecraft-statics.seeed.cc/solution-app/fall_detection/models/yolo11n_pose_rawhead_fp16.rk3576.rknn
    remote_path: rknn-models/yolo11n_pose_rawhead_fp16.rk3576.rknn
    checksum:
      sha256: 659519ae8179749925c3f15d978b760f6040a00ae01666c9050036077bac8bbd
    when:
      field: board
      value: rk3576

user_inputs:
  - id: board
    name: Board
    type: select
    default: "rk3588"
    required: true
    description: Picks the model built for this NPU — the wrong one will not load
    options:
      - value: rk3588
        label: RK3588 / RK3588S
      - value: rk3576
        label: RK3576
    name_i18n:
      zh: 板卡型号
    description_i18n:
      zh: 决定下载哪份模型——装错型号的模型加载不了
  - id: rtsp_url
    name: RTSP Camera URL
    type: text
    placeholder: "rtsp://192.168.1.50:554/stream"
    description: RTSP stream of the camera this board watches
    required: true
    name_i18n:
      zh: RTSP 摄像头地址
    description_i18n:
      zh: 这块板子要看的摄像头 RTSP 地址
  - id: device_name
    name: Installation Name
    type: text
    default: "store-01"
    required: true
    row: 1
    description: First segment of the MQTT topic — a store, floor or site name keeps several installations apart on one broker
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
      message: Letters, digits, hyphen and underscore only
    name_i18n:
      zh: 安装点名称
    description_i18n:
      zh: MQTT 主题的第一段——用门店、楼层或站点名区分同一 broker 上的多个安装点
  - id: stream_id
    name: Camera ID
    type: text
    default: "cam-01"
    required: true
    row: 1
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
      message: Letters, digits, hyphen and underscore only
    name_i18n:
      zh: 摄像头编号
  - id: mqtt_host
    name: MQTT Broker
    type: text
    default: "127.0.0.1"
    required: true
    row: 2
    description: Where the dashboard backend runs. Leave at 127.0.0.1 if you deployed it on this same board.
    name_i18n:
      zh: MQTT 服务器
    description_i18n:
      zh: 看板后端所在地址。如果后端就部署在这块板子上，保持 127.0.0.1
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    row: 2
    validation:
      pattern: "^[0-9]{1,5}$"
      message: Port number only
    name_i18n:
      zh: MQTT 端口

pre_checks:
  - type: docker_version
    min_version: "20.0"
    description: Docker must be installed and running
  - type: disk_space
    min_gb: 1
    description: At least 1GB for the detector image

actions:
  after_upload:
    - name: Stage the model and config for this board
      # The model is the one fall_detection already publishes: a single-class
      # DFL head, which is a person detector once the keypoint tensors are
      # ignored. Reused rather than re-hosted, and pinned by digest so a
      # silently swapped file fails here instead of at inference time.
      #
      # 这一步必须在 after_upload，不能在 before：compose 的相对挂载按
      # **compose 文件所在目录** 解析，而 compose 要等上传之后才在设备上；
      # 且引擎上传前会先清理远端目录，before 阶段建的目录会被抹掉。
      run: |
        set -e
        # 老引擎不认设备级 files: 声明时的兜底路径；新引擎已把模型经 files:
        # 放到位，这里的下载会因 sha256 命中而直接跳过；config.json 仍需
        # 在这里生成（内容随 user_inputs 变化，不是可 checksum 的静态资源）。
        # 不要用 {remote_path} / {device_id}：引擎 action 的模板上下文里
        # 没有这两个变量（base.py:95-108 只放 user_inputs 默认值 + 连接信息），
        # 未命中的 {} 被静默替换成空串，路径会打到根目录上（非 root 直接
        # Permission denied）。改为在已上传的内容里定位 compose 文件，不依赖
        # 任何引擎变量；找不到就明确报错，而不是往错误的位置写。
        ROOT="/home/{{username}}/retail-vision-rknn"
        COMPOSE=$(find "$ROOT" -maxdepth 3 -name 'docker-compose.rknn.yml' -print -quit 2>/dev/null || true)
        if [ -z "$COMPOSE" ]; then
          echo "在 $ROOT 下找不到已上传的 docker-compose.rknn.yml" >&2
          exit 1
        fi
        COMPOSE_DIR="$(dirname "$COMPOSE")"
        WORKDIR="$COMPOSE_DIR"
        BASE="https://sensecraft-statics.seeed.cc/solution-app/fall_detection/models"
        mkdir -p "$WORKDIR/rknn-models" "$WORKDIR/rknn-config"

        MODEL="yolo11n_pose_rawhead_fp16.{{board}}.rknn"
        case "{{board}}" in
          rk3588) WANT=22f00270870b25dc013e4e8e39aed98f82bcabb69b9272302280a6b8b8f48d5c ;;
          rk3576) WANT=659519ae8179749925c3f15d978b760f6040a00ae01666c9050036077bac8bbd ;;
          *) echo "unknown board {{board}}" >&2; exit 1 ;;
        esac

        if [ ! -f "$WORKDIR/rknn-models/$MODEL" ] || \
           ! echo "$WANT  $WORKDIR/rknn-models/$MODEL" | sha256sum -c - >/dev/null 2>&1; then
          curl -fsSL -o "$WORKDIR/rknn-models/$MODEL.part" "$BASE/$MODEL"
          echo "$WANT  $WORKDIR/rknn-models/$MODEL.part" | sha256sum -c -
          mv "$WORKDIR/rknn-models/$MODEL.part" "$WORKDIR/rknn-models/$MODEL"
        fi

        cat > "$WORKDIR/rknn-config/config.json" <<EOF
        {
          "installation": "{{device_name}}",
          "backend": "rknn",
          "model_path": "/models/$MODEL",
          "input_size": 640,
          "score_threshold": 0.35,
          "nms_threshold": 0.45,
          "publish_hz": 1.0,
          "window_duration": 60.0,
          "frame_width": 1280,
          "frame_height": 720,
          "video": {
            "backend": "gstreamer_mpp",
            "strict": false,
            "fallback": "gstreamer_soft",
            "codec": "h264",
            "latency_ms": 100,
            "appsink_timeout_ms": 2000,
            "failure_limit": 3
          },
          "tracker": {
            "iou_threshold": 0.2,
            "dist_threshold": 0.15,
            "dwell_speed_threshold": 10.0,
            "dwell_min_duration": 1.5,
            "dwell_assistance_threshold": 20.0,
            "avg_person_height_m": 1.7
          },
          "mqtt": {
            "host": "{{mqtt_host}}",
            "port": {{mqtt_port}},
            "client_id": "retail-vision-{{board}}",
            "username": "",
            "password": "",
            "tls": false
          },
          "streams": [
            {
              "id": "{{stream_id}}",
              "rtsp_url": "{{rtsp_url}}",
              "enabled": true,
              "reconnect_delay_ms": 1000,
              "frame_width": 1280,
              "frame_height": 720
            }
          ]
        }
        EOF
      name_i18n:
        zh: 准备本板卡的模型和配置

post_deployment:
  open_browser: false

name_i18n:
  zh: 瑞芯微 NPU 检测器
