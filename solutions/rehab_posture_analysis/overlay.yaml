architecture_lead:
  zh: 一体化智能相机内置 NPU/TPU 完成姿态估计与运动学生物力学状态机，通过 WebSocket 与 RTSP 输出结构化图元，视频不出摄像头。
  en: The all-in-one smart camera runs pose estimation and kinematics on its built-in
    NPU/TPU, emitting vector primitives over WebSocket and RTSP while video stays
    on device.
  ja: 一体型カメラの内蔵 NPU/TPU で姿勢推定と運動力学を完結し、WebSocket と RTSP でベクトル図元を出力。映像は外に出ません。
architecture_intro:
  zh: '![边缘 AI 康复姿态与动作分析架构](diagrams/architecture-zh.png)


    方案在端侧将深度学习姿态感知与临床生物力学评估解耦为四个功能域：端侧智能相机负责视觉采集与 33 点关键点推理；时相迟滞状态机负责 ROM 关节活动度度量与代偿防抖判定；结构化数据通过
    WebSocket 与 RTSP 直出到现场交互大屏，同时支持 MQTT/Webhook 接入医院 EMR 系统；视频裸流不出摄像头，保障患者隐私。'
  en: '![Edge AI Rehab Posture Analysis Architecture](diagrams/architecture-en.png)


    The solution decouples real-time edge pose perception from clinical biomechanics
    evaluation across four functional domains: smart edge cameras handle on-device
    33-kpt inference; hysteresis state machines compute joint ROM and debounced compensation
    alerts; vector primitives stream over WebSocket and RTSP to live guidance screens,
    with MQTT/Webhook telemetry reaching hospital EMR systems; raw video stays on
    camera to guarantee privacy.'
  ja: '![エッジ AI リハビリ姿勢動作解析の構成](diagrams/architecture-ja.png)


    本ソリューションは、エッジ姿勢認識と臨床バイオメカニクス評価を4つの機能ドメインに分離して処理します。スマートカメラが33点骨格推定を実行し、時系列ステートマシンが関節可動域（ROM）計測と代償動作の誤検知防止を判定。WebSocket
    と RTSP で現場スクリーンに直接出力し、MQTT/Webhook で病院 EMR に連携します。生映像はカメラ外に出ずプライバシーを保護します。'
architecture_tabs:
  en:
  - label: Cameras & Perception
    body: 'reCamera Pro and reCamera 2002 carry the image sensor, lens, and edge accelerator
      in one single unit.


      - **Sensor & Optics**: 1080p RGB sensor with 85° FOV covering full-body standing/sitting
      pose from 2.0 to 3.5 meters.

      - **Edge Neural Network**: Custom YOLO11n-Pose INT8 model inferencing all 33
      full-body landmarks on local NPU/TPU.

      - **Zero Leakage**: Video frames are processed directly in onboard SRAM/DRAM
      and freed immediately. No video stream crosses the network interface.'
  - label: Kinematics & Biomechanics
    body: 'Clinical kinematics state machine tracks Range of Motion (ROM) and pathological
      compensations:


      - **ROM Angles**: Continuous Euclidean 3D joint angle tracking (knee flexion
      0°–180°, shoulder abduction 0°–180°, elbow flexion).

      - **Phase Transitions**: Hysteresis state machine (`READY` → `ASCENT` → `INFLECTION`
      → `DESCENT` → `COMPLETED`) eliminates partial-rep false counts.

      - **Compensation Detection**: 3-frame temporal debounce verifies knee valgus
      (>8°), shoulder shrug (>10°), or excessive trunk lean.'
  - label: Event & Vector Output
    body: 'Clean decoupling between on-camera evaluation and display hosts:


      - **WebSocket 8080**: Emits Result Hub v2 `geometry[]` vector primitives and
      real-time HUD metrics JSON.

      - **RTSP 8554**: Optional H.264 stream with hardware OSD burned-in for standard
      hospital NVR archiving.

      - **HTTP 8080**: Local Web App Center console for live parameter tuning without
      recompilation.'
  zh:
  - label: 摄像头与感知
    body: 'reCamera Pro 与 reCamera 2002 把图像传感器、光学镜头与边缘加速器做在单台设备内：


      - **传感器与光学**：1080p RGB 模组配合 85° 视场角，在 2.0–3.5 米距离覆盖全身站立或坐姿视野。

      - **端侧神经网络**：定制 YOLO11n-Pose INT8 模型在本地 NPU/TPU 上并发推断全身 33 个关键点拓扑。

      - **零泄露隐私**：视频裸流在设备片上内存中推断后立即释放，不对外传输任何原始视频帧。'
  - label: 临床运动学度量
    body: '生物力学时相状态机完成关节活动度（ROM）与病理代偿判定：


      - **ROM 连续测量**：欧氏空间连续关节夹角跟踪（膝屈伸 0°–180°、肩外展 0°–180°、屈肘肌力角）。

      - **动作时相跃迁**：迟滞状态机（`READY` 准备 → `ASCENT` 上升 → `INFLECTION` 顶峰停留 → `DESCENT`
      下降 → `COMPLETED` 完成）杜绝半程刷次数。

      - **防抖代偿检测**：3 帧时序防抖过滤膝内扣（>8°）、耸肩借力（>10°）或躯干过度前倾，触发高亮与扣分。'
  - label: 事件与图元输出
    body: '端侧运算与现场显示系统完全解耦：


      - **WebSocket 8080**：输出 Result Hub v2 `geometry[]` 矢量图元与实时 HUD 指标 JSON。

      - **RTSP 8554**：可选 H.264 视频流配合硬件 OSD 字符烧录，供医院既有 NVR 录像归档。

      - **HTTP 8080**：本地 Web App Center 交互控制台，支持代偿判定阈值在线微调。'
  ja:
  - label: カメラと認識
    body: 'reCamera Pro と reCamera 2002 はイメージセンサー・レンズ・エッジアクセラレータを 1 台に統合しています。


      - **センサーと光学系**：1080p RGB センサーと 85° 視野角により、2.0〜3.5 m の距離で全身の立ち姿や座り姿をカバー。

      - **エッジニューラルネットワーク**：専用 YOLO11n-Pose INT8 モデルが内蔵 NPU/TPU 上で全身 33 箇所の骨格点を推論。

      - **映像漏洩ゼロ**：映像フレームはオンチップメモリで処理後ただちに破棄され、生映像は端末外に出ません。'
  - label: 運動力学計測
    body: 'バイオメカニクスステートマシンが関節可動域（ROM）と代償動作を判定します。


      - **ROM 連続測定**：3次元空間での関節角度連続トラッキング（膝屈伸 0°〜180°、肩外転 0°〜180°、肘屈曲）。

      - **フェーズ遷移**：ヒステリシス状態遷移（準備 → 上昇 → 頂点保持 → 下降 → 完了）で不完全な反復カウントを防止。

      - **代償動作検知**：3フレームの時系列防振フィルタで膝の内倒れ（>8°）や肩のすくみ（>10°）を判定し警告。'
  - label: イベントと出力
    body: 'カメラ側の処理と現場の表示システムを完全に分離しています。


      - **WebSocket 8080**：Result Hub v2 `geometry[]` ベクトル図元とリアルタイム指標 JSON を配信。

      - **RTSP 8554**：ハードウェア OSD 文字焼き込みに対応した H.264 映像ストリーム。

      - **HTTP 8080**：現場で代償判定の閾値を微調整できる Web 管理画面を提供。'
presets_intro:
  zh: '| 套餐 | 画面来源 | 运行主机 | 当前部署的模型 | 实测路数 | 部署说明 |

    |---|---|---|---|---|---|

    | **reCamera Pro** | 自带 | 同机 | YOLO11n-Pose INT8 | 1 | 新一代一体机；检测器在设备 App Center
    分发，支持 3 TOPS NPU 高速推理与动态 ROM 渲染 |

    | **reCamera 2002** | 自带 | 同机 | YOLO11n-Pose INT8 | 1 | 含本地 broker 与 RTSP 8554；轻量级
    cvimodel 骨架估计，安装后独占摄像头设备 |


    两个套餐均把摄像头、模型推理与看板服务做在单台设备内，通电即工作，不需要外接 GPU 主机。

    难度定级 **beginner**；安装到浏览器打开实时画面约 **10 分钟**。'
  en: '| Preset | Video source | Detector host | Model deployed today | Streams |
    Deployment Notes |

    |---|---|---|---|---|---|

    | **reCamera Pro** | Built-in | Same device | YOLO11n-Pose INT8 | 1 | Next-gen
    all-in-one; detector distributed via App Center, 3 TOPS NPU with dynamic ROM rendering
    |

    | **reCamera 2002** | Built-in | Same device | YOLO11n-Pose INT8 | 1 | Includes
    local broker and RTSP 8554; lightweight cvimodel, takes camera exclusively |


    Both packages combine camera optics, neural inference, and HUD servers into one
    all-in-one device. No host PC or cloud needed.

    Difficulty rated **beginner**; takes about **10 minutes** from unboxing to live
    browser HUD.'
  ja: '| プリセット | 映像ソース | 実行ホスト | デプロイされるモデル | 実測系統数 | デプロイ留意事項 |

    |---|---|---|---|---|---|

    | **reCamera Pro** | 内蔵 | 同一端末 | YOLO11n-Pose INT8 | 1 | 新世代一体型機。App Center 経由で配布、3
    TOPS NPU による高速推論と動的 ROM 描画に対応 |

    | **reCamera 2002** | 内蔵 | 同一端末 | YOLO11n-Pose INT8 | 1 | ローカルブローカーと RTSP 8554
    を内包。軽量 cvimodel 実行、カメラリソースを専有 |


    両プリセットともカメラ光学系・推論・HUD サーバーを1台の端末に統合しており、外付け GPU PC は不要です。

    難易度は **beginner**、設置からブラウザでリアルタイム画面を開くまで約 **10 分**です。'
selection_notes:
  zh: '### 怎么选硬件


    - **康复门诊、多人大厅、追求高流畅度动作分析** → 选 **reCamera Pro**。24.0 FPS 高帧率满足连续动态 ROM 测量，关节弧线平滑无拖影。

    - **单人训练角、极简预算、便携巡回康复** → 选 **reCamera 2002**。超紧凑卡片形态，整机功耗仅 3.5W，支持硬件级字符重叠。

    - **数据合规与隐私要求** → 两个预设均 100% 在端侧片上内存推断，视频裸流不出摄像头，断网完全可用。


    部署前准备：相机需固定在患者正前方 **2.0–3.5 米**、高度 **1.2–1.5 米**平视位置；躯干与主要关节须在镜头视野内完整入镜；避免正对强逆光光源。'
  en: '### Choosing a Hardware Preset


    - **Outpatient clinics, kinesiology gyms, fluid visual feedback** → Choose **reCamera
    Pro**. RV1126B delivers 24.0 FPS with smooth ROM arc tracking and dual-view clinical
    metrics.

    - **Home training, budget sensitive, portable evaluation** → Choose **reCamera
    2002**. Ultra-compact card form factor with only 3.5W power consumption and hardware
    OSD overlay.

    - **Strict patient privacy & compliance** → Both presets process video strictly
    in local RAM. Zero frames leave the device; full offline operation.


    Pre-deployment checklist: Mount the camera at **1.2–1.5 m** height, directly facing
    the patient at **2.0–3.5 m** distance. Torso and limbs must remain visible inside
    the FOV; avoid strong backlight.'
  ja: '### ハードウェアの選び方


    - **外来リハビリ室・運動療法・高フレームレート重視** → **reCamera Pro** を選択。24.0 FPS の滑らかな追従で動的 ROM 弧線を描画し、素早い動作も欠落なく測定。

    - **在宅訓練・コスト重視・持ち運び運用** → **reCamera 2002** を選択。名刺サイズの超小型設計、消費電力わずか 3.5W で動作。

    - **プライバシー保護とオフライン要件** → いずれのプリセットも端末内メモリ完結で推論。映像は外部に出ず、完全オフラインで動作可能。


    設置前の確認事項：患者の正面 **2.0〜3.5 m**、高さ **1.2〜1.5 m** の平視位置に固定してください。胴体と主要関節が画角内に収まる必要があり、強い逆光を避けて設置します。'
results:
  zh: '真实临床复健动作视频集上的工程基准，**辅助动作规范指导，不作医疗诊断依据**。


    | 现场能得到什么 | 实测典型值 | 硬件基准 |

    |---|---|---|

    | 全身骨骼关键点数 | **33 个全量关键点** | BlazePose 标准拓扑（含手腕、足踝、足尖） |

    | reCamera Pro 实时推理帧率 | **24.0 FPS** (41.7 ms) | RV1126B NPU, INT8 量化 |

    | reCamera 2002 实时推理帧率 | **13.3 FPS** (71.1 ms) | SG2002 TPU, 硬件首层融合 INT8 |

    | 关节活动度（ROM）角度误差 | **< 2.5°** | 对照物理量角器基准 |

    | 半程动作与抖动误报拦截率 | **96.8%** | 3 帧时序防抖与迟滞状态机 |

    | 视频数据外泄风险 | **0** | 纯端侧计算，对外仅输出矢量图元 |


    两个套餐在 2.0–3.5 米距离下骨骼跟踪稳定性一致。选硬件看所需帧率与展示终端，不看准确率。

    '
  en: 'Engineering benchmark on clinical rehabilitation videos — **assistive movement
    guide, not medical diagnosis**.


    | Metric | Benchmark | Hardware Baseline |

    |---|---|---|

    | Tracked Keypoints | **33 Keypoints** | Full BlazePose topology (wrists, ankles,
    toes) |

    | reCamera Pro Inference Rate | **24.0 FPS** (41.7 ms) | RV1126B NPU, INT8 quantized
    |

    | reCamera 2002 Inference Rate | **13.3 FPS** (71.1 ms) | SG2002 TPU, hardware-fused
    INT8 |

    | ROM Angle Measurement Error | **< 2.5°** | Calibrated against clinical goniometers
    |

    | Partial Repetition Rejection | **96.8%** | 3-frame debounce & hysteresis state
    machine |

    | Video Leakage Risk | **Zero** | 100% on-device memory, vectors only |

    '
  ja: '臨床リハビリ動作動画によるエンジニアリング実測値 —— **動作指導の補助であり医療診断用ではありません**。


    | 測定項目 | 代表値 | ハードウェア構成 |

    |---|---|---|

    | トラッキング骨格点数 | **33 箇所完全点** | BlazePose 標準トポロジー（手首・足首・つま先） |

    | reCamera Pro 推論フレームレート | **24.0 FPS** (41.7 ms) | RV1126B NPU, INT8 量子化 |

    | reCamera 2002 推論フレームレート | **13.3 FPS** (71.1 ms) | SG2002 TPU, ハードウェア融合 INT8
    |

    | ROM 関節角度測定誤差 | **2.5° 未満** | 物理ゴニオメーター較正基準 |

    | 不完全な反復の排除率 | **96.8%** | 3フレーム防振ステートマシン |

    | 映像流出リスク | **ゼロ** | 端末内メモリ完結、ベクトル図元のみ出力 |

    '
outputs:
  zh: '部署完就靠这两个接口接数据与画面。


    | 接口 / 端口 | 协议 / 格式 | 内容说明 |

    |---|---|---|

    | `:8080/ws` | WebSocket JSON | 每帧输出 Result Hub v2 `geometry[]` 矢量骨架点与实时 HUD 指标
    |

    | `:8080/appcenter` | HTTP Web 页面 | 本地交互控制台，支持实时画面查看与代偿阈值在线微调 |

    | `:8554/live0` | RTSP H.264 | 摄像头实时视频流，支持硬件 OSD 字符烧录 |


    对外推送的 WebSocket JSON 仅包含 33 关键点坐标与关节夹角数值，**没有视频图片裸流**，带宽消耗低于 20 KB/s。

    '
  en: 'Once deployed, these interfaces deliver all metrics and visualization.


    | Interface / Port | Protocol / Format | Description |

    |---|---|---|

    | `:8080/ws` | WebSocket JSON | Emits Result Hub v2 `geometry[]` skeleton points
    and real-time HUD metrics |

    | `:8080/appcenter` | HTTP Web Page | Local console for live inspection and online
    compensation threshold tuning |

    | `:8554/live0` | RTSP H.264 | Camera RTSP stream with hardware OSD burned-in
    |


    The WebSocket JSON contains only 33 coordinate pairs and joint angles, **carrying
    zero video bytes**, using under 20 KB/s bandwidth.

    '
  ja: '導入後は、これらのインターフェースから指標と映像を取得します。


    | インターフェース / ポート | プロトコル / 形式 | 説明 |

    |---|---|---|

    | `:8080/ws` | WebSocket JSON | Result Hub v2 `geometry[]` 骨格ベクトルとリアルタイム HUD 指標を出力
    |

    | `:8080/appcenter` | HTTP Web 画面 | ライブ確認および代償閾値のオンライン微調整画面 |

    | `:8554/live0` | RTSP H.264 | ハードウェア OSD 焼き込み対応のカメラ RTSP ストリーム |

    '
extensibility:
  zh: '这套设计的可复用单元是「**33 点姿态估计 → 连续关节夹角度量 → 迟滞时相状态机 → 病理代偿检测**」全链路。


    | 层级 | 移植到其他动作时你要做的 |

    |---|---|

    | 相机硬件与 NPU/TPU 运行时 | 直接复用 |

    | 33 关键点全身姿态模型 | 直接复用 |

    | WebSocket 矢量图元传输与 HUD 前端 | 直接复用 |

    | 目标关节与 ROM 计算公式 | **按新动作选择关节点**（如肘屈曲、肩外展、深蹲） |

    | 时相状态机阈值与代偿规则 | **配置动作阈值**（如膝外翻夹角、耸肩抬升角） |


    同一链路可直接扩展至：术后步态对称性分析、下肢力量坐立测试、肩袖损伤康复评估与工位人体工效学姿态监测。'
  en: 'The reusable asset is the pipeline **33-Keypoint Pose → Joint ROM Kinematics
    → Hysteresis State Machine → Compensation Detector**.


    | Layer | What porting costs you |

    |---|---|

    | Camera hardware and NPU/TPU runtime | Reuse as-is |

    | 33-Keypoint pose model | Reuse as-is |

    | WebSocket vector streamer & HUD UI | Reuse as-is |

    | Target joint angle formulas | **Select joint triplets** for the new exercise
    |

    | State machine thresholds | **Configure thresholds** (e.g. valgus angle, shrug
    angle) |'
  ja: '再利用できる単位は「**33点姿勢推定 → 関節可動域計測 → 状態遷移マシン → 代償動作検知**」のチェーンです。


    | レイヤー | 移植時に必要な作業 |

    |---|---|

    | カメラハードウェアと推論基盤 | そのまま再利用 |

    | 33点骨格モデル | そのまま再利用 |

    | WebSocket 図元配信と HUD 画面 | そのまま再利用 |

    | 対象関節の角度計算 | **新しい動作に合わせて関節を選択** |

    | 状態遷移の閾値設定 | **動作ごとの閾値を設定** |'
faq:
- q: 摄像头在家里或诊室使用，患者隐私如何保障？
  q_i18n:
    en: How is patient privacy guaranteed when cameras are used in home or clinic?
    ja: 自宅や診察室でカメラを使用する際、患者のプライバシーはどのように保護されますか？
  a: 算法完全运行在 reCamera 内部 NPU/TPU 片上内存中。视频帧提取关键点后即时销毁释放，对外仅输出骨骼坐标与夹角数值，裸流绝不出摄像头。
  a_i18n:
    en: Inference runs strictly in reCamera onboard NPU/TPU RAM. Video frames are
      discarded immediately after keypoint extraction. Only vector coordinates and
      angles are emitted.
    ja: 推論は reCamera 内蔵の NPU/TPU メモリ内で完結します。映像フレームは骨格点抽出後に直ちに破棄され、外部には座標と角度数値のみが出力されます。
- q: 偷工减料做半蹲或做一半动作，会被算作完成一次吗？
  q_i18n:
    en: Will partial or incomplete movements be falsely counted as a repetition?
    ja: 不完全なスクワットや浅い曲げ伸ばしでも回数としてカウントされてしまいますか？
  a: 不会。系统内置迟滞时相状态机，严格要求动作达到预设 ROM 峰值且稳定停留，并在回落至起始位后才计入一次有效完成。
  a_i18n:
    en: No. The hysteresis state machine requires passing the clinical ROM threshold,
      holding inflection, and returning to baseline before incrementing the rep count.
    ja: カウントされません。ヒステリシス状態遷移マシンにより、規定の可動域に達して頂点を保持し、初期位置に戻って初めて 1 回としてカウントされます。
- q: 患者代偿动作较多时，如何给出纠错反馈？
  q_i18n:
    en: How does the system provide corrective feedback when compensations occur?
    ja: 代償動作が多く発生した際、システムはどのようにフィードバックを行いますか？
  a: 现场 HUD 画面中的对应骨骼与关节即时变红高亮闪烁，并显示醒目纠错文字。同时可通过 WebSocket 将代偿事件联动给现场语音播报设备。
  a_i18n:
    en: The compensating joints flash in red on the local HUD screen with visible
      guidance text. Compensation events can also trigger local voice prompts via
      WebSocket.
    ja: 現場の HUD 画面上で該当する関節が赤色で点滅警告され、指導テキストが表示されます。WebSocket 経由で音声案内端末と連動することも可能です。
- q: 可以接入医院既有的康复信息系统或大屏吗？
  q_i18n:
    en: Can this integrate with existing hospital rehabilitation management or EMR
      systems?
    ja: 病院の既存のリハビリ管理システムや大型モニターに接続できますか？
  a: 可以。系统提供标准 WebSocket JSON 流输出关节矢量与指标，并支持 RTSP 视频流与硬件 OSD 字符烧录，可直接接入医院电子病历或大屏系统。
  a_i18n:
    en: Yes. Standard WebSocket JSON streams emit all vector primitives and clinical
      metrics, with RTSP video and OSD for direct hospital dashboard and EMR integration.
    ja: 可能です。標準 WebSocket JSON で骨格データと指標を出力し、RTSP 映像と OSD 焼き込みにも対応しているため、既存の電子カルテや管理画面に直接接続できます。
