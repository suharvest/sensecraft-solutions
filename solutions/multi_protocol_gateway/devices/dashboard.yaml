version: "1.0"
id: dashboard
name: Open Multi-Protocol Data Hub
name_i18n:
  zh: 打开多协议数据中枢
type: web_dashboard
inherit_host_from: gateway
user_inputs:
  - id: http_port
    name: Web Console Port
    name_i18n:
      zh: 管理界面端口
    default: "8280"
    default_template: "{{http_port}}"
web_dashboard:
  url: "http://{{deploy.host}}:{{http_port}}"
  title: Industrial Multi-Protocol Data Hub
  title_i18n:
    zh: 工业多协议数据中枢
  description: Integrate field protocols into one point model and one MQTT read/write interface.
  description_i18n:
    zh: 将现场协议汇入一套点位模型，并通过统一 MQTT 接口读取与控制。
