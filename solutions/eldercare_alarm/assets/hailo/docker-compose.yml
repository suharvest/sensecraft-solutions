# Raspberry Pi 5 / reComputer R + Hailo-8: edgefallkit inference + the
# eldercare alarm service + a local broker, on one device.
#
# Derived from eldercare-alarm/compose.hailo.yml, with the same two changes as
# the Orin file: the alarm service comes from a registry tag instead of a local
# build context, and config paths follow assets/<platform>/config.
#
# ABI lock: the GStreamer plugin, the HailoRT user library and the kernel
# driver must all be the same HailoRT version. The image contains none of them
# — the host's are mounted read-only so they cannot drift apart.
services:
  fall-detection:
    # Base image, published by the edgefallkit project. Tag from
    # eldercare-alarm/release/PINNING.md; digest recorded there as pending
    # on-device verification, so this is a tag reference. Repin by digest once
    # a device has pulled it.
    image: sensecraft-missionpack.seeed.cn/solution/fall-detection-rpi-hailo:0.1.0-rc3
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mosquitto
    devices:
      - /dev/hailo0:/dev/hailo0
    environment:
      HAILO_BATCH_MODE: ${HAILO_BATCH_MODE:-auto}
      HAILO_BATCH_WAIT_MS: ${HAILO_BATCH_WAIT_MS:-20}
      HEF_PATH: ${HEF_PATH:-/models/yolov8s_pose.hef}
      # Semicolon-separated id|URL entries; add more for multi-stream use.
      STREAMS: "${STREAMS:-cam-01|rtsp://192.168.1.10:554/stream1}"
      RTSP_LATENCY_MS: ${RTSP_LATENCY_MS:-100}
      MQTT_HOST: ${MQTT_HOST:-127.0.0.1}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-recomputer/fall-detection/results/{stream_id}}
      SCORE_THRESHOLD: ${SCORE_THRESHOLD:-0.35}
      KEYPOINT_THRESHOLD: ${KEYPOINT_THRESHOLD:-0.25}
      # This platform has no publish_empty_frames switch and needs none: the
      # publish call has no empty-frame filter, so frames are published even
      # with nobody in view and the no_person timeout gets its input.
      # (eldercare-alarm/release/PINNING.md, "publish_empty_frames 覆盖".)
    volumes:
      - ./models:/models:ro
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgsthailo.so:/usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgsthailo.so:ro
      - /usr/lib/libhailort.so.4.21.0:/usr/lib/libhailort.so.4.21.0:ro
    healthcheck:
      test: ["CMD-SHELL", "test -c /dev/hailo0 && test -r \"$$HEF_PATH\""]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    network_mode: host
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - eldercare-mosquitto:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  eldercare-alarm:
    # NOT PUSHED YET — same situation as the Orin compose. This tag does not
    # exist in the registry as of packaging (2026-09-05); build it from
    # eldercare-alarm/docker/Dockerfile and retag, or push it, before
    # deploying this preset.
    image: sensecraft-missionpack.seeed.cn/solution/eldercare-alarm-arm64:0.1.0
    command: ["--config", "/config/config.yaml"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mosquitto
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config/eldercare.yaml:/config/config.yaml:ro
      - eldercare-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  eldercare-data:
  eldercare-mosquitto:
