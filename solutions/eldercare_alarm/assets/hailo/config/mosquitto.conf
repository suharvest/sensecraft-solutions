# Local broker carrying the edgefallkit result stream and, optionally, the
# alarm notifications published back by eldercare-alarm.
#
# Copied from eldercare-alarm/deploy/mosquitto.conf. Persistence is on so a
# broker restart does not drop retained availability messages.
#
# allow_anonymous is for a trusted LAN during commissioning only. Before this
# device is reachable from anywhere else, switch to credentials and TLS:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
# and set the Broker Username / Broker Password fields in the deploy form.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
