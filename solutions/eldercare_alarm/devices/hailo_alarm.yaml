version: "1.0"
id: hailo_alarm
name: reComputer R with Hailo-8
type: docker_deploy
device_class: hailo

docker:
  compose_file: assets/hailo/docker-compose.yml
  compose_dir: assets/hailo
  options:
    project_name: eldercare_alarm_hailo
    remove_orphans: true
  services:
    - name: fall-detection
      required: true
    - name: mosquitto
      port: 1883
      required: true
    - name: eldercare-alarm
      port: 8080
      required: true

ssh:
  port: 22
  default_user: pi
  auth_methods:
    - password
  connection_timeout: 30
  command_timeout: 1800

pre_checks:
  - type: disk_space
    min_gb: 6
    description: Two runtime images, the pose HEF and the SQLite audit store live on the device

# Wall-clock budget for the whole deploy on this device. No engine build here —
# the HEF is downloaded, so a normal run finishes in minutes; this is headroom
# for a slow link, not a target.
deploy_timeout: 1800

post_deployment:
  open_browser: false

name_i18n:
  zh: reComputer R（Hailo-8）

remote_overrides:
  remote_path: /home/{{username}}/eldercare-alarm-hailo
  compose_dir: assets/hailo
  detection:
    method: network_scan
    manual_entry: true

  actions:
    before:
      - name: Validate the Hailo runtime
        run: |
          set -e
          if [ ! -c /dev/hailo0 ]; then
            echo "No /dev/hailo0 — the Hailo accelerator is not present or its driver is not loaded" >&2
            exit 1
          fi
          # The compose file pins libhailort.so.4.21.0. Plugin, user library and
          # driver have to move together, so a different minor version needs all
          # three changed rather than just this mount.
          if [ ! -f /usr/lib/libhailort.so.4.21.0 ]; then
            echo "libhailort.so.4.21.0 not found — this deployment is ABI-locked to HailoRT 4.21." >&2
            echo "Installed HailoRT:" >&2
            ls /usr/lib/libhailort.so.* 2>/dev/null >&2 || true
            exit 1
          fi
          if [ ! -f /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgsthailo.so ]; then
            echo "libgsthailo.so not found — install the HailoRT GStreamer plugin." >&2
            exit 1
          fi
          command -v hailortcli >/dev/null 2>&1 && hailortcli fw-control identify 2>/dev/null | head -4 || true
          echo "Hailo runtime OK"
        name_i18n:
          zh: 校验 Hailo 运行环境

      - name: Ensure docker compose command
        sudo: true
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin present"
            exit 0
          fi
          if docker-compose --version >/dev/null 2>&1; then
            for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins /root/.docker/cli-plugins; do
              mkdir -p "$d"
              ln -sf "$(command -v docker-compose)" "$d/docker-compose"
            done
            echo "linked standalone docker-compose into the cli-plugins path"
            exit 0
          fi
          apt-get update
          apt-get install -y docker-compose-plugin || \
            apt-get install -y docker-compose-v2 || \
            apt-get install -y docker-compose
          docker compose version
        name_i18n:
          zh: 确保 docker compose 可用

    after_upload:
      - name: Fetch the pose model
        timeout: 900
        run: |
          set -e
          WORKDIR="/home/{{username}}/eldercare-alarm-hailo/hailo_alarm"
          MODELS_DIR="$WORKDIR/models"
          # Official Hailo Model Zoo v2.15 build for Hailo-8, pinned by digest.
          URL=https://hailo-model-zoo.s3.eu-west-2.amazonaws.com/ModelZoo/Compiled/v2.15.0/hailo8/yolov8s_pose.hef
          SHA=e19856699ed47cf866d23265827f960b263f287dab5e54e82c7ce37e12525a2d
          mkdir -p "$MODELS_DIR"

          if [ -s "$MODELS_DIR/yolov8s_pose.hef" ] && \
             echo "$SHA  $MODELS_DIR/yolov8s_pose.hef" | sha256sum -c - >/dev/null 2>&1; then
            echo "HEF already present"
            exit 0
          fi
          curl -fSL --retry 3 --continue-at - -o "$MODELS_DIR/yolov8s_pose.hef.part" "$URL"
          echo "$SHA  $MODELS_DIR/yolov8s_pose.hef.part" | sha256sum -c -
          mv -f "$MODELS_DIR/yolov8s_pose.hef.part" "$MODELS_DIR/yolov8s_pose.hef"
          ls -l "$MODELS_DIR/yolov8s_pose.hef"
        name_i18n:
          zh: 获取姿态模型

      - name: Write the detector configuration
        run: |
          set -e
          WORKDIR="/home/{{username}}/eldercare-alarm-hailo/hailo_alarm"
          # This runtime is configured through the environment rather than a
          # config file, so the values go into the compose .env. There is no
          # publish_empty_frames key here and none is needed: the publish call
          # has no empty-frame filter, so the no_person timeout still gets
          # frames when the room is empty.
          cat > "$WORKDIR/.env" <<EOF
          STREAMS={{stream_id}}|{{rtsp_url}}
          MQTT_HOST={{broker_host}}
          MQTT_PORT={{broker_port}}
          MQTT_USERNAME={{broker_username}}
          MQTT_PASSWORD={{broker_password}}
          MQTT_TOPIC={{device_name}}/fall-detection/results/{stream_id}
          EOF
          echo "wrote $WORKDIR/.env:"
          sed -e 's/:[^@/]*@/:****@/' -e 's/^MQTT_PASSWORD=.*/MQTT_PASSWORD=****/' "$WORKDIR/.env"
        name_i18n:
          zh: 写入检测器配置

      - name: Write the alarm service configuration
        # Rewrites config/eldercare.yaml from the form values. The uploaded
        # copy is the documented default; this replaces it wholesale rather
        # than patching, so there is exactly one thing to read on the device
        # when a timeout behaves unexpectedly.
        run: |
          set -e
          WORKDIR="/home/{{username}}/eldercare-alarm-hailo/hailo_alarm"
          CONFIG="$WORKDIR/config/eldercare.yaml"
          python3 - "$CONFIG" <<'PY'
          import os, sys

          path = sys.argv[1]
          no_person_sec = int(float("{{no_person_timeout_min}}") * 60)
          no_motion_sec = int(float("{{no_motion_timeout_min}}") * 60)
          webhook = "{{webhook_url}}".strip()

          lines = [
              "# Generated by the eldercare_alarm deploy step. Edit on the device.",
              "zones:",
              "  - id: {{zone_id}}",
              "    name: {{zone_id}}",
              "    rect: [0.0, 0.0, 1.0, 1.0]",
              '    stream_ids: ["{{stream_id}}"]',
              f"    no_person_timeout_sec: {no_person_sec}",
              f"    no_motion_timeout_sec: {no_motion_sec}",
              "    motion_threshold: 0.02",
              "    enabled: true",
              "statemachine:",
              "  evidence_sec: 5.0",
              "  confirm_window_sec: 60.0",
              "  notify_deadline_sec: 5.0",
              "  retry_interval_sec: 30.0",
              "  rearm_sec: 120.0",
              "  confirm_timeout_action: confirmed",
              "mqtt:",
              '  host: "{{broker_host}}"',
              "  port: {{broker_port}}",
              '  username: "{{broker_username}}"',
              '  password: "{{broker_password}}"',
              "  client_id: eldercare-alarm",
              "  keepalive_sec: 30",
              "  qos: 1",
              "  tls: false",
              "  subscriptions:",
              '    "{{device_name}}/fall-detection/results/+": fall_result_v1',
              "notifiers:",
          ]
          if webhook:
              lines += [
                  "  - name: ops-webhook",
                  "    type: webhook",
                  "    enabled: true",
                  "    options:",
                  f"      url: \"{webhook}\"",
                  "      timeout_sec: 5.0",
              ]
          else:
              lines += ["  []"]
          lines += [
              "store:",
              "  path: /data/eldercare.sqlite",
              "  event_retention_days: 90",
              "  media_retention_days: 7",
              "  purge_interval_sec: 3600",
              "  rate_limit: 5",
              "  rate_limit_window_sec: 600",
              "web:",
              "  host: 0.0.0.0",
              "  port: 8080",
              "  media_dir: /data/media",
              "  snapshot_enabled: false",
              "",
          ]

          tmp = path + ".tmp"
          with open(tmp, "w") as handle:
              handle.write("\n".join(lines))
          os.replace(tmp, path)
          print(f"zone           = {{zone_id}}")
          print(f"no_person_sec  = {no_person_sec}")
          print(f"no_motion_sec  = {no_motion_sec}")
          print(f"webhook        = {'configured' if webhook else 'none'}")
          PY
        name_i18n:
          zh: 写入告警服务配置

    after:
      - name: Verify the alarm service is receiving results
        # Deploy-time health check: the accelerator has to be up, the detector
        # has to publish on the topic the alarm service subscribes to, and the
        # alarm service's API has to answer. Any of the three failing is a
        # deployment failure.
        timeout: 300
        run: |
          set -e
          APP=eldercare_alarm_hailo-fall-detection-1
          BROKER=eldercare_alarm_hailo-mosquitto-1
          TOPIC="{{device_name}}/fall-detection/results/{{stream_id}}"
          echo "Waiting for the detector and the first MQTT result ..."
          OK=0
          for i in $(seq 1 40); do
            # Split the Docker Go-template braces so the solution template
            # renderer does not treat them as a user-input placeholder.
            STATUS=$(docker inspect "$APP" --format '{''{.State.Health.Status}}' 2>/dev/null || true)
            if [ "$STATUS" = healthy ]; then
              if docker exec "$BROKER" mosquitto_sub -h 127.0.0.1 -t "$TOPIC" -C 1 -W 10 >/dev/null 2>&1; then
                echo "Detector result received on $TOPIC"
                OK=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$OK" != 1 ]; then
            STATUS=$(docker inspect "$APP" --format '{''{.State.Health.Status}}' 2>/dev/null || true)
            echo "container health=${STATUS:-unknown}"
            docker logs --tail 40 "$APP" 2>&1 || true
            echo "No detector result on $TOPIC — check the RTSP URL and the container logs." >&2
            exit 1
          fi
          echo "Checking the alarm service API ..."
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/api/alarms >/dev/null; then
              echo "Alarm service answering on http://127.0.0.1:8080/api/alarms"
              exit 0
            fi
            sleep 5
          done
          echo "Alarm service did not answer on port 8080." >&2
          docker logs --tail 40 eldercare_alarm_hailo-eldercare-alarm-1 2>&1 || true
          exit 1
        name_i18n:
          zh: 验证告警服务已收到检测结果

  user_inputs:
    - id: host
      name: Device IP
      type: text
      required: true
      placeholder: "192.168.1.100"
      name_i18n:
        zh: 设备 IP
    - id: username
      name: SSH Username
      type: text
      default: pi
      required: true
      description: "Depends on the image — commonly pi, recomputer or ubuntu."
      name_i18n:
        zh: SSH 用户名
      description_i18n:
        zh: "取决于系统镜像，常见的是 pi、recomputer 或 ubuntu。"
    - id: password
      name: SSH Password
      type: password
      required: true
      name_i18n:
        zh: SSH 密码
    - id: device_name
      name: Device Name
      type: text
      default: "recomputer"
      required: true
      description: First segment of the MQTT topic — name this device however you like (product line, room, or site) so several installations stay separable
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
      name_i18n:
        zh: 设备名称
      description_i18n:
        zh: MQTT 主题的第一段——按你自己的习惯给这台设备取名（产品线、房间或站点都行），多套装置就不会混在一起
    - id: rtsp_url
      name: Camera RTSP URL
      type: text
      required: true
      placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
      description: Test this address in VLC first — a wrong path or wrong credentials is the most common failure
      name_i18n:
        zh: 摄像头 RTSP 地址
      description_i18n:
        zh: 先用 VLC 测一下这个地址——路径或用户名密码写错是最常见的失败原因
    - id: stream_id
      name: Stream ID
      type: text
      default: "cam-01"
      required: true
      description: Appended to the MQTT topic and bound to the zone below, so several cameras stay separable
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
      name_i18n:
        zh: 流编号
      description_i18n:
        zh: 会拼在 MQTT 主题后面，并与下面的区域绑定，用于区分多路摄像头
    - id: broker_host
      name: MQTT Broker Host
      type: text
      default: "127.0.0.1"
      required: true
      description: Leave as 127.0.0.1 to use the broker this stack starts on the device. Point it at an existing broker to merge this installation into one you already run.
      name_i18n:
        zh: MQTT Broker 地址
      description_i18n:
        zh: 保持 127.0.0.1 就使用本套栈在设备上启动的 broker；填其他地址则接入你已有的 broker。
    - id: broker_port
      name: MQTT Broker Port
      type: text
      default: "1883"
      required: true
      validation:
        pattern: "^[0-9]{1,5}$"
      name_i18n:
        zh: MQTT Broker 端口
    - id: broker_username
      name: MQTT Username
      type: text
      required: false
      description: Leave empty for the bundled broker, which accepts anonymous connections on the LAN
      name_i18n:
        zh: MQTT 用户名
      description_i18n:
        zh: 使用内置 broker 时留空——它在局域网内允许匿名连接
    - id: broker_password
      name: MQTT Password
      type: password
      required: false
      name_i18n:
        zh: MQTT 密码
    - id: zone_id
      name: Zone Name
      type: text
      default: "bedroom"
      required: true
      description: The area this camera watches. The deploy creates one zone covering the whole frame; split it into sub-rectangles on the device afterwards if one camera covers two rooms.
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
      name_i18n:
        zh: 区域名称
      description_i18n:
        zh: 这台摄像头看护的区域。部署会建立一个覆盖整幅画面的区域；若一台摄像头覆盖两个房间，之后在设备上把它拆成多个矩形。
    - id: no_person_timeout_min
      name: No-person Timeout (minutes)
      type: text
      default: "60"
      required: true
      description: How long the zone may stay empty before an alarm is raised. Set it above the longest normal absence — a bathroom zone needs a much shorter value than a bedroom.
      validation:
        pattern: "^[0-9]+(\\.[0-9]+)?$"
      name_i18n:
        zh: 无人超时（分钟）
      description_i18n:
        zh: 区域内允许持续无人多久才告警。要设得高于正常的离开时长——卫生间区域应远短于卧室。
    - id: no_motion_timeout_min
      name: No-motion Timeout (minutes)
      type: text
      default: "30"
      required: true
      description: How long a person may stay in the zone without moving before an alarm is raised. Sleeping hours will trip this unless the zone excludes the bed or the value covers a nap.
      validation:
        pattern: "^[0-9]+(\\.[0-9]+)?$"
      name_i18n:
        zh: 静止超时（分钟）
      description_i18n:
        zh: 区域内有人但持续不动多久才告警。睡眠时段会触发它，除非区域排除床位或阈值覆盖一次午睡。
    - id: webhook_url
      name: Webhook URL
      type: text
      required: false
      placeholder: "http://192.168.1.50:9099/alarm"
      description: Where a confirmed alarm is POSTed. The payload carries the alarm id, kind, zone, stream, timestamp and operator — no snapshot and no video. Leave empty to record alarms in the UI only.
      name_i18n:
        zh: Webhook 地址
      description_i18n:
        zh: 确认后的告警 POST 到哪里。负载只含告警 id、类型、区域、流、时间戳与操作者，不含快照或视频。留空则只在界面里记录。
