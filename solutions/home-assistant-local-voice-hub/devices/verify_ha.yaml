version: "1.0"
id: verify_ha
name: Verify Home Assistant
name_i18n: {zh: 验证 Home Assistant}
type: web_dashboard
web_dashboard:
  url: "http://{{ha_host}}:{{ha_port}}/"
  title: Home Assistant
  title_i18n: {zh: Home Assistant}
  description: Open Home Assistant and execute the documented local voice check after the physical integrations are configured.
  description_i18n: {zh: 配置实体后打开 Home Assistant，并执行文档中的本地语音检查。}
user_inputs:
  - {id: ha_host, name: Home Assistant host, name_i18n: {zh: Home Assistant 主机地址}, type: text, required: true}
  - id: ha_port
    name: Home Assistant port
    name_i18n: {zh: Home Assistant 端口}
    type: text
    required: true
    default: "8123"
    default_template: "{{ha_port}}"
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    description: Auto-filled from the port entered in the deploy step; change it only if you reinstalled on a different port.
    description_i18n: {zh: 自动带入部署步骤填写的端口；仅在改用其他端口重装时修改。}
