version: "1.0"
id: ha_connect_cloud
name: Connect the voice host to Home Assistant
name_i18n: {zh: 把语音主机接入 Home Assistant}
type: ha_integration
# Configures Home Assistant over its HTTP / WebSocket API from the deploying
# machine (needs app_collaboration with ha_integration entries/pipeline,
# contract v7). Nothing is copied to or run on the Home Assistant host or the
# voice host, so the HA password and the LLM API key never appear on a command
# line (app_collaboration issue #115) and the key reaches only Home Assistant.
#  - two Wyoming entries (speech-to-text, text-to-speech) on the voice host;
#  - LiteLLM entry + conversation agent, only when an API key is entered
#    (skip_if_empty); without a key the guide's manual LiteLLM step applies;
#  - Assist pipeline "Home Voice" (preferred) with those services, local
#    command handling on, and the LiteLLM agent when it was added.
# Re-deploys reuse the entries (matched by title) and update the pipeline.
inherit_host_from: rk_voice_deploy
ha_integration:
  entries:
    - id: stt
      domain: wyoming
      title: "Speech-to-text {{voice_host}}:{{wyoming_stt_port}}"
      data:
        - {name: host, value_from: voice_host}
        - {name: port, value_from: wyoming_stt_port, type: int}
    - id: tts
      domain: wyoming
      title: "Text-to-speech {{voice_host}}:{{wyoming_tts_port}}"
      data:
        - {name: host, value_from: voice_host}
        - {name: port, value_from: wyoming_tts_port, type: int}
    - id: llm
      domain: litellm
      title: "{{llm_base_url}}"
      skip_if_empty: [llm_api_key]
      data:
        - {name: url, value_from: llm_base_url}
        - {name: api_key, value_from: llm_api_key}
      subentries:
        - id: agent
          type: conversation
          title_from_field: model
          data:
            - {name: model, value_from: llm_model}
            - name: prompt
              value: >-
                You are the home voice assistant. Answer briefly in spoken
                language, in the language the user speaks. You cannot control
                devices in the home and cannot see their state. When the user
                asks you to switch or adjust a device, do not say it is done;
                ask them to say it again using the device's exact name.
            # "Control Home Assistant" off: an empty list, because leaving the
            # field out makes HA's form default turn it on. Device commands are
            # handled by HA's built-in intents (prefer_local_intents below).
            - {name: llm_hass_api, value: "", type: list}
  pipeline:
    name: Home Voice
    language_from: assistant_language
    conversation: llm.agent
    stt: stt
    tts: tts
    prefer_local_intents: true
user_inputs:
  - id: ha_host
    name: Home Assistant host
    name_i18n: {zh: Home Assistant 主机地址}
    type: text
    required: true
    default_template: "{{rk_ha_deploy.host}}"
    validation: {pattern: "^([A-Za-z0-9-]+\\.)*[A-Za-z0-9-]+$|^\\[[0-9A-Fa-f:.]+\\]$"}
    description: IP address of the ARM64 Linux host running Home Assistant.
    description_i18n: {zh: 运行 Home Assistant 的 ARM64 Linux 主机的 IP 地址。}
  - id: ha_port
    name: Home Assistant port
    name_i18n: {zh: Home Assistant 端口}
    type: text
    required: true
    default: "8123"
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    description: Filled in from step 1; change it only if you reinstalled on a different port.
    description_i18n: {zh: 自动带入步骤 1 的端口；仅在改用其他端口重装时修改。}
  - id: ha_username
    name: Home Assistant username
    name_i18n: {zh: Home Assistant 用户名}
    type: text
    required: true
    description: The administrator account you created when you first opened Home Assistant.
    description_i18n: {zh: 首次打开 Home Assistant 时创建的管理员账号。}
  - id: ha_password
    name: Home Assistant password
    name_i18n: {zh: Home Assistant 密码}
    type: password
    required: true
    description: Password of that administrator account. Used only to set up Home Assistant and not saved.
    description_i18n: {zh: 该管理员账号的密码，只用于这次配置 Home Assistant，不会保存。}
  - id: voice_host
    name: Voice host address
    name_i18n: {zh: 语音主机地址}
    type: text
    required: true
    default_template: "{{deploy.host}}"
    validation: {pattern: "^([A-Za-z0-9-]+\\.)*[A-Za-z0-9-]+$|^\\[[0-9A-Fa-f:.]+\\]$"}
    description: IP address of the voice host from step 2.
    description_i18n: {zh: 步骤 2 的语音主机 IP 地址。}
  - id: wyoming_stt_port
    name: Speech-to-text port
    name_i18n: {zh: 语音转文字端口}
    type: text
    required: true
    default: "10300"
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    description: Filled in from step 2.
    description_i18n: {zh: 自动带入步骤 2 的端口。}
  - id: wyoming_tts_port
    name: Text-to-speech port
    name_i18n: {zh: 文字转语音端口}
    type: text
    required: true
    default: "10200"
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    description: Filled in from step 2.
    description_i18n: {zh: 自动带入步骤 2 的端口。}
  - id: assistant_language
    name: Voice assistant language
    name_i18n: {zh: 语音助手语言}
    type: select
    required: true
    default: en
    default_i18n: {zh: zh-cn}
    options:
      - {value: zh-cn, label: 中文}
      - {value: en, label: English}
  - id: llm_base_url
    name: LLM API address
    name_i18n: {zh: 大模型服务地址}
    type: text
    required: true
    placeholder: https://api.deepseek.com
    validation: {pattern: "^https?://[A-Za-z0-9._~:/-]+$"}
    description: Filled in from step 2.
    description_i18n: {zh: 自动带入步骤 2 填写的地址。}
  - id: llm_api_key
    name: API key (optional)
    name_i18n: {zh: 服务密钥（可选）}
    type: password
    required: false
    description: Enter it to finish setup now, so you can talk to the voice assistant right after this step. Leave it empty to enter it in Home Assistant later. Sent only to Home Assistant.
    description_i18n: {zh: 填写后本步完成即可直接对话；留空则之后在 Home Assistant 中填写。只发送给 Home Assistant。}
  - id: llm_model
    name: Model name
    name_i18n: {zh: 模型名称}
    type: text
    required: false
    placeholder: deepseek-flash
    validation: {pattern: "^[A-Za-z0-9._:/@+-]*$"}
    description: Needed only with an API key. The model name from your LLM provider, for example deepseek-flash.
    description_i18n: {zh: 填写服务密钥时需要。大模型服务商提供的模型名称，例如 deepseek-flash。}
