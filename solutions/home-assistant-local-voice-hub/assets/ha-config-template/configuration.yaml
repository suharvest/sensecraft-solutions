# Seed configuration copied only when the operator has no configuration.yaml.
# default_config loads frontend, onboarding, assist_pipeline, conversation,
# stt/tts and the other built-ins the Wyoming voice path depends on.
default_config:

homeassistant:
  packages: !include_dir_named packages

# Do not add `http: server_port:` here. Home Assistant 2026.9 migrates it to a
# pending trial that reverts to 8123 after 5 minutes unless promoted from the
# UI. The port comes from the deploy input (HA_PORT -> SETUP_PORT).
