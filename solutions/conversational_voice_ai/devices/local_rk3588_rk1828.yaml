version: "1.0"
id: local_rk3588_rk1828
name: RK3588 with RK1828 Local LLM
name_i18n: {zh: RK3588 + RK1828 本地模型}
type: docker_deploy
device_class: rk3588
deploy_timeout: 3600
docker:
  compose_file: assets/docker/docker-compose.rk3588-rk1828.yml
  options: {project_name: conversational_voice_ai}
  environment:
    LANGUAGE: "{{LANGUAGE}}"
    DEVICE: rk3588
    SYSTEM_PROMPT: "{{SYSTEM_PROMPT}}"
    PIPELINE_MODE: "{{PIPELINE_MODE}}"
    WAKEWORD_BACKEND: sherpa_onnx
    WAKEWORD_PHRASE: "{{WAKEWORD_PHRASE}}"
    WAKEWORD_THRESHOLD: "{{WAKEWORD_THRESHOLD}}"
  services:
    - {name: speech, port: 8621, health_check_endpoint: /health, required: true}
    - {name: llm, port: 1828, health_check_endpoint: /health, required: true}
ssh: {port: 22, default_user: radxa}
user_inputs:
  - id: LANGUAGE
    name: Conversation language
    name_i18n: {zh: 对话语言}
    type: select
    default: zh
    required: true
    reconfigurable: true
    description: >-
      Spoken language for recognition and for the synthesized reply. The list is the RK runtime's 30-language set (openvoicestream matrix language_catalog_source), the narrower of the two available lists - Qwen3-ASR upstream advertises 52 and Whisper 99. The deployment resolves (language, device) to one speech profile before any service starts and stops with an error if this board cannot serve the language.
    description_i18n:
      zh: >-
        识别与合成回复使用的语言。选项取 RK runtime 的 30 语种口径（openvoicestream 矩阵 language_catalog_source），是可用列表中较窄的一侧——Qwen3-ASR 上游标称 52 语种，Whisper 为 99 语种。部署时会先把（语言，设备）解析成唯一语音配置，该设备不支持所选语言时直接报错停止，不会启动服务。
    options:
      - {value: zh, label: Chinese, label_i18n: {zh: 中文}}
      - {value: en, label: English, label_i18n: {zh: 英语}}
      - {value: yue, label: Cantonese, label_i18n: {zh: 粤语}}
      - {value: ar, label: Arabic, label_i18n: {zh: 阿拉伯语}}
      - {value: de, label: German, label_i18n: {zh: 德语}}
      - {value: fr, label: French, label_i18n: {zh: 法语}}
      - {value: es, label: Spanish, label_i18n: {zh: 西班牙语}}
      - {value: pt, label: Portuguese, label_i18n: {zh: 葡萄牙语}}
      - {value: id, label: Indonesian, label_i18n: {zh: 印尼语}}
      - {value: it, label: Italian, label_i18n: {zh: 意大利语}}
      - {value: ko, label: Korean, label_i18n: {zh: 韩语}}
      - {value: ru, label: Russian, label_i18n: {zh: 俄语}}
      - {value: th, label: Thai, label_i18n: {zh: 泰语}}
      - {value: vi, label: Vietnamese, label_i18n: {zh: 越南语}}
      - {value: ja, label: Japanese, label_i18n: {zh: 日语}}
      - {value: tr, label: Turkish, label_i18n: {zh: 土耳其语}}
      - {value: hi, label: Hindi, label_i18n: {zh: 印地语}}
      - {value: ms, label: Malay, label_i18n: {zh: 马来语}}
      - {value: nl, label: Dutch, label_i18n: {zh: 荷兰语}}
      - {value: sv, label: Swedish, label_i18n: {zh: 瑞典语}}
      - {value: da, label: Danish, label_i18n: {zh: 丹麦语}}
      - {value: fi, label: Finnish, label_i18n: {zh: 芬兰语}}
      - {value: pl, label: Polish, label_i18n: {zh: 波兰语}}
      - {value: cs, label: Czech, label_i18n: {zh: 捷克语}}
      - {value: tl, label: Filipino, label_i18n: {zh: 菲律宾语}}
      - {value: fa, label: Persian, label_i18n: {zh: 波斯语}}
      - {value: el, label: Greek, label_i18n: {zh: 希腊语}}
      - {value: ro, label: Romanian, label_i18n: {zh: 罗马尼亚语}}
      - {value: hu, label: Hungarian, label_i18n: {zh: 匈牙利语}}
      - {value: mk, label: Macedonian, label_i18n: {zh: 马其顿语}}
  - id: PIPELINE_MODE
    name: Conversation mode
    name_i18n: {zh: 对话方式}
    type: select
    default: always_on
    required: false
    reconfigurable: true
    options:
      - {value: always_on, label: Always listening, label_i18n: {zh: 持续监听（默认）}}
      - {value: wake_word, label: Wake word required, label_i18n: {zh: 唤醒词后响应}}
  - id: WAKEWORD_PHRASE
    name: Wake word
    name_i18n: {zh: 唤醒词}
    type: text
    default: 你好小智
    required: false
    reconfigurable: true
    description: Any short Chinese or English phrase compiled at startup by the open-vocabulary KWS backend.
    description_i18n: {zh: 支持自定义简短中文或英文唤醒词，启动时由开放词表 KWS 编译。}
  - id: WAKEWORD_THRESHOLD
    name: Wake-word sensitivity
    name_i18n: {zh: 唤醒灵敏度}
    type: select
    default: "0.25"
    required: false
    reconfigurable: true
    description: Lower threshold is more sensitive and may increase false triggers.
    description_i18n: {zh: 阈值越低越灵敏，也可能增加误触发。}
    options:
      - {value: "0.35", label: Strict (0.35), label_i18n: {zh: 严格（0.35）}}
      - {value: "0.25", label: Balanced (0.25), label_i18n: {zh: 平衡（0.25，默认）}}
      - {value: "0.15", label: Sensitive (0.15), label_i18n: {zh: 灵敏（0.15）}}
pre_checks:
  - {type: disk_space, min_gb: 18, description: At least 18GB for images and local model artifacts}
remote_overrides:
  remote_path: /home/{{username}}/conversational_voice_ai
  compose_dir: assets/docker
  detection: {method: network_scan, manual_entry: true}
  environment:
    LANGUAGE: "{{LANGUAGE}}"
    DEVICE: rk3588
    SYSTEM_PROMPT: "{{SYSTEM_PROMPT}}"
    PIPELINE_MODE: "{{PIPELINE_MODE}}"
    WAKEWORD_BACKEND: sherpa_onnx
    WAKEWORD_PHRASE: "{{WAKEWORD_PHRASE}}"
    WAKEWORD_THRESHOLD: "{{WAKEWORD_THRESHOLD}}"
  user_inputs:
    - id: LANGUAGE
      name: Conversation language
      name_i18n: {zh: 对话语言}
      type: select
      default: zh
      required: true
      reconfigurable: true
      description: >-
        Spoken language for recognition and for the synthesized reply. The list is the RK runtime's 30-language set (openvoicestream matrix language_catalog_source), the narrower of the two available lists - Qwen3-ASR upstream advertises 52 and Whisper 99. The deployment resolves (language, device) to one speech profile before any service starts and stops with an error if this board cannot serve the language.
      description_i18n:
        zh: >-
          识别与合成回复使用的语言。选项取 RK runtime 的 30 语种口径（openvoicestream 矩阵 language_catalog_source），是可用列表中较窄的一侧——Qwen3-ASR 上游标称 52 语种，Whisper 为 99 语种。部署时会先把（语言，设备）解析成唯一语音配置，该设备不支持所选语言时直接报错停止，不会启动服务。
      options:
        - {value: zh, label: Chinese, label_i18n: {zh: 中文}}
        - {value: en, label: English, label_i18n: {zh: 英语}}
        - {value: yue, label: Cantonese, label_i18n: {zh: 粤语}}
        - {value: ar, label: Arabic, label_i18n: {zh: 阿拉伯语}}
        - {value: de, label: German, label_i18n: {zh: 德语}}
        - {value: fr, label: French, label_i18n: {zh: 法语}}
        - {value: es, label: Spanish, label_i18n: {zh: 西班牙语}}
        - {value: pt, label: Portuguese, label_i18n: {zh: 葡萄牙语}}
        - {value: id, label: Indonesian, label_i18n: {zh: 印尼语}}
        - {value: it, label: Italian, label_i18n: {zh: 意大利语}}
        - {value: ko, label: Korean, label_i18n: {zh: 韩语}}
        - {value: ru, label: Russian, label_i18n: {zh: 俄语}}
        - {value: th, label: Thai, label_i18n: {zh: 泰语}}
        - {value: vi, label: Vietnamese, label_i18n: {zh: 越南语}}
        - {value: ja, label: Japanese, label_i18n: {zh: 日语}}
        - {value: tr, label: Turkish, label_i18n: {zh: 土耳其语}}
        - {value: hi, label: Hindi, label_i18n: {zh: 印地语}}
        - {value: ms, label: Malay, label_i18n: {zh: 马来语}}
        - {value: nl, label: Dutch, label_i18n: {zh: 荷兰语}}
        - {value: sv, label: Swedish, label_i18n: {zh: 瑞典语}}
        - {value: da, label: Danish, label_i18n: {zh: 丹麦语}}
        - {value: fi, label: Finnish, label_i18n: {zh: 芬兰语}}
        - {value: pl, label: Polish, label_i18n: {zh: 波兰语}}
        - {value: cs, label: Czech, label_i18n: {zh: 捷克语}}
        - {value: tl, label: Filipino, label_i18n: {zh: 菲律宾语}}
        - {value: fa, label: Persian, label_i18n: {zh: 波斯语}}
        - {value: el, label: Greek, label_i18n: {zh: 希腊语}}
        - {value: ro, label: Romanian, label_i18n: {zh: 罗马尼亚语}}
        - {value: hu, label: Hungarian, label_i18n: {zh: 匈牙利语}}
        - {value: mk, label: Macedonian, label_i18n: {zh: 马其顿语}}
    - {id: host, name: Device IP, type: text, required: true, name_i18n: {zh: 设备 IP}}
    - {id: username, name: SSH Username, type: text, default: radxa, required: true, name_i18n: {zh: SSH 用户名}}
    - {id: password, name: SSH Password, type: password, required: true, name_i18n: {zh: SSH 密码}}
    - id: PIPELINE_MODE
      name: Conversation mode
      name_i18n: {zh: 对话方式}
      type: select
      default: always_on
      required: false
      reconfigurable: true
      options:
        - {value: always_on, label: Always listening, label_i18n: {zh: 持续监听（默认）}}
        - {value: wake_word, label: Wake word required, label_i18n: {zh: 唤醒词后响应}}
    - id: WAKEWORD_PHRASE
      name: Wake word
      name_i18n: {zh: 唤醒词}
      type: text
      default: 你好小智
      required: false
      reconfigurable: true
      description: Any short Chinese or English phrase compiled at startup by the open-vocabulary KWS backend.
      description_i18n: {zh: 支持自定义简短中文或英文唤醒词，启动时由开放词表 KWS 编译。}
    - id: WAKEWORD_THRESHOLD
      name: Wake-word sensitivity
      name_i18n: {zh: 唤醒灵敏度}
      type: select
      default: "0.25"
      required: false
      reconfigurable: true
      description: Lower threshold is more sensitive and may increase false triggers.
      description_i18n: {zh: 阈值越低越灵敏，也可能增加误触发。}
      options:
        - {value: "0.35", label: Strict (0.35), label_i18n: {zh: 严格（0.35）}}
        - {value: "0.25", label: Balanced (0.25), label_i18n: {zh: 平衡（0.25，默认）}}
        - {value: "0.15", label: Sensitive (0.15), label_i18n: {zh: 灵敏（0.15）}}
    - id: SYSTEM_PROMPT
      name: Assistant personality
      name_i18n: {zh: 助手人设与回答风格}
      type: text
      required: true
      reconfigurable: true
      default: >-
        You are a natural, witty voice assistant. Reply in the user's language. Keep responses conversational and brief—usually one or two sentences. Add light humor and personality when appropriate, but never at the expense of accuracy. Avoid rambling, repetition, lectures, Markdown, headings, and lists. If details are missing, ask one short question. For spoken Chinese, write numbers, dates, times, money, and units as natural spoken Chinese.
      default_i18n:
        zh: >-
          你是一个自然、机智、有趣的语音助手。使用用户正在使用的语言回答，表达口语化、直接而简短，通常只说一到两句话。合适时可以带一点幽默和个性，但不能影响准确性；不要啰嗦、重复、说教，也不要输出 Markdown、标题或列表。信息不足时只问一个简短问题。中文语音回答中的数字、日期、时间、金额和单位使用自然口语表达。
      description: Editable system prompt applied to every conversation.
      description_i18n: {zh: 每轮对话都会使用的系统提示词，可按场景修改。}
    - id: RK_PERFORMANCE_MODE
      name: RK Performance Mode
      name_i18n: {zh: RK 性能模式}
      type: select
      default: performance
      required: true
      reconfigurable: true
      description: Lock CPU, NPU, DDR, and GPU (when present) to their highest reported frequencies, or keep the system governor unchanged.
      description_i18n: {zh: 将 CPU、NPU、DDR 及存在时的 GPU 锁定到设备报告的最高频率，或保持系统原有调频策略。}
      options:
        - {value: performance, label: Maximum performance, label_i18n: {zh: 最高性能（默认）}}
        - {value: balanced, label: System default / balanced, label_i18n: {zh: 系统默认 / 均衡}}
  actions:
    before:
      - name: Lock RK clocks to maximum
        name_i18n: {zh: 将 RK 各计算域锁定到最高频率}
        description: Pins the available CPU, NPU, DDR, and GPU frequency domains before starting the voice services.
        description_i18n: {zh: 在启动语音服务前，将可用的 CPU、NPU、DDR 和 GPU 频率域锁定到最高档。}
        sudo: true
        when: {field: RK_PERFORMANCE_MODE, value: performance}
        run: |
          set -u
          failures=0
          npu_seen=0
          npu_pinned=0

          for policy in /sys/devices/system/cpu/cpufreq/policy*; do
            [ -d "$policy" ] || continue
            max=$(cat "$policy/cpuinfo_max_freq" 2>/dev/null || cat "$policy/scaling_max_freq" 2>/dev/null || true)
            [ -n "$max" ] || { echo "WARN: no maximum frequency for $policy"; failures=$((failures + 1)); continue; }
            if grep -qw performance "$policy/scaling_available_governors" 2>/dev/null; then
              echo performance > "$policy/scaling_governor" || failures=$((failures + 1))
            elif grep -qw userspace "$policy/scaling_available_governors" 2>/dev/null; then
              echo userspace > "$policy/scaling_governor" || failures=$((failures + 1))
              echo "$max" > "$policy/scaling_setspeed" || failures=$((failures + 1))
            else
              echo "WARN: $policy has neither performance nor userspace governor"
              failures=$((failures + 1))
            fi
            [ ! -e "$policy/scaling_min_freq" ] || echo "$max" > "$policy/scaling_min_freq" || failures=$((failures + 1))
            echo "CPU $(basename "$policy"): governor=$(cat "$policy/scaling_governor" 2>/dev/null) min=$(cat "$policy/scaling_min_freq" 2>/dev/null) max=$max"
          done

          for node in /sys/class/devfreq/*; do
            [ -d "$node" ] || continue
            domain=$(basename "$(readlink -f "$node")")
            case "$domain" in
              *npu*) npu_seen=1 ;;
              *dmc*|*gpu*) ;;
              *) continue ;;
            esac
            max=$(tr ' ' '\n' < "$node/available_frequencies" 2>/dev/null | awk 'NF && $1+0>m {m=$1+0} END {if (m) print m}')
            [ -n "$max" ] || max=$(cat "$node/max_freq" 2>/dev/null || true)
            [ -n "$max" ] || { echo "WARN: no maximum frequency for $domain"; failures=$((failures + 1)); continue; }
            pinned=0
            if grep -qw userspace "$node/available_governors" 2>/dev/null && [ -e "$node/userspace/set_freq" ]; then
              echo userspace > "$node/governor" && echo "$max" > "$node/userspace/set_freq" && pinned=1
            elif grep -qw performance "$node/available_governors" 2>/dev/null; then
              echo performance > "$node/governor" && pinned=1
            fi
            [ "$pinned" -eq 1 ] || { echo "WARN: cannot pin $domain"; failures=$((failures + 1)); continue; }
            [ ! -e "$node/min_freq" ] || echo "$max" > "$node/min_freq" || failures=$((failures + 1))
            case "$domain" in *npu*) npu_pinned=1 ;; esac
            echo "$domain: governor=$(cat "$node/governor" 2>/dev/null) current=$(cat "$node/cur_freq" 2>/dev/null) target=$max"
          done

          [ "$npu_seen" -eq 1 ] || { echo "ERROR: RK NPU frequency domain not found"; exit 1; }
          [ "$npu_pinned" -eq 1 ] || { echo "ERROR: RK NPU could not be locked to maximum frequency"; exit 1; }
          [ "$failures" -eq 0 ] || { echo "ERROR: $failures RK frequency operation(s) failed"; exit 1; }
          echo "RK maximum-performance mode enabled. Ensure adequate cooling."
