      description: Any short Chinese or English phrase compiled at startup by the open-vocabulary KWS backend.
      description_i18n: {zh: 支持自定义简短中文或英文唤醒词，启动时由开放词表 KWS 编译。}
    - id: WAKEWORD_THRESHOLD
      name: Wake-word sensitivity
      name_i18n: {zh: 唤醒灵敏度}
      type: select
      default: "0.25"
      required: false
      reconfigurable: true
      description: Lower threshold is more sensitive and may increase false triggers.
      description_i18n: {zh: 阈值越低越灵敏，也可能增加误触发。}
      options:
        - {value: "0.35", label: Strict (0.35), label_i18n: {zh: 严格（0.35）}}
        - {value: "0.25", label: Balanced (0.25), label_i18n: {zh: 平衡（0.25，默认）}}
        - {value: "0.15", label: Sensitive (0.15), label_i18n: {zh: 灵敏（0.15）}}
    - id: SYSTEM_PROMPT
      name: Assistant personality
      name_i18n: {zh: 助手人设与回答风格}
      type: text
      required: true
      reconfigurable: true
      default: >-
        You are a natural, witty voice assistant. Reply in the user's language. Keep responses conversational and brief—usually one or two sentences. Add light humor and personality when appropriate, but never at the expense of accuracy. Avoid rambling, repetition, lectures, Markdown, headings, and lists. If details are missing, ask one short question. For spoken Chinese, write numbers, dates, times, money, and units as natural spoken Chinese.
      default_i18n:
        zh: >-
          你是一个自然、机智、有趣的语音助手。使用用户正在使用的语言回答，表达口语化、直接而简短，通常只说一到两句话。合适时可以带一点幽默和个性，但不能影响准确性；不要啰嗦、重复、说教，也不要输出 Markdown、标题或列表。信息不足时只问一个简短问题。中文语音回答中的数字、日期、时间、金额和单位使用自然口语表达。
      description: Editable system prompt applied to every conversation.
      description_i18n: {zh: 每轮对话都会使用的系统提示词，可按场景修改。}
    - id: VAD_ENDPOINT_MS
      name: Reply after how much silence
      name_i18n: {zh: 说完话多久开始回答}
      type: select
      default: "0"
      required: false
      reconfigurable: true
      description: >-
        Server-side speech endpoint: how long the assistant waits after you stop
        speaking before it replies. The image default (1.5 s) tolerates a natural
        mid-sentence pause; a smaller value feels snappier but can cut one sentence
        into two; a larger value tolerates long thinking pauses at the cost of a
        slower reply. Must stay above the device-side VAD silence (600 ms). Only
        affects the paths where the device itself decides the end of speech — a
        separate microphone/agent application keeps its own setting.
      description_i18n:
        zh: >-
          说完话后等多久开始回答（设备端语音端点判停）。镜像默认 1.5 秒能容忍句中自然停顿；调小反应更快，
          但可能把一句话截成两段；调大更宽容（适合边说边想），代价是回答来得更慢。必须大于设备端 VAD 的
          静音门限（600 毫秒）。只影响由设备自己判断"说完了"的场景；使用独立麦克风/agent 应用时以它自己的设置优先。
      options:
        - {value: "0", label: Balanced (image default, 1.5 s), label_i18n: {zh: 均衡（镜像默认 1.5 秒）}}
        - {value: "900", label: Snappy (0.9 s), label_i18n: {zh: 更灵敏（0.9 秒）}}
        - {value: "2000", label: Tolerant (2 s), label_i18n: {zh: 更宽容（2 秒）}}
        - {value: "3000", label: Very tolerant (3 s), label_i18n: {zh: 最宽容（3 秒）}}
  actions:
    before:
      # Same name as the jetson device-class profile action, so the profile
      # copy is dropped and this one runs instead. `sudo: true` makes the SSH
      # executor feed the password via `sudo -S`; the profile copy calls bare
      # `sudo` and fails with "a terminal is required" on stock JetPack images
      # where the login user has no NOPASSWD sudo.
      - name: Fix Docker iptables for JetPack 6.x
        scope: remote
        ignore_error: false
        sudo: true
        run: |
          CONF="/etc/systemd/system/docker.service.d/disable-raw-table.conf"
          if [ -f "$CONF" ] && grep -q "DOCKER_INSECURE_NO_IPTABLES_RAW=1" "$CONF" 2>/dev/null; then
            echo "Docker iptables fix already applied"
          else
            echo "Applying Docker iptables raw table fix for JetPack 6.x..."
            mkdir -p /etc/systemd/system/docker.service.d
            printf '[Service]\nEnvironment="DOCKER_INSECURE_NO_IPTABLES_RAW=1"\n' > "$CONF"
            systemctl daemon-reload
            systemctl restart docker
            sleep 2
            echo "Docker iptables fix applied"
          fi
        name_i18n:
          zh: 修复 JetPack 6.x Docker 网络问题
