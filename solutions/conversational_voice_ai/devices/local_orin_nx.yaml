      options:
        - {value: zh, label: Chinese, label_i18n: {zh: 中文}}
        - {value: en, label: English, label_i18n: {zh: 英语}}
        - {value: yue, label: Cantonese, label_i18n: {zh: 粤语}}
        - {value: ar, label: Arabic, label_i18n: {zh: 阿拉伯语}}
        - {value: de, label: German, label_i18n: {zh: 德语}}
        - {value: fr, label: French, label_i18n: {zh: 法语}}
        - {value: es, label: Spanish, label_i18n: {zh: 西班牙语}}
        - {value: pt, label: Portuguese, label_i18n: {zh: 葡萄牙语}}
        - {value: id, label: Indonesian, label_i18n: {zh: 印尼语}}
        - {value: it, label: Italian, label_i18n: {zh: 意大利语}}
        - {value: ko, label: Korean, label_i18n: {zh: 韩语}}
        - {value: ru, label: Russian, label_i18n: {zh: 俄语}}
        - {value: th, label: Thai, label_i18n: {zh: 泰语}}
        - {value: vi, label: Vietnamese, label_i18n: {zh: 越南语}}
        - {value: ja, label: Japanese, label_i18n: {zh: 日语}}
        - {value: tr, label: Turkish, label_i18n: {zh: 土耳其语}}
        - {value: hi, label: Hindi, label_i18n: {zh: 印地语}}
        - {value: ms, label: Malay, label_i18n: {zh: 马来语}}
        - {value: nl, label: Dutch, label_i18n: {zh: 荷兰语}}
        - {value: sv, label: Swedish, label_i18n: {zh: 瑞典语}}
        - {value: da, label: Danish, label_i18n: {zh: 丹麦语}}
        - {value: fi, label: Finnish, label_i18n: {zh: 芬兰语}}
        - {value: pl, label: Polish, label_i18n: {zh: 波兰语}}
        - {value: cs, label: Czech, label_i18n: {zh: 捷克语}}
        - {value: tl, label: Filipino, label_i18n: {zh: 菲律宾语}}
        - {value: fa, label: Persian, label_i18n: {zh: 波斯语}}
        - {value: el, label: Greek, label_i18n: {zh: 希腊语}}
        - {value: ro, label: Romanian, label_i18n: {zh: 罗马尼亚语}}
        - {value: hu, label: Hungarian, label_i18n: {zh: 匈牙利语}}
        - {value: mk, label: Macedonian, label_i18n: {zh: 马其顿语}}
    - {id: host, name: Device IP, type: text, required: true, name_i18n: {zh: 设备 IP}}
    - {id: username, name: SSH Username, type: text, default: recomputer, required: true, name_i18n: {zh: SSH 用户名}}
    - {id: password, name: SSH Password, type: password, required: true, name_i18n: {zh: SSH 密码}}
    - id: PIPELINE_MODE
      name: Conversation mode
      name_i18n: {zh: 对话方式}
      type: select
      default: always_on
      required: false
      reconfigurable: true
      options:
        - {value: always_on, label: Always listening, label_i18n: {zh: 持续监听（默认）}}
        - {value: wake_word, label: Wake word required, label_i18n: {zh: 唤醒词后响应}}
