services:
  speech:
    image: ${SPEECH_IMAGE:-sensecraft-missionpack.seeed.cn/solution/openvoicestream:rk-qwen3asr-20260816-ea4e258-coldstart}
    container_name: conversational-voice-speech
    privileged: true
    init: true
    network_mode: host
    command: ["python3", "-m", "uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8621"]
    mem_limit: 7500m
    memswap_limit: 7500m
    volumes:
      - /dev:/dev
      - rk-asr-models:/opt/asr/models
      - rk-tts-models:/opt/tts/models
      - voice-data:/opt/seeed-local-voice/data
    environment:
      OVS_PROFILE: ${OVS_PROFILE:-rk3576-default}
      OVS_PROFILE_DEFAULT: rk3576-default
      OVS_VAD_BACKEND: silero
      OVS_VAD_SILENCE_MS: "400"
      ASR_PLATFORM: rk3576
      ASR_BACKEND: qwen3_asr_rk
      ASR_DECODER_TYPE: rkllm
      ASR_DECODER_QUANT: w8a8
      ASR_ENABLED_CPUS: "4"
      ASR_NPU_CORE_MASK: NPU_CORE_1
      ASR_MAX_NEW_TOKENS: "64"
      ASR_FINAL_STOP_ON_PUNCT: "1"
      ASR_FINAL_STOP_MIN_CHARS: "8"
      ASR_FINAL_STOP_MIN_CHUNKS: "2"
      ASR_MODEL_DIR: /opt/asr/models
      QWEN3_ASR_CHUNK_CONFIRM: "0"
      QWEN3_ASR_STREAM_MODE: true_streaming
      QWEN3_ASR_STREAM_TRUE: "1"
      QWEN3_ASR_TRUE_ROLL_SEC: "5"
      QWEN3_ASR_TRUE_PARTIAL_TOKENS: "8"
      QWEN3_ASR_TRUE_PARTIAL_INTERVAL_MS: "1500"
      QWEN3_ASR_TRUE_PARTIAL_WARMUP: "2"
      # RK3576 A/B: async final regresses close-out; only RK3588 enables it.
      QWEN3_ASR_VAD_FINAL_ASYNC: "0"
      QWEN3_ASR_FRONTEND_EOU_MIN_AUDIO_S: "2.5"
      VAD_ENDPOINT_SILENCE_MS: "400"
      TTS_BACKEND: matcha_rknn
      TTS_MODEL_DIR: /opt/tts/models
      SHERPA_TTS_MODEL_DIR: /opt/tts/models/matcha-icefall-zh-en
      TTS_PROVIDER: cpu
      TTS_NUM_THREADS: "4"
      TTS_DEFAULT_SID: "0"
      MATCHA_MAX_PHONEMES: "64"
      MATCHA_MODEL_SEQ_LEN: "80"
      MATCHA_USE_ORT: "1"
      MATCHA_MODEL: matcha-s64.rknn
      VOCOS_MODEL: vocos-16khz-600.rknn
      VOCOS_FRAMES: "600"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8621/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  agent:
    image: ${AGENT_IMAGE:-sensecraft-missionpack.seeed.cn/solution/ovs-agent:voiceagent-20260816-3849d33-hotplug}
    container_name: conversational-voice-agent
    init: true
    network_mode: host
    depends_on:
      speech:
        condition: service_healthy
    command: ["ovs-agent", "run", "conversation", "--config", "/opt/voice/config/agent-config.yaml"]
    # Bind the ALSA directory instead of snapshotting individual device nodes.
    # Together with the wildcard cgroup rule this keeps USB audio hot-pluggable.
    device_cgroup_rules:
      - "c 116:* rwm"
    group_add: ["29"]
    volumes:
      - /dev/snd:/dev/snd
      - ./agent-config.yaml:/opt/voice/config/agent-config.yaml:ro
      - ./audio_profiles.yaml:/opt/voice/config/audio_profiles.yaml:ro
    environment:
      CONFIG_DIR: /opt/voice/config
      OVS_SLV_URL: ws://127.0.0.1:8621/v2v/stream
      OVS_AGENT_SERVER_LOOP: "0"
      LLM_BACKEND: ${LLM_BACKEND:-openai_compat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5-flash}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
      DEFAULT_MODE: ${DEFAULT_MODE:-chat}
    restart: unless-stopped

volumes:
  rk-asr-models:
    name: rk-asr-models
  rk-tts-models:
    name: rk-tts-models
  voice-data:
    name: conversational-voice-data
