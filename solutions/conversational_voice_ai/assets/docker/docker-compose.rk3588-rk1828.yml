services:
  # `extends` copies the service definition but not depends_on, so the
  # LANGUAGE -> profile init step is re-declared here rather than inherited.
  profile-init:
    extends:
      file: docker-compose.rk3588.yml
      service: profile-init

  speech:
    extends:
      file: docker-compose.rk3588.yml
      service: speech
    depends_on:
      profile-init:
        condition: service_completed_successfully

  llm:
    # 20260919-hostruntime.2: thin overlay on 20260731-kvreuse (staged RKNN3
    # worker binary + libs byte-identical, md5 600b33ee…/79dad96c…). It adds the
    # host runtime alignment below and makes the READY timeout configurable.
    # index       sha256:08b4d4b8d8b0b82beb520c96657707889531b604ea60ce0fb9bcfd137c7e6113
    # linux/arm64 sha256:f205bd23db9805c9938f0dc7957e0ce0ef472395314d69f8cc73874dcaee2aa6
    image: ${LLM_IMAGE:-sensecraft-missionpack.seeed.cn/solution/edge-llm-rk1828:20260919-hostruntime.2}
    container_name: conversational-voice-llm
    privileged: true
    init: true
    network_mode: host
    volumes:
      - /dev:/dev
      - rk1828-llm-models:/opt/llm/models
      # The container's RKNN3 client lib must be the SAME GENERATION as this
      # host's rknn3_transfer_proxy and EP firmware — they ship in one host
      # package (rknn3-rk182x-m2) and only speak to each other. On a skew the
      # worker connects, sends its init request and blocks in read() with no
      # error: the only symptom is the READY timeout firing identically on every
      # attempt (2026-09-17, recomputer-rk3588-devkit: image 1.0.4 against a host
      # on 1.1.0, five attempts all at 179.6 s, EP memory never touched).
      # The entrypoint copies the host's librknn3_api{,_rkcp}.so over its bundled
      # pair when this is mounted, so the client follows whatever the host has.
      # A higher runtime loads a lower-version model (Rockchip, 2026-09-18), so
      # this does NOT require re-exporting the 3.2 GB model artifacts.
      # The whole dir is mounted, not the two files: a bind mount of a file the
      # host does not have makes docker CREATE A DIRECTORY at that host path.
      - /usr/lib:/opt/rk1828/host-lib:ro
    environment:
      RK1828_ARTIFACT_AUTO_DOWNLOAD: "1"
      RK1828_ARTIFACT_REPO_ID: harvestsu/seeed-local-voice-rk-artifacts
      RK1828_ARTIFACT_PREFIX: rk1828/opt/llm/qwen3-4b
      # The published Qwen3-4B export holds a 2048-token KV cache; a larger
      # request makes the runtime fall back to 2048 anyway, and past ~2200
      # prompt tokens replies come back empty. Keep equal to the export.
      RK1828_MAX_CONTEXT: ${RK1828_MAX_CONTEXT:-2048}
      RK1828_CORE_MASK: ff
      RK1828_PORT: "1828"
      # Seconds the supervisor waits for the worker's READY handshake, per
      # attempt. Model init pushes ~3.2 GB over PCIe; 180 s covers a cold read at
      # the ~44 MB/s an eMMC/SD rootfs measures. Raise it for slower storage.
      RK1828_READY_TIMEOUT: ${RK1828_READY_TIMEOUT:-180}
      # Do NOT raise this to paper over a load that fails identically every time
      # — failed loads degrade the EP from 8 cores to 4.
      RK1828_START_ATTEMPTS: ${RK1828_START_ATTEMPTS:-3}
      # Internal service: the agent calls it on 127.0.0.1. Loopback by default
      # so the local LLM is not an open OpenAI-compatible endpoint on the LAN.
      RK1828_HOST: ${RK1828_HOST:-127.0.0.1}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1828/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s

  agent:
    extends:
      file: docker-compose.rk3588.yml
      service: agent
    environment:
      # The agent turns these into the per-session v2v config (asr_language/
      # tts_language), which is the only language knob the Qwen3-ASR and
      # Qwen3-TTS backends have. Same operator input as profile-init above.
      ASR_LANGUAGE: ${LANGUAGE:-zh}
      TTS_LANGUAGE: ${LANGUAGE:-zh}
      OVS_SLV_URL: ws://127.0.0.1:8621/v2v/stream
      OVS_AGENT_SERVER_LOOP: "0"
      PIPELINE_MODE: ${PIPELINE_MODE:-always_on}
      WAKEWORD_BACKEND: ${WAKEWORD_BACKEND:-sherpa_onnx}
      WAKEWORD_PHRASE: ${WAKEWORD_PHRASE:-你好小智}
      WAKEWORD_THRESHOLD: ${WAKEWORD_THRESHOLD:-0.25}
      WAKEWORD_MIC_SKIP_MS: ${WAKEWORD_MIC_SKIP_MS:-120}
      LLM_BACKEND: openai_compat
      LLM_BASE_URL: http://127.0.0.1:1828/v1
      LLM_API_KEY: EMPTY
      # History trim budget sized for the 2048-token context above (history
      # only, <= 0.75 x budget by the agent's estimate). Needs ovs-agent
      # voiceagent-20260921-bargein.4 or later; older agents ignore it.
      OVS_AGENT_SESSION_MAX_INPUT_TOKENS: ${OVS_AGENT_SESSION_MAX_INPUT_TOKENS:-1000}
      LLM_MODEL: Qwen3-4B
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
      DEFAULT_MODE: chat
    depends_on:
      speech:
        condition: service_healthy
      llm:
        condition: service_healthy

volumes:
  resolved-profile:
  rk-asr-models:
    name: rk-asr-models
  rk-tts-models:
    name: rk-tts-models
  voice-data:
    name: conversational-voice-data
  agent-state:
    name: conversational-voice-agent-state
  rk1828-llm-models:
    name: rk1828-llm-models
