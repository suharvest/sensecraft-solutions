version: "1.0"
id: conversational_voice_ai
name: Interruptible Conversational Voice AI
name_i18n:
  zh: 可打断对话式语音 AI

intro:
  summary: Plug in an AEC microphone array and build a hands-free voice application with Qwen3-ASR, Matcha-TTS, real barge-in, and either a cloud or local LLM across RK3576, RK3588, Jetson Orin Nano, and Orin NX.
  summary_i18n:
    zh: 插上支持 AEC 的麦克风阵列，即可在 RK3576、RK3588、Jetson Orin Nano 或 Orin NX 上运行支持实时打断的语音应用；语音使用 Qwen3-ASR + Matcha-TTS，对话模型可接云端，也可全本地运行。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/hero.png
  category: voice_ai
  solution_type: solution
  tags: [voice-ai, barge-in, aec, qwen3-asr, matcha-tts, rk3576, rk3588, jetson, orin, rk1828, local-llm]

  input_requirements:
    - type: audio
      required: true
      description: A USB microphone array that exposes a hardware AEC/processed capture channel. reSpeaker XVF3800 is the validated default.
      description_i18n:
        zh: 必须使用能输出硬件 AEC/已处理采集通道的 USB 麦克风阵列；默认按已验证的 reSpeaker XVF3800 配置。
    - type: audio
      required: true
      description: A speaker connected to the same edge device for voice replies.
      description_i18n:
        zh: 一个连接到同一台设备的音箱，用于播放语音回复。
    - type: network
      required: true
      description: Internet is needed for first-run images and model artifacts. The cloud preset also needs ongoing API access; local presets can run offline after artifacts are cached.
      description_i18n:
        zh: 首次启动需要联网下载镜像和模型；云端套餐运行时仍需访问 API，本地套餐缓存完成后可离线运行。

  device_catalog:
    recomputer_rk3576:
      description: Runs Qwen3 speech recognition and Matcha voice synthesis on RK3576.
      description_i18n:
        zh: 在 RK3576 上运行 Qwen3 语音识别和 Matcha 语音合成。
    recomputer_rk3588:
      description: Runs the speech stack on RK3588 and can pair with an RK1828 card for a local Qwen3-4B model.
      description_i18n:
        zh: 在 RK3588 上运行语音链路，并可配 RK1828 加速卡运行本地 Qwen3-4B。
    recomputer_j30:
      description: Runs Qwen3 speech recognition and Matcha voice synthesis on Jetson Orin Nano; use a cloud LLM for conversation.
      description_i18n:
        zh: 在 Jetson Orin Nano 上运行 Qwen3 语音识别和 Matcha 语音合成；对话能力建议接云端。
      purchase:
        require:
          module: [orin_nano_8]
    recomputer_j40:
      description: Runs the speech stack and an optional local Qwen3.5-4B model together on Orin NX 16GB.
      description_i18n:
        zh: 在 Orin NX 16GB 上同时运行语音链路和可选的本地 Qwen3.5-4B。
      purchase:
        require:
          module: [orin_nx_16]
    respeaker_xvf3800:
      description: USB microphone array with hardware echo cancellation, noise suppression, and beamforming.
      description_i18n:
        zh: 支持硬件回声消除、降噪和波束成形的 USB 麦克风阵列。
  presets:
    - id: cloud_llm
      name: Cloud or OpenAI-Compatible LLM
      name_i18n: {zh: 云端或 OpenAI 兼容模型}
      badge: Recommended
      badge_i18n: {zh: 推荐}
      description: Use Qwen API defaults or enter any OpenAI-compatible base URL, key, and model ID.
      description_i18n: {zh: 默认连接 Qwen API，也可填写任意 OpenAI 兼容接口地址、Key 和模型 ID。}
      device_groups:
        - id: cloud_compute
          name: Compute Device
          name_i18n: {zh: 运行设备}
          type: single
          required: true
          options:
            - {device_ref: recomputer_rk3576}
            - {device_ref: recomputer_rk3588}
            - {device_ref: recomputer_j30}
            - {device_ref: recomputer_j40}
          default: recomputer_rk3576
        - id: cloud_mic
          name: AEC Microphone
          name_i18n: {zh: AEC 麦克风}
          type: single
          required: true
          options:
            - {device_ref: respeaker_xvf3800}
          default: respeaker_xvf3800

    - id: local_llm
      name: Fully Local Conversation
      name_i18n: {zh: 全本地对话}
      description: Keep audio and text on-device with RK3588 + RK1828 Qwen3-4B or Orin NX 16GB + Qwen3.5-4B.
      description_i18n: {zh: 使用 RK3588 + RK1828 的 Qwen3-4B，或 Orin NX 16GB 的 Qwen3.5-4B，让音频和文字都留在本地。}
      device_groups:
        - id: local_compute
          name: Local AI Device
          name_i18n: {zh: 本地 AI 设备}
          type: single
          required: true
          options:
            - {device_ref: recomputer_rk3588}
            - {device_ref: recomputer_j40}
          default: recomputer_j40
        - id: local_mic
          name: AEC Microphone
          name_i18n: {zh: AEC 麦克风}
          type: single
          required: true
          options:
            - {device_ref: respeaker_xvf3800}
          default: respeaker_xvf3800

  stats:
    difficulty: intermediate
    estimated_time: 30min
  links:
    github: https://github.com/suharvest/openvoicestream

deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
