version: "1.0"
id: dashboard
name: Open Positioning Dashboard
type: web_dashboard
user_inputs:
  - id: host
    name: Host IP
    default: localhost
    default_template: "{{host}}"
    name_i18n:
      zh: 主机 IP
web_dashboard:
  url: "http://{{host}}:5173/web/map"
  title: Indoor Positioning Dashboard
  description: View live tracker positions, floor plans and the outdoor map. Everything lives on one page at /web/map; the layer switch toggles Indoor and Outdoor, and /web/map?layer=outdoor is the direct link for wall displays. Login admin / 83EtWJUbGrPnQjdCqyKq
  title_i18n:
    zh: 室内外定位面板
  description_i18n:
    zh: 查看实时定位、楼层平面图与室外地图。全部收在 /web/map 一页，用图层控件切换室内/室外；投屏可直接开 /web/map?layer=outdoor。登录 admin / 83EtWJUbGrPnQjdCqyKq
name_i18n:
  zh: 打开定位面板
