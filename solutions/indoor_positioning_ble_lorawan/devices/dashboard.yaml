version: "1.0"
id: dashboard
name: Open Positioning Dashboard
type: web_dashboard
user_inputs:
  - id: host
    name: Host IP
    default: localhost
    default_template: "{{host}}"
    name_i18n:
      zh: 主机 IP
web_dashboard:
  url: "http://{{host}}:5173"
  title: Indoor Positioning Dashboard
  description: View live tracker positions, floor plans and the outdoor map. The map dropdown has one entry per floor plan plus an Outdoor entry; there is also a standalone /outdoor-map route for wall displays. Login admin / 83EtWJUbGrPnQjdCqyKq
  title_i18n:
    zh: 室内外定位面板
  description_i18n:
    zh: 查看实时定位、楼层平面图与室外地图。地图下拉里每张平面图一条，外加一条“室外”；另有独立路由 /outdoor-map 便于投屏。登录 admin / 83EtWJUbGrPnQjdCqyKq
name_i18n:
  zh: 打开定位面板
