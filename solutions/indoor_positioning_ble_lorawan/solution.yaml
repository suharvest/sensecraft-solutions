    # 1280x800 Playwright 截图。截图来源与 OSM/ODbL 署名见 gallery/ATTRIBUTION.md。
    - type: image
      src: gallery/login.png
      caption: Sign-in page
      caption_i18n:
        zh: 登录页
    - type: image
      src: gallery/app-preview.png
      caption: Application Dashboard
      caption_i18n:
        zh: 应用仪表板
    - type: image
      src: gallery/map-view.png
      caption: Map Visualization
      caption_i18n:
        zh: 地图可视化
    # TODO(CDN): the screenshots in this gallery are still repo-relative. Upload to
    # files.seeedstudio.com/Solution/landpage_asset/indoor_positioning_ble_lorawan/
    # with a hashed filename and switch these src values before the hub page uses them.
    # Provenance and OSM/ODbL attribution: gallery/ATTRIBUTION.md
    - type: image
      src: gallery/outdoor-map.png
      caption: Outdoor view on an OpenStreetMap basemap, with the offline (PMTiles) source selectable
      caption_i18n:
        zh: 室外视图，底图为 OpenStreetMap，可切换离线 PMTiles 源
    - type: image
      src: gallery/floorplan-registration.png
      caption: Floor plan georeferenced onto the outdoor map (origin, rotation, scale)
      caption_i18n:
        zh: 平面图配准到室外地图（原点、旋转角、缩放）
  repo_url: https://github.com/Seeed-Solution/Solution_IndoorPositioning_H5
  category: smart_building
  solution_type: solution


  output_interfaces:
    - type: websocket
      port: 5173
      endpoint: /ws
      description: Live broadcast of tracker updates. Each update carries either a metric position (x/y on a floor plan) or a WGS84 position (lat/lon), tagged by coordSystem. Geofence enter/exit alarms ride on the same channel as tracker_checkin / tracker_position_detection with an extra geofence block.
      description_i18n:
        zh: 实时广播定位更新。每条更新带米制坐标（平面图 x/y）或 WGS84 坐标（经纬度），由 coordSystem 区分。围栏进出告警复用 tracker_checkin / tracker_position_detection 消息，额外带一个 geofence 段。
      schema_type: json
      payload_example: '{"type": "tracker_checkin", "data": {"2CF7F1C0530004AD": {"timestamp": 1788582647214, "map": "Plant A", "geofence": {"id": 1, "name": "Plant A", "transition": "enter"}, "position": {"lat": 22.5362, "lon": 113.9432, "accuracy": null, "coordSystem": "wgs84"}, "last_detected_beacons": []}}}'
    - type: http
      port: 5173
      endpoint: /api/configuration/dashboard/maps/{mapName}/registration
      description: GET/PUT the floor-plan georeferencing parameters (origin_lat, origin_lon, rotation_deg, scale). Rejects |lat| > 85 deg and scale <= 0. Admin session required; a guest session gets 403.
      description_i18n:
        zh: 读写平面图配准参数（origin_lat、origin_lon、rotation_deg、scale）。|纬度| > 85° 与 scale <= 0 会被拒绝。需要 admin 会话，guest 会话返回 403。
      schema_type: json
      payload_example: '{"origin_lat": 22.5231, "origin_lon": 113.9312, "rotation_deg": 17.5, "scale": 1.25}'
  input_requirements:
    - type: lorawan
      description: LoRaWAN network connectivity (US915/EU868/AS923)
      description_i18n:
        zh: LoRaWAN 网络连接 (US915/EU868/AS923)
    - type: network
      description: Internet access on the machine running the dashboard, for OpenStreetMap raster tiles. Sites without internet use a locally built PMTiles archive instead; see the guide.
      description_i18n:
        zh: 运行面板的主机需要联网以拉取 OpenStreetMap 栅格瓦片。现场无外网时改用本地构建的 PMTiles 归档，见部署指南。
  tags:
