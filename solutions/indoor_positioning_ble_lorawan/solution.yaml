    external_bc03_beacon:
      name: SenseCAP BC03 Indoor Bluetooth Beacon
      image: https://media-cdn.seeedstudio.com/media/catalog/product/cache/961a49e1875f8c1f40e5990d74e68365/1/-/1-bc03-bluetooth-beacon.jpg
      product_url: https://www.seeedstudio.com/Indoor-Bluetooth-Beacon-BC03-p-6732.html
      description: Bluetooth LE 5.0 beacon with iBeacon/Eddystone support, up to 2 years battery life
      name_i18n:
        zh: SenseCAP BC03 室内蓝牙信标
      description_i18n:
        zh: 蓝牙 LE 5.0 信标，支持 iBeacon/Eddystone，电池寿命长达 2 年
    sensecap_m2_gateway:
