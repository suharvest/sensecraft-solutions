version: "1.0"
id: rk3588_deploy
name: reComputer RK3588
type: docker_deploy

# Single source-of-truth device YAML. Backend derives docker_local and
# docker_remote views via derive_docker_views().
#
# device_class=rk3588 pulls in shared RK3588 pre-deploy fixes
# (iptables nf_tables -> legacy switch) and the hardware detection probe
# (/proc/device-tree/compatible match) from devices/profiles/rk3588.yaml.
device_class: rk3588

docker:
  compose_file: assets/rk3588/docker-compose.yml
  remote_path: /home/{{username}}/gun-detection-rk3588
  options:
    project_name: gun-detection-rk3588
    remove_orphans: true
  services:
    - name: frigate
      port: 5000
      health_check_endpoint: /api/version
      required: true

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password

user_inputs:
  - id: rtsp_url_1
    name: "Camera 1 RTSP URL (optional)"
    type: text
    required: false
    placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
    name_i18n:
      zh: "摄像头 1 RTSP 地址（可选）"
  - id: rtsp_url_2
    name: "Camera 2 RTSP URL (optional)"
    type: text
    required: false
    placeholder: "rtsp://admin:password@192.168.1.65:554/Streaming/Channels/101"
    name_i18n:
      zh: "摄像头 2 RTSP 地址（可选）"

post_deployment:
  open_browser: true
  url: http://localhost:5000

name_i18n:
  zh: reComputer RK3588

actions:
  before:
    - name: Fetch and verify the RKNN model
      timeout: 900
      run: |
        set -e
        ROOT="assets/rk3588"
        if [ ! -f "$ROOT/docker-compose.yml" ]; then
          echo "docker-compose.yml not found in $PWD/$ROOT" >&2
          exit 1
        fi
        MODELS_DIR="$ROOT/config/model_cache"
        MODEL="$MODELS_DIR/yolo11s_gun_rk3588_i8.rknn"
        SHA=05234018c549fb1ccdfd219ae7bfbfc2eaadc399e601976474eb8fc827250bd5
        URL=https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/models/yolo11s_gun_rk3588_i8.rknn

        mkdir -p "$MODELS_DIR"

        if [ -s "$MODEL" ] && echo "$SHA  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
          echo "RKNN model already present and verified: $MODEL"
          exit 0
        fi

        echo "Downloading yolo11s_gun_rk3588_i8.rknn ..."
        curl -fSL --retry 3 --continue-at - -o "$MODEL.part" "$URL"
        if ! echo "$SHA  $MODEL.part" | sha256sum -c -; then
          rm -f "$MODEL.part"
          exit 1
        fi
        mv -f "$MODEL.part" "$MODEL"
        echo "RKNN model verified: $MODEL"
      name_i18n:
        zh: 获取并校验 RKNN 模型

    - name: Fetch and verify the demo videos
      timeout: 300
      run: |
        set -e
        ROOT="assets/rk3588"
        if [ ! -f "$ROOT/docker-compose.yml" ]; then
          echo "docker-compose.yml not found in $PWD/$ROOT" >&2
          exit 1
        fi
        STORAGE_DIR="$ROOT/storage"
        mkdir -p "$STORAGE_DIR"

        fetch_video() {
          local name="$1" sha="$2" url="$3"
          local dest="$STORAGE_DIR/$name"
          if [ -s "$dest" ] && echo "$sha  $dest" | sha256sum -c - >/dev/null 2>&1; then
            echo "$name already present and verified"
            return 0
          fi
          echo "Downloading $name ..."
          curl -fSL --retry 3 --continue-at - -o "$dest.part" "$url"
          if ! echo "$sha  $dest.part" | sha256sum -c -; then
            rm -f "$dest.part"
            return 1
          fi
          mv -f "$dest.part" "$dest"
          echo "$name verified: $dest"
        }

        fetch_video handgun.mp4 \
          a0f9f66b05fefab3efce023db3519010f22ec9bc4195382ece5f6a9ccf9996f5 \
          https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/handgun.mp4
        fetch_video machinegun.mov \
          e6219f9df566aa09a9cae49eac7c2e3ce59e92aa5afad20aecf7e6c76d438da7 \
          https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/machinegun.mov
      name_i18n:
        zh: 获取并校验演示视频
  after:
    - name: Configure RTSP cameras
      ignore_error: false
      # Passed as environment variables, not spliced into the script:
      # a quote, $ or & in the value cannot change what runs.
      env:
        INPUT_RTSP_URL_1: "{{rtsp_url_1}}"
        INPUT_RTSP_URL_2: "{{rtsp_url_2}}"
      run: |
        bash -s <<'EOF'
        set -euo pipefail
        URL1="${INPUT_RTSP_URL_1:-}"
        URL2="${INPUT_RTSP_URL_2:-}"
        case "${URL1}${URL2}" in
          *$'\n'*|*$'\r'*)
            echo "ERROR: RTSP URL must not contain newline characters" >&2
            exit 1
            ;;
        esac

        ROOT="assets/rk3588"
        if [ ! -f "$ROOT/docker-compose.yml" ]; then
          echo "docker-compose.yml not found in $PWD/$ROOT" >&2
          exit 1
        fi
        CONFIG="$ROOT/config/config.yml"
        CFG_THRESHOLD="0.45"
        CFG_HWACCEL="preset-rk-h264"
        export INPUT_RTSP_URL_1="$URL1"
        export INPUT_RTSP_URL_2="$URL2"
        export CFG_THRESHOLD CFG_HWACCEL

        USE_PY_YAML=0
        if command -v python3 >/dev/null 2>&1 && python3 -c 'import yaml' >/dev/null 2>&1; then
          USE_PY_YAML=1
        fi

        if [ -z "$URL1" ] && [ -z "$URL2" ]; then
          has_rtsp=0
          if [ "$USE_PY_YAML" -eq 1 ]; then
            has_rtsp=$(python3 - "$CONFIG" <<'PYCHK'
        import re, sys, yaml

        def redact(text):
            return re.sub(r"([A-Za-z][A-Za-z0-9+.-]*://)([^:@/\s]+):([^@/\s]+)@", r"\1***:***@", str(text))

        try:
            with open(sys.argv[1], "r", encoding="utf-8") as f:
                data = yaml.safe_load(f)
        except yaml.YAMLError as exc:
            mark = getattr(exc, "problem_mark", None)
            loc = f" at line {mark.line + 1}, column {mark.column + 1}" if mark else ""
            problem = redact(getattr(exc, "problem", None) or type(exc).__name__)
            sys.stderr.write(f"ERROR: Failed to parse Frigate config{loc}: {problem}\n")
            sys.exit(1)

        cams = data.get("cameras") if isinstance(data, dict) else None
        print("1" if isinstance(cams, dict) and ("rtsp_camera_1" in cams or "rtsp_camera_2" in cams) else "0")
        PYCHK
            )
          elif grep -qE '^[[:space:]]+(rtsp_camera_1|rtsp_camera_2):[[:space:]]*(#.*)?$' "$CONFIG"; then
            has_rtsp=1
          fi
          if [ "$has_rtsp" -eq 0 ]; then
            echo "No RTSP cameras configured, using demo videos only"
            exit 0
          fi
        fi

        TMP_CONFIG="${CONFIG}.tmp.$$"
        trap 'rm -f "$TMP_CONFIG"' EXIT

        if [ "$USE_PY_YAML" -eq 1 ]; then
          python3 - "$CONFIG" "$TMP_CONFIG" "$CFG_THRESHOLD" "$CFG_HWACCEL" <<'PYEOF'
        import os, re, sys, yaml

        def redact(text):
            return re.sub(r"([A-Za-z][A-Za-z0-9+.-]*://)([^:@/\s]+):([^@/\s]+)@", r"\1***:***@", str(text))

        cfg_in, cfg_out, threshold_str, hwaccel = sys.argv[1:5]
        threshold = float(threshold_str)
        url1 = os.environ.get("INPUT_RTSP_URL_1", "")
        url2 = os.environ.get("INPUT_RTSP_URL_2", "")

        try:
            with open(cfg_in, "r", encoding="utf-8") as f:
                data = yaml.safe_load(f)
        except yaml.YAMLError as exc:
            mark = getattr(exc, "problem_mark", None)
            loc = f" at line {mark.line + 1}, column {mark.column + 1}" if mark else ""
            problem = redact(getattr(exc, "problem", None) or type(exc).__name__)
            sys.stderr.write(f"ERROR: Failed to parse Frigate config{loc}: {problem}\n")
            sys.exit(1)
        except OSError as exc:
            sys.stderr.write(f"ERROR: Failed to read Frigate config: {redact(exc)}\n")
            sys.exit(1)

        if not isinstance(data, dict):
            sys.stderr.write("ERROR: Invalid Frigate config: top-level mapping expected\n")
            sys.exit(1)

        cameras = data.get("cameras")
        if cameras is None:
            cameras = {}
            data["cameras"] = cameras
        elif not isinstance(cameras, dict):
            sys.stderr.write("ERROR: Invalid Frigate config: 'cameras' must be a mapping\n")
            sys.exit(1)

        def build_camera(url):
            ffmpeg_cfg = {"inputs": [{"path": url, "roles": ["detect", "record"]}]}
            if hwaccel:
                ffmpeg_cfg["hwaccel_args"] = hwaccel
            return {
                "enabled": True,
                "ffmpeg": ffmpeg_cfg,
                "detect": {"width": 1920, "height": 1080, "fps": 5},
                "objects": {
                    "track": ["gun"],
                    "filters": {"gun": {"threshold": threshold, "min_area": 10, "max_area": 500000}},
                },
            }

        targets = [("rtsp_camera_1", url1), ("rtsp_camera_2", url2)]
        for cam_name, cam_url in targets:
            if cam_url:
                cameras[cam_name] = build_camera(cam_url)
            else:
                cameras.pop(cam_name, None)

        try:
            dumped = yaml.safe_dump(data, sort_keys=False, allow_unicode=True, default_flow_style=False)
        except TypeError:
            dumped = yaml.safe_dump(data, allow_unicode=True, default_flow_style=False)

        with open(cfg_out, "w", encoding="utf-8") as f:
            f.write(dumped)

        try:
            with open(cfg_out, "r", encoding="utf-8") as f:
                verified = yaml.safe_load(f)
        except yaml.YAMLError as exc:
            mark = getattr(exc, "problem_mark", None)
            loc = f" at line {mark.line + 1}, column {mark.column + 1}" if mark else ""
            problem = redact(getattr(exc, "problem", None) or type(exc).__name__)
            sys.stderr.write(f"ERROR: Generated Frigate config failed YAML validation{loc}: {problem}\n")
            sys.exit(1)

        if not isinstance(verified, dict) or not isinstance(verified.get("cameras"), dict):
            sys.stderr.write("ERROR: Generated Frigate config missing valid 'cameras' mapping\n")
            sys.exit(1)

        v_cams = verified["cameras"]
        for cam_name, cam_url in targets:
            if cam_url:
                cam_entry = v_cams.get(cam_name)
                inputs = cam_entry.get("ffmpeg", {}).get("inputs", []) if isinstance(cam_entry, dict) else []
                actual_path = inputs[0].get("path") if inputs and isinstance(inputs[0], dict) else None
                if actual_path != cam_url:
                    sys.stderr.write(f"ERROR: Verification failed for {cam_name}: configured RTSP path mismatch\n")
                    sys.exit(1)
            elif cam_name in v_cams:
                sys.stderr.write(f"ERROR: Verification failed: stale {cam_name} was not removed\n")
                sys.exit(1)
        PYEOF
        else
          awk '
            function indent_of(s) { match(s, /^[ ]*/); return RLENGTH }
            function yaml_sq(s,    out, sq) {
              sq = sprintf("%c", 39)
              out = s
              gsub(sq, sq sq, out)
              return sq out sq
            }
            function emit_cam(name, url) {
              print cam_indent name ":"
              print cam_indent "  enabled: true"
              print cam_indent "  ffmpeg:"
              if (hwaccel != "") print cam_indent "    hwaccel_args: " hwaccel
              print cam_indent "    inputs:"
              print cam_indent "      - path: " yaml_sq(url)
              print cam_indent "        roles:"
              print cam_indent "          - detect"
              print cam_indent "          - record"
              print cam_indent "  detect:"
              print cam_indent "    width: 1920"
              print cam_indent "    height: 1080"
              print cam_indent "    fps: 5"
              print cam_indent "  objects:"
              print cam_indent "    track:"
              print cam_indent "      - gun"
              print cam_indent "    filters:"
              print cam_indent "      gun:"
              print cam_indent "        threshold: " threshold
              print cam_indent "        min_area: 10"
              print cam_indent "        max_area: 500000"
            }
            function flush_cams() {
              if (!cams_emitted) {
                if (url1 != "") emit_cam("rtsp_camera_1", url1)
                if (url2 != "") emit_cam("rtsp_camera_2", url2)
                cams_emitted = 1
              }
            }
            BEGIN {
              url1 = ENVIRON["INPUT_RTSP_URL_1"]
              url2 = ENVIRON["INPUT_RTSP_URL_2"]
              threshold = ENVIRON["CFG_THRESHOLD"]
              hwaccel = ENVIRON["CFG_HWACCEL"]
              in_cameras = 0; seen_cameras = 0; cams_emitted = 0
              skipping = 0; skip_indent = -1; cam_indent = "  "; got_cam_indent = 0
            }
            {
              if (skipping) {
                if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^[[:space:]]*#/) next
                if (indent_of($0) > skip_indent) next
                skipping = 0; skip_indent = -1
              }
              if ($0 ~ /^[^[:space:]#]/) {
                if (in_cameras) { flush_cams(); in_cameras = 0 }
                if ($0 ~ /^cameras:[[:space:]]*\{\}[[:space:]]*(#.*)?$/) {
                  in_cameras = 1; seen_cameras = 1
                  print (url1 != "" || url2 != "") ? "cameras:" : $0
                  next
                }
                if ($0 ~ /^cameras:[[:space:]]*(#.*)?$/) { in_cameras = 1; seen_cameras = 1 }
                print $0; next
              }
              if (in_cameras) {
                if ($0 ~ /^[[:space:]]+(rtsp_camera_1|rtsp_camera_2):[[:space:]]*(#.*)?$/) {
                  skip_indent = indent_of($0)
                  if (!got_cam_indent && skip_indent > 0) {
                    cam_indent = substr($0, 1, skip_indent); got_cam_indent = 1
                  }
                  skipping = 1; next
                }
                if (!got_cam_indent && $0 ~ /^[[:space:]]+[A-Za-z0-9_-]+:[[:space:]]*(#.*)?$/) {
                  ind = indent_of($0)
                  if (ind > 0) { cam_indent = substr($0, 1, ind); got_cam_indent = 1 }
                }
              }
              print $0
            }
            END {
              if (in_cameras) {
                flush_cams()
              } else if (!seen_cameras && (url1 != "" || url2 != "")) {
                print "cameras:"; flush_cams()
              }
            }
          ' "$CONFIG" > "$TMP_CONFIG"

          if [ ! -s "$TMP_CONFIG" ] || ! grep -qE '^cameras:' "$TMP_CONFIG"; then
            echo "ERROR: Generated Frigate config missing 'cameras:' section" >&2
            exit 1
          fi
          for cam_idx in 1 2; do
            cam_key="rtsp_camera_${cam_idx}"
            if [ "$cam_idx" -eq 1 ]; then cam_url="$URL1"; else cam_url="$URL2"; fi
            if [ -n "$cam_url" ]; then
              if [ "$(grep -cE "^[[:space:]]+${cam_key}:[[:space:]]*(#.*)?$" "$TMP_CONFIG")" -ne 1 ]; then
                echo "ERROR: Verification failed for ${cam_key} in generated config" >&2
                exit 1
              fi
            elif grep -qE "^[[:space:]]+${cam_key}:[[:space:]]*(#.*)?$" "$TMP_CONFIG"; then
              echo "ERROR: Verification failed: stale ${cam_key} was not removed" >&2
              exit 1
            fi
          done
        fi

        if [ ! -f "${CONFIG}.bak" ]; then
          cp -f "$CONFIG" "${CONFIG}.bak"
        else
          echo "Preserving existing backup ${CONFIG}.bak from previous incomplete run"
        fi
        mv -f "$TMP_CONFIG" "$CONFIG"

        wait_for_frigate() {
          local deadline=$(( $(date +%s) + 30 ))
          while true; do
            if curl -sf -m 3 http://127.0.0.1:5000/api/version >/dev/null; then
              return 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              return 1
            fi
            sleep 2
          done
        }

        healthy=0
        if docker compose -f assets/rk3588/docker-compose.yml -p gun-detection-rk3588 restart; then
          if wait_for_frigate; then
            healthy=1
          fi
        else
          echo "ERROR: Frigate container restart failed" >&2
        fi

        if [ "$healthy" -ne 1 ]; then
          echo "ERROR: Frigate failed /api/version health check within 30s; rolling back $CONFIG" >&2
          cp -f "${CONFIG}.bak" "$CONFIG"
          rollback_healthy=0
          if docker compose -f assets/rk3588/docker-compose.yml -p gun-detection-rk3588 restart; then
            if wait_for_frigate; then
              rollback_healthy=1
            fi
          else
            echo "ERROR: Rollback restart command failed" >&2
          fi
          if [ "$rollback_healthy" -eq 1 ]; then
            rm -f "${CONFIG}.bak"
            echo "ROLLBACK SUCCEEDED: Restored previous $CONFIG and Frigate /api/version is healthy" >&2
          else
            echo "ROLLBACK FAILED: Restored $CONFIG but Frigate /api/version failed to recover within 30s (backup kept at ${CONFIG}.bak)" >&2
          fi
          exit 1
        fi

        rm -f "${CONFIG}.bak"
        echo "RTSP cameras configured and Frigate restarted"
        EOF
      name_i18n:
        zh: 配置 RTSP 摄像头

files:
  - url: https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/models/yolo11s_gun_rk3588_i8.rknn
    remote_path: /home/{{username}}/gun-detection-rk3588/rk3588_deploy/config/model_cache/yolo11s_gun_rk3588_i8.rknn
    checksum:
      sha256: "05234018c549fb1ccdfd219ae7bfbfc2eaadc399e601976474eb8fc827250bd5"
  - url: https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/handgun.mp4
    remote_path: /home/{{username}}/gun-detection-rk3588/rk3588_deploy/storage/handgun.mp4
    checksum:
      sha256: a0f9f66b05fefab3efce023db3519010f22ec9bc4195382ece5f6a9ccf9996f5
  - url: https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/machinegun.mov
    remote_path: /home/{{username}}/gun-detection-rk3588/rk3588_deploy/storage/machinegun.mov
    checksum:
      sha256: e6219f9df566aa09a9cae49eac7c2e3ce59e92aa5afad20aecf7e6c76d438da7

remote_overrides:
  compose_dir: assets/rk3588
  detection:
    method: network_scan
    manual_entry: true
  post_deployment:
    open_browser: true
    url: http://{{host}}:5000
  actions:
    after_upload:
      - name: Fetch and verify the RKNN model
        timeout: 900
        run: |
          set -e
          WORKDIR="/home/{{username}}/gun-detection-rk3588/rk3588_deploy"
          MODELS_DIR="$WORKDIR/config/model_cache"
          MODEL="$MODELS_DIR/yolo11s_gun_rk3588_i8.rknn"
          SHA=05234018c549fb1ccdfd219ae7bfbfc2eaadc399e601976474eb8fc827250bd5
          URL=https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/models/yolo11s_gun_rk3588_i8.rknn

          mkdir -p "$MODELS_DIR"

          if [ -s "$MODEL" ] && echo "$SHA  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            echo "RKNN model already present and verified: $MODEL"
            exit 0
          fi

          # 新引擎会通过 device 级 files: 字段在 after_upload 之前把这个文件放好，
          # 这里的下载是老引擎（不认 files: 字段）的兜底路径。
          echo "Downloading yolo11s_gun_rk3588_i8.rknn ..."
          curl -fSL --retry 3 --continue-at - -o "$MODEL.part" "$URL"
          if ! echo "$SHA  $MODEL.part" | sha256sum -c -; then
            rm -f "$MODEL.part"
            exit 1
          fi
          mv -f "$MODEL.part" "$MODEL"
          echo "RKNN model verified: $MODEL"
        name_i18n:
          zh: 获取并校验 RKNN 模型

      - name: Fetch and verify the demo videos
        timeout: 300
        run: |
          set -e
          WORKDIR="/home/{{username}}/gun-detection-rk3588/rk3588_deploy"
          STORAGE_DIR="$WORKDIR/storage"
          mkdir -p "$STORAGE_DIR"

          fetch_video() {
            local name="$1" sha="$2" url="$3"
            local dest="$STORAGE_DIR/$name"
            if [ -s "$dest" ] && echo "$sha  $dest" | sha256sum -c - >/dev/null 2>&1; then
              echo "$name already present and verified"
              return 0
            fi
            # 新引擎会通过 device 级 files: 字段在 after_upload 之前把这两段演示视频放好，
            # 这里的下载是老引擎（不认 files: 字段）的兜底路径。
            echo "Downloading $name ..."
            curl -fSL --retry 3 --continue-at - -o "$dest.part" "$url"
            if ! echo "$sha  $dest.part" | sha256sum -c -; then
              rm -f "$dest.part"
              return 1
            fi
            mv -f "$dest.part" "$dest"
            echo "$name verified: $dest"
          }

          fetch_video handgun.mp4 \
            a0f9f66b05fefab3efce023db3519010f22ec9bc4195382ece5f6a9ccf9996f5 \
            https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/handgun.mp4
          fetch_video machinegun.mov \
            e6219f9df566aa09a9cae49eac7c2e3ce59e92aa5afad20aecf7e6c76d438da7 \
            https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/machinegun.mov
        name_i18n:
          zh: 获取并校验演示视频
    after:
      - name: Configure RTSP cameras
        ignore_error: false
        # Passed as environment variables, not spliced into the script:
        # a quote, $ or & in the value cannot change what runs.
        env:
          INPUT_RTSP_URL_1: "{{rtsp_url_1}}"
          INPUT_RTSP_URL_2: "{{rtsp_url_2}}"
        run: |
          bash -s <<'EOF'
          set -euo pipefail
          URL1="${INPUT_RTSP_URL_1:-}"
          URL2="${INPUT_RTSP_URL_2:-}"
          case "${URL1}${URL2}" in
            *$'\n'*|*$'\r'*)
              echo "ERROR: RTSP URL must not contain newline characters" >&2
              exit 1
              ;;
          esac

          WORKDIR="/home/{{username}}/gun-detection-rk3588/rk3588_deploy"
          CONFIG="$WORKDIR/config/config.yml"
          CFG_THRESHOLD="0.45"
          CFG_HWACCEL="preset-rk-h264"
          export INPUT_RTSP_URL_1="$URL1"
          export INPUT_RTSP_URL_2="$URL2"
          export CFG_THRESHOLD CFG_HWACCEL

          USE_PY_YAML=0
          if command -v python3 >/dev/null 2>&1 && python3 -c 'import yaml' >/dev/null 2>&1; then
            USE_PY_YAML=1
          fi

          if [ -z "$URL1" ] && [ -z "$URL2" ]; then
            has_rtsp=0
            if [ "$USE_PY_YAML" -eq 1 ]; then
              has_rtsp=$(python3 - "$CONFIG" <<'PYCHK'
          import re, sys, yaml

          def redact(text):
              return re.sub(r"([A-Za-z][A-Za-z0-9+.-]*://)([^:@/\s]+):([^@/\s]+)@", r"\1***:***@", str(text))

          try:
              with open(sys.argv[1], "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f)
          except yaml.YAMLError as exc:
              mark = getattr(exc, "problem_mark", None)
              loc = f" at line {mark.line + 1}, column {mark.column + 1}" if mark else ""
              problem = redact(getattr(exc, "problem", None) or type(exc).__name__)
              sys.stderr.write(f"ERROR: Failed to parse Frigate config{loc}: {problem}\n")
              sys.exit(1)

          cams = data.get("cameras") if isinstance(data, dict) else None
          print("1" if isinstance(cams, dict) and ("rtsp_camera_1" in cams or "rtsp_camera_2" in cams) else "0")
          PYCHK
              )
            elif grep -qE '^[[:space:]]+(rtsp_camera_1|rtsp_camera_2):[[:space:]]*(#.*)?$' "$CONFIG"; then
              has_rtsp=1
            fi
            if [ "$has_rtsp" -eq 0 ]; then
              echo "No RTSP cameras configured, using demo videos only"
              exit 0
            fi
          fi

          TMP_CONFIG="${CONFIG}.tmp.$$"
          trap 'rm -f "$TMP_CONFIG"' EXIT

          if [ "$USE_PY_YAML" -eq 1 ]; then
            python3 - "$CONFIG" "$TMP_CONFIG" "$CFG_THRESHOLD" "$CFG_HWACCEL" <<'PYEOF'
          import os, re, sys, yaml

          def redact(text):
              return re.sub(r"([A-Za-z][A-Za-z0-9+.-]*://)([^:@/\s]+):([^@/\s]+)@", r"\1***:***@", str(text))

          cfg_in, cfg_out, threshold_str, hwaccel = sys.argv[1:5]
          threshold = float(threshold_str)
          url1 = os.environ.get("INPUT_RTSP_URL_1", "")
          url2 = os.environ.get("INPUT_RTSP_URL_2", "")

          try:
              with open(cfg_in, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f)
          except yaml.YAMLError as exc:
              mark = getattr(exc, "problem_mark", None)
              loc = f" at line {mark.line + 1}, column {mark.column + 1}" if mark else ""
              problem = redact(getattr(exc, "problem", None) or type(exc).__name__)
              sys.stderr.write(f"ERROR: Failed to parse Frigate config{loc}: {problem}\n")
              sys.exit(1)
          except OSError as exc:
              sys.stderr.write(f"ERROR: Failed to read Frigate config: {redact(exc)}\n")
              sys.exit(1)

          if not isinstance(data, dict):
              sys.stderr.write("ERROR: Invalid Frigate config: top-level mapping expected\n")
              sys.exit(1)

          cameras = data.get("cameras")
          if cameras is None:
              cameras = {}
              data["cameras"] = cameras
          elif not isinstance(cameras, dict):
              sys.stderr.write("ERROR: Invalid Frigate config: 'cameras' must be a mapping\n")
              sys.exit(1)

          def build_camera(url):
              ffmpeg_cfg = {"inputs": [{"path": url, "roles": ["detect", "record"]}]}
              if hwaccel:
                  ffmpeg_cfg["hwaccel_args"] = hwaccel
              return {
                  "enabled": True,
                  "ffmpeg": ffmpeg_cfg,
                  "detect": {"width": 1920, "height": 1080, "fps": 5},
                  "objects": {
                      "track": ["gun"],
                      "filters": {"gun": {"threshold": threshold, "min_area": 10, "max_area": 500000}},
                  },
              }

          targets = [("rtsp_camera_1", url1), ("rtsp_camera_2", url2)]
          for cam_name, cam_url in targets:
              if cam_url:
                  cameras[cam_name] = build_camera(cam_url)
              else:
                  cameras.pop(cam_name, None)

          try:
              dumped = yaml.safe_dump(data, sort_keys=False, allow_unicode=True, default_flow_style=False)
          except TypeError:
              dumped = yaml.safe_dump(data, allow_unicode=True, default_flow_style=False)

          with open(cfg_out, "w", encoding="utf-8") as f:
              f.write(dumped)

          try:
              with open(cfg_out, "r", encoding="utf-8") as f:
                  verified = yaml.safe_load(f)
          except yaml.YAMLError as exc:
              mark = getattr(exc, "problem_mark", None)
              loc = f" at line {mark.line + 1}, column {mark.column + 1}" if mark else ""
              problem = redact(getattr(exc, "problem", None) or type(exc).__name__)
              sys.stderr.write(f"ERROR: Generated Frigate config failed YAML validation{loc}: {problem}\n")
              sys.exit(1)

          if not isinstance(verified, dict) or not isinstance(verified.get("cameras"), dict):
              sys.stderr.write("ERROR: Generated Frigate config missing valid 'cameras' mapping\n")
              sys.exit(1)

          v_cams = verified["cameras"]
          for cam_name, cam_url in targets:
              if cam_url:
                  cam_entry = v_cams.get(cam_name)
                  inputs = cam_entry.get("ffmpeg", {}).get("inputs", []) if isinstance(cam_entry, dict) else []
                  actual_path = inputs[0].get("path") if inputs and isinstance(inputs[0], dict) else None
                  if actual_path != cam_url:
                      sys.stderr.write(f"ERROR: Verification failed for {cam_name}: configured RTSP path mismatch\n")
                      sys.exit(1)
              elif cam_name in v_cams:
                  sys.stderr.write(f"ERROR: Verification failed: stale {cam_name} was not removed\n")
                  sys.exit(1)
          PYEOF
          else
            awk '
              function indent_of(s) { match(s, /^[ ]*/); return RLENGTH }
              function yaml_sq(s,    out, sq) {
                sq = sprintf("%c", 39)
                out = s
                gsub(sq, sq sq, out)
                return sq out sq
              }
              function emit_cam(name, url) {
                print cam_indent name ":"
                print cam_indent "  enabled: true"
                print cam_indent "  ffmpeg:"
                if (hwaccel != "") print cam_indent "    hwaccel_args: " hwaccel
                print cam_indent "    inputs:"
                print cam_indent "      - path: " yaml_sq(url)
                print cam_indent "        roles:"
                print cam_indent "          - detect"
                print cam_indent "          - record"
                print cam_indent "  detect:"
                print cam_indent "    width: 1920"
                print cam_indent "    height: 1080"
                print cam_indent "    fps: 5"
                print cam_indent "  objects:"
                print cam_indent "    track:"
                print cam_indent "      - gun"
                print cam_indent "    filters:"
                print cam_indent "      gun:"
                print cam_indent "        threshold: " threshold
                print cam_indent "        min_area: 10"
                print cam_indent "        max_area: 500000"
              }
              function flush_cams() {
                if (!cams_emitted) {
                  if (url1 != "") emit_cam("rtsp_camera_1", url1)
                  if (url2 != "") emit_cam("rtsp_camera_2", url2)
                  cams_emitted = 1
                }
              }
              BEGIN {
                url1 = ENVIRON["INPUT_RTSP_URL_1"]
                url2 = ENVIRON["INPUT_RTSP_URL_2"]
                threshold = ENVIRON["CFG_THRESHOLD"]
                hwaccel = ENVIRON["CFG_HWACCEL"]
                in_cameras = 0; seen_cameras = 0; cams_emitted = 0
                skipping = 0; skip_indent = -1; cam_indent = "  "; got_cam_indent = 0
              }
              {
                if (skipping) {
                  if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^[[:space:]]*#/) next
                  if (indent_of($0) > skip_indent) next
                  skipping = 0; skip_indent = -1
                }
                if ($0 ~ /^[^[:space:]#]/) {
                  if (in_cameras) { flush_cams(); in_cameras = 0 }
                  if ($0 ~ /^cameras:[[:space:]]*\{\}[[:space:]]*(#.*)?$/) {
                    in_cameras = 1; seen_cameras = 1
                    print (url1 != "" || url2 != "") ? "cameras:" : $0
                    next
                  }
                  if ($0 ~ /^cameras:[[:space:]]*(#.*)?$/) { in_cameras = 1; seen_cameras = 1 }
                  print $0; next
                }
                if (in_cameras) {
                  if ($0 ~ /^[[:space:]]+(rtsp_camera_1|rtsp_camera_2):[[:space:]]*(#.*)?$/) {
                    skip_indent = indent_of($0)
                    if (!got_cam_indent && skip_indent > 0) {
                      cam_indent = substr($0, 1, skip_indent); got_cam_indent = 1
                    }
                    skipping = 1; next
                  }
                  if (!got_cam_indent && $0 ~ /^[[:space:]]+[A-Za-z0-9_-]+:[[:space:]]*(#.*)?$/) {
                    ind = indent_of($0)
                    if (ind > 0) { cam_indent = substr($0, 1, ind); got_cam_indent = 1 }
                  }
                }
                print $0
              }
              END {
                if (in_cameras) {
                  flush_cams()
                } else if (!seen_cameras && (url1 != "" || url2 != "")) {
                  print "cameras:"; flush_cams()
                }
              }
            ' "$CONFIG" > "$TMP_CONFIG"

            if [ ! -s "$TMP_CONFIG" ] || ! grep -qE '^cameras:' "$TMP_CONFIG"; then
              echo "ERROR: Generated Frigate config missing 'cameras:' section" >&2
              exit 1
            fi
            for cam_idx in 1 2; do
              cam_key="rtsp_camera_${cam_idx}"
              if [ "$cam_idx" -eq 1 ]; then cam_url="$URL1"; else cam_url="$URL2"; fi
              if [ -n "$cam_url" ]; then
                if [ "$(grep -cE "^[[:space:]]+${cam_key}:[[:space:]]*(#.*)?$" "$TMP_CONFIG")" -ne 1 ]; then
                  echo "ERROR: Verification failed for ${cam_key} in generated config" >&2
                  exit 1
                fi
              elif grep -qE "^[[:space:]]+${cam_key}:[[:space:]]*(#.*)?$" "$TMP_CONFIG"; then
                echo "ERROR: Verification failed: stale ${cam_key} was not removed" >&2
                exit 1
              fi
            done
          fi

          if [ ! -f "${CONFIG}.bak" ]; then
            cp -f "$CONFIG" "${CONFIG}.bak"
          else
            echo "Preserving existing backup ${CONFIG}.bak from previous incomplete run"
          fi
          mv -f "$TMP_CONFIG" "$CONFIG"
          cd "$WORKDIR"

          wait_for_frigate() {
            local deadline=$(( $(date +%s) + 30 ))
            while true; do
              if curl -sf -m 3 http://127.0.0.1:5000/api/version >/dev/null; then
                return 0
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                return 1
              fi
              sleep 2
            done
          }

          healthy=0
          if docker compose -p gun-detection-rk3588 restart; then
            if wait_for_frigate; then
              healthy=1
            fi
          else
            echo "ERROR: Frigate container restart failed" >&2
          fi

          if [ "$healthy" -ne 1 ]; then
            echo "ERROR: Frigate failed /api/version health check within 30s; rolling back $CONFIG" >&2
            cp -f "${CONFIG}.bak" "$CONFIG"
            rollback_healthy=0
            if docker compose -p gun-detection-rk3588 restart; then
              if wait_for_frigate; then
                rollback_healthy=1
              fi
            else
              echo "ERROR: Rollback restart command failed" >&2
            fi
            if [ "$rollback_healthy" -eq 1 ]; then
              rm -f "${CONFIG}.bak"
              echo "ROLLBACK SUCCEEDED: Restored previous $CONFIG and Frigate /api/version is healthy" >&2
            else
              echo "ROLLBACK FAILED: Restored $CONFIG but Frigate /api/version failed to recover within 30s (backup kept at ${CONFIG}.bak)" >&2
            fi
            exit 1
          fi

          rm -f "${CONFIG}.bak"
          echo "RTSP cameras configured and Frigate restarted"
          EOF
        name_i18n:
          zh: 配置 RTSP 摄像头
