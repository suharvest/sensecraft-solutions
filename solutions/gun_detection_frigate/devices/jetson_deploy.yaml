version: "1.0"
id: jetson_deploy
name: NVIDIA Jetson
type: docker_deploy

# Single source-of-truth device YAML. Backend derives docker_local and
# docker_remote views via derive_docker_views().
#
# device_class=jetson pulls in shared Jetson pre-deploy fixes (iptables
# raw-table workaround for JetPack 6.x) and the hardware detection probe
# (test -f /etc/nv_tegra_release) from devices/profiles/jetson.yaml.
device_class: jetson

docker:
  compose_file: assets/jetson/docker-compose.yml
  remote_path: /home/{{username}}/gun-detection-frigate
  options:
    project_name: gun-detection-frigate
    remove_orphans: true
  services:
    - name: frigate
      port: 5000
      health_check_endpoint: /api/version
      required: true

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password

user_inputs:
  - id: rtsp_url_1
    name: "Camera 1 RTSP URL (optional)"
    type: text
    required: false
    placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
    name_i18n:
      zh: "摄像头 1 RTSP 地址（可选）"
  - id: rtsp_url_2
    name: "Camera 2 RTSP URL (optional)"
    type: text
    required: false
    placeholder: "rtsp://admin:password@192.168.1.65:554/Streaming/Channels/101"
    name_i18n:
      zh: "摄像头 2 RTSP 地址（可选）"

pre_checks:
  - type: disk_space
    min_gb: 4
    description: At least 4GB for Frigate TensorRT Docker image

post_deployment:
  open_browser: true
  url: http://localhost:5000

name_i18n:
  zh: NVIDIA Jetson

files:
  - url: https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/handgun.mp4
    remote_path: /home/{{username}}/gun-detection-frigate/jetson_deploy/storage/handgun.mp4
    checksum:
      sha256: a0f9f66b05fefab3efce023db3519010f22ec9bc4195382ece5f6a9ccf9996f5
  - url: https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/machinegun.mov
    remote_path: /home/{{username}}/gun-detection-frigate/jetson_deploy/storage/machinegun.mov
    checksum:
      sha256: e6219f9df566aa09a9cae49eac7c2e3ce59e92aa5afad20aecf7e6c76d438da7

remote_overrides:
  compose_dir: assets/jetson
  detection:
    method: network_scan
    manual_entry: true
  post_deployment:
    open_browser: true
    url: http://{{host}}:5000
  actions:
    after_upload:
      - name: Fetch and verify the demo videos
        timeout: 300
        run: |
          set -e
          WORKDIR="/home/{{username}}/gun-detection-frigate/jetson_deploy"
          STORAGE_DIR="$WORKDIR/storage"
          mkdir -p "$STORAGE_DIR"

          fetch_video() {
            local name="$1" sha="$2" url="$3"
            local dest="$STORAGE_DIR/$name"
            if [ -s "$dest" ] && echo "$sha  $dest" | sha256sum -c - >/dev/null 2>&1; then
              echo "$name already present and verified"
              return 0
            fi
            # 新引擎会通过 device 级 files: 字段在 after_upload 之前把这两段演示视频放好，
            # 这里的下载是老引擎（不认 files: 字段）的兜底路径。
            echo "Downloading $name ..."
            curl -fSL --retry 3 --continue-at - -o "$dest.part" "$url"
            if ! echo "$sha  $dest.part" | sha256sum -c -; then
              rm -f "$dest.part"
              return 1
            fi
            mv -f "$dest.part" "$dest"
            echo "$name verified: $dest"
          }

          fetch_video handgun.mp4 \
            a0f9f66b05fefab3efce023db3519010f22ec9bc4195382ece5f6a9ccf9996f5 \
            https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/handgun.mp4
          fetch_video machinegun.mov \
            e6219f9df566aa09a9cae49eac7c2e3ce59e92aa5afad20aecf7e6c76d438da7 \
            https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/machinegun.mov
        name_i18n:
          zh: 获取并校验演示视频
    after:
      - name: Configure RTSP cameras
        ignore_error: false
        # Passed as environment variables, not spliced into the script:
        # a quote, $ or & in the value cannot change what runs.
        env:
          INPUT_RTSP_URL_1: "{{rtsp_url_1}}"
          INPUT_RTSP_URL_2: "{{rtsp_url_2}}"
        run: |
          bash -s <<'EOF'
          set -euo pipefail
          URL1="${INPUT_RTSP_URL_1:-}"
          URL2="${INPUT_RTSP_URL_2:-}"
          if [ -z "$URL1" ] && [ -z "$URL2" ]; then
            echo "No RTSP cameras configured, using demo videos only"
            exit 0
          fi

          WORKDIR="/home/{{username}}/gun-detection-frigate/jetson_deploy"
          CONFIG="$WORKDIR/config/config.yml"
          TMP_CONFIG="${CONFIG}.tmp.$$"
          trap 'rm -f "$TMP_CONFIG"' EXIT
          cp -f "$CONFIG" "$TMP_CONFIG"

          add_camera() {
            local name="$1" url="$2"
            cat >> "$TMP_CONFIG" << 'ENDCAM'

            __CAMERA_NAME__:
              enabled: true
              ffmpeg:
                inputs:
                  - path: __CAMERA_URL__
                    roles:
                      - detect
                      - record
              detect:
                width: 1920
                height: 1080
                fps: 5
              objects:
                track:
                  - gun
                filters:
                  gun:
                    threshold: 0.3
                    min_area: 10
                    max_area: 500000
          ENDCAM
            sed -i "s|__CAMERA_NAME__|$name|" "$TMP_CONFIG"
            # \ & and | would be read by sed itself; escape them so the
            # URL lands in the config verbatim.
            url_sed=$(printf '%s' "$url" | sed -e 's/[\\&|]/\\&/g')
            sed -i "s|__CAMERA_URL__|$url_sed|" "$TMP_CONFIG"
          }

          if [ -n "$URL1" ]; then
            add_camera "rtsp_camera_1" "$URL1"
          fi
          if [ -n "$URL2" ]; then
            add_camera "rtsp_camera_2" "$URL2"
          fi

          if command -v python3 >/dev/null 2>&1 && python3 -c 'import yaml' >/dev/null 2>&1; then
            python3 -c 'import sys, yaml; data = yaml.safe_load(open(sys.argv[1])); assert isinstance(data, dict) and isinstance(data.get("cameras"), dict)' "$TMP_CONFIG"
          else
            [ -s "$TMP_CONFIG" ] && grep -qE '^[[:space:]]*rtsp_camera_[12]:' "$TMP_CONFIG"
          fi

          mv -f "$TMP_CONFIG" "$CONFIG"
          cd "$WORKDIR"
          docker compose -p gun-detection-frigate restart
          echo "RTSP cameras configured and Frigate restarted"
          EOF
        name_i18n:
          zh: 配置 RTSP 摄像头
