version: "1.0"
id: rk3576_deploy
name: reComputer RK3576
type: docker_deploy

# Single source-of-truth device YAML. Backend derives docker_local and
# docker_remote views via derive_docker_views().
#
# device_class=rk3576 pulls in shared RK3576 pre-deploy fixes
# (iptables nf_tables -> legacy switch) and the hardware detection probe
# (/proc/device-tree/compatible match) from devices/profiles/rk3576.yaml.
device_class: rk3576

docker:
  compose_file: assets/rk3576/docker-compose.yml
  remote_path: /home/{{username}}/gun-detection-rk3576
  options:
    project_name: gun-detection-rk3576
    remove_orphans: true
  services:
    - name: frigate
      port: 5000
      health_check_endpoint: /api/version
      required: true

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password

user_inputs:
  - id: rtsp_url_1
    name: "Camera 1 RTSP URL (optional)"
    type: text
    required: false
    placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
    name_i18n:
      zh: "摄像头 1 RTSP 地址（可选）"
  - id: rtsp_url_2
    name: "Camera 2 RTSP URL (optional)"
    type: text
    required: false
    placeholder: "rtsp://admin:password@192.168.1.65:554/Streaming/Channels/101"
    name_i18n:
      zh: "摄像头 2 RTSP 地址（可选）"

post_deployment:
  open_browser: true
  url: http://localhost:5000

name_i18n:
  zh: reComputer RK3576

actions:
  before:
    - name: Fetch and verify the RKNN model
      timeout: 900
      run: |
        set -e
        ROOT="assets/rk3576"
        if [ ! -f "$ROOT/docker-compose.yml" ]; then
          echo "docker-compose.yml not found in $PWD/$ROOT" >&2
          exit 1
        fi
        MODELS_DIR="$ROOT/config/model_cache"
        MODEL="$MODELS_DIR/yolo11s_gun_rk3576_i8.rknn"
        SHA=7ed66cab446243bffa8f85a1c12e3311505066bba8851513f165bc95ac77ef93
        URL=https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/models/yolo11s_gun_rk3576_i8.rknn

        mkdir -p "$MODELS_DIR"

        if [ -s "$MODEL" ] && echo "$SHA  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
          echo "RKNN model already present and verified: $MODEL"
          exit 0
        fi

        echo "Downloading yolo11s_gun_rk3576_i8.rknn ..."
        curl -fSL --retry 3 --continue-at - -o "$MODEL.part" "$URL"
        if ! echo "$SHA  $MODEL.part" | sha256sum -c -; then
          rm -f "$MODEL.part"
          exit 1
        fi
        mv -f "$MODEL.part" "$MODEL"
        echo "RKNN model verified: $MODEL"
      name_i18n:
        zh: 获取并校验 RKNN 模型

    - name: Fetch and verify the demo videos
      timeout: 300
      run: |
        set -e
        ROOT="assets/rk3576"
        if [ ! -f "$ROOT/docker-compose.yml" ]; then
          echo "docker-compose.yml not found in $PWD/$ROOT" >&2
          exit 1
        fi
        STORAGE_DIR="$ROOT/storage"
        mkdir -p "$STORAGE_DIR"

        fetch_video() {
          local name="$1" sha="$2" url="$3"
          local dest="$STORAGE_DIR/$name"
          if [ -s "$dest" ] && echo "$sha  $dest" | sha256sum -c - >/dev/null 2>&1; then
            echo "$name already present and verified"
            return 0
          fi
          echo "Downloading $name ..."
          curl -fSL --retry 3 --continue-at - -o "$dest.part" "$url"
          if ! echo "$sha  $dest.part" | sha256sum -c -; then
            rm -f "$dest.part"
            return 1
          fi
          mv -f "$dest.part" "$dest"
          echo "$name verified: $dest"
        }

        fetch_video handgun.mp4 \
          a0f9f66b05fefab3efce023db3519010f22ec9bc4195382ece5f6a9ccf9996f5 \
          https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/handgun.mp4
        fetch_video machinegun.mov \
          e6219f9df566aa09a9cae49eac7c2e3ce59e92aa5afad20aecf7e6c76d438da7 \
          https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/machinegun.mov
      name_i18n:
        zh: 获取并校验演示视频

files:
  - url: https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/models/yolo11s_gun_rk3576_i8.rknn
    remote_path: /home/{{username}}/gun-detection-rk3576/rk3576_deploy/config/model_cache/yolo11s_gun_rk3576_i8.rknn
    checksum:
      sha256: "7ed66cab446243bffa8f85a1c12e3311505066bba8851513f165bc95ac77ef93"
  - url: https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/handgun.mp4
    remote_path: /home/{{username}}/gun-detection-rk3576/rk3576_deploy/storage/handgun.mp4
    checksum:
      sha256: a0f9f66b05fefab3efce023db3519010f22ec9bc4195382ece5f6a9ccf9996f5
  - url: https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/machinegun.mov
    remote_path: /home/{{username}}/gun-detection-rk3576/rk3576_deploy/storage/machinegun.mov
    checksum:
      sha256: e6219f9df566aa09a9cae49eac7c2e3ce59e92aa5afad20aecf7e6c76d438da7

remote_overrides:
  compose_dir: assets/rk3576
  detection:
    method: network_scan
    manual_entry: true
  post_deployment:
    open_browser: true
    url: http://{{host}}:5000
  actions:
    after_upload:
      - name: Fetch and verify the RKNN model
        timeout: 900
        run: |
          set -e
          WORKDIR="/home/{{username}}/gun-detection-rk3576/rk3576_deploy"
          MODELS_DIR="$WORKDIR/config/model_cache"
          MODEL="$MODELS_DIR/yolo11s_gun_rk3576_i8.rknn"
          SHA=7ed66cab446243bffa8f85a1c12e3311505066bba8851513f165bc95ac77ef93
          URL=https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/models/yolo11s_gun_rk3576_i8.rknn

          mkdir -p "$MODELS_DIR"

          if [ -s "$MODEL" ] && echo "$SHA  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            echo "RKNN model already present and verified: $MODEL"
            exit 0
          fi

          # 新引擎会通过 device 级 files: 字段在 after_upload 之前把这个文件放好，
          # 这里的下载是老引擎（不认 files: 字段）的兜底路径。
          echo "Downloading yolo11s_gun_rk3576_i8.rknn ..."
          curl -fSL --retry 3 --continue-at - -o "$MODEL.part" "$URL"
          if ! echo "$SHA  $MODEL.part" | sha256sum -c -; then
            rm -f "$MODEL.part"
            exit 1
          fi
          mv -f "$MODEL.part" "$MODEL"
          echo "RKNN model verified: $MODEL"
        name_i18n:
          zh: 获取并校验 RKNN 模型

      - name: Fetch and verify the demo videos
        timeout: 300
        run: |
          set -e
          WORKDIR="/home/{{username}}/gun-detection-rk3576/rk3576_deploy"
          STORAGE_DIR="$WORKDIR/storage"
          mkdir -p "$STORAGE_DIR"

          fetch_video() {
            local name="$1" sha="$2" url="$3"
            local dest="$STORAGE_DIR/$name"
            if [ -s "$dest" ] && echo "$sha  $dest" | sha256sum -c - >/dev/null 2>&1; then
              echo "$name already present and verified"
              return 0
            fi
            # 新引擎会通过 device 级 files: 字段在 after_upload 之前把这两段演示视频放好，
            # 这里的下载是老引擎（不认 files: 字段）的兜底路径。
            echo "Downloading $name ..."
            curl -fSL --retry 3 --continue-at - -o "$dest.part" "$url"
            if ! echo "$sha  $dest.part" | sha256sum -c -; then
              rm -f "$dest.part"
              return 1
            fi
            mv -f "$dest.part" "$dest"
            echo "$name verified: $dest"
          }

          fetch_video handgun.mp4 \
            a0f9f66b05fefab3efce023db3519010f22ec9bc4195382ece5f6a9ccf9996f5 \
            https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/handgun.mp4
          fetch_video machinegun.mov \
            e6219f9df566aa09a9cae49eac7c2e3ce59e92aa5afad20aecf7e6c76d438da7 \
            https://sensecraft-statics.seeed.cc/solution-app/gun_detection_frigate/media/machinegun.mov
        name_i18n:
          zh: 获取并校验演示视频
    after:
      - name: Configure RTSP cameras
        ignore_error: false
        # Passed as environment variables, not spliced into the script:
        # a quote, $ or & in the value cannot change what runs.
        env:
          INPUT_RTSP_URL_1: "{{rtsp_url_1}}"
          INPUT_RTSP_URL_2: "{{rtsp_url_2}}"
        run: |
          bash -s <<'EOF'
          set -euo pipefail
          URL1="${INPUT_RTSP_URL_1:-}"
          URL2="${INPUT_RTSP_URL_2:-}"
          if [ -z "$URL1" ] && [ -z "$URL2" ]; then
            echo "No RTSP cameras configured, using demo videos only"
            exit 0
          fi

          WORKDIR="/home/{{username}}/gun-detection-rk3576/rk3576_deploy"
          CONFIG="$WORKDIR/config/config.yml"
          TMP_CONFIG="${CONFIG}.tmp.$$"
          trap 'rm -f "$TMP_CONFIG"' EXIT
          cp -f "$CONFIG" "$TMP_CONFIG"

          add_camera() {
            local name="$1" url="$2"
            cat >> "$TMP_CONFIG" << 'ENDCAM'

            __CAMERA_NAME__:
              enabled: true
              ffmpeg:
                hwaccel_args: preset-rk-h264
                inputs:
                  - path: __CAMERA_URL__
                    roles:
                      - detect
                      - record
              detect:
                width: 1920
                height: 1080
                fps: 5
              objects:
                track:
                  - gun
                filters:
                  gun:
                    threshold: 0.45
                    min_area: 10
                    max_area: 500000
          ENDCAM
            sed -i "s|__CAMERA_NAME__|$name|" "$TMP_CONFIG"
            # \ & and | would be read by sed itself; escape them so the
            # URL lands in the config verbatim.
            url_sed=$(printf '%s' "$url" | sed -e 's/[\\&|]/\\&/g')
            sed -i "s|__CAMERA_URL__|$url_sed|" "$TMP_CONFIG"
          }

          if [ -n "$URL1" ]; then
            add_camera "rtsp_camera_1" "$URL1"
          fi
          if [ -n "$URL2" ]; then
            add_camera "rtsp_camera_2" "$URL2"
          fi

          if command -v python3 >/dev/null 2>&1 && python3 -c 'import yaml' >/dev/null 2>&1; then
            python3 -c 'import sys, yaml; data = yaml.safe_load(open(sys.argv[1])); assert isinstance(data, dict) and isinstance(data.get("cameras"), dict)' "$TMP_CONFIG"
          else
            [ -s "$TMP_CONFIG" ] && grep -qE '^[[:space:]]*rtsp_camera_[12]:' "$TMP_CONFIG"
          fi

          mv -f "$TMP_CONFIG" "$CONFIG"
          cd "$WORKDIR"
          docker compose -p gun-detection-rk3576 restart
          echo "RTSP cameras configured and Frigate restarted"
          EOF
        name_i18n:
          zh: 配置 RTSP 摄像头
