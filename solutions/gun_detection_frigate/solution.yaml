version: "1.0"
id: gun_detection_frigate
name: AI Gun Detection
intro:
  summary: Real-time gun detection using Frigate NVR with AI-accelerated video analysis on edge devices
  description_file: description.md
  cover_image: gallery/cover.svg
  category: security
  tags: [security, gun-detection, frigate, nvr, ai]
  solution_type: solution


  input_requirements:
    - type: rtsp
      description: IP camera RTSP stream for surveillance
      description_i18n:
        zh: 用于监控的 IP 摄像头 RTSP 视频流
  device_catalog:
    recomputer_j40:
      description: Edge AI computing device with TensorRT GPU acceleration
      description_i18n:
        zh: 支持 TensorRT GPU 加速的边缘 AI 计算设备
    recomputer_j50:
      description: High-performance edge AI with TensorRT GPU acceleration
      description_i18n:
        zh: 高性能边缘 AI 设备，支持 TensorRT GPU 加速
    recomputer_r21_industrial_ai:
      description: Industrial edge AI with Hailo NPU acceleration
      description_i18n:
        zh: 搭载 Hailo NPU 加速的工业边缘 AI 设备
  presets:
    - id: jetson
      name: NVIDIA Jetson
      description: Deploy with TensorRT GPU acceleration on NVIDIA Jetson
      device_groups:
        - id: edge_device
          name: Edge AI Device
          type: single
          required: true
          options:
            - device_ref: recomputer_j40
            - device_ref: recomputer_j50
          default: recomputer_j40

          name_i18n:
            zh: 边缘 AI 设备
      name_i18n:
        zh: NVIDIA Jetson
      description_i18n:
        zh: 在 NVIDIA Jetson 上使用 TensorRT GPU 加速部署
    - id: r2000_hailo
      name: reComputer R2000 + Hailo
      description: Deploy with Hailo NPU acceleration on reComputer R2000
      device_groups:
        - id: edge_device
          name: Edge AI Device
          type: single
          required: true
          options:
            - device_ref: recomputer_r21_industrial_ai
          default: recomputer_r21_industrial_ai
          name_i18n:
            zh: 边缘 AI 设备
      name_i18n:
        zh: reComputer R2000 + Hailo
      description_i18n:
        zh: 在 reComputer R2000 上使用 Hailo NPU 加速部署
  stats:
    difficulty: beginner
    estimated_time: 10min

  links:
    github: https://github.com/Seeed-Studio/frigate-on-jetson

  summary_i18n:
    zh: 使用 Frigate NVR 在边缘设备上实时检测枪支，支持多种 AI 加速硬件
  description_file_i18n:
    zh: description_zh.md
deployment:
  guide_file: guide.md
  selection_mode: sequential
  guide_file_i18n:
    zh: guide_zh.md
name_i18n:
  zh: AI 视觉枪支检测
