mqtt:
  enabled: true
  host: mosquitto
  port: 1883

go2rtc:
  ffmpeg:
    file: "-re -stream_loop -1 -i {input}"
  streams:
    handgun_demo:
      - "ffmpeg:/media/frigate/handgun.mp4#video=h264"
    machinegun_demo:
      - "ffmpeg:/media/frigate/machinegun.mov#video=h264"

detectors:
  rknn:
    type: rknn
    num_cores: 2

model:
  width: 640
  height: 640
  input_tensor: nhwc
  input_pixel_format: rgb
  input_dtype: int
  model_type: yolo-generic
  path: /config/model_cache/yolo11s_gun_rk3576_i8.rknn
  labelmap:
    0: person
    1: gun

objects:
  track:
    - gun
  filters:
    gun:
      threshold: 0.45
      min_area: 10
      max_area: 500000

detect:
  enabled: true

record:
  enabled: true
  retain:
    days: 3

snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true
  crop: false
  retain:
    default: 14
  quality: 95

birdseye:
  enabled: true
  mode: objects

auth:
  enabled: false

logger:
  default: error

version: 0.16-0

ffmpeg:
  hwaccel_args: preset-rk-h264

cameras:
  handgun_demo:
    enabled: true
    ffmpeg:
      hwaccel_args: preset-rk-h264
      inputs:
        - path: /media/frigate/handgun.mp4
          input_args: -stream_loop -1 -re
          roles:
            - detect
    detect:
      width: 640
      height: 480
      fps: 5
    objects:
      track:
        - gun
      filters:
        gun:
          threshold: 0.45
          min_area: 10
          max_area: 500000

  machinegun_demo:
    enabled: true
    ffmpeg:
      hwaccel_args: preset-rk-h264
      inputs:
        - path: /media/frigate/machinegun.mov
          input_args: -stream_loop -1 -re
          roles:
            - detect
    detect:
      width: 640
      height: 480
      fps: 5
    objects:
      track:
        - gun
      filters:
        gun:
          threshold: 0.45
          min_area: 10
          max_area: 500000
