version: "1.0"
id: dashboard
name: Open the Monitoring Dashboard
name_i18n:
  zh: 打开监测看板
type: web_dashboard

# 看板地址由部署步 jetson_worktime 决定：host 取部署连接，http_port 取部署步
# 「网页端口」（默认 8088）。下方输入仅作占位与默认值，运行时自动带入。
inherit_host_from: jetson_worktime

web_dashboard:
  url: "http://{{host}}:{{http_port}}/"
  title: Workstation Monitoring Dashboard
  title_i18n:
    zh: 工位监测看板
  description: Live workstation view with worktime statistics, material counts, and the model training center.
  description_i18n:
    zh: 实时工位画面、工时统计、物料计数与模型训练中心。

user_inputs:
  - id: host
    name: Monitoring Host IP
    name_i18n:
      zh: 监测主机 IP
    type: text
    default: "127.0.0.1"
    default_template: "{{host}}"
    required: true
  - id: http_port
    name: Web port
    name_i18n:
      zh: 网页端口
    type: text
    default: "8088"
    default_template: "{{http_port}}"
    required: true
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    description: Filled in from the web port in the deploy step.
    description_i18n:
      zh: 自动带入部署步骤里的「网页端口」。