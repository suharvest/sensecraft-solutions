version: "1.0"
id: jetson_worktime
name: Workstation Time and Material Monitoring
name_i18n:
  zh: 生产工位工时与物料监测
type: docker_deploy
# The strict release preflight owns compatibility checks. Avoid the generic
# Jetson profile, which can restart Docker before the training safety gate.

device_detection:
  - type: shell
    command: >-
      python3 -c 'from pathlib import Path; import platform;
      release=Path("/etc/nv_tegra_release").read_text();
      assert "# R36 " in release and "REVISION: 4.3," in release;
      assert platform.machine()=="aarch64";
      assert platform.release()=="5.15.148-tegra";
      assert "VERSION_ID=\"22.04\"" in Path("/etc/os-release").read_text()'
    description: Verify Ubuntu 22.04, L4T 36.4.3 and the supported ARM64 kernel
    description_i18n:
      zh: 校验 Ubuntu 22.04、L4T 36.4.3 与受支持的 ARM64 内核
    on_failure:
      message: This release requires Ubuntu 22.04 ARM64, L4T 36.4.3 and kernel 5.15.148-tegra.
      message_i18n:
        zh: 此版本需要 Ubuntu 22.04 ARM64、L4T 36.4.3 和 5.15.148-tegra 内核。

docker:
  compose_file: assets/docker/docker-compose.yml
  compose_dir: assets/docker
  environment:
    WORKTIME_PORT: "{{http_port}}"
    WORKTIME_MEDIA_PORT_OFFSET: "{{media_port_offset}}"
    WORKTIME_ENCODER: "{{encoder}}"
  options:
    project_name: jetson_worktime
    remove_orphans: false
  offline:
    arch: aarch64
    images:
      - chenduola6/jetson-worktime:0.1.0-rc1-jp62-r36.4.3
  services:
    - name: web
      required: true
    - name: trainer
      required: true

user_inputs:
  - id: http_port
    name: Web port
    name_i18n:
      zh: 网页端口
    type: number
    default: "8088"
    required: true
    validation:
      min: "1024"
      max: "65535"
  - id: media_port_offset
    name: Media port offset
    name_i18n:
      zh: 媒体端口偏移
    type: number
    default: "0"
    required: true
    validation:
      min: "0"
      max: "55000"
  - id: encoder
    name: Video encoder
    name_i18n:
      zh: 视频编码方式
    type: select
    default: auto
    options:
      - value: auto
        label: Automatic
        label_i18n:
          zh: 自动
      - value: nvidia
        label: NVIDIA hardware encoder
        label_i18n:
          zh: NVIDIA 硬件编码
      - value: x264
        label: Software H.264
        label_i18n:
          zh: 软件 H.264

pre_checks:
  - type: disk_space
    min_gb: 18
    description: Space for image download, extraction, persistent data and rollback

deploy_timeout: 10800

actions:
  after_upload:
    - name: Prepare device configuration and recoverable release
      name_i18n:
        zh: 准备设备配置与可恢复发布
      env:
        COMPOSE_PROJECT_NAME: jetson_worktime
        WORKTIME_PORT: "{{http_port}}"
        WORKTIME_MEDIA_PORT_OFFSET: "{{media_port_offset}}"
        WORKTIME_ENCODER: "{{encoder}}"
      run: |
        set -eu
        DEPLOYMENT_DIR=""
        for candidate in "assets/docker" "."; do
          if [ -f "$candidate/scripts/release.py" ]; then
            DEPLOYMENT_DIR="$candidate"
            break
          fi
        done
        if [ -z "$DEPLOYMENT_DIR" ]; then
          echo "Deployment directory not found (expected assets/docker/scripts/release.py)" >&2
          exit 1
        fi
        python3 "$DEPLOYMENT_DIR/scripts/release.py" configure
        python3 "$DEPLOYMENT_DIR/scripts/release.py" prepare --pull
      timeout: 1800
  after:
    - name: Commit the verified release
      name_i18n:
        zh: 提交已验证的发布
      env:
        COMPOSE_PROJECT_NAME: jetson_worktime
      run: |
        set -eu
        DEPLOYMENT_DIR=""
        for candidate in "assets/docker" "."; do
          if [ -f "$candidate/scripts/release.py" ]; then
            DEPLOYMENT_DIR="$candidate"
            break
          fi
        done
        if [ -z "$DEPLOYMENT_DIR" ]; then
          echo "Deployment directory not found (expected assets/docker/scripts/release.py)" >&2
          exit 1
        fi
        python3 "$DEPLOYMENT_DIR/scripts/release.py" commit
      timeout: 30

post_deployment:
  open_browser: false
  url: "http://localhost:{{http_port}}/"

remote_overrides:
  remote_path: .sensecraft/deployments
  compose_dir: assets/docker
  ssh:
    port: 22
    default_user: recomputer
    auth_methods: [password, key]
    connection_timeout: 30
    command_timeout: 7200
  actions:
    after_upload:
      - name: Prepare device configuration and recoverable release
        name_i18n:
          zh: 准备设备配置与可恢复发布
        env:
          COMPOSE_PROJECT_NAME: jetson_worktime
          WORKTIME_PORT: "{{http_port}}"
          WORKTIME_MEDIA_PORT_OFFSET: "{{media_port_offset}}"
          WORKTIME_ENCODER: "{{encoder}}"
        run: |
          set -eu
          DEPLOYMENT_DIR=""
          for candidate in \
            "$HOME/.sensecraft/deployments/jetson_worktime" \
            "$HOME/.sensecraft/deployments"; do
            if [ -f "$candidate/scripts/release.py" ]; then
              DEPLOYMENT_DIR="$candidate"
              break
            fi
          done
          if [ -z "$DEPLOYMENT_DIR" ]; then
            echo "Deployment directory not found under $HOME/.sensecraft/deployments" >&2
            exit 1
          fi
          python3 "$DEPLOYMENT_DIR/scripts/release.py" configure
          python3 "$DEPLOYMENT_DIR/scripts/release.py" prepare --pull
        timeout: 1800
    after:
      - name: Commit the verified release
        name_i18n:
          zh: 提交已验证的发布
        env:
          COMPOSE_PROJECT_NAME: jetson_worktime
        run: |
          set -eu
          DEPLOYMENT_DIR=""
          for candidate in \
            "$HOME/.sensecraft/deployments/jetson_worktime" \
            "$HOME/.sensecraft/deployments"; do
            if [ -f "$candidate/scripts/release.py" ]; then
              DEPLOYMENT_DIR="$candidate"
              break
            fi
          done
          if [ -z "$DEPLOYMENT_DIR" ]; then
            echo "Deployment directory not found under $HOME/.sensecraft/deployments" >&2
            exit 1
          fi
          python3 "$DEPLOYMENT_DIR/scripts/release.py" commit
        timeout: 30
  post_deployment:
    open_browser: false
    url: "http://{{host}}:{{http_port}}/"
