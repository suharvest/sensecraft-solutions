<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型检测测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08131a;color:#e9f3f6;font:15px system-ui,sans-serif}header{padding:15px 22px;border-bottom:1px solid #29424d;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0}small,.muted{color:#91a8b3}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;padding:16px;height:calc(100dvh - 65px)}.viewer{min-height:0;display:flex;flex-direction:column;border:1px solid #29424d;border-radius:12px;overflow:hidden}.stage{flex:1;min-height:0;position:relative;background:#02070a;display:flex;align-items:center;justify-content:center}canvas{max-width:100%;max-height:100%;object-fit:contain}#notice{position:absolute;padding:12px 18px;background:#182b36ed;border-radius:8px;color:#ffd38a;text-align:center}.toolbar{padding:12px;background:#10222c;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{border:1px solid #385460;color:#eef7fa;background:#1a303b;border-radius:7px;padding:9px 12px;cursor:pointer}button:hover{border-color:#23dbb3}button:disabled{opacity:.4;cursor:default}aside{overflow:auto;padding:18px;border:1px solid #29424d;border-radius:12px;background:#0d1e28}h2{font-size:15px;margin:0 0 14px}.field{margin-bottom:24px}.field label{display:block;margin-bottom:12px}input[type=range]{width:100%;accent-color:#17d7b0}.category{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #203641}.dot{width:10px;height:10px;border-radius:50%}.count{margin-left:auto;font-variant-numeric:tabular-nums}#metrics{font-size:12px;line-height:1.9;color:#a9c1cc}#model{font-size:12px;word-break:break-all}.badge{color:#21deb5}footer{font-size:12px;line-height:1.7;color:#91a8b3;margin-top:24px}@media(max-width:800px){.layout{display:flex;flex-direction:column;height:auto}.viewer{height:65dvh;min-height:320px}aside{overflow:visible}.field{margin-bottom:14px}header{flex-wrap:wrap}}:focus-visible{outline:2px solid #21deb5;outline-offset:3px}
</style>
<header><h1>模型检测测试 <small>YOLO11n</small></h1><span id="connection" class="badge" role="status">正在连接</span></header>
<div class="layout"><section class="viewer"><div class="stage"><canvas id="canvas" width="1280" height="720" aria-label="实时摄像头检测画面"></canvas><div id="notice" role="status">正在连接摄像头…</div></div><div class="toolbar"><button id="pause">暂停画面</button><button id="snapshot" disabled>保存截图</button><button id="fullscreen">全屏</button><select id="quality" aria-label="画面质量"><option value="1280">高清 · 局域网</option><option value="640">流畅 · 远程</option></select><span id="resolution" class="muted"></span></div></section>
<aside><h2>检测设置</h2><div class="field"><label for="confidence">置信度 <strong id="confidenceValue">0.25</strong></label><input id="confidence" type="range" min="0.05" max="0.95" step="0.01" value="0.25"></div><h2>类别与当前数量</h2><div id="categories"></div><div class="field" style="margin-top:24px"><label><input id="boxes" type="checkbox" checked> 显示检测框与标签</label></div><h2>运行状态</h2><div id="metrics"></div><p id="model" class="muted"></p><footer>只显示当前画面的检测结果。数量用于测试模型效果，暂不累计产量。画面沿用设备隐私设置。</footer></aside></div>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
const colors=['#30d4ff','#ffb547','#b89aff','#52e0a2','#ff8ca0','#fff07d'];
let names={},selected=new Set(),bitmap=null,meta=null,paused=false,after=-1,controller=null,timer=null,frames=[],lastSuccess=0,generation=0;
const host=location.hostname.replace(/^\[|\]$/g,'');
const octets=host.split('.').map(Number);if((octets.length===4&&octets[0]===100&&octets[1]>=64&&octets[1]<=127)||host.endsWith('.ts.net')||host.startsWith('fd7a:115c:a1e0:'))$('quality').value='640';
function categories(newNames){if(JSON.stringify(names)===JSON.stringify(newNames))return;names=newNames;selected=new Set(Object.keys(names));$('categories').replaceChildren();for(const [id,name] of Object.entries(names)){const row=document.createElement('label');row.className='category';const check=document.createElement('input');check.type='checkbox';check.checked=true;check.onchange=()=>{check.checked?selected.add(id):selected.delete(id);draw()};const dot=document.createElement('span');dot.className='dot';dot.style.background=colors[Number(id)%colors.length];const title=document.createElement('span');title.textContent=name;const count=document.createElement('span');count.className='count';count.id='count-'+id;count.textContent='—';row.append(check,dot,title,count);$('categories').append(row)}}
function unavailable(message){$('notice').hidden=false;$('notice').textContent=message;$('connection').textContent='正在重连';ctx.clearRect(0,0,canvas.width,canvas.height);meta=null;$('snapshot').disabled=true;for(const id of Object.keys(names))$('count-'+id).textContent='—'}
function draw(){if(!bitmap||!meta)return;canvas.width=bitmap.width;canvas.height=bitmap.height;ctx.drawImage(bitmap,0,0);const scale=canvas.width/meta.width,counts={};const threshold=Number($('confidence').value);for(const box of meta.boxes){const id=String(box.class_id);if(box.confidence<threshold||!selected.has(id))continue;counts[id]=(counts[id]||0)+1;if(!$('boxes').checked)continue;const [x1,y1,x2,y2]=box.xyxy.map(v=>v*scale),color=colors[box.class_id%colors.length];ctx.strokeStyle=color;ctx.lineWidth=Math.max(1.5,canvas.width/640);ctx.strokeRect(x1,y1,x2-x1,y2-y1);const font=Math.max(12,canvas.width/80);ctx.font=`600 ${font}px system-ui`;const text=`${names[id]||id}  ${(box.confidence*100).toFixed(0)}%`,padding=5,tw=ctx.measureText(text).width+padding*2,labelH=font+padding*2;const lx=Math.max(0,Math.min(x1,canvas.width-tw)),ly=Math.max(0,Math.min(y1-labelH,canvas.height-labelH));ctx.fillStyle='#08131ae8';ctx.fillRect(lx,ly,tw,labelH);ctx.fillStyle=color;ctx.fillText(text,lx+padding,ly+font+2)}for(const id of Object.keys(names))$('count-'+id).textContent=selected.has(id)?String(counts[id]||0):'隐藏'}
async function status(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)return;const s=await r.json();categories(s.names);$('model').textContent=`模型：${s.model} · 推理尺寸 ${s.imgsz}`;if(!paused&&s.error)unavailable(s.error)}catch{}}
async function tick(){if(paused||document.hidden)return;const start=performance.now(),current=generation,activeController=new AbortController();controller=activeController;const timeout=setTimeout(()=>activeController.abort(),5000);try{const r=await fetch(`/frame.jpg?after=${after}&width=${$('quality').value}`,{cache:'no-store',signal:activeController.signal});if(r.status===204)return;if(!r.ok)throw Error('摄像头暂不可用，正在重连…');const next=JSON.parse(r.headers.get('X-Detection-Meta'));const b=await createImageBitmap(await r.blob());if(current!==generation||paused||document.hidden){b.close();return}bitmap?.close();bitmap=b;meta=next;after=meta.sequence;lastSuccess=performance.now();frames.push(lastSuccess);frames=frames.filter(t=>lastSuccess-t<3000);draw();$('notice').hidden=true;$('snapshot').disabled=false;$('connection').textContent='实时检测中';$('resolution').textContent=`${b.width} × ${b.height}`;const fps=frames.length>1?((frames.length-1)*1000/(frames.at(-1)-frames[0])).toFixed(1):'—';$('metrics').textContent=`播放 ${fps} FPS · 推理 ${meta.inference_ms} ms · 隐私${meta.privacy==='true'?'开启':meta.privacy==='false'?'关闭':'未知'}`;}catch(e){if(current===generation&&!paused&&!document.hidden)unavailable(e.name==='AbortError'?'连接超时，正在重连…':e.message)}finally{clearTimeout(timeout);if(controller===activeController)controller=null;if(current===generation&&!paused&&!document.hidden)timer=setTimeout(tick,Math.max(0,($('quality').value==='640'?200:100)-(performance.now()-start)))}}
function pause(value){generation++;paused=value;clearTimeout(timer);controller?.abort();$('pause').textContent=paused?'继续画面':'暂停画面';if(paused){$('notice').hidden=false;$('notice').textContent='画面已暂停';$('connection').textContent='已暂停'}else{after=-1;frames=[];tick()}}
$('pause').onclick=()=>pause(!paused);$('confidence').oninput=()=>{$('confidenceValue').textContent=Number($('confidence').value).toFixed(2);draw()};$('boxes').onchange=draw;$('quality').onchange=()=>{after=-1;frames=[]};$('fullscreen').onclick=()=>{const target=document.querySelector('.viewer');if(document.fullscreenElement)document.exitFullscreen();else target.requestFullscreen?.()};$('snapshot').onclick=()=>canvas.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='detection-'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
document.addEventListener('visibilitychange',()=>{generation++;clearTimeout(timer);controller?.abort();if(!document.hidden&&!paused){after=-1;tick()}});window.addEventListener('pagehide',()=>{generation++;clearTimeout(timer);controller?.abort();bitmap?.close()});setInterval(()=>{status();if(!paused&&!document.hidden&&lastSuccess&&performance.now()-lastSuccess>3000)unavailable('未收到实时画面，正在重连…')},1500);status().then(tick);
</script></html>
