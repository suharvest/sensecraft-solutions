[project]
name = "jetson-worktime"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = ["torch==2.7.0", "torchvision==0.22.0", "numpy==1.26.4", "opencv-python==4.11.0.86", "ultralytics==8.3.161", "ultralytics-thop==2.0.14", "lap==0.5.12", "onnx==1.17.0", "pyyaml>=6,<7"]
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
[tool.uv.sources]
torch = { path = "vendor/wheels/torch-2.7.0-cp310-cp310-linux_aarch64.whl" }
torchvision = { path = "vendor/wheels/torchvision-0.22.0-cp310-cp310-linux_aarch64.whl" }
