<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>

  <!-- column captions: product and protocol names only, so one asset serves both languages -->
  <g font-size="13" fill="#8a8f98" text-anchor="middle">
    <text x="115" y="42">LoRaWAN node</text>
    <text x="360" y="42">Your MQTT broker</text>
    <text x="620" y="42">agri-env-ops-dashboard</text>
    <text x="880" y="42">Browser</text>
  </g>

  <!-- sensors -->
  <g>
    <rect x="30" y="150" width="170" height="90" rx="8" fill="#f4f7fb" stroke="#c4d0e0"/>
    <text x="115" y="182" font-size="15" text-anchor="middle" fill="#1f2933">S2100 / S210x</text>
    <text x="115" y="204" font-size="12" text-anchor="middle" fill="#6b7280">T1000 · mesh radios</text>
    <text x="115" y="224" font-size="11" text-anchor="middle" fill="#a0a4ab">any ChirpStack source</text>
  </g>

  <!-- user's broker -->
  <rect x="265" y="150" width="190" height="90" rx="8" fill="#eef6ef" stroke="#b8d6bd"/>
  <text x="360" y="182" font-size="15" text-anchor="middle" fill="#1f2933">MQTT broker</text>
  <text x="360" y="204" font-size="12" text-anchor="middle" fill="#6b7280">application/+/device/+/event/up</text>
  <text x="360" y="224" font-size="11" text-anchor="middle" fill="#a0a4ab">you supply this</text>

  <!-- bridge -->
  <rect x="530" y="130" width="180" height="150" rx="10" fill="#fff7ec" stroke="#e3c48f"/>
  <text x="620" y="162" font-size="16" text-anchor="middle" fill="#1f2933">ops dashboard</text>
  <text x="620" y="186" font-size="12" text-anchor="middle" fill="#6b7280">decode + dedupe</text>
  <text x="620" y="204" font-size="12" text-anchor="middle" fill="#6b7280">SQLite history</text>
  <text x="620" y="228" font-size="12" text-anchor="middle" fill="#6b7280">HTTP + WebSocket</text>
  <text x="620" y="252" font-size="11" text-anchor="middle" fill="#a0a4ab">receive only</text>

  <!-- browser -->
  <rect x="760" y="150" width="210" height="90" rx="8" fill="#eef2fb" stroke="#c0c9e2"/>
  <text x="865" y="182" font-size="15" text-anchor="middle" fill="#1f2933">/ops console</text>
  <text x="865" y="204" font-size="12" text-anchor="middle" fill="#6b7280">live readings · trends</text>
  <text x="865" y="224" font-size="12" text-anchor="middle" fill="#6b7280">wind rose · map · mesh</text>

  <!-- arrows -->
  <g stroke="#9aa5b1" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M200 195 H262"/>
    <path d="M455 195 H527"/>
    <path d="M710 195 H756"/>
  </g>

  <!-- note -->
  <rect x="265" y="320" width="705" height="60" rx="8" fill="#fafafa" stroke="#e2e4e8"/>
  <text x="285" y="346" font-size="13" fill="#4b5563">One container subscribes to your broker and serves the dashboard — no cloud account, no Home Assistant.</text>
  <text x="285" y="368" font-size="12" fill="#8a8f98">Works beside any of the other presets, or on its own.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa5b1"/>
    </marker>
  </defs>
</svg>
