# Shared Home Assistant + Mosquitto host. All three presets deploy this one
# first; the per-preset stacks (assets/cloud, assets/tts, assets/chirpstack)
# each run their own agri-env-bridge instance and publish into this broker.
#
# Baseline: recamera_ecosystem/assets/docker/docker-compose.yml (Home Assistant
# + Mosquitto on the same host). Differences here:
#   * Mosquitto runs with a username/password instead of anonymous access,
#     because the bridge may sit on a different machine than the broker.
#   * ports are variables so the stack can move off 8123/1883 when the host
#     already runs something there.
#
# The broker is deliberately separate from any single sensor path: a preset can
# be swapped (cloud -> local ChirpStack) without touching Home Assistant, and
# the entity ids stay the same because the same bridge produces them.

name: ${COMPOSE_PROJECT_NAME:-agri-env}

services:
  homeassistant:
    # 2026.9.1 是 `stable` 在 2026-09-06 指向的版本，digest 与 `stable` 完全一致：
    #   curl -sI -H 'Accept: application/vnd.oci.image.index.v1+json' \
    #     https://ghcr.io/v2/home-assistant/home-assistant/manifests/{stable,2026.9.1}
    #   两者 Docker-Content-Digest 都是 sha256:612d7676…
    # 按 digest 固定：`stable` 每月都会漂，同一份方案在不同时间部署会拿到不同的 HA。
    # 升级 HA 时改这一行的版本号与 digest，不要退回 `stable`。
    image: ghcr.io/home-assistant/home-assistant@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
    container_name: agri-env-homeassistant
    ports:
      - "${HA_PORT:-8123}:8123"
    volumes:
      - ha-config:/config
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      - mosquitto
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: agri-env-mosquitto
    # The password file is generated on first start from the environment, so
    # no credential is baked into the image or committed to the repository.
    # `chown mosquitto:mosquitto` is required: the broker drops privileges to
    # the `mosquitto` user and cannot read a root-owned 0600 pwfile
    # (this failed exactly this way during the local smoke run).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mosquitto_passwd -b -c /mosquitto/data/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chmod 600 /mosquitto/data/passwd
        chown mosquitto:mosquitto /mosquitto/data/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-agrienv}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD must be set}
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  ha-config:
  mosquitto-data:
