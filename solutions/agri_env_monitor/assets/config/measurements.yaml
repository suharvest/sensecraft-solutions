# measurementId → HA 实体语义。
#
# 数据来源（见 docs/DECODER-PROVENANCE.md）：
#   ID → 物理量名：Seeed-Solution/SenseCAP-Decoder @ d0a234205fb9574dd03abd49561b60c243c0d1e3
#     S210X 系列：third_party/SenseCAP-Decoder/S210X/Helium/SenseCAP_S210X_Helium_Decoder.js
#     T1000    ：third_party/SenseCAP-Decoder/T1000/TTN/SenseCAP_T1000_TTN_Decoder.js
#   device_class / unit_of_measurement / state_class：decoder 源码里没有这些信息，
#     由本项目按 Home Assistant sensor 文档补齐（docs/IMPL-NOTES.md 第 2 条）。
#     每条 ID 的 decoder 行号写在该条目末尾的注释里。
#
# 每条字段：
#   entity_key            HA 实体后缀，与 state topic 一致
#   name                  实体显示名
#   device_class          HA sensor device_class，缺省不写
#   unit_of_measurement   单位
#   state_class           measurement / total_increasing
#   value_type            float | int | bool | json | str
#   enabled               false 则解析但不建实体

