# 型号 → 该型号会上报哪些 measurementId。
#
# decoder 仓库按平台（TTN/ChirpStack/Helium/AWS）分目录，S210X 全系列共用一份
# decoder，源码里没有「哪个型号发哪些 ID」的对照。因此除 T1000 外全部留空并标 TODO，
# 不按物理量猜。桥的运行不依赖这一节——实体是按收到的 measurementId 动态建的，
# 这里只用于文档与打包时的清单核对。
models:
  T1000:
    # decoder: third_party/SenseCAP-Decoder/T1000/TTN/SenseCAP_T1000_TTN_Decoder.js:278-344
    - "3000"
    - "4097"
    - "4197"
    - "4198"
    - "4199"
    - "4200"
    - "5001"
    - "5002"
