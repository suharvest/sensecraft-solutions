version: "1.0"
id: r12_gateway_chirpstack
name: Bring Up the reComputer R12 Gateway Radio (ChirpStack)
type: manual

# Only needed on the reComputer R12 route of preset 3 — the M2 has its own
# radio. Kept separate from r12_gateway_tts.yaml because the software half
# differs: ChirpStack expects either the Semtech UDP packet forwarder talking to
# the gateway bridge, or the native `chirpstack-concentratord-sx1302` over ZMQ.
#
# NOT VERIFIED ON HARDWARE. No reComputer R12 unit was driven during packaging.
# Its concentrator is SX1302-based, so the forwarder configuration matches a
# discrete WM1302 on SPI; the concentratord-over-ZMQ path into a containerised
# gateway bridge is the part most likely to need adjusting.

steps:
  - id: check_radio
    name: Connect the antenna and check the band
    name_i18n:
      zh: 接好天线并核对频段
    description: >-
      The concentrator is already inside the R12 unit. Connect the supplied LoRa
      antenna to its SMA jack before applying power — transmitting into an open
      port can damage the radio. The regional band the unit was ordered on must
      match the frequency plan you chose in the deployment step and the band the
      nodes are configured for.
    description_i18n:
      zh: >-
        集中器已经在 R12 机器里。上电之前先把随机的 LoRa 天线接到 SMA 座上——
        开路发射可能损坏射频。这台机器下单时的地区频段，必须与部署步骤里选的频段、
        以及节点配置的频段三者一致。
    optional: false

  - id: enable_spi
    name: Confirm the SPI device and control lines
    name_i18n:
      zh: 确认 SPI 设备与控制线
    description: >-
      Confirm `/dev/spidev0.0` is present — the shipped image usually exposes it
      already; if not, enable SPI and reboot. The concentrator needs its reset,
      power-enable and SX1261 lines driven; take the pin numbers from the R12
      product wiki and note them down.
    description_i18n:
      zh: >-
        确认 `/dev/spidev0.0` 存在——出厂镜像通常已经暴露；没有就打开 SPI 后重启。
        集中器需要驱动 reset、power-enable 与 SX1261 三条控制线；引脚编号取自 R12
        产品 wiki，记下来备用。
    optional: false

  - id: forwarder
    name: Feed uplinks into ChirpStack
    name_i18n:
      zh: 把上行送进 ChirpStack
    description: >-
      Two ways in, pick one. The simpler one is `sx1302_hal`'s Semtech UDP
      packet forwarder pointed at this host's port 1700, which the
      chirpstack-gateway-bridge container already listens on. The native one is
      `chirpstack-concentratord-sx1302` on the unit, with the gateway bridge
      configured for its ZMQ sockets — lower latency, but the ZMQ endpoints have
      to be reachable from inside the container, which is the unverified part of
      this route. Start with the UDP forwarder; move to concentratord once
      uplinks are arriving.
    description_i18n:
      zh: >-
        两条路，选一条。简单的一条是用 `sx1302_hal` 的 Semtech UDP packet forwarder
        指向本机 1700 端口——chirpstack-gateway-bridge 容器已经在这个端口上监听。
        原生的一条是在宿主机跑 `chirpstack-concentratord-sx1302`，
        让 gateway bridge 走它的 ZMQ 套接字——延迟更低，但 ZMQ 端点必须能从容器内访问，
        这正是本路线未经验证的部分。先用 UDP forwarder，等上行进来之后再换 concentratord。
    optional: false

  - id: register_gateway
    name: Register the gateway in ChirpStack
    name_i18n:
      zh: 在 ChirpStack 里注册网关
    description: >-
      Open the ChirpStack web interface on port 8080, sign in with the default
      admin credentials and change the password. Add a gateway using the EUI the
      forwarder printed on startup. Its `Last seen` field starts updating within
      about a minute. If it does not, the packets are not arriving — check UDP
      1700 through any firewall before touching the radio configuration.
    description_i18n:
      zh: >-
        打开 8080 端口的 ChirpStack Web 界面，用默认管理员账号登录并改掉密码。
        用 forwarder 启动时打印的 EUI 添加一个网关。大约一分钟内它的 `Last seen` 会开始更新。
        如果没有，说明数据包没到——先查防火墙上的 UDP 1700，再动射频配置。
    optional: false

name_i18n:
  zh: 启用 reComputer R12 网关射频（ChirpStack）
