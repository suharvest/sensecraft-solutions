version: "1.0"
id: verify_health
name: Verify Health & Live Preview
name_i18n:
  zh: 验证服务与实时预览
type: http_debug
http_debug:
  endpoints:
    - id: snapshot
      name: Live snapshot
      name_i18n:
        zh: 实时画面抓拍
      url_template: "http://{{host}}:8001/snapshot.jpg"
      expected_status: 200
user_inputs:
  - id: host
    name: Device IP Address
    name_i18n:
      zh: 设备 IP 地址
    type: text
    default: 192.168.42.1
    required: true
