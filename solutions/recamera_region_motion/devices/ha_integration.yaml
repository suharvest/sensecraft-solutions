version: "1.0"
id: ha_integration
name: Home Assistant Integration
name_i18n:
  zh: Home Assistant 集成配置
type: ha_integration

ha_integration:
  domain: recamera
  components_dir: assets/custom_components/recamera
  restart: true
  config_flow_data:
    - name: host
      value_from: camera_host
    - name: api_port
      value: "8080"
      type: int
    - name: rtsp_port
      value: "8554"
      type: int

user_inputs:
  - id: ha_host
    name: Home Assistant Host
    name_i18n:
      zh: Home Assistant 地址
    type: text
    default: "127.0.0.1"
    required: true
    description: IP address or hostname of your Home Assistant instance.
    description_i18n:
      zh: Home Assistant 实例的 IP 地址或主机名。
  - id: ha_port
    name: Home Assistant Port
    name_i18n:
      zh: Home Assistant 端口
    type: text
    default: "8123"
    required: true
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
  - id: ha_username
    name: Home Assistant Username
    name_i18n:
      zh: Home Assistant 用户名
    type: text
    required: true
    description: Administrator username of Home Assistant.
    description_i18n:
      zh: Home Assistant 管理员用户名。
  - id: ha_password
    name: Home Assistant Password
    name_i18n:
      zh: Home Assistant 密码
    type: password
    required: true
    description: Administrator password of Home Assistant.
    description_i18n:
      zh: Home Assistant 管理员密码。
  - id: camera_host
    name: Camera IP Address
    name_i18n:
      zh: 摄像头 IP 地址
    type: text
    default: "192.168.42.1"
    required: true
    description: IP address of the reCamera (USB default 192.168.42.1).
    description_i18n:
      zh: reCamera 摄像头 IP 地址（USB 默认 192.168.42.1）。
