version: "1.0"
enabled: true
id: recamera_region_motion
name: reCamera Region Motion Detection
name_i18n:
  zh: reCamera 选区运动检测
intro:
  summary: Detect motion inside custom polygon regions, view live debug overlays, and seamlessly trigger Home Assistant automations via MQTT.
  summary_i18n:
    zh: 在 reCamera 画面中自由划定选区多边形，实时叠加调试与告警，通过 MQTT 原生联动 Home Assistant。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/cover.svg
  category: vision_video_ai
  solution_type: technical
  tags: [recamera, motion-detection, camera, rtsp, mqtt, home-assistant]
  output_interfaces:
    - type: rtsp
      port: 8554
      path: /live0
      description: H.264 camera stream.
      description_i18n:
        zh: H.264 摄像头视频流。
    - type: websocket
      port: 8001
      path: /
      description: H.264 debug stream with ROI polygon and motion overlay.
      description_i18n:
        zh: 包含选区多边形与运动告警叠加的 H.264 调试流。
    - type: mqtt
      topic: recamera/region-motion/results
      description: Motion detection results and events.
      description_i18n:
        zh: 运动检测状态变化与告警事件。
  input_requirements:
    - type: camera
      description: Built-in reCamera camera module.
      description_i18n:
        zh: reCamera 内置摄像头模组。
  device_catalog:
    recamera_2002:
      description: reCamera 2002 camera running the motion detection service.
      description_i18n:
        zh: 运行选区运动检测服务的 reCamera 2002 摄像头。
    generic_host:
      name: Home Assistant Host
      name_i18n:
        zh: Home Assistant 宿主机
      description: Host running Home Assistant (PC, Linux, or HAOS device).
      description_i18n:
        zh: 运行 Home Assistant 的主机（PC、Linux 或 HAOS 设备）。
  presets:
    - id: recamera_2002
      name: reCamera 2002
      name_i18n:
        zh: reCamera 2002
      description: Install the native region motion service, configure detection zones in console, and integrate with Home Assistant via MQTT.
      description_i18n:
        zh: 安装原生选区运动检测服务，在控制台交互式划定选区，并通过 MQTT 原生接入 Home Assistant。
      device_groups:
        - id: camera
          name: AI Camera
          name_i18n:
            zh: AI 摄像头
          type: single
          required: true
          options:
            - device_ref: recamera_2002
          default: recamera_2002
        - id: ha_host
          name: Home Assistant Host
          name_i18n:
            zh: Home Assistant 宿主机
          type: single
          required: false
          options:
            - device_ref: generic_host
          default: generic_host
  stats:
    difficulty: intermediate
    estimated_time: 10min
  links:
    github: https://github.com/Seeed-Studio/sscma-example-sg200x
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
