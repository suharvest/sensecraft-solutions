services:
  voice-asr:
    image: ${JETSON_VOICE_IMAGE:?set JETSON_VOICE_IMAGE}@${JETSON_VOICE_DIGEST:?set JETSON_VOICE_DIGEST}
    runtime: nvidia
    ipc: host
    network_mode: host
    command: ["/bin/sh", "-c", "exec python3 -m uvicorn server.main:app --host 0.0.0.0 --port 8621"]
    environment:
      OVS_PROFILE: ${JETSON_ASR_PROFILE:?set JETSON_ASR_PROFILE}
      OVS_PROFILE_DEFAULT: ${JETSON_ASR_PROFILE}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      OVS_AUTO_DOWNLOAD_ARTIFACTS: "1"
      HF_MODEL_CACHE_ROOT: /opt/models
    volumes:
      - jetson-models:/opt/models
      - voice-data:/opt/seeed-local-voice/data
      - /usr/local/cuda/lib64:/host-cuda:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/host-nvidia-libs:ro
      - /lib/aarch64-linux-gnu:/host-libs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8621/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
  voice-tts:
    image: ${JETSON_VOICE_IMAGE:?set JETSON_VOICE_IMAGE}@${JETSON_VOICE_DIGEST:?set JETSON_VOICE_DIGEST}
    runtime: nvidia
    ipc: host
    network_mode: host
    command: ["/bin/sh", "-c", "exec python3 -m uvicorn server.main:app --host 0.0.0.0 --port 8622"]
    environment:
      OVS_PROFILE: ${JETSON_TTS_PROFILE:?set JETSON_TTS_PROFILE}
      OVS_PROFILE_DEFAULT: ${JETSON_TTS_PROFILE}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      OVS_AUTO_DOWNLOAD_ARTIFACTS: "1"
      HF_MODEL_CACHE_ROOT: /opt/models
    volumes:
      - jetson-models:/opt/models
      - voice-data:/opt/seeed-local-voice/data
      - /usr/local/cuda/lib64:/host-cuda:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/host-nvidia-libs:ro
      - /lib/aarch64-linux-gnu:/host-libs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8622/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
  wyoming-adapter:
    image: ${ADAPTER_IMAGE:-sensecraft-missionpack.seeed.cn/solution/wyoming-slv-adapter:20261008@sha256:50be4f9fdb6e8977d1ee5b110052fb607b4187707225b84479af246980509c3b}
    network_mode: host
    restart: unless-stopped
    environment:
      SLV_ASR_BASE_URL: ${SLV_ASR_BASE_URL}
      SLV_TTS_BASE_URL: ${SLV_TTS_BASE_URL}

volumes:
  jetson-models:
  voice-data:
