services:
  homeassistant:
    image: ${HA_IMAGE}@${HA_DIGEST}
    network_mode: host
    privileged: true
    environment:
      TZ: ${TZ}
    restart: unless-stopped
    volumes:
      - ${HA_CONFIG_DIR}:/config
      - /run/dbus:/run/dbus:ro
    devices:
      - ${ZBT_DEVICE}:${ZBT_DEVICE}
  esphome:
    profiles: [esphome]
    image: ${ESPHOME_IMAGE}@${ESPHOME_DIGEST}
    network_mode: host
    restart: "no"
    volumes:
      - ${ESPHOME_CONFIG_DIR}:/config
