version: "1.0"
id: home_assistant_whole_home
name: Whole-Home Home Assistant with Local Voice
name_i18n: {zh: 全屋 Home Assistant 接入与本地语音}
enabled: false
intro:
  visibility: staging
  summary: Connect HomeKit and Aqara devices to Home Assistant with a local voice pipeline; Xiaomi Home remains an explicitly non-commercial user-installed example.
  summary_i18n: {zh: 将 HomeKit 和 Aqara 设备接入 Home Assistant，并使用本地语音控制；米家仅作为用户自行安装的非商业示例。}
  description_file: description.md
  description_file_i18n: {zh: description_zh.md}
  category: voice_ai
  solution_type: solution
  tags: [home-assistant, homekit, zigbee, zha, wyoming, local-voice, qwen3-asr, kokoro, piper]
  output_interfaces:
    - type: http
      port: 8123
      endpoint: /
      method: GET
      schema_type: html
      description: Home Assistant web UI.
      description_i18n: {zh: Home Assistant Web 界面。}
    - type: tcp
      port: 10300
      schema_type: binary
      description: Wyoming STT endpoint.
      description_i18n: {zh: Wyoming STT 端点。}
    - type: tcp
      port: 10200
      schema_type: binary
      description: Wyoming TTS endpoint.
      description_i18n: {zh: Wyoming TTS 端点。}
  input_requirements:
    - type: wifi
      description: Voice PE and Home Assistant host must share a LAN.
      description_i18n: {zh: Voice PE 与 Home Assistant 主机必须在同一局域网。}
    - type: bluetooth
      description: ZBT-2 is connected to the Home Assistant host by USB.
      description_i18n: {zh: ZBT-2 通过 USB 连接到 Home Assistant 主机。}
  device_catalog:
    external_raspberry_pi_5:
      name: Raspberry Pi 5 (8GB)
      name_i18n: {zh: 树莓派 5（8GB）}
      description: External 64-bit Raspberry Pi host for Home Assistant Container.
      description_i18n: {zh: 运行 Home Assistant Container 的外部 64 位树莓派主机。}
    recomputer_rk3588:
      name: reComputer RK3588-40 (16GB)
      name_i18n: {zh: reComputer RK3588-40（16GB）}
      description: Single-box Home Assistant and RK voice host.
      description_i18n: {zh: Home Assistant 与 RK 语音同机主机。}
      purchase: {require: {ram_gb: [16]}}
    recomputer_j40:
      name: reComputer J4012 (Orin NX 16GB)
      name_i18n: {zh: reComputer J4012（Orin NX 16GB）}
      description: Jetson voice host for the split preset.
      description_i18n: {zh: 分体套餐的 Jetson 语音主机。}
      purchase: {require: {module: [orin_nx_16]}}
    home_assistant_connect_zbt:
      name: Home Assistant Connect ZBT-2
      name_i18n: {zh: Home Assistant Connect ZBT-2}
      description: Zigbee coordinator, USB attached.
      description_i18n: {zh: USB 连接的 Zigbee 协调器。}
    home_assistant_voice:
      name: Home Assistant Voice Preview Edition
      name_i18n: {zh: Home Assistant Voice Preview Edition}
      description: Voice PE satellite.
      description_i18n: {zh: Voice PE 语音终端。}
    sonoff_snzb_sensor:
      name: SONOFF Zigbee sensor
      name_i18n: {zh: SONOFF Zigbee 传感器}
      description: Optional Zigbee sensor for the room setup.
      description_i18n: {zh: 房间场景可选的 Zigbee 传感器。}
  presets:
    - id: rk_single_box
      name: RK3588 Single Box (Draft)
      name_i18n: {zh: RK3588 单机（草稿）}
      badge: Blocked artifact
      badge_i18n: {zh: artifact 阻塞}
      description: HA Container and RK Piper voice stack on one 16GB host.
      description_i18n: {zh: 在 16GB 主机上运行 HA Container 与 RK Piper 语音栈。}
      device_groups:
        - {id: hub, name: Home Assistant host, name_i18n: {zh: Home Assistant 主机}, type: single, required: true, options: [{device_ref: recomputer_rk3588}], default: recomputer_rk3588}
        - {id: radio, name: Zigbee coordinator, name_i18n: {zh: Zigbee 协调器}, type: single, required: true, options: [{device_ref: home_assistant_connect_zbt}], default: home_assistant_connect_zbt}
        - {id: satellite, name: Voice satellite, name_i18n: {zh: 语音终端}, type: single, required: true, options: [{device_ref: home_assistant_voice}], default: home_assistant_voice}
    - id: rpi_jetson
      name: Raspberry Pi + Jetson Voice (Draft)
      name_i18n: {zh: 树莓派 + Jetson 语音（草稿）}
      badge: Blocked artifact
      badge_i18n: {zh: artifact 阻塞}
      description: HA Container on Raspberry Pi and split voice services on J4012.
      description_i18n: {zh: 树莓派运行 HA Container，J4012 运行分体语音服务。}
      # Hardware-verified 2026-10-08 for the Wyoming path "voice command -> HA
      # built-in intent -> entity state change" only (receipts
      # harvest-pi/home_assistant_whole_home + orin-nx/home_assistant_whole_home):
      # HA 2026.9.3 from this package's rpi_ha.yml on a Pi 5, voice endpoint on an
      # Orin NX (OVS Qwen3-ASR + Matcha TTS + Wyoming adapter; not the package's
      # split jetson_voice.yml). TTS-generated speech streamed to Assist, virtual
      # demo lights: 5/5 zh+en commands action_done, processed locally, STT final
      # 0.11-0.95 s after audio end. NOT verified: HomeKit pairing, Aqara/ZHA
      # (no ZBT-2), Voice PE, ESPHome, physical mic/speaker, offline, ja.
      verified:
        - hardware
      device_groups:
        - {id: hub, name: Home Assistant host, name_i18n: {zh: Home Assistant 主机}, type: single, required: true, options: [{device_ref: external_raspberry_pi_5}], default: external_raspberry_pi_5}
        - {id: voice_host, name: Voice host, name_i18n: {zh: 语音主机}, type: single, required: true, options: [{device_ref: recomputer_j40}], default: recomputer_j40}
        - {id: radio, name: Zigbee coordinator, name_i18n: {zh: Zigbee 协调器}, type: single, required: true, options: [{device_ref: home_assistant_connect_zbt}], default: home_assistant_connect_zbt}
        - {id: satellite, name: Voice satellite, name_i18n: {zh: 语音终端}, type: single, required: true, options: [{device_ref: home_assistant_voice}], default: home_assistant_voice}
  stats: {difficulty: advanced, estimated_time: 90min}
  links: {}
