# Staging: commercial voice licenses and physical ecosystem acceptance
# (HomeKit pairing, ZHA with ZBT-2, Voice PE, offline) are incomplete; see
# LICENSES.md. Customer copy omits these internal status notes.
version: "1.0"
id: home_assistant_whole_home
name: Whole-Home Home Assistant with Local Voice
name_i18n: {zh: 全屋 Home Assistant 接入与本地语音}
enabled: true
intro:
  visibility: staging
  summary: Bring HomeKit and Zigbee devices such as Aqara into Home Assistant and control them by voice, with speech recognition and speech synthesis running locally on a Jetson.
  summary_i18n: {zh: 把 HomeKit 和 Aqara 等 Zigbee 设备接入 Home Assistant，用语音控制；语音识别和语音合成在本地 Jetson 上完成。}
  description_file: description.md
  description_file_i18n: {zh: description_zh.md}
  cover_image: gallery/cover-20261008.jpg
  gallery:
    - type: image
      src: gallery/dashboard-zh-20261008.jpg
      caption: "Home Assistant dashboard: living-room light, curtain, temperature, humidity and air conditioner; bedroom light and humidifier (demo devices)"
      caption_i18n:
        zh: "Home Assistant 面板：客厅灯、窗帘、温度、湿度和空调，卧室灯和加湿器（演示设备）"
        ja: "Home Assistant ダッシュボード：リビングの照明・カーテン・温度・湿度・エアコン、寝室の照明と加湿器（デモ用デバイス）"
    - type: image
      src: gallery/voice-light-on-zh-20261008.jpg
      caption: "Spoken command 把客厅灯打开 (turn on the living-room light): recognized by the local voice service on the reComputer J40, Home Assistant replies 客厅灯已打开 and the light turns on"
      caption_i18n:
        zh: "语音指令「把客厅灯打开」：由 reComputer J40 上的本地语音服务识别，Home Assistant 回复「客厅灯已打开」，客厅灯随即打开"
        ja: "音声コマンド「把客厅灯打开」（リビングの照明をつけて）：reComputer J40 のローカル音声サービスが認識し、Home Assistant が「客厅灯已打开」と応答して照明が点灯"
  category: voice_ai
  solution_type: solution
  tags: [home-assistant, homekit, zigbee, local-voice, voice-assistant, local-llm]
  output_interfaces:
    - type: http
      port: 8123
      endpoint: /
      method: GET
      schema_type: html
      description: Home Assistant web page, on the Home Assistant host.
      description_i18n: {zh: Home Assistant 网页，在 Home Assistant 主机上。}
    - type: tcp
      port: 10300
      schema_type: binary
      description: Speech-to-text service on the voice host; Home Assistant connects to it through the Wyoming Protocol integration.
      description_i18n: {zh: 语音主机上的语音转文字服务，Home Assistant 通过 Wyoming Protocol 集成连接。}
    - type: tcp
      port: 10200
      schema_type: binary
      description: Text-to-speech service on the voice host; Home Assistant connects to it through the Wyoming Protocol integration.
      description_i18n: {zh: 语音主机上的文字转语音服务，Home Assistant 通过 Wyoming Protocol 集成连接。}
  input_requirements:
    - type: network
      description: The voice terminal, the Home Assistant host and the voice host are on the same local network.
      description_i18n: {zh: 语音终端、Home Assistant 主机和语音主机在同一局域网。}
    - type: usb
      description: The ZBT-2 plugs into a USB port on the Home Assistant host.
      description_i18n: {zh: ZBT-2 插在 Home Assistant 主机的 USB 口上。}
  device_catalog:
    external_raspberry_pi_5:
      name: ARM64 Linux host (8GB)
      name_i18n: {zh: ARM64 Linux 主机（8GB）}
      description: Runs Home Assistant. 64-bit Linux OS, 8GB RAM.
      description_i18n: {zh: 运行 Home Assistant。64 位 Linux 系统，8GB 内存。}
    recomputer_j40:
      description: Runs local speech recognition, speech synthesis and a local LLM for Home Assistant. Choose the Jetson Orin NX 16GB module.
      description_i18n: {zh: 为 Home Assistant 运行本地语音识别、语音合成和本地大模型。选 Jetson Orin NX 16GB 模组。}
      purchase: {require: {module: [orin_nx_16]}}
    recomputer_j30:
      description: Runs local speech recognition and speech synthesis; questions other than device control go to the cloud LLM you enter. Choose the Jetson Orin Nano 8GB module.
      description_i18n: {zh: 运行本地语音识别和语音合成；设备控制之外的问题交给你填写的云端大模型。选 Jetson Orin Nano 8GB 模组。}
      purchase: {require: {module: [orin_nano_8]}}
    # No product family exists for the RK1828 / RM182X card; this entry covers
    # both the card variant (local LLM) and the cloud-LLM variant, as in
    # conversational_voice_ai.
    recomputer_rk3588:
      description: Runs local speech recognition and speech synthesis. With an RK1828 card (16GB board) it also runs a local LLM; without it, questions other than device control go to the cloud LLM you enter.
      description_i18n: {zh: 运行本地语音识别和语音合成。装 RK1828 加速卡（16GB 主板）时同时运行本地大模型；不装时，设备控制之外的问题交给你填写的云端大模型。}
    recomputer_rk3576:
      description: Runs local speech recognition and speech synthesis; questions other than device control go to the cloud LLM you enter.
      description_i18n: {zh: 运行本地语音识别和语音合成；设备控制之外的问题交给你填写的云端大模型。}
      purchase: {require: {ram_gb: [8]}}
    home_assistant_connect_zbt:
      description: Plugs into the Home Assistant host so Zigbee sensors and switches can join.
      description_i18n: {zh: 插在 Home Assistant 主机上，让 Zigbee 传感器和开关接入。}
    home_assistant_voice:
      description: Voice terminal in the room; listens for commands and plays the replies.
      description_i18n: {zh: 放在房间里的语音终端，听指令、播报回复。}
    sonoff_snzb_sensor:
      description: Optional. Reports room temperature, humidity and similar states.
      description_i18n: {zh: 可选，采集房间温湿度等状态。}
  presets:
    - id: rpi_jetson
      name: ARM64 Linux Host + Voice Host
      name_i18n: {zh: ARM64 Linux 主机 + 语音主机}
      badge: Local voice
      badge_i18n: {zh: 本地语音}
      description: Home Assistant runs on an ARM64 Linux host; speech recognition and speech synthesis run locally on a reComputer J40, J30, RK3588 or RK3576. Other questions go to a local LLM (J40, RK3588 + RK1828) or the cloud LLM you enter.
      description_i18n: {zh: Home Assistant 运行在 ARM64 Linux 主机上，语音识别和语音合成在 reComputer J40、J30、RK3588 或 RK3576 上本地运行；其他问题由本地大模型（J40、RK3588 + RK1828）或你填写的云端大模型回答。}
      # Hardware-verified 2026-10-08 for the Wyoming path "voice command -> HA
      # built-in intent -> entity state change" only (receipts
      # harvest-pi/home_assistant_whole_home + orin-nx/home_assistant_whole_home):
      # HA 2026.9.3 from this package's docker-compose.rpi-ha.yml on a Pi 5, voice endpoint on an
      # Orin NX (OVS Qwen3-ASR + Matcha TTS + Wyoming adapter; docker-compose.jetson-voice.yml
      # uses this single-OVS layout; that compose file itself was run on the
      # Orin NX on 2026-10-08 too: Wyoming describe + 3/3 zh/en TTS->STT round-trips). TTS-generated speech streamed to Assist, virtual
      # demo lights: 5/5 zh+en commands action_done, processed locally, STT final
      # 0.11-0.95 s after audio end. NOT verified: HomeKit pairing, Aqara/ZHA
      # (no ZBT-2), Voice PE, ESPHome, physical mic/speaker, offline, ja.
      # 2026-10-09 voice-host extension (throwaway HA 2026.9.3 container on spark,
      # TTS-generated speech streamed to Assist; pipeline conversation agent =
      # LiteLLM agent without the HA control API, prefer_local_intents on):
      #   RK3588 (radxa; docker-compose.rk-voice.yml, openvoicestream:rk-20261009
      #   @629912ed, rk3588-default, the board's existing model volumes mounted
      #   read-only): "打开客厅灯" -> STT "打开客厅灯。", local HassTurnOn, light on,
      #   TTS reply audio; "今天适合开窗吗" -> STT "今天适合开窗吗？", LLM reply via
      #   DeepSeek deepseek-flash 1.59-1.77 s and via RK1828 Qwen3-4B 1.45 s.
      #   The RK1828 run used the board's pre-existing edge-llm-rk1828:20260731-kvreuse
      #   service through a loopback relay, NOT this package's llm service
      #   (20260919-hostruntime.2): the card holds one model at a time.
      #   RK3576 (cat-remote, rk3576-default, resident voice stack stopped for the
      #   window): "打开客厅灯" 2/4 recognized and handled locally (light on), 2/4
      #   misheard (厅厅灯, 蜻蜓灯) and sent to the LLM; "今天适合开窗吗" 2/2,
      #   DeepSeek 1.93-3.31 s; STT 9.6 s on the first sentence, then 0.23-0.54 s.
      #   With the default agent prompt the LLM claimed "客厅灯已打开" for a
      #   misheard command; the guide's agent instruction makes it ask again
      #   (checked by text against DeepSeek through HA's conversation API).
      #   Follow-up with saved WAVs (Wyoming STT direct, 10x each after warm-up):
      #   RK3588 ASR: RK3588 audio 20/20, RK3576 audio 20/20 (0.39-0.54 s after
      #   audio stop). RK3576 ASR: RK3588 audio 20/20, RK3576 audio 10/10 for the
      #   light command and 0/10 exact for the question (嗎 instead of 吗);
      #   0.60-1.00 s. Through HA on RK3576: 10/10. Eight fresh RK3576 TTS takes
      #   (all different) 16/16. The two earlier misses did not reproduce.
      #   NOT run on hardware: the J40 llm service; J30 (orin-nano 2026-10-09: with
      #   the Whisper service and edge-waste-app stopped MemAvailable was 2.1 GB and
      #   stayed >= 1.99 GB, but the test override mounted the model volume
      #   read-only and the voice service exits on the engine lock file
      #   /opt/models/.engine_resolver.lock; no round trip).
      verified:
        - hardware
      device_groups:
        - {id: hub, name: Home Assistant host, name_i18n: {zh: Home Assistant 主机}, type: single, required: true, options: [{device_ref: external_raspberry_pi_5}], default: external_raspberry_pi_5}
        - {id: voice_host, name: Voice host, name_i18n: {zh: 语音主机}, type: single, required: true, options: [{device_ref: recomputer_j40}, {device_ref: recomputer_rk3588}, {device_ref: recomputer_j30}, {device_ref: recomputer_rk3576}], default: recomputer_j40}
        - {id: radio, name: Zigbee coordinator, name_i18n: {zh: Zigbee 协调器}, type: single, required: true, options: [{device_ref: home_assistant_connect_zbt}], default: home_assistant_connect_zbt}
        - {id: satellite, name: Voice terminal, name_i18n: {zh: 语音终端}, type: single, required: true, options: [{device_ref: home_assistant_voice}], default: home_assistant_voice}
  stats: {difficulty: advanced, estimated_time: 90min}
  links: {}
deployment:
  guide_file: guide.md
  guide_file_i18n: {zh: guide_zh.md}
  selection_mode: sequential
