# Staging: commercial voice licenses and physical ecosystem acceptance
# (HomeKit pairing, ZHA with ZBT-2, Voice PE, offline) are incomplete; see
# LICENSES.md. Customer copy omits these internal status notes.
version: "1.0"
id: home_assistant_whole_home
name: Whole-Home Home Assistant with Local Voice
name_i18n: {zh: 全屋 Home Assistant 接入与本地语音}
enabled: true
intro:
  visibility: staging
  summary: Bring HomeKit and Zigbee devices such as Aqara into Home Assistant and control them by voice, with speech recognition and speech synthesis running locally on a Jetson.
  summary_i18n: {zh: 把 HomeKit 和 Aqara 等 Zigbee 设备接入 Home Assistant，用语音控制；语音识别和语音合成在本地 Jetson 上完成。}
  description_file: description.md
  description_file_i18n: {zh: description_zh.md}
  cover_image: gallery/cover-20261008.jpg
  gallery:
    - type: image
      src: gallery/panel-dashboard-zh-20261008.jpg
      caption: "Home Assistant dashboard: the living-room light switched on by a Chinese voice command, plus curtain and air conditioner (demo devices)"
      caption_i18n:
        zh: "Home Assistant 面板：客厅灯由中文语音指令打开，另有窗帘和空调（演示设备）"
        ja: "Home Assistant ダッシュボード：中国語の音声コマンドで点灯したリビング照明、カーテン、エアコン（デモ用デバイス）"
    - type: image
      src: gallery/panel-assist-debug-zh-20261008.jpg
      caption: "Voice assistant run: speech recognized as 打开客厅灯 (turn on the living room light), the light is switched on and Home Assistant replies 客厅灯已打开"
      caption_i18n:
        zh: "语音助手运行记录：识别为「打开客厅灯」，灯被打开，Home Assistant 回复「客厅灯已打开」"
        ja: "音声アシスタントの実行記録：「打开客厅灯」（リビングの照明をつけて）と認識し、照明を点灯、Home Assistant が「客厅灯已打开」と応答"
    - type: image
      src: gallery/panel-assist-debug-zh-stages-20261008.jpg
      caption: "Timing of the same command: speech recognized 0.11 s after the end of speech; the command is handled locally by Home Assistant"
      caption_i18n:
        zh: "同一条指令的耗时：说完 0.11 秒识别出文字，指令由 Home Assistant 在本地处理"
        ja: "同じコマンドの所要時間：発話終了から 0.11 秒で認識、コマンドは Home Assistant がローカルで処理"
    - type: image
      src: gallery/panel-pipeline-config-zh-20261008.jpg
      caption: "Chinese voice assistant settings: speech-to-text and text-to-speech both use the local voice service on the reComputer J40"
      caption_i18n:
        zh: "中文语音助手设置：语音转文字和文字转语音都使用 reComputer J40 上的本地语音服务"
        ja: "中国語音声アシスタントの設定：音声認識と音声合成はどちらも reComputer J40 上のローカル音声サービスを使用"
    - type: image
      src: gallery/panel-wyoming-integration-zh-20261008.jpg
      caption: "The two voice services (speech-to-text and text-to-speech) from the reComputer J40, added to Home Assistant through the Wyoming Protocol integration"
      caption_i18n:
        zh: "通过 Wyoming Protocol 集成添加到 Home Assistant 的两个语音服务（语音转文字、文字转语音），由 reComputer J40 提供"
        ja: "Wyoming Protocol 統合で Home Assistant に追加した 2 つの音声サービス（音声認識・音声合成）、reComputer J40 が提供"
  category: voice_ai
  solution_type: solution
  tags: [home-assistant, homekit, zigbee, local-voice, voice-assistant]
  output_interfaces:
    - type: http
      port: 8123
      endpoint: /
      method: GET
      schema_type: html
      description: Home Assistant web page, on the Home Assistant host.
      description_i18n: {zh: Home Assistant 网页，在 Home Assistant 主机上。}
    - type: tcp
      port: 10300
      schema_type: binary
      description: Speech-to-text service on the reComputer J40; Home Assistant connects to it through the Wyoming Protocol integration.
      description_i18n: {zh: reComputer J40 上的语音转文字服务，Home Assistant 通过 Wyoming Protocol 集成连接。}
    - type: tcp
      port: 10200
      schema_type: binary
      description: Text-to-speech service on the reComputer J40; Home Assistant connects to it through the Wyoming Protocol integration.
      description_i18n: {zh: reComputer J40 上的文字转语音服务，Home Assistant 通过 Wyoming Protocol 集成连接。}
  input_requirements:
    - type: wifi
      description: The voice terminal, the Home Assistant host and the reComputer J40 are on the same local network.
      description_i18n: {zh: 语音终端、Home Assistant 主机和 reComputer J40 在同一局域网。}
    - type: bluetooth
      description: The ZBT-2 plugs into a USB port on the Home Assistant host.
      description_i18n: {zh: ZBT-2 插在 Home Assistant 主机的 USB 口上。}
  device_catalog:
    external_raspberry_pi_5:
      name: ARM64 Linux host (8GB)
      name_i18n: {zh: ARM64 Linux 主机（8GB）}
      description: Runs Home Assistant. 64-bit Linux OS, 8GB RAM.
      description_i18n: {zh: 运行 Home Assistant。64 位 Linux 系统，8GB 内存。}
    recomputer_j40:
      description: Runs local speech recognition and speech synthesis for Home Assistant. Choose the Jetson Orin NX 16GB module.
      description_i18n: {zh: 为 Home Assistant 运行本地语音识别和语音合成。选 Jetson Orin NX 16GB 模组。}
      purchase: {require: {module: [orin_nx_16]}}
    home_assistant_connect_zbt:
      description: Plugs into the Home Assistant host so Zigbee sensors and switches can join.
      description_i18n: {zh: 插在 Home Assistant 主机上，让 Zigbee 传感器和开关接入。}
    home_assistant_voice:
      description: Voice terminal in the room; listens for commands and plays the replies.
      description_i18n: {zh: 放在房间里的语音终端，听指令、播报回复。}
    sonoff_snzb_sensor:
      description: Optional. Reports room temperature, humidity and similar states.
      description_i18n: {zh: 可选，采集房间温湿度等状态。}
  presets:
    - id: rpi_jetson
      name: ARM64 Linux Host + Jetson Orin NX Voice
      name_i18n: {zh: ARM64 Linux 主机 + Jetson Orin NX 语音}
      badge: Local voice
      badge_i18n: {zh: 本地语音}
      description: Home Assistant runs on an ARM64 Linux host; speech recognition and speech synthesis run locally on a reComputer J40 (Jetson Orin NX 16GB).
      description_i18n: {zh: Home Assistant 运行在 ARM64 Linux 主机上，语音识别和语音合成在 reComputer J40（Jetson Orin NX 16GB）上本地运行。}
      # Hardware-verified 2026-10-08 for the Wyoming path "voice command -> HA
      # built-in intent -> entity state change" only (receipts
      # harvest-pi/home_assistant_whole_home + orin-nx/home_assistant_whole_home):
      # HA 2026.9.3 from this package's docker-compose.rpi-ha.yml on a Pi 5, voice endpoint on an
      # Orin NX (OVS Qwen3-ASR + Matcha TTS + Wyoming adapter; docker-compose.jetson-voice.yml
      # uses this single-OVS layout; that compose file itself was run on the
      # Orin NX on 2026-10-08 too: Wyoming describe + 3/3 zh/en TTS->STT round-trips). TTS-generated speech streamed to Assist, virtual
      # demo lights: 5/5 zh+en commands action_done, processed locally, STT final
      # 0.11-0.95 s after audio end. NOT verified: HomeKit pairing, Aqara/ZHA
      # (no ZBT-2), Voice PE, ESPHome, physical mic/speaker, offline, ja.
      verified:
        - hardware
      device_groups:
        - {id: hub, name: Home Assistant host, name_i18n: {zh: Home Assistant 主机}, type: single, required: true, options: [{device_ref: external_raspberry_pi_5}], default: external_raspberry_pi_5}
        - {id: voice_host, name: Voice host, name_i18n: {zh: 语音主机}, type: single, required: true, options: [{device_ref: recomputer_j40}], default: recomputer_j40}
        - {id: radio, name: Zigbee coordinator, name_i18n: {zh: Zigbee 协调器}, type: single, required: true, options: [{device_ref: home_assistant_connect_zbt}], default: home_assistant_connect_zbt}
        - {id: satellite, name: Voice terminal, name_i18n: {zh: 语音终端}, type: single, required: true, options: [{device_ref: home_assistant_voice}], default: home_assistant_voice}
  stats: {difficulty: advanced, estimated_time: 90min}
  links: {}
deployment:
  guide_file: guide.md
  guide_file_i18n: {zh: guide_zh.md}
  selection_mode: sequential
