version: "1.0"
id: rk3588_rk1828_voice
name: Voice services and RK1828 local LLM on the reComputer RK3588
name_i18n: {zh: reComputer RK3588 语音服务与 RK1828 本地大模型}
type: docker_deploy
device_class: rk3588
deploy_timeout: 3600
# RK3588 with an RK1828 / RM182X card: speech on the RK3588 NPU (profile rk3588-default),
# Qwen3-4B on the card for Home Assistant's LiteLLM conversation agent.
docker:
  compose_file: assets/docker/docker-compose.rk3588-rk1828-voice.yml
  compose_dir: assets
  remote_path: /home/{{username}}/ha-whole-home
  options: {project_name: ha_whole_home_rk_voice, remove_orphans: false}
  services: [{name: voice, required: true}, {name: wyoming-adapter, required: true}, {name: llm, required: true}]
  environment:
    VOICE_PORT: "{{voice_port}}"
    WYOMING_STT_PORT: "{{wyoming_stt_port}}"
    WYOMING_TTS_PORT: "{{wyoming_tts_port}}"
    RK_VOICE_PROFILE: "rk3588-default"
    LLM_PORT: "{{llm_port}}"
ssh: {port: 22, default_user: recomputer, auth_methods: [password], connection_timeout: 30, command_timeout: 3600}
pre_checks:
  - {type: disk_space, min_gb: 16, description: The voice services, the local LLM and their models need at least 16 GB of free disk.}
user_inputs:
  - {id: voice_port, name: Voice service port, name_i18n: {zh: 语音服务端口}, type: text, required: false, default: "8623", validation: {pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"}, description: Port used only inside the voice host by the voice services. Change it only if 8623 is already in use., description_i18n: {zh: 语音服务在语音主机内部使用的端口。仅当 8623 已被占用时修改。}}
  - {id: wyoming_stt_port, name: Speech-to-text port, name_i18n: {zh: 语音转文字端口}, type: text, required: false, default: "10300", validation: {pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"}, description: Port Home Assistant connects to for speech-to-text; enter it when adding the Wyoming Protocol integration in step 3. Change it only if 10300 is already in use., description_i18n: {zh: Home Assistant 连接语音转文字服务的端口，步骤 3 添加 Wyoming Protocol 集成时填写。仅当 10300 已被占用时修改。}}
  - {id: wyoming_tts_port, name: Text-to-speech port, name_i18n: {zh: 文字转语音端口}, type: text, required: false, default: "10200", validation: {pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"}, description: Port Home Assistant connects to for text-to-speech; enter it when adding the second Wyoming Protocol integration in step 3. Change it only if 10200 is already in use., description_i18n: {zh: Home Assistant 连接文字转语音服务的端口，步骤 3 添加第二个 Wyoming Protocol 集成时填写。仅当 10200 已被占用时修改。}}
  - {id: llm_port, name: Local LLM port, name_i18n: {zh: 本地大模型端口}, type: text, required: false, default: "1828", validation: {pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"}, description: Port of the local LLM on the RK1828 card; enter it in the LiteLLM integration address in step 3. Change it only if 1828 is already in use., description_i18n: {zh: RK1828 加速卡上大模型服务的端口，步骤 3 填写 LiteLLM 集成地址时使用。仅当 1828 已被占用时修改。}}
  - {id: ha_host, name: Home Assistant host IP, name_i18n: {zh: Home Assistant 主机 IP}, type: text, required: true, validation: {pattern: "^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$"}, description: IPv4 address of the Home Assistant host from step 1. Only this host and this device can reach the local LLM., description_i18n: {zh: 步骤 1 的 Home Assistant 主机的 IPv4 地址。只有这台主机和本机能访问本地大模型。}}
actions:
  before:
    - name: Check voice service ports
      name_i18n: {zh: 检查语音服务端口}
      sudo: true
      run: |
        set -eu
        PROJECT="ha_whole_home_rk_voice"
        VOICE_PORT=$(cat <<'HAWH_INPUT_END'
        {{voice_port}}
        HAWH_INPUT_END
        )
        VOICE_PORT="${VOICE_PORT:-8623}"
        STT_PORT=$(cat <<'HAWH_INPUT_END'
        {{wyoming_stt_port}}
        HAWH_INPUT_END
        )
        STT_PORT="${STT_PORT:-10300}"
        TTS_PORT=$(cat <<'HAWH_INPUT_END'
        {{wyoming_tts_port}}
        HAWH_INPUT_END
        )
        TTS_PORT="${TTS_PORT:-10200}"
        PAIRS="voice_port=$VOICE_PORT wyoming_stt_port=$STT_PORT wyoming_tts_port=$TTS_PORT"
        LLM_PORT=$(cat <<'HAWH_INPUT_END'
        {{llm_port}}
        HAWH_INPUT_END
        )
        LLM_PORT="${LLM_PORT:-1828}"
        PAIRS="$PAIRS llm_port=$LLM_PORT"
        for pair in $PAIRS; do
          name="${pair%%=*}"; port="${pair#*=}"
          case "$port" in ''|*[!0-9]*) echo "PORT_INVALID: $name=$port (expected 1-65535)" >&2; exit 1;; esac
          if [ "${#port}" -gt 5 ] || [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
            echo "PORT_INVALID: $name=$port (expected 1-65535)" >&2; exit 1
          fi
        done
        DUP=$(for pair in $PAIRS; do echo "${pair#*=}"; done | sort | uniq -d)
        if [ -n "$DUP" ]; then
          echo "PORT_DUPLICATE: the service ports must differ ($PAIRS)" >&2; exit 1
        fi
        # Owner lookup needs root (ss -p shows other users' PIDs only to root).
        AS=""
        if [ "$(id -u)" -ne 0 ] && sudo -n true 2>/dev/null; then AS="sudo -n"; fi
        # Returns 0 if the port is listening, 1 if free, 2 if no probe is available.
        port_listening() {
          if command -v ss >/dev/null 2>&1; then
            if ss -ltnH 2>/dev/null | awk '{print $4}' | grep -Eq "[:.]$1$"; then return 0; fi; return 1
          elif command -v netstat >/dev/null 2>&1; then
            if netstat -ltn 2>/dev/null | awk '{print $4}' | grep -Eq "[:.]$1$"; then return 0; fi; return 1
          elif [ -r /proc/net/tcp ]; then
            HEX=$(printf '%04X' "$1")
            if cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | awk '$4 == "0A" {print $2}' | grep -Eq ":$HEX$"; then return 0; fi; return 1
          fi
          return 2
        }
        # Prints "own" if every process listening on $1 runs inside a container of
        # this Compose project (matched by the container id in /proc/<pid>/cgroup),
        # "foreign" if any listener belongs to something else, "unknown" if the
        # owner cannot be determined. Host networking means the project label alone
        # says nothing about who holds a port.
        port_owner() {
          command -v ss >/dev/null 2>&1 || { echo unknown; return; }
          pids=$($AS ss -ltnpH "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u)
          [ -n "$pids" ] || { echo unknown; return; }
          own_ids=$($AS docker ps -q --no-trunc --filter "label=com.docker.compose.project=$PROJECT" 2>/dev/null) || { echo unknown; return; }
          for pid in $pids; do
            cg=$($AS cat "/proc/$pid/cgroup" 2>/dev/null) || { echo unknown; return; }
            cid=$(printf '%s\n' "$cg" | grep -Eo '[0-9a-f]{64}' | head -n 1)
            if [ -z "$cid" ] || ! printf '%s\n' "$own_ids" | grep -qx "$cid"; then echo foreign; return; fi
          done
          echo own
        }
        for pair in $PAIRS; do
          name="${pair%%=*}"; port="${pair#*=}"
          rc=0; port_listening "$port" || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "PORT_CHECK_SKIPPED: none of ss, netstat or /proc/net/tcp is available; cannot verify that port $port is free" >&2
          elif [ "$rc" -eq 0 ]; then
            case "$(port_owner "$port")" in
              own) echo "PORT_HELD_BY_THIS_STACK: port $port belongs to a running $PROJECT container; redeploy recreates it" >&2 ;;
              foreign) echo "PORT_IN_USE: port $port is already used on this host by another process; choose another $name" >&2; exit 1 ;;
              *) echo "PORT_OWNER_UNKNOWN: port $port is in use and its owner cannot be determined (needs root for ss -p and docker); free the port or choose another one" >&2; exit 1 ;;
            esac
          fi
        done
        echo "Port check OK: $PAIRS"
    - name: Check the RK1828 card
      name_i18n: {zh: 检查 RK1828 加速卡}
      run: |
        set -eu
        if ! ls /dev/pcie-rkep-* >/dev/null 2>&1; then
          echo "RK1828_NOT_FOUND: no RK1828 card device (/dev/pcie-rkep-*) on this host; install the card driver and firmware first, or deploy the RK3588 target without the card" >&2
          exit 1
        fi
        echo "RK1828 card found: $(ls /dev/pcie-rkep-* | tr '\n' ' ')"
    - name: Limit the local LLM to the Home Assistant host
      name_i18n: {zh: 只允许 Home Assistant 主机访问本地大模型}
      sudo: true
      run: |
        set -eu
        # The local LLM has no API key on this setup (the RK1828 server supports none),
        # so only this device and the Home Assistant host may reach its port. The LLM
        # container has restart: "no"; at boot ha-whole-home-llm.service applies and
        # verifies these rules first and only then starts the container, so a failed
        # rule leaves the LLM stopped instead of open (other Docker services are not
        # affected).
        HA_HOST=$(cat <<'HAWH_INPUT_END'
        {{ha_host}}
        HAWH_INPUT_END
        )
        LLM_PORT=$(cat <<'HAWH_INPUT_END'
        {{llm_port}}
        HAWH_INPUT_END
        )
        LLM_PORT="${LLM_PORT:-1828}"
        case "$HA_HOST" in *"
        "*) echo "HA_HOST_INVALID: enter one IPv4 address" >&2; exit 1 ;; esac
        printf '%s\n' "$HA_HOST" | grep -Eqx '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])' || { echo "HA_HOST_INVALID: enter the IPv4 address of the Home Assistant host, for example 192.168.1.20" >&2; exit 1; }
        case "$LLM_PORT" in ''|*[!0-9]*) echo "PORT_INVALID: llm_port=$LLM_PORT" >&2; exit 1 ;; esac
        command -v iptables >/dev/null 2>&1 || { echo "LLM_FIREWALL_UNAVAILABLE: iptables is not installed; it is needed to limit the local LLM to the Home Assistant host" >&2; exit 1; }
        command -v systemctl >/dev/null 2>&1 || { echo "LLM_FIREWALL_UNAVAILABLE: systemd is needed to re-apply the rule and start the local LLM at boot" >&2; exit 1; }
        cat > /usr/local/sbin/ha-whole-home-llm-firewall.sh <<EOF
        #!/bin/sh
        # Generated by the home_assistant_whole_home deploy step. Local LLM port $LLM_PORT
        # accepts connections only from this device and the Home Assistant host $HA_HOST.
        # Exits non-zero unless every rule is in place.
        set -eu
        HA_HOST=$HA_HOST
        LLM_PORT=$LLM_PORT
        ipv6_enabled() {
          [ -r /proc/sys/net/ipv6/conf/all/disable_ipv6 ] && [ "\$(cat /proc/sys/net/ipv6/conf/all/disable_ipv6)" = 0 ]
        }
        apply() {
          # Build the new rules in a second chain, verify them, switch the INPUT jump
          # to it, and only then remove the old chain. Any failure before the switch
          # leaves the previous rules (and so the running LLM's protection) in place.
          t=\$1; lo=\$2; extra=\$3
          if \$t -S INPUT | grep -qx -- '.*-j HAWH_LLM_A'; then new=HAWH_LLM_B; old=HAWH_LLM_A; else new=HAWH_LLM_A; old=HAWH_LLM_B; fi
          \$t -N "\$new" 2>/dev/null || \$t -F "\$new"
          \$t -A "\$new" -s "\$lo" -j RETURN
          if [ -n "\$extra" ]; then \$t -A "\$new" -s "\$extra" -j RETURN; fi
          \$t -A "\$new" -j DROP
          # Verify the new chain before any traffic is sent to it.
          \$t -C "\$new" -s "\$lo" -j RETURN
          if [ -n "\$extra" ]; then \$t -C "\$new" -s "\$extra" -j RETURN; fi
          \$t -C "\$new" -j DROP
          \$t -I INPUT -p tcp --dport "\$LLM_PORT" -j "\$new"
          \$t -C INPUT -p tcp --dport "\$LLM_PORT" -j "\$new"
          # Remove every other jump (old chain, the earlier HAWH_LLM name, old ports).
          \$t -S INPUT | grep -Ex -- '.*-j HAWH_LLM(_A|_B)?' | grep -vx -- ".*-j \$new" | sed 's/^-A /-D /' | while read -r rule; do \$t \$rule; done
          for c in "\$old" HAWH_LLM; do
            if \$t -S "\$c" >/dev/null 2>&1; then \$t -F "\$c"; \$t -X "\$c"; fi
          done
        }
        apply iptables 127.0.0.0/8 "\$HA_HOST"
        if ipv6_enabled; then
          command -v ip6tables >/dev/null 2>&1 || { echo "LLM_FIREWALL_UNAVAILABLE: IPv6 is enabled but ip6tables is not installed" >&2; exit 1; }
          apply ip6tables ::1/128 ""
          echo "IPv4 and IPv6 rules in place for port \$LLM_PORT"
        else
          echo "IPv6 is disabled on this host; IPv4 rule in place for port \$LLM_PORT"
        fi
        EOF
        chmod 0755 /usr/local/sbin/ha-whole-home-llm-firewall.sh
        /bin/sh /usr/local/sbin/ha-whole-home-llm-firewall.sh
        cat > /etc/systemd/system/ha-whole-home-llm.service <<'EOF'
        [Unit]
        Description=home_assistant_whole_home local LLM, started only after its port is limited to the Home Assistant host
        Requires=docker.service
        After=docker.service network-online.target
        Wants=network-online.target

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/sh /usr/local/sbin/ha-whole-home-llm-firewall.sh
        ExecStart=/bin/sh -c 'exec docker start ha-whole-home-llm'

        [Install]
        WantedBy=multi-user.target
        EOF
        systemctl daemon-reload
        systemctl enable ha-whole-home-llm.service >/dev/null 2>&1
        echo "Local LLM port $LLM_PORT limited to this device and $HA_HOST"
remote_overrides:
  environment:
    VOICE_PORT: "{{voice_port}}"
    WYOMING_STT_PORT: "{{wyoming_stt_port}}"
    WYOMING_TTS_PORT: "{{wyoming_tts_port}}"
