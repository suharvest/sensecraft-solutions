              esac
            fi
          done
          echo "Voice port check OK: voice=$VOICE_PORT stt=$STT_PORT tts=$TTS_PORT"
    after_upload:
      - name: Initialize HA configuration if absent
        run: |
          set -eu
          SRC="/opt/ha-whole-home/jetson_voice/ha-config-template"
          DST="/opt/ha-whole-home/ha-config"
          mkdir -p "$DST/packages" "$DST/custom_sentences"
          if [ ! -e "$DST/configuration.yaml" ]; then cp "$SRC/configuration.yaml" "$DST/configuration.yaml"; fi
          if [ ! -e "$DST/packages/ha_whole_home.yaml" ]; then cp "$SRC/packages/ha_whole_home.yaml" "$DST/packages/ha_whole_home.yaml"; fi
          for lang in en ja zh-CN; do
            mkdir -p "$DST/custom_sentences/$lang"
            for src in "$SRC/custom_sentences/$lang"/*; do
              [ -f "$src" ] || continue
              dst="$DST/custom_sentences/$lang/$(basename "$src")"
              if [ ! -e "$dst" ]; then cp "$src" "$dst"; fi
            done
          done
          if ! grep -Eq '!include_dir_named[[:space:]]+packages' "$DST/configuration.yaml"; then
            echo "HA_CONFIG_REQUIRES_MANUAL_PACKAGES_INCLUDE: $DST/configuration.yaml" >&2
            exit 1
          fi
