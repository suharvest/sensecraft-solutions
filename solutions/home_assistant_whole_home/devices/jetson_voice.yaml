version: "1.0"
id: jetson_voice
name: Jetson voice stack
name_i18n: {zh: Jetson 语音栈}
type: docker_deploy
device_class: jetson
docker:
  compose_file: assets/docker/jetson_voice.yml
  compose_dir: assets
  remote_path: /opt/ha-whole-home
  options: {project_name: ha_whole_home_jetson_voice, remove_orphans: false}
  services: [{name: voice-asr, required: true}, {name: voice-tts, required: true}, {name: wyoming-adapter, required: true}]
  environment:
    JETSON_VOICE_IMAGE: "{{jetson_voice_image}}"
    JETSON_VOICE_DIGEST: "{{jetson_voice_digest}}"
    SLV_ASR_BASE_URL: "{{slv_asr_base_url}}"
    SLV_TTS_BASE_URL: "{{slv_tts_base_url}}"
    ADAPTER_IMAGE: "{{adapter_image}}"
    JETSON_ASR_PROFILE: "jetson-qwen3asr-matcha-nx"
    JETSON_TTS_PROFILE: "jetson-kokoro-trt"
ssh: {port: 22, default_user: recomputer, auth_methods: [password], connection_timeout: 30, command_timeout: 3600}
pre_checks:
  - {type: disk_space, min_gb: 30, description: Jetson voice image and model cache require at least 30 GB free.}
  - {type: nvidia_runtime, description: NVIDIA container runtime is required.}
user_inputs:
  - {id: jetson_voice_image, name: Jetson voice image, name_i18n: {zh: Jetson 语音镜像}, type: text, required: true, default: "sensecraft-missionpack.seeed.cn/solution/nrd6-ovs-jetson:20261008", description: Published OVS runtime image nrd6-ovs-jetson (2026-10-08)., description_i18n: {zh: 已发布的 OVS 运行镜像 nrd6-ovs-jetson（2026-10-08）。}}
  - {id: jetson_voice_digest, name: Jetson voice image digest, name_i18n: {zh: Jetson 语音镜像 digest}, type: text, required: true, default: "sha256:a3cfde5820119108f27eb7bde018bc096ba66fc0118b837592b3bd5437bf1111"}
  - {id: slv_asr_base_url, name: ASR service URL, name_i18n: {zh: ASR 服务地址}, type: text, required: true}
  - {id: slv_tts_base_url, name: TTS service URL, name_i18n: {zh: TTS 服务地址}, type: text, required: true}
  - {id: adapter_image, name: Wyoming adapter image, name_i18n: {zh: Wyoming 适配层镜像}, type: text, required: false, default: "sensecraft-missionpack.seeed.cn/solution/wyoming-slv-adapter:20261008@sha256:50be4f9fdb6e8977d1ee5b110052fb607b4187707225b84479af246980509c3b", description: Published wyoming-slv-adapter image pinned by digest (2026-10-08)., description_i18n: {zh: 已发布的 wyoming-slv-adapter 镜像（2026-10-08，按 digest 固定）。}}
remote_overrides:
  environment:
    JETSON_VOICE_IMAGE: "{{jetson_voice_image}}"
    JETSON_VOICE_DIGEST: "{{jetson_voice_digest}}"
    SLV_ASR_BASE_URL: "{{slv_asr_base_url}}"
    SLV_TTS_BASE_URL: "{{slv_tts_base_url}}"
    ADAPTER_IMAGE: "{{adapter_image}}"
    JETSON_ASR_PROFILE: "jetson-qwen3asr-matcha-nx"
    JETSON_TTS_PROFILE: "jetson-kokoro-trt"
  actions:
    after_upload:
      - name: Initialize HA configuration if absent
        run: |
          set -eu
          SRC="/opt/ha-whole-home/jetson_voice/ha-config-template"
          DST="/opt/ha-whole-home/ha-config"
          mkdir -p "$DST/packages" "$DST/custom_sentences"
          if [ ! -e "$DST/configuration.yaml" ]; then cp "$SRC/configuration.yaml" "$DST/configuration.yaml"; fi
          if [ ! -e "$DST/packages/ha_whole_home.yaml" ]; then cp "$SRC/packages/ha_whole_home.yaml" "$DST/packages/ha_whole_home.yaml"; fi
          for lang in en ja zh-CN; do
            mkdir -p "$DST/custom_sentences/$lang"
            for src in "$SRC/custom_sentences/$lang"/*; do
              [ -f "$src" ] || continue
              dst="$DST/custom_sentences/$lang/$(basename "$src")"
              if [ ! -e "$dst" ]; then cp "$src" "$dst"; fi
            done
          done
          if ! grep -Eq '!include_dir_named[[:space:]]+packages' "$DST/configuration.yaml"; then
            echo "HA_CONFIG_REQUIRES_MANUAL_PACKAGES_INCLUDE: $DST/configuration.yaml" >&2
            exit 1
          fi
