version: "1.0"
id: verify_ha
name: Connect local voice and verify
name_i18n: {zh: 接入本地语音并验证}
type: web_dashboard
web_dashboard:
  url: "http://{{ha_host}}:{{ha_port}}/"
  title: Home Assistant
  title_i18n: {zh: Home Assistant}
  description: Open Home Assistant, add the two voice services, and test with "Turn on the living room light".
  description_i18n: {zh: 打开 Home Assistant，添加两个语音服务，然后说「打开客厅灯」测试。}
user_inputs:
  - {id: ha_host, name: Home Assistant host, name_i18n: {zh: Home Assistant 主机地址}, type: text, required: true, description: IP address of the ARM64 Linux host running Home Assistant., description_i18n: {zh: 运行 Home Assistant 的 ARM64 Linux 主机的 IP 地址。}}
  - id: ha_port
    name: Home Assistant port
    name_i18n: {zh: Home Assistant 端口}
    type: text
    required: true
    default: "8123"
    default_template: "{{ha_port}}"
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    description: Auto-filled from the port entered in the deploy step; change it only if you reinstalled on a different port.
    description_i18n: {zh: 自动带入部署步骤填写的端口；仅在改用其他端口重装时修改。}
