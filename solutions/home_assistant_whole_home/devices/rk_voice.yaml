version: "1.0"
id: rk_voice
name: HA and RK voice stack
name_i18n: {zh: HA 与 RK 语音栈}
type: docker_deploy
device_class: rk3588
docker:
  compose_file: assets/docker/rk_single_box.yml
  compose_dir: assets
  remote_path: /opt/ha-whole-home
  options: {project_name: ha_whole_home_rk, remove_orphans: false}
  services: [{name: homeassistant, required: true}, {name: voice, required: true}, {name: wyoming-adapter, required: true}]
  environment:
    RK_VOICE_IMAGE: "{{rk_voice_image}}"
    RK_VOICE_DIGEST: "{{rk_voice_digest}}"
    ZBT_DEVICE: "{{zbt_device}}"
    ADAPTER_IMAGE: "{{adapter_image}}"
    HA_IMAGE: "ghcr.io/home-assistant/home-assistant:2026.9.3"
    HA_DIGEST: "sha256:d8922685169707fd91e8b9729902d975f06157d005e422874d201e0261dda196"
    TZ: "Asia/Shanghai"
    HA_CONFIG_DIR: "/opt/ha-whole-home/ha-config"
    ESPHOME_IMAGE: "esphome/esphome:2026.9.1"
    ESPHOME_DIGEST: "sha256:4ad55931c0186d2910dc128526237acabb422a662697a4e8bb356d390a1332a1"
    ESPHOME_CONFIG_DIR: "/opt/ha-whole-home/esphome"
    RK_OVS_PROFILE: "rk3588-piper"
    RK_ARTIFACT_SET: "rk3588-piper-en-2026-09-20"
    SLV_BASE_URL: "http://127.0.0.1:8621"
ssh: {port: 22, default_user: recomputer, auth_methods: [password], connection_timeout: 30, command_timeout: 1800}
pre_checks:
  - {type: disk_space, min_gb: 8, description: HA image and recorder data require at least 8 GB free.}
  - {type: tcp_port, port: 8123, description: Home Assistant port must be available.}
user_inputs:
  - {id: rk_voice_image, name: RK voice image, name_i18n: {zh: RK 语音镜像}, type: text, required: true, description: Fill only with an approved image reference and digest; no artifact is supplied.}
  - {id: rk_voice_digest, name: RK voice image digest, name_i18n: {zh: RK 语音镜像 digest}, type: text, required: true}
  - {id: zbt_device, name: ZBT-2 device path, name_i18n: {zh: ZBT-2 设备路径}, type: text, required: true}
  - {id: adapter_image, name: Wyoming adapter image, name_i18n: {zh: Wyoming 适配层镜像}, type: text, required: true}
remote_overrides:
  environment:
    RK_VOICE_IMAGE: "{{rk_voice_image}}"
    RK_VOICE_DIGEST: "{{rk_voice_digest}}"
    ZBT_DEVICE: "{{zbt_device}}"
    ADAPTER_IMAGE: "{{adapter_image}}"
    HA_IMAGE: "ghcr.io/home-assistant/home-assistant:2026.9.3"
    HA_DIGEST: "sha256:d8922685169707fd91e8b9729902d975f06157d005e422874d201e0261dda196"
    TZ: "Asia/Shanghai"
    HA_CONFIG_DIR: "/opt/ha-whole-home/ha-config"
    ESPHOME_IMAGE: "esphome/esphome:2026.9.1"
    ESPHOME_DIGEST: "sha256:4ad55931c0186d2910dc128526237acabb422a662697a4e8bb356d390a1332a1"
    ESPHOME_CONFIG_DIR: "/opt/ha-whole-home/esphome"
    RK_OVS_PROFILE: "rk3588-piper"
    RK_ARTIFACT_SET: "rk3588-piper-en-2026-09-20"
    SLV_BASE_URL: "http://127.0.0.1:8621"
  actions:
    after_upload:
      - name: Initialize HA configuration if absent
        run: |
          set -eu
          SRC="/opt/ha-whole-home/rk_voice/ha-config-template"
          DST="/opt/ha-whole-home/ha-config"
          mkdir -p "$DST/packages" "$DST/custom_sentences"
          if [ ! -e "$DST/configuration.yaml" ]; then cp "$SRC/configuration.yaml" "$DST/configuration.yaml"; fi
          if [ ! -e "$DST/packages/ha_whole_home.yaml" ]; then cp "$SRC/packages/ha_whole_home.yaml" "$DST/packages/ha_whole_home.yaml"; fi
          for lang in en ja zh-CN; do
            mkdir -p "$DST/custom_sentences/$lang"
            for src in "$SRC/custom_sentences/$lang"/*; do
              [ -f "$src" ] || continue
              dst="$DST/custom_sentences/$lang/$(basename "$src")"
              if [ ! -e "$dst" ]; then cp "$src" "$dst"; fi
            done
          done
          if ! grep -Eq '!include_dir_named[[:space:]]+packages' "$DST/configuration.yaml"; then
            echo "HA_CONFIG_REQUIRES_MANUAL_PACKAGES_INCLUDE: $DST/configuration.yaml" >&2
            exit 1
          fi
