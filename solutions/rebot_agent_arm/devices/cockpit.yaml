version: "1.0"
id: cockpit
name: Open the Cockpit for Teleop & Calibration
type: web_dashboard

# Step id of the teleop install (guide.md {#install_teleop}), not a device id.
inherit_host_from: install_teleop
user_inputs:
  - id: host
    name: Device IP Address
    default: "192.168.42.1"
    default_template: "{{host}}"
    description: IP address of your reCamera (USB 192.168.42.1; 192.168.16.1 on the arm's own Wi-Fi hotspot)
    name_i18n:
      zh: 设备 IP 地址
    description_i18n:
      zh: reCamera 的 IP 地址（USB 为 192.168.42.1；连机械臂自带热点时为 192.168.16.1）
web_dashboard:
  url: "http://{{host}}:8765/"
  title: reBot Arm Web Cockpit
  description: >-
    Control the arm via joysticks, 7-joint, or Cartesian XYZ/RPY moves, save
    named poses, and run ArUco eye-in-hand calibration (5–9 poses).
  title_i18n:
    zh: reBot 机械臂网页控制台
  description_i18n:
    zh: >-
      使用双摇杆、7 关节或笛卡尔 XYZ/RPY 模式遥控机械臂，保存命名位姿，
      并完成 ArUco 眼在手上标定（采集 5–9 个位姿）。
name_i18n:
  zh: 打开控制台进行遥操与标定
