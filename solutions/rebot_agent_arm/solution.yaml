version: "1.0"
id: rebot_agent_arm
name: "reBot Arm: Phone Teleop & AI Agent Control"
name_i18n:
  zh: reBot 机械臂：手机遥控与 AI 智能体操控
intro:
  summary: Drive a reBot B601-DM arm from a phone or tablet browser, let an AI agent on your computer control it through an MCP server, and record joint data while you guide it. The arm runtime runs on a standard reCamera with the B4 CAN base board.
  summary_i18n:
    zh: 在手机或平板浏览器里遥控 reBot B601-DM 机械臂，让电脑上的 AI 智能体通过 MCP 服务操控它，并在你带着它示范时录制关节数据。机械臂运行程序跑在装了 B4 CAN 底板的标准版 reCamera 上。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/cockpit.png
  gallery:
    - type: image
      src: gallery/cockpit.png
      caption: Web cockpit, expert view (screenshot from the simulated arm used in the cockpit tests)
      caption_i18n:
        zh: 网页控制台专家视图（控制台测试中模拟机械臂的截图）
  category: vision_video_ai
  solution_type: solution
  tags:
    - rebot
    - robot-arm
    - recamera
    - teleoperation
    - mcp
    - ai-agent
    - hand-eye-calibration
    - aruco
    - yolo
    - can-bus

  output_interfaces:
    - type: http
      port: 8765
      endpoint: /
      description: Web cockpit for phones, tablets and desktops (joysticks, Cartesian control, video, detection overlay, hand-eye calibration)
      schema_type: html
      description_i18n:
        zh: 手机、平板和电脑通用的网页控制台（摇杆、笛卡尔控制、视频、检测框、手眼标定）
    - type: websocket
      port: 8765
      endpoint: /api/v1/ws
      description: Arm control channel (lease, commands, telemetry); the MCP server and the cockpit use it
      schema_type: json
      description_i18n:
        zh: 机械臂控制通道（控制权、指令、遥测），MCP 服务和网页控制台都通过它控制
    - type: websocket
      port: 8001
      endpoint: /
      description: Camera H.264 stream from the camera app (ArUco or YOLO)
      schema_type: binary
      description_i18n:
        zh: 摄像头应用（ArUco 或 YOLO）输出的 H.264 视频流

  device_catalog:
    recamera_2002:
      description: Runs the arm runtime and the web cockpit; needs the B4 CAN base board
      description_i18n:
        zh: 运行机械臂程序和网页控制台，需要 B4 CAN 底板
    rebot_arm_b601:
      description: 6-joint arm with a gripper, Damiao motors on the CAN bus
      description_i18n:
        zh: 六关节加夹爪机械臂，达妙电机，CAN 总线连接
      purchase:
        require:
          actuator: [dm]

  presets:
    - id: default
      name: reCamera + reBot B601-DM
      name_i18n:
        zh: reCamera + reBot B601-DM
      description: Install the arm runtime on the camera, optionally the agent server on your computer and a camera app (ArUco or YOLO), then check teleop and run hand-eye calibration in the cockpit.
      description_i18n:
        zh: 在摄像头上安装机械臂程序，可选在电脑上安装智能体服务、在摄像头上安装摄像头应用（ArUco 或 YOLO），最后在控制台里检查遥控并完成手眼标定。
      device_groups:
        - id: camera
          name: AI Camera
          name_i18n:
            zh: AI 摄像头
          type: single
          required: true
          options:
            - device_ref: recamera_2002
              label: reCamera (SG2002) with B4 CAN board
              label_i18n:
                zh: reCamera（SG2002）+ B4 CAN 底板
          default: recamera_2002
        - id: arm
          name: Robotic Arm
          name_i18n:
            zh: 机械臂
          type: single
          required: true
          options:
            - device_ref: rebot_arm_b601
          default: rebot_arm_b601
      links:
        github: https://github.com/Seeed-Solution/rebot-armd

  stats:
    difficulty: intermediate
    estimated_time: 30min
    deployed_count: 0
    likes_count: 0
  links:
    github: https://github.com/Seeed-Solution/rebot-armd
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
