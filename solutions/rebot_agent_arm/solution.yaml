version: "1.0"
id: rebot_agent_arm
name: "Smart Robot Arm with Vision Brain"
name_i18n:
  zh: 自带视觉大脑的智能机械臂
intro:
  summary: A single reCamera serves as both eyes and brain for the reBot arm. Mount it directly on the arm to drive 7 joint motors over CAN with no external industrial PC. Drive it immediately from a phone browser, or let AI agents take full closed-loop control over native tools.
  summary_i18n:
    zh: 一台 reCamera 同时搞定机械臂的眼睛和大脑。装上机械臂即可直驱 7 个关节电机，免去外挂工控机与杂乱连线；手机直连热点即可操控，AI 智能体通过原生接口闭环接管。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/rebot-teleop-photo.jpg
  gallery:
    - type: image
      src: gallery/rebot-teleop-photo.jpg
      caption: reBot B601-DM arm driven from the web cockpit on a tablet
      caption_i18n:
        zh: 平板 Web 驾驶舱无线遥控 reBot B601-DM 机械臂真机
    - type: image
      src: gallery/cockpit-desktop-en.png
      src_i18n:
        zh: gallery/cockpit-desktop-zh.png
      caption: Desktop expert cockpit with 7-joint telemetry, Cartesian controls, and safety watchdogs
      caption_i18n:
        zh: 桌面端专家驾驶舱：7 关节实时遥测、笛卡尔控制与租约看门狗安全状态机
    - type: image
      src: gallery/cockpit-phone-zh.png
      caption: Mobile web cockpit with dual touch joysticks and hold-to-enable safety switch
      caption_i18n:
        zh: 手机端触控驾驶舱：双虚拟摇杆点动与 Hold-to-Enable 防误触开关
    - type: image
      src: gallery/vision-overlay-zh.png
      caption: Real-time edge TPU YOLOv11 target detection and CPU ArUco 3D pose estimation
      caption_i18n:
        zh: 真实场景端侧视觉：TPU YOLOv11 目标检测框与 CPU ArUco 3D 位姿轴实时叠加
    - type: image
      src: gallery/cockpit-cartesian-zh.png
      caption: Desktop Cartesian cockpit with XYZ/RPY coordinate control and inverse kinematics
      caption_i18n:
        zh: 桌面端笛卡尔空间控制：末端 XYZ/RPY 姿态微调与实时逆运动学解算
    - type: image
      src: gallery/cockpit-phone-land-zh.png
      caption: Mobile landscape cockpit with dual virtual joysticks for intuitive operation
      caption_i18n:
        zh: 手机端横屏驾驶舱：双手双虚拟摇杆全向操控与急停防护
  category: vision_video_ai
  solution_type: solution
  tags:
    - rebot
    - robot-arm
    - recamera
    - teleoperation
    - mcp
    - ai-agent
    - hand-eye-calibration
    - aruco
    - yolo
    - can-bus

  output_interfaces:
    - type: http
      port: 8765
      endpoint: /
      description: Web cockpit for phones, tablets and desktops (joysticks, Cartesian control, video, detection overlay, hand-eye calibration)
      schema_type: html
      description_i18n:
        zh: 手机、平板和电脑通用的网页控制台（摇杆、笛卡尔控制、视频、检测框、手眼标定）
    - type: websocket
      port: 8765
      endpoint: /api/v1/ws
      description: Arm control channel (lease, commands, telemetry); the MCP server and the cockpit use it
      schema_type: json
      description_i18n:
        zh: 机械臂控制通道（控制权、指令、遥测），MCP 服务和网页控制台都通过它控制
    - type: websocket
      port: 8001
      endpoint: /
      description: Camera H.264 stream from rebot-vision, the camera process inside the rebot-teleop app
      schema_type: binary
      description_i18n:
        zh: rebot-teleop 应用内的摄像头进程 rebot-vision 输出的 H.264 视频流

  device_catalog:
    recamera_2002:
      description: Runs the arm control, the web cockpit and the camera vision (YOLO, ArUco); needs the B4 CAN base board
      description_i18n:
        zh: 运行机械臂控制、网页控制台和摄像头视觉（YOLO、ArUco），需要 B4 CAN 底板
    rebot_arm_b601:
      description: 6 joints and a gripper, 7 Damiao motors on the CAN bus
      description_i18n:
        zh: 6 个关节加夹爪，7 个达妙电机，CAN 总线连接
      purchase:
        require:
          actuator: [dm]

  presets:
    - id: default
      name: reCamera + reBot B601-DM
      name_i18n:
        zh: reCamera + reBot B601-DM
      description: Install the rebot-teleop app on the camera and the AI agent server (MCP) on your computer, then check teleop and run hand-eye calibration in the cockpit.
      description_i18n:
        zh: 在摄像头上安装 rebot-teleop 应用，在电脑上安装 AI 智能体服务（MCP），最后在控制台里检查遥控并完成手眼标定。
      device_groups:
        - id: camera
          name: AI Camera
          name_i18n:
            zh: AI 摄像头
          type: single
          required: true
          options:
            - device_ref: recamera_2002
              label: reCamera (SG2002) with B4 CAN board
              label_i18n:
                zh: reCamera（SG2002）+ B4 CAN 底板
          default: recamera_2002
        - id: arm
          name: Robotic Arm
          name_i18n:
            zh: 机械臂
          type: single
          required: true
          options:
            - device_ref: rebot_arm_b601
          default: rebot_arm_b601
      links:
        github: https://github.com/Seeed-Solution/rebot-armd

  stats:
    difficulty: intermediate
    estimated_time: 30min
    deployed_count: 0
    likes_count: 0
  links:
    github: https://github.com/Seeed-Solution/rebot-armd
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
