# DRAFT / blocked: NRD-4. No public image/model artifact or platform acceptance
# evidence is available. This package remains disabled.
version: "1.0"
id: edge_parking_occupancy
name: Edge Multi-Camera Parking Occupancy
name_i18n:
  zh: 边缘多摄像头停车位占用检测
enabled: false
intro:
  visibility: staging
  summary: Track configured parking polygons from multiple RTSP cameras on a Jetson host and publish retained slot states over MQTT.
  summary_i18n:
    zh: 在 Jetson 主机上从多路 RTSP 摄像头分析配置的车位多边形，并通过 MQTT 发布保留的车位状态。
  description_file: description.md
  description_file_i18n: {zh: description_zh.md}
  category: vision_video_ai
  solution_type: solution
  tags: [parking, occupancy, rtsp, multi-camera, mqtt, yolox, jetson]
  output_interfaces:
    - type: mqtt
      port: 1883
      topic: <site>/parking/<camera>/slots
      schema_type: json
      description: Retained slot state messages from the external MQTT broker.
      description_i18n: {zh: 外部 MQTT broker 上保留的车位状态消息。}
    - type: http
      port: 8080
      endpoint: /slots/editor
      method: GET
      schema_type: binary
      description: Slot polygon editor supplied by the parking app.
      description_i18n: {zh: 停车应用提供的车位多边形编辑页。}
    - type: http
      port: 8099
      endpoint: /healthz
      method: GET
      schema_type: json
      description: Native runtime and SlotsApp health.
      description_i18n: {zh: 原生运行时与 SlotsApp 健康状态。}
  input_requirements:
    - type: rtsp
      description: One or more stable H.264/H.265 RTSP camera streams with configured slot polygons.
      description_i18n: {zh: 一路或多路稳定的 H.264/H.265 RTSP 摄像头，并已配置车位多边形。}
  device_catalog:
    recomputer_j30:
      name: reComputer J30 (Jetson Orin)
      name_i18n: {zh: reComputer J30（Jetson Orin）}
      description: JetPack 6 Jetson host for native TensorRT SlotsApp.
      description_i18n: {zh: 运行原生 TensorRT SlotsApp 的 JetPack 6 Jetson 主机。}
    recomputer_rk3576:
      name: reComputer RK3576 Series
      name_i18n: {zh: reComputer RK3576 系列}
      description: Staging RKNN host; device ABI and model paths must be supplied locally.
      description_i18n: {zh: 暂存 RKNN 主机；必须由用户提供本地设备 ABI 和模型路径。}
    recomputer_rk3588:
      name: reComputer RK3588 Series
      name_i18n: {zh: reComputer RK3588 系列}
      description: Staging RKNN host; device ABI and model paths must be supplied locally.
      description_i18n: {zh: 暂存 RKNN 主机；必须由用户提供本地设备 ABI 和模型路径。}
    generic_ip_camera:
      name: IP Camera
      name_i18n: {zh: IP 摄像头}
      description: Existing parking-lot RTSP camera.
      description_i18n: {zh: 现场已有的停车场 RTSP 摄像头。}
  presets:
    - id: jetson
      name: Multi-Camera Jetson Occupancy (Draft)
      name_i18n: {zh: Jetson 多摄像头占用检测（草稿）}
      badge: Blocked artifact
      badge_i18n: {zh: artifact 阻塞}
      description: Draft only. Requires a locally built SlotsApp image, target-device engine, and slot configuration.
      description_i18n: {zh: 仅为草案；需要本地构建的 SlotsApp 镜像、目标设备 engine 和车位配置。}
      # Hardware-verified 2026-10-08 on Jetson Orin Nano (acceptance receipt
      # orin-nano/edge_parking_occupancy): package compose + locally built image,
      # 1 stream at 1 fps, synthetic 640x360 clip (still 20 s / black 20 s).
      # 0.988 fps processed, inference p50 6.48 / p95 6.69 ms, 0 dropped,
      # 15 occupied/free transitions per slot over 300 s. Not covered: slot
      # accuracy on real video, multi-stream capacity re-run, one-click path.
      verified:
        - hardware
      device_groups:
        - id: compute
          name: Edge Host
          name_i18n: {zh: 边缘主机}
          type: single
          required: true
          options: [{device_ref: recomputer_j30}]
          default: recomputer_j30
        - id: cameras
          name: Parking Cameras
          name_i18n: {zh: 停车场摄像头}
          type: single
          required: true
          options: [{device_ref: generic_ip_camera}]
          default: generic_ip_camera
    - id: rk3576
      name: Multi-Camera RK3576 Occupancy (Draft)
      name_i18n: {zh: RK3576 多摄像头占用检测（草稿）}
      badge: Blocked artifact / not verified
      badge_i18n: {zh: artifact 阻塞 / 未验证}
      description: Requires a local native RK image, RKNN model and matching host ABI paths.
      description_i18n: {zh: 需要本地原生 RK 镜像、RKNN 模型和匹配的宿主机 ABI 路径。}
      device_groups:
        - id: compute
          name: Edge Host
          name_i18n: {zh: 边缘主机}
          type: single
          required: true
          options: [{device_ref: recomputer_rk3576}]
          default: recomputer_rk3576
        - id: cameras
          name: Parking Cameras
          name_i18n: {zh: 停车场摄像头}
          type: single
          required: true
          options: [{device_ref: generic_ip_camera}]
          default: generic_ip_camera
    - id: rk3588
      name: Multi-Camera RK3588 Occupancy (Draft)
      name_i18n: {zh: RK3588 多摄像头占用检测（草稿）}
      badge: Blocked artifact
      badge_i18n: {zh: artifact 阻塞}
      description: Requires a local native RK image, RKNN model and matching host ABI paths.
      description_i18n: {zh: 需要本地原生 RK 镜像、RKNN 模型和匹配的宿主机 ABI 路径。}
      # Hardware-verified 2026-10-08 on Radxa Rock 5T (acceptance receipt
      # radxa/edge_parking_occupancy): package compose with the librga.so.2 and
      # host GStreamer mounts, locally built image 6a5c781d, synthetic
      # occupied/empty fixture, 1 stream at 1 fps, single-car ROI. 17 state
      # changes, RKNN p50 36.6 / p95 40.5 ms, 0 dropped, MPP decode. Not covered:
      # slot accuracy, multi-stream capacity, r2 image, public artifact.
      verified:
        - hardware
      device_groups:
        - id: compute
          name: Edge Host
          name_i18n: {zh: 边缘主机}
          type: single
          required: true
          options: [{device_ref: recomputer_rk3588}]
          default: recomputer_rk3588
        - id: cameras
          name: Parking Cameras
          name_i18n: {zh: 停车场摄像头}
          type: single
          required: true
          options: [{device_ref: generic_ip_camera}]
          default: generic_ip_camera
  stats:
    difficulty: advanced
    estimated_time: 90min
  links: {}
deployment:
  guide_file: guide.md
  guide_file_i18n: {zh: guide_zh.md}
  selection_mode: sequential
