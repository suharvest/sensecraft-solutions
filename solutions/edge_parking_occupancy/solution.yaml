# edge_parking_occupancy (NRD-4) — maintainer notes, not shown to users.
#
# Targets offered: Jetson Orin Nano / Orin NX (reComputer J30 / J40; NX accepted
# on owner decision 2026-10-08, engines built and device-run on Orin Nano only), RK3588 and
# RK3576. RK3576 was removed earlier on 2026-10-08 (its package compose had not
# run on a board) and restored the same day after the package-compose run on
# cat-remote described below.
#
# `verified: [hardware]` on the preset:
# - Jetson: 2026-10-08 on Jetson Orin Nano (acceptance receipt
#   orin-nano/edge_parking_occupancy): package compose + locally built image,
#   1 stream at 1 fps, synthetic 640x360 clip (still 20 s / black 20 s).
#   0.988 fps processed, inference p50 6.48 / p95 6.69 ms, 0 dropped, 15
#   occupied/free transitions per slot over 300 s. Six-stream capacity (each
#   ~1.0 fps, drops 0, 620 s window) is the earlier NRD-4 Nano capacity run.
#   Not covered: slot accuracy on real video, one-click app path.
# - RK3588: 2026-10-08 on an RK3588 bench board (acceptance receipt
#   radxa/edge_parking_occupancy): package compose with the librga.so.2 and
#   host GStreamer mounts, locally built image 6a5c781d, synthetic
#   occupied/empty fixture, 1 stream at 1 fps, single-car ROI. 17 state
#   changes, RKNN p50 36.6 / p95 40.5 ms, 0 dropped, MPP decode.
#   Not covered: slot accuracy, multi-stream capacity, published image bytes.
# - RK3576: 2026-10-08 on cat-remote (LubanCat RK3576, Debian, librknnrt
#   2.3.2): devices/rk3576_occupancy.yaml actions + compose run by hand in
#   docker_remote_deployer order (before library check OK with the default
#   paths, model fallback download, render_config.py, compose up, 8099
#   readiness 4 s), published image nrd-parking-rk:20261008 @df4bb508. Bays
#   set through PUT /config/slots on the editor port (the Step 2 path), the
#   Jetson-run polygons B1-023/B1-024, input slots-occ20-empty20-400s.mp4
#   (640x360, still 20 s / black 20 s). 1.0 fps per stream, MPP decode, no
#   fallback; 21 parking.slots/1 messages, occupied<->free for both bays on
#   every cycle; publisher stopped -> all bays `unknown`, stream_ok false
#   9.5 s later. Per-frame NPU time is not exposed by /healthz (description
#   shows "—"). Not covered: slot accuracy, multi-stream capacity.
# - Health stays `ok` when a stream stalls (orin-nano run 1); the guide
#   points users at the per-message `stream_ok` / `unknown` state instead.
#
# The deploy step renders the board's vb.config/1 preset from the form inputs
# (devices/*_occupancy.yaml, after_upload "Write the parking config"); users
# never edit JSON. Bays are drawn in the app's /slots/editor, which persists
# them to <data>/slots.override.json.
#
# `visibility` is not a spec field (dropped on load); it records the staging
# state. The release gate is the hub registry.
version: "1.0"
id: edge_parking_occupancy
name: Edge Multi-Camera Parking Occupancy
name_i18n:
  zh: 边缘多摄像头停车位占用检测
enabled: true
intro:
  visibility: staging
  summary: Use the IP cameras already in your car park to see which bays are taken. An edge box analyses every camera on site and reports each bay as occupied or free over MQTT — no video leaves the site.
  summary_i18n:
    zh: 用停车场现有的 IP 摄像头看哪些车位有车。边缘主机在现场分析每路画面，逐个车位报告「占用 / 空闲」，通过 MQTT 发给你的系统，视频不出场地。
  description_file: description.md
  description_file_i18n: {zh: description_zh.md}
  cover_image: gallery/cover-20261008.jpg
  gallery:
    - type: image
      src: gallery/panel-slot-editor-20261008.jpg
      caption: "Slot editor: one box per bay drawn over the live camera picture. Both bays in this frame were reported occupied."
      caption_i18n:
        zh: "车位编辑页：在摄像头实时画面上给每个车位画一个框。画面中的两个车位都被识别为占用。"
        ja: "駐車枠エディタ：カメラのライブ映像上に、1 台分ずつ枠を描きます。この画面の 2 枠はどちらも「占有」と判定されています。"
  category: vision_video_ai
  solution_type: solution
  tags: [parking, occupancy, rtsp, multi-camera, mqtt, jetson, rk3588, rk3576]
  output_interfaces:
    - type: mqtt
      port: 1883
      topic: <site>/parking/<camera>/slots
      schema_type: json
      description: State of every bay on one camera (occupied / free / unknown), sent to your MQTT server each time a bay changes.
      description_i18n: {zh: 一路摄像头下每个车位的状态（占用 / 空闲 / 未知），车位一变化就发到你的 MQTT 服务器。}
    - type: http
      port: 8080
      endpoint: /slots/editor
      method: GET
      schema_type: binary
      description: Web page for drawing and naming the bays on each camera.
      description_i18n: {zh: 在每路摄像头画面上画车位、给车位命名的网页。}
    - type: http
      port: 8099
      endpoint: /healthz
      method: GET
      schema_type: json
      description: Service status check.
      description_i18n: {zh: 服务运行状态检查。}
  input_requirements:
    - type: rtsp
      description: One or more IP cameras that can send an H.264 RTSP stream the edge box can reach on the network.
      description_i18n: {zh: 一路或多路 IP 摄像头，能输出 H.264 编码的 RTSP 视频流，且边缘主机能通过网络访问到。}
  device_catalog:
    recomputer_j30:
      description: Runs bay detection for all cameras. Jetson Orin Nano module with JetPack 6.2.
      description_i18n: {zh: 为所有摄像头运行车位检测。Jetson Orin Nano 模组，系统为 JetPack 6.2。}
    recomputer_j40:
      description: Runs bay detection for all cameras. Jetson Orin NX module with JetPack 6.2.
      description_i18n: {zh: 为所有摄像头运行车位检测。Jetson Orin NX 模组，系统为 JetPack 6.2。}
    recomputer_rk3588:
      description: Runs bay detection for all cameras on the board's built-in AI accelerator.
      description_i18n: {zh: 用板载 AI 加速芯片为所有摄像头运行车位检测。}
    recomputer_rk3576:
      description: Runs bay detection for all cameras on the board's built-in AI accelerator.
      description_i18n: {zh: 用板载 AI 加速芯片为所有摄像头运行车位检测。}
    generic_ip_camera:
      name: IP Camera
      name_i18n: {zh: IP 摄像头}
      description: Existing car-park camera with an RTSP stream.
      description_i18n: {zh: 停车场现有的摄像头，能输出 RTSP 视频流。}
  presets:
    - id: ip_camera_box
      name: IP Cameras + Edge Box
      name_i18n:
        zh: IP 摄像头 + 边缘主机
        ja: IP カメラ + エッジホスト
      description: Keep your existing cameras and add one edge box on the same network — reComputer J30 / J40 (Jetson Orin Nano / Orin NX, JetPack 6.2), reComputer RK3588 or reComputer RK3576. You also need an MQTT server to receive the bay states.
      description_i18n:
        zh: 保留现有摄像头，在同一网络里加一台边缘主机——reComputer J30 / J40（Jetson Orin Nano / Orin NX，JetPack 6.2）、reComputer RK3588 或 reComputer RK3576。另需一台 MQTT 服务器接收车位状态。
        ja: 既存のカメラはそのまま、同じネットワークにエッジホストを 1 台追加します——reComputer J30 / J40（Jetson Orin Nano / Orin NX、JetPack 6.2）、reComputer RK3588 または reComputer RK3576。駐車枠の状態を受け取る MQTT サーバーも必要です。
      verified:
        - hardware
      device_groups:
        - id: compute
          name: Edge Box
          name_i18n: {zh: 边缘主机}
          type: single
          required: true
          description: Pick one. reComputer J30 and J40 share one deploy target; RK3588 and RK3576 each have their own.
          description_i18n: {zh: 选一台。reComputer J30 和 J40 用同一个部署目标，RK3588、RK3576 各有自己的部署目标。}
          options:
            - device_ref: recomputer_j30
            - device_ref: recomputer_j40
            - device_ref: recomputer_rk3588
            - device_ref: recomputer_rk3576
          default: recomputer_j30
        - id: cameras
          name: Parking Cameras
          name_i18n: {zh: 停车场摄像头}
          type: single
          required: true
          options: [{device_ref: generic_ip_camera}]
          default: generic_ip_camera
  stats:
    difficulty: intermediate
    estimated_time: 60min
  links: {}
deployment:
  guide_file: guide.md
  guide_file_i18n: {zh: guide_zh.md}
  selection_mode: sequential
