version: "1.0"
id: health_verify
name: Check the service is running
name_i18n: {zh: 检查服务是否在运行}
type: http_debug
# Health binds 0.0.0.0:8099 on both targets (render_config.py sets it), so the
# check works from the computer running the app. HTTP 200 means the service is
# up; it stays 200 when a camera stream stalls, so stream health is read from
# the bay messages (`stream_ok`, `unknown`) instead.
http_debug:
  endpoints:
    - id: healthz
      name: Service status
      name_i18n: {zh: 服务状态}
      url_template: http://{{host}}:8099/healthz
      expected_status: 200
user_inputs:
  - id: host
    name: Edge box IP address
    name_i18n: {zh: 边缘主机 IP 地址}
    type: text
    required: true
    placeholder: "192.168.1.100"
    description: The same address you deployed to. Use 127.0.0.1 if you deployed on this machine.
    description_i18n: {zh: 和部署时填的是同一个地址。在本机部署的填 127.0.0.1。}
