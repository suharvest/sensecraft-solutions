version: '1.0'
id: smart_hvac_control
name: HVAC Automation Control
name_i18n:
  zh: 暖通自动化控制

intro:
  summary: >-
    Bring HVAC controller points and an energy meter into one point model, predict setpoints
    from historical data, and write them back only after a verified readback, with rollback
    and alarms when the field disagrees.
  summary_i18n:
    zh: >-
      把暖通控制器点位与电能表汇入同一套点位模型，用历史数据预测设定值，写入后必须读回核对
      才算生效；现场不一致时自动回滚并告警。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md

  # Cover and gallery: real running-UI captures plus the architecture diagram.
  #
  # The six PNGs are screen captures of the actual missionpack-knn console running against
  # real backend code, with the SDM630 meter, the HVAC BACnet controller and the Modbus
  # control register supplied by this repository's own protocol simulators rather than
  # physical field devices — every caption says so. The last two were captured after the
  # rollback coordinator and the alarm envelope were wired into the live prediction cycle,
  # so unlike the first four they do show a live alarm banner and a live compensation.
  # gallery/architecture.svg stays alongside them as a labelled schematic diagram.
  # The three remaining SVGs on disk (cover, dashboard, recomputer) are drawings that would
  # read as product photography or as a screenshot of a running console, so they stay
  # unreferenced. Full provenance (capture host, commit, simulator configuration, duration)
  # is in gallery/ATTRIBUTION.md.
  cover_image: gallery/points-overview-running.png
  gallery:
    - type: image
      src: gallery/points-overview-running.png
      caption: >-
        Running point table — all 13 points (10 SDM630 meter registers, 3 HVAC BACnet points)
        reading live "good" quality across both sources. Field devices are this repo's own
        protocol simulators, not a physical meter or controller.
      caption_i18n:
        zh: >-
          运行中的点位总表——电表（SDM630，10 个寄存器）与暖通 BACnet（3 个点位）共 13 个
          点位均为实时"良好"质量。现场设备为本仓库自带的协议模拟器，非真实电表或控制器。
    - type: image
      src: gallery/access-registration.png
      caption: >-
        Access page — the SDM630 Modbus TCP source and the HVAC BACnet/IP source, both
        online, with their registered point counts. Simulated field devices, real gateway
        registration flow.
      caption_i18n:
        zh: >-
          接入页——SDM630 Modbus TCP 数据源与暖通 BACnet/IP 数据源均在线，附各自已注册点位数。
          现场设备为模拟器，接入注册流程为真实网关逻辑。
    - type: image
      src: gallery/control-dispatch-readback.png
      caption: >-
        Command-receipt ledger — manual setpoint and compressor-enable writes to the
        simulated HVAC controller, each shown protocol-acknowledged with requested vs.
        effective value and actor. Not a rollback or alarm demonstration.
      caption_i18n:
        zh: >-
          命令回执台账——对模拟暖通控制器下发的手动设定值与压缩机启停写入，均显示协议已确认，
          附请求值/生效值与操作者。非回滚或告警演示。
    - type: image
      src: gallery/points-source-offline.png
      caption: >-
        Point table with the SDM630 source stopped mid-capture: its ten points read
        "offline" while the HVAC BACnet source stays "good" — the pre-existing per-point
        quality state, not the new alarm banner or rollback coordinator (neither is wired
        into the live cycle yet).
      caption_i18n:
        zh: >-
          停止 SDM630 数据源后的点位总表：其 10 个点位显示"离线"，暖通 BACnet 数据源仍为
          "良好"——沿用既有的逐点质量状态，非新告警条或回滚协调器（二者均尚未接入实时周期）。
    - type: image
      src: gallery/alarm-banner-source-offline.png
      caption: >-
        Alarm banner raised by the wired health/alarm bridge: the SDM630 source was stopped
        with SIGTERM, its ten points read "offline", and the banner reports one unrecovered,
        unacknowledged source-offline warning. Simulated meter, real alarm path.
      caption_i18n:
        zh: >-
          已接入的健康/告警桥抬起的告警横幅：SDM630 数据源被 SIGTERM 停止，其 10 个点位显示
          "离线"，横幅报告 1 条未恢复、未确认的"来源离线"警告。电表为模拟器，告警链路为真实逻辑。
    - type: image
      src: gallery/control-readback-compensated.png
      caption: >-
        Command-receipt ledger with the readback column: predicted writes that matched the
        field read "read back / matched"; the one whose register was changed out of band
        reads "read back / mismatched, compensated · 99", followed by the compensation
        command issued by plugin:prediction:rollback. Simulated Modbus device, real
        write-verify-compensate path.
      caption_i18n:
        zh: >-
          带"读回"列的命令回执台账：与现场一致的预测写入显示"已读回 / 一致"；被带外改写过的
          那一条显示"已读回 / 不一致已补偿 · 99"，其后紧跟由 plugin:prediction:rollback
          下发的补偿命令。Modbus 设备为模拟器，写入-核对-补偿链路为真实逻辑。
    - type: image
      src: gallery/architecture.svg
      caption: Schematic architecture diagram — meter and HVAC points, prediction, and the verified write path. Not a screenshot of a running system.
      caption_i18n:
        zh: 系统架构示意图——电表与暖通点位、预测，以及带读回核实的写入链路。非运行界面截图。

  category: industrial_iot
  solution_type: solution

  input_requirements:
    - type: modbus_tcp
      description: >-
        An Eastron SDM630 (Modbus V2 register map) energy meter, reachable either over
        Modbus TCP or through a Modbus TCP gateway
      description_i18n:
        zh: >-
          一台 Eastron SDM630（Modbus V2 寄存器映射）电能表，通过 Modbus TCP 直连或经
          Modbus TCP 网关可达
    - type: modbus_rtu
      description: >-
        Alternatively the same meter on RS-485 through a USB adapter. The standard Docker
        profile does not attach a host serial device; use the serial-device profile
      description_i18n:
        zh: >-
          或同一台电能表经 USB 适配器接在 RS-485 总线上。标准 Docker 配置不会挂载主机串口，
          需要使用串口设备部署配置
    - type: opc_ua
      description: An OPC UA HVAC controller endpoint, or the built-in simulator for a dry run
      description_i18n:
        zh: OPC UA 暖通控制器地址；只做演练时可用内置模拟器
    - type: bacnet_ip
      description: >-
        Optionally a BACnet/IP air handler on a reachable subnet. Writes use a priority and
        release with Null; COV subscription, BBMD registration and MS-TP are not implemented
      description_i18n:
        zh: >-
          可选：位于可达网段的 BACnet/IP 空调机组。写入带优先级并用 Null 释放；未实现 COV
          订阅、BBMD 注册和 MS-TP
    - type: dataset
      description: >-
        At least one week of historical operation data as CSV or Excel, with timestamp,
        setpoint, measured temperature and power consumption columns
      description_i18n:
        zh: >-
          至少一周的历史运行数据（CSV 或 Excel），含时间、设定值、实测温度和用电量列

  output_interfaces:
    - type: http
      description: Browser console for points, meter registration, prediction, control and alarms
      description_i18n:
        zh: 浏览器控制台，管理点位、电表注册、预测、控制和告警
      port: 8280
      endpoint: /
    - type: http
      description: Runtime metrics, including northbound spool counters when northbound publishing is enabled
      description_i18n:
        zh: 运行指标接口；启用北向上云时包含 spool 计数
      port: 8280
      endpoint: /system/runtime-metrics

  tags:
    - hvac
    - knn
    - opc-ua
    - modbus
    - bacnet
    - energy-meter
    - sdm630
    - control-rollback
    - alarms
    - industrial
    - automation
    - recomputer

  device_catalog:
    recomputer_r11:
      description: >-
        Runs the point model, the KNN prediction service, the control write path with
        readback and rollback, and the web console
      description_i18n:
        zh: >-
          运行点位模型、KNN 预测服务、带读回与回滚的控制写入链路，以及 Web 控制台

  stats:
    deployed_count: 0
    likes_count: 0
    difficulty: intermediate
    estimated_time: 60min

  links:
    github: https://github.com/Seeed-Solution/Solution_HVAC_SmartControl

  presets:
    - id: default
      name: Standard Deployment
      name_i18n:
        zh: 标准部署
      description: >-
        Deploy the KNN prediction service, register the energy meter, commission control in
        observe-first mode, and verify readback, rollback and alarms before enabling writes.
      description_i18n:
        zh: >-
          部署 KNN 预测服务，注册电能表，以"先观察"模式完成控制调试，并在开启写入之前验证
          读回、回滚和告警。
      device_groups:
        - id: edge_device
          name: Edge Device
          name_i18n:
            zh: 边缘设备
          type: single
          required: false
          description: Only needed for remote deployment
          description_i18n:
            zh: 仅远程部署时需要
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11

deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  post_deployment:
    autostart:
      enabled: true
      mode: fullscreen
      url: http://localhost:8280
