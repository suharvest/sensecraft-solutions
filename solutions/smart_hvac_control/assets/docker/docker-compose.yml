# Image tag policy
#
# Pinned to the immutable published tag `missionpack-knn:v1.6.8`. Never use `latest`:
# the same tag must always resolve to the same content.
#
# Included in v1.6.8: Eastron SDM630 meter template, control rollback coordinator,
# alarm envelope, custom derived points with sliding window statistics, and React console.
#
# Modbus RTU: this profile attaches no host serial device, so an RS-485 meter needs the
# serial-device deployment profile instead of this compose file.
#
# Logs are bounded twice: json-file rotation below (10 MB x 3) for the container's stdout,
# and LOG_MAX_BYTES/LOG_BACKUP_COUNT for the application log inside the ./log volume.

services:
  app:
    image: sensecraft-missionpack.seeed.cn/solution/missionpack-knn:v1.6.8
    container_name: missionpack_knn
    ports:
      - "8280:8280"
      - "4841:4841"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - OPC_UA_SERVER=${OPC_UA_SERVER:-opc.tcp://localhost:4841}
      - LOG_DIR=/app/log
      - LOG_MAX_BYTES=10485760
      - LOG_BACKUP_COUNT=4
    volumes:
      - ./configs:/app/configs
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./log:/app/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8280/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
