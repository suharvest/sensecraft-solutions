  <rect x="64" y="624" width="1152" height="48" rx="12" fill="#eef5df" stroke="#d7e6b7"/>
  <text x="640" y="655" text-anchor="middle" fill="#4d5d2b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Native MissionPack MQTT topic contract · Sparkplug B is not claimed in this release</text>
</svg>
