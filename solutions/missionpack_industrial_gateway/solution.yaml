version: "1.0"
id: missionpack_industrial_gateway
name: Industrial Multi-Protocol Data Hub
name_i18n:
  zh: 工业多协议数据中枢

intro:
  summary: Bring OPC UA, Modbus, BACnet/IP, and MQTT devices into one point model, then read and control them through one MQTT interface.
  summary_i18n:
    zh: 把 OPC UA、Modbus、BACnet/IP 和 MQTT 设备汇入一套点位模型，再通过统一 MQTT 接口读取与控制。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/cover.png
  category: industrial_iot
  solution_type: solution
  tags:
    - industrial-iot
    - opc-ua
    - modbus
    - bacnet
    - mqtt
    - protocol-integration
    - unified-data
    - edge-control
    - recomputer-r
    - reterminal-dm

  gallery:
    - type: image
      src: gallery/access-runtime.png
      caption: Configure industrial sources and inspect their live runtime state
      caption_i18n:
        zh: 配置工业数据源并查看实时运行状态
    - type: image
      src: gallery/live-points.png
      caption: Filter, monitor, and control points from one table
      caption_i18n:
        zh: 在一个总表中筛选、监控和控制全部点位
    - type: image
      src: gallery/data-service.png
      caption: Configure the embedded MQTT service and inspect its topic contract
      caption_i18n:
        zh: 配置内置 MQTT 服务并查看统一主题契约
    - type: video
      src: gallery/demo.mp4
      thumbnail: gallery/cover.png
      caption: End-to-end source onboarding and data service workflow
      caption_i18n:
        zh: 从协议接入到统一数据服务的完整操作流程

  input_requirements:
    - type: opc_ua
      description: An OPC UA endpoint reachable from the edge device
      description_i18n:
        zh: 边缘设备能够访问的 OPC UA 服务地址
    - type: modbus_tcp
      description: A Modbus TCP controller reachable over the local network
      description_i18n:
        zh: 局域网内可访问的 Modbus TCP 控制器
    - type: modbus_rtu
      description: An optional USB-to-RS-485 adapter for Modbus RTU; production writes require hardware validation
      description_i18n:
        zh: Modbus RTU 可选用 USB 转 RS-485 适配器；生产写控制需先通过真实硬件验证
    - type: bacnet_ip
      description: A BACnet/IP network reachable from the selected network interface
      description_i18n:
        zh: 所选网卡能够访问的 BACnet/IP 网络
    - type: mqtt
      description: An MQTT broker and explicit topic-to-point mappings when MQTT is used as a data source
      description_i18n:
        zh: MQTT 作为数据源时，需要可访问的 Broker 与明确的主题到点位映射

  output_interfaces:
    - type: http
      description: Browser-based source, point, command receipt, and plugin management
      description_i18n:
        zh: 通过浏览器管理数据源、点位、控制回执和插件
      port: 8280
      endpoint: /
    - type: mqtt
      description: Versioned point telemetry, presence, command, and receipt topics from the embedded broker
      description_i18n:
        zh: 内置 Broker 提供带版本的点位遥测、在线状态、命令与回执主题
      port: 1883
      topic: missionpack/v1/{gateway}/points/{point_id}
      schema_type: MissionPack v1 JSON envelope

  device_catalog:
    recomputer_r10:
      description: Unifies field protocols into one point model and MQTT interface
      description_i18n:
        zh: 将现场协议统一为一套点位模型和 MQTT 接口
    recomputer_r11:
      description: Unifies field protocols into one point model and MQTT interface
      description_i18n:
        zh: 将现场协议统一为一套点位模型和 MQTT 接口
    reterminal_dm:
      description: Unifies field protocols and provides a local touch display for setup and operations
      description_i18n:
        zh: 统一现场协议，并通过本机触控屏完成配置与日常操作

  presets:
    - id: standard
      name: Multi-Protocol Data Hub
      name_i18n:
        zh: 多协议数据中枢
      description: Deploy one reusable protocol integration layer, then onboard controllers and expose a unified MQTT interface.
      description_i18n:
        zh: 部署一套可复用的协议融合层，接入现场控制器，并提供统一 MQTT 读写接口。
      device_groups:
        - id: gateway_host
          name: Data Hub Host
          name_i18n:
            zh: 数据中枢主机
          type: single
          required: true
          options:
            - device_ref: recomputer_r10
            - device_ref: recomputer_r11
            - device_ref: reterminal_dm
          default: recomputer_r11

  stats:
    difficulty: intermediate
    estimated_time: 15min

  # links: omitted. The github entry here pointed at
  # Seeed-Solution/Solution_HVAC_SmartControl -- the smart_hvac_control
  # solution's repo, copy-pasted and never changed, and a 404 besides. Add the
  # real MissionPack repo when there is one; a wrong link is worse than none.

deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
