# Waste sorting at the bin. Upstream repo: ~/project/edge-waste-sorting.
#
# Dataset licences are cleared for external use: TrashNet is MIT
# (Copyright (c) 2017 Gary Thung) and Roboflow "Garbage Classification 3 —
# Material Identification" is CC BY 4.0. Both licences permit redistribution
# and derivative works with attribution; the attribution string is in
# gallery/ATTRIBUTION.md and repeated in both description files.
#
# Classification screenshots are committed under gallery/, sourced from
# TrashNet (MIT) and GC3 (CC BY 4.0) validation images per the escape hatch
# this package always documented. See gallery/ATTRIBUTION.md for the per-image
# source table.
#
# The cover and the second gallery image are device results — reCamera Pro
# (RV1126B NPU, INT8 RKNN) and reCamera (SG2002 TPU, BF16 cvimodel). The
# remaining figures are onnxruntime on an Apple M4 CPU and say so. No preset
# carries `verified:`.
#
# Every figure on this page is single-item classification, which is what the
# four platform packages ship. The repository also carries a multi-item
# detector; it has only been evaluated on a synthetic set and is not part of
# any package, so no figure on this page shows it.
version: "1.0"
id: edge_waste_sorting
name: Waste Sorting at the Bin
name_i18n:
  zh: 投放点垃圾分类

intro:
  summary: >-
    Photograph one item on a trigger, return its material class plus the
    Chinese four-way disposal category over MQTT, and hand the verdict to a
    flap or indicator through a GPIO callback.
  summary_i18n:
    zh: >-
      触发即拍一件物品，通过 MQTT 给出物料类别与中国生活垃圾四分类，
      并把判定通过 GPIO 回调交给翻盖或指示灯。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/waste-npu-4up-20260908.jpg
  gallery:
    - type: image
      src: gallery/waste-npu-4up-20260908.jpg
      caption: >-
        Four single items classified on a reCamera Pro's own RV1126B NPU —
        INT8 RKNN model, one item per frame. Each frame carries the material
        class the device returned, the Chinese four-way disposal category, the
        confidence and the measured inference time: a tin can and a plastic
        bottle to recyclables, windfall apples to kitchen waste, a crumpled
        wrapper to residual
      caption_i18n:
        zh: >-
          四件物品在 reCamera Pro 自己的 RV1126B NPU 上的分类结果——INT8 RKNN
          模型，一帧一件。每帧标出设备返回的物料类别、中国四分类、置信度与
          实测推理耗时：铁罐与塑料瓶归可回收物，落果归厨余，皱纸归其它
    - type: image
      src: gallery/waste-recamera-sg2002-20260907.jpg
      caption: >-
        Four results produced on a reCamera's own SG2002 TPU, not on a host -
        BF16 cvimodel, predicted class, Chinese four-way category and the
        per-frame inference time as measured on the device
      caption_i18n:
        zh: >-
          四张在 reCamera 自己的 SG2002 TPU 上跑出来的结果，不是主机代跑——
          BF16 cvimodel，标注预测类别、中国四分类与设备实测的单帧推理耗时
    - type: image
      src: gallery/waste-grid-4up-local-20260907.jpg
      caption: Four real CPU inference results (onnxruntime, Apple M4) on TrashNet (MIT) validation images — one per requested category, predicted class and confidence drawn on each frame
      caption_i18n:
        zh: 四张真实 CPU 推理结果（onnxruntime，Apple M4），取自 TrashNet（MIT）验证集图片——每类一张，帧上标注预测类别与置信度
    - type: image
      src: gallery/waste-paper-local-20260907.jpg
      caption: Paper, correctly classified — CPU inference on a TrashNet (MIT) sample image
      caption_i18n:
        zh: 纸张，分类正确——对 TrashNet（MIT）样例图片的 CPU 推理
    - type: image
      src: gallery/waste-metal-local-20260907.jpg
      caption: Metal, correctly classified — CPU inference on a TrashNet (MIT) sample image
      caption_i18n:
        zh: 金属，分类正确——对 TrashNet（MIT）样例图片的 CPU 推理
    - type: image
      src: gallery/waste-plastic-local-20260907.jpg
      caption: Plastic, correctly classified — CPU inference on a TrashNet (MIT) sample image
      caption_i18n:
        zh: 塑料，分类正确——对 TrashNet（MIT）样例图片的 CPU 推理
    - type: image
      src: gallery/waste-residual-local-20260907.jpg
      caption: "“Other” (trash) sample misclassified as plastic at low confidence — kept as-is, not cherry-picked; consistent with the model's documented CPU baseline"
      caption_i18n:
        zh: "“其它”样例被低置信度误判为塑料——如实保留、未挑选好看的结果，与模型已记录的 CPU 基线一致"
    - type: image
      src: gallery/architecture.svg
      caption: Trigger to camera to device — one shot in, material class and Chinese four-way category out on MQTT, with a GPIO callback alongside
      caption_i18n:
        zh: 从触发到相机再到设备——拍一张进去，物料类别与中国四分类通过 MQTT 出来，旁边是 GPIO 回调
  # Real classification screenshots were added 2026-09-07, sourced from
  # TrashNet (MIT) validation images per the escape hatch this package always
  # documented. See gallery/ATTRIBUTION.md for the per-image source table.
  category: sensing
  solution_type: solution
  tags:
    - waste-sorting
    - image-classification
    - mqtt
    - gpio
    - efficientnet-lite0
    - siglip2
    - open-vocabulary
    - smart-bin

  output_interfaces:
    - type: mqtt
      port: 1883
      topic: waste/<stream-id>/results
      description: >-
        One JSON message per classification, never one message per class.
        Carries the material class, the Chinese four-way category looked up
        from it, the top-3 with confidences, the trigger source, and a
        reference to the captured image — never the image bytes. "category"
        always equals "top3[0]" and "confidence" always equals
        "top3[0].confidence"; both are checked before publishing, and a
        payload that fails the contract is counted and dropped rather than
        sent.
      schema_type: json
      payload_example: '{"type":"waste_sorting_result","version":"1.0.0","taxonomy_version":"material8/china4-v1","device":"orin-nx","stream_id":"bin1-cam1","frame_id":4207,"timestamp":1757030400123,"trigger":"button","inference_time_ms":3.7,"pipeline_ms":42.5,"category":{"class_id":4,"class_name":"plastic","china_category":"recyclable","china_category_zh":"可回收物"},"confidence":0.913,"top3":[{"rank":0,"class_id":4,"class_name":"plastic","confidence":0.913,"china_category":"recyclable"},{"rank":1,"class_id":2,"class_name":"glass","confidence":0.052,"china_category":"recyclable"},{"rank":2,"class_id":7,"class_name":"residual","confidence":0.021,"china_category":"residual"}],"image_ref":{"kind":"local","uri":"/var/lib/edge-waste-sorting/captures/2026-09-05/bin1-cam1-4207.jpg"},"model":{"name":"efficientnet_lite0_waste8","backbone":"efficientnet_lite0","input":"images:1x3x224x224","onnx_sha256":"e9f9e847de6899ad4341d8f6084823e7c70307e84ac4d0da4bc4911b5b767391","accelerator":"tensorrt"}}'
      description_i18n:
        zh: >-
          一次分类一条 JSON，不逐类别发。内容包括物料类别、由它查表得到的
          中国四分类、带置信度的 top3、触发来源，以及所拍图片的引用——
          不含图片字节。「category」 恒等于 「top3[0]」，「confidence」 恒等于
          「top3[0].confidence」；两条在发布前都会检查，不合契约的 payload
          计数并丢弃，不发出去。
    - type: http
      port: 8080
      endpoint: /trigger, /preview.mjpg, /healthz, /events
      description: >-
        The runtime's own page and control surface. POST /trigger fires one
        capture-and-classify (the "http" trigger source); /preview.mjpg is the
        live view; /healthz carries inference time, the trigger and debounce
        counters and the MQTT counters; /events lists the most recent results
        with their top-3.
      schema_type: json
      description_i18n:
        zh: >-
          运行时自带的页面与控制入口。POST /trigger 触发一次拍照分类
          （「http」 触发源）；/preview.mjpg 是实时画面；/healthz 带推理耗时、
          触发与去抖计数以及 MQTT 计数；/events 列出最近的结果与它们的 top3。
    - type: mqtt
      port: 1883
      topic: waste/<stream-id>/fallback
      description: >-
        Optional side-channel event ("waste_fallback") carrying a shared VLM
        service's second opinion on one ambiguous item, keyed by frame_id to
        the results event. It never enters the classification path and never
        changes the main event's category; a missing fallback event only means
        the VLM was slow, degraded or disabled. Off by default.
      schema_type: json
      description_i18n:
        zh: >-
          可选的旁路事件（「waste_fallback」），携带外部共享 VLM 服务对某件
          模糊物品的第二意见，按 frame_id 与 results 事件对齐。它不进分类
          路径，也不改变主事件的 category；没有 fallback 事件只说明 VLM 慢、
          降级或没开。默认关闭。

  input_requirements:
    - type: usb
      description: >-
        A camera looking down into the drop area, framed so one item fills a
        meaningful part of the frame. The model classifies one object per
        image — it has no detector and does not separate two items in one
        shot. USB, RTSP and file sources are all accepted.
      required: true
      description_i18n:
        zh: >-
          一台俯视投放区的相机，取景要让单件物品在画面里占到有意义的比例。
          模型一图一件——它没有检测器，同一张图里的两件物品分不开。
          USB、RTSP 与文件源都支持。
    - type: http
      description: >-
        Optional — a VLM service endpoint (edge-vision-vlm) reachable from the
        host, only needed for the "waste_fallback" side channel. Without it,
        leave "vlm.enabled" false.
      required: false
      description_i18n:
        zh: >-
          可选——一个从主机可达的 VLM 服务端点（edge-vision-vlm），
          只有要用 「waste_fallback」 旁路时才需要。不需要就保持
          「vlm.enabled」 为 false。

  device_catalog:
    recomputer_j40:
      description: >-
        Runs the classifier on TensorRT, and is the only device class on which
        the optional open-vocabulary track is offered — a ViT-B/16 at 67 ms
        per image on CPU needs an accelerator to be usable. No figure on this
        page was taken on this board.
      description_i18n:
        zh: >-
          用 TensorRT 运行分类器，也是唯一提供可选开放词汇 track 的设备类别——
          ViT-B/16 在 CPU 上单图 67 ms，要能用就得有加速器。
          本页没有任何一个数字取自这块板。
      purchase:
        require:
          module: [orin_nx_16]
    recomputer_j30:
      description: >-
        The smaller Orin Nano 8GB option. It carries the baseline classifier
        the same way; the open-vocabulary track has not been sized for it.
      description_i18n:
        zh: >-
          更小的 Orin Nano 8GB 选项。基线分类器跑法相同；
          开放词汇 track 没有为它估过资源。
      purchase:
        require:
          module: [orin_nano_8]
    recomputer_r20_industrial:
      description: >-
        A reComputer R2000 with a Hailo-8 on the M.2 slot. It runs the
        EfficientNet-Lite0 HEF, which takes uint8 frames directly so the host
        does no float preprocessing. Its inference time is the steadiest of
        any option here — 3.2 ms, with the 95th percentile only 0.06 ms above
        the median — and it is also the one platform where quantising this
        model costs accuracy: 2.4 points against the same model on a host.
      description_i18n:
        zh: >-
          M.2 插槽上装了 Hailo-8 的 reComputer R2000。它跑
          EfficientNet-Lite0 的 HEF，输入直接吃 uint8，主机不做浮点预处理。
          它的推理耗时是这里最稳的——3.2 ms，95 分位只比中位数高 0.06 ms；
          同时它也是唯一一个量化会掉精度的平台：比主机上同一个模型低 2.4 个百分点。
      purchase:
        require:
          ai_accelerator: [hailo-8]
    recamera_2002:
      description: >-
        Camera and classifier in one body. The model runs on the SG2002's own
        TPU, so there is no host, no accelerator card and no network hop in
        the classification path.
      description_i18n:
        zh: >-
          相机与分类器在同一个机身里。模型跑在 SG2002 自己的 TPU 上，
          分类路径上没有主机、没有加速卡、也没有一跳网络。
    recomputer_rk3588:
      description: >-
        A separate box next to the camera, for when one host has to serve
        several bins or the camera cannot be replaced. Its NPU runs the
        classifier in INT8 in about half the time the fp16 build needs on the
        same board. Both the 8 GB and 16 GB variants carry the same NPU and
        run this model, which is 4 MB.
      description_i18n:
        zh: >-
          放在相机旁边的独立主机，适合一台主机带多个投放点、
          或者相机本身换不掉的场合。它的 NPU 用 INT8 跑分类器，
          耗时约为同一块板上 fp16 的一半。8 GB 与 16 GB 两个规格带的是同一颗
          NPU，都能跑这个模型——模型本身 4 MB。
    recamera_pro:
      description: >-
        The faster of the two all-in-one cameras: its NPU runs the classifier
        in INT8 in roughly a fifth of the time the SG2002 model needs. On a
        1060-image validation subset it reached material top-1 0.8764, against
        0.8792 for the SG2002 camera on the same images. Pick it when the bin
        has to keep up with a queue rather than a single drop.
      description_i18n:
        zh: >-
          两款一体式相机里更快的那个：它的 NPU 用 INT8 跑分类器，耗时约为
          SG2002 那款的五分之一。在一份 1060 张的验证子集上，它的物料八类
          top-1 是 0.8764，同一批图上 SG2002 那款是 0.8792。投放点要应付
          排队而不是单次投放时选它。
    generic_usb_camera:
      name: USB / IP Camera
      name_i18n:
        zh: USB / IP 摄像头
      description: Any USB or RTSP camera looking down into the drop area
      description_i18n:
        zh: 任意一台俯视投放区的 USB 或 RTSP 摄像头

  presets:
    - id: orin
      name: Camera + reComputer J30 / J40 (Orin)
      name_i18n:
        zh: 摄像头 + reComputer J30 / J40（Orin）
      badge: Untested on hardware
      badge_i18n:
        zh: 未上板验证
      description: >-
        TensorRT FP16 on Jetson Orin, engine built on the device during
        deployment. The only preset that offers the optional open-vocabulary
        track, and the only one whose model file exists.
      description_i18n:
        zh: >-
          Jetson Orin 上跑 TensorRT FP16，engine 在部署过程中于设备上构建。
          唯一提供可选开放词汇 track 的套餐，也是唯一有模型文件的那个。
      device_groups:
        - id: compute
          name: Sorting Host
          name_i18n:
            zh: 分类主机
          type: single
          required: true
          options:
            - device_ref: recomputer_j40
            - device_ref: recomputer_j30
          default: recomputer_j40
        - id: camera
          name: Camera
          name_i18n:
            zh: 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_usb_camera
          default: generic_usb_camera

    - id: recomputer_r20
      name: Camera + reComputer R2000 (Hailo-8)
      name_i18n:
        zh: 摄像头 + reComputer R2000（Hailo-8）
      description: >-
        EfficientNet-Lite0 on the Hailo-8, from the uint8 HEF
        (sha256 c514a463…) so the host hands the accelerator raw frames
        instead of normalising them first. Measured over the whole
        7417-image validation set: material top-1 0.8889, Chinese four-way
        0.9507, p50 3.166 ms and p95 3.249 ms for inference alone (capture and
        preprocessing excluded).

        Accuracy matches fp32 run on a host over the same images to within
        0.12 points, so quantisation costs nothing measurable here — as on the
        RK3588 preset, at the same 3.2 ms. What this one adds is consistency:
        the gap between the median and the 95th percentile is 0.08 ms, against
        0.69 ms on RK3588.
      description_i18n:
        zh: >-
          EfficientNet-Lite0 跑在 Hailo-8 上，用的是 uint8 输入的 HEF
          （sha256 c514a463…），主机直接把原始帧交给加速器，不必先做归一化。
          在 val 全集 7417 张上实测：物料八类 top-1 0.8889、中国四分类 0.9507、
          p50 3.166 ms、p95 3.249 ms（纯推理，不含取图与预处理）。

          精度与同一批图上主机 fp32 相差 0.12 个百分点，即量化在这里没有可测量
          的代价——与 RK3588 套餐一样，时延同样是 3.2 ms。它额外给的是一致性：
          中位数与 95 分位只差 0.08 ms，RK3588 是 0.69 ms。
      device_groups:
        - id: compute
          name: Sorting Host
          name_i18n:
            zh: 分类主机
          type: single
          required: true
          options:
            - device_ref: recomputer_r20_industrial
          default: recomputer_r20_industrial
        - id: camera
          name: Camera
          name_i18n:
            zh: 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_usb_camera
          default: generic_usb_camera

    - id: recamera
      name: reCamera (SG2002)
      name_i18n:
        zh: reCamera（SG2002）
      description: >-
        The whole classifier on the camera's own TPU. Measured on the device
        over 1060 validation images: material top-1 0.8792, Chinese four-way
        top-1 0.9566, p50 24.3 ms for inference alone (capture and
        preprocessing excluded), peak resident memory 11.6 MB. The model is
        BF16; against fp32 on a host over the same 1060 images it is +0.47 pp,
        within sampling noise, so no accuracy drop was observed on this
        1060-image subset.
      description_i18n:
        zh: >-
          整个分类器跑在相机自己的 TPU 上。设备实测 1060 张验证图：
          物料八类 top-1 0.8792、中国四分类 top-1 0.9566、p50 24.3 ms
          （纯推理，不含取图与预处理）、峰值常驻内存 11.6 MB。模型是 BF16；
          在同一批 1060 张图上比主机 fp32 高 0.47 pp，落在采样噪声内，
          即在这 1060 张子集上没有观察到准确率下降。
      device_groups:
        - id: compute
          name: Camera and Classifier
          name_i18n:
            zh: 相机与分类器
          type: single
          required: true
          options:
            - device_ref: recamera_2002
          default: recamera_2002

    - id: recamera_pro
      name: reCamera Pro
      name_i18n:
        zh: reCamera Pro
      description: >-
        The whole classifier on the camera's own NPU, in INT8. Measured on the
        device over 1060 validation images: material top-1 0.8764, Chinese
        four-way top-1 0.9566, p50 5.8 ms and p95 6.0 ms — inference alone,
        with the camera's built-in application stopped, capture and
        preprocessing excluded. That is 2.9x the speed of the
        same model in fp16 on this camera and 4.2x the reCamera figure. On
        this camera INT8, fp16 and host fp32 land within 0.2 pp of each other
        over these 1060 images, so quantisation showed no accuracy cost here.
        On those same images this camera reached 0.8764 and the reCamera
        0.8792 — one subset, not a general ranking of the two cameras.
      description_i18n:
        zh: >-
          整个分类器跑在相机自己的 NPU 上，用 INT8。设备实测 1060 张验证图：
          物料八类 top-1 0.8764、中国四分类 top-1 0.9566、p50 5.8 ms、
          p95 6.0 ms（自带应用停止时的纯推理，不含取图与预处理）。这是同一台相机上 fp16 的
          2.9 倍速度、reCamera 的 4.2 倍。在这台相机上，INT8、fp16 与主机 fp32
          三者在这 1060 张图上的 top-1 相差不到 0.2 pp，即量化在这里没有表现出
          精度代价。同一批图上它是 0.8764、reCamera 是 0.8792——这是一份子集上的
          结果，不是两款相机的普遍排序。
      device_groups:
        - id: compute
          name: Camera and Classifier
          name_i18n:
            zh: 相机与分类器
          type: single
          required: true
          options:
            - device_ref: recamera_pro
          default: recamera_pro

    - id: recomputer_rk3588
      name: Camera + reComputer RK3588
      name_i18n:
        zh: 摄像头 + reComputer RK3588
      description: >-
        The classifier on an RK3588 NPU, in INT8. The only configuration
        measured over the whole 7417-image validation set rather than a
        subset: material top-1 0.8882, Chinese four-way 0.9507, p50 3.2 ms and
        p95 3.9 ms for inference alone (capture and preprocessing excluded).
        fp16 gives the same material top-1 at p50 6.0 ms, so INT8 is 1.9x
        faster with no difference on that metric; the four-way figure and the
        agreement with the host baseline do differ slightly between them.
        Both land within 0.05 pp of fp32 run on a host over these same images.
        Every device on this page is compared against a host baseline computed
        on the images that device saw, and the sets differ — so these top-1
        values are not a ranking of one device against another.
      description_i18n:
        zh: >-
          分类器跑在 RK3588 的 NPU 上，用 INT8。这是唯一一个在 val 全集
          7417 张（而不是子集）上测过的配置：物料八类 top-1 0.8882、
          中国四分类 0.9507、p50 3.2 ms、p95 3.9 ms（纯推理，不含取图与预处理）。
          fp16 的物料 top-1 与它完全相同，p50 是 6.0 ms，即 INT8 快 1.9 倍
          且在这一项上没有差异；四分类与对主机基线的一致率两者略有不同。
          两者与同一批图上主机 fp32 的差都在 0.05 pp 以内。本页每台设备都是
          与它自己看过的那批图上的主机基线相比，而各设备的图集不同——
          所以这些 top-1 数值不能当作设备之间的排序。
      device_groups:
        - id: compute
          name: Sorting Host
          name_i18n:
            zh: 分类主机
          type: single
          required: true
          options:
            - device_ref: recomputer_rk3588
          default: recomputer_rk3588
        - id: camera
          name: Camera
          name_i18n:
            zh: 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_usb_camera
          default: generic_usb_camera

  stats:
    difficulty: intermediate
    estimated_time: 35min

deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
