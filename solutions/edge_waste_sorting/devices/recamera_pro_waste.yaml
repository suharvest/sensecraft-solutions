version: "1.0"
id: recamera_pro_waste
name: Deploy the Classifier on reCamera Pro
type: manual

# Manual for the same reason as the SG2002 preset: what exists is a converted
# .rknn plus the Python runtime, not a packaged application, and naming a CDN
# path that holds nothing would validate here and fail on the device.
#
# The figures in step 4 were measured on this hardware on 2026-09-07 over 1060
# validation images with the camera's built-in application stopped: material
# top-1 0.8764, Chinese four-way top-1 0.9566, agreement with the fp32 CPU
# baseline 0.9906, p50 5.824 ms, p95 6.047 ms, inference only.

name_i18n:
  zh: 在 reCamera Pro 上部署分类器

steps:
  - id: fetch_model
    name: Get the converted model
    name_i18n:
      zh: 取转换好的模型
    description: >-
      The model comes from the upstream repository `edge-waste-sorting`; it is
      not committed to this package and not on the CDN. Convert it with
      `platforms/rknn/rknn_convert_m1c.py --target rv1126b`, or take the
      artifact from that repo's evaluation run, then check it:

        sha256sum efficientnet_lite0_waste8.rv1126b.int8.calib256.mmse.rknn
        # 59cf7d18d15b592bf00d7fca1aa9661ad7a5a71ca0b7665c88ef725116413723

      That is the INT8 build, 4,105,866 bytes, and it is the one to deploy. An
      fp16 build exists (`0889b198…`, 7,113,136 bytes) and is 2.9x slower for
      the same accuracy, so it is only worth using to isolate a suspected
      quantisation problem.
    description_i18n:
      zh: >-
        模型来自上游仓库 `edge-waste-sorting`，没有提交进本包，也不在 CDN 上。
        用 `platforms/rknn/rknn_convert_m1c.py --target rv1126b` 转换，或者
        直接从那个仓库的评测目录里取，然后核对：

          sha256sum efficientnet_lite0_waste8.rv1126b.int8.calib256.mmse.rknn
          # 59cf7d18d15b592bf00d7fca1aa9661ad7a5a71ca0b7665c88ef725116413723

        这是 INT8 版，4,105,866 字节，部署用它。另有 fp16 版
        （`0889b198…`，7,113,136 字节），精度相同但慢 2.9 倍，
        只有在怀疑量化出问题、需要对照时才值得用。
    optional: false

  - id: install_runtime
    name: Install the RKNN Lite runtime
    name_i18n:
      zh: 装 RKNN Lite 运行时
    description: >-
      The camera ships `librknnrt.so` but no Python bindings. Install
      `rknn_toolkit_lite2` into a virtualenv under `/userdata`, which is the
      only writable partition that survives a reboot.

      The binding's version must match the runtime already on the device.
      Check it first — a mismatch fails at `init_runtime` with an opaque
      `RKNN_ERR_FAIL` rather than a version message:

        strings /usr/lib/librknnrt.so | grep 'librknnrt version'
        # librknnrt version: 2.3.2 (...)

      Then, with the matching wheel for the device's Python:

        python3 -m venv --system-site-packages /userdata/waste/venv
        /userdata/waste/venv/bin/pip install --no-index --no-deps \
          rknn_toolkit_lite2-2.3.2-*-manylinux*aarch64.whl \
          psutil-*.whl ruamel_yaml-*.whl

      `--system-site-packages` reuses the system numpy. `--no-deps` plus the
      two extra wheels is needed because the camera has no route to a package
      index, so pip cannot resolve `psutil` or `ruamel.yaml` on its own.
    description_i18n:
      zh: >-
        相机自带 `librknnrt.so`，但没有 Python 绑定。把 `rknn_toolkit_lite2`
        装进 `/userdata` 下的 virtualenv——那是唯一重启后还在的可写分区。

        绑定的版本必须和设备上已有的运行时一致。先查一下——版本对不上时
        会在 `init_runtime` 处抛一个语焉不详的 `RKNN_ERR_FAIL`，
        而不是版本不匹配的提示：

          strings /usr/lib/librknnrt.so | grep 'librknnrt version'
          # librknnrt version: 2.3.2 (...)

        然后用与设备 Python 版本匹配的 wheel：

          python3 -m venv --system-site-packages /userdata/waste/venv
          /userdata/waste/venv/bin/pip install --no-index --no-deps \
            rknn_toolkit_lite2-2.3.2-*-manylinux*aarch64.whl \
            psutil-*.whl ruamel_yaml-*.whl

        `--system-site-packages` 复用系统的 numpy。要加 `--no-deps` 并另外
        带上那两个 wheel，是因为相机没有到软件源的路由，pip 自己解不了
        `psutil` 与 `ruamel.yaml`。
    optional: false

  - id: prepare_frame
    name: Prepare one input frame
    name_i18n:
      zh: 准备一帧输入
    description: >-
      The model takes a 224x224x3 uint8 RGB array. Resize the short side to
      256, centre-crop 224, keep RGB order. ImageNet mean and standard
      deviation are baked into the `.rknn` at conversion time, so do not
      normalise here — doing it twice is the usual reason a working classifier
      starts returning one class.

        python3 -c "
        import cv2, numpy as np
        im = cv2.imread('sample.jpg')
        h, w = im.shape[:2]; s = 256 / min(h, w)
        im = cv2.resize(im, (round(w*s), round(h*s)))
        y, x = (im.shape[0]-224)//2, (im.shape[1]-224)//2
        np.save('sample.npy', np.ascontiguousarray(im[y:y+224, x:x+224, ::-1], np.uint8))"
    description_i18n:
      zh: >-
        模型吃的是 224x224x3 的 uint8 RGB 数组。短边缩到 256、中心裁 224，
        保持 RGB 顺序。ImageNet 的均值与标准差在转换时已经烘焙进 `.rknn`，
        这里不要再归一化——归一化两次是分类器突然只输出一个类别的常见原因。

          python3 -c "
          import cv2, numpy as np
          im = cv2.imread('sample.jpg')
          h, w = im.shape[:2]; s = 256 / min(h, w)
          im = cv2.resize(im, (round(w*s), round(h*s)))
          y, x = (im.shape[0]-224)//2, (im.shape[1]-224)//2
          np.save('sample.npy', np.ascontiguousarray(im[y:y+224, x:x+224, ::-1], np.uint8))"
    optional: false

  - id: run_and_verify
    name: Classify one frame as root
    name_i18n:
      zh: 以 root 跑一帧
    description: >-
      `/dev/rknpu` is root-only, so the classifier must run as root. A non-root
      run fails at `init_runtime` with `RKNN_ERR_FAIL` and no explanation.

        /userdata/waste/venv/bin/python - <<'PY'
        from rknnlite.api import RKNNLite
        import numpy as np
        r = RKNNLite(verbose=False)
        assert r.load_rknn('efficientnet_lite0_waste8.rv1126b.int8.calib256.mmse.rknn') == 0
        assert r.init_runtime() == 0
        out = r.inference(inputs=[np.load('sample.npy')[None]])
        print(np.asarray(out[0]).reshape(-1))
        PY

      Expect eight raw logits, in the class order paper, cardboard, glass,
      metal, plastic, textile, organic, residual. Softmax and the four-way
      lookup are not done here — they live in the shared core layer so every
      accelerator returns the same thing.

      A warning about `RKNN_QUERY_INPUT_DYNAMIC_RANGE` on a static-shape model
      is expected and harmless; the runtime prints it for every static build.

      On this hardware inference settles around 5.8 ms per frame with the
      camera's own application stopped. That application normally occupies
      86-145% CPU, so expect worse while it runs; how much worse has not been
      measured.
    description_i18n:
      zh: >-
        `/dev/rknpu` 只有 root 可读写，所以分类器必须用 root 跑。非 root 运行
        会在 `init_runtime` 处失败，只给一个 `RKNN_ERR_FAIL`，没有别的解释。

          /userdata/waste/venv/bin/python - <<'PY'
          from rknnlite.api import RKNNLite
          import numpy as np
          r = RKNNLite(verbose=False)
          assert r.load_rknn('efficientnet_lite0_waste8.rv1126b.int8.calib256.mmse.rknn') == 0
          assert r.init_runtime() == 0
          out = r.inference(inputs=[np.load('sample.npy')[None]])
          print(np.asarray(out[0]).reshape(-1))
          PY

        预期输出 8 个原始 logits，顺序是 paper、cardboard、glass、metal、
        plastic、textile、organic、residual。softmax 与四分类查表不在这里做——
        它们在共用的 core 层，这样每种加速器返回的东西才一致。

        静态 shape 模型上出现 `RKNN_QUERY_INPUT_DYNAMIC_RANGE` 的告警是预期内的，
        无害；每个静态构建运行时都会打。

        这块硬件上，在相机自带应用停止的情况下，单帧推理稳定在 5.8 ms 附近。
        那个应用平时占 86-145% CPU，它在跑的时候应当预期更慢，具体慢多少
        没有测过。
    optional: false
