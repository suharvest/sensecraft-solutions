version: "1.0"
name: reCamera Pro
id: recamera_pro_waste
type: recamera_pro_app

# The App Center on reCamera Pro runs one app at a time. This step configures
# the `waste-sorting` app and makes it the active one; installing it is the App
# Center's own job, because a package has to carry a release signature this
# repository does not hold. If the target's App Center does not list it, the
# step says so and names what is installed instead.
#
# Verified on this hardware on 2026-09-08: install, activate, /healthz, events
# on waste/{stream_id}/results, stop, uninstall. Over 1060 validation images the
# INT8 model agrees with the fp32 CPU baseline on 0.9906, material top-1 0.8764,
# Chinese four-way top-1 0.9566, inference p50 6.380 ms / p95 7.014 ms with the
# camera's own application running.
recamera_pro_app:
  app_id: waste-sorting
  activation_timeout: 90
  config:
    stream_id: "{{device_name}}"
  # Only applied when a broker address is given. This camera ships no broker, so
  # requiring one would put a broker between the user and a working classifier
  # for no reason: leave it empty and results are readable on the device itself,
  # fill it in and every classification is forwarded as an event.
  config_when:
    - when_present: mqtt_host
      config:
        mqtt_host: "{{mqtt_host}}"
        mqtt_port: "{{mqtt_port}}"
        mqtt_username: "{{mqtt_username}}"
        mqtt_password: "{{mqtt_password}}"
  # Confidence floor and debounce frames are left at the app's defaults (0.50
  # and 3). They are what the accuracy figures above were measured with, and a
  # preset that quietly re-tuned them would invalidate those figures. Both are
  # adjustable afterwards in the app's own panel and apply without a restart.

# The App renders its connection panel from this block, and the panel — not
# user_inputs — supplies host and credentials. The transport is the web
# console's HTTPS, not SSH.
ssh:
  port: 443
  default_user: admin
  connection_timeout: 30

name_i18n:
  zh: reCamera Pro

post_deployment:
  open_browser: false

user_inputs:
  - id: device_name
    name: Device Name
    type: text
    default: "recamera-pro"
    required: true
    description: Goes into every event payload and into the default topic waste/<name>/results, so several cameras on one broker stay separable
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 设备名称
    description_i18n:
      zh: 它会进每一条事件的 payload，也会进默认 topic waste/<名称>/results，同一个 broker 上的多台相机才分得开
  - id: mqtt_host
    name: MQTT Broker Address (optional)
    type: text
    required: false
    placeholder: "192.168.1.50"
    description: Leave empty to read results on the camera itself. Fill it in to forward every classification to Home Assistant, a bin controller or your own consumer — this camera has no broker of its own.
    name_i18n:
      zh: MQTT 服务器地址（可选）
    description_i18n:
      zh: 留空就在相机上看结果；填了才会把每一次分类转发到 Home Assistant、桶体控制器或你自己的消费方——这台相机不自带 broker
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    name_i18n:
      zh: MQTT 端口
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    description: Leave empty if the broker allows anonymous clients
    name_i18n:
      zh: MQTT 用户名
    description_i18n:
      zh: broker 允许匿名连接就留空
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    name_i18n:
      zh: MQTT 密码
