services:
  clip-pt:
    image: ${CLIP_PT_IMAGE:?set CLIP_PT_IMAGE to an approved local build}
    network_mode: host
    depends_on:
      slv-sensevoice: {condition: service_healthy}
      slv-whisper: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
    volumes: ["${CLIP_CONFIG:?set CLIP_CONFIG}:/config/config.yaml:ro", "clip-data:/var/lib/clip-pt"]
    command: ["run", "--config", "/config/config.yaml"]
    restart: unless-stopped
    healthcheck: {test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8631/healthz\")'"], interval: 30s, timeout: 5s, retries: 3}
  slv-sensevoice:
    image: ${SLV_IMAGE:?set SLV_IMAGE to an approved local build}
    privileged: true
    init: true
    network_mode: host
    command: ["python3", "-m", "uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8621"]
    environment:
      OVS_PROFILE_JSON: /opt/speech/configs/profiles/rk3588-sensevoice.json
      RK_ARTIFACT_AUTO_DOWNLOAD: "0"
    volumes:
      - /dev:/dev
      - ./profiles/rk3588-sensevoice.json:/opt/speech/configs/profiles/rk3588-sensevoice.json:ro
      - "${SLV_SENSEVOICE_MODEL_DIR:?set SLV_SENSEVOICE_MODEL_DIR to the approved RK3588 SenseVoice model root}:/opt/asr:ro"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import json,urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8621/readyz\", timeout=5); d=json.load(urllib.request.urlopen(\"http://127.0.0.1:8621/health\", timeout=5)); assert d.get(\"asr\") is True and d.get(\"asr_backend\") == \"sensevoice_rknn\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  slv-whisper:
    image: ${SLV_IMAGE:?set SLV_IMAGE to an approved local build}
    privileged: true
    init: true
    network_mode: host
    command: ["python3", "-m", "uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8622"]
    environment:
      OVS_PROFILE_JSON: /opt/speech/configs/profiles/rk3588-whisper.json
      RK_ARTIFACT_AUTO_DOWNLOAD: "0"
    volumes:
      - /dev:/dev
      - ./profiles/rk3588-whisper.json:/opt/speech/configs/profiles/rk3588-whisper.json:ro
      - "${SLV_WHISPER_MODEL_DIR:?set SLV_WHISPER_MODEL_DIR to the approved RK3588 Whisper model root}:/opt/models:ro"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import json,urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8622/readyz\", timeout=5); d=json.load(urllib.request.urlopen(\"http://127.0.0.1:8622/health\", timeout=5)); assert d.get(\"asr\") is True and d.get(\"asr_backend\") == \"whisper-rknn\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  mosquitto:
    image: ${MQTT_IMAGE:?set MQTT_IMAGE to an approved Mosquitto image}
    network_mode: host
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro", "mqtt-data:/mosquitto/data"]
    restart: unless-stopped
    healthcheck: {test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null 2>&1"], interval: 30s, timeout: 10s, retries: 3, start_period: 10s}
volumes: {clip-data: {}, mqtt-data: {}}
