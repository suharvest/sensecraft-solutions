version: "1.0"
id: jetson_stack
name: Jetson transcription stack
name_i18n: {zh: Jetson 转写栈}
type: docker_deploy
device_class: jetson
docker: {compose_file: assets/docker/jetson.yml, compose_dir: assets/docker, remote_path: /opt/clip-private-transcription, options: {project_name: clip_pt_jetson, remove_orphans: false}, services: [{name: clip-pt, port: 8631, health_check_endpoint: /healthz, required: true}, {name: slv-sensevoice, port: 8621, health_check_endpoint: /health, required: true}, {name: slv-whisper, port: 8622, health_check_endpoint: /health, required: true}, {name: mosquitto, port: 1883, required: true}], environment: {CLIP_PT_IMAGE: "{{clip_pt_image}}", SLV_IMAGE: "{{slv_image}}", CLIP_CONFIG: "{{config_path}}", ASR_MODEL_DIR: "/opt/clip-private-transcription/models/models", MQTT_IMAGE: "{{mqtt_image}}"}}
ssh: {port: 22, default_user: recomputer, auth_methods: [password], connection_timeout: 30, command_timeout: 3600}
pre_checks: [{type: disk_space, min_gb: 15, description: Models and local transcripts require at least 15 GB free.}, {type: nvidia_runtime, description: NVIDIA container runtime is required for the voice stack.}]
files:
  # clip-orin-nx-r1: 1775453326 bytes, published 2026-10-08 (14 files: SenseVoice TRT, Whisper base TRT plans,
  # CAM++ plan; built for Jetson Orin NX / TensorRT 10.3). after_upload unpacks it into models/.
  - url: https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/clip-orin-nx-r1-fd3ec0762602.tar.gz
    remote_path: /opt/clip-private-transcription/models/clip-orin-nx-r1-fd3ec0762602.tar.gz
    sudo: true
    checksum:
      sha256: fd3ec0762602822084e30a2f7f24901b42669d0411dac12d264a4ca783b282d1
actions:
  after_upload:
    - name: Fetch and unpack the ASR model bundle
      name_i18n: {zh: 获取并解包 ASR 模型包}
      sudo: true
      timeout: 3600
      run: |
        set -eu
        D="/opt/clip-private-transcription/models"
        BUNDLE="clip-orin-nx-r1-fd3ec0762602.tar.gz"
        BUNDLE_SHA="fd3ec0762602822084e30a2f7f24901b42669d0411dac12d264a4ca783b282d1"
        URL="https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/clip-orin-nx-r1-fd3ec0762602.tar.gz"
        mkdir -p "$D"
        if [ -f "$D/models/SHA256SUMS.ok" ]; then
          echo "ASR model bundle already unpacked"
        else
          if ! echo "$BUNDLE_SHA  $D/$BUNDLE" | sha256sum -c - >/dev/null 2>&1; then
            # files: 字段在 after_upload 之前放好 bundle；本地部署与不认 files: 的老引擎走这里的下载兜底。
            curl -fSL --retry 3 -o "$D/$BUNDLE.part" "$URL"
            echo "$BUNDLE_SHA  $D/$BUNDLE.part" | sha256sum -c -
            mv -f "$D/$BUNDLE.part" "$D/$BUNDLE"
          fi
          tar -xzf "$D/$BUNDLE" --no-same-owner -C "$D"
          (cd "$D" && sha256sum -c SHA256SUMS)
          chmod -R a+rX "$D/models"
          touch "$D/models/SHA256SUMS.ok"
        fi
  before:
    - name: Check the Jetson module and JetPack match the prebuilt plans
      name_i18n: {zh: 检查 Jetson 模组与 JetPack 是否匹配预编译计划文件}
      ignore_error: false
      run: |
        set -eu
        # The prebuilt TensorRT plans only load on the module/JetPack they were built on.
        want="p3767-0000 p3767-0001"
        compat=$(tr '\0' ' ' </proc/device-tree/compatible 2>/dev/null || true)
        rel=$(head -1 /etc/nv_tegra_release 2>/dev/null || true)
        trt=$(dpkg-query -W -f='${Version}' libnvinfer10 2>/dev/null || true)
        echo "module:   ${compat:-unknown}"
        echo "L4T:      ${rel:-unknown}"
        echo "TensorRT: ${trt:-not found}"
        ok=0
        for m in $want; do
          case " $compat " in *" nvidia,$m "*) ok=1 ;; esac
        done
        if [ "$ok" -ne 1 ]; then
          echo "UNSUPPORTED_JETSON_MODULE: the TensorRT plans in this package were built on Jetson Orin NX (P3767-0000 / P3767-0001); this board reports '${compat:-unknown}'. Use that module." >&2
          exit 1
        fi
        case "$rel" in
          "# R36 (release), REVISION: 4."*) ;;
          *) echo "UNSUPPORTED_JETPACK: the plans were built on L4T R36.4 (JetPack 6.2); this board reports '${rel:-unknown}'." >&2; exit 1 ;;
        esac
        case "$trt" in
          10.3.*) ;;
          *) echo "UNSUPPORTED_TENSORRT: the plans were built with TensorRT 10.3; this board has '${trt:-none}'." >&2; exit 1 ;;
        esac
        echo "Jetson module and JetPack match the prebuilt plans"
    - name: Check Jetson TensorRT host ABI
      name_i18n: {zh: 检查 Jetson TensorRT 主机 ABI}
      sudo: true
      ignore_error: false
      run: |
        set -eu
        for path in \
          /usr/lib/python3.10/dist-packages/tensorrt \
          /usr/lib/python3.10/dist-packages/tensorrt/__init__.py \
          /usr/src/tensorrt \
          /usr/local/cuda/lib64 \
          /usr/lib/aarch64-linux-gnu/nvidia \
          /lib/aarch64-linux-gnu; do
          if [ ! -e "$path" ]; then
            echo "JETSON_TRT_ABI_MISSING: $path" >&2
            exit 1
          fi
        done
        PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
        import sys
        if sys.version_info[:2] != (3, 10):
            print("JETSON_TRT_ABI_PYTHON_MISMATCH: expected Python 3.10, got %s.%s" % sys.version_info[:2], file=sys.stderr)
            raise SystemExit(1)
        try:
            import tensorrt as trt
        except Exception as exc:
            print("JETSON_TRT_ABI_IMPORT_FAILED: %s" % exc, file=sys.stderr)
            raise SystemExit(1)
        version = getattr(trt, "__version__", "")
        if version != "10.3.0":
            print("JETSON_TRT_ABI_VERSION_MISMATCH: expected 10.3.0, got %s" % version, file=sys.stderr)
            raise SystemExit(1)
        print("JETSON_TRT_ABI_OK: python=%s.%s tensorrt=%s" % (sys.version_info[0], sys.version_info[1], version))
        PY
        LD_CONFIG=/sbin/ldconfig
        if [ ! -x "$LD_CONFIG" ]; then LD_CONFIG=/usr/sbin/ldconfig; fi
        if [ ! -x "$LD_CONFIG" ] || ! "$LD_CONFIG" -p | grep -Eq 'libnvinfer\.so\.10'; then
          echo "JETSON_TRT_ABI_MISSING: ldconfig libnvinfer.so.10" >&2
          exit 1
        fi
        if ! "$LD_CONFIG" -p | grep -Eq 'libcudart\.so\.12'; then
          echo "JETSON_TRT_ABI_MISSING: ldconfig libcudart.so.12" >&2
          exit 1
        fi
user_inputs:
  - {id: clip_pt_image, name: clip-pt image, name_i18n: {zh: clip-pt 镜像}, type: text, required: false, default: "sensecraft-missionpack.seeed.cn/solution/clip-private-transcription:20261008@sha256:77a47dac9e6df4c4dd32d10b30feb61e5281b8ebacecb152673e414f763feb71", description: Published clip-pt image pinned by digest (2026-10-08)., description_i18n: {zh: 已发布的 clip-pt 镜像（2026-10-08，按 digest 固定）。}}
  - {id: slv_image, name: SLV image, name_i18n: {zh: SLV 镜像}, type: text, required: false, default: "sensecraft-missionpack.seeed.cn/solution/nrd6-ovs-jetson:20261008@sha256:a3cfde5820119108f27eb7bde018bc096ba66fc0118b837592b3bd5437bf1111", description: Published OVS runtime image nrd6-ovs-jetson pinned by digest (2026-10-08)., description_i18n: {zh: 已发布的 OVS 运行镜像 nrd6-ovs-jetson（2026-10-08，按 digest 固定）。}}
  - {id: config_path, name: clip-pt config path, name_i18n: {zh: clip-pt 配置路径}, type: text, required: true}
  - {id: mqtt_image, name: Mosquitto image, name_i18n: {zh: Mosquitto 镜像}, type: text, required: true, description: Approved Mosquitto image compatible with Jetson., description_i18n: {zh: 与 Jetson 兼容的获准 Mosquitto 镜像。}}
remote_overrides: {environment: {CLIP_PT_IMAGE: "{{clip_pt_image}}", SLV_IMAGE: "{{slv_image}}", CLIP_CONFIG: "{{config_path}}", ASR_MODEL_DIR: "/opt/clip-private-transcription/models/models", MQTT_IMAGE: "{{mqtt_image}}"}}
