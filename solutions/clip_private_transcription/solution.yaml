# Maintainer notes (not shown to users).
#
# Supported hardware: Jetson Orin NX (P3767-0000 / -0001) on L4T R36.4 / JetPack 6.2 /
# TensorRT 10.3 only; the published clip-orin-nx-r1 TensorRT plans load on nothing
# else and devices/jetson_stack.yaml stops the deploy on any other module.
#
# RK3576 target restored 2026-10-09 (devices/rk3576_stack.yaml, assets/docker/rk3576.yml):
# published openvoicestream:rk-20261009 image (by digest) + model bundle
# clip-rk3576-r1-77ab462087fa (published 2026-10-09, see the files: comment there). SenseVoice
# RKNN with one NPU worker handles every language (no Whisper: SenseVoice + Whisper do
# not fit next to other services on an 8 GB board, and clip-pt only routed to Whisper when
# SenseVoice reported a language, which this image does not). Speaker separation runs
# CAM++ on the CPU (pipeline.require_gpu_diarization: false). The VAD fix (silero v5 on 512-sample windows with
# 64-sample context; the older images used 256-sample windows without context, which
# missed quieter speech and dropped utterances in /diarize) ships in the 20261009 speech
# images, rebuilt from Seeed-Solution/openvoicestream 49dabb85 (PR #119); no file is
# mounted over the image. Verified on cat-remote (RK3576) and orin-nx (Jetson) with the
# six fixtures (en, ja, four zh two-speaker mixes); evidence in
# /tmp/claude-1000/-home-harvest-project-seeed-solutions-hub/04bdce95-7bdd-4d03-960e-19fa79225a80/scratchpad/{rk-results-merged.txt,jetson-e2e.txt}.
# Earlier checks with the mounted vad.py kept all utterances and split speakers on the
# zh mixes; SenseVoice peak 1.25 GiB, clip-pt 68 MiB.
#
# The Clip config is rendered on the host from deploy inputs by the
# "Write the Clip configuration" after_upload action in devices/jetson_stack.yaml and
# devices/rk3576_stack.yaml;
# assets/config/config.example.yaml documents the schema only.
#
# Device acceptance 2026-10-09 on Orin NX (receipts vadfix-orin-nx): HTTP-upload path,
# published nrd6-ovs-jetson 20261009 image, clip-pt schemafix-r3,
# summary off, ports 8641/8642/18883, the six RK3576 fixtures. Wall time per upload:
# en 6.3 s 1.24 s (2 utterances, 2 speakers; the earlier first-sentence drop is gone),
# ja 34 s 1.71 s (both sentences kept, 1 speaker reported for the 2-speaker clip),
# zh AISHELL A/B/A 16.5 s 1.17 s (A/B/A split), zh FLEURS A 30.5 s 1.17 s, B 26.1 s
# 1.21 s, C 22.3 s 0.66 s (2 speakers each, split matches the source). Known issue:
# FLEURS A's first utterance (1.63-9.27 s) is kept as a segment but SenseVoice TRT with
# language=auto returns only 9 characters for it; the same audio with language=zh returns
# the full sentence, so this is the ASR auto-language path, not VAD. clip-pt 20261009
# (suharvest/clip-private-transcription e73a8ba) applies the configured language to
# uploads too (previously uploads always ran auto); Orin NX 2026-10-09: FLEURS A upload
# with language=zh and with the Clip language set to zh both return the full first
# sentence, auto is unchanged (receipts acceptance-20261008/clip-lang-orin-nx). Not yet tested: the
# Clip BLE / Wi-Fi hop (no physical Clip was available) and the packaged deploy path end
# to end.
version: "1.0"
id: clip_private_transcription
name: Private Clip Transcription
name_i18n: {zh: Clip 本地私有转写}
enabled: true
intro:
  visibility: staging
  summary: Sync reSpeaker Clip recordings to your own reComputer (Jetson Orin NX or RK3576) and get speaker-labelled transcripts without uploading anything to the cloud.
  summary_i18n: {zh: 把 reSpeaker Clip 的录音同步到你自己的 reComputer（Jetson Orin NX 或 RK3576）上转写，分出说话人，录音不上传云端。}
  description_file: description.md
  description_file_i18n: {zh: description_zh.md}
  cover_image: gallery/cover-20261008.jpg
  gallery:
    - type: image
      src: gallery/panel-transcript-list-zh-20261008.jpg
      caption: "Transcript list on the results page, reComputer J40 (Jetson Orin NX): three two-speaker Chinese recordings of 22 s, 16 s and 26 s, transcribed in 0.7 s, 1.2 s and 1.7 s respectively. Audio from FLEURS (CC BY 4.0) and AISHELL-1 (Apache 2.0)"
      caption_i18n:
        zh: "结果页的转写列表，reComputer J40（Jetson Orin NX）：三段双人中文录音，时长 22 秒、16 秒、26 秒，转写分别用时 0.7 秒、1.2 秒、1.7 秒。音频来自 FLEURS（CC BY 4.0）与 AISHELL-1（Apache 2.0）"
        ja: "結果ページの文字起こし一覧、reComputer J40（Jetson Orin NX）：話者 2 人の中国語録音 3 本（22 秒・16 秒・26 秒）、文字起こし時間はそれぞれ 0.7 秒・1.2 秒・1.7 秒。音声は FLEURS（CC BY 4.0）と AISHELL-1（Apache 2.0）"
    - type: image
      src: gallery/panel-transcript-detail-zh-20261008.jpg
      caption: "Transcript detail, reComputer J40 (Jetson Orin NX): a 16 s Chinese recording with three turns, labelled S1 / S2 / S1 with timestamps and transcribed in 1.2 s; summaries were off. One extra character in the first line (面). Audio: AISHELL-1 (Apache 2.0) and the SenseVoice zh example clip (FunASR model licence)"
      caption_i18n:
        zh: "转写详情，reComputer J40（Jetson Orin NX）：16 秒、三轮对话的中文录音，按 S1 / S2 / S1 分开并带时间戳，转写用时 1.2 秒；本次未开启摘要。第一句多识别出一个「面」字。音频：AISHELL-1（Apache 2.0）与 SenseVoice 中文示例音频（FunASR 模型许可）"
        ja: "文字起こしの詳細、reComputer J40（Jetson Orin NX）：16 秒・3 発話の中国語録音を S1 / S2 / S1 に分け、タイムスタンプ付きで 1.2 秒で文字起こし。要約はオフ。1 行目に余分な 1 文字（面）あり。音声：AISHELL-1（Apache 2.0）と SenseVoice 中国語サンプル音声（FunASR モデルライセンス）"
  category: acoustic_audio_ai
  solution_type: solution
  tags: [respeaker-clip, private-deployment, speech-to-text, speaker-diarization, mqtt, offline]
  output_interfaces:
    - type: http
      port: 8631
      endpoint: /healthz
      method: GET
      schema_type: json
      description: Results page and HTTP API; /healthz reports whether the service is ready.
      description_i18n: {zh: 结果页和 HTTP 接口；/healthz 返回服务是否就绪。}
    - type: mqtt
      port: 1883
      topic: clip-pt/<host-id>/transcript/<transcript-id>/ready
      schema_type: json
      description: Message published on the host when a transcript is ready.
      description_i18n: {zh: 转写完成时在主机上发布的通知消息。}
  input_requirements:
    - type: bluetooth
      description: The host reaches the Clip over Bluetooth; the Clip must not be bound to the phone app at the same time.
      description_i18n: {zh: 主机通过蓝牙连接 Clip；Clip 不能同时绑定手机 App。}
    - type: wifi
      description: "Optional faster Wi-Fi sync: the host joins the Clip's own hotspot. When the host is on Ethernet its built-in Wi-Fi is used; when the host uses Wi-Fi for its network, add a USB Wi-Fi adapter."
      description_i18n: {zh: "Wi-Fi 加速同步为可选功能：主机会连上 Clip 自己开的热点。主机用网线上网时用自带 Wi-Fi 即可；主机靠 Wi-Fi 上网时，再加一个 USB 无线网卡。"}
  device_catalog:
    respeaker_clip:
      description: Wearable recorder; inform the people being recorded.
      description_i18n: {zh: 佩戴式录音设备；录音前请告知被录音的人。}
    recomputer_j40:
      description: Syncs recordings from the Clip, transcribes them and serves the results page. Jetson Orin NX with JetPack 6.2; choose the wireless module (Wi-Fi + Bluetooth).
      description_i18n: {zh: 从 Clip 同步录音、转写并提供结果页。需 Jetson Orin NX 与 JetPack 6.2；选购时加无线网卡模块（Wi-Fi + 蓝牙）。}
    recomputer_rk3576:
      description: Syncs recordings from the Clip, transcribes them and serves the results page. 8 GB RAM version; needs Bluetooth.
      description_i18n: {zh: 从 Clip 同步录音、转写并提供结果页。选 8 GB 内存版本；需要蓝牙。}
      purchase:
        require:
          ram_gb: [8]
    generic_usb_wifi_adapter:
      name: USB Wi-Fi adapter
      name_i18n: {zh: USB 无线网卡}
      description: Only needed for faster Wi-Fi sync when the host uses its built-in Wi-Fi for its network.
      description_i18n: {zh: 只在主机用自带 Wi-Fi 上网、又要开启 Wi-Fi 加速同步时需要。}
  presets:
    - id: clip_edge_box
      name: Clip + reComputer
      name_i18n:
        zh: Clip + reComputer
        ja: Clip + reComputer
      description: Recordings sync from the Clip to a reComputer J40 (Jetson Orin NX) or reComputer RK3576 over Bluetooth and are transcribed there, split by speaker. Optional faster sync over Wi-Fi and optional AI summaries.
      description_i18n:
        zh: 录音经蓝牙从 Clip 同步到 reComputer J40（Jetson Orin NX）或 reComputer RK3576，在主机上转写并分出说话人。可选 Wi-Fi 加速同步和 AI 摘要。
        ja: 録音は Bluetooth で Clip から reComputer J40（Jetson Orin NX）または reComputer RK3576 に同期され、そこで話者ごとに文字起こしされます。Wi-Fi による高速同期と AI 要約はオプションです。
      device_groups:
        - {id: host, name: Host, name_i18n: {zh: 主机}, type: single, required: true, description: Jetson Orin NX with JetPack 6.2, or RK3576 with 8 GB RAM; Bluetooth is required., description_i18n: {zh: Jetson Orin NX（JetPack 6.2）或 RK3576（8 GB 内存）；需要蓝牙。}, options: [{device_ref: recomputer_j40}, {device_ref: recomputer_rk3576}], default: recomputer_j40}
        - {id: recorder, name: Clip, name_i18n: {zh: Clip}, type: single, required: true, options: [{device_ref: respeaker_clip}], default: respeaker_clip}
        - {id: wireless, name: Wi-Fi adapter (optional), name_i18n: {zh: USB 无线网卡（可选）}, type: single, required: false, description: Only for faster Wi-Fi sync when the host uses its built-in Wi-Fi for its network. Bluetooth sync works without it., description_i18n: {zh: 只在主机用自带 Wi-Fi 上网、又要开启 Wi-Fi 加速同步时需要。不加也能经蓝牙同步。}, options: [{device_ref: generic_usb_wifi_adapter}], default: generic_usb_wifi_adapter}
  stats: {difficulty: advanced, estimated_time: 90min}
  links: {}
deployment:
  guide_file: guide.md
  guide_file_i18n: {zh: guide_zh.md}
  selection_mode: sequential
