# Maintainer notes (not shown to users).
#
# Supported hardware: Jetson Orin NX (P3767-0000 / -0001) on L4T R36.4 / JetPack 6.2 /
# TensorRT 10.3 only; the published clip-orin-nx-r1 TensorRT plans load on nothing
# else and devices/jetson_stack.yaml stops the deploy on any other module.
#
# RK3576 / RK3588 targets were removed 2026-10-08: they needed RK speech-service
# images and RKNN model roots that are not published, and ran without GPU
# diarization (pipeline.require_gpu_diarization: false). Their compose files,
# device YAMLs and profiles are in git history before this change.
#
# The Clip config is rendered on the host from deploy inputs by the
# "Write the Clip configuration" after_upload action in devices/jetson_stack.yaml;
# assets/config/config.example.yaml documents the schema only.
#
# Device acceptance as of 2026-10-08 (receipts orin-nx/round2): the HTTP-upload
# path passed on Orin NX with the published clip-pt 20261008 and nrd6-ovs-jetson
# 20261008 images (summary off, ports 8641/8642/18883): 6.3 s LibriSpeech upload
# done in 1.2 s, 34 s two-speaker FLEURS Japanese upload done in 2.2 s with 2
# speakers. Known issue: on the English sample only the second sentence was
# transcribed (diarization dropped the first). Not yet tested: the Clip BLE /
# Wi-Fi hop (no physical Clip was available) and the packaged deploy path end to end.
version: "1.0"
id: clip_private_transcription
name: Private Clip Transcription
name_i18n: {zh: Clip 本地私有转写}
enabled: true
intro:
  visibility: staging
  summary: Sync reSpeaker Clip recordings to your own reComputer Jetson and get speaker-labelled transcripts without uploading anything to the cloud.
  summary_i18n: {zh: 把 reSpeaker Clip 的录音同步到你自己的 reComputer Jetson 上转写，分出说话人，录音不上传云端。}
  description_file: description.md
  description_file_i18n: {zh: description_zh.md}
  cover_image: gallery/cover-20261008.jpg
  gallery:
    - type: image
      src: gallery/panel-transcript-list-20261008.jpg
      caption: "Transcript list on the local results page: each recording with its duration, speaker count and whether it has a summary"
      caption_i18n:
        zh: "本地结果页的转写列表：每段录音显示时长、说话人数和是否有摘要"
        ja: "ローカル結果ページの文字起こし一覧：録音ごとの長さ・話者数・要約の有無"
    - type: image
      src: gallery/panel-transcript-detail-ja-20261008.jpg
      caption: "A 34 s two-speaker Japanese recording transcribed on Jetson Orin NX: timestamped segments, speaker labels and an AI summary"
      caption_i18n:
        zh: "Jetson Orin NX 转写的 34 秒两人日语录音：带时间戳和说话人标签的分段，以及 AI 摘要"
        ja: "Jetson Orin NX で文字起こしした 34 秒・2 人の日本語録音：タイムスタンプと話者ラベル付きの区間、AI 要約"
  category: acoustic_audio_ai
  solution_type: solution
  tags: [respeaker-clip, private-deployment, speech-to-text, speaker-diarization, mqtt, offline]
  output_interfaces:
    - type: http
      port: 8631
      endpoint: /healthz
      method: GET
      schema_type: json
      description: Results page and HTTP API; /healthz reports whether the service is ready.
      description_i18n: {zh: 结果页和 HTTP 接口；/healthz 返回服务是否就绪。}
    - type: mqtt
      port: 1883
      topic: clip-pt/<host-id>/transcript/<transcript-id>/ready
      schema_type: json
      description: Message published on the host when a transcript is ready.
      description_i18n: {zh: 转写完成时在主机上发布的通知消息。}
  input_requirements:
    - type: bluetooth
      description: The host reaches the Clip over Bluetooth; the Clip must not be bound to the phone app at the same time.
      description_i18n: {zh: 主机通过蓝牙连接 Clip；Clip 不能同时绑定手机 App。}
    - type: wifi
      description: "Optional faster Wi-Fi sync: the host joins the Clip's own hotspot. When the host is on Ethernet its built-in Wi-Fi is used; when the host uses Wi-Fi for its network, add a USB Wi-Fi adapter."
      description_i18n: {zh: "Wi-Fi 加速同步为可选功能：主机会连上 Clip 自己开的热点。主机用网线上网时用自带 Wi-Fi 即可；主机靠 Wi-Fi 上网时，再加一个 USB 无线网卡。"}
  device_catalog:
    respeaker_clip:
      description: Wearable recorder; inform the people being recorded.
      description_i18n: {zh: 佩戴式录音设备；录音前请告知被录音的人。}
    recomputer_j40:
      description: Syncs recordings from the Clip, transcribes them and serves the results page. Jetson Orin NX with JetPack 6.2; choose the wireless module (Wi-Fi + Bluetooth).
      description_i18n: {zh: 从 Clip 同步录音、转写并提供结果页。需 Jetson Orin NX 与 JetPack 6.2；选购时加无线网卡模块（Wi-Fi + 蓝牙）。}
    generic_usb_wifi_adapter:
      name: USB Wi-Fi adapter
      name_i18n: {zh: USB 无线网卡}
      description: Only needed for faster Wi-Fi sync when the host uses its built-in Wi-Fi for its network.
      description_i18n: {zh: 只在主机用自带 Wi-Fi 上网、又要开启 Wi-Fi 加速同步时需要。}
  presets:
    - id: clip_edge_box
      name: Clip + reComputer Jetson
      name_i18n:
        zh: Clip + reComputer Jetson
        ja: Clip + reComputer Jetson
      description: Recordings sync from the Clip to a reComputer J40 (Jetson Orin NX) over Bluetooth and are transcribed there, split by speaker. Optional faster sync over Wi-Fi and optional AI summaries.
      description_i18n:
        zh: 录音经蓝牙从 Clip 同步到 reComputer J40（Jetson Orin NX），在主机上转写并分出说话人。可选 Wi-Fi 加速同步和 AI 摘要。
        ja: 録音は Bluetooth で Clip から reComputer J40（Jetson Orin NX）に同期され、そこで話者ごとに文字起こしされます。Wi-Fi による高速同期と AI 要約はオプションです。
      device_groups:
        - {id: host, name: Host, name_i18n: {zh: 主机}, type: single, required: true, description: Jetson Orin NX with JetPack 6.2 and Bluetooth., description_i18n: {zh: Jetson Orin NX，JetPack 6.2，带蓝牙。}, options: [{device_ref: recomputer_j40}], default: recomputer_j40}
        - {id: recorder, name: Clip, name_i18n: {zh: Clip}, type: single, required: true, options: [{device_ref: respeaker_clip}], default: respeaker_clip}
        - {id: wireless, name: Wi-Fi adapter (optional), name_i18n: {zh: USB 无线网卡（可选）}, type: single, required: false, description: Only for faster Wi-Fi sync when the host uses its built-in Wi-Fi for its network. Bluetooth sync works without it., description_i18n: {zh: 只在主机用自带 Wi-Fi 上网、又要开启 Wi-Fi 加速同步时需要。不加也能经蓝牙同步。}, options: [{device_ref: generic_usb_wifi_adapter}], default: generic_usb_wifi_adapter}
  stats: {difficulty: advanced, estimated_time: 90min}
  links: {}
deployment:
  guide_file: guide.md
  guide_file_i18n: {zh: guide_zh.md}
  selection_mode: sequential
