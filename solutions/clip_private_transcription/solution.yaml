# DRAFT / disabled: Clip/BLE, host, offline, and licensed ASR/diarization
# acceptance remain incomplete; the full software and hardware package is not verified.
#
# Presets: the former rk3576_ble / rk3588_wifi / jetson_wifi presets differed
# only by host and an optional Wi-Fi adapter (BLE sync is always on; Wi-Fi is
# the sync.wifi_enabled config flag), so they are merged into clip_edge_box
# with one deploy target per host. Per-target status lives in the guides.
#
# 2026-10-08 device acceptance: no target verified.
# - Jetson target (Orin NX): clip-pt image sha256:bbb11d88 (and 4e43d2cf) fails
#   every job at transcript schema validation, so nothing is persisted. The fix
#   belongs to the clip-pt app repo, not this package: transcript.schema.json
#   must accept models.diarization.{embedding_backend, embedding_device,
#   embedding_fallback, required_gpu} and upload session ids
#   (^([0-9]{14}|upload-[0-9a-f]{8})$); a failed transcript GET returns 500
#   instead of 404. Re-run the HTTP-upload E2E once a rebuilt image exists.
# - RK3576 target (cat-remote) / RK3588 target (radxa): not started; the 15 GB disk
#   pre-check cannot be met on either board, and SLV RK model roots are absent
#   on cat-remote. RK presets run without GPU diarization
#   (pipeline.require_gpu_diarization: false), per the guide.
# - No physical Clip / BLE / Wi-Fi hop was available on any device.
# - Later rounds (receipts orin-nx/round2, radxa/round3, cat-remote/round2):
#   with a rebuilt clip-pt image carrying the schema fix, the HTTP-upload path
#   passed on Orin NX and on RK3588 (run directly with Compose); RK3576 did
#   not fit SenseVoice + Whisper in free RAM. Still no `verified:`: the
#   packaged path and the Clip hop are untested.
version: "1.0"
id: clip_private_transcription
name: Private Clip Transcription
name_i18n: {zh: Clip 本地私有转写}
enabled: false
intro:
  visibility: staging
  summary: Synchronize reSpeaker Clip recordings to a local host and expose private transcription results through HTTP and MQTT.
  summary_i18n: {zh: 将 reSpeaker Clip 录音同步到本地主机，并通过 HTTP 与 MQTT 提供私有转写结果。}
  description_file: description.md
  description_file_i18n: {zh: description_zh.md}
  category: acoustic_audio_ai
  solution_type: solution
  tags: [respeaker-clip, private-deployment, speech-to-text, speaker-diarization, sensevoice, whisper, mqtt, offline]
  output_interfaces:
    - type: http
      port: 8631
      endpoint: /healthz
      method: GET
      schema_type: json
      description: clip-pt health and local API.
      description_i18n: {zh: clip-pt 健康与本地 API。}
    - type: mqtt
      port: 1883
      topic: clip-pt/<host-id>/transcript/<transcript-id>/ready
      schema_type: json
      description: Transcript ready event from the local broker.
      description_i18n: {zh: 本地 broker 发布的转写完成事件。}
  input_requirements:
    - type: bluetooth
      description: Clip must be paired to the host and not concurrently bound to a phone app.
      description_i18n: {zh: Clip 必须配对到主机，不能同时绑定手机 App。}
    - type: wifi
      description: Optional Wi-Fi sync requires a dedicated host adapter.
      description_i18n: {zh: Wi-Fi 同步为可选功能，需要专用主机无线网卡。}
  device_catalog:
    respeaker_clip:
      name: reSpeaker Clip
      name_i18n: {zh: reSpeaker Clip}
      description: Wearable recorder; physical pairing and consent are required.
      description_i18n: {zh: 可穿戴录音设备，需要真机配对和同意书。}
    recomputer_rk3576:
      name: reComputer RK3576
      name_i18n: {zh: reComputer RK3576}
      description: Host for the SenseVoice/Whisper stack.
      description_i18n: {zh: 运行 SenseVoice/Whisper 栈的主机。}
      purchase: {require: {ram_gb: [8]}}
    recomputer_rk3588:
      name: reComputer RK3588
      name_i18n: {zh: reComputer RK3588}
      description: Host for the SenseVoice/Whisper stack.
      description_i18n: {zh: 运行 SenseVoice/Whisper 栈的主机。}
    recomputer_j40:
      name: reComputer J4012
      name_i18n: {zh: reComputer J4012}
      description: Jetson host for the Orin ASR stack.
      description_i18n: {zh: 运行 Orin ASR 栈的 Jetson 主机。}
    usb_wifi_adapter:
      name: Dedicated USB Wi-Fi adapter
      name_i18n: {zh: 专用 USB Wi-Fi 网卡}
      description: Optional adapter reserved for Clip Wi-Fi sync.
      description_i18n: {zh: 为 Clip Wi-Fi 同步保留的可选网卡。}
  presets:
    - id: clip_edge_box
      name: Clip + Edge Compute Box (Draft)
      name_i18n:
        zh: Clip + 边缘算力盒子（草稿）
        ja: Clip + エッジコンピューティングボックス（ドラフト）
      badge: Draft / acceptance incomplete
      badge_i18n: {zh: 草稿 / 验收未完成}
      description: Pick a Jetson, RK3588 or RK3576 host in the deploy step. Requires a local clip-pt artifact and approved SLV images; Clip syncs over BLE, Wi-Fi sync needs a dedicated adapter. No target has passed physical acceptance.
      description_i18n:
        zh: 在部署步骤里选择 Jetson、RK3588 或 RK3576 主机。需要本地 clip-pt artifact 和获准的 SLV 镜像；Clip 经 BLE 同步，Wi-Fi 同步需要专用网卡。尚无部署目标通过真机验收。
        ja: デプロイ手順で Jetson、RK3588、RK3576 からホストを選択します。ローカルの clip-pt アーティファクトと承認済み SLV イメージが必要です。Clip は BLE で同期し、Wi-Fi 同期には専用アダプターが必要です。実機受け入れに合格したターゲットはまだありません。
      device_groups:
        - {id: host, name: Host, name_i18n: {zh: 主机}, type: single, required: true, description: Choose the edge host. The deploy step offers one target per host., description_i18n: {zh: 选择边缘主机。部署步骤为每种主机提供一个部署目标。}, options: [{device_ref: recomputer_j40}, {device_ref: recomputer_rk3588}, {device_ref: recomputer_rk3576}], default: recomputer_j40}
        - {id: recorder, name: Clip, name_i18n: {zh: Clip}, type: single, required: true, options: [{device_ref: respeaker_clip}], default: respeaker_clip}
        - {id: wireless, name: Wi-Fi adapter (optional), name_i18n: {zh: Wi-Fi 网卡（可选）}, type: single, required: false, description: Only for Clip Wi-Fi sync; BLE sync works without it (set sync.wifi_enabled to false)., description_i18n: {zh: 仅用于 Clip Wi-Fi 同步；不加时 BLE 同步照常工作（将 sync.wifi_enabled 设为 false）。}, options: [{device_ref: usb_wifi_adapter}], default: usb_wifi_adapter}
  stats: {difficulty: advanced, estimated_time: 90min}
  links: {}
deployment:
  guide_file: guide.md
  guide_file_i18n: {zh: guide_zh.md}
  selection_mode: sequential
