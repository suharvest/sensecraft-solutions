# Single-box form on a Raspberry Pi 5 with a Hailo-8 / 8L: broker, hub and the
# Hailo detector all on the same board. Inference on the Hailo accelerator,
# video decode on the CPU.
#
# Measured on a Pi 5 + Hailo-8 at 1280x720 H.264: in-pipeline inference p50
# 9.7 ms / p95 10.8 ms, full pipeline p50 17.4 ms, 8.7-13.0% of one CPU core,
# RSS 127-131 MB, while ten unrelated containers shared the board.
#
# Decode is software and that is the primary path, not a fallback. The Pi 5 has
# no H.264 decoder — VideoCore VII decodes HEVC only — so the detector reports
# decode "sw" with fallback_active false, and the CPU figure above buys decode
# as well as inference. Budget for that before adding a second camera.
#
# One host-supplied piece is staged next to this file by the deploy step rather
# than baked into the image, because it must match the board's PCIe driver:
#   hailosite/ - hailo_platform, unpacked from the board's HailoRT wheel
#
# The accelerator takes one process at a time. HailoRT hands out a VDevice
# exclusively unless every participant goes through its multi-process service,
# so anything else already using /dev/hailo0 has to be stopped first. The
# deploy step's before-check tests this by opening a VDevice, which is the only
# way to find out: `hailortcli fw-control identify` opens a control handle
# instead and succeeds against a device that is fully occupied.
services:
  hub:
    image: sensecraft-missionpack.seeed.cn/solution/edge-security-hub:0.1.0
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data:/data
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      # Empty on purpose: the hub then generates a random password, writes it to
      # /data/initial-password.txt (line 1 username, line 2 password) and logs
      # it, with must_change=1. Set it to skip that.
      HUB_ADMIN_PASSWORD: ${HUB_ADMIN_PASSWORD:-}
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # Also published on the board's LAN address, so extra detectors can be
    # pointed at this board later without changing this file.
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto-data:/mosquitto/data

  detector:
    # Pinned by digest, not by tag. The deploy step skips the pull entirely
    # when an image of the same NAME already exists on the board, so a mutable
    # tag that has been republished never reaches a board that pulled it once
    # -- a board kept running a known-broken build through two deploys that
    # both reported success. A digest reference cannot go stale that way.
    image: sensecraft-missionpack.seeed.cn/solution/edge-security-detector-hailo@sha256:57e2d3af5a5322cc87cf3cc817dccf655838d8b84234870ae40f5d97284c6e38
    command: ["--config", "/app/config/detector.yaml"]
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8099:8099"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /hailosite:/app
      LD_LIBRARY_PATH: /hailolib:/usr/lib
    devices:
      # The accelerator. Nothing else is needed: decode is on the CPU, so there
      # is no video device, no DRM node and no dma-heap in this list.
      - /dev/hailo0:/dev/hailo0
    volumes:
      - ./config/detector.yaml:/app/config/detector.yaml:ro
      - ./hailosite:/hailosite:ro
      # The user-space HailoRT library must be the board's own copy, matching
      # the PCIe driver. It is staged into a directory by the deploy step and
      # mounted as one, rather than bind-mounting /usr/lib/libhailort.so.<ver>
      # by name: naming the version here would pin the compose file to 4.21.0,
      # and on a board carrying any other version Docker would silently create
      # an empty DIRECTORY at that path, leaving the unversioned symlink
      # pointing at a directory. LD_LIBRARY_PATH puts the staged copy first.
      - ./hailolib:/hailolib:ro
