version: "1.0"
id: rk3588_detector
name: RK3588 Detector
name_i18n:
  zh: RK3588 检测器
type: docker_deploy

docker:
  compose_file: assets/rk3588/docker-compose.yml
  compose_dir: assets/rk3588
  options:
    project_name: edge_security_rk3588
    remove_orphans: true
  services:
    - name: detector
      port: 8099
      required: true

ssh:
  port: 22
  default_user: radxa
  auth_methods:
    - password
  connection_timeout: 30
  command_timeout: 1800

pre_checks:
  - type: disk_space
    min_gb: 4
    description: Detector image and the staged board libraries live on the board

post_deployment:
  open_browser: false

remote_overrides:
  remote_path: /home/{{username}}/edge-security-rk3588
  compose_dir: assets/rk3588
  detection:
    method: network_scan
    manual_entry: true

  actions:
    before:
      - name: Validate the RKNN and MPP runtime
        name_i18n:
          zh: 校验 RKNN 与 MPP 运行环境
        run: |
          set -e
          if [ ! -e /dev/dri ]; then
            echo "No /dev/dri — this does not look like a Rockchip board with an NPU" >&2
            exit 1
          fi
          if [ ! -f /usr/lib/librknnrt.so ]; then
            echo "librknnrt.so not found. Install the board's rknpu2 runtime package first." >&2
            exit 1
          fi
          # The filename lies about the version: on radxa /usr/lib/librknnrt.so
          # is a symlink to librknnrt.so.2.3.0 while the version compiled into
          # the binary is 2.3.2. The shipped model is built for 2.3.2.
          strings /usr/lib/librknnrt.so 2>/dev/null | grep -m1 "librknnrt version" || true
          if [ ! -e /dev/mpp_service ]; then
            echo "/dev/mpp_service missing — the hardware decoder is not available." >&2
            echo "The detector refuses to start on CPU decode, so fix this first." >&2
            exit 1
          fi
          # rknn_toolkit_lite2 ships as a wheel and often lands in ~/.local or a
          # venv. If python3 cannot import it there is nothing to stage into the
          # container and the detector crash-loops, so this is a hard failure.
          python3 - <<'PY'
          import importlib.util, os, sys
          spec = importlib.util.find_spec("rknnlite")
          if spec is None or not spec.origin:
              sys.stderr.write("rknnlite (rknn_toolkit_lite2) is not importable by python3 on this board.\n")
              sys.stderr.write("Install it first, e.g.: pip3 install rknn_toolkit_lite2\n")
              sys.exit(1)
          print("rknnlite site-packages:", os.path.dirname(os.path.dirname(spec.origin)))
          PY
          echo "RKNN + MPP runtime OK"

      - name: Ensure docker compose command
        name_i18n:
          zh: 确保 docker compose 可用
        sudo: true
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin present"
            exit 0
          fi
          if docker-compose --version >/dev/null 2>&1; then
            for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins /root/.docker/cli-plugins; do
              mkdir -p "$d"
              ln -sf "$(command -v docker-compose)" "$d/docker-compose"
            done
            echo "linked standalone docker-compose into the cli-plugins path"
            exit 0
          fi
          apt-get update
          apt-get install -y docker-compose-plugin || apt-get install -y docker-compose-v2 || apt-get install -y docker-compose
          docker compose version

    after_upload:
      - name: Stage the board's RKNN Lite packages
        name_i18n:
          zh: 准备板卡的 RKNN Lite 依赖
        run: |
          set -e
          WORKDIR="/home/{{username}}/edge-security-rk3588/rk3588_detector"
          DEST="$WORKDIR/rknnsite"
          SITE=$(python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.find_spec("rknnlite")
          print(os.path.dirname(os.path.dirname(spec.origin)))
          PY
          )
          echo "rknnlite found in: $SITE"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          # Copy ONLY the RKNN packages. Putting the whole site-packages on
          # PYTHONPATH takes precedence over the image's own packages, and the
          # board's Debian numpy then shadows the image's and fails on a libblas
          # the image does not ship.
          cp -a "$SITE/rknnlite" "$DEST/"
          for pkg in ruamel ruamel.yaml psutil; do
            [ -e "$SITE/$pkg" ] && cp -a "$SITE/$pkg" "$DEST/" || true
          done
          ls -1 "$DEST"

      - name: Stage the board's GStreamer MPP plugin
        name_i18n:
          zh: 准备板卡的 GStreamer MPP 插件
        run: |
          set -e
          WORKDIR="/home/{{username}}/edge-security-rk3588/rk3588_detector"
          DEST="$WORKDIR/gstmpp"
          rm -rf "$DEST"; mkdir -p "$DEST"
          # Copied rather than bind-mounted per file: a board without these
          # would otherwise get empty directories created by Docker at the
          # mount points. h264parse lives in gstreamer1.0-plugins-bad, which the
          # runtime image does not carry; without it the MPP branch cannot link.
          for f in $(find /usr/lib -name 'libgstrockchipmpp.so' 2>/dev/null | head -1) \
                   $(find /usr/lib -name 'libgstvideoparsersbad.so' 2>/dev/null | head -1) \
                   $(find /usr/lib /lib -name 'libgstcodecparsers-1.0.so.*' 2>/dev/null) \
                   $(find /usr/lib /lib -name 'librockchip_mpp.so.*' 2>/dev/null) \
                   $(find /usr/lib /lib -name 'librga.so.*' 2>/dev/null); do
            [ -e "$f" ] && cp -aL "$f" "$DEST/" || true
          done
          ls -1 "$DEST" || true

      - name: Write the camera, hub and detector configuration
        name_i18n:
          zh: 写入摄像头、hub 与检测器配置
        run: |
          set -e
          WORKDIR="/home/{{username}}/edge-security-rk3588/rk3588_detector"
          mkdir -p "$WORKDIR/config"
          # int8 by default: 41.9 ms in-pipeline inference against fp16's
          # 72.3 ms, NPU load 8% against 26%, for 0.52 AP@.5:.95 on COCO person.
          cat > "$WORKDIR/config/detector.yaml" <<CFG
          device_id: {{device_id}}
          stream_id: {{stream_id}}
          source: {{rtsp_url}}
          rtsp_transport: tcp
          rtsp_codec: h264
          rtsp_latency_ms: 100
          decode_primary: hw
          require_hw_decode: true
          model: /app/models/yolov8n_zoo_int8.rk3588.rknn
          input_size: 640
          conf_threshold: 0.35
          iou_threshold: 0.45
          npu_core_mask: null
          track_iou_threshold: 0.2
          track_max_lost_s: 0.75
          mqtt_host: {{hub_host}}
          mqtt_port: 1883
          topic_prefix: sensecraft/security
          status_interval_s: 30
          preview_enabled: true
          preview_bind: 0.0.0.0
          preview_port: 8099
          preview_advertise_host: "{{host}}"
          CFG
          cat "$WORKDIR/config/detector.yaml"

    after:
      - name: Confirm the decoder actually running
        name_i18n:
          zh: 确认实际使用的解码器
        ignore_error: true
        timeout: 180
        run: |
          # The detector describes its own live pipeline here — the element
          # GStreamer really instantiated, not what the config asked for.
          echo "Waiting for the detector preview endpoint ..."
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8099/debug/decode" 2>/dev/null; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "No answer on 8099 — check: docker compose logs detector" >&2

  user_inputs:
    - id: host
      name: Board IP
      name_i18n:
        zh: 板卡 IP
      type: text
      required: true
      placeholder: "192.168.1.100"
      description: Also written into the detector config as the preview address the workbench uses
      description_i18n:
        zh: 同时写入检测器配置，作为工作台访问预览画面的地址
    - id: username
      name: SSH Username
      name_i18n:
        zh: SSH 用户名
      type: text
      default: radxa
      required: true
      description: "Depends on the board image — commonly radxa, cat, linaro or ubuntu."
      description_i18n:
        zh: "取决于板卡系统镜像，常见的是 radxa、cat、linaro 或 ubuntu。"
    - id: password
      name: SSH Password
      name_i18n:
        zh: SSH 密码
      type: password
      required: true
    - id: hub_host
      name: Hub IP
      name_i18n:
        zh: Hub IP
      type: text
      required: true
      placeholder: "192.168.1.50"
      description: The machine running the hub and its broker. Deploy the Hub Only preset there first.
      description_i18n:
        zh: 运行 hub 与其 broker 的那台机器。先在那台机器上部署「仅 Hub」套餐。
    - id: device_id
      name: Detector Name
      name_i18n:
        zh: 检测器名称
      type: text
      default: "rk3588-01"
      required: true
      description: Second segment of the MQTT topic and the name shown in the workbench device list
      description_i18n:
        zh: MQTT 主题的第二段，也是工作台设备列表里显示的名字
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
    - id: stream_id
      name: Stream ID
      name_i18n:
        zh: 流编号
      type: text
      default: "cam-0"
      required: true
      description: Appended to the topic so several cameras on one board stay separable
      description_i18n:
        zh: 拼在主题后面，用于区分同一板卡上的多路摄像头
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
    - id: rtsp_url
      name: Camera RTSP URL
      name_i18n:
        zh: 摄像头 RTSP 地址
      type: text
      required: true
      placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
      description: H.264 only on this board — the hardware decoder path is built for H.264
      description_i18n:
        zh: 该板卡仅支持 H.264——硬解路径按 H.264 构建
