version: "1.0"
id: rk3588_detector
name: RK3588 Security Stack
name_i18n:
  zh: RK3588 安防服务栈
type: docker_deploy

docker:
  compose_file: assets/rk3588/docker-compose.yml
  compose_dir: assets/rk3588
  options:
    project_name: edge_security_rk3588
    remove_orphans: true
  services:
    - name: mosquitto
      port: 1883
      required: true
    - name: hub
      port: 8090
      required: true
    - name: detector
      port: 8099
      required: true

ssh:
  port: 22
  default_user: radxa
  auth_methods:
    - password
  connection_timeout: 30
  command_timeout: 1800

pre_checks:
  - type: disk_space
    min_gb: 6
    description: Detector image, hub image, the staged board libraries and the alert database all live on the board

post_deployment:
  open_browser: false

remote_overrides:
  remote_path: /home/{{username}}/edge-security-rk3588
  compose_dir: assets/rk3588
  detection:
    method: network_scan
    manual_entry: true

  actions:
    before:
      - name: Validate the RKNN and MPP runtime
        name_i18n:
          zh: 校验 RKNN 与 MPP 运行环境
        run: |
          set -e
          if [ ! -e /dev/dri ]; then
            echo "No /dev/dri — this does not look like a Rockchip board with an NPU" >&2
            exit 1
          fi
          if [ ! -f /usr/lib/librknnrt.so ]; then
            echo "librknnrt.so not found. Install the board's rknpu2 runtime package first." >&2
            exit 1
          fi
          # The filename lies about the version: on radxa /usr/lib/librknnrt.so
          # is a symlink to librknnrt.so.2.3.0 while the version compiled into
          # the binary is 2.3.2. The shipped model is built for 2.3.2.
          strings /usr/lib/librknnrt.so 2>/dev/null | grep -m1 "librknnrt version" || true
          if [ ! -e /dev/mpp_service ]; then
            echo "/dev/mpp_service missing — the hardware decoder is not available." >&2
            echo "The detector refuses to start on CPU decode, so fix this first." >&2
            exit 1
          fi
          # rknn_toolkit_lite2 ships as a wheel and often lands in ~/.local or a
          # venv. If python3 cannot import it there is nothing to stage into the
          # container and the detector crash-loops, so this is a hard failure.
          python3 - <<'PY'
          import importlib.util, os, sys
          spec = importlib.util.find_spec("rknnlite")
          if spec is None or not spec.origin:
              sys.stderr.write("rknnlite (rknn_toolkit_lite2) is not importable by python3 on this board.\n")
              sys.stderr.write("Install it first, e.g.: pip3 install rknn_toolkit_lite2\n")
              sys.exit(1)
          print("rknnlite site-packages:", os.path.dirname(os.path.dirname(spec.origin)))
          PY
          echo "RKNN + MPP runtime OK"

      - name: Check ports 8090 and 1883 are free
        name_i18n:
          zh: 检查 8090 与 1883 端口是否空闲
        ignore_error: true
        run: |
          # The broker and the hub run on this same board, so both ports must
          # be free here — there is no separate aggregation machine.
          # A redeploy sees its own containers holding the ports, so only complain
          # about a listener that is not part of this stack.
          mine=$(docker ps --filter "label=com.docker.compose.project=edge_security_rk3588" -q 2>/dev/null | wc -l)
          for p in 8090 1883; do
            if command -v ss >/dev/null 2>&1 && ss -ltn "sport = :$p" | grep -q LISTEN; then
              if [ "$mine" -gt 0 ]; then
                echo "Port $p is held by this stack's own containers; redeploy will replace them."
              else
                echo "Port $p is already in use. Stop the other service or the stack will fail to start." >&2
              fi
            fi
          done
          echo "port check done"

      - name: Ensure docker compose command
        name_i18n:
          zh: 确保 docker compose 可用
        sudo: true
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin present"
            exit 0
          fi
          if docker-compose --version >/dev/null 2>&1; then
            for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins /root/.docker/cli-plugins; do
              mkdir -p "$d"
              ln -sf "$(command -v docker-compose)" "$d/docker-compose"
            done
            echo "linked standalone docker-compose into the cli-plugins path"
            exit 0
          fi
          apt-get update
          apt-get install -y docker-compose-plugin || apt-get install -y docker-compose-v2 || apt-get install -y docker-compose
          docker compose version

    after_upload:
      - name: Stage the board's RKNN Lite packages
        name_i18n:
          zh: 准备板卡的 RKNN Lite 依赖
        run: |
          set -e
          WORKDIR="/home/{{username}}/edge-security-rk3588/rk3588_detector"
          DEST="$WORKDIR/rknnsite"
          SITE=$(python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.find_spec("rknnlite")
          print(os.path.dirname(os.path.dirname(spec.origin)))
          PY
          )
          echo "rknnlite found in: $SITE"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          # Copy ONLY the RKNN packages. Putting the whole site-packages on
          # PYTHONPATH takes precedence over the image's own packages, and the
          # board's Debian numpy then shadows the image's and fails on a libblas
          # the image does not ship.
          cp -a "$SITE/rknnlite" "$DEST/"
          for pkg in ruamel ruamel.yaml psutil; do
            [ -e "$SITE/$pkg" ] && cp -a "$SITE/$pkg" "$DEST/" || true
          done
          ls -1 "$DEST"

      - name: Stage the board's GStreamer MPP plugin
        name_i18n:
          zh: 准备板卡的 GStreamer MPP 插件
        run: |
          set -e
          WORKDIR="/home/{{username}}/edge-security-rk3588/rk3588_detector"
          DEST="$WORKDIR/gstmpp"
          rm -rf "$DEST"; mkdir -p "$DEST"
          # Copied rather than bind-mounted per file: a board without these
          # would otherwise get empty directories created by Docker at the
          # mount points. h264parse lives in gstreamer1.0-plugins-bad, which the
          # runtime image does not carry; without it the MPP branch cannot link.
          for f in $(find /usr/lib -name 'libgstrockchipmpp.so' 2>/dev/null | head -1) \
                   $(find /usr/lib -name 'libgstvideoparsersbad.so' 2>/dev/null | head -1) \
                   $(find /usr/lib /lib -name 'libgstcodecparsers-1.0.so.*' 2>/dev/null) \
                   $(find /usr/lib /lib -name 'librockchip_mpp.so.*' 2>/dev/null) \
                   $(find /usr/lib /lib -name 'librga.so.*' 2>/dev/null); do
            [ -e "$f" ] && cp -aL "$f" "$DEST/" || true
          done
          ls -1 "$DEST" || true

      - name: Write the camera and detector configuration
        name_i18n:
          zh: 写入摄像头与检测器配置
        run: |
          set -e
          WORKDIR="/home/{{username}}/edge-security-rk3588/rk3588_detector"
          # data/ holds the alert database, the snapshots and the rule
          # configuration for the hub that runs on this same board.
          mkdir -p "$WORKDIR/config" "$WORKDIR/data" "$WORKDIR/mosquitto-data"
          # int8 by default: 41.9 ms in-pipeline inference against fp16's
          # 72.3 ms, NPU load 8% against 26%, for 0.52 AP@.5:.95 on COCO person.
          # Quoted delimiter: the {{...}} placeholders are substituted by the
          # engine before this script runs, so nothing here needs shell
          # expansion -- and an unquoted heredoc would evaluate $(...) or a
          # backtick that arrived inside a camera URL or username.
          cat > "$WORKDIR/config/detector.yaml" <<'CFG'
          device_id: {{device_id}}
          stream_id: {{stream_id}}
          source: {{rtsp_url}}
          rtsp_transport: tcp
          rtsp_codec: h264
          rtsp_latency_ms: 100
          decode_primary: hw
          require_hw_decode: true
          model: /app/models/yolov8n_zoo_int8.rk3588.rknn
          input_size: 640
          conf_threshold: 0.35
          iou_threshold: 0.45
          npu_core_mask: null
          track_iou_threshold: 0.2
          track_max_lost_s: 0.75
          mqtt_host: mosquitto
          mqtt_port: 1883
          topic_prefix: sensecraft/security
          status_interval_s: 30
          preview_enabled: true
          preview_bind: 0.0.0.0
          preview_port: 8099
          preview_advertise_host: "{{host}}"
          CFG
          # Printed with the source line masked: an RTSP URL normally carries
          # the camera's user and password, and deploy output is kept.
          sed 's#^source: .*#source: <rtsp url, hidden>#' "$WORKDIR/config/detector.yaml"

    after:
      - name: Wait for the hub to answer
        name_i18n:
          zh: 等待 hub 响应
        ignore_error: true
        timeout: 180
        run: |
          echo "Waiting for the hub API ..."
          # Deadline-driven rather than a fixed iteration count: without
          # --max-time a stalled connection makes each pass take as long as
          # curl's own default, and the loop then overruns the step timeout and
          # is killed mid-way instead of reporting anything useful.
          deadline=$(( $(date +%s) + 150 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -fsS --max-time 4 "http://127.0.0.1:8090/api/health" >/dev/null 2>&1; then
              curl -sS --max-time 4 "http://127.0.0.1:8090/api/health"
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Hub did not answer on 8090 — check: docker compose logs hub" >&2

      - name: Report the admin credential
        name_i18n:
          zh: 输出管理员登录信息
        ignore_error: true
        timeout: 60
        run: |
          # On a first boot with no HUB_ADMIN_PASSWORD the hub creates
          # a random password, writes it to /data/initial-password.txt and logs it.
          docker exec edge_security_rk3588-hub-1 cat /data/initial-password.txt 2>/dev/null || docker logs edge_security_rk3588-hub-1 2>&1 | grep -iE "password" | tail -3 || true

      - name: Confirm the detector reached the accelerator
        name_i18n:
          zh: 确认检测器已用上加速器
        # Deliberately NOT ignore_error. Three things are asserted because the
        # obvious ones lie: `docker ps` reports healthy while a detector
        # crash-loops, since /healthz answers as soon as the preview server
        # binds; and the decoder being negotiated says nothing about whether
        # inference works. A container that decodes correctly and fails on
        # every frame is a real failure mode -- it is how a broken image got
        # through two deployments that both reported success.
        timeout: 360
        run: |
          # /debug/decode names the element GStreamer actually instantiated,
          # /preview.jpg only answers 200 once a frame has been decoded AND run
          # through the model, and the restart count is what a crash-loop looks
          # like from outside. Polled to a deadline rather than judged on the
          # first reply: both endpoints answer before the pipeline has
          # negotiated, so failing early would reject a deployment that was
          # merely still starting.
          echo "Waiting for the detector to report its decoder ..."
          last=""
          deadline=$(( $(date +%s) + 200 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -fsS --max-time 4 "http://127.0.0.1:8099/debug/decode" 2>/dev/null) || { sleep 5; continue; }
            last="$body"
            case "$body" in
              *'"mppvideodec"'*)
                echo "$body"
                echo "decode confirmed on the Rockchip hardware decoder"
                break
                ;;
            esac
            sleep 5
          done
          case "$last" in
            *'"mppvideodec"'*) ;;
            "")
              echo "No answer on 8099 — check: docker compose logs detector" >&2
              exit 1
              ;;
            *)
              echo "$last" >&2
              echo "The detector is answering but never reported the Rockchip hardware decoder." >&2
              echo "This preset requires it; check the device mounts in the compose file." >&2
              exit 1
              ;;
          esac

          echo "Waiting for the detector to produce a frame ..."
          ok=0
          deadline=$(( $(date +%s) + 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -s --max-time 4 -o /tmp/esk-prev.jpg -w '%{http_code}' "http://127.0.0.1:8099/preview.jpg" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              # Magic bytes, not just a 200: the guide promises a decodable
              # JPEG, and an endpoint that answered with an error page or a
              # truncated body would otherwise pass as proof of a frame.
              magic=$(head -c 3 /tmp/esk-prev.jpg 2>/dev/null | od -An -tx1 | tr -d ' \n')
              if [ "$magic" = "ffd8ff" ]; then
                echo "preview.jpg: HTTP 200, JPEG, $(wc -c < /tmp/esk-prev.jpg) bytes"
                ok=1
                break
              fi
              echo "preview.jpg answered 200 but the body is not a JPEG (magic $magic)" >&2
            fi
            sleep 5
          done
          # Sampled twice rather than required to be zero. The detector opens
          # its MQTT connection synchronously at startup and exits if the
          # broker is not accepting yet; compose's depends_on waits for the
          # container to exist, not for mosquitto to be ready, so one early
          # restart is normal on a slow board. A crash-loop keeps incrementing;
          # a startup race settles. Requiring zero would fail working
          # deployments.
          r1=$(docker inspect -f '{{.RestartCount}}' edge_security_rk3588-detector-1 2>/dev/null || echo "?")
          sleep 20
          r2=$(docker inspect -f '{{.RestartCount}}' edge_security_rk3588-detector-1 2>/dev/null || echo "?")
          echo "detector restart count: $r1 -> $r2"
          rm -f /tmp/esk-prev.jpg
          if [ "$ok" = "1" ] && [ "$r1" = "$r2" ] && [ "$r1" != "?" ]; then
            echo "detector is decoding and inferring"
            exit 0
          fi
          echo "The detector negotiated its decoder but is not producing frames." >&2
          echo "A rising restart count with a healthy container means it is" >&2
          echo "crash-looping past the health check. Last lines:" >&2
          docker logs --tail 25 edge_security_rk3588-detector-1 2>&1 | sed 's/^/  /' >&2
          exit 1

  user_inputs:
    - id: host
      name: Board IP
      name_i18n:
        zh: 板卡 IP
      type: text
      required: true
      placeholder: "192.168.1.100"
      description: Where the workbench will be served — http://<this address>:8090 — and also the preview address written into the detector config
      description_i18n:
        zh: 工作台的访问地址（http://该地址:8090），同时写入检测器配置作为预览画面地址
    - id: username
      name: SSH Username
      name_i18n:
        zh: SSH 用户名
      type: text
      default: radxa
      required: true
      description: "Depends on the board image — commonly radxa, cat, linaro or ubuntu."
      description_i18n:
        zh: "取决于板卡系统镜像，常见的是 radxa、cat、linaro 或 ubuntu。"
    - id: password
      name: SSH Password
      name_i18n:
        zh: SSH 密码
      type: password
      required: true
    - id: device_id
      name: Detector Name
      name_i18n:
        zh: 检测器名称
      type: text
      default: "rk3588-01"
      required: true
      description: Second segment of the MQTT topic and the name shown in the workbench device list
      description_i18n:
        zh: MQTT 主题的第二段，也是工作台设备列表里显示的名字
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
    - id: stream_id
      name: Stream ID
      name_i18n:
        zh: 流编号
      type: text
      default: "cam-0"
      required: true
      description: Appended to the topic so several cameras on one board stay separable
      description_i18n:
        zh: 拼在主题后面，用于区分同一板卡上的多路摄像头
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
    - id: rtsp_url
      name: Camera RTSP URL
      name_i18n:
        zh: 摄像头 RTSP 地址
      type: text
      required: true
      placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
      description: H.264 only on this board — the hardware decoder path is built for H.264
      description_i18n:
        zh: 该板卡仅支持 H.264——硬解路径按 H.264 构建
