version: "1.0"
id: jetson_hub_stack
name: Single-Box Security Stack
name_i18n:
  zh: 单机安防栈
type: docker_deploy

docker:
  compose_file: assets/jetson/docker-compose.yml
  compose_dir: assets/jetson
  options:
    project_name: edge_security
    remove_orphans: true
  services:
    - name: mosquitto
      port: 1883
      required: true
    - name: hub
      port: 8090
      required: true
    - name: detector
      port: 8099
      required: true

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password
  connection_timeout: 30
  command_timeout: 1800

pre_checks:
  - type: disk_space
    min_gb: 6
    description: Detector image, hub image, the TensorRT engine built on this device and the alert database all live on this machine

post_deployment:
  open_browser: false

remote_overrides:
  remote_path: /home/{{username}}/edge-security
  compose_dir: assets/jetson
  detection:
    method: network_scan
    manual_entry: true

  actions:
    before:
      - name: Validate the Jetson TensorRT and NVDEC runtime
        name_i18n:
          zh: 校验 Jetson 的 TensorRT 与 NVDEC 运行环境
        run: |
          set -e
          ARCH=$(uname -m)
          echo "arch: $ARCH"
          if [ "$ARCH" != "aarch64" ]; then
            echo "This preset is Jetson-only: the detector runs on TensorRT and NVDEC." >&2
            exit 1
          fi
          if [ ! -f /etc/nv_tegra_release ]; then
            echo "/etc/nv_tegra_release missing - this does not look like a JetPack (L4T) system." >&2
            exit 1
          fi
          head -1 /etc/nv_tegra_release
          # TensorRT. The detector loads the board's libnvinfer and the board's
          # Python bindings; both have to be present and they have to match.
          if [ ! -e /usr/lib/aarch64-linux-gnu/libnvinfer.so.10 ]; then
            echo "libnvinfer.so.10 not found. Install the JetPack TensorRT packages:" >&2
            echo "  sudo apt-get install -y nvidia-tensorrt" >&2
            exit 1
          fi
          if [ ! -d /usr/lib/python3.10/dist-packages/tensorrt ]; then
            echo "The TensorRT Python bindings are missing (python3-libnvinfer)." >&2
            exit 1
          fi
          python3 -c "import sys; sys.path.insert(0,'/usr/lib/python3.10/dist-packages'); import tensorrt; print('tensorrt', tensorrt.__version__)"
          # trtexec builds the engine in the after_upload step. It exits 1 on
          # --version in TensorRT 10.3, so its presence is checked, not its
          # exit code.
          if [ ! -x /usr/src/tensorrt/bin/trtexec ]; then
            echo "/usr/src/tensorrt/bin/trtexec is missing. Install tensorrt-dev / the JetPack samples." >&2
            exit 1
          fi
          echo "trtexec: present"
          # NVDEC. require_hw_decode is on, so the detector refuses to start on
          # the CPU decoder rather than quietly running slow on a box bought
          # for its GPU.
          if [ ! -e /dev/v4l2-nvdec ]; then
            echo "/dev/v4l2-nvdec missing - the hardware decoder is not available." >&2
            exit 1
          fi
          if [ ! -e /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvvideo4linux2.so ]; then
            echo "The L4T GStreamer plugin set is missing (nvidia-l4t-gstreamer)." >&2
            exit 1
          fi
          echo "TensorRT + NVDEC runtime OK"

      - name: Check the nvidia container runtime
        name_i18n:
          zh: 检查 nvidia 容器运行时
        run: |
          set -e
          docker version >/dev/null
          # The compose file asks for `runtime: nvidia`. That runtime is what
          # bind-mounts libcuda, the L4T GStreamer plugins and the decoder
          # device nodes into the container; without it the detector starts and
          # then fails to find nvv4l2decoder.
          if ! docker info 2>/dev/null | grep -q "nvidia"; then
            echo "The nvidia container runtime is not registered with Docker." >&2
            echo "Install it and restart Docker:" >&2
            echo "  sudo apt-get install -y nvidia-container-toolkit" >&2
            echo "  sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker" >&2
            exit 1
          fi
          docker info 2>/dev/null | grep -i "^ Runtimes:"
          for f in /etc/nvidia-container-runtime/host-files-for-container.d/drivers.csv \
                   /etc/nvidia-container-runtime/host-files-for-container.d/devices.csv; do
            [ -f "$f" ] || { echo "Missing $f - the L4T CSV mounts are what inject NVDEC." >&2; exit 1; }
          done
          echo "nvidia container runtime OK"

      - name: Check ports 8090 and 1883 are free
        name_i18n:
          zh: 检查 8090 与 1883 端口是否空闲
        ignore_error: true
        run: |
          # The broker and the hub run on this same machine, so both ports must
          # be free here - there is no separate aggregation host.
          # A redeploy sees its own containers holding the ports, so only complain
          # about a listener that is not part of this stack.
          mine=$(docker ps --filter "label=com.docker.compose.project=edge_security" -q 2>/dev/null | wc -l)
          for p in 8090 1883; do
            if command -v ss >/dev/null 2>&1 && ss -ltn "sport = :$p" | grep -q LISTEN; then
              if [ "$mine" -gt 0 ]; then
                echo "Port $p is held by this stack's own containers; redeploy will replace them."
              else
                echo "Port $p is already in use. Stop the other service or the stack will fail to start." >&2
              fi
            fi
          done
          echo "port check done"

      - name: Ensure docker compose command
        name_i18n:
          zh: 确保 docker compose 可用
        sudo: true
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin present"
            exit 0
          fi
          if docker-compose --version >/dev/null 2>&1; then
            for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins /root/.docker/cli-plugins; do
              mkdir -p "$d"
              ln -sf "$(command -v docker-compose)" "$d/docker-compose"
            done
            echo "linked standalone docker-compose into the cli-plugins path"
            exit 0
          fi
          apt-get update
          apt-get install -y docker-compose-plugin || apt-get install -y docker-compose-v2 || apt-get install -y docker-compose
          docker compose version

    # Runs after the deployer uploads assets/jetson/ to
    # remote_path/<device-yaml-id>/ and before `docker compose up`. Neither of
    # these can move into `before`: the destination directory does not exist on
    # the machine until the upload finishes, and anything written earlier is
    # overwritten.
    after_upload:
      - name: Build the TensorRT engine on this device
        name_i18n:
          zh: 在本机构建 TensorRT 引擎
        timeout: 1500
        run: |
          set -e
          WORKDIR="/home/{{username}}/edge-security/jetson_hub_stack"
          IMAGE=sensecraft-missionpack.seeed.cn/solution/edge-security-detector-jetson:0.1.0
          ENGINE="$WORKDIR/models/yolov8n_fp16.orin.engine"
          mkdir -p "$WORKDIR/models"
          if [ -s "$ENGINE" ]; then
            echo "Engine already present, keeping it: $ENGINE"
            sha256sum "$ENGINE"
            exit 0
          fi
          # A serialized TensorRT engine is valid only for the exact TensorRT
          # version and GPU architecture that built it. Copying one from
          # another machine, or from this one after a JetPack upgrade, makes
          # deserialize_cuda_engine return None with no other diagnostic - so
          # the engine is built here, from the ONNX carried in the image, with
          # the board's own trtexec.
          #
          # This takes about five minutes and only happens once: 307 s measured
          # on an Orin NX 16GB / JetPack 6.1 / TensorRT 10.3.0. A redeploy
          # reuses the engine above.
          docker pull "$IMAGE"
          CID=$(docker create "$IMAGE")
          docker cp "$CID:/app/models/yolov8n.onnx" "$WORKDIR/models/yolov8n.onnx"
          docker cp "$CID:/app/tools/build_engine.sh" "$WORKDIR/models/build_engine.sh"
          docker rm -f "$CID" >/dev/null
          chmod +x "$WORKDIR/models/build_engine.sh"
          echo "Building the engine - this takes about five minutes, do not interrupt it."
          "$WORKDIR/models/build_engine.sh" "$WORKDIR/models/yolov8n.onnx" "$ENGINE"
          test -s "$ENGINE"
          ls -la "$WORKDIR/models"

      - name: Write the camera and detector configuration
        name_i18n:
          zh: 写入摄像头与检测器配置
        run: |
          set -e
          WORKDIR="/home/{{username}}/edge-security/jetson_hub_stack"
          # data/ holds the alert database, the snapshots and the rule
          # configuration for the hub that runs on this same machine.
          mkdir -p "$WORKDIR/config" "$WORKDIR/data" "$WORKDIR/mosquitto-data"
          # preview_advertise_host has to be an address the browser can reach,
          # not the container's own. It is set to the device IP you entered;
          # left unset the detector omits the field and the hub's rule-drawing
          # canvas has no backdrop.
          cat > "$WORKDIR/config/detector.yaml" <<CFG
          device_id: {{device_id}}
          stream_id: {{stream_id}}
          source: {{rtsp_url}}
          rtsp_transport: tcp
          rtsp_codec: h264
          rtsp_latency_ms: 100
          decode_primary: hw
          require_hw_decode: true
          model: /models/yolov8n_fp16.orin.engine
          input_size: 640
          conf_threshold: 0.35
          iou_threshold: 0.45
          track_iou_threshold: 0.2
          track_max_lost_s: 0.75
          mqtt_host: mosquitto
          mqtt_port: 1883
          topic_prefix: sensecraft/security
          status_interval_s: 30
          preview_enabled: true
          preview_bind: 0.0.0.0
          preview_port: 8099
          preview_advertise_host: "{{host}}"
          CFG
          cat "$WORKDIR/config/detector.yaml"

    after:
      - name: Wait for the hub to answer
        name_i18n:
          zh: 等待 hub 响应
        ignore_error: true
        timeout: 180
        run: |
          echo "Waiting for the hub API ..."
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8090/api/health" >/dev/null 2>&1; then
              curl -sS "http://127.0.0.1:8090/api/health"
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Hub did not answer on 8090 — check: docker compose logs hub" >&2

      - name: Report the admin credential
        name_i18n:
          zh: 输出管理员登录信息
        ignore_error: true
        timeout: 60
        run: |
          # On a first boot with no HUB_ADMIN_PASSWORD the hub creates
          # a random password, writes it to /data/initial-password.txt and logs it.
          docker exec edge_security-hub-1 cat /data/initial-password.txt 2>/dev/null || docker logs edge_security-hub-1 2>&1 | grep -iE "password" | tail -3 || true

      - name: Confirm the decoder actually running
        name_i18n:
          zh: 确认实际使用的解码器
        ignore_error: true
        timeout: 180
        run: |
          # The detector describes its own live pipeline here — the element
          # GStreamer really instantiated, not what the config asked for. On
          # this preset it must be nvv4l2decoder; the detector refuses to start
          # on the CPU decoder, so anything else means it is not running.
          echo "Waiting for the detector preview endpoint ..."
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8099/debug/decode" 2>/dev/null; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "No answer on 8099 — check: docker compose logs detector" >&2

  user_inputs:
    - id: host
      name: Device IP
      name_i18n:
        zh: 设备 IP
      type: text
      required: true
      placeholder: "192.168.1.100"
      description: Also written into the detector config as the preview address the workbench uses
      description_i18n:
        zh: 同时写入检测器配置，作为工作台访问预览画面的地址
    - id: username
      name: SSH Username
      name_i18n:
        zh: SSH 用户名
      type: text
      default: recomputer
      required: true
      description: "Common defaults: recomputer (Seeed reComputer J series), nvidia, or ubuntu."
      description_i18n:
        zh: "常见默认值：recomputer（Seeed reComputer J 系列）、nvidia 或 ubuntu。"
    - id: password
      name: SSH Password
      name_i18n:
        zh: SSH 密码
      type: password
      required: true
    - id: device_id
      name: Detector Name
      name_i18n:
        zh: 检测器名称
      type: text
      default: "site-01"
      required: true
      description: Second segment of the MQTT topic and the name shown in the workbench device list
      description_i18n:
        zh: MQTT 主题的第二段，也是工作台设备列表里显示的名字
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
    - id: stream_id
      name: Stream ID
      name_i18n:
        zh: 流编号
      type: text
      default: "cam-0"
      required: true
      description: Appended to the topic so several cameras on one detector stay separable
      description_i18n:
        zh: 拼在主题后面，用于区分同一检测器上的多路摄像头
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
    - id: rtsp_url
      name: Camera RTSP URL
      name_i18n:
        zh: 摄像头 RTSP 地址
      type: text
      required: true
      placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
      description: H.264 only — the NVDEC path is built for H.264. Test the address in VLC first; a wrong path or wrong credentials is the most common failure.
      description_i18n:
        zh: 仅支持 H.264——NVDEC 解码路径按 H.264 构建。先用 VLC 测一下这个地址，路径或用户名密码写错是最常见的失败原因。
