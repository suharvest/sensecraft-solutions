version: "1.0"
id: jetson_hub_dashboard
name: Open the Alert Workbench
name_i18n:
  zh: 打开告警工作台
type: web_dashboard

# The workbench is served by the hub that the deploy step just installed, so
# the host comes from that step rather than from a second question.
inherit_host_from: deploy_edge_security_jetson_hub

web_dashboard:
  url: "http://{{deploy.host}}:8090"
  open_in: browser
  title: Edge Security Workbench
  title_i18n:
    zh: 边缘安防工作台
  description: >-
    The hub generates a random password on first start. The deploy step above
    prints it, but some CLI output modes truncate action output — if you did not
    see it, read it off the device with
    `docker exec edge_security-hub-1 cat /data/initial-password.txt`
    (line 1 username, line 2 password). The hub forces a change on
    first login. The
    Devices page should list your detector as online with decode "hw" — this
    preset decodes on NVDEC, and the detector refuses to start on the CPU
    decoder, so anything else means it is not running. Draw a
    zone or a line on the Rules page and walk into it to see the first alert.
  description_i18n:
    zh: >-
      hub 首次启动会生成随机密码，写入 hub 容器内的 /data/initial-password.txt（第一行
      用户名，第二行密码）。上面的部署步骤会打印出来，但部分 CLI 输出模式会截断动作输出——没看到的话在设备上执行 `docker exec edge_security-hub-1 cat /data/initial-password.txt` 取回。首次登录后 hub 会强制改密。设备页应能看到检测器在线、解码方式为
      hw——本套餐走 NVDEC 硬解，检测器拒绝退回 CPU 解码，显示别的值就说明它没跑起来。在规则页画一个区域或一条线，走进去就能看到第一条告警。
