version: "1.0"
id: edge_security
# Successor to `industrial_security_jetson`. This package now covers the
# TensorRT capability that was the older solution's only remaining advantage,
# measured on an Orin NX 16GB. The older package stays published until this one
# ships; retiring it is a separate release action.
replaces: industrial_security_jetson
name: Industrial Security (Multi-Platform Edge)
name_i18n:
  zh: 工业安防（多平台边缘部署）

intro:
  summary: Restricted-zone, line-crossing and loitering alerts from an RTSP camera, judged on the edge box itself and worked through in a browser. Jetson and RK3588 presets each run the whole stack on one machine.
  summary_i18n:
    zh: 一路 RTSP 摄像头，判出禁区入侵、越线和滞留告警，在浏览器里逐条处理。判定就在边缘盒子上完成，Jetson 与 RK3588 套餐各自一台机器跑完整套。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/cover.jpg
  gallery:
    - type: image
      src: gallery/cover.jpg
      caption: The alert workbench during a live run — zone entry, loitering with dwell time, and line crossings with direction
      caption_i18n:
        zh: 实跑中的告警工作台——区域入侵、带滞留时长的 loitering，以及带方向的越线
    - type: image
      src: gallery/rules-editor.jpg
      caption: Rules are drawn on a real frame pulled from the detector, so a zone lands where you meant it
      caption_i18n:
        zh: 规则画在从检测器取回的真实画面上，区域落点所见即所得
    - type: image
      src: gallery/devices.jpg
      caption: Device page — each detector reports whether it is decoding on hardware or on the CPU
      caption_i18n:
        zh: 设备页——每台检测器都会报告自己是硬解还是 CPU 解码
    - type: image
      src: gallery/architecture-diagram.png
      caption: Detection layer publishes over MQTT, the hub judges the rules and serves the workbench
      caption_i18n:
        zh: 探测层通过 MQTT 上报，hub 判定规则并提供工作台
  category: sensing
  solution_type: solution
  tags:
    - security
    - industrial-security
    - intrusion-detection
    - person-detection
    - mqtt
    - rk3588
    - jetson
    - tensorrt

  output_interfaces:
    - type: http
      port: 8090
      endpoint: /
      description: Alert workbench and its REST API — alert list, disposition, rule editing, CSV export. Cookie session auth on everything except /api/health and the login route.
      schema_type: json
      description_i18n:
        zh: 告警工作台及其 REST 接口——告警列表、处置、规则编辑、CSV 导出。除 /api/health 和登录接口外全部走 cookie 会话鉴权。
    - type: mqtt
      port: 1883
      topic: sensecraft/security/<device_id>/detections/<stream_id>
      description: Per-frame person detections from a detector — boxes normalized against the original frame, each with a track id
      schema_type: json
      payload_example: '{"schema":"sensecraft.detection/1","device_id":"rk3588-01","stream_id":"cam-0","coordinate_space":"frame_norm","objects":[{"track_id":7,"label":"person","score":0.92,"bbox":[0.41,0.55,0.09,0.28]}]}'
      description_i18n:
        zh: 检测器发出的逐帧人体检测——检测框按原始画面归一化，每个目标带跟踪编号
    - type: mqtt
      port: 1883
      topic: sensecraft/security/<device_id>/status
      description: Retained availability and health — online / offline via last will, plus which decoder the detector actually got
      schema_type: json
      description_i18n:
        zh: retained 的在线与健康状态——通过遗嘱消息发 online / offline，并报告实际拿到的解码器
    - type: mqtt
      port: 1883
      topic: sensecraft/security/<device_id>/events/<stream_id>
      description: The hub's own verdicts, republished so an NVR, PLC or alerting system can subscribe instead of polling the API
      schema_type: json
      description_i18n:
        zh: hub 判定后回发的告警事件，NVR、PLC 或其他告警系统可以直接订阅，不必轮询接口

  input_requirements:
    - type: rtsp
      description: A fixed camera view of the area you want to protect. Boundaries are drawn as polygons and lines on that view, so the camera must not move once the rules are set.
      required: true
      description_i18n:
        zh: 一个固定机位，覆盖需要防护的区域。边界是画在这个画面上的多边形和线段，规则设好之后摄像头不能再移动。

  device_catalog:
    recomputer_j30:
      description: Runs broker, hub and the TensorRT detector on one box (Orin Nano 8GB)
      description_i18n:
        zh: 一台机器同时跑 broker、hub 和 TensorRT 检测器（Orin Nano 8GB）
      purchase:
        require:
          module: [orin_nano_8]
    recomputer_j40:
      description: Same single-box role on the module the measurements were taken on (Orin NX 16GB)
      description_i18n:
        zh: 同样的单机角色，实测数据就是在这块模组上取得的（Orin NX 16GB）
      purchase:
        require:
          module: [orin_nx_16]
    recomputer_rk3588:
      description: Runs broker, hub and the NPU detector on one board — inference on the NPU, video decode on the board's hardware decoder
      description_i18n:
        zh: 一块板卡同时跑 broker、hub 和 NPU 检测器——推理走 NPU，视频解码走板载硬解
    generic_arm64_host:
      name: Generic Docker Host
      name_i18n:
        zh: 通用 Docker 主机
      description: Any always-on arm64 or x86_64 machine with Docker. Used only by the optional Shared Hub expansion, where it runs the broker and the hub and carries no detector of its own
      description_i18n:
        zh: 任何常开、装有 Docker 的 arm64 或 x86_64 机器。仅用于可选的「共享 Hub」扩展场景，只跑 broker 和 hub，本机不带检测器
    generic_ip_camera:
      name: IP Camera
      name_i18n:
        zh: IP 摄像头
      description: Any RTSP camera you already own, supplying the video a detector watches
      description_i18n:
        zh: 你已有的任意 RTSP 摄像头，为检测器提供视频

  presets:
    - id: jetson_hub
      name: Jetson Single Box
      name_i18n:
        zh: Jetson 单机部署
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: "One Jetson runs everything — broker, hub and a TensorRT detector for one camera, with video decode on NVDEC. Measured on an Orin NX 16GB at 1280x720: 4.13 ms per inference, 8.5-12.5% of one CPU core."
      description_i18n:
        zh: "一台 Jetson 跑完整套——broker、hub，以及推理走 TensorRT、解码走 NVDEC 的一路摄像头检测器。Orin NX 16GB、1280x720 实测：单次推理 4.13 ms，CPU 占单核 8.5-12.5%。"
      architecture_image: gallery/architecture.svg
      # Jetson-only by construction: the detector loads a TensorRT engine built
      # on the target device and decodes on NVDEC. There is no CPU fallback —
      # require_hw_decode is on, so a non-Jetson host fails the before-checks
      # rather than running slowly.
      #
      # Hardware-verified, containerised deployment included: this preset's own
      # compose file, images and staging steps were deployed on a Jetson Orin NX
      # 16GB (JetPack 6.1, L4T R36.4.3, TensorRT 10.3.0) against a live 1280x720
      # H.264 stream. The engine was built on the device by the deploy step in
      # 361 s. All three services came up healthy with no restarts; the detector
      # decoded through nvv4l2decoder with /dev/v4l2-nvdec and /dev/nvmap open
      # in the container process and NVMM provenance in the negotiated caps, and
      # published inference_time_ms 4.13 at 5 fps. The hub on the same box listed
      # the detector online with decode "hw", stored 32 alerts across zone_enter,
      # line_cross (4 forward, 4 backward) and loitering with a snapshot on every
      # one, and proxied a 16.5 KB JPEG preview.
      verified:
        - hardware
      device_groups:
        - id: compute
          name: Jetson
          name_i18n:
            zh: Jetson 主机
          type: single
          required: true
          options:
            - device_ref: recomputer_j30
            - device_ref: recomputer_j40
          default: recomputer_j40
        - id: camera
          name: IP Camera
          name_i18n:
            zh: IP 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_ip_camera
          default: generic_ip_camera

    - id: rk3588
      name: RK3588 Single Box
      name_i18n:
        zh: RK3588 单机部署
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: One RK3588 board runs everything — broker, hub and a detector with NPU inference and hardware video decode. The hub costs 1.4% of one CPU core, so the board carries it alongside the detector.
      description_i18n:
        zh: 一块 RK3588 板卡跑完整套——broker、hub，以及推理走 NPU、解码走硬解的检测器。hub 只占单核 1.4%，板卡在跑检测的同时完全带得动。
      architecture_image: gallery/architecture.svg
      # Hardware-verified, containerised deployment included: this preset's own
      # compose file, images and staging steps were deployed on a radxa RK3588
      # board (radxa,rock-5t, kernel 6.1.84) against a live 1280x720 H.264
      # stream with the int8 model. All three services came up healthy with no
      # restarts; the detector reached init_runtime on librknnrt 2.3.2 and
      # decoded through mppvideodec, with the container process holding
      # /dev/mpp_service, /dev/rga and CMA dma-heap buffers and running
      # mpp_dec_parser/mpp_dec_hal threads. The hub on the same board listed the
      # detector online with decode "hw", stored zone alerts with snapshots, and
      # proxied a 640x360 JPEG preview.
      verified:
        - hardware
      device_groups:
        - id: compute
          name: Board
          name_i18n:
            zh: 板卡
          type: single
          required: true
          options:
            - device_ref: recomputer_rk3588
          default: recomputer_rk3588
        - id: camera
          name: IP Camera
          name_i18n:
            zh: IP 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_ip_camera
          default: generic_ip_camera

    - id: hub_only
      name: Shared Hub (Optional Expansion)
      name_i18n:
        zh: 共享 Hub（可选扩展）
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: Not the normal path. Use it only when several detector boxes are already running and you want one shared alert list across them — it installs the broker, rule engine and workbench on an always-on machine with no detector of its own.
      description_i18n:
        zh: 不是常规部署路径。仅当你已经有多台检测设备、希望它们共用一份告警列表时才用——它在一台常开机器上装 broker、规则引擎和工作台，本机不带检测器。
      architecture_image: gallery/architecture.svg
      device_groups:
        - id: hub
          name: Aggregation Host
          name_i18n:
            zh: 汇聚主机
          type: single
          required: true
          options:
            - device_ref: generic_arm64_host
          default: generic_arm64_host

  stats:
    difficulty: intermediate
    estimated_time: 20min

deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
