version: '1.0'
id: recamera_ecosystem
name: Plug & Play AI Camera
name_i18n:
  zh: 即插即用 AI 摄像头
intro:
  summary: One AI camera, a gallery of apps — install object detection, text reading, face analysis or people counting from the camera's own console, and forward the results to Home Assistant
  summary_i18n:
    zh: 一台 AI 摄像头，一整套应用——在摄像头自己的控制台里安装目标检测、文字识别、人脸分析或客流统计，并把结果转发到 Home Assistant
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/recamera.svg
  category: automation
  solution_type: solution
  tags:
    - recamera
    - recamera-pro
    - home-assistant
    - mqtt
    - app-gallery
    - yolo
    - ocr
    - face-analysis
    - fall-detection
    - retail-analytics
    - smart-home
    - rtsp
    - onvif
    - privacy

  output_interfaces:
    - type: rtsp
      port: 554
      description: AI-processed camera video stream
      schema_type: binary
      description_i18n:
        zh: AI 处理后的摄像头视频流
    - type: onvif
      port: 8000
      endpoint: /onvif/device_service
      description: ONVIF Device and Media2 services — add the camera to an NVR or VMS by discovery, no manual RTSP URL needed (WS-Discovery answers on UDP 3702). reCamera only.
      schema_type: xml
      description_i18n:
        zh: ONVIF Device 与 Media2 服务——NVR / 监控平台可自动发现并接入，无需手填 RTSP 地址（WS-Discovery 监听 UDP 3702）。仅 reCamera 提供。
    - type: mqtt
      port: 1883
      description: Detection results JSON from the running app
      schema_type: json
      payload_example: '{"type":"detection","objects":[{"class":"person","confidence":0.95}]}'
      description_i18n:
        zh: 当前运行应用发出的检测结果 JSON
    - type: mqtt
      port: 1883
      topic: homeassistant/
      description: Home Assistant discovery configs — the running app's entities appear on their own, and change when you switch apps
      schema_type: json
      description_i18n:
        zh: Home Assistant 自动发现配置——当前应用的实体会自动出现，换应用时也会自动跟着变
  input_requirements: []

  device_catalog:
    recamera_2002:
      description: All-in-one AI camera — runs the app gallery, RTSP, ONVIF and a local MQTT broker on device
      description_i18n:
        zh: 一体化 AI 摄像头——应用画廊、RTSP、ONVIF 和本地 MQTT broker 都在设备上运行
    recamera_pro:
      description: Newer all-in-one AI camera — runs the App Center, where each app carries its own output and MQTT configuration
      description_i18n:
        zh: 更新一代的一体化 AI 摄像头——运行应用中心，每个应用各自带一份输出与 MQTT 配置
    recomputer_r11:
      description: Edge computing device for running Home Assistant and the MQTT broker
      description_i18n:
        zh: 边缘计算设备，运行 Home Assistant 和 MQTT broker

  presets:
    - id: recamera
      name: reCamera
      name_i18n:
        zh: reCamera
      badge: Start Here
      badge_i18n:
        zh: 从这里开始
      description: Update the console, pick an app from the gallery, and forward the results to Home Assistant over MQTT.
      description_i18n:
        zh: 升级控制台、从画廊里挑一个应用，再通过 MQTT 把结果转发到 Home Assistant。
      verified:
        - hardware
      device_groups:
        - id: camera
          name: AI Camera
          name_i18n:
            zh: AI 摄像头
          type: single
          required: true
          options:
            - device_ref: recamera_2002
          default: recamera_2002
        - id: server
          name: Home Assistant Server
          name_i18n:
            zh: Home Assistant 服务器
          type: single
          required: false
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11
      links:
        github: https://github.com/suharvest/sscma-example-sg200x

    - id: recamera_pro
      name: reCamera Pro
      name_i18n:
        zh: reCamera Pro
      badge: New Hardware
      badge_i18n:
        zh: 新硬件
      description: Same flow on the newer camera — update the firmware, pick an app from the App Center, and forward the results to Home Assistant over MQTT.
      description_i18n:
        zh: 新一代摄像头，同样的流程——更新固件、从应用中心挑一个应用，再通过 MQTT 把结果转发到 Home Assistant。
      device_groups:
        - id: camera
          name: AI Camera
          name_i18n:
            zh: AI 摄像头
          type: single
          required: true
          options:
            - device_ref: recamera_pro
          default: recamera_pro
        - id: server
          name: Home Assistant Server
          name_i18n:
            zh: Home Assistant 服务器
          type: single
          required: false
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11
      links:
        github: https://github.com/Seeed-Studio/reCamera-OS

  stats:
    deployed_count: 0
    likes_count: 0
    difficulty: beginner
    estimated_time: 20min
  links:
    github: https://github.com/suharvest/sscma-example-sg200x
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
