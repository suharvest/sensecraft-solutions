version: '1.0'
id: recamera_ecosystem
name: Plug & Play AI Camera
name_i18n:
  zh: 即插即用 AI 摄像头
  ja: プラグ&プレイ AI カメラ
intro:
  summary: One AI camera, a gallery of apps — install object detection, text reading, face analysis or people counting from the camera's own console, and forward the results to Home Assistant
  summary_i18n:
    zh: 一台 AI 摄像头，一整套应用——在摄像头自己的控制台里安装目标检测、文字识别、人脸分析或客流统计，并把结果转发到 Home Assistant
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/recamera.svg
  gallery:
    - type: image
      src: gallery/architecture.png
      src_i18n:
        zh: gallery/architecture_zh.png
      caption: System architecture — apps run on reCamera 2002 or reCamera Pro; detections go over MQTT to Home Assistant on a reComputer R1100 or your computer, and video goes over RTSP (ONVIF on reCamera) to an NVR, VMS or player
      caption_i18n:
        zh: 系统架构——应用跑在 reCamera 2002 或 reCamera Pro 上；检测结果经 MQTT 发到 reComputer R1100 或自有电脑上的 Home Assistant，视频以 RTSP（reCamera 另有 ONVIF）输出给 NVR、VMS 或播放器
  category: vision_video_ai
  solution_type: solution
  tags:
    - recamera
    - recamera-pro
    - home-assistant
    - mqtt
    - app-gallery
    - yolo
    - ocr
    - face-analysis
    - fall-detection
    - retail-analytics
    - smart-home
    - rtsp
    - onvif
    - privacy

  output_interfaces:
    - type: rtsp
      port: 554
      description: AI-processed camera video stream
      schema_type: binary
      description_i18n:
        zh: AI 处理后的摄像头视频流
    - type: onvif
      port: 8000
      endpoint: /onvif/device_service
      description: ONVIF Device and Media2 services — add the camera to an NVR or VMS by discovery, no manual RTSP URL needed (WS-Discovery answers on UDP 3702). reCamera only.
      schema_type: xml
      description_i18n:
        zh: ONVIF Device 与 Media2 服务——NVR / 监控平台可自动发现并接入，无需手填 RTSP 地址（WS-Discovery 监听 UDP 3702）。仅 reCamera 提供。
    - type: mqtt
      port: 1883
      description: Detection results JSON from the running app
      schema_type: json
      payload_example: '{"type":"detection","objects":[{"class":"person","confidence":0.95}]}'
      description_i18n:
        zh: 当前运行应用发出的检测结果 JSON
    - type: mqtt
      port: 1883
      topic: homeassistant/
      description: Home Assistant discovery configs — the running app's entities appear on their own, and change when you switch apps
      schema_type: json
      description_i18n:
        zh: Home Assistant 自动发现配置——当前应用的实体会自动出现，换应用时也会自动跟着变
  input_requirements: []

  device_catalog:
    recamera_2002:
      description: All-in-one AI camera; app gallery, RTSP, ONVIF, local MQTT broker
      description_i18n:
        zh: 一体化摄像头，含画廊、RTSP、ONVIF、MQTT
    recamera_pro:
      description: Newer all-in-one camera; runs App Center apps with own MQTT config
      description_i18n:
        zh: 更新一代一体机，运行应用中心，各应用自带 MQTT 配置
    recomputer_r11:
      description: Edge computer running Home Assistant and the MQTT broker
      description_i18n:
        zh: 边缘设备，运行 HA 和 MQTT broker

  presets:
    - id: object_detection
      name: Object Detection & Environment
      name_i18n:
        zh: 目标检测与环境感知
        ja: 物体検出と環境認識
      badge: Start Here
      badge_i18n:
        zh: 新手入门
        ja: 入門推奨
      description: The visual "Hello World". Runs YOLO (COCO 80 classes) or weather classification with real-time bounding boxes and confidence scores.
      description_i18n:
        zh: 边缘视觉的“Hello World”。运行 YOLO 检测常见 80 类物体或天气分类，实时画框并输出置信度，适合初次体验端侧推理。
        ja: エッジビジョンの「Hello World」。80 クラスの YOLO 物体検出や天候分類を実行し、リアルタイムにバウンディングボックスを描画します。
      verified:
        - hardware
      device_groups:
        - id: camera
          name: AI Camera
          name_i18n:
            zh: AI 摄像头
            ja: AI カメラ
          type: single
          required: true
          options:
            - device_ref: recamera_2002
              label: reCamera (SG2002)
              label_i18n:
                zh: reCamera (SG2002)
            - device_ref: recamera_pro
              label: reCamera Pro (RV1126B)
              label_i18n:
                zh: reCamera Pro (RV1126B)
          default: recamera_2002
        - id: server
          name: Home Assistant Server
          name_i18n:
            zh: Home Assistant 服务器
            ja: Home Assistant サーバー
          type: single
          required: false
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11
      links:
        github: https://github.com/suharvest/sscma-example-sg200x

    - id: human_behavior
      name: Human Behavior & Pose
      name_i18n:
        zh: 人体姿态与行为分析
        ja: 人体姿勢と行動分析
      badge: Interactive & Privacy
      badge_i18n:
        zh: 交互与隐私
        ja: インタラクティブ・プライバシー
      description: Landmark tracking and temporal actions — face analysis with on-device blur, drowsiness monitoring (468 points), fitness rep counting, and fall detection.
      description_i18n:
        zh: 拓扑关键点与时序动作识别——人脸属性与端侧隐私打码、468 点人脸困倦监测、健身动作计数与跌倒报警，体验端侧隐私闭环。
        ja: 特徴点追跡と時系列行動認識——オンデバイス顔ぼかし、468 点の眠気検知、フィットネス回数カウント、転倒検知を体験できます。
      verified:
        - hardware
      device_groups:
        - id: camera
          name: AI Camera
          name_i18n:
            zh: AI 摄像头
            ja: AI カメラ
          type: single
          required: true
          options:
            - device_ref: recamera_2002
              label: reCamera (SG2002)
              label_i18n:
                zh: reCamera (SG2002)
            - device_ref: recamera_pro
              label: reCamera Pro (RV1126B)
              label_i18n:
                zh: reCamera Pro (RV1126B)
          default: recamera_2002
        - id: server
          name: Home Assistant Server
          name_i18n:
            zh: Home Assistant 服务器
            ja: Home Assistant サーバー
          type: single
          required: false
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11
      links:
        github: https://github.com/suharvest/sscma-example-sg200x

    - id: text_reading
      name: Text & Code Reading
      name_i18n:
        zh: 文字与符号识别
        ja: テキストとコード認識
      badge: Industrial OCR
      badge_i18n:
        zh: 轻工识读
        ja: 産業向け OCR
      description: Two-stage detection + recognition pipeline. Extracts Chinese & English characters via PP-OCR and decodes dense QR/barcodes on the fly.
      description_i18n:
        zh: 两阶段视觉流水线。通过 PP-OCR 实时识别包装、标签和屏幕上的中英文字符，或一次性解析画面的所有二维码。
        ja: 2段階の検出＋認識パイプライン。PP-OCR による中英テキスト読み取りや複数 QR コードの一括認識を行います。
      verified:
        - hardware
      device_groups:
        - id: camera
          name: AI Camera
          name_i18n:
            zh: AI 摄像头
            ja: AI カメラ
          type: single
          required: true
          options:
            - device_ref: recamera_2002
              label: reCamera (SG2002)
              label_i18n:
                zh: reCamera (SG2002)
            - device_ref: recamera_pro
              label: reCamera Pro (RV1126B)
              label_i18n:
                zh: reCamera Pro (RV1126B)
          default: recamera_2002
        - id: server
          name: Home Assistant Server
          name_i18n:
            zh: Home Assistant 服务器
            ja: Home Assistant サーバー
          type: single
          required: false
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11
      links:
        github: https://github.com/suharvest/sscma-example-sg200x

    - id: spatial_retail
      name: Spatial Vision & Retail Flow
      name_i18n:
        zh: 空间感知与客流分析
        ja: 空間認識と動線分析
      badge: Advanced Commercial
      badge_i18n:
        zh: 进阶商业
        ja: 応用商業
      description: 2D-to-3D monocular depth estimation (FastDepth) and multi-target tracking with virtual tripwire trip counts and dwell times.
      description_i18n:
        zh: 单目 3D 深度图感知（近红远蓝）与多目标追踪（ByteTrack），实现进出绊线客流统计与停留时长分析。
        ja: 単眼 3D 深度推定（赤=近、青=遠）と、トラッキング＋仮想トリップワイヤーによる入退店人数・滞留時間分析を行います。
      verified:
        - hardware
      device_groups:
        - id: camera
          name: AI Camera
          name_i18n:
            zh: AI 摄像头
            ja: AI カメラ
          type: single
          required: true
          options:
            - device_ref: recamera_2002
              label: reCamera (SG2002)
              label_i18n:
                zh: reCamera (SG2002)
            - device_ref: recamera_pro
              label: reCamera Pro (RV1126B)
              label_i18n:
                zh: reCamera Pro (RV1126B)
          default: recamera_2002
        - id: server
          name: Home Assistant Server
          name_i18n:
            zh: Home Assistant 服务器
            ja: Home Assistant サーバー
          type: single
          required: false
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11
      links:
        github: https://github.com/suharvest/sscma-example-sg200x

  stats:
    deployed_count: 0
    likes_count: 0
    difficulty: beginner
    estimated_time: 20min
  links:
    github: https://github.com/suharvest/sscma-example-sg200x
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
