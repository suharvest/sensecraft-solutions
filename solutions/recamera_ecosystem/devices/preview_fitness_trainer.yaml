version: "1.0"
id: preview_fitness_trainer
name: Fitness Trainer Preview
type: video_stream

# 视频流配置
# 与其余 preset 一致：不在 device 层写 rtsp_url_template，而是让下面的
# `rtsp_url` user_input 自带 default_template。前端在渲染时解析它，并在用户
# 修改 Step 1 的 host 时实时改写（propagateHostToPreviewInputs 会盯住任何
# data-default-template 含 {{host}} 的输入框）。
# `inherit_host_from` + `{{deploy.host}}` 对 preview 类设备无效，见
# preview_weather.yaml 里的详细说明。
video:
  type: rtsp_proxy

# MQTT 配置
mqtt:
  broker_template: "{{mqtt_broker}}"
  port_template: "{{mqtt_port}}"
  topic_template: "{{mqtt_topic}}"
  username_template: "{{mqtt_username}}"
  password_template: "{{mqtt_password}}"

# 叠加层配置
overlay:
  renderer: custom
  script_file: preview/draw_fitness_trainer.js
  dependencies: []

# 显示配置
display:
  aspect_ratio: "16:9"
  auto_start: false
  show_stats: true

user_inputs:
  - id: rtsp_url
    name: RTSP URL
    type: text
    required: true
    default_template: "rtsp://{{host}}:8554/live0"
    default: "rtsp://192.168.42.1:8554/live0"
    placeholder: "rtsp://192.168.42.1:8554/live0"
    description: Video stream address — auto-filled from Step 1's IP, edit to point at a different camera
    name_i18n:
      zh: RTSP 地址
    description_i18n:
      zh: 视频流地址——自动带入步骤 1 的 IP，如需指向另一台摄像头可自行修改
  - id: mqtt_broker
    name: MQTT Broker
    type: text
    required: true
    default_template: "{{host}}"
    default: "192.168.42.1"
    placeholder: "192.168.42.1"
    description: MQTT broker address — auto-filled from Step 1's IP
    name_i18n:
      zh: MQTT 服务器
    description_i18n:
      zh: MQTT 服务器地址——自动带入步骤 1 的 IP
  - id: mqtt_port
    name: MQTT Port
    type: text
    required: false
    default: "1883"
    placeholder: "1883"
    name_i18n:
      zh: MQTT 端口
  - id: mqtt_topic
    name: MQTT Topic
    type: text
    required: false
    default: "recamera/fitness-trainer/results"
    placeholder: "recamera/fitness-trainer/results"
    name_i18n:
      zh: MQTT 主题
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    placeholder: "(optional)"
    name_i18n:
      zh: MQTT 用户名
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    placeholder: "(optional)"
    name_i18n:
      zh: MQTT 密码

name_i18n:
  zh: 健身教练预览
