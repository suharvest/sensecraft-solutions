version: "1.0"
id: preview_weather
name: Weather Classification Preview
type: video_stream

# 视频流配置
# No device-level rtsp_url_template here — the `rtsp_url` user_input below
# carries its own default_template, which the frontend resolves at render
# time AND live-rewrites as the user types Step 1's host (propagateHostToPreviewInputs
# watches any input with data-default-template containing {{host}}). This is
# the same working pattern as depth_anything_v3/devices/preview.yaml.
# (`inherit_host_from` + `{{deploy.host}}`, used in an earlier version of this
# file, does NOT work for `type: preview` devices — that mechanism only
# drives the "verify" step handlers in step-context.js. `{{deploy.host}}` is
# also never resolved by preview.js's resolveTemplate() call, which only
# passes the flat `inputs` map, not the `inputsByStep` needed for dotted
# `{{step.field}}` templates.)
video:
  type: rtsp_proxy

# MQTT 配置
mqtt:
  broker_template: "{{mqtt_broker}}"
  port_template: "{{mqtt_port}}"
  topic_template: "{{mqtt_topic}}"
  username_template: "{{mqtt_username}}"
  password_template: "{{mqtt_password}}"

# 叠加层配置
overlay:
  renderer: custom
  script_file: preview/draw_weather.js
  dependencies: []

# 显示配置
display:
  aspect_ratio: "16:9"
  auto_start: false
  show_stats: true

# 用户输入
user_inputs:
  - id: rtsp_url
    name: RTSP URL
    type: text
    required: true
    default_template: "rtsp://{{host}}:8554/live0"
    default: "rtsp://192.168.42.1:8554/live0"
    placeholder: "rtsp://192.168.42.1:8554/live0"
    description: Video stream address — auto-filled from Step 1's IP, edit to point at a different camera
    name_i18n:
      zh: RTSP 地址
    description_i18n:
      zh: 视频流地址——自动带入 Step 1 的 IP，如需指向另一台摄像头可自行修改
  - id: mqtt_broker
    name: MQTT Broker
    type: text
    required: true
    default_template: "{{host}}"
    default: "192.168.42.1"
    placeholder: "192.168.42.1"
    description: MQTT broker address — auto-filled from Step 1's IP
    name_i18n:
      zh: MQTT 服务器
    description_i18n:
      zh: MQTT 服务器地址——自动带入 Step 1 的 IP
  - id: mqtt_port
    name: MQTT Port
    type: text
    required: false
    default: "1883"
    placeholder: "1883"

    name_i18n:
      zh: MQTT 端口
  - id: mqtt_topic
    name: MQTT Topic
    type: text
    required: false
    default: "recamera/weather/results"
    placeholder: "recamera/weather/results"

    name_i18n:
      zh: MQTT 主题
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    placeholder: "(optional)"

    name_i18n:
      zh: MQTT 用户名
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    placeholder: "(optional)"
    name_i18n:
      zh: MQTT 密码
name_i18n:
  zh: 天气识别预览
