version: "1.0"
id: recamera_pro_yolo
name: reCamera Pro
type: recamera_pro_app
device_class: recamera

recamera_pro_app:
  app_id: yolo-detector
  activation_timeout: 90
  config:
    output_channels: ["ws"]
  config_when:
    - when_present: mqtt_host
      config:
        output_channels: ["ws", "mqtt"]
        dMqtt:
          sURL: "{{mqtt_host}}"
          iPort: "{{mqtt_port}}"
          sTopic: "{{device_name}}"
          sUsername: "{{mqtt_username}}"
          sPassword: "{{mqtt_password}}"

ssh:
  port: 443
  default_user: admin
  connection_timeout: 30

name_i18n:
  zh: reCamera Pro

user_inputs:
  - id: device_name
    name: Device Name
    type: text
    default: "recamera"
    required: true
    description: First segment of the MQTT topic — name this device however you like so several devices stay separable
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 设备名称
    description_i18n:
      zh: MQTT 主题的第一段——按习惯给这台设备取名，多台设备就不会混在一起
  - id: mqtt_host
    name: MQTT Broker Address (optional)
    type: text
    required: false
    placeholder: "192.168.1.50"
    description: Leave empty to just watch results on the device page. Fill it in to forward events to Home Assistant
    name_i18n:
      zh: MQTT 服务器地址（可选）
    description_i18n:
      zh: 留空就只在设备自带页面看结果；填了才会把事件转发到 Home Assistant
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    name_i18n:
      zh: MQTT 端口
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    name_i18n:
      zh: MQTT 用户名
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    name_i18n:
      zh: MQTT 密码

post_deployment:
  open_browser: false
