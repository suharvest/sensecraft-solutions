version: "1.0"
id: console_dashboard
name: Open reCamera Console
type: web_dashboard

# 显式声明上游部署步骤（guide.md 里 `## Step 1 {#deploy_console ...}` 的 step id，
# 不是 device id）。App 据此判断「面板是否可以打开」，也据此解析 {{host}}。
# 不声明就会退回启发式：向前找最近的 docker 步，而本套餐没有 docker 步，
# 会误钉到别的套餐上去。
inherit_host_from: deploy_console
user_inputs:
  - id: host
    name: Device IP Address
    default: "192.168.42.1"
    default_template: "{{host}}"
    description: IP address of your reCamera (USB default 192.168.42.1)
    name_i18n:
      zh: 设备 IP 地址
    description_i18n:
      zh: reCamera 的 IP 地址（USB 默认 192.168.42.1）
web_dashboard:
  # 控制台就是设备的 80 口 Web 服务，无需额外端口
  url: "http://{{host}}/"
  title: reCamera Console
  description: Browse and switch apps, watch the live view, and manage network and system settings
  title_i18n:
    zh: reCamera 控制台
  description_i18n:
    zh: 浏览和切换应用、查看实时画面、管理网络与系统设置
name_i18n:
  zh: 打开 reCamera 控制台
