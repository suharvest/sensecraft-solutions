version: "1.0"
id: console_dashboard
name: Choose and Install an App
type: web_dashboard

# 显式声明上游部署步骤（guide.md 里 `## Step 1 {#deploy_console ...}` 的 step id，
# 不是 device id）。App 据此判断「面板是否可以打开」，也据此解析 {{host}}。
# 不声明就会退回启发式：向前找最近的 docker 步，而本套餐没有 docker 步，
# 会误钉到别的套餐上去。
inherit_host_from: deploy_console
user_inputs:
  - id: host
    name: Device IP Address
    default: "192.168.42.1"
    default_template: "{{host}}"
    description: IP address of your reCamera (USB default 192.168.42.1)
    name_i18n:
      zh: 设备 IP 地址
    description_i18n:
      zh: reCamera 的 IP 地址（USB 默认 192.168.42.1）
web_dashboard:
  # 控制台就是设备的 80 口 Web 服务，无需额外端口
  url: "http://{{host}}/"
  title: reCamera Console
  description: >-
    Open Applications, install the app you want with Install from cloud, then
    activate it. Its Debug page shows the live view and detection results.
  title_i18n:
    zh: reCamera 控制台
  description_i18n:
    zh: >-
      打开「应用」页，用「从云端安装」装上想用的应用，然后启用它。
      点应用上的「调试」就能看到实时画面和检测结果。
name_i18n:
  zh: 选择并安装应用
