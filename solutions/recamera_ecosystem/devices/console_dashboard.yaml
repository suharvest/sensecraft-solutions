version: "1.0"
id: console_dashboard
name: Open the Console
type: web_dashboard

# 显式声明上游部署步骤（guide.md 里 `## Step 1 {#deploy_console ...}` 的 step id，
# 不是 device id）。App 据此判断「面板是否可以打开」，也据此解析 {{host}}。
# 不声明就会退回启发式：向前找最近的 docker 步，而本套餐没有 docker 步，
# 会误钉到别的套餐上去。
inherit_host_from: deploy_console
user_inputs:
  - id: host
    name: Device IP Address
    default: "192.168.42.1"
    default_template: "{{host}}"
    description: IP address of your reCamera (USB default 192.168.42.1)
    name_i18n:
      zh: 设备 IP 地址
    description_i18n:
      zh: reCamera 的 IP 地址（USB 默认 192.168.42.1）
web_dashboard:
  # 控制台就是设备的 80 口 Web 服务，无需额外端口
  url: "http://{{host}}/"
  title: reCamera Console
  description: >-
    The app you picked is installed and running. The Applications page shows
    it active; its Debug page shows the live view and detection results. To
    switch to a different app later, pick it in Applications — Install from
    cloud lists everything else in the catalog.
  title_i18n:
    zh: reCamera 控制台
  description_i18n:
    zh: >-
      你选的应用已经装好并在运行。「应用」页能看到它处于启用状态，点它
      的「调试」可以看到实时画面和检测结果。以后想换别的应用，在「应用」
      页里直接切换——「从云端安装」里还有目录里的其他应用。
name_i18n:
  zh: 打开控制台
