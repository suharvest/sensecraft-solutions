# Broker for the reCamera → Home Assistant path.
#
# Both camera generations publish Home Assistant MQTT-discovery configs, and
# neither the reCamera Pro nor Home Assistant ships a broker, so one has to run
# somewhere. It runs beside Home Assistant rather than on a camera: the camera
# is the thing you swap out or switch apps on, and a broker that disappears
# with it takes every discovered entity with it.
listener 1883
# Anonymous on purpose. This broker carries detection events on a home LAN, and
# a password would have to be typed into every camera console by hand. Put
# credentials here (and in each camera's Integrations page) if the network is
# shared.
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
