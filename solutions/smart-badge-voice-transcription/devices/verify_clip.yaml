version: "1.0"
id: verify_clip
name: Check the transcription service
name_i18n: {zh: 检查转写服务}
type: http_debug
http_debug: {endpoints: [{id: healthz, name: Service status, name_i18n: {zh: 服务状态}, url_template: "http://{{host}}:8631/healthz", expected_status: 200}]}
user_inputs: [{id: host, name: Host IP, name_i18n: {zh: 主机 IP}, type: text, required: true, placeholder: 192.168.1.100}]
