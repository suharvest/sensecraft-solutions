version: "1.0"
id: rk3588_convert
name: Convert and Check the Detector on Rockchip
name_i18n:
  zh: 在 Rockchip 上转换并核对检测器
type: manual

# Manual, and the reason is structural rather than a shortcut. Two things are
# missing for an automated step:
#
#   1. The `.rknn` cannot be produced on the board. rknn-toolkit2 is x86_64
#      only; the device runs rknnlite, which loads but does not convert. The
#      conversion therefore happens on a separate host and the artifact is
#      copied over — the deployment engine has no step type that spans two
#      machines that way.
#   2. There is no device-side service to start. The upstream repository has
#      the RKNN conversion and inference scripts, the shared decode/NMS, the
#      gallery and the aggregation logic, but no process that joins detection,
#      embedding, lookup and MQTT publishing. `platforms/` holds console, hailo
#      and rknn; there is no rknn compose file and no rknn runtime image.
#
# What this step does deliver is the conversion and an on-device parity check
# against the CPU golden, which is the same procedure that produced the
# measured numbers quoted on the solution page.
#
# LICENCE: the ONNX this converts is trained on SKU-110K, which is
# academic-and-non-commercial with derivative works forbidden. The weights are
# not redistributed with this package and the `.rknn` you build inherits that
# scope.

steps:
  - id: rk_convert
    name: Convert the ONNX to .rknn on an x86_64 host
    name_i18n:
      zh: 在 x86_64 主机上把 ONNX 转成 .rknn
    description: >-
      From a clone of the upstream repository, on an x86_64 machine with
      rknn-toolkit2 2.3.2 installed, run
      `platforms/rknn/convert_rk3588.py --onnx yolox_tiny_sku110k_640.onnx
      --out-dir out --precision fp16`. Two pins matter and are already recorded
      upstream: onnx must be 1.16.1 (later versions that dropped `onnx.mapping`
      fail inside `load_onnx`) and setuptools must be below 81 (81 removed
      `pkg_resources`). The toolkit version and the device's `librknnrt.so`
      version must match — 2.3.2 against 2.3.2 in the measured run. For the
      INT8 variant, build the calibration set with
      `prepare_calib_images.py --count 64` sampled evenly across the whole
      validation directory: taking the first N files by name lands you inside
      one capture batch and the quantisation scales are then set by that batch
      alone. Preprocessing is `mean=0 / std=1` on purpose — the model has no
      normalisation layer, so letterboxed 0–255 BGR goes in unchanged, matching
      the CPU path bit for bit.
    description_i18n:
      zh: >-
        在上游仓库的克隆里、一台装了 rknn-toolkit2 2.3.2 的 x86_64 机器上跑
        `platforms/rknn/convert_rk3588.py --onnx yolox_tiny_sku110k_640.onnx
        --out-dir out --precision fp16`。两个版本钉死很重要，上游已经记下来了：
        onnx 必须是 1.16.1（更高且已删 `onnx.mapping` 的版本会在 `load_onnx` 报错），
        setuptools 必须低于 81（81 起没有 `pkg_resources`）。toolkit 版本要与设备上
        `librknnrt.so` 的版本一致——实测那一轮是 2.3.2 对 2.3.2。要 INT8 变体的话，
        用 `prepare_calib_images.py --count 64` 从整个 val 目录等间隔抽校准图：
        按文件名取前 N 张会落进同一个拍摄批次，量化 scale 就只按那个批次定了。
        预处理是 `mean=0 / std=1`，这是刻意的——模型没有归一化层，letterbox 后的
        0–255 BGR 原样进去，与 CPU 路径逐位一致。
    optional: false

  - id: rk_copy
    name: Copy the artifact to the board and check the runtime version
    name_i18n:
      zh: 把产物拷到板上并核对运行时版本
    description: >-
      Copy the `.rknn` and record its sha256 on both sides. On the board,
      confirm the runtime: `strings /usr/lib/librknnrt.so | grep -i "librknnrt
      version"`. A toolkit/runtime mismatch does not always fail loudly — it can
      load and produce wrong numbers. The reference run used an RK3588 platform
      with librknnrt 2.3.2 and driver 0.9.8. Note that the board in that run
      had no cv2 or PIL in its system Python and none were installed, to avoid
      contaminating a machine other projects were using: images were
      letterboxed elsewhere and shipped over as one `(N, 640, 640, 3)` uint8
      BGR `.npy`, so the device script needs only numpy and rknnlite.
    description_i18n:
      zh: >-
        把 `.rknn` 拷过去，两边都记下 sha256。在板上确认运行时：
        `strings /usr/lib/librknnrt.so | grep -i "librknnrt version"`。
        toolkit 与运行时版本不匹配不一定会明着报错——它可能加载成功但算出错的数。
        参考那一轮跑在 RK3588 平台上，librknnrt 2.3.2、driver 0.9.8。
        注意那台机器的系统 Python 里没有 cv2 和 PIL，也没有装——为了不污染其它项目在用的
        那个 python：图片在别处 letterbox 好，打包成一个 `(N, 640, 640, 3)` uint8 BGR
        的 `.npy` 传过去，设备端脚本只需要 numpy 和 rknnlite。
    optional: false

  - id: rk_embed
    name: Convert the embedder to RKNN fp16 and split the NPU cores
    name_i18n:
      zh: 把嵌入器转成 RKNN fp16，并把 NPU 核分开
    description: >-
      The embedder is DINOv2-small with an ArcFace head, converted the same way
      as the detector but without quantisation: `float_dtype='float16'`,
      `do_quantization=False`. All 166 layers land on the NPU; only two I/O
      operators stay on the CPU. Normalisation moves into the model
      (`mean_values` / `std_values` in `rknn.config`), so the board feeds NHWC
      RGB uint8, not NCHW float32.

      Measured on RK3588 (librknnrt 2.3.2, driver 0.9.8): retrieval differs from
      the fp32 ONNX CPU reference by at most 0.85 pp across 21 metrics; one crop
      takes 48.93 ms p50 / 56.47 ms p95 on three cores, against 93.45 / 94.86 ms
      for the same model on the CPU with four threads.

      Set the core masks before you run both models. With detector and embedder
      both on all three cores, the embedder slows to 88.94 ms p50 (1.82x) and
      the detector to 76.91 ms — total core occupancy does not rise, the time
      goes into queueing. Splitting them (detector core 2, embedder cores 0+1)
      gives 53.19 ms for the embedder and 60.88 ms for the detector.

      Two constraints on the mask itself, both measured on this driver. `AUTO`
      uses core 0 only: cores 1 and 2 read 0% for the whole run, so `AUTO` is a
      single-core setting, not an automatic one. And core_mask is not a free
      bitmask — `init_runtime` returns -1 for 5 (cores 0+2) and 6 (cores 1+2)
      with `The core mode 6 is not supported currently.`, so "one core for
      detection, two for embedding" has exactly one valid arrangement:
      detector `2`, embedder `01`.
    description_i18n:
      zh: >-
        嵌入器是 DINOv2-small 加 ArcFace 头，转换方式与检测器相同，但不量化：
        `float_dtype='float16'`、`do_quantization=False`。166 层全部落在 NPU 上，
        CPU 上只剩两个 I/O 算子。归一化搬进模型里（`rknn.config` 的 `mean_values` /
        `std_values`），所以板上喂 NHWC RGB uint8，不喂 NCHW float32。

        RK3588 实测（librknnrt 2.3.2，driver 0.9.8）：检索与 fp32 ONNX CPU 参考
        在 21 个指标上最大差 0.85 pp；单裁剪三核 48.93 ms p50 / 56.47 ms p95，
        对照同一模型在 CPU 上四线程的 93.45 / 94.86 ms。

        两个模型都跑之前先设核掩码。检测与嵌入都占三个核时，嵌入慢到 88.94 ms
        p50（1.82 倍），检测 76.91 ms——三个核的总占用没有变高，时间花在排队上。
        分开之后（检测 core 2、嵌入 core 0+1）嵌入 53.19 ms、检测 60.88 ms。

        掩码本身有两条实测出来的限制。`AUTO` 只用 core 0：整轮里 core 1 与 core 2
        都读到 0%，所以它是单核档，不是"自动"档。core_mask 也不是自由位掩码——
        `init_runtime` 对 5（core 0+2）与 6（core 1+2）返回 -1，运行时打
        `The core mode 6 is not supported currently.`，所以"一个核做检测、两个核
        做嵌入"只有一种排法：检测 `2`、嵌入 `01`。
    optional: false
