version: "1.0"
id: jetson_trt_build
name: Build the TensorRT Engines on the Board
name_i18n:
  zh: 在板上构建 TensorRT engine
type: manual

# IMPLEMENTED AND MEASURED on a Seeed reComputer J40 unit (Jetson Orin NX 16GB,
# JetPack 6.2, TensorRT 10.3) — a reComputer J40 integrated-machine measurement,
# not a reference board. Both the detector and the embedder run as TensorRT
# fp16 engines on the device's own GPU: detector 5.18 ms p50 / 5.28 ms p95,
# 99.91% box agreement with the CPU golden (50 images, the same batch RK3588
# was checked against); embedder 4.23 ms p50 / 4.69 ms p95, 21 retrieval
# metrics within 0.24 percentage points of fp32. A 2956-frame checkout replay
# ran through the full device-side runtime — detector, embedder, gallery
# lookup, MQTT publish — with zero dropped frames. All figures are n=300,
# inference only, on an engine built on the device it ran on.
#
# The Orin Nano 8GB option in the same reComputer J30 / J40 family
# (family key recomputer_j30) has not been tested; the numbers above are from
# an Orin NX unit (family key recomputer_j40) only.

steps:
  - id: trt_build
    name: Build the two engines
    name_i18n:
      zh: 构建两个 engine
    description: >-
      On the board, from the upstream repository: `python3
      platforms/jetson/build_engines.py --detector-onnx
      platforms/jetson/local/yolox_tiny_sku110k_640.onnx --embedder-onnx
      platforms/jetson/local/dinov2s_arcface_products10k_224_b1.onnx
      --out-dir platforms/jetson/local --update-config
      platforms/jetson/runtime.yaml`. This calls the JetPack-bundled `trtexec
      --fp16` for both models, writes a `.build.json` build record next to
      each engine, and writes the measured `artifact_sha256` back into
      `runtime.yaml`, which ships with those two fields as 64 zeros — YAML
      reads an unquoted 64-zero placeholder as an integer, so the shipped file
      quotes them; keep the quotes when a real hash replaces them. Both ONNX
      graphs are static batch-1 — do not pass `--shapes`; a dynamic-shape flag
      on a static graph fails `trtexec` outright with "Static model does not
      take explicit shapes", so leave that flag for a genuinely dynamic batch
      axis only. Engines are bound to the device and the TensorRT version that
      built them: do not copy an engine between boards, rebuild on each one.
      Engines are not shipped in this package for the same reason. On the
      measured unit this took 334.47 s for the detector and 81.54 s for the
      embedder. Each `.build.json` also records `onnx_sha256_recomputed` —
      the source ONNX's sha256 as `build_engines.py` saw it at build time —
      check that it equals the `onnx_sha256` you started from before trusting
      the engine at all: a mismatch here means the wrong ONNX went into the
      build, not a TensorRT problem.
    description_i18n:
      zh: >-
        在板上，从上游仓库执行：`python3 platforms/jetson/build_engines.py
        --detector-onnx platforms/jetson/local/yolox_tiny_sku110k_640.onnx
        --embedder-onnx
        platforms/jetson/local/dinov2s_arcface_products10k_224_b1.onnx
        --out-dir platforms/jetson/local --update-config
        platforms/jetson/runtime.yaml`。这会调用 JetPack 自带的 `trtexec --fp16`
        分别构建两个模型，在每个 engine 旁边写一份 `.build.json` 构建记录，
        并把实测的 `artifact_sha256` 写回 `runtime.yaml`（出厂时这两个字段是
        加了引号的 64 个 0——不加引号会被 YAML 读成整数 0；换成真哈希时保留引号）。
        两份 ONNX 都是静态 batch-1——不要传 `--shapes`，给静态图指定动态 shape
        会让 `trtexec` 直接报 "Static model does not take explicit shapes" 失败，
        这个 flag 只留给真正动态的 batch 轴用。engine 与构建它的设备和 TensorRT
        版本绑定：不要在板之间拷贝，每块板各构一次。engine 也因此不随本包分发。
        在实测这台设备上，检测器耗时 334.47 秒，嵌入器 81.54 秒。每份
        `.build.json` 还记了一个 `onnx_sha256_recomputed`——`build_engines.py`
        在构建时重算出的源 ONNX sha256——先核对它与你出发时的 `onnx_sha256`
        是否一致，再去相信这个 engine：这里对不上，说明进去构建的 ONNX 本身
        就不对，不是 TensorRT 的问题。
    optional: false

  - id: trt_dryrun
    name: Verify the engines before running the runtime
    name_i18n:
      zh: 跑运行时之前先校验 engine
    description: >-
      `python3 platforms/jetson/runtime.py --config
      platforms/jetson/runtime.yaml --dry-run` loads the config, recomputes
      the sha256 of each engine file on disk and compares it against the
      `artifact_sha256` `build_engines.py` wrote into the config; a mismatch
      exits with code 2 rather than loading an engine of unknown provenance.
      This is the gate that stands between "an engine file exists" and "this
      is the engine the config says it is." It only checks the engine files
      themselves — it does not re-verify the `onnx_sha256` fields against a
      live ONNX, since the runtime has no ONNX file to check against at this
      point; that check happened in the previous step, against
      `onnx_sha256_recomputed` in each `.build.json`.
    description_i18n:
      zh: >-
        `python3 platforms/jetson/runtime.py --config
        platforms/jetson/runtime.yaml --dry-run` 会读配置、重算磁盘上每个
        engine 文件的 sha256，与 `build_engines.py` 写进配置里的 `artifact_sha256`
        比对；对不上就以 exit code 2 退出，而不是加载一个来路不明的 engine。
        这道检查隔开的是「engine 文件存在」和「这就是配置里说的那个 engine」。
        它只校验 engine 文件本身——不会重新核对 `onnx_sha256` 字段对不对得上
        一份活的 ONNX，因为运行时这一步手上没有 ONNX 文件可比；那道核对在上一步
        已经做过，对的是每份 `.build.json` 里的 `onnx_sha256_recomputed`。
    optional: false

  - id: trt_parity
    name: Confirm accuracy before trusting the latency numbers
    name_i18n:
      zh: 相信延迟数字之前先确认精度
    description: >-
      Run the same parity check the other platforms ran: take the CPU golden
      from `evaluation/run_golden.py` on the same ONNX, match boxes at IoU >=
      0.5 with a 0.25 score threshold, and check the hit rate against the
      measured 99.91% (50 images — the same golden RK3588 was checked
      against, so the two numbers are directly comparable). For retrieval,
      re-run `evaluation/eval_embedder.py --emb-npz` against the fp32 ONNX
      output and check the 21-metric max delta against the measured 0.24
      percentage points. A result far off either reference number means the
      decode, the output layout, or the normalisation is wrong — not that
      fp16 is lossy, since TensorRT's fp16 mode only changes internal compute
      precision while the engine's I/O stays the float32 the ONNX declares.
      Only after this passes does a latency number from this engine mean
      anything.
    description_i18n:
      zh: >-
        跑另外两个平台跑过的同一套 parity 检查：用 `evaluation/run_golden.py`
        在同一份 ONNX 上取 CPU golden，按分数阈值 0.25、IoU ≥ 0.5 匹配框，
        核对命中率与实测的 99.91%（50 张，与 RK3588 用的同一批 golden，两个数
        直接可比）。检索侧重跑 `evaluation/eval_embedder.py --emb-npz` 与 fp32
        ONNX 输出比对，核对 21 项指标的最大差值与实测的 0.24 个百分点。明显偏离
        参考值说明解码、输出布局或归一化出了问题，而不是 fp16 有损——TensorRT
        的 fp16 模式只改变内部计算精度，engine 的 I/O 仍是 ONNX 声明的
        float32。这道检查通过之后，这个 engine 的延迟数字才有意义。
    optional: false
