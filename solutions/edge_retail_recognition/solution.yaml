  category: sensing
  solution_type: solution
  tags:
    - retail
    - product-recognition
    - object-detection
    - image-retrieval
    - faiss
    - yolox
    - dinov2
    - mqtt
    - checkout
    - shelf-audit

  output_interfaces:
    - type: mqtt
      port: 1883
      topic: retail/v1/events
      description: >-
        One JSON message per frame, carrying every box in it — never one
        message per box. Each detection has its track id, normalised bbox,
        matched SKU, cosine similarity, the top-1/top-2 margin that decides
        whether OCR reranking runs at all, the OCR block with its status, and
        whether a VLM fallback was used. The message also carries the gallery
        version and sha256 and the detector/embedder sha256, because a
        similarity score is meaningless without knowing which gallery and which
        model produced it.
      schema_type: json
      payload_example: '{"event_id":"6f1a2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d","scene":"checkout","timestamp":"2026-09-06T03:20:11Z","gallery":{"version":12,"sha256":"9b1e…"},"detections":[{"track_id":7,"bbox":[0.5,0.5,0.2,0.3],"sku_id":"sku-1","similarity":0.84,"top2_margin":0.03,"ocr":{"text":"lime","match_score":0.76,"status":"used"},"fallback":{"used":false,"backend":null}}],"summary":{"items":{"sku-1":2},"empty_slots":[],"wrong_slots":[]},"models":{"detector_sha256":"73938d5a…","embedder_sha256":"01ae07d1…"}}'
      description_i18n:
        zh: >-
          一帧一条 JSON，带上这一帧里的所有框——不逐框发。每个检测带 track id、
          归一化 bbox、匹配到的 SKU、余弦相似度、决定是否触发 OCR 重排的 top-1/top-2
          间距、带状态的 OCR 块，以及是否用过 VLM 兜底。消息里还带商品库版本与 sha256、
          检测器与嵌入模型的 sha256——不知道是哪个库、哪个模型算出来的，相似度这个数没有意义。
    - type: http
      port: 8089
      endpoint: /v1/gallery/skus, /v1/gallery, /v1/gallery/{version}, /v1/gallery/current/download, /v1/gallery/rollback/{version}
      description: >-
        The whole registration surface. "POST /v1/gallery/skus" takes a sku_id,
        a display name, aliases, a licence field and 3 to 8 images, runs them
        through a quality gate, embeds them and mints a new immutable gallery
        version; the same sku_id returns 409 unless "replace=true". The
        console side of the versioning protocol is implemented — versions are
        immutable, "current/download" serves a tar.gz with SHA256SUMS inside,
        and rollback re-verifies the target version's SHA before switching
        without minting a new one. The device-side runtime that would fetch a
        version, verify its checksums and switch atomically does not exist yet
        (in progress — see upstream spec).
        Authorisation is "Bearer <token>" with viewer < operator < admin, and
        there is no anonymous read — the token table is injected at deploy
        time and the code carries no default token.
      schema_type: json
      description_i18n:
        zh: >-
          注册接口的全部。「POST /v1/gallery/skus」 接收 sku_id、显示名、别名、许可字段
          与 3–8 张图，过质量闸门后做嵌入，生成一个新的不可变商品库版本；同一个 sku_id
          返回 409，除非显式 「replace=true」。控制台侧的版本协议已实现——版本不可变，
          「current/download」 提供带 SHA256SUMS 的 tar.gz，回滚在切换前重校目标版本的
          SHA 且不产生新版本。设备端运行时——拉取版本、校验 checksum、原子切换——
          尚未实现（开发中，见上游 spec）。鉴权是 「Bearer <token>」，角色 viewer < operator < admin，
          没有匿名读——token 表在部署时注入，代码里没有任何默认 token。
    - type: http
      port: 8080
      endpoint: /api/events, /api/events/{id}, /api/summary
      description: >-
        The management UI and its read API behind the same token gate — the
        event list filtered by scene, SKU, device and time, the per-box detail
        of one event, and the summary that backs the board: the most recent
        checkout basket and the shelf slot snapshot in its four states (ok,
        empty, wrong_sku, unknown).
      schema_type: json
      description_i18n:
        zh: >-
          管理界面与它的只读 API，走同一个 token 闸门——按场景/SKU/设备/时间过滤的
          事件列表、单条事件的逐框详情，以及支撑看板的汇总：最近一次收银台清单，
          与货架货位四态（ok / empty / wrong_sku / unknown）快照。

  input_requirements:
    - type: rtsp
      description: >-
        A camera over the checkout belt or facing the shelf. The checkout
        preset is a fixed 640² input; the shelf preset is a fixed 1280². The
        input size is a property of the compiled artifact and is never changed
        at run time — a 640 artifact fed shelf imagery loses the distant
        products, which is exactly what the two presets exist to separate.
      required: true
      description_i18n:
        zh: >-
          一台架在收银台传送带上方或正对货架的摄像头。收银台 preset 固定 640² 输入，
          货架 preset 固定 1280²。输入尺寸是编译产物的属性，运行时不改——
          用 640 的产物去看货架会丢掉远端商品，这正是分成两个 preset 的原因。
    - type: other
      description: >-
        A host for the console — the registration/query service, the management
        UI and an MQTT broker, in three containers. Target is an amd64 or arm64
        Linux box with Docker and no GPU; neither image has been built or
        pushed anywhere yet. It must
        be reachable from every recognition device, because that is where the
        gallery is minted and where devices pull it from.
      required: true
      description_i18n:
        zh: >-
          一台承载管理端的主机——注册/查询服务、管理界面与 MQTT broker，三个容器。
          目标是装了 Docker 的 amd64 或 arm64 Linux 机器，不需要 GPU；两个镜像目前
          都还没有构建或推送到任何地方。
          它必须对每一台识别设备可达：商品库在这里生成，设备也从这里拉。
    - type: other
      description: >-
        An x86_64 machine for model conversion. Neither the RKNN toolkit nor
        the Hailo Dataflow Compiler runs on the target board, so the ".rknn"
        and the ".hef" are produced off-device and copied over. This is a
        one-time step per model, not per deployment.
      required: true
      description_i18n:
        zh: >-
          一台 x86_64 机器用于模型转换。RKNN toolkit 与 Hailo Dataflow Compiler
          都不在目标板上运行，「.rknn」 与 「.hef」 都在别的机器上产出后拷过去。
          这是每个模型一次的事，不是每次部署都要做。

  device_catalog:
    external_console_host:
      name: Console / On-Prem Host
      name_i18n:
        zh: 管理端 / 本地服务器
      description: >-
        Runs the registration service, the management UI and the broker in
        containers. Present in all three presets — the gallery and the UI are
        shared infrastructure, not a per-preset extra. Both container images
        are published; override the image variables to deploy a local build
        instead.
      description_i18n:
        zh: >-
          以容器运行注册服务、管理界面与 broker。三个套餐都要它——商品库与管理界面是
          共用基础设施，不是某个套餐的附加项。两个容器镜像均已发布；要部署自建版本，
          覆盖对应的镜像变量即可。
    recomputer_rk3588:
      description: >-
        Runs the detector on the RK3588 NPU. The RKNN fp16 conversion of the
        640² checkout detector has been measured on RK3588: 99.85%
        box agreement with the CPU golden and 56.7 ms p50. The embedding step
        has no RKNN conversion — it has not been attempted — so on this board
        embedding runs on the CPU through onnxruntime, and that path has not
        been timed on RK3588.
      description_i18n:
        zh: >-
          在 RK3588 NPU 上跑检测。640² 收银台检测器的 RKNN fp16 转换已在 RK3588
          上实测：与 CPU golden 的框一致率 99.85%，p50 56.7 ms。嵌入段没有 RKNN 转换——
          没有尝试过——因此这块板上嵌入走 onnxruntime CPU，而这条路径在 RK3588 上没有测过延迟。
    recomputer_rk3576:
      description: >-
        The smaller Rockchip option, same toolchain and same conversion
        script, with its own two-core NPU (RK3588 has three). Measured on the
        same RK3576 chip platform, inference only: detector RKNN fp16, dual
        NPU core, 51.05 ms p50 / 54.18 ms p95, 99.91% box agreement with the
        CPU reference; embedder RKNN fp16, dual NPU core, 56.38 ms p50 /
        62.17 ms p95, 21 retrieval metrics within 0.36 percentage points of
        fp32, mean cosine similarity 0.99966. On the same platform, a 704-crop
        shelf replay scored 76.28% top-1 (CPU fp32 76.99%), 99.29% same-SKU
        agreement, embedder p50 61.0 ms per crop. Reference value on the same
        RK3576 platform; will be updated after a re-test on the reComputer
        unit.
      description_i18n:
        zh: >-
          更小的 Rockchip 选项，工具链与转换脚本相同，NPU 只有两核（RK3588 是三核）。
          同款 RK3576 芯片平台实测，纯推理：检测器 RKNN fp16，双核，
          p50 51.05 ms / p95 54.18 ms，与 CPU 参考的框一致率 99.91%；
          嵌入器 RKNN fp16，双核，p50 56.38 ms / p95 62.17 ms，21 项检索指标
          与 fp32 最大差 0.36 个百分点，余弦相似度均值 0.99966。同款平台上，
          704 张货架裁剪回放 top-1 76.28%（CPU fp32 76.99%），预测一致 99.29%，
          嵌入器单裁剪 p50 61.0 ms。
          同款 RK3576 平台实测参考值，reComputer 整机复测后更新。
    recamera_pro:
      description: >-
        All-in-one AI camera with an onboard Rockchip NPU, running both stages
        on-camera as fp16 RKNN. Measured on the camera itself with its bundled
        applications stopped, inference only: detector 112.3 ms p50 / 120.4 ms
        p95 and 99.91% box agreement with the CPU reference (50 images);
        embedder 77.5 ms p50 / 77.9 ms p95, mean cosine similarity 0.998
        against fp32 and a top-1 delta of -0.33 percentage points on a
        300-image subset (leave-one-out, a different protocol from the Grocery
        Store retrieval numbers above — absolute values are not comparable).
      description_i18n:
        zh: >-
          一体化 AI 摄像头，板载 Rockchip NPU，两段都在机身上跑 fp16 RKNN。
          测量条件：自带应用停止、纯推理。检测器 p50 112.3 ms / p95 120.4 ms，
          与 CPU 参考的框一致率 99.91%（50 张）；嵌入器 p50 77.5 ms / p95 77.9 ms，
          与 fp32 的余弦相似度均值 0.998，300 张子集上留一法 top-1 差
          −0.33 个百分点（协议与上文 Grocery Store 检索口径不同，绝对值不可比）。
    recomputer_r20_industrial:
      description: >-
        An industrial box with a Hailo-8 on the M.2 slot. On the same Hailo-8
        platform the detector HEF measured 9.04 ms p50 and 94.77% box agreement
        with the CPU golden, and the embedder ran on the CPU as a dynamically
        quantised INT8 DINOv2-small at 91.95 ms per crop — reference values, to
        be updated after a re-test on the reComputer unit.
      description_i18n:
        zh: >-
          M.2 插槽上装了 Hailo-8 的工业整机。同款 Hailo-8 平台实测：检测器 HEF
          p50 9.04 ms，与 CPU golden 的框一致率 94.77%；嵌入段跑 CPU，是动态量化
          INT8 的 DINOv2-small，单个裁剪 91.95 ms。以上为参考值，
          reComputer 整机复测后更新。
      purchase:
        require:
          ai_accelerator: [hailo-8]
    recomputer_j40:
      description: >-
        The Orin NX 16GB option for the TensorRT path. Runs both the detector
        and the embedder as TensorRT fp16 engines on the GPU — measured on a
        Seeed reComputer J40 unit itself, not a reference board: detector 5.18 ms
        p50 / 5.28 ms p95, 99.91% box agreement with the CPU golden (50
        images, the same batch RK3588 was checked against); embedder 4.23 ms
        p50 / 4.69 ms p95, 21 retrieval metrics within 0.24 percentage points
        of fp32. A 2956-frame checkout replay ran through the full
        device-side runtime with zero dropped frames.
      description_i18n:
        zh: >-
          TensorRT 路线的 Orin NX 16GB 选项。检测器与嵌入器都以 TensorRT fp16
          engine 跑在 GPU 上——实测于一台 Seeed reComputer J40 整机，不是台架：
          检测器 p50 5.18 ms / p95 5.28 ms，与 CPU golden 的框一致率 99.91%
          （50 张，与 RK3588 用的同一批 golden）；嵌入器 p50 4.23 ms / p95 4.69 ms，
          21 项检索指标与 fp32 最大差 0.24 个百分点。一次 2956 帧的收银台回放
          跑通了完整的设备侧运行时，零掉帧。
      purchase:
        require:
          module:
            - orin_nx_16
    recomputer_j30:
      description: >-
        The smaller Orin Nano 8GB option in the same reComputer J30 / J40
        family. Also measured directly on this board (reComputer J30 series,
        J3011): detector 5.88 ms p50 / 8.89 ms p95, 99.27% box agreement with
        the CPU golden (a different 50-image batch than the Orin NX unit's,
        so not bit-for-bit comparable); embedder 5.06 ms p50 / 7.64 ms p95,
        21 retrieval metrics within 0.21 percentage points of fp32. A
        6726-frame checkout replay (2.27 loops) ran with zero dropped frames
        and all 84 events published.
      description_i18n:
        zh: >-
          同一 reComputer J30 / J40 家族里更小的 Orin Nano 8GB 选项。同样已在
          本机实测（reComputer J30 系列，J3011）：检测器 p50 5.88 ms /
          p95 8.89 ms，与 CPU golden 的框一致率 99.27%（与 Orin NX 机型用的
          不是同一批 50 张图，不可逐位对齐）；嵌入器 p50 5.06 ms / p95 7.64 ms，
          21 项检索指标与 fp32 最大差 0.21 个百分点。一次 6726 帧（2.27 轮）
          的收银台回放零掉帧，84 个事件全部发布成功。
      purchase:
        require:
          module:
            - orin_nano_8
    generic_rtsp_camera:
      name: RTSP / USB Camera
      name_i18n:
        zh: RTSP / USB 摄像头
      description: Any camera over the checkout belt or facing the shelf, supplying the frames the detector reads
      description_i18n:
        zh: 任意一台架在收银台上方或正对货架的摄像头，为检测器提供画面

  presets:
    - id: p1_rockchip
      name: Rockchip NPU — RK3588 / RK3576
      name_i18n:
        zh: Rockchip NPU —— RK3588 / RK3576
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: >-
        The detector runs on the Rockchip NPU as an fp16 `.rknn`, converted on
        an x86_64 host. On RK3588 that path agrees with the CPU golden on
        99.85% of boxes at 56.7 ms p50, and the INT8 variant is 2.2x faster at
        98.35%; embedding has no RKNN conversion on RK3588 and falls back to
        onnxruntime on the CPU. RK3576 has a different core count and
        its own measured detector and embedder numbers, both on the NPU — see
        its device description below. There is no device-side service that
        joins the two stages — this preset converts the model, proves the
        conversion on the board, and stops there.
      description_i18n:
        zh: >-
          检测器以 fp16 `.rknn` 跑在 Rockchip NPU 上，转换在 x86_64 主机上完成。
          在 RK3588 上这条路径与 CPU golden 的框一致率 99.85%、p50 56.7 ms，
          INT8 变体快 2.2 倍、一致率 98.35%；嵌入段在 RK3588 上没有 RKNN 转换，
          退到 CPU 上的 onnxruntime。RK3576 核数不同，检测与嵌入都有
          自己的实测数字，且都跑在 NPU 上——见下方设备说明。没有把两段串起来的
          设备侧服务——这个套餐做的是转换模型、在板上证明转换正确，到此为止。
      device_groups:
        - id: console
          name: Console Host
          name_i18n:
            zh: 管理端主机
          type: single
          required: true
          options:
            - device_ref: external_console_host
          default: external_console_host
        - id: compute
          name: Recognition Host
          name_i18n:
            zh: 识别主机
          type: single
          required: true
          options:
            - device_ref: recomputer_rk3588
            - device_ref: recomputer_rk3576
          default: recomputer_rk3588
        - id: camera
          name: Camera
          name_i18n:
            zh: 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_rtsp_camera
          default: generic_rtsp_camera

    - id: p1b_recamera_pro
      name: reCamera Pro — All-in-one Rockchip NPU Camera
      name_i18n:
