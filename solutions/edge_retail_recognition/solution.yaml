          name_i18n:
            zh: 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_rtsp_camera
          default: generic_rtsp_camera

    - id: p3_jetson_orin
      name: Jetson Orin — TensorRT
      name_i18n:
        zh: Jetson Orin —— TensorRT
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: >-
        Both the detector and the embedder run as TensorRT fp16 engines on the
        Orin NX's own GPU — measured on a Seeed reComputer J40 unit itself, a
        reComputer J40 integrated-machine measurement rather than a reference
        board. Detector 5.18 ms p50 / 5.28 ms p95, 99.91% box agreement with
        the CPU reference (50 images); embedder 4.23 ms p50 / 4.69 ms p95, 21
        retrieval metrics within 0.24 percentage points of fp32. A 2956-frame
        checkout replay ran through the full device-side runtime — detector,
        embedder, gallery lookup, MQTT publish — with zero dropped frames,
        which makes this the only preset where that full loop has run on
        hardware rather than stopping at model conversion. Under concurrent
        load, with both stages sharing the GPU, latency degrades to 8.76 ms
        p50 (detector) and 5.37 ms p50 (embedder) — still the fastest
        detector path measured across all presets.
      description_i18n:
        zh: >-
          检测器与嵌入器都以 TensorRT fp16 engine 跑在 Orin NX 自己的 GPU 上——
          实测于一台 Seeed reComputer J40 整机，是整机实测，不是台架。检测器 p50
          5.18 ms / p95 5.28 ms，与 CPU 参考的框一致率 99.91%（50 张）；
          嵌入器 p50 4.23 ms / p95 4.69 ms，21 项检索指标与 fp32 最大差 0.24
