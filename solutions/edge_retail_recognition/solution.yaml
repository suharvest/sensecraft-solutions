      description: >-
        Both the detector and the embedder run as fp16 `.rknn` on the
        camera's own onboard NPU — no separate camera or compute host is
        needed for recognition. Measured on the camera itself with its
        bundled applications stopped, inference only: detector 112.3 ms p50 /
        120.4 ms p95, 99.91% box agreement with the CPU reference (50
        images); embedder 77.5 ms p50 / 77.9 ms p95, mean cosine similarity
        0.998 against fp32. There is no device-side service that joins the
        two stages — this preset converts the model and proves the
        conversion on the camera, and stops there.
      description_i18n:
        zh: >-
          检测器与嵌入器都以 fp16 `.rknn` 跑在摄像头板载 NPU 上——识别不需要
          额外的摄像头或主机。测量条件：自带应用停止、纯推理。检测器 p50
          112.3 ms / p95 120.4 ms，与 CPU 参考的框一致率 99.91%（50 张）；
          嵌入器 p50 77.5 ms / p95 77.9 ms，与 fp32 的余弦相似度均值 0.998。
          没有把两段串起来的设备侧服务——这个套餐做的是转换模型、在摄像头上
