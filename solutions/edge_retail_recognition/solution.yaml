          嵌入、库检索、MQTT 上报——零掉帧，这也是本包里唯一一个把两段串起来
          在真机上跑过的套餐，而不是止步于模型转换。并发负载下（两段共享同一块
          GPU）延迟降到检测 p50 8.76 ms、嵌入 p50 5.37 ms——仍是所有套餐里最快
          的检测路径。
      device_groups:
