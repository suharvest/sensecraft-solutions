          default: recamera_pro

    - id: p2_pi5_hailo
      name: reComputer R2000 (Hailo-8) — Detector on the NPU, Embedder on the CPU
      name_i18n:
        zh: reComputer R2000（Hailo-8）—— 检测上 NPU，嵌入留 CPU
      badge: Recommended
      badge_i18n:
        zh: 推荐
      description: >-
        Both stages measured on one board of the same Hailo-8 platform — the
        detector an INT8 HEF at 9.04 ms p50 and 94.77% box agreement, the
        embedder a dynamically quantised INT8 DINOv2-small on the four CPU cores
        at 91.95 ms per crop, within 0.65 pp of its own fp32 retrieval accuracy.
        Reference values, to be updated after a re-test on the reComputer unit.
        That 92 ms is the
        number to plan around — a checkout basket of a few items is comfortable,
        a shelf frame with 160 boxes is not, and shelf use needs frame skipping
        or slot-level sampling.
      description_i18n:
        zh: >-
          两段都在同款 Hailo-8 平台的同一块板上实测。检测器是 INT8 HEF，
          p50 9.04 ms、框一致率 94.77%；嵌入器是动态量化 INT8 的 DINOv2-small，
          跑在四个 CPU 核上，单个裁剪 91.95 ms，检索准确率与自身 fp32 相差
          0.65pp 以内。以上为参考值，reComputer 整机复测后更新。
          这 92 ms 是做规划时要盯的数——收银台一次几件商品够用，货架一帧 160 个框不够用，
          货架场景需要抽帧或按货位采样。
      device_groups:
