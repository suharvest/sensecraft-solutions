server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 单页路由：/events、/gallery 直接刷新也要回 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 两组后端路由都转给 server：/api 是界面用的只读接口，
    # /v1 是注册 API，设备也走它拉 gallery。
    location /api/ {
        proxy_pass http://server:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
        proxy_pass http://server:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 注册是 multipart（3-8 张图），gallery 下载是整包 tar.gz：
        # 默认的 1m body 限制和 60s 读超时都不够。
        client_max_body_size 64m;
        proxy_read_timeout 300s;
    }
}
