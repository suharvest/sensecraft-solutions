<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Data path: camera to detector to embedder to gallery lookup to aggregation to MQTT and console">
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f7f9; stroke: #c9ced6; stroke-width: 1.5; rx: 8; }
    .card-npu { fill: #eef4ff; stroke: #8aa9e0; stroke-width: 1.5; rx: 8; }
    .card-cpu { fill: #fdf3e7; stroke: #d9ab6a; stroke-width: 1.5; rx: 8; }
    .card-console { fill: #eef8f0; stroke: #86bf95; stroke-width: 1.5; rx: 8; }
    .t { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1f2530; }
    .title { font-size: 16px; font-weight: 600; }
    .lbl { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; fill: #5a6472; }
    .port { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #5a6472; }
    .edge { stroke: #7c8698; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .edge-dash { stroke: #7c8698; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    .zone { fill: none; stroke: #d5dae2; stroke-width: 1.2; stroke-dasharray: 3 4; rx: 10; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8698"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="520"/>

  <rect class="zone" x="24" y="60" width="600" height="230"/>
  <text class="t sub" x="36" y="80">Recognition device</text>

  <rect class="zone" x="24" y="330" width="912" height="150"/>
  <text class="t sub" x="36" y="350">Console host</text>

  <rect class="card" x="44" y="140" width="120" height="80"/>
  <text class="t lbl" x="104" y="172" text-anchor="middle">Camera</text>
  <text class="t sub" x="104" y="190" text-anchor="middle">RTSP / USB</text>

  <rect class="card-npu" x="200" y="140" width="140" height="80"/>
  <text class="t lbl" x="270" y="168" text-anchor="middle">Detector</text>
  <text class="t sub" x="270" y="185" text-anchor="middle">YOLOX-Tiny, 1 class</text>
  <text class="t sub" x="270" y="200" text-anchor="middle">NPU · 640² / 1280²</text>

  <rect class="card-cpu" x="376" y="140" width="140" height="80"/>
  <text class="t lbl" x="446" y="168" text-anchor="middle">Embedder</text>
  <text class="t sub" x="446" y="185" text-anchor="middle">DINOv2 + ArcFace</text>
  <text class="t sub" x="446" y="200" text-anchor="middle">CPU · 512-d, L2</text>

  <rect class="card" x="200" y="240" width="316" height="34"/>
  <text class="t sub" x="358" y="262" text-anchor="middle">shared decode + NMS (numpy) · one implementation for every platform</text>

  <rect class="card" x="552" y="140" width="128" height="80"/>
  <text class="t lbl" x="616" y="168" text-anchor="middle">Gallery</text>
  <text class="t sub" x="616" y="185" text-anchor="middle">FAISS IndexFlatIP</text>
  <text class="t sub" x="616" y="200" text-anchor="middle">version vNNNNNN</text>

  <rect class="card" x="716" y="140" width="140" height="80"/>
  <text class="t lbl" x="786" y="164" text-anchor="middle">Aggregation</text>
  <text class="t sub" x="786" y="182" text-anchor="middle">checkout: track id</text>
  <text class="t sub" x="786" y="197" text-anchor="middle">shelf: slot ROI</text>

  <rect class="card" x="716" y="248" width="140" height="56"/>
  <text class="t lbl" x="786" y="272" text-anchor="middle">MQTT</text>
  <text class="t port" x="786" y="290" text-anchor="middle">retail/v1/events :1883</text>

  <rect class="card-console" x="44" y="370" width="180" height="80"/>
  <text class="t lbl" x="134" y="398" text-anchor="middle">Registration API</text>
  <text class="t port" x="134" y="416" text-anchor="middle">/v1/gallery/* :8089</text>
  <text class="t sub" x="134" y="432" text-anchor="middle">3–8 images per SKU</text>

  <rect class="card-console" x="260" y="370" width="180" height="80"/>
  <text class="t lbl" x="350" y="398" text-anchor="middle">Version store</text>
  <text class="t sub" x="350" y="416" text-anchor="middle">immutable · SHA256SUMS</text>
  <text class="t sub" x="350" y="432" text-anchor="middle">atomic switch · rollback</text>

  <rect class="card-console" x="476" y="370" width="180" height="80"/>
  <text class="t lbl" x="566" y="398" text-anchor="middle">Management UI</text>
  <text class="t port" x="566" y="416" text-anchor="middle">/api/* :8080</text>
  <text class="t sub" x="566" y="432" text-anchor="middle">events · board · gallery</text>

  <rect class="card-console" x="692" y="370" width="180" height="80"/>
  <text class="t lbl" x="782" y="398" text-anchor="middle">Event collector</text>
  <text class="t sub" x="782" y="416" text-anchor="middle">MQTT → SQLite</text>
  <text class="t sub" x="782" y="432" text-anchor="middle">projection, rebuildable</text>

  <path class="edge" d="M 164 180 L 196 180"/>
  <path class="edge" d="M 340 180 L 372 180"/>
  <path class="edge" d="M 516 180 L 548 180"/>
  <path class="edge" d="M 680 180 L 712 180"/>
  <path class="edge" d="M 786 220 L 786 244"/>
  <path class="edge" d="M 786 304 L 786 366"/>
  <path class="edge" d="M 270 220 L 270 236"/>
  <path class="edge" d="M 446 236 L 446 220"/>

  <path class="edge-dash" d="M 224 410 L 256 410"/>
  <path class="edge-dash" d="M 440 410 L 472 410"/>
  <path class="edge-dash" d="M 350 366 C 350 320, 616 320, 616 224"/>
  <text class="t sub" x="486" y="316" text-anchor="middle">device pulls current version, verifies SHA, switches atomically</text>
</svg>
