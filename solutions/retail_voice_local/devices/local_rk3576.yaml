version: "1.0"
id: local_rk3576
name: Local Voice Stack on reComputer RK3576
name_i18n:
  zh: reComputer RK3576 本地语音栈
type: docker_deploy

# Pinned to rk3576: the speech image carries RKNN artifacts compiled for that
# NPU and will not run elsewhere. Unlike the reRouter target, which carries no
# device_class because OpenWrt-on-CM4 exposes no useful hardware identity.
device_class: rk3576

detection:
  method: network_scan
  manual_entry: true
  requirements:
    - docker_installed
    - docker_running
    - docker_compose_installed

docker:
  compose_file: assets/docker/docker-compose.rk3576.yml
  compose_dir: assets/docker
  remote_path: /home/{{username}}/retail_voice_local

  environment:
    TZ: Asia/Shanghai
    OVS_PROFILE: rk3576-sensevoice
    OUTPUT_DIR: "{{OUTPUT_DIR}}"
    AUDIO_CARD_ID: "{{AUDIO_CARD_ID}}"
    HF_ENDPOINT: "{{HF_ENDPOINT}}"
    OVS_SPEAKER_EMB: "{{SPEAKER}}"
    OVS_PUNCT: "{{PUNCT}}"

  options:
    project_name: retail_voice_local
    remove_orphans: true
    build: false

  services:
    - name: speech
      port: 8621
      health_check_endpoint: /readyz
      required: true
    - name: voice-client
      port: 8090
      health_check_endpoint: /
      required: true

  # No `models:` block. OpenVoiceStream fetches its own artifacts on first
  # start (sha256-verified, honors HF_ENDPOINT) into named volumes.

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password
  connection_timeout: 30
  # First start downloads ~825 MB of models before the service accepts
  # connections, measured ~7 min on a 2.5 MB/s link. 2400s is that plus the
  # image pull with roughly 3x margin.
  command_timeout: 2400

pre_checks:
  - type: docker_version
    min_version: "20.0"
    description: Check Docker version
  - type: docker_compose_version
    min_version: "2.0"
    description: Check Docker Compose version
  - type: audio_device
    device_path: /dev/snd
    description: Check that an ALSA capture device is present
    description_i18n:
      zh: 检查 ALSA 采集设备是否存在
  - type: port_available
    ports:
      - 8621
      - 8090
    description: Check that the speech and client ports are free
    description_i18n:
      zh: 检查语音服务与客户端端口是否空闲
  - type: disk_space
    min_gb: 6
    description: At least 6GB for the image and model artifacts
    description_i18n:
      zh: 镜像和模型产物至少需要 6GB 空间

deploy_timeout: 2400

actions:
  before:
    - name: Verify the RKNPU driver is present
      # /dev/rknpu does NOT exist on the Seeed vendor kernel (6.1.115-vendor-
      # seeed-rk3576) — the NPU is reached through the DRM render node
      # instead. Probing for the char device gives a false negative, so check
      # the driver binding and the debugfs version node.
      run: |
        set -e
        if [ ! -d /sys/bus/platform/drivers/RKNPU ]; then
          echo "RKNPU driver not bound - this board cannot run the NPU ASR image" >&2
          exit 1
        fi
        cat /sys/kernel/debug/rknpu/version 2>/dev/null || echo "RKNPU bound (version node not readable)"
      name_i18n:
        zh: 检查 RKNPU 驱动

user_inputs:
  - id: LANGUAGE
    name: Recognition language
    name_i18n: {zh: 识别语种}
    type: select
    default: zh
    required: true
    reconfigurable: true
    description: Primary language of the transcript. SenseVoice on this board covers Chinese and English; pick the one spoken most in the store.
    description_i18n: {zh: 转写的主要语种。这块板上的 SenseVoice 覆盖中文和英文，选门店里说得最多的那个。}
    options:
      - {value: "zh", label: "Chinese", label_i18n: {zh: 中文}}
      - {value: "en", label: "English", label_i18n: {zh: 英文}}
  - id: OUTPUT_DIR
    name: Output directory
    name_i18n: {zh: 输出目录}
    type: text
    default: /home/recomputer/retail-voice
    required: true
    description: Absolute path on the device where transcripts (and audio, if kept) are written. Nothing rotates it — plan retention.
    description_i18n: {zh: 设备上写入转写结果（以及保留的音频）的绝对路径。没有轮转机制，请自行规划保留期。}
    validation:
      pattern: "^/[A-Za-z0-9._/-]+$"
      message: Use an absolute path with no spaces
  - id: SPEAKER
    name: Voiceprint labelling
    name_i18n: {zh: 声纹标注}
    type: select
    default: "1"
    required: false
    reconfigurable: true
    description: Adds a 28 MB CAM++ model and labels each utterance with a locally clustered speaker. This board has the headroom (1.71 GiB total with everything loaded, measured). Not identity verification.
    description_i18n: {zh: 增加一个 28MB 的 CAM++ 模型，为每句标注一个本地聚类出的说话人。这块板有余量（全部加载实测 1.71 GiB）。不是身份核验。}
    options:
      - {value: "1", label: "Enabled (default)", label_i18n: {zh: 开启（默认）}}
      - {value: "0", label: "Disabled", label_i18n: {zh: 关闭}}
  - id: PUNCT
    name: Punctuation
    name_i18n: {zh: 标点恢复}
    type: select
    default: "1"
    required: false
    reconfigurable: true
    description: Adds a 294 MB CT-Transformer model. Disable to cut first-boot download time and memory.
    description_i18n: {zh: 增加一个 294MB 的 CT-Transformer 模型。关闭可缩短首次启动下载时间并节省内存。}
    options:
      - {value: "1", label: "Enabled (default)", label_i18n: {zh: 开启（默认）}}
      - {value: "0", label: "Disabled", label_i18n: {zh: 关闭}}
  - id: AUDIO_CARD_ID
    name: Microphone card ID
    name_i18n: {zh: 麦克风声卡编号}
    type: text
    default: "1"
    required: true
    description: ALSA card number of the reSpeaker XVF3800. Run `arecord -l` on the device; the array shows as ArrayUAC10.
    description_i18n: {zh: reSpeaker XVF3800 的 ALSA 声卡编号。在设备上运行 `arecord -l`，阵列显示为 ArrayUAC10。}
    validation:
      pattern: "^[0-9]+$"
      message: Card ID is a number
  - id: HF_ENDPOINT
    name: Model download source
    name_i18n: {zh: 模型下载源}
    type: select
    default: https://hf-mirror.com
    required: false
    reconfigurable: true
    description: Where model artifacts are fetched from on first start. Only used once; afterwards the box needs no internet.
    description_i18n: {zh: 首次启动时下载模型产物的来源。只用这一次，之后设备不需要联网。}
    options:
      - {value: "https://hf-mirror.com", label: "HF Mirror (China)", label_i18n: {zh: HF 镜像（国内）}}
      - {value: "https://huggingface.co", label: "Hugging Face", label_i18n: {zh: Hugging Face 官方}}

remote_overrides:
  remote_path: /home/{{username}}/retail_voice_local
  compose_dir: assets/docker
  detection:
    method: network_scan
    manual_entry: true
  environment:
    TZ: Asia/Shanghai
    OVS_PROFILE: rk3576-sensevoice
    OUTPUT_DIR: "{{OUTPUT_DIR}}"
    AUDIO_CARD_ID: "{{AUDIO_CARD_ID}}"
    HF_ENDPOINT: "{{HF_ENDPOINT}}"
    OVS_SPEAKER_EMB: "{{SPEAKER}}"
    OVS_PUNCT: "{{PUNCT}}"
  services:
    - name: speech
      port: 8621
      health_check_endpoint: /readyz
      required: true
    - name: voice-client
      port: 8090
      health_check_endpoint: /
      required: true
  actions:
    before:
      - name: Verify the RKNPU driver is present
        run: |
          set -e
          if [ ! -d /sys/bus/platform/drivers/RKNPU ]; then
            echo "RKNPU driver not bound - this board cannot run the NPU ASR image" >&2
            exit 1
          fi
          cat /sys/kernel/debug/rknpu/version 2>/dev/null || echo "RKNPU bound (version node not readable)"
        name_i18n:
          zh: 检查 RKNPU 驱动
      - name: Create the output directory
        run: mkdir -p "{{OUTPUT_DIR}}/cache/asr" "{{OUTPUT_DIR}}/voice" "{{OUTPUT_DIR}}/voiceprints"
        name_i18n:
          zh: 创建输出目录
      - name: Confirm the microphone array enumerated
        # 2886:001a is the reSpeaker XVF3800. On this board the Type-C port is
        # dual-role and may sit in device mode, in which case nothing
        # enumerates — use a USB-A host port.
        run: |
          lsusb 2>/dev/null | grep -i '2886:001a' || echo "reSpeaker XVF3800 not seen on USB - move it to a USB-A host port"
          arecord -l 2>/dev/null || true
        ignore_error: true
        name_i18n:
          zh: 确认麦克风阵列已枚举
    after_upload:
      - name: Write the recognition language and voiceprint switch into the client config
        run: |
          set -e
          CFG=$(find /home/{{username}}/retail_voice_local -type f -name voice-client.yaml -path '*config*' 2>/dev/null | head -1)
          [ -n "$CFG" ] || { echo "voice-client.yaml not found under the deploy directory" >&2; exit 1; }
          if [ "{{SPEAKER}}" = "1" ]; then SPK=true; else SPK=false; fi
          sed -i "s|__LANGUAGE__|{{LANGUAGE}}|; s|__AUDIO_CARD_ID__|{{AUDIO_CARD_ID}}|; s|__SPEAKER_ENABLED__|$SPK|" "$CFG"
          grep -n 'default_language\|card_id\|enabled:' "$CFG" | head -5
        name_i18n:
          zh: 把识别语种和声纹开关写入客户端配置
    after:
      - name: Confirm the NPU backend actually loaded
        # `backend` must read rk:sensevoice_rknn. Anything else means the NPU
        # path did not load and the board fell back to something slower.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8621/readyz >/dev/null 2>&1; then break; fi
            sleep 15
          done
          curl -fsS http://127.0.0.1:8621/readyz || echo "speech service not ready yet - first boot downloads ~825 MB"
        ignore_error: true
        name_i18n:
          zh: 确认 NPU 后端已加载
  user_inputs:
    - {id: host, name: Device IP, type: text, required: true, name_i18n: {zh: 设备 IP}}
    - {id: username, name: SSH Username, type: text, default: recomputer, required: true, name_i18n: {zh: SSH 用户名}}
    - {id: password, name: SSH Password, type: password, required: true, name_i18n: {zh: SSH 密码}}

post_deployment:
  open_browser: true
  url: "http://{{host}}:8090"
