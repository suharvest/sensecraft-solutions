# Image: published nrd-parking-rk:20261009, pinned by digest (override with PARKING_IMAGE).
# config/plate.json (vb.config/1) is rendered by the after_upload step.
# Host library defaults match reComputer RK3588/RK3576 Debian images; the
# "before" step checks they exist and the PARKING_* variables override them.
services:
  edge-parking:
    image: ${PARKING_IMAGE:-sensecraft-missionpack.seeed.cn/solution/nrd-parking-rk:20261009@sha256:af0e3d258ab9cb838f6c87c869586918f70500726df0623ab225e65cb0f39ff8}
    container_name: ${PARKING_CONTAINER_NAME:-edge-parking-plate-rk3576}
    restart: unless-stopped
    privileged: true
    network_mode: host
    devices:
      - "${PARKING_DRI_DEVICE:-/dev/dri}:/dev/dri"
    environment:
      GST_PLUGIN_PATH: "/opt/vb/host-gst"
      GST_PLUGIN_SYSTEM_PATH: "/usr/lib/aarch64-linux-gnu/gstreamer-1.0"
      LD_LIBRARY_PATH: "/opt/vb/host-gst-runtime:/opt/vb/lib:/opt/vb/host-libs:/usr/lib/aarch64-linux-gnu:/usr/lib"
      GST_REGISTRY_1_0: "/tmp/gst-registry.bin"
    tmpfs:
      - /root/.cache
    volumes:
      - ./config/plate.json:/config/config.json:ro
      - ${PARKING_MODELS_DIR:-./models}:/models:ro
      - ${PARKING_DATA_DIR:-./data}:/data/edge-parking
      - ${PARKING_MPP_PLUGIN:-/lib/aarch64-linux-gnu/gstreamer-1.0/libgstrockchipmpp.so}:/opt/vb/host-gst/libgstrockchipmpp.so:ro
      - ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/gstreamer-1.0/libgstvideoparsersbad.so:/opt/vb/host-gst/libgstvideoparsersbad.so:ro
      - ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/libgstreamer-1.0.so.0:/opt/vb/host-gst-runtime/libgstreamer-1.0.so.0:ro
      - ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/libgstbase-1.0.so.0:/opt/vb/host-gst-runtime/libgstbase-1.0.so.0:ro
      - ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/libgstvideo-1.0.so.0:/opt/vb/host-gst-runtime/libgstvideo-1.0.so.0:ro
      - ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/libgstallocators-1.0.so.0:/opt/vb/host-gst-runtime/libgstallocators-1.0.so.0:ro
      - ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/libgstcodecparsers-1.0.so.0:/usr/lib/aarch64-linux-gnu/libgstcodecparsers-1.0.so.0:ro
      - ${PARKING_MPP_LIB:-/usr/lib/aarch64-linux-gnu/librockchip_mpp.so.1}:/usr/lib/aarch64-linux-gnu/librockchip_mpp.so.1:ro
      - ${PARKING_RGA_LIB:-/usr/lib/aarch64-linux-gnu/librga.so.2}:/opt/vb/host-libs/librga.so.2:ro
      - ${PARKING_RGA_LIB:-/usr/lib/aarch64-linux-gnu/librga.so.2}:/usr/lib/aarch64-linux-gnu/librga.so.2:ro
      - ${PARKING_RKNNRT_LIB:-/usr/lib/librknnrt.so}:/opt/vb/host-libs/librknnrt.so:ro
    command: ["--config", "/config/config.json"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
