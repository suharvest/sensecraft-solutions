# DRAFT — 镜像 edge-parking-hailo 待 NRD-2 X4 产出（FROM vision-base-hailo，
# 镜像内不含 HailoRT，libhailort 由宿主挂载），tag 待回填；
# config/plate.json 由部署步 after_upload 渲染。
services:
  edge-parking:
    image: sensecraft/edge-parking-hailo:0.1.0-draft
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
      - ./config:/config
      - ./data:/data
    command: ["--config", "/config/plate.json"]
