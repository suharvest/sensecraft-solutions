# DRAFT — image is supplied as a locally built artifact; no public image is implied.
services:
  edge-parking:
    image: ${PARKING_IMAGE:?set PARKING_IMAGE to a locally built parking image}
    pull_policy: never
    runtime: nvidia
    ipc: host
    network_mode: host
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      LD_LIBRARY_PATH: /usr/local/cuda/lib64:/host-nvidia:/host-trt:/usr/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu/nvidia
      GST_PLUGIN_PATH: /usr/lib/aarch64-linux-gnu/gstreamer-1.0
    volumes:
      - /usr/lib/aarch64-linux-gnu/libnvinfer.so.10:/host-trt/libnvinfer.so.10:ro
      - /usr/lib/aarch64-linux-gnu/libnvinfer_plugin.so.10:/host-trt/libnvinfer_plugin.so.10:ro
      - /usr/lib/aarch64-linux-gnu/libnvonnxparser.so.10:/host-trt/libnvonnxparser.so.10:ro
      - /usr/local/cuda:/usr/local/cuda:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/host-nvidia:ro
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvvideo4linux2.so:/usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvvideo4linux2.so:ro
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvvidconv.so:/usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvvidconv.so:ro
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvcodec.so:/usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgstnvcodec.so:ro
      - /usr/lib/aarch64-linux-gnu/libEGL.so.1:/usr/lib/aarch64-linux-gnu/libEGL.so.1:ro
      - /usr/lib/aarch64-linux-gnu/libGLdispatch.so.0:/usr/lib/aarch64-linux-gnu/libGLdispatch.so.0:ro
      - /usr/lib/aarch64-linux-gnu/libGLESv2.so.2:/usr/lib/aarch64-linux-gnu/libGLESv2.so.2:ro
      - /usr/lib/aarch64-linux-gnu/libdrm.so.2:/usr/lib/aarch64-linux-gnu/libdrm.so.2:ro
      - ${PARKING_CONFIG:?set PARKING_CONFIG to a vb.config/1 JSON}:/config/config.json:ro
      - ${PARKING_MODELS_DIR:?set PARKING_MODELS_DIR to the target-device engine directory}:/models:ro
      - ${PARKING_DATA_DIR:-./data}:/data/edge-parking
    command: ["--config", "/config/config.json"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PARKING_HEALTH_PORT:-8099}/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
