version: "1.0"
id: dashboard
name: Open the Recognition Preview
type: web_dashboard

# 识别端 HTTP 端口（部署步骤的 http_port，默认 8080；NRD-3 §5.1 http_app）：/preview 为实时画面叠加车牌框，
# 快照可通过 /snapshots/{seq}.jpg 按事件里的 URL 取回。
# 自带 host 输入（默认取上游部署步的主机），各 preset 共用本文件。
web_dashboard:
  url: "http://{{host}}:{{http_port}}/preview"
  title: Plate Recognition Preview
  title_i18n:
    zh: 车牌识别预览
  description: Live camera view with plate boxes and the latest recognized plates.
  description_i18n:
    zh: 实时摄像头画面，叠加车牌框和最新识别结果。

user_inputs:
  - id: host
    name: Recognition Host IP
    type: text
    default: "127.0.0.1"
    default_template: "{{host}}"
    required: true
    name_i18n:
      zh: 识别主机 IP
  - id: http_port
    name: Preview port
    name_i18n: {zh: 预览页端口}
    type: text
    default: "8080"
    default_template: "{{http_port}}"
    required: true
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    description: Filled in from the preview port in the deploy step.
    description_i18n: {zh: 自动带入部署步骤里的「预览页端口」。}

name_i18n:
  zh: 打开识别预览
