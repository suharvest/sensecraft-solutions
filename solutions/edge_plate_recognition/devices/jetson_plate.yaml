version: "1.0"
id: jetson_plate
name: NVIDIA Jetson Plate Recognition
type: docker_deploy

# DRAFT（NRD-3 Y2 未验收）。
# - 运行镜像默认用已发布的 nrd-parking-jetson:20261008（按 digest 固定）。
# - TensorRT engine 来自已发布的 plate_jetson_orin_nano 模型包（Orin Nano / JetPack 6.2.1 / TRT 10.3 构建）。

device_class: jetson

docker:
  compose_file: assets/jetson/docker-compose.yml
  compose_dir: assets/jetson
  options:
    project_name: edge_plate
    remove_orphans: true
  environment:
    PARKING_IMAGE: "{{parking_image}}"
    PARKING_CONFIG: "{{config_path}}"
    PARKING_MODELS_DIR: "/home/{{username}}/edge-parking/jetson_plate/models"
    PARKING_HEALTH_PORT: "{{health_port}}"
    PARKING_MEMORY_LIMIT: "{{memory_limit}}"
    PARKING_DATA_DIR: "{{data_dir}}"
  services:
    - name: edge-parking
      required: true

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password
  connection_timeout: 30
  # 首次部署含 TensorRT 引擎构建（检测 + 识别两个 engine），预算放宽。
  command_timeout: 3600

pre_checks:
  - type: disk_space
    min_gb: 0.5
    description: Cached/pre-staged image, detector/recognizer TensorRT engines are supplied before deployment; keep at least 0.5 GiB free for runtime files, logs, snapshots and metadata. This is not a capacity or accuracy acceptance guarantee.
  - type: nvidia_runtime
    description: Check the NVIDIA container runtime is available

deploy_timeout: 3600

post_deployment:
  open_browser: false

files:
  # plate_jetson_orin_nano: 11238840 bytes, published 2026-10-08; after_upload unpacks it into models/.
  - url: https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/plate_jetson_orin_nano-a5e0e456c945.tar.gz
    remote_path: /home/{{username}}/edge-parking/jetson_plate/models/plate_jetson_orin_nano-a5e0e456c945.tar.gz
    checksum:
      sha256: a5e0e456c945256a6dee8e614cfcfd9cb10380b3459504d0d1fccd5e5d16d64d
actions:
  before:
    - name: Validate Jetson runtime
      run: |
        set -e
        if [ ! -f /etc/nv_tegra_release ]; then
          echo "This target is not a NVIDIA Jetson (no /etc/nv_tegra_release)" >&2
          exit 1
        fi
        head -1 /etc/nv_tegra_release
        if ! docker info 2>/dev/null | grep -qi nvidia; then
          echo "WARNING: nvidia runtime missing — inference will fail" >&2
          echo "Run: sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker" >&2
        fi
        echo "Jetson runtime OK"
      name_i18n:
        zh: 校验 Jetson 运行环境

  after:
    - name: Wait for the plate recognition service readiness endpoint
      name_i18n:
        zh: 等待车牌识别服务就绪接口
      timeout: 130
      ignore_error: false
      env:
        PARKING_HEALTH_PORT: "{{health_port}}"
        PARKING_HEALTH_DEADLINE_SECONDS: "120"
      run: |
        set -e
        python3 - <<'PY'
        import json
        import math
        import os
        import signal
        import time
        import urllib.error
        import urllib.request

        raw_port = os.environ.get("PARKING_HEALTH_PORT", "")
        try:
            port = int(raw_port)
        except (TypeError, ValueError):
            print("Invalid PARKING_HEALTH_PORT: expected an integer", flush=True)
            raise SystemExit(2)
        if not 1 <= port <= 65535:
            print("Invalid PARKING_HEALTH_PORT: expected 1..65535", flush=True)
            raise SystemExit(2)
        try:
            deadline_seconds = float(os.environ.get("PARKING_HEALTH_DEADLINE_SECONDS", "120"))
        except ValueError:
            print("Invalid PARKING_HEALTH_DEADLINE_SECONDS", flush=True)
            raise SystemExit(2)
        if not math.isfinite(deadline_seconds) or deadline_seconds <= 0:
            print("Invalid PARKING_HEALTH_DEADLINE_SECONDS: expected a positive value", flush=True)
            raise SystemExit(2)

        url = f"http://127.0.0.1:{port}/healthz"
        opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
        deadline = time.monotonic() + deadline_seconds
        last_reason = "no response"

        def request_timeout(_signum, _frame):
            raise TimeoutError("request budget expired")

        signal.signal(signal.SIGALRM, request_timeout)
        while time.monotonic() < deadline:
            request_budget = min(2.0, deadline - time.monotonic())
            if request_budget <= 0:
                break
            try:
                request = urllib.request.Request(url, method="GET")
                signal.setitimer(signal.ITIMER_REAL, request_budget)
                with opener.open(request, timeout=request_budget) as response:
                    if response.status != 200:
                        last_reason = f"HTTP {response.status}"
                    else:
                        try:
                            payload = response.read(1024 * 1024 + 1)
                            if len(payload) > 1024 * 1024:
                                last_reason = "HTTP 200 response exceeds 1 MiB"
                                continue
                            body = json.loads(payload.decode("utf-8"))
                        except (UnicodeDecodeError, json.JSONDecodeError):
                            last_reason = "HTTP 200 with non-JSON response"
                        else:
                            if (time.monotonic() < deadline
                                    and isinstance(body, dict)
                                    and body.get("status") == "ok"):
                                print(f"Readiness confirmed at {url}", flush=True)
                                raise SystemExit(0)
                            last_reason = "HTTP 200 JSON status is not ok"
            except urllib.error.HTTPError as error:
                last_reason = f"HTTP {error.code}"
            except (urllib.error.URLError, TimeoutError, OSError) as error:
                last_reason = f"connection error: {error.__class__.__name__}"
            finally:
                signal.setitimer(signal.ITIMER_REAL, 0)
            remaining = deadline - time.monotonic()
            if remaining > 0:
                time.sleep(min(0.5, remaining))

        print(f"Readiness check failed after {deadline_seconds:g}s: {last_reason}", flush=True)
        raise SystemExit(1)
        PY

  after_upload:
    - name: Fetch and unpack the model bundle
      name_i18n: {zh: 获取并解包模型包}
      timeout: 1800
      run: |
        set -eu
        MODELS_DIR="/home/{{username}}/edge-parking/jetson_plate/models"
        BUNDLE="plate_jetson_orin_nano-a5e0e456c945.tar.gz"
        BUNDLE_SHA="a5e0e456c945256a6dee8e614cfcfd9cb10380b3459504d0d1fccd5e5d16d64d"
        URL="https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/plate_jetson_orin_nano-a5e0e456c945.tar.gz"
        mkdir -p "$MODELS_DIR"
        have_models() {
          echo "a4e92ac4f13f96fedd53d57454902aa7e0aaeb3cedc636cebddab7da384e2cef  $MODELS_DIR/plate_det_yolox_tiny_640_fp16.engine" | sha256sum -c - >/dev/null 2>&1 || return 1
          echo "898b3afcab5bf9a4e68608d4e0d5b869d471df4e7a36975b64228de0ea0863a9  $MODELS_DIR/plate_rec_cn_96x32_fp16.engine" | sha256sum -c - >/dev/null 2>&1 || return 1
        }
        if have_models; then
          echo "Model files already present"
        else
          if ! echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE" | sha256sum -c - >/dev/null 2>&1; then
            # files: 字段在 after_upload 之前放好 bundle；本地部署与不认 files: 的老引擎走这里的下载兜底。
            curl -fSL --retry 3 -o "$MODELS_DIR/$BUNDLE.part" "$URL"
            echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE.part" | sha256sum -c -
            mv -f "$MODELS_DIR/$BUNDLE.part" "$MODELS_DIR/$BUNDLE"
          fi
          tar -xzf "$MODELS_DIR/$BUNDLE" --no-same-owner --strip-components=1 -C "$MODELS_DIR"
          echo "a4e92ac4f13f96fedd53d57454902aa7e0aaeb3cedc636cebddab7da384e2cef  $MODELS_DIR/plate_det_yolox_tiny_640_fp16.engine" | sha256sum -c -
          echo "898b3afcab5bf9a4e68608d4e0d5b869d471df4e7a36975b64228de0ea0863a9  $MODELS_DIR/plate_rec_cn_96x32_fp16.engine" | sha256sum -c -
        fi
        ls -l "$MODELS_DIR"
    - name: Write the plate recognition config
      # 渲染 vb.config/1 预设 plate.json 的实例配置：站点、流、broker。
      # 检测/识别 engine 路径与构建动作待 Y2 回填。
      env:
        SITE_ID: '{{site_id}}'
        CAMERA_ID: '{{camera_id}}'
        RTSP_URL: '{{rtsp_url}}'
        MQTT_HOST: '{{mqtt_host}}'
        MQTT_PORT: '{{mqtt_port}}'
        MQTT_USERNAME: '{{mqtt_username}}'
        MQTT_PASSWORD: '{{mqtt_password}}'
        CONFIG_PATH: '{{config_path}}'
      run: |
        set -e
        CONFIG="${CONFIG_PATH}"
        if [ -z "$CONFIG" ] || [ ! -f "$CONFIG" ]; then
          echo "Required config_path does not exist: $CONFIG" >&2
          exit 1
        fi
        python3 - "$CONFIG" <<'PY'
        import json, os, sys

        path = sys.argv[1]
        with open(path) as handle:
            config = json.load(handle)

        site_id = os.environ["SITE_ID"]
        camera_id = os.environ["CAMERA_ID"]
        mqtt_port = int(os.environ["MQTT_PORT"])
        device_id = f"{site_id}-{camera_id}"
        app = config.setdefault("app", {}).setdefault("options", {})
        config["device_id"] = device_id
        config["state_dir"] = "/data/edge-parking"
        app["site_id"] = site_id
        mqtt = config.setdefault("mqtt", {})
        mqtt["host"] = os.environ["MQTT_HOST"]
        mqtt["port"] = mqtt_port
        mqtt["client_id"] = device_id
        mqtt["username"] = os.environ.get("MQTT_USERNAME", "")
        mqtt["password"] = os.environ.get("MQTT_PASSWORD", "")
        mqtt["topic_root"] = f"{site_id}/parking/{device_id}"
        app.setdefault("mqtt", {})["host"] = os.environ["MQTT_HOST"]
        app["mqtt"]["port"] = mqtt_port
        app["mqtt"]["username"] = os.environ.get("MQTT_USERNAME", "")
        app["mqtt"]["password"] = os.environ.get("MQTT_PASSWORD", "")
        config["streams"] = [{
            "stream_id": camera_id,
            "url": os.environ["RTSP_URL"],
            "name": "",
            "transport": "tcp",
            "score_threshold": None,
            "options": {},
        }]

        tmp = path + ".tmp"
        with open(tmp, "w") as handle:
            json.dump(config, handle, indent=2, ensure_ascii=False)
            handle.write("\n")
        os.replace(tmp, path)
        print(f"site_id = {app['site_id']}")
        print(f"stream  = {config['streams'][0]['stream_id']}")
        PY
      name_i18n:
        zh: 写入车牌识别配置


user_inputs:
  - id: rtsp_url
    name: Camera RTSP URL
    type: text
    required: true
    placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
    description: Test this address in VLC first — a wrong path or wrong credentials is the most common failure
    name_i18n:
      zh: 摄像头 RTSP 地址
    description_i18n:
      zh: 先用 VLC 测一下这个地址——路径或用户名密码写错是最常见的失败原因
  - id: site_id
    name: Site ID
    type: text
    default: "demo-lot"
    required: true
    description: First MQTT topic segment — one per parking site
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 站点编号
    description_i18n:
      zh: MQTT 主题第一段——一个停车场一个
  - id: camera_id
    name: Camera ID
    type: text
    default: "gate-a"
    required: true
    description: Identifies this lane/camera in events and topics
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 摄像头编号
    description_i18n:
      zh: 在事件与主题里标识这条车道/这台摄像头
  - id: mqtt_host
    name: MQTT Broker Host
    type: text
    required: true
    placeholder: "192.168.1.50"
    description: Usually the reComputer R1124-10 that runs the gate service
    name_i18n:
      zh: MQTT 服务器地址
    description_i18n:
      zh: 通常是跑开闸服务的 reComputer R1124-10
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    name_i18n:
      zh: MQTT 端口
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    description: Leave empty if the broker allows anonymous clients
    name_i18n:
      zh: MQTT 用户名
    description_i18n:
      zh: broker 允许匿名连接就留空
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    name_i18n:
      zh: MQTT 密码

  - id: parking_image
    name: Parking image
    name_i18n: {zh: 停车镜像}
    type: text
    default: "sensecraft-missionpack.seeed.cn/solution/nrd-parking-jetson:20261008@sha256:e5f8e6bdfa356dbef23645ce9510365cef8588fd13fbc88c4201e0c67b716d2c"
    required: false
    description: Published runtime image pinned by digest (2026-10-08). Keep the default unless you are testing another reviewed build.
    description_i18n: {zh: 已发布的运行镜像（2026-10-08，按 digest 固定）。除非在测试其他已审查构建，否则保持默认值。}
  - id: config_path
    name: Host config path
    name_i18n: {zh: 宿主机配置路径}
    type: text
    required: true
    description: Path to the vb.config/1 JSON rendered for this camera and MQTT broker.
    description_i18n: {zh: 针对本摄像头和 MQTT broker 渲染的 vb.config/1 JSON 路径。}
  - id: health_port
    name: Health port
    name_i18n: {zh: 健康端口}
    type: text
    default: "8099"
    required: false
    description: HTTP health port exposed by the mounted config (health.port). Keep 8099 for the stock config; use the configured port when it differs or 8099 is already taken on the host.
    description_i18n: {zh: 挂载配置（health.port）暴露的 HTTP 健康端口。默认配置使用 8099；配置了其他端口或宿主机 8099 已被占用时填写对应值。}
  - id: memory_limit
    name: Container memory limit
    name_i18n: {zh: 容器内存上限}
    type: text
    default: "0"
    required: false
    description: Docker memory limit such as 768m; 0 leaves the service without a Compose cgroup limit.
    description_i18n: {zh: Docker 内存上限，例如 768m；0 表示 Compose 不设置 cgroup 上限。}
  - id: data_dir
    name: Persistent data directory
    name_i18n: {zh: 持久化数据目录}
    type: text
    default: "./data"
    required: false
    description: Existing writable host directory for restart-persistent state and plate snapshots; it is mounted at /data/edge-parking.
    description_i18n: {zh: 已存在且可写的宿主机目录，用于重启后保留状态和车牌快照；该目录挂载到 /data/edge-parking。}

remote_overrides:
  remote_path: /home/{{username}}/edge-parking
  compose_dir: assets/jetson
  environment:
    PARKING_IMAGE: "{{parking_image}}"
    PARKING_CONFIG: "{{config_path}}"
    PARKING_MODELS_DIR: "/home/{{username}}/edge-parking/jetson_plate/models"
    PARKING_HEALTH_PORT: "{{health_port}}"
    PARKING_MEMORY_LIMIT: "{{memory_limit}}"
    PARKING_DATA_DIR: "{{data_dir}}"
  detection:
    method: network_scan
    manual_entry: true
  # Remote view replaces the base inputs wholesale (same semantics as
  # recamera_heatmap_grafana), so it must carry the full set: app inputs
  # plus the SSH connection fields.
  user_inputs:
    - id: parking_image
      name: Parking image
      name_i18n: {zh: 停车镜像}
      type: text
      default: "sensecraft-missionpack.seeed.cn/solution/nrd-parking-jetson:20261008@sha256:e5f8e6bdfa356dbef23645ce9510365cef8588fd13fbc88c4201e0c67b716d2c"
      required: false
      description: Published runtime image pinned by digest (2026-10-08). Keep the default unless you are testing another reviewed build.
      description_i18n: {zh: 已发布的运行镜像（2026-10-08，按 digest 固定）。除非在测试其他已审查构建，否则保持默认值。}
