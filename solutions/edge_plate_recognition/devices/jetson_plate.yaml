    - id: memory_limit
      name: Container memory limit
      name_i18n: {zh: 容器内存上限}
      type: text
      default: "0"
      required: false
      description: Docker memory limit such as 768m; 0 leaves the service without a Compose cgroup limit.
      description_i18n: {zh: Docker 内存上限，例如 768m；0 表示 Compose 不设置 cgroup 上限。}
    - id: data_dir
