version: "1.0"
id: jetson_plate
name: NVIDIA Jetson Plate Recognition
type: docker_deploy

# DRAFT（NRD-3 Y2 未验收）。
# - 运行镜像 edge-parking-jetson（FROM vision-base-jetson）待 NRD-2 X2 产出，
#   assets/jetson/docker-compose.yml 里的 tag 待回填。
# - 三个 ONNX 待 NRD-3 P5/P6 训练导出、上传 CDN（人工）；URL 为预期文件名，
#   sha256 待产出后回填。
# - TensorRT 引擎在设备上首次部署时构建（Y2 build_engine.sh --model 列表），
#   构建动作待 Y2 任务回填到 remote_overrides.actions.after_upload。

device_class: jetson

docker:
  compose_file: assets/jetson/docker-compose.yml
  compose_dir: assets/jetson
  options:
    project_name: edge_plate
    remove_orphans: true
  services:
    - name: edge-parking
      required: true

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password
  connection_timeout: 30
  # 首次部署含 TensorRT 引擎构建（检测 + 识别两个 engine），预算放宽。
  command_timeout: 3600

pre_checks:
  - type: disk_space
    min_gb: 10
    description: Models, TensorRT engines and the container image live on the device
  - type: nvidia_runtime
    description: Check the NVIDIA container runtime is available

deploy_timeout: 3600

post_deployment:
  open_browser: false

files:
  # 待回填：NRD-3 P5/P6 产出后上传（solution-assets skill，人工），sha256 回填。
  - url: https://sensecraft-statics.seeed.cc/solution-app/edge_parking/models/plate_det_yolox_tiny_640.onnx
    remote_path: /home/{{username}}/edge-parking/jetson_plate/models/plate_det_yolox_tiny_640.onnx
  - url: https://sensecraft-statics.seeed.cc/solution-app/edge_parking/models/plate_rec_cn_96x32.onnx
    remote_path: /home/{{username}}/edge-parking/jetson_plate/models/plate_rec_cn_96x32.onnx
  - url: https://sensecraft-statics.seeed.cc/solution-app/edge_parking/models/plate_rec_de_96x32.onnx
    remote_path: /home/{{username}}/edge-parking/jetson_plate/models/plate_rec_de_96x32.onnx

remote_overrides:
  remote_path: /home/{{username}}/edge-parking
  compose_dir: assets/jetson
  detection:
    method: network_scan
    manual_entry: true

  actions:
    before:
      - name: Validate Jetson runtime
        run: |
          set -e
          if [ ! -f /etc/nv_tegra_release ]; then
            echo "This target is not a NVIDIA Jetson (no /etc/nv_tegra_release)" >&2
            exit 1
          fi
          head -1 /etc/nv_tegra_release
          if ! docker info 2>/dev/null | grep -qi nvidia; then
            echo "WARNING: nvidia runtime missing — inference will fail" >&2
            echo "Run: sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker" >&2
          fi
          echo "Jetson runtime OK"
        name_i18n:
          zh: 校验 Jetson 运行环境

    after_upload:
      - name: Write the plate recognition config
        # 渲染 vb.config/1 预设 plate.json 的实例配置：站点、流、broker。
        # 检测/识别 engine 路径与构建动作待 Y2 回填。
        run: |
          set -e
          WORKDIR="/home/{{username}}/edge-parking/jetson_plate"
          CONFIG="$WORKDIR/config/plate.json"
          python3 - "$CONFIG" <<'PY'
          import json, os, sys

          path = sys.argv[1]
          with open(path) as handle:
              config = json.load(handle)

          app = config.setdefault("app", {}).setdefault("options", {})
          app["site_id"] = "{{site_id}}"
          app.setdefault("mqtt", {})["host"] = "{{mqtt_host}}"
          app["mqtt"]["port"] = int("{{mqtt_port}}")
          app["mqtt"]["username"] = "{{mqtt_username}}"
          app["mqtt"]["password"] = "{{mqtt_password}}"
          config["streams"] = [{
              "id": "{{camera_id}}",
              "rtsp_url": "{{rtsp_url}}",
              "enabled": True,
          }]

          tmp = path + ".tmp"
          with open(tmp, "w") as handle:
              json.dump(config, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          os.replace(tmp, path)
          print(f"site_id = {app['site_id']}")
          print(f"stream  = {config['streams'][0]['id']}")
          PY
        name_i18n:
          zh: 写入车牌识别配置

  user_inputs:
    - id: host
      name: Jetson IP
      type: text
      required: true
      placeholder: "192.168.1.100"
      name_i18n:
        zh: Jetson IP
    - id: username
      name: SSH Username
      type: text
      default: recomputer
      required: true
      description: "Common defaults: recomputer (Seeed reComputer J30 / J40 series), nvidia, or ubuntu."
      name_i18n:
        zh: SSH 用户名
      description_i18n:
        zh: "常见默认值：recomputer（Seeed reComputer J30 / J40 系列）、nvidia 或 ubuntu。"
    - id: password
      name: SSH Password
      type: password
      required: true
      name_i18n:
        zh: SSH 密码
    - id: rtsp_url
      name: Camera RTSP URL
      type: text
      required: true
      placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
      description: Test this address in VLC first — a wrong path or wrong credentials is the most common failure
      name_i18n:
        zh: 摄像头 RTSP 地址
      description_i18n:
        zh: 先用 VLC 测一下这个地址——路径或用户名密码写错是最常见的失败原因
    - id: site_id
      name: Site ID
      type: text
      default: "demo-lot"
      required: true
      description: First MQTT topic segment — one per parking site
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
      name_i18n:
        zh: 站点编号
      description_i18n:
        zh: MQTT 主题第一段——一个停车场一个
    - id: camera_id
      name: Camera ID
      type: text
      default: "gate-a"
      required: true
      description: Identifies this lane/camera in events and topics
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
      name_i18n:
        zh: 摄像头编号
      description_i18n:
        zh: 在事件与主题里标识这条车道/这台摄像头
    - id: mqtt_host
      name: MQTT Broker Host
      type: text
      required: true
      placeholder: "192.168.1.50"
      description: Usually the reComputer R1124-10 that runs the gate service
      name_i18n:
        zh: MQTT 服务器地址
      description_i18n:
        zh: 通常是跑开闸服务的 reComputer R1124-10
    - id: mqtt_port
      name: MQTT Port
      type: text
      default: "1883"
      required: true
      name_i18n:
        zh: MQTT 端口
    - id: mqtt_username
      name: MQTT Username
      type: text
      required: false
      description: Leave empty if the broker allows anonymous clients
      name_i18n:
        zh: MQTT 用户名
      description_i18n:
        zh: broker 允许匿名连接就留空
    - id: mqtt_password
      name: MQTT Password
      type: password
      required: false
      name_i18n:
        zh: MQTT 密码

name_i18n:
  zh: NVIDIA Jetson 车牌识别
