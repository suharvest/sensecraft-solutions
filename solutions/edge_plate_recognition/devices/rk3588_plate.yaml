            /lib/aarch64-linux-gnu/libgstcodecparsers-1.0.so.0 \
            /lib/aarch64-linux-gnu/gstreamer-1.0/libgstvideoparsersbad.so; do
            if [ -e "$f" ]; then echo "found $f"; else echo "missing $f" >&2; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Install the RKNN runtime (rknpu2), Rockchip MPP/RGA and gstreamer1.0-plugins-bad + gstreamer1.0-rockchip on this board first" >&2
            exit 1
          fi
          echo "AI and video decoding components OK"

    after_upload:
      - name: Download the recognition models
        name_i18n: {zh: 下载识别模型}
        timeout: 1800
        run: |
          set -eu
          # Remote: compose_dir is uploaded to {remote_path}/{device id}; local: the
