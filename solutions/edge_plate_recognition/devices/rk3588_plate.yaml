version: "1.0"
id: rk3588_plate
name: reComputer RK3588 Plate Recognition
type: docker_deploy

# DRAFT（NRD-3 Y3 未验收）。
# - 运行镜像 edge-parking-rk（FROM vision-base-rk）待 NRD-2 X3 产出，
#   assets/rk3588/docker-compose.yml 现用已发布的 nrd-parking-rk:20261008（按 digest 固定）。
# - 三个 .rknn 待 Y3 转换任务产出（edge-parking-rknn-convert:2.3.2 容器，
#   --target rk3588 --quant int8；识别 parity < 0.98 时改 fp16 重转，文件名
#   相应变化），sha256 待产出后回填。

docker:
  compose_file: assets/rk3588/docker-compose.yml
  compose_dir: assets/rk3588
  options:
    project_name: edge_plate
    remove_orphans: true
  services:
    - name: edge-parking
      required: true

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password
  connection_timeout: 30
  command_timeout: 600

pre_checks:
  - type: disk_space
    min_gb: 6
    description: RKNN models and the container image live on the device

post_deployment:
  open_browser: false

files:
  # plate_rk3588: 5297484 bytes, published 2026-10-08; after_upload unpacks it into models/.
  - url: https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/plate_rk3588-1ea1864826a2.tar.gz
    remote_path: /home/{{username}}/edge-parking/rk3588_plate/models/plate_rk3588-1ea1864826a2.tar.gz
    checksum:
      sha256: 1ea1864826a23cb596b8d69351f36d5c14b587d85e93e45afcc2781cff5c1e13

actions:
  before:
    - name: Check the RKNN runtime
      run: |
        set -e
        if ! ldconfig -p 2>/dev/null | grep -q librknnrt; then
          echo "librknnrt not found — install the RKNN runtime (rknpu2) for this board first" >&2
          exit 1
        fi
        ldconfig -p | grep librknnrt
        echo "RKNN runtime OK"
      name_i18n:
        zh: 检查 RKNN 运行时

  after_upload:
    - name: Fetch and unpack the model bundle
      name_i18n: {zh: 获取并解包模型包}
      timeout: 1800
      run: |
        set -eu
        MODELS_DIR="/home/{{username}}/edge-parking/rk3588_plate/models"
        BUNDLE="plate_rk3588-1ea1864826a2.tar.gz"
        BUNDLE_SHA="1ea1864826a23cb596b8d69351f36d5c14b587d85e93e45afcc2781cff5c1e13"
        URL="https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/plate_rk3588-1ea1864826a2.tar.gz"
        mkdir -p "$MODELS_DIR"
        have_models() {
          echo "32a4544aebb92dae6a1f76cad68cd74f18ce62d5705ee72fe261915a1534f6cb  $MODELS_DIR/plate_det_yolox_tiny_640_w8a8.rk3588.rknn" | sha256sum -c - >/dev/null 2>&1 || return 1
          echo "84a11aaf4fbb22fe5f81f93131f09394362cc7b5d23e3c9a28d3f0cc9e1acbce  $MODELS_DIR/plate_rec_cn_96x32.rk3588.int8.rknn" | sha256sum -c - >/dev/null 2>&1 || return 1
        }
        if have_models; then
          echo "Model files already present"
        else
          if ! echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE" | sha256sum -c - >/dev/null 2>&1; then
            # files: 字段在 after_upload 之前放好 bundle；本地部署与不认 files: 的老引擎走这里的下载兜底。
            curl -fSL --retry 3 -o "$MODELS_DIR/$BUNDLE.part" "$URL"
            echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE.part" | sha256sum -c -
            mv -f "$MODELS_DIR/$BUNDLE.part" "$MODELS_DIR/$BUNDLE"
          fi
          tar -xzf "$MODELS_DIR/$BUNDLE" --no-same-owner --strip-components=1 -C "$MODELS_DIR"
          echo "32a4544aebb92dae6a1f76cad68cd74f18ce62d5705ee72fe261915a1534f6cb  $MODELS_DIR/plate_det_yolox_tiny_640_w8a8.rk3588.rknn" | sha256sum -c -
          echo "84a11aaf4fbb22fe5f81f93131f09394362cc7b5d23e3c9a28d3f0cc9e1acbce  $MODELS_DIR/plate_rec_cn_96x32.rk3588.int8.rknn" | sha256sum -c -
        fi
        ls -l "$MODELS_DIR"
    - name: Write the plate recognition config
      env:
        SITE_ID: '{{site_id}}'
        CAMERA_ID: '{{camera_id}}'
        RTSP_URL: '{{rtsp_url}}'
        MQTT_HOST: '{{mqtt_host}}'
        MQTT_PORT: '{{mqtt_port}}'
        MQTT_USERNAME: '{{mqtt_username}}'
        MQTT_PASSWORD: '{{mqtt_password}}'
      run: |
        set -e
        # 不硬编码部署根：local 与 remote 两个 view 都会跑 after_upload，
        # local 卡没有 /home/{{username}}/edge-parking/。在候选位置里定位
        # 已上传/仓库内的 docker-compose.yml，把配置写到 compose 同级的
        # config/（compose 的相对挂载按自身目录解析，两种部署都挂得上）。
        COMPOSE=""
        for root in "/home/{{username}}/edge-parking/rk3588_plate" "assets/rk3588" "."; do
          [ -d "$root" ] || continue
          f=$(find "$root" -maxdepth 2 -name 'docker-compose.yml' -print -quit 2>/dev/null || true)
          if [ -n "$f" ]; then COMPOSE="$f"; break; fi
        done
        if [ -z "$COMPOSE" ]; then
          echo "找不到已上传的 docker-compose.yml（local/remote 两种部署根都试过）" >&2
          exit 1
        fi
        CONFIG_DIR="$(dirname "$COMPOSE")/config"
        mkdir -p "$CONFIG_DIR"
        CONFIG="$CONFIG_DIR/plate.json"
        python3 - "$CONFIG" <<'PY'
        import json, os, sys

        path = sys.argv[1]
        with open(path) as handle:
            config = json.load(handle)

        app = config.setdefault("app", {}).setdefault("options", {})
        app["site_id"] = os.environ["SITE_ID"]
        app.setdefault("mqtt", {})["host"] = os.environ["MQTT_HOST"]
        app["mqtt"]["port"] = int(os.environ["MQTT_PORT"])
        app["mqtt"]["username"] = os.environ.get("MQTT_USERNAME", "")
        app["mqtt"]["password"] = os.environ.get("MQTT_PASSWORD", "")
        config["streams"] = [{
            "id": os.environ["CAMERA_ID"],
            "rtsp_url": os.environ["RTSP_URL"],
            "enabled": True,
        }]

        tmp = path + ".tmp"
        with open(tmp, "w") as handle:
            json.dump(config, handle, indent=2, ensure_ascii=False)
            handle.write("\n")
        os.replace(tmp, path)
        print(f"site_id = {app['site_id']}")
        print(f"stream  = {config['streams'][0]['id']}")
        PY
      name_i18n:
        zh: 写入车牌识别配置


user_inputs:
  - id: rtsp_url
    name: Camera RTSP URL
    type: text
    required: true
    placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
    description: Test this address in VLC first — a wrong path or wrong credentials is the most common failure
    name_i18n:
      zh: 摄像头 RTSP 地址
    description_i18n:
      zh: 先用 VLC 测一下这个地址——路径或用户名密码写错是最常见的失败原因
  - id: site_id
    name: Site ID
    type: text
    default: "demo-lot"
    required: true
    description: First MQTT topic segment — one per parking site
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 站点编号
    description_i18n:
      zh: MQTT 主题第一段——一个停车场一个
  - id: camera_id
    name: Camera ID
    type: text
    default: "gate-a"
    required: true
    description: Identifies this lane/camera in events and topics
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 摄像头编号
    description_i18n:
      zh: 在事件与主题里标识这条车道/这台摄像头
  - id: mqtt_host
    name: MQTT Broker Host
    type: text
    required: true
    placeholder: "192.168.1.50"
    description: Usually the reComputer R1124-10 that runs the gate service
    name_i18n:
      zh: MQTT 服务器地址
    description_i18n:
      zh: 通常是跑开闸服务的 reComputer R1124-10
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    name_i18n:
      zh: MQTT 端口
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    description: Leave empty if the broker allows anonymous clients
    name_i18n:
      zh: MQTT 用户名
    description_i18n:
      zh: broker 允许匿名连接就留空
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    name_i18n:
      zh: MQTT 密码

remote_overrides:
  remote_path: /home/{{username}}/edge-parking
  compose_dir: assets/rk3588
  detection:
    method: network_scan
    manual_entry: true
  # Remote view replaces the base inputs wholesale (same semantics as
  # recamera_heatmap_grafana), so it must carry the full set: app inputs
  # plus the SSH connection fields.
  user_inputs:
    - id: rtsp_url
      name: Camera RTSP URL
      type: text
      required: true
      placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
      description: Test this address in VLC first — a wrong path or wrong credentials is the most common failure
      name_i18n:
        zh: 摄像头 RTSP 地址
      description_i18n:
        zh: 先用 VLC 测一下这个地址——路径或用户名密码写错是最常见的失败原因
    - id: site_id
      name: Site ID
      type: text
      default: "demo-lot"
      required: true
      description: First MQTT topic segment — one per parking site
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
      name_i18n:
        zh: 站点编号
      description_i18n:
        zh: MQTT 主题第一段——一个停车场一个
    - id: camera_id
      name: Camera ID
      type: text
      default: "gate-a"
      required: true
      description: Identifies this lane/camera in events and topics
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
      name_i18n:
        zh: 摄像头编号
      description_i18n:
        zh: 在事件与主题里标识这条车道/这台摄像头
    - id: mqtt_host
      name: MQTT Broker Host
      type: text
      required: true
      placeholder: "192.168.1.50"
      description: Usually the reComputer R1124-10 that runs the gate service
      name_i18n:
        zh: MQTT 服务器地址
      description_i18n:
        zh: 通常是跑开闸服务的 reComputer R1124-10
    - id: mqtt_port
      name: MQTT Port
      type: text
      default: "1883"
      required: true
      name_i18n:
        zh: MQTT 端口
    - id: mqtt_username
      name: MQTT Username
      type: text
      required: false
      description: Leave empty if the broker allows anonymous clients
      name_i18n:
        zh: MQTT 用户名
      description_i18n:
        zh: broker 允许匿名连接就留空
    - id: mqtt_password
      name: MQTT Password
      type: password
      required: false
      name_i18n:
        zh: MQTT 密码

    - id: host
      name: RK3588 IP
      type: text
      required: true
      placeholder: "192.168.1.100"
      name_i18n:
        zh: RK3588 IP
    - id: username
      name: SSH Username
      type: text
      default: recomputer
      required: true
      name_i18n:
        zh: SSH 用户名
    - id: password
      name: SSH Password
      type: password
      required: true
      name_i18n:
        zh: SSH 密码


name_i18n:
  zh: reComputer RK3588 车牌识别
