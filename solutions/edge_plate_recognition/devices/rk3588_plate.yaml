version: "1.0"
id: rk3588_plate
name: reComputer RK3588 Plate Recognition
type: docker_deploy

# 2026-10-08 已在 RK3588 板上验证部署与输出链路（本文件的 before / after_upload 步骤 +
# assets/rk3588/docker-compose.yml + 已发布的 nrd-parking-rk:20261008 + plate_rk3588 模型包）。
# config/plate.json 是 vb.config/1 预设，after_upload 只改站点、流和 broker。

docker:
  compose_file: assets/rk3588/docker-compose.yml
  compose_dir: assets/rk3588
  options:
    project_name: edge_plate
    remove_orphans: true
  services:
    - name: edge-parking
      required: true

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password
  connection_timeout: 30
  command_timeout: 600

pre_checks:
  - type: disk_space
    min_gb: 6
    description: The recognition software and models are stored on the device

post_deployment:
  open_browser: false

files:
  # plate_rk3588: 5300606 bytes, published 2026-10-10; after_upload unpacks it into models/.
  - url: https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261010/plate_rk3588-a1ca2b551103.tar.gz
    remote_path: /home/{{username}}/edge-parking/rk3588_plate/models/plate_rk3588-a1ca2b551103.tar.gz
    checksum:
      sha256: a1ca2b5511031199f9fcd667fc25fba97ff64ae51cbf72cf4656d67e3beac857

actions:
  before:
    - name: Check the on-board AI and video decoding components
      name_i18n:
        zh: 检查板载 AI 与视频解码组件
      run: |
        set -eu
        # The compose file mounts these host files into the container (paths
        # can be overridden with the PARKING_* variables in docker-compose.yml).
        missing=0
        for f in \
          "${PARKING_RKNNRT_LIB:-/usr/lib/librknnrt.so}" \
          "${PARKING_RGA_LIB:-/usr/lib/aarch64-linux-gnu/librga.so.2}" \
          "${PARKING_MPP_LIB:-/usr/lib/aarch64-linux-gnu/librockchip_mpp.so.1}" \
          "${PARKING_MPP_PLUGIN:-/lib/aarch64-linux-gnu/gstreamer-1.0/libgstrockchipmpp.so}" \
          /lib/aarch64-linux-gnu/libgstreamer-1.0.so.0 \
          /lib/aarch64-linux-gnu/libgstbase-1.0.so.0 \
          /lib/aarch64-linux-gnu/libgstvideo-1.0.so.0 \
          /lib/aarch64-linux-gnu/libgstallocators-1.0.so.0 \
          /lib/aarch64-linux-gnu/libgstcodecparsers-1.0.so.0 \
          /lib/aarch64-linux-gnu/gstreamer-1.0/libgstvideoparsersbad.so; do
          if [ -e "$f" ]; then echo "found $f"; else echo "missing $f" >&2; missing=1; fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "Install the RKNN runtime (rknpu2), Rockchip MPP/RGA and gstreamer1.0-plugins-bad + gstreamer1.0-rockchip on this board first" >&2
          exit 1
        fi
        echo "AI and video decoding components OK"

  after_upload:
    - name: Download the recognition models
      name_i18n: {zh: 下载识别模型}
      timeout: 1800
      run: |
        set -eu
        # Local deploy: actions run from the solution directory and the compose
        # file is in assets/rk3588 (the remote copy is in remote_overrides.actions).
        ROOT="assets/rk3588"
        if [ ! -f "$ROOT/docker-compose.yml" ]; then
          echo "docker-compose.yml not found in $PWD/$ROOT" >&2
          exit 1
        fi
        MODELS_DIR="$ROOT/models"
        BUNDLE="plate_rk3588-a1ca2b551103.tar.gz"
        BUNDLE_SHA="a1ca2b5511031199f9fcd667fc25fba97ff64ae51cbf72cf4656d67e3beac857"
        URL="https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261010/plate_rk3588-a1ca2b551103.tar.gz"
        mkdir -p "$MODELS_DIR"
        have_models() {
          echo "32a4544aebb92dae6a1f76cad68cd74f18ce62d5705ee72fe261915a1534f6cb  $MODELS_DIR/plate_det_yolox_tiny_640_w8a8.rk3588.rknn" | sha256sum -c - >/dev/null 2>&1 || return 1
          echo "8d4e8e340083ef053c74058eb50b71b588a6d5e48f5a42f7d3a666a55b629d99  $MODELS_DIR/plate_rec_cn_96x32.rk3588.int8.rknn" | sha256sum -c - >/dev/null 2>&1 || return 1
        }
        if have_models; then
          echo "Model files already present"
        else
          if ! echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE" | sha256sum -c - >/dev/null 2>&1; then
            # files: 字段在 after_upload 之前放好 bundle；本地部署与不认 files: 的老引擎走这里的下载兜底。
            curl -fSL --retry 3 -o "$MODELS_DIR/$BUNDLE.part" "$URL"
            echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE.part" | sha256sum -c -
            mv -f "$MODELS_DIR/$BUNDLE.part" "$MODELS_DIR/$BUNDLE"
          fi
          tar -xzf "$MODELS_DIR/$BUNDLE" --no-same-owner --strip-components=1 -C "$MODELS_DIR"
          echo "32a4544aebb92dae6a1f76cad68cd74f18ce62d5705ee72fe261915a1534f6cb  $MODELS_DIR/plate_det_yolox_tiny_640_w8a8.rk3588.rknn" | sha256sum -c -
          echo "8d4e8e340083ef053c74058eb50b71b588a6d5e48f5a42f7d3a666a55b629d99  $MODELS_DIR/plate_rec_cn_96x32.rk3588.int8.rknn" | sha256sum -c -
        fi
        ls -l "$MODELS_DIR"
    - name: Write the plate recognition config
      env:
        SITE_ID: '{{site_id}}'
        CAMERA_ID: '{{camera_id}}'
        RTSP_URL: '{{rtsp_url}}'
        MQTT_HOST: '{{mqtt_host}}'
        MQTT_PORT: '{{mqtt_port}}'
        MQTT_USERNAME: '{{mqtt_username}}'
        MQTT_PASSWORD: '{{mqtt_password}}'
      run: |
        set -e
        # The compose file mounts ./config/plate.json; render the vb.config/1
        # preset in place next to it. Local deploy: actions run from the solution
        # directory, so that is assets/rk3588.
        CONFIG="assets/rk3588/config/plate.json"
        if [ ! -f "assets/rk3588/docker-compose.yml" ] || [ ! -f "$CONFIG" ]; then
          echo "config/plate.json not found next to docker-compose.yml in $PWD/assets/rk3588" >&2
          exit 1
        fi
        mkdir -p "$(dirname "$CONFIG")/../data"
        python3 - "$CONFIG" <<'PY'
        import json, os, sys

        path = sys.argv[1]
        with open(path) as handle:
            config = json.load(handle)
        if config.get("schema") != "vb.config/1":
            raise SystemExit(f"{path} is not a vb.config/1 preset")

        site_id = os.environ["SITE_ID"]
        camera_id = os.environ["CAMERA_ID"]
        mqtt_port = int(os.environ["MQTT_PORT"])
        device_id = f"{site_id}-{camera_id}"
        app = config.setdefault("app", {}).setdefault("options", {})
        config["device_id"] = device_id
        app["site_id"] = site_id
        mqtt = config.setdefault("mqtt", {})
        mqtt["host"] = os.environ["MQTT_HOST"]
        mqtt["port"] = mqtt_port
        mqtt["client_id"] = device_id
        mqtt["username"] = os.environ.get("MQTT_USERNAME", "")
        mqtt["password"] = os.environ.get("MQTT_PASSWORD", "")
        mqtt["topic_root"] = f"{site_id}/parking/{device_id}"
        app.setdefault("mqtt", {})["host"] = os.environ["MQTT_HOST"]
        app["mqtt"]["port"] = mqtt_port
        app["mqtt"]["username"] = os.environ.get("MQTT_USERNAME", "")
        app["mqtt"]["password"] = os.environ.get("MQTT_PASSWORD", "")
        template = (config.get("streams") or [{}])[0]
        config["streams"] = [{
            "stream_id": camera_id,
            "url": os.environ["RTSP_URL"],
            "name": "",
            "transport": template.get("transport", "tcp"),
            "score_threshold": None,
            "options": template.get("options", {"codec": "h264"}),
        }]

        tmp = path + ".tmp"
        with open(tmp, "w") as handle:
            json.dump(config, handle, indent=2, ensure_ascii=False)
            handle.write("\n")
        os.replace(tmp, path)
        print(f"config  = {path}")
        print(f"site_id = {app['site_id']}")
        print(f"stream  = {config['streams'][0]['stream_id']}")
        PY
      name_i18n:
        zh: 写入车牌识别配置
  after:
    - name: Wait for the plate recognition service to start
      name_i18n:
        zh: 等待车牌识别服务启动
      timeout: 130
      ignore_error: false
      env:
        PARKING_HEALTH_PORT: "8099"
        PARKING_HEALTH_DEADLINE_SECONDS: "120"
      run: |
        set -e
        python3 - <<'PY'
        import json
        import math
        import os
        import signal
        import time
        import urllib.error
        import urllib.request

        raw_port = os.environ.get("PARKING_HEALTH_PORT", "")
        try:
            port = int(raw_port)
        except (TypeError, ValueError):
            print("Invalid PARKING_HEALTH_PORT: expected an integer", flush=True)
            raise SystemExit(2)
        if not 1 <= port <= 65535:
            print("Invalid PARKING_HEALTH_PORT: expected 1..65535", flush=True)
            raise SystemExit(2)
        try:
            deadline_seconds = float(os.environ.get("PARKING_HEALTH_DEADLINE_SECONDS", "120"))
        except ValueError:
            print("Invalid PARKING_HEALTH_DEADLINE_SECONDS", flush=True)
            raise SystemExit(2)
        if not math.isfinite(deadline_seconds) or deadline_seconds <= 0:
            print("Invalid PARKING_HEALTH_DEADLINE_SECONDS: expected a positive value", flush=True)
            raise SystemExit(2)

        url = f"http://127.0.0.1:{port}/healthz"
        opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
        deadline = time.monotonic() + deadline_seconds
        last_reason = "no response"

        def request_timeout(_signum, _frame):
            raise TimeoutError("request budget expired")

        signal.signal(signal.SIGALRM, request_timeout)
        while time.monotonic() < deadline:
            request_budget = min(2.0, deadline - time.monotonic())
            if request_budget <= 0:
                break
            try:
                request = urllib.request.Request(url, method="GET")
                signal.setitimer(signal.ITIMER_REAL, request_budget)
                with opener.open(request, timeout=request_budget) as response:
                    if response.status != 200:
                        last_reason = f"HTTP {response.status}"
                    else:
                        try:
                            payload = response.read(1024 * 1024 + 1)
                            if len(payload) > 1024 * 1024:
                                last_reason = "HTTP 200 response exceeds 1 MiB"
                                continue
                            body = json.loads(payload.decode("utf-8"))
                        except (UnicodeDecodeError, json.JSONDecodeError):
                            last_reason = "HTTP 200 with non-JSON response"
                        else:
                            if (time.monotonic() < deadline
                                    and isinstance(body, dict)
                                    and body.get("status") == "ok"):
                                print(f"Readiness confirmed at {url}", flush=True)
                                raise SystemExit(0)
                            last_reason = "HTTP 200 JSON status is not ok"
            except urllib.error.HTTPError as error:
                last_reason = f"HTTP {error.code}"
            except (urllib.error.URLError, TimeoutError, OSError) as error:
                last_reason = f"connection error: {error.__class__.__name__}"
            finally:
                signal.setitimer(signal.ITIMER_REAL, 0)
            remaining = deadline - time.monotonic()
            if remaining > 0:
                time.sleep(min(0.5, remaining))

        print(f"Readiness check failed after {deadline_seconds:g}s: {last_reason}", flush=True)
        raise SystemExit(1)
        PY


user_inputs:
  - id: rtsp_url
    name: Camera RTSP URL
    type: text
    required: true
    placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
    description: Test this address in VLC first — a wrong path or wrong credentials is the most common failure
    name_i18n:
      zh: 摄像头 RTSP 地址
    description_i18n:
      zh: 先用 VLC 测一下这个地址——路径或用户名密码写错是最常见的失败原因
  - id: site_id
    name: Site ID
    type: text
    default: "demo-lot"
    required: true
    description: First MQTT topic segment — one per parking site
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 站点编号
    description_i18n:
      zh: MQTT 主题第一段——一个停车场一个
  - id: camera_id
    name: Camera ID
    type: text
    default: "gate-a"
    required: true
    description: Identifies this lane/camera in events and topics
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 摄像头编号
    description_i18n:
      zh: 在事件与主题里标识这条车道/这台摄像头
  - id: mqtt_host
    name: MQTT Broker Host
    type: text
    required: true
    placeholder: "192.168.1.50"
    description: Usually the reComputer R1124-10 that runs the gate service
    name_i18n:
      zh: MQTT 服务器地址
    description_i18n:
      zh: 通常是跑开闸服务的 reComputer R1124-10
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    name_i18n:
      zh: MQTT 端口
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    description: Leave empty if the MQTT broker allows anonymous connections
    name_i18n:
      zh: MQTT 用户名
    description_i18n:
      zh: MQTT 服务器允许匿名连接时留空
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    name_i18n:
      zh: MQTT 密码

remote_overrides:
  # Remote deploy: the actions as they run over SSH, with absolute paths
  # under the SSH user's home. A full copy, because remote_overrides.actions
  # replaces the base actions wholesale.
  actions:
    before:
      - name: Check the on-board AI and video decoding components
        name_i18n:
          zh: 检查板载 AI 与视频解码组件
        run: |
