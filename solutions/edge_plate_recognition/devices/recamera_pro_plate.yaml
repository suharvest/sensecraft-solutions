version: "1.0"
id: recamera_pro_plate
name: reCamera Pro Plate Recognition
type: recamera_pro_app

# DRAFT（NRD-3 Y5 未验收）。应用包 edge-parking-plate 尚未上架 reCamera Pro
# App Center：recamera_pro_app 只能配置「已安装」的应用，安装本身需要
# 发布签名的应用包，签名链不公开。应用包上架（NRD-2 §S11.4 manifest 三件套
# 齐、bundled sha256 回填）后本步骤才能真正部署；目前 require_installed
# 会让步骤在目标机上如实报「应用未安装」。
recamera_pro_app:
  app_id: edge-parking-plate
  require_installed: true
  activation_timeout: 90
  config:
    # 始终应用：应用自带的预览页是零配置看结果的方式。
    output_channels: ["ws"]
  # 仅当给了 broker 地址时追加 MQTT 输出。车牌事件经 R1124-10 上的
  # mosquitto 投递；不开闸、只收事件的现场可以把 broker 指到别处。
  config_when:
    - when_present: mqtt_host
      config:
        output_channels: ["ws", "mqtt"]
        dMqtt:
          sURL: "{{mqtt_host}}"
          iPort: "{{mqtt_port}}"
          sTopic: "{{site_id}}/parking/{{camera_id}}"
          sUsername: "{{mqtt_username}}"
          sPassword: "{{mqtt_password}}"
          sClientId: "edge-parking-plate-{{camera_id}}"

# 连接面板按此渲染（HTTPS 控制台，非 SSH；凭据为 Web 控制台账号）。
ssh:
  port: 443
  default_user: admin
  connection_timeout: 30

user_inputs:
  - id: site_id
    name: Site ID
    type: text
    default: "demo-lot"
    required: true
    description: First MQTT topic segment — one per parking site
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 站点编号
    description_i18n:
      zh: MQTT 主题第一段——一个停车场一个
  - id: camera_id
    name: Camera ID
    type: text
    default: "gate-a"
    required: true
    description: Identifies this lane/camera in events and topics
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 摄像头编号
    description_i18n:
      zh: 在事件与主题里标识这条车道/这台摄像头
  - id: mqtt_host
    name: MQTT Broker Address (optional)
    type: text
    required: false
    placeholder: "192.168.1.50"
    description: Usually the reComputer R1124-10 that runs the gate service. Leave empty to only watch results on the device's own page.
    name_i18n:
      zh: MQTT 服务器地址（可选）
    description_i18n:
      zh: 通常是跑开闸服务的 reComputer R1124-10。留空则只在设备自带页面看结果。
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    name_i18n:
      zh: MQTT 端口
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    description: Leave empty if the broker allows anonymous clients
    name_i18n:
      zh: MQTT 用户名
    description_i18n:
      zh: broker 允许匿名连接就留空
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    name_i18n:
      zh: MQTT 密码

post_deployment:
  open_browser: false

name_i18n:
  zh: reCamera Pro 车牌识别
