version: "1.0"
id: cv_rk3576_deploy
name: reComputer RK3576
type: docker_deploy

# Single source-of-truth device YAML. Backend derives docker_local and
# docker_remote views via derive_docker_views().
#
# device_class=rk3576 pulls in shared RK3576 pre-deploy fixes
# (iptables nf_tables → legacy switch, overridden below in remote_overrides
# so it only switches when the kernel lacks nf_tables) and the hardware
# detection probe (/proc/device-tree/compatible match) from
# devices/profiles/rk3576.yaml. The iptables action is scope=remote so
# it never fires on a developer Mac running docker_local; the detection
# probe runs on both views so misconfigured local deploys abort before
# any side effect. NPU/disk checks stay solution-local (remote_overrides)
# since they're coupled to this docker image's runtime needs.
device_class: rk3576

docker:
  compose_file: assets/docker/cv-docker-compose.yml
  remote_path: /home/{{username}}/ai-lab-cv-rk3576
  environment:
    MODEL_VARIANT: "{{model_variant}}"
    VIDEO_SOURCE: "{{video_source}}"
  options:
    project_name: ai_lab_cv_rk3576
    remove_orphans: true
  services:
    - name: yolo-cv
      required: true
      health_check_endpoint: /api/config
      port: 8000

ssh:
  port: 22
  default_user: cat
  auth_methods:
    - password
  command_timeout: 600

user_inputs:
  - id: model_variant
    name: Model
    type: select
    required: true
    default: "yolo11n"
    options:
      - value: "yolo11n"
        label: "YOLO 11n (Nano - fastest, ~5MB)"
        label_i18n:
          zh: "YOLO 11n (极速版, ~5MB)"
      - value: "yolo11s"
        label: "YOLO 11s (Small - balanced, ~10MB)"
        label_i18n:
          zh: "YOLO 11s (均衡版, ~10MB)"
      - value: "yolo11m"
        label: "YOLO 11m (Medium - most accurate, ~20MB)"
        label_i18n:
          zh: "YOLO 11m (精确版, ~20MB)"
    name_i18n:
      zh: 模型选择
  # The app exits when it cannot open its video source, which also stops
  # the image-upload predict API. Default to the sample clip bundled in the
  # image so a board without a camera still deploys a working API.
  - id: video_source
    name: Video source
    type: select
    required: true
    default: "sample"
    description: Choose a USB camera only when one is plugged in; with no camera at that number the app stops and image detection stops with it.
    description_i18n:
      zh: 只有接了 USB 摄像头时才选摄像头；所选编号没有摄像头时应用会退出，图片检测也随之停止。
    options:
      - value: "sample"
        label: "Sample video (no camera needed)"
        label_i18n:
          zh: "示例视频（无需摄像头）"
      - value: "0"
        label: "USB camera /dev/video0"
        label_i18n:
          zh: "USB 摄像头 /dev/video0"
      - value: "1"
        label: "USB camera /dev/video1"
        label_i18n:
          zh: "USB 摄像头 /dev/video1"
    name_i18n:
      zh: 视频来源

data_channels:
  - type: http
    name: Predict API
    method: POST
    url: "http://{{host}}:8000/api/models/yolo11/predict"
    name_i18n:
      zh: 推理 API
  - type: http_stream
    name: Video Feed (MJPEG)
    method: GET
    url: "http://{{host}}:8000/api/video_feed"
    content_type: multipart/x-mixed-replace
    name_i18n:
      zh: 视频流 (MJPEG)

pre_checks:
  - type: disk_space
    min_gb: 5
    description: At least 5GB for Docker image

post_deployment:
  open_browser: true
  url: http://localhost:8000

name_i18n:
  zh: reComputer RK3576

remote_overrides:
  compose_dir: assets/docker
  detection:
    method: network_scan
    manual_entry: true
  post_deployment:
    open_browser: false
  actions:
    before:
      - name: Fix iptables for Docker on RK3576
        # Same name as the action in the engine's rk3576 device profile, which
        # the engine then skips (name-based dedup), so this copy replaces it.
        # The profile switches to iptables-legacy and restarts Docker whenever
        # iptables reports nf_tables. The failure it was written for is a
        # Rockchip BSP kernel built without nf_tables support, where every
        # nft call fails with "Failed to initialize nft: Protocol not
        # supported" and Docker cannot start. Boards whose kernel does support
        # nf_tables already work, so this copy only switches when an nft
        # listing fails with "Protocol not supported".
        ignore_error: false
        sudo: true
        run: |
          set -e
          IPT=$(command -v iptables || echo /usr/sbin/iptables)
          if ! "$IPT" --version 2>&1 | grep -q nf_tables; then
            echo "iptables already in legacy mode"
            exit 0
          fi
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo -n"
          if ERR=$($SUDO "$IPT" -w -t filter -L -n 2>&1 >/dev/null); then
            echo "iptables uses nf_tables and this kernel supports it; backend and Docker left as is"
            exit 0
          fi
          if ! echo "$ERR" | grep -q 'Protocol not supported'; then
            echo "Could not check the iptables backend: $ERR" >&2
            echo "Backend left as is. If Docker fails to start with 'Failed to initialize nft', run:" >&2
            echo "  sudo update-alternatives --set iptables /usr/sbin/iptables-legacy" >&2
            echo "  sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy" >&2
            echo "  sudo systemctl restart docker" >&2
            exit 0
          fi
          echo "The nf_tables backend isn't usable on this kernel (Protocol not supported); switching iptables to legacy and restarting Docker"
          $SUDO update-alternatives --set iptables /usr/sbin/iptables-legacy
          $SUDO update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy
          $SUDO systemctl restart docker 2>/dev/null || true
          echo "Switched to iptables-legacy"
        name_i18n:
          zh: 修复 RK3576 上 Docker 的 iptables 兼容性
      - name: Check NPU availability
        run: |
          set -e
          # Unprivileged detection: dmesg is blocked by kernel.dmesg_restrict on some images
          if ! tr '\0' '\n' < /proc/device-tree/compatible 2>/dev/null | grep -qi 'rockchip,rk3576'; then
            echo "Rockchip RK3576 platform not detected (/proc/device-tree/compatible has no rockchip,rk3576)."
            exit 1
          fi
          echo "RK3576 platform detected."
          if [ ! -d /sys/module/rknpu ] \
             && ! ls /sys/class/devfreq 2>/dev/null | grep -qi npu \
             && ! ls -d /proc/device-tree/*npu* >/dev/null 2>&1 \
             && ! dmesg 2>/dev/null | grep -qi rknpu; then
            echo "RK3576 detected, but the RKNPU driver is not loaded (no rknpu module, NPU devfreq or device-tree NPU node)."
            exit 1
          fi
          echo "RKNPU detected."

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed."
            exit 1
          fi
          echo "Docker available."

          FREE_GB=$(df -BG / | awk 'NR==2{gsub(/G/,"",$4); print $4}')
          [ "${FREE_GB:-0}" -ge 3 ] || {
            echo "Need at least 3GB free disk, current: ${FREE_GB:-0}GB"
            exit 1
          }
          echo "Disk space OK: ${FREE_GB}GB free."
        name_i18n:
          zh: 检查 NPU 是否可用
