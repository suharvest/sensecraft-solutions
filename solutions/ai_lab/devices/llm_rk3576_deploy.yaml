version: "1.0"
id: llm_rk3576_deploy
name: reComputer RK3576
type: docker_deploy

# Single source-of-truth device YAML. Derives docker_local and
# docker_remote views via derive_docker_views().
#
# device_class=rk3576 pulls in the shared RK3576 profile (iptables
# nf_tables → legacy fix + device-tree probe). The iptables action is
# scope=remote so docker_local previews on a Mac never trigger it.
# The NPU+disk check stays in remote_overrides because the 5GB threshold
# is specific to this DeepSeek image footprint.
device_class: rk3576

docker:
  compose_file: assets/docker/llm-docker-compose.yml
  remote_path: /home/{{username}}/ai-lab-llm-rk3576
  environment:
    MODEL_VARIANT: "{{model_variant}}"
  options:
    project_name: ai_lab_llm_rk3576
    remove_orphans: true
  services:
    - name: deepseek-llm
      required: true
      health_check_endpoint: /v1/models
      port: 8001

ssh:
  port: 22
  default_user: cat
  auth_methods:
    - password
  command_timeout: 600

user_inputs:
  - id: model_variant
    name: Model
    type: select
    required: true
    default: "1.5b-w4a16-latest"
    options:
      - value: "1.5b-w4a16-latest"
        label: "DeepSeek-R1 1.5B W4A16 (1.2GB, recommended)"
        label_i18n:
          zh: "DeepSeek-R1 1.5B W4A16 (1.2GB, 推荐)"
      - value: "1.5b-fp16-latest"
        label: "DeepSeek-R1 1.5B FP16 (2.7GB, highest accuracy)"
        label_i18n:
          zh: "DeepSeek-R1 1.5B FP16 (2.7GB, 最高精度)"
      - value: "1.5b-w4a16-g128-latest"
        label: "DeepSeek-R1 1.5B W4A16-G128 (1.2GB, most compressed)"
        label_i18n:
          zh: "DeepSeek-R1 1.5B W4A16-G128 (1.2GB, 最高压缩)"
      - value: "7b-w4a16-latest"
        label: "DeepSeek-R1 7B W4A16 (4.1GB, stronger reasoning)"
        label_i18n:
          zh: "DeepSeek-R1 7B W4A16 (4.1GB, 更强推理)"
      - value: "7b-w4a16-g128-latest"
        label: "DeepSeek-R1 7B W4A16-G128 (4.1GB, compressed)"
        label_i18n:
          zh: "DeepSeek-R1 7B W4A16-G128 (4.1GB, 压缩版)"
    name_i18n:
      zh: 模型选择

data_channels:
  - type: http
    name: Chat API
    method: POST
    url: "http://{{host}}:8001/v1/chat/completions"
    name_i18n:
      zh: 对话 API
  - type: http_stream
    name: Chat API (Stream)
    method: POST
    url: "http://{{host}}:8001/v1/chat/completions"
    content_type: text/event-stream
    name_i18n:
      zh: 对话 API (流式)

pre_checks:
  - type: disk_space
    min_gb: 10
    description: At least 10GB for LLM Docker image

post_deployment:
  open_browser: false

name_i18n:
  zh: reComputer RK3576

remote_overrides:
  compose_dir: assets/docker
  detection:
    method: network_scan
    manual_entry: true
  actions:
    before:
      - name: Fix iptables for Docker on RK3576
        # Same name as the action in the engine's rk3576 device profile, which
        # the engine then skips (name-based dedup), so this copy replaces it.
        # The profile switches to iptables-legacy and restarts Docker whenever
        # iptables reports nf_tables. The failure it was written for is a
        # Rockchip BSP kernel built without nf_tables support, where every
        # nft call fails with "Failed to initialize nft: Protocol not
        # supported" and Docker cannot start. Boards whose kernel does support
        # nf_tables already work, so this copy only switches when an nft
        # listing fails with "Protocol not supported".
        ignore_error: false
        sudo: true
        run: |
          set -e
          IPT=$(command -v iptables || echo /usr/sbin/iptables)
          if ! "$IPT" --version 2>&1 | grep -q nf_tables; then
            echo "iptables already in legacy mode"
            exit 0
          fi
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo -n"
          if ERR=$($SUDO "$IPT" -w -t filter -L -n 2>&1 >/dev/null); then
            echo "iptables uses nf_tables and this kernel supports it; backend and Docker left as is"
            exit 0
          fi
          if ! echo "$ERR" | grep -q 'Protocol not supported'; then
            echo "Could not check the iptables backend: $ERR" >&2
            echo "Backend left as is. If Docker fails to start with 'Failed to initialize nft', run:" >&2
            echo "  sudo update-alternatives --set iptables /usr/sbin/iptables-legacy" >&2
            echo "  sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy" >&2
            echo "  sudo systemctl restart docker" >&2
            exit 0
          fi
          echo "The nf_tables backend isn't usable on this kernel (Protocol not supported); switching iptables to legacy and restarting Docker"
          $SUDO update-alternatives --set iptables /usr/sbin/iptables-legacy
          $SUDO update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy
          $SUDO systemctl restart docker 2>/dev/null || true
          echo "Switched to iptables-legacy"
        name_i18n:
          zh: 修复 RK3576 上 Docker 的 iptables 兼容性
      - name: Check NPU availability
        run: |
          set -e
          # Unprivileged detection: dmesg is blocked by kernel.dmesg_restrict on some images
          if ! tr '\0' '\n' < /proc/device-tree/compatible 2>/dev/null | grep -qi 'rockchip,rk3576'; then
            echo "Rockchip RK3576 platform not detected (/proc/device-tree/compatible has no rockchip,rk3576)."
            exit 1
          fi
          echo "RK3576 platform detected."
          if [ ! -d /sys/module/rknpu ] \
             && ! ls /sys/class/devfreq 2>/dev/null | grep -qi npu \
             && ! ls -d /proc/device-tree/*npu* >/dev/null 2>&1 \
             && ! dmesg 2>/dev/null | grep -qi rknpu; then
            echo "RK3576 detected, but the RKNPU driver is not loaded (no rknpu module, NPU devfreq or device-tree NPU node)."
            exit 1
          fi
          echo "RKNPU detected."

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed."
            exit 1
          fi
          echo "Docker available."

          FREE_GB=$(df -BG / | awk 'NR==2{gsub(/G/,"",$4); print $4}')
          [ "${FREE_GB:-0}" -ge 5 ] || {
            echo "Need at least 5GB free disk, current: ${FREE_GB:-0}GB"
            exit 1
          }
          echo "Disk space OK: ${FREE_GB}GB free."
        name_i18n:
          zh: 检查 NPU 是否可用
