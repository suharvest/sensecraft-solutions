version: "1.0"
id: edge_inspection_assembly
name: Assembly Inspection — Missing Parts and Dimensions
name_i18n:
  zh: 装配质检：缺件与尺寸

intro:
  summary: Compare each board or assembly against a template expected-item list, measure a dimension against a calibrated reference, and hand the OK/NG verdict to the PLC over Modbus and to the MES over MQTT — entirely on the edge device.
  summary_i18n:
    zh: 把每块板或每件装配体与模板期望件清单比对，用标定物量出尺寸，OK/NG 判定通过 Modbus 交给 PLC、通过 MQTT 交给 MES——全部在边缘设备本地完成。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md

  # Gallery images are local files in this package, not CDN URLs yet.
  # TODO(CDN): upload to
  # https://files.seeedstudio.com/Solution/landpage_asset/edge-inspection-assembly/
  # with a content-hash suffix and replace these paths, per the packaging
  # checklist §2. Sources and licences: gallery/ATTRIBUTION.md.
  cover_image: gallery/detection-overlay-pair.jpg
  gallery:
    - type: image
      src: gallery/detection-overlay-pair.jpg
      caption: Two bare printed circuit boards with their defects boxed. Left — open circuits, mouse bites, a spur and a pin hole across the copper. Right — a second board with its own set. Every box carries the class and the score, drawn beside the labelled box it was matched to
      caption_i18n:
        zh: 两块裸板，缺陷都已圈出。左：铜箔上的断路、鼠咬、毛刺与针孔；右：另一块板上的另一组。每个框都带类别与分数，并与配对的标注框并排
    - type: image
      src: gallery/dimension-nominal.png
      caption: Dimension fixture at nominal size — the ArUco marker on the left gives mm-per-pixel, the block on the right is measured against it (60 x 40 mm, verdict OK)
      caption_i18n:
        zh: 名义尺寸的尺寸测量样例——左侧 ArUco 标定物给出 mm/px，右侧目标按它换算（60 × 40 mm，判定 OK）
    - type: image
      src: gallery/dimension-oversize.png
      caption: The same scene with an oversize part — measured 62.25 mm against a 60 mm nominal and 1 mm tolerance, verdict NG, Modbus HR10=6225 / HR11=2
      caption_i18n:
        zh: 同一场景下的超差件——名义 60 mm、公差 1 mm，量到 62.25 mm，判定 NG，Modbus HR10=6225 / HR11=2
    - type: image
      src: gallery/dimension-rotated.png
      caption: The same part rotated 25 degrees — measured 60.35 x 40.17 mm at 0.10040 mm/px, verdict OK
      caption_i18n:
        zh: 同一目标旋转 25°——按 0.10040 mm/px 量到 60.35 × 40.17 mm，判定 OK

  category: sensing
  solution_type: solution
  tags:
    - industrial-inspection
    - assembly
    - dimension
    - modbus
    - mqtt
    - yolox

  output_interfaces:
    - type: mqtt
      port: 1883
      topic: <device-name>/inspection/<stream-id>/results
      description: One JSON event per processed frame, schema version 2.0.0 — verdict plus the assembly and dimension sections. Every payload is validated against the contract before it is published.
      schema_type: json
      payload_example: '{"type":"assembly_inspection_result","version":"2.0.0","stream_id":"line1-pcb","verdict":"NG","verdict_reasons":["defect","missing"],"defect_count":7,"assembly":{"enabled":true,"expected_count":6,"matched_count":0,"missing_count":6,"extra_count":0},"dimension":{"enabled":false,"calibrated":false,"out_of_tolerance_count":0,"measurements":[]}}'
      description_i18n:
        zh: 每处理一帧发一条 JSON 事件，schema 版本 2.0.0——判定结果加 assembly 与 dimension 两段。每条 payload 在发布前都过一遍契约校验。
    - type: modbus_tcp
      port: 502
      endpoint: unit 1, Coil 0/1 + HR 0-11
      description: Coil 0 = NG / Coil 1 = OK (mutually exclusive), HR 0-7 identical to the surface-inspection contract v1, HR 8 = missing count, HR 9 = extra count, HR 10 = measured mm x100, HR 11 = tolerance code. Registers are written before the coil flips.
      schema_type: binary
      description_i18n:
        zh: Coil 0 = NG / Coil 1 = OK（互斥），HR 0–7 与表面质检契约 v1 逐位相同，HR 8 = 缺件数、HR 9 = 多余件数、HR 10 = 测量值 mm ×100、HR 11 = 公差判定码。写线圈之前寄存器已经写完。
    - type: http
      port: 8080
      endpoint: /healthz, /events, /preview.mjpg
      description: Local web panel — health counters (fps, inference time, missing and dimension failure counts), the most recent events, and an MJPEG preview with detection boxes and assembly ROIs drawn in
      schema_type: json
      description_i18n:
        zh: 本地 Web 面板——健康计数（帧率、推理耗时、缺件与尺寸失败计数）、最近事件，以及带检测框和缺件 ROI 的 MJPEG 预览
    - type: mqtt
      port: 1883
      topic: <device-name>/inspection/<stream-id>/explanations
      description: Optional side-channel event carrying a shared VLM service's (edge-vision-vlm) plain-language explanation for one NG frame, keyed by frame_id to the results event. Requires vlm.enabled=true and a reachable VLM endpoint; off by default. It never blocks or changes the main verdict — a missing explanation event only means the VLM was slow, degraded or disabled.
      schema_type: json
      payload_example: '{"type":"assembly_explanation","version":"1.0.0","stream_id":"line1-pcb","frame_id":10423,"verdict":"NG","verdict_reasons":["missing"],"explanation":"...","vlm_model":"Qwen3-VL-2B-Instruct@cuda","vlm_latency_ms":3120.0,"vlm_fallback_used":false,"candidates":[]}'
      description_i18n:
        zh: 可选的旁路事件，携带外部共享 VLM 服务（edge-vision-vlm）对某个 NG 帧的文字解释，按 frame_id 与 results 事件对齐。需要 vlm.enabled=true 且 VLM 服务端点可达，默认关闭。它不进主判定链路、不改变判定——没有解释事件只说明 VLM 慢、降级或没开。

  input_requirements:
    - type: rtsp
      description: A fixed camera view of the inspection station, with the whole board or assembly in frame and the framing unchanged between the template and production — the expected-item ROIs are picture coordinates, so any camera move invalidates them. For the dimension check the same view also needs a calibration reference in the plane of the measured surface (an ArUco marker, DICT_4X4_50 by default, or any object of a known width); without one the dimension section reports uncalibrated and Modbus HR 11 = 4.
      required: true
      description_i18n:
        zh: 检测工位的固定机位，整块板或整件装配体在画面内，且从建模板到上线期间机位不动——期望件 ROI 是画面坐标，机位一动就失效。要做尺寸判定时，画面里还需要一个与被测面共面的标定物（ArUco 标记，默认 DICT_4X4_50，或任意已知宽度的参考物）；没有它时尺寸段报 uncalibrated，Modbus HR 11 = 4。
    - type: http
      description: Optional — a VLM service endpoint (edge-vision-vlm running on an Orin box) reachable from the inspection host, only needed to enable VLM explanations. Without it, leave vlm.enabled=false and the demo behaves exactly as without this section.
      required: false
      description_i18n:
        zh: 可选——一个从质检主机可达的 VLM 服务端点（跑在 Orin 上的 edge-vision-vlm），只有要启用 VLM 解释时才需要。不需要就保持 vlm.enabled=false，demo 行为与没有这一段完全一样。

  device_catalog:
    recomputer_j30:
      description: Runs detection, assembly comparison, dimension measurement, Modbus and MQTT on one Orin Nano 8GB box
      description_i18n:
        zh: 在一台 Orin Nano 8GB 上跑检测、缺件比对、尺寸测量、Modbus 与 MQTT
      purchase:
        require:
          module: [orin_nano_8]
    recomputer_j40:
      description: The same runtime with more headroom for extra camera streams (Orin NX 16GB). Ran continuously for 67 hours in a 2026-09-08 check, with 0.9992 CPU vs TensorRT box agreement and zero dropped frames throughout.
      description_i18n:
        zh: 同一套运行时，可支撑更多路摄像头（Orin NX 16GB）。2026-09-08 复核中连续运行 67 小时，CPU 与 TensorRT 框一致率 0.9992，全程 0 丢帧。
      purchase:
        require:
          module: [orin_nx_16]
    recomputer_r20_industrial:
      description: An industrial box with a Hailo-8 on the M.2 slot, running the INT8 HEF build of the same detector
      description_i18n:
        zh: M.2 插槽上装了 Hailo-8 的工业整机，运行同一检测器的 INT8 HEF 版本
      purchase:
        require:
          ai_accelerator: hailo-8
    recamera_pro:
      description: >-
        The whole inspection node on the camera itself — detection, OK/NG
        verdict, Modbus TCP and MQTT, no separate compute box. Its NPU runs the
        detector in INT8. Measured on the device over the 205-image DeepPCB
        validation split: mAP50 0.9870 against 0.9876 for the fp32 CPU
        reference, aggregate precision 0.9299 and recall 0.9741 at the frozen
        0.35 score, inference p50 30.9 ms — measured by replaying validation
        images on the device, with the 64 INT8 calibration images drawn from
        that same split. Pick it when the station has one fixed view and no room
        for a host.
      description_i18n:
        zh: >-
          整个质检节点跑在相机上——检测、OK/NG 判定、Modbus TCP 与 MQTT，不需要
          另配主机。它的 NPU 用 INT8 跑检测器。设备实测 DeepPCB 验证集 205 张：
          mAP50 0.9870，fp32 CPU 参考为 0.9876；冻结阈值 0.35 下精确率 0.9299、
          召回率 0.9741；推理 p50 30.9 ms——在设备上回放验证集图片测得，INT8 的
          64 张校准图取自同一份验证集。工位只有一个固定机位、又放不下主机时选它。
    generic_ip_camera:
      name: IP Camera
      name_i18n:
        zh: IP 摄像头
      description: Any RTSP or ONVIF camera looking at the inspection station; a USB camera or a recorded file works too
      description_i18n:
        zh: 任意对着检测工位的 RTSP 或 ONVIF 摄像头；USB 摄像头或录制文件同样可用

  presets:
    - id: jetson
      name: Camera + reComputer J30 / J40 (Orin)
      name_i18n:
        zh: 摄像头 + reComputer J30 / J40（Orin）
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: The measured path. A TensorRT engine is built on the device on first deploy; this is where the accuracy, throughput, latency and multi-stream numbers on the intro page come from.
      description_i18n:
        zh: 有实测数据的一条路径。首次部署在设备上构建 TensorRT engine；介绍页上的精度、吞吐、时延与多路容量数字都出自这条路径。
      device_groups:
        - id: compute
          name: Inspection Host
          name_i18n:
            zh: 质检主机
          type: single
          required: true
          options:
            - device_ref: recomputer_j30
            - device_ref: recomputer_j40
          default: recomputer_j30
        - id: camera
          name: Camera
          name_i18n:
            zh: 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_ip_camera
          default: generic_ip_camera

    - id: hailo
      name: Camera + reComputer R2000 (Hailo-8)
      name_i18n:
        zh: 摄像头 + reComputer R2000（Hailo-8）
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: The lower-power path. The INT8 HEF is compiled off-device and downloaded at deploy time. Measured on the same Hailo-8 platform — 106.75 FPS hardware inference, 43.92 FPS full pipeline, mAP50 0.9858. Reference value measured on the same Hailo-8 platform; to be updated after a re-test on the reComputer unit.
      description_i18n:
        zh: 功耗更低的一条路径。INT8 HEF 在设备外编译、部署时下载。同款 Hailo-8 平台实测硬件推理 106.75 FPS，全链路 43.92 FPS，mAP50 0.9858；同款 Hailo-8 平台实测参考值，reComputer 整机复测后更新。
      device_groups:
        - id: compute
          name: Inspection Host
          name_i18n:
            zh: 质检主机
          type: single
          required: true
          options:
            - device_ref: recomputer_r20_industrial
          default: recomputer_r20_industrial
        - id: camera
          name: Camera
          name_i18n:
            zh: 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_ip_camera
          default: generic_ip_camera

    - id: recamera_pro
      name: reCamera Pro
      name_i18n:
        zh: reCamera Pro
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: >-
        Camera and inspection node in one enclosure. The detector runs in INT8
        on the camera's own NPU and the verdict leaves the device over Modbus
        TCP 502 and MQTT, the same register map and event schema the Orin and
        Hailo paths use. Measured on the device over the 205-image DeepPCB
        validation split: mAP50 0.9870 against 0.9876 for the fp32 CPU
        reference, mAP50-95 0.8000 against 0.8213, inference p50 30.9 ms and
        p95 34.5 ms with the camera's built-in application stopped. The mAP50-95
        gap is box tightness at high IoU rather than a drop in detection: at the
        frozen 0.35 score this build and the CPU reference report the same
        aggregate 0.9299 precision and 0.9741 recall over those images, on a
        slightly different set of 30 missed boxes. The 64 INT8 calibration
        images came from that same validation split, so the INT8 column reads
        optimistic against unseen data, and the figures come from replaying
        validation images on the device rather than from a camera pointed at a
        board. An fp16 build of the same model is
        also published — mAP50-95 0.8221, p50 110.3 ms — for a station that
        needs the tighter boxes more than the frame rate. Assembly comparison
        and dimension measurement need per-station ROIs and stay off in this
        preset; the Orin and Hailo paths carry them.
      description_i18n:
        zh: >-
          相机与质检节点在同一个壳里。检测器用 INT8 跑在相机自己的 NPU 上，判定经
          Modbus TCP 502 与 MQTT 出设备，寄存器表与事件 schema 和 Orin、Hailo 两条
          路径一致。设备实测 DeepPCB 验证集 205 张：mAP50 0.9870（fp32 CPU 参考
          0.9876）、mAP50-95 0.8000（参考 0.8213），停掉相机自带应用时推理 p50
          30.9 ms、p95 34.5 ms。mAP50-95 的差距来自高 IoU 下的框贴合度，不是漏检：
          在冻结阈值 0.35 下，这一版与 CPU 参考在这批图上的精确率同为 0.9299、
          召回率同为 0.9741。同一模型的 fp16 版本也一并发布——mAP50-95 0.8221、
          p50 110.3 ms——留给更看重框贴合度而不是帧率的工位。缺件比对与尺寸测量需要
          按工位标 ROI，本预设不开；这两项由 Orin 与 Hailo 两条路径承载。
      device_groups:
        - id: compute
          name: Camera and Inspection Node
          name_i18n:
            zh: 相机与质检节点
          type: single
          required: true
          options:
            - device_ref: recamera_pro
          default: recamera_pro

  stats:
    difficulty: advanced
    estimated_time: 60min

deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
