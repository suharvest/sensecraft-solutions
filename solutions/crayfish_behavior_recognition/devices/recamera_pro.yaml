version: "1.0"
id: recamera_pro
name: reCamera Pro — Crayfish Behavior Pipeline
name_i18n:
  zh: reCamera Pro——螯虾打斗与行为识别套件
type: recamera_pro_app

recamera_pro_app:
  app_id: crayfish-fight
  activation_timeout: 90
  require_installed: true
  config:
    proximity_k: "{{proximity_k}}"

ssh:
  port: 443
  default_user: admin
  connection_timeout: 30

post_deployment:
  open_browser: false

user_inputs:
  - id: proximity_k
    name: Proximity Factor (k * Body Length)
    name_i18n:
      zh: 靠近判定系数（体长倍数）
    type: select
    default: "1.1"
    options:
      - value: "0.9"
        label: Tight (0.9x body length)
        label_i18n:
          zh: 严格接触（0.9倍体长）
      - value: "1.1"
        label: Standard (1.1x body length)
        label_i18n:
          zh: 标准交互（1.1倍体长）
      - value: "1.3"
        label: Sensitive (1.3x body length)
        label_i18n:
          zh: 敏感预警（1.3倍体长）
    required: false
