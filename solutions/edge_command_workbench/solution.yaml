version: "1.0"
id: edge_command_workbench
name: Edge Command Workbench
name_i18n:
  zh: 边缘设备命令工作台

intro:
  summary: A local web workbench that turns short machine requests into a ranked command choice on RK3576 and RK3588.
  summary_i18n:
    zh: 在 RK3576 和 RK3588 本地运行的设备命令工作台，把简短的机器请求转换为排序后的命令选择。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/workbench.jpg
  category: on_device_ai
  solution_type: solution
  tags: [rk3576, rk3588, rkllm, kev, edge-ai, command-ranking, local-ai, docker]
  output_interfaces:
    - type: http
      port: 18768
      endpoint: /api/health
      method: GET
      description: Health status for the local command workbench.
      description_i18n:
        zh: 本地命令工作台的健康状态。
    - type: http
      port: 18768
      endpoint: /api/decide
      method: POST
      description: Rank candidate machine commands for a user request.
      schema_type: json
      payload_example: '{"prompt":"Choose the best machine command.","input_text":"Read current conveyor status.","options":[{"id":"status","label":"Read status"},{"id":"stop","label":"Stop"}]}'
      description_i18n:
        zh: 为用户请求排列候选机器命令。
  input_requirements:
    - type: network
      description: Network access is needed for the first download unless the target already has the pinned artifacts.
      description_i18n:
        zh: 首次下载固定版本产物需要网络；目标设备已有产物时可离线启动。
    - type: storage
      description: Keep at least 3GB free for a fresh Kev artifact/bootstrap operation; measured fresh peak is about 1.94GB with a 1GB reserve. The existing RKNN path documents its 4GB requirement separately.
      description_i18n:
        zh: Kev 首次准备至少保留 3GB 可用空间；实测新鲜产物峰值约 1.94GB，并保留 1GB 余量。既有 RKNN 路径另行要求 4GB。
  device_catalog:
    rk3576:
      name: RK3576
      name_i18n:
        zh: RK3576
      description: LubanCat3 or another RK3576 Linux device with Docker and RKNN runtime access.
      description_i18n:
        zh: 安装 Docker 并可访问 RKNN 运行时的 LubanCat3 或其他 RK3576 Linux 设备。
    rk3576_rkllm:
      name: RK3576 with RKLLM 1.3.1
      name_i18n:
        zh: RK3576（RKLLM 1.3.1）
      description: Tested on cat-remote RK3576 with the pinned RKLLM 1.3.1 runtime and Kev artifacts. This deployment is guarded at 2048 input tokens; the engine export capacity is 8192.
      description_i18n:
        zh: 已在 cat-remote RK3576 上使用固定版本 RKLLM 1.3.1 运行时和 Kev 产物完成验证。此部署将输入限制为 2048 tokens；engine 导出容量为 8192。
    rk3588_rkllm:
      name: RK3588 with RKLLM 1.3.1
      name_i18n:
        zh: RK3588（RKLLM 1.3.1）
      description: Tested on Radxa RK3588 with the pinned RKLLM 1.3.1 runtime and Kev artifacts at the 8192-token deployment context.
      description_i18n:
        zh: 已在 Radxa RK3588 上使用固定版本 RKLLM 1.3.1 运行时和 Kev 产物完成 8192-token 部署上下文验证。
  presets:
    - id: rk3576_rkllm_remote
      name: RK3576 Kev RKLLM (2048-token deployment)
      name_i18n:
        zh: RK3576 Kev RKLLM（2048-token 部署）
      description: Deploy the tested RK3576 Kev RKLLM configuration with a 2048-token request guard; the engine export capacity remains 8192.
      description_i18n:
        zh: 部署已测试的 RK3576 Kev RKLLM 配置，请求上限为 2048 tokens；engine 导出容量仍为 8192。
      device_groups:
        - id: target
          name: Target device
          name_i18n:
            zh: 目标设备
          type: single
          required: true
          options:
            - device_ref: rk3576_rkllm
          default: rk3576_rkllm
    - id: rk3588_rkllm_remote
      name: RK3588 Kev RKLLM (8192-token deployment)
      name_i18n:
        zh: RK3588 Kev RKLLM（8192-token 部署）
      description: Deploy the tested RK3588 Kev RKLLM configuration at an 8192-token deployment context.
      description_i18n:
        zh: 部署已测试的 RK3588 Kev RKLLM 配置，部署上下文为 8192 tokens。
      device_groups:
        - id: target
          name: Target device
          name_i18n:
            zh: 目标设备
          type: single
          required: true
          options:
            - device_ref: rk3588_rkllm
          default: rk3588_rkllm
    - id: rk3576_remote
      name: RK3576 Remote
      name_i18n:
        zh: 远程 RK3576
      description: Install the historical RK3576 Laya/RKNN 0.1.0 workbench on one RK3576 device over SSH; its pinned 0.1.0 paths remain separate from the current Kev RKLLM presets.
      description_i18n:
        zh: 通过 SSH 将历史 RK3576 Laya/RKNN 0.1.0 工作台部署到一台 RK3576 设备；其固定的 0.1.0 路径与当前 Kev RKLLM 套餐保持独立。
      device_groups:
        - id: target
          name: Target device
          name_i18n:
            zh: 目标设备
          type: single
          required: true
          options:
            - device_ref: rk3576
          default: rk3576

deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
