services:
  edge-command-workbench:
    image: edge-command-workbench:rk3576-0.1.0
    pull_policy: never
    container_name: edge-command-workbench
    restart: unless-stopped
    network_mode: host
    environment:
      DECISION_BACKEND: rknn
      MODEL_PATH: /models/model.rknn
      TOKENIZER_PATH: /models/tokenizer
      MODEL_ROOT: ${MODEL_ROOT:?MODEL_ROOT must be set}
      SEQ_LEN: "90"
      MAX_OPTIONS: "16"
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL:-}
      RKNN_CORE: auto
      LD_LIBRARY_PATH: /opt/rknn
    security_opt:
      - systempaths=unconfined
    volumes:
      - ${MODEL_ROOT:?MODEL_ROOT must be set}/model.rknn:/models/model.rknn:ro
      - ${MODEL_ROOT:?MODEL_ROOT must be set}/tokenizer:/models/tokenizer:ro
      - /proc/device-tree/compatible:/proc/device-tree/compatible:ro
      - /sys/firmware/devicetree/base:/sys/firmware/devicetree/base:ro
      - /usr/lib/librknnrt.so:/usr/lib/librknnrt.so:ro
      - /usr/lib/librknnrt.so:/opt/rknn/librknnrt.so:ro
    devices:
      - /dev/dri:/dev/dri
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
