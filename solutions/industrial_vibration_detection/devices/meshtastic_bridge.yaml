version: "1.0"
id: meshtastic_bridge
name: Mesh-MQTT Serial Bridge
name_i18n:
  zh: Mesh-MQTT 串口桥接器
type: docker_deploy

detection:
  method: local
  requirements:
    - docker_installed
    - docker_running

docker:
  compose_file: assets/docker/docker-compose.yml
  compose_dir: assets/docker
  remote_path: /home/{{username}}/vibration-mesh-bridge
  options:
    project_name: vibration_mesh_bridge
    remove_orphans: true
  services:
    - name: vibration-mesh-bridge
      health_check_timeout: 600
      required: true
  environment:
    MQTT_HOST: "{{mqtt_host}}"
    MQTT_PORT: "{{mqtt_port}}"
    MQTT_USERNAME: "{{mqtt_username}}"
    MQTT_PASSWORD: "{{mqtt_password}}"
    SERIAL_PORT: "{{serial_port}}"

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password
  connection_timeout: 30
  command_timeout: 600

pre_checks:
  - type: disk_space
    min_gb: 1
    description: Python base image and dependency cache

post_deployment:
  open_browser: false

user_inputs:
  - id: host
    name: Target Host Address
    type: text
    placeholder: "192.168.1.50"
    description: IP address or hostname of the remote machine (for remote deployment).
    name_i18n:
      zh: 目标主机地址
    description_i18n:
      zh: 远程机器的 IP 地址或主机名（远程部署使用）。
  - id: username
    name: SSH Username
    type: text
    default: pi
    description: SSH username for remote deployment.
    name_i18n:
      zh: SSH 用户名
    description_i18n:
      zh: 远程部署使用的 SSH 用户名。
  - id: password
    name: SSH Password
    type: password
    description: SSH password for remote deployment.
    name_i18n:
      zh: SSH 密码
    description_i18n:
      zh: 远程部署使用的 SSH 密码。
  - id: serial_port
    name: Meshtastic Serial Port
    type: text
    default: "/dev/ttyACM0"
    required: true
    description: Serial port path of the connected Meshtastic USB receiver node.
    name_i18n:
      zh: Meshtastic 串口
    description_i18n:
      zh: 主机连接的 Meshtastic USB 接收节点串口路径。
  - id: mqtt_host
    name: MQTT Broker Host
    type: text
    default: "127.0.0.1"
    required: true
    description: IP address or hostname of your MQTT Broker (uses host network; 127.0.0.1 connects to host).
    name_i18n:
      zh: MQTT Broker 地址
    description_i18n:
      zh: MQTT Broker 的 IP 地址或主机名（采用 Host 网络，填 127.0.0.1 可直连主机 Broker）。
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    description: "Port number for the MQTT Broker (default: 1883)."
    name_i18n:
      zh: MQTT 端口
    description_i18n:
      zh: MQTT Broker 端口号（默认：1883）。
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    description: Username for MQTT broker authentication (leave blank if not required).
    name_i18n:
      zh: MQTT 用户名
    description_i18n:
      zh: MQTT Broker 认证用户名（若不需要可留空）。
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    description: Password for MQTT broker authentication (leave blank if not required).
    name_i18n:
      zh: MQTT 密码
    description_i18n:
      zh: MQTT Broker 认证密码（若不需要可留空）。
