version: "1.0"
id: ha_dashboard
name: Home Assistant Central Map
name_i18n:
  zh: Home Assistant 集中监控地图
type: web_dashboard

web_dashboard:
  url: "http://{{ha_host}}:{{ha_port}}/map"
  title: Home Assistant Central Map
  title_i18n:
    zh: Home Assistant 集中监控地图

user_inputs:
  - id: ha_host
    name: Home Assistant Host
    name_i18n:
      zh: Home Assistant 地址
    type: text
    default: "127.0.0.1"
    required: true
    description: IP address or hostname of your Home Assistant instance.
    description_i18n:
      zh: Home Assistant 实例的 IP 地址或主机名。
  - id: ha_port
    name: Home Assistant Port
    name_i18n:
      zh: Home Assistant 端口
    type: text
    default: "8123"
    required: true
    validation:
      pattern: "^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
    description: "Port number for Home Assistant (default: 8123)."
    description_i18n:
      zh: Home Assistant 服务端口号（默认：8123）。
