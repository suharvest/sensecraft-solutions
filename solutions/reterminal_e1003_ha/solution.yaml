version: "1.0"
id: reterminal_e1003_ha
name: reTerminal E1003 Smart Home Control Panel
name_i18n:
  zh: reTerminal E1003 智能家居控制面板
enabled: true
intro:
  summary: Low-power e-paper wall panel powered by ESPHome and Home Assistant, enabling always-on touch control for lights, scenes, and smart home automation.
  summary_i18n:
    zh: 基于 ESPHome 与 Home Assistant 的低功耗墨水屏智能家居控制面板，提供常显低眩光触控，轻松联动全屋灯光、场景与智能设备。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/e1003-keyless-cover.png
  category: home_building_automation
  solution_type: solution
  tags: [home-assistant, esphome, epaper, smart-home, touch-panel]
  output_interfaces:
    - type: serial
      endpoint: UART0
      description: Improv Serial at 115200 baud returns device identity and network status.
      description_i18n:
        zh: UART0 以 115200 波特率运行 Improv Serial，返回设备身份和联网状态。
  input_requirements:
    - type: network
      description: The setup computer, panel, and Home Assistant must be on the same reachable LAN.
      description_i18n:
        zh: 配置电脑、面板和 Home Assistant 需在同一可达局域网。
  device_catalog:
    reterminal_e_series:
      description: Runs the fixed E1003 screen and touch interface.
      description_i18n:
        zh: 运行固定的 E1003 屏幕与触控界面。
      purchase:
        require:
          model: [e1003]
  presets:
    - id: usb_candidate
      name: Smart Home Wall Panel
      name_i18n:
        zh: 智能家居控制面板
      description: Flash the factory e-paper firmware to reTerminal E1003 and integrate it seamlessly with Home Assistant.
      description_i18n:
        zh: 为 reTerminal E1003 烧录墨水屏出厂固件，并自动将其接入 Home Assistant 智能家居生态。
      device_groups:
        - id: panel
          name: Dashboard panel
          name_i18n:
            zh: 控制面板
          type: single
          required: true
          options:
            - device_ref: reterminal_e_series
          default: reterminal_e_series
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
