version: "1.0"
id: reterminal_e1003_ha
name: E1003 Light Panel Setup Demo
name_i18n:
  zh: E1003 灯光面板配置演示
enabled: true
intro:
  summary: Flash reTerminal E1003 smart control panel and integrate with Home Assistant to control smart lights and scenes.
  summary_i18n:
    zh: 烧录 reTerminal E1003 智能控制面板，并一键接入 Home Assistant 控制智能灯光与场景。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/e1003-keyless-cover.png
  category: sensing
  solution_type: technical
  tags: [home-assistant, esphome, epaper, usb]
  output_interfaces:
    - type: serial
      endpoint: UART0
      description: Improv Serial at 115200 baud returns device identity and network status.
      description_i18n:
        zh: UART0 以 115200 波特率运行 Improv Serial，返回设备身份和联网状态。
  input_requirements:
    - type: network
      description: The setup computer, panel, and Home Assistant must be on the same reachable LAN.
      description_i18n:
        zh: 配置电脑、面板和 Home Assistant 需在同一可达局域网。
  device_catalog:
    reterminal_e_series:
      description: Runs the fixed E1003 screen and touch interface.
      description_i18n:
        zh: 运行固定的 E1003 屏幕与触控界面。
      purchase:
        require:
          model: [e1003]
  presets:
    - id: usb_candidate
      name: Configure E1003
      name_i18n:
        zh: 配置 E1003
      description: Select the USB serial port to flash the E1003 panel firmware, and integrate with Home Assistant over the local network.
      description_i18n:
        zh: 选择 USB 串口烧录 E1003 面板固件，随后通过局域网接入 Home Assistant 控制灯具。
      device_groups:
        - id: panel
          name: Dashboard panel
          name_i18n:
            zh: 控制面板
          type: single
          required: true
          options:
            - device_ref: reterminal_e_series
          default: reterminal_e_series
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
