version: "1.0"
id: reterminal_e1003_ha
name: reTerminal E1003 Home Assistant Dashboard
name_i18n:
  zh: reTerminal E1003 Home Assistant 面板
# Review only. Enable only after the engine adapter and HA acceptance pass.
enabled: false
intro:
  summary: Set up reTerminal E1003 over USB to control a dimmable light in Home Assistant.
  summary_i18n:
    zh: 通过 USB 配置 reTerminal E1003，控制 Home Assistant 中的一盏可调光灯。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  category: sensing
  solution_type: solution
  tags: [home-assistant, esphome, epaper, usb]
  input_requirements:
    - type: network
      description: The setup computer, panel, and Home Assistant must be on the same reachable LAN, with an existing dimmable light entity.
      description_i18n:
        zh: 配置电脑、面板和 Home Assistant 需在同一可达局域网，且已有一盏可调光的灯。
  device_catalog:
    reterminal_e_series:
      description: Runs the fixed E1003 screen and touch interface.
      description_i18n:
        zh: 运行固定的 E1003 屏幕与触控界面。
      purchase:
        require:
          model: [e1003]
  presets:
    - id: usb_candidate
      name: USB setup
      name_i18n:
        zh: USB 配置
      description: Connect the panel over USB, then set up Wi-Fi and the light target. App setup is not available yet.
      description_i18n:
        zh: 通过 USB 连接面板，设置 Wi-Fi 和灯光目标。App 配置入口尚未开放。
      device_groups:
        - id: panel
          name: Dashboard panel
          name_i18n:
            zh: 控制面板
          type: single
          required: true
          options:
            - device_ref: reterminal_e_series
          default: reterminal_e_series
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
