# Review only. Enable only after the engine adapter and HA acceptance pass.
enabled: false
intro:
  summary: USB firmware candidate for a local Home Assistant light panel. App setup and dynamic display synchronization are pending.
  summary_i18n:
    zh: 面向本地 Home Assistant 灯光面板的 USB 固件候选方案。App 配置与动态显示同步尚待接入。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  category: sensing
  solution_type: solution
  tags: [home-assistant, esphome, epaper, usb, candidate]
  input_requirements:
    - type: network
      description: Setup computer, panel and Home Assistant on the same reachable LAN; one existing dimmable light entity.
      description_i18n:
        zh: 配置电脑、面板和 Home Assistant 在同一可达局域网；已有一个可调光的灯实体。
  device_catalog:
    reterminal_e_series:
      description: Runs the fixed E1003 display and touch layout.
      description_i18n:
        zh: 运行固定的 E1003 显示与触摸布局。
      purchase:
        require:
          model: [e1003]
  presets:
    - id: usb_candidate
      name: USB integration review
      name_i18n:
        zh: USB 接入审阅
      description: Disabled candidate; local artifact staging enables flash configuration review only. Provisioning requires an engine adapter.
      description_i18n:
        zh: 禁用候选；本地准备固件后可审阅烧录配置。设备配置仍需 engine 适配器。
      device_groups:
        - id: panel
          name: Dashboard panel
          name_i18n:
            zh: 控制面板
          type: single
          required: true
          options:
            - device_ref: reterminal_e_series
          default: reterminal_e_series
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
