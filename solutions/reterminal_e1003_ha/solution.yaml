version: "1.0"
id: reterminal_e1003_ha
name: reTerminal E1003 — Precompiled Firmware and Runtime Configuration Demo
name_i18n:
  zh: reTerminal E1003 — 预编译固件与运行时配置演示
# Technical review only. Requires compatible App/contract, public firmware and acceptance.
enabled: false
intro:
  summary: Test one precompiled E1003 image with per-device network, encryption key and light binding configured in the desktop App.
  summary_i18n:
    zh: 演示同一份 E1003 预编译固件，通过桌面 App 配置网络、独立连接密钥与灯光按钮绑定。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/e1003-architecture-cover.png
  gallery:
    - type: image
      src: gallery/e1003-product-official.jpg
      caption: Official E1003 product photo showing Seeed's demonstration interface, not hardware acceptance of this firmware.
      caption_i18n:
        zh: E1003 官方产品照片；屏幕为 Seeed 官方展示界面，并非本固件实机验收画面。
    - type: image
      src: gallery/e1003-architecture-cover.png
      caption: Generated architecture illustration showing USB setup and LAN connectivity; Home Assistant validation is pending.
      caption_i18n:
        zh: 生成的架构示意：USB 配置与局域网连接；Home Assistant 控灯验收待完成。
  category: sensing
  solution_type: technical
  tags: [home-assistant, esphome, epaper, usb]
  output_interfaces:
    - type: serial
      endpoint: UART0
      description: Improv Serial at 115200 baud returns device identity and network status.
      description_i18n:
        zh: UART0 以 115200 波特率运行 Improv Serial，返回设备身份和联网状态。
  input_requirements:
    - type: network
      description: The setup computer, panel, and Home Assistant must be on the same reachable LAN, with an existing dimmable light entity.
      description_i18n:
        zh: 配置电脑、面板和 Home Assistant 需在同一可达局域网，且已有一盏可调光的灯。
  device_catalog:
    reterminal_e_series:
      description: Runs the fixed E1003 screen and touch interface.
      description_i18n:
        zh: 运行固定的 E1003 屏幕与触控界面。
      purchase:
        require:
          model: [e1003]
  presets:
    - id: usb_candidate
      name: Install and set up
      name_i18n:
        zh: 安装与设置
      description: Test USB installation, runtime configuration in the desktop App and persistence after reset.
      description_i18n:
        zh: 测试 USB 安装、桌面 App 内运行时配置，以及复位后的设置保留。
      device_groups:
        - id: panel
          name: Dashboard panel
          name_i18n:
            zh: 控制面板
          type: single
          required: true
          options:
            - device_ref: reterminal_e_series
          default: reterminal_e_series
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
