version: "1.0"
id: indicator_usb
name: Install Indicator panel firmware
name_i18n:
  zh: 安装 Indicator 面板程序
type: esp32_usb
# Firmware provenance: sensecap-indicator-ha branch indicator-ha-native-api,
# commit dca0063, built with ESP-IDF 5.5.4 (ESP32-S3). Binaries are served from
# the Seeed CDN URLs below.
detection:
  method: usb_serial
  usb_vendor_id: "0x1a86"
  usb_product_id: "0x7523"
  manual_entry: true
  fallback_ports:
    - /dev/cu.wchusbserial*
    - /dev/cu.usbserial*
    - /dev/cu.usbmodem*
    - /dev/ttyUSB*
    - /dev/ttyACM*
firmware:
  source:
    path: https://sensecraft-statics.seeed.cc/solution-app/reterminal_e1003_ha/assets/firmware/indicator/dca0063/indicator_ha.bin
    checksum:
      sha256: 6b99f3baf7fb8d3bcf9787794a4ac0484f82a259c219e180cc7bfb91d49f567a
  flash_config:
    chip: esp32s3
    baud_rate: 460800
    flash_mode: dio
    flash_freq: 80m
    flash_size: 8MB
    partitions:
      - name: bootloader
        offset: "0x0"
        file: https://sensecraft-statics.seeed.cc/solution-app/reterminal_e1003_ha/assets/firmware/indicator/dca0063/bootloader.bin
      - name: partition_table
        offset: "0x8000"
        file: https://sensecraft-statics.seeed.cc/solution-app/reterminal_e1003_ha/assets/firmware/indicator/dca0063/partition-table.bin
      - name: app
        offset: "0x10000"
        file: https://sensecraft-statics.seeed.cc/solution-app/reterminal_e1003_ha/assets/firmware/indicator/dca0063/indicator_ha.bin
steps:
  - id: detect
    name: Identify panel
    name_i18n:
      zh: 识别面板
  - id: erase
    name: Full-chip erase (keep off to retain saved settings)
    name_i18n:
      zh: 全片擦除（关闭以保留已有配置）
    optional: true
    default: false
  - id: flash
    name: Install panel firmware
    name_i18n:
      zh: 安装面板程序
  - id: verify
    name: Verify firmware write
    name_i18n:
      zh: 校验程序写入
post_deployment:
  reset_device: true
  wait_for_ready: 10
