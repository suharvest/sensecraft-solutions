version: "1.0"
id: d1001_usb
name: Install reTerminal D1001 panel firmware
name_i18n:
  zh: 安装 reTerminal D1001 面板程序
type: esp32_usb
# Firmware provenance: built from
# https://github.com/Love4yzp/reterminal-d1001-pocketjs
# (commit e01b47f, pocketjs becc0e2, ESP-IDF 6.2 188e3e5)
# Factory binary includes bootloader, partition table, runtime and ha-panel 0.1.0.
detection:
  method: usb_serial
  usb_vendor_id: "0x303a"
  usb_product_id: "0x1001"
  manual_entry: true
  fallback_ports:
    - /dev/cu.usbmodem*
    - /dev/cu.wchusbserial*
    - /dev/cu.usbserial*
    - /dev/ttyACM*
    - /dev/ttyUSB*
firmware:
  source:
    path: https://sensecraft-statics.seeed.cc/solution-app/reterminal_d1001_ha/assets/firmware/e01b47f/factory.bin
    checksum:
      sha256: "72e25050d1f1c0d0f02dbc11cc249ab93e3ff8a57ef176f681ce8fbf5085950d"
  flash_config:
    chip: esp32p4
    baud_rate: 460800
    flash_mode: dio
    flash_freq: 80m
    flash_size: 16MB
    partitions:
      - name: factory
        offset: "0x0"
        file: https://sensecraft-statics.seeed.cc/solution-app/reterminal_d1001_ha/assets/firmware/e01b47f/factory.bin
steps:
  - id: detect
    name: Identify panel
    name_i18n:
      zh: 识别面板
  - id: erase
    name: Full-chip erase (keep off to retain saved settings)
    name_i18n:
      zh: 全片擦除（关闭以保留已有配置）
    optional: true
    default: false
  - id: flash
    name: Install panel firmware
    name_i18n:
      zh: 安装面板程序
  - id: verify
    name: Verify firmware write
    name_i18n:
      zh: 校验程序写入
post_deployment:
  reset_device: true
  wait_for_ready: 10
