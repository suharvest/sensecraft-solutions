# INTERNAL VALIDATION ONLY — NOT FOR PUBLIC DEMO UNTIL THE LICENCE IS CLEARED.
# The model is trained on a re-hosted copy of NEU-DET: the Roboflow page states
# CC BY 4.0, but no formal licence statement has been found for the original
# NEU-DET release. Until an explicit answer arrives or the dataset is replaced,
# nothing derived from it — weights, ONNX, HEF, evaluation screenshots, overlay
# images — may be used for public demos, customer-site demos or commercial
# material. No dataset-derived image is committed to this repository at all; the
# only gallery asset is a schematic drawn for this solution.
# See gallery/ATTRIBUTION.md.
version: "1.0"
id: edge_inspection_surface
name: Surface Defect Inspection
name_i18n:
  zh: 表面缺陷质检

intro:
  summary: >-
    Internal validation build (dataset licence unconfirmed — no public demos).
    Detect six classes of steel surface defect on the edge and hand the OK/NG
    verdict to the line over Modbus TCP and MQTT.
  summary_i18n:
    zh: >-
      内部验证用，许可确认前不得公开演示。在边缘侧识别六类钢材表面缺陷，
      并通过 Modbus TCP 与 MQTT 把 OK/NG 判定交给产线。
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/defect-overlay-pair.jpg
  gallery:
    - type: image
      src: gallery/defect-overlay-pair.jpg
      caption: Two frames of rolled steel strip with the defects boxed. Left — four long inclusions down the strip, each blue box carrying its score against the thin white labelled box. Right — a pitted surface, where the flaw spreads across the sheet instead of sitting in one place
      caption_i18n:
        zh: 两帧钢带表面，缺陷已圈出。左：沿钢带分布的四处长条夹杂，每个蓝框带出分数，旁边细白框是标注；右：麻点表面，缺陷散布在整片上而不集中在一处
    - type: image
      src: gallery/recomputer-super-j4012.jpg
      caption: reComputer J40 series (Jetson Orin NX 16GB) — the device this solution's numbers were measured on
      caption_i18n:
        zh: reComputer J40 系列（Jetson Orin NX 16GB）——本方案数字的实测设备
    - type: image
      src: gallery/architecture.svg
      caption: Camera to device to line — RTSP in, the verdict out on Modbus TCP and MQTT, with the preview page alongside
      caption_i18n:
        zh: 从相机到设备再到产线——RTSP 进来，判定通过 Modbus TCP 与 MQTT 出去，旁边是预览页
  # Two detection frames are shipped so the page shows what the solution does.
  # Their underlying images come from NEU-DET, an academic dataset without a
  # formal licence grant, so only these two are used and only to illustrate
  # function. See gallery/ATTRIBUTION.md.
  category: sensing
  solution_type: solution
  tags:
    - surface-inspection
    - defect-detection
    - modbus
    - mqtt
    - yolox
    - dfine
    - rtdetrv2
    - anomaly-detection
    - industrial

  output_interfaces:
    - type: modbus
      port: 502
      endpoint: unit 1, coils 0-1 and holding registers 0-7
      description: >-
        Modbus TCP server. Coil 0 = NG, coil 1 = OK, always mutually exclusive.
        HR 0 primary defect class id, HR 1 defect count, HR 2-5 the primary box
        as cx/cy/w/h normalised x10000, HR 6-7 the heartbeat Unix seconds as the
        high and low word of a uint32. Registers are updated atomically before
        the coil is written, so a PLC that latches on the coil already sees the
        matching frame's data.
      schema_type: binary
      description_i18n:
        zh: >-
          Modbus TCP 服务端。线圈 0 = NG，线圈 1 = OK，二者始终互斥。
          HR 0 主缺陷类别 ID，HR 1 缺陷数，HR 2-5 主缺陷框的 cx/cy/w/h 归一化后 x10000，
          HR 6-7 心跳 Unix 秒的 uint32 高字与低字。
          每次判定先原子更新寄存器再写线圈，PLC 锁线圈时读到的就是同一帧的数据。
    - type: mqtt
      port: 1883
      topic: <device-name>/inspection/<stream-id>/results
      description: >-
        One JSON message per frame, carrying the verdict and every detection in
        that frame in one payload rather than one message per box. Boxes are
        normalised [cx, cy, w, h]; "slot" is a within-frame index ordered by
        score, not a track id. Every message is validated against the contract
        schema before it is published; a message that fails is counted and
        dropped rather than sent.
      schema_type: json
      payload_example: '{"type":"surface_inspection_result","version":"1.0.0","device":"orin-nx","stream_id":"line1-cam1","frame_id":10423,"verdict":"NG","verdict_reason":"2 defect(s) >= min_defects=1","defect_count":2,"primary_class_id":1,"coordinate_space":"normalized_center_wh","inference_time_ms":6.4,"pipeline_ms":21.8,"detections":[{"slot":0,"class_id":1,"class_name":"inclusion","score":0.87,"bbox":[0.4125,0.5312,0.1094,0.2031]}]}'
      description_i18n:
        zh: >-
          一帧一条 JSON，判定与该帧内所有检测框放在同一条消息里，不逐框发。
          框是归一化的 [cx, cy, w, h]；「slot」 是帧内按分数降序的下标，不是 track id。
          每条消息发布前都过一遍契约 schema 校验，不合格的计数并丢弃，不发出去。
    - type: http
      port: 8080
      endpoint: /preview.mjpg, /healthz, /events, /snapshot.jpg
      description: >-
        Read-only commissioning page. MJPEG preview with boxes drawn on it, a
        health endpoint carrying inference time, capture-to-coil latency and the
        MQTT/Modbus counters, and the most recent verdicts.
      schema_type: json
      description_i18n:
        zh: >-
          只读的调试页面。带检测框的 MJPEG 预览、含推理耗时与 capture→coil 时延
          以及 MQTT / Modbus 计数的健康接口，还有最近的判定记录。
  input_requirements:
    - type: rtsp
      description: >-
        A fixed camera on the strip or part, framed so a defect fills a
        meaningful part of the frame. The measured figures come from 640x640
        crops at 10 FPS. Lighting must be stable — the model was trained on one
        dataset's illumination and has not been evaluated under any other.
      required: true
      description_i18n:
        zh: >-
          对着钢带或工件的固定机位，取景要让缺陷在画面里占到有意义的比例。
          实测数字取自 640x640、10 FPS 的画面。光照必须稳定——
          模型只在一个数据集的光照下训练过，没有在其它光照条件下评测过。
    - type: modbus
      description: >-
        A PLC or line controller that can act as a Modbus TCP master on the same
        network segment as the device. The register map is fixed at unit 1.
      required: false
      description_i18n:
        zh: >-
          与设备同网段、能做 Modbus TCP 主站的 PLC 或产线控制器。
          寄存器表固定在 unit 1 上。

  device_catalog:
    recomputer_j40:
      description: >-
        Runs the detector on TensorRT. Most measured figures on this page were
        taken on an Orin NX 16GB (reComputer J40 series); the Orin Nano 8GB
        (J30) has also been measured directly for accuracy and capture-to-coil
        latency.
      description_i18n:
        zh: >-
          用 TensorRT 运行检测器。本页大部分实测数字取自 Orin NX 16GB
          （reComputer J40 系列）；Orin Nano 8GB（J30）也已单独实测精度与
          取图到线圈延迟。
      purchase:
        require:
          module: [orin_nx_16]
    recomputer_j30:
      description: >-
        The smaller Orin Nano 8GB option. Measured directly on this board:
        capture-to-coil P50 10.56 ms, mAP50 0.7577 — the same accuracy as the
        Orin NX since it is the same engine/ONNX; the multi-stream figures on
        this page are still from the Orin NX.
      description_i18n:
        zh: >-
          更小的 Orin Nano 8GB 选项。已在本机实测：取图到线圈 P50 10.56 ms，
          mAP50 0.7577——精度与 Orin NX 一致（同一份 engine/ONNX）；
          本页的多路容量数字仍来自 Orin NX。
      purchase:
        require:
          module: [orin_nano_8]
    recomputer_r20_industrial:
      description: >-
        An industrial box with a Hailo-8 on the PCIe M.2 slot, running the INT8
        HEF build of the same detector. Measured on the same Hailo-8 platform
        at 106.75 FPS hardware inference and 46.14 FPS full pipeline —
        reference values, to be updated after a re-test on the reComputer unit.
      description_i18n:
        zh: >-
          PCIe M.2 插槽上装了 Hailo-8 的工业整机，运行同一检测器的 INT8 HEF
          版本。同款 Hailo-8 平台实测硬件推理 106.75 FPS，全链路 46.14 FPS；
          参考值，reComputer 整机复测后更新。
      purchase:
        require:
          ai_accelerator: hailo-8
    generic_ip_camera:
      name: IP Camera
      name_i18n:
        zh: IP 摄像头
      description: Any RTSP camera pointed at the strip or part under inspection
      description_i18n:
        zh: 任意一台对着被检钢带或工件的 RTSP 摄像头

  presets:
    - id: orin
      name: IP Camera + reComputer J30 / J40 (Orin)
      name_i18n:
        zh: IP 摄像头 + reComputer J30 / J40（Orin）
      badge: Recommended
      badge_i18n:
        zh: 推荐
      description: >-
        The measured path. TensorRT FP16 on Jetson Orin, with the engine built on
        the device during deployment.
      description_i18n:
        zh: >-
          有实测数据的那条路径。Jetson Orin 上跑 TensorRT FP16，
          engine 在部署过程中于设备上构建。
      device_groups:
        - id: compute
          name: Inspection Host
          name_i18n:
            zh: 检测主机
          type: single
          required: true
          options:
            - device_ref: recomputer_j40
            - device_ref: recomputer_j30
          default: recomputer_j40
        - id: camera
          name: IP Camera
          name_i18n:
            zh: IP 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_ip_camera
          default: generic_ip_camera

    - id: pi_hailo
      name: IP Camera + reComputer R2000 (Hailo-8)
      name_i18n:
        zh: IP 摄像头 + reComputer R2000（Hailo-8）
      badge: Beta
      badge_i18n:
        zh: 测试版
      description: >-
        The lower-cost board. Measured on the same Hailo-8 platform at
        106.75 FPS hardware inference, 46.14 FPS full pipeline and mAP50 0.7091
        — reference values, to be updated after a re-test on the reComputer
        unit. Three ABI gates have to pass on the device, and the deploy step
        checks each one.
      description_i18n:
        zh: >-
          成本更低的一块板。同款 Hailo-8 平台实测硬件推理 106.75 FPS，
          全链路 46.14 FPS，mAP50 0.7091；参考值，reComputer 整机复测后更新。
          设备上有三道 ABI 关卡要过，部署步骤会逐个检查。
      device_groups:
        - id: compute
          name: Inspection Host
          name_i18n:
            zh: 检测主机
          type: single
          required: true
          options:
            - device_ref: recomputer_r20_industrial
          default: recomputer_r20_industrial
        - id: camera
          name: IP Camera
          name_i18n:
            zh: IP 摄像头
          type: single
          required: true
          options:
            - device_ref: generic_ip_camera
          default: generic_ip_camera

  stats:
    difficulty: advanced
    estimated_time: 40min

deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
