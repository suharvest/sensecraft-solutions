<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Camera to edge device to Modbus and MQTT outputs">
  <title>Surface inspection data path</title>
  <!--
    Drawn for this solution. Contains no dataset imagery of any kind: only
    boxes, arrows, product names, protocol names and port numbers. Deliberately
    near-wordless so one asset serves both the English and Chinese pages.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <style>
      .box   { fill:#ffffff; stroke:#5b6472; stroke-width:1.6; }
      .core  { fill:#eef3f8; stroke:#2f6fb3; stroke-width:2; }
      .line  { stroke:#5b6472; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .t     { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#1f2733; }
      .h     { font-size:16px; font-weight:600; }
      .s     { font-size:13px; fill:#5b6472; }
      .p     { font-size:12px; fill:#5b6472; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      .m     { font-size:12px; fill:#2f6fb3; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <!-- camera -->
  <rect class="box" x="24" y="160" width="150" height="90" rx="8"/>
  <text class="t h" x="99" y="196" text-anchor="middle">IP Camera</text>
  <text class="t s" x="99" y="218" text-anchor="middle">RTSP</text>
  <text class="t p" x="99" y="238" text-anchor="middle">640 x 640 / 10 fps</text>

  <line class="line" x1="176" y1="205" x2="238" y2="205"/>

  <!-- edge device -->
  <rect class="core" x="242" y="96" width="290" height="218" rx="10"/>
  <text class="t h" x="387" y="128" text-anchor="middle">Jetson Orin  /  Pi 5 + Hailo-8</text>
  <line x1="266" y1="142" x2="508" y2="142" stroke="#c3d2e2" stroke-width="1"/>

  <rect class="box" x="266" y="156" width="242" height="42" rx="6"/>
  <text class="t s" x="387" y="182" text-anchor="middle">YOLOX-Tiny 640 x 640  ·  6 classes</text>

  <line class="line" x1="387" y1="200" x2="387" y2="216"/>

  <rect class="box" x="266" y="218" width="242" height="42" rx="6"/>
  <text class="t s" x="387" y="244" text-anchor="middle">OK / NG rule</text>

  <text class="t p" x="387" y="292" text-anchor="middle">no image leaves the device</text>

  <!-- fan-out -->
  <line class="line" x1="536" y1="150" x2="640" y2="112"/>
  <line class="line" x1="536" y1="205" x2="640" y2="205"/>
  <line class="line" x1="536" y1="260" x2="640" y2="298"/>

  <!-- modbus branch -->
  <rect class="box" x="644" y="70" width="230" height="86" rx="8"/>
  <text class="t h" x="759" y="102" text-anchor="middle">PLC</text>
  <text class="t m" x="759" y="124" text-anchor="middle">Modbus TCP  502  unit 1</text>
  <text class="t p" x="759" y="143" text-anchor="middle">coil 0 NG / coil 1 OK · HR 0-7</text>

  <!-- mqtt branch -->
  <rect class="box" x="644" y="163" width="230" height="86" rx="8"/>
  <text class="t h" x="759" y="195" text-anchor="middle">MES / Broker</text>
  <text class="t m" x="759" y="217" text-anchor="middle">MQTT  1883</text>
  <text class="t p" x="759" y="236" text-anchor="middle">one JSON per frame</text>

  <!-- preview branch -->
  <rect class="box" x="644" y="256" width="230" height="86" rx="8"/>
  <text class="t h" x="759" y="288" text-anchor="middle">Browser</text>
  <text class="t m" x="759" y="310" text-anchor="middle">HTTP  8080</text>
  <text class="t p" x="759" y="329" text-anchor="middle">preview · healthz · events</text>

  <text class="t p" x="24" y="386">Registers are written before the coil, so the coil flip and the register contents describe the same frame.</text>
</svg>
