version: '1.0'
id: smart_space_assistant
name: Build Your Space AI Agent
name_i18n:
  zh: 打造空间AI智能体
  ja: 空間 AI エージェントを構築する
intro:
  summary: Turn SenseCAP Watcher into your voice and vision AI agent — voice dialog, proactive wake-up, and on-device face recognition
  summary_i18n:
    zh: 用一台 Watcher 快速上手端侧 AI 智能体——自然语音对话、视觉主动打招呼，以及端侧双芯人脸识别
    ja: 1 台の Watcher でエッジ AI エージェントを体験——自然な音声対話、視覚による能動的挨拶、オンデバイス顔認識
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  cover_image: gallery/cover.svg
  gallery:
    - type: image
      src: gallery/demo.svg
      caption: Face Recognition Demo
      caption_i18n:
        zh: 人脸识别演示
    - type: image
      src: gallery/architecture.svg
      caption: Display System Architecture
      caption_i18n:
        zh: 投屏系统架构
  category: interactive_smart_display
  solution_type: solution
  tags:
    - watcher
    - voice
    - vision
    - face_recognition
    - xiaozhi
    - sensecraft-ai
    - mcp

  output_interfaces:
    - type: mqtt
      port: 1883
      description: Face recognition and vision events
      schema_type: json
      payload_example: '{"event":"face_recognized","name":"John","confidence":0.92}'
      description_i18n:
        zh: 人脸识别与视觉检测事件

  input_requirements:
    - type: usb
      description: SenseCAP Watcher connected via USB-C
      description_i18n:
        zh: 通过 USB-C 连接的 SenseCAP Watcher

  device_catalog:
    sensecap_watcher:
      description: AI voice and vision assistant terminal with camera
      description_i18n:
        zh: 带摄像头的 AI 语音与视觉交互终端
    recomputer_r11:
      description: Edge computing device for local MCP services and workstation apps
      description_i18n:
        zh: 边缘计算设备，用于本地 MCP 服务与工作站应用
    reterminal_d1001:
      description: 8" touch HMI voice agent with camera (ESP32-P4)
      description_i18n:
        zh: 8 寸触控语音终端，带摄像头

  stats:
    deployed_count: 0
    likes_count: 0
    difficulty: beginner
    estimated_time: 20min

  links:
    github: https://github.com/78/xiaozhi-esp32

  presets:
    - id: voice_agent
      name: Voice Dialog & Agent
      name_i18n:
        zh: 语音对话与智能体接入
        ja: 音声対話とエージェント連携
      badge: Start Here
      badge_i18n:
        zh: 新手入门
        ja: 入門推奨
      description: Get started with low-latency streaming voice conversation. Connect to SenseCraft AI platform via a 6-digit pairing code, configure agent roles and prompts, and explore voice interaction.
      description_i18n:
        zh: 开箱即用的流式语音对话：通过 6 位验证码连接 SenseCraft AI 云平台，配置智能体角色模板与 Prompt，体验低延迟自然语言对话。
        ja: 開箱後すぐに使えるストリーミング音声対話：6 桁の認証コードで SenseCraft AI クラウドと連携し、エージェントロールやプロンプトを設定して自然な音声対話を体験。
      device_groups:
        - id: voice_assistant
          name: Voice & Vision Terminal
          type: single
          required: true
          options:
            - device_ref: sensecap_watcher
          default: sensecap_watcher
          name_i18n:
            zh: 语音与视觉终端
            ja: 音声・視覚端末
        - id: workstation_host
          name: Workstation Host (Optional)
          type: single
          required: false
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11
          name_i18n:
            zh: 工作站主机（可选）
            ja: ワークステーションホスト（任意）
      links:
        github: https://github.com/78/xiaozhi-esp32

    - id: vision_wake
      name: Proactive Vision Wake
      name_i18n:
        zh: 视觉主动唤醒与参数配置
        ja: 視覚プロアクティブウェイクとパラメータ設定
      badge: Proactive Wake
      badge_i18n:
        zh: 主动交互
        ja: 能動的対話
      description: Camera detects people and greets proactively. Experience voice-based parameter explanations and tuning (threshold, duration, cooldown interval, mode).
      description_i18n:
        zh: 摄像头看到人主动打招呼！通过语音对话讲解并调节端侧视觉检测参数（置信度阈值、持续确认时间、冷却间隔与免打扰模式）。
        ja: カメラが人を捉えて能動的に挨拶！音声対話でエッジ視覚検出パラメータ（確信度閾値、継続確認時間、クールダウン間隔、モード）の説明と調整を体験します。
      device_groups:
        - id: voice_assistant
          name: Voice & Vision Terminal
          type: single
          required: true
          options:
            - device_ref: sensecap_watcher
          default: sensecap_watcher
          name_i18n:
            zh: 语音与视觉终端
            ja: 音声・視覚端末
      links:
        github: https://github.com/78/xiaozhi-esp32

    - id: face_recognition
      name: On-Device Face Recognition
      name_i18n:
        zh: 端侧人脸识别与迎宾
        ja: オンデバイス顔認識と出迎え
      badge: On-Device AI
      badge_i18n:
        zh: 端侧视觉
        ja: オンデバイス AI
      description: Dual-chip edge pipeline (Himax WE2 + ESP32-S3). Recognises registered faces and greets by name; stores up to 20 faces on-device in NVS with familiar mode.
      description_i18n:
        zh: 双芯端侧推理（Himax WE2 + ESP32-S3）。识别人脸并直呼其名，本地 NVS 存储最多 20 人，支持熟人免打扰与语音查询。
        ja: 2チップ構成のエッジ推論（Himax WE2 + ESP32-S3）。登録者の顔を認識して名前で挨拶し、最大20名をデバイス内NVSに保存。顔なじみモードにも対応。
      device_groups:
        - id: voice_assistant
          name: Voice & Vision Terminal
          type: single
          required: true
          options:
            - device_ref: sensecap_watcher
          default: sensecap_watcher
          name_i18n:
            zh: 语音与视觉终端
            ja: 音声・視覚端末
      links:
        github: https://github.com/78/xiaozhi-esp32

    - id: d1001_touch_agent
      name: reTerminal D1001 Touch Agent
      name_i18n:
        zh: 8 寸触控大屏智能体
      badge: Touch Agent
      badge_i18n:
        zh: 触控大屏
      description: "8-inch touch HMI voice agent powered by ESP32-P4: on-screen touch Wi-Fi configuration, proactive visual greeting via onboard camera, Xiaozhi voice agent cloud integration, and local HTTP notification card push."
      description_i18n:
        zh: "基于 ESP32-P4 的 8 寸触控大屏语音智能体：支持屏幕直接触控配网、端侧摄像头主动视觉问候、接入小智语音智能体云平台，以及局域网 HTTP 消息卡片推送。"
      device_groups:
        - id: voice_terminal
          name: Touch Voice Terminal
          type: single
          required: true
          options:
            - device_ref: reterminal_d1001
          default: reterminal_d1001
          name_i18n:
            zh: 触控语音终端
      links:
        github: https://github.com/78/xiaozhi-esp32

deployment:
  auto_detect: true
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
