version: '1.0'
id: smart_space_assistant
name: Build Your Space AI Agent
intro:
  summary: Make your AI assistant see faces, remember people, and serve you proactively
  description_file: description.md
  cover_image: gallery/cover.svg
  gallery:
    - type: image
      src: gallery/demo.svg
      caption: Face Recognition Demo
      caption_i18n:
        zh: 人脸识别演示
    - type: image
      src: gallery/architecture.svg
      caption: Display System Architecture
      caption_i18n:
        zh: 投屏系统架构
  category: voice_ai
  solution_type: solution
  tags:
    - watcher
    - face_recognition
    - display
    - voice
    - xiaozhi

  output_interfaces:
    - type: mqtt
      port: 1883
      description: Face recognition events
      schema_type: json
      payload_example: '{"event":"face_recognized","name":"John","confidence":0.92}'

      description_i18n:
        zh: 人脸识别事件
  input_requirements:
    - type: usb
      description: SenseCAP Watcher connected via USB
      description_i18n:
        zh: 通过 USB 连接的 SenseCAP Watcher
  device_catalog:
    sensecap_watcher:
      description: AI voice assistant with camera
      description_i18n:
        zh: 带摄像头的 AI 语音助手
    recomputer_r11:
      description: Edge computing device for display service
      description_i18n:
        zh: 边缘计算设备，用于投屏服务
    reterminal_d1001:
      description: 8" touch HMI voice agent with camera (ESP32-P4)
      description_i18n:
        zh: 8 寸触摸屏语音智能体，带摄像头（ESP32-P4）
  stats:
    deployed_count: 0
    likes_count: 0
    difficulty: intermediate
    estimated_time: 40min
  links:
    github: https://github.com/78/xiaozhi-esp32
  presets:
    - id: reterminal_d1001
      verify_exempt: true
      name: reTerminal D1001 Voice Agent
      name_i18n: {zh: reTerminal D1001 语音智能体}
      description: Xiaozhi voice agent on the 8" touch HMI with on-screen Wi-Fi setup, camera face wake and local push panel.
      description_i18n: {zh: 8 寸触摸屏上的小智语音智能体：屏上配网、人脸唤醒、局域网推送面板。}
      device_groups:
        - id: d1001_device
          name: Device
          name_i18n: {zh: 设备}
          type: single
          required: true
          options:
            - {device_ref: reterminal_d1001}
          default: reterminal_d1001
    - id: display_cast
      verify_exempt: true
      name: Display Cast
      badge: Recommended
      description: Cast Xiaozhi conversations to large display
      architecture_image: gallery/architecture.svg
      device_groups:
        - id: voice_assistant
          name: Voice Assistant Device
          type: single
          required: true
          options:
            - device_ref: sensecap_watcher
          default: sensecap_watcher
          name_i18n:
            zh: 语音助手设备
        - id: edge_device
          name: Edge Computing Device
          type: single
          required: false
          options:
            - device_ref: recomputer_r11
          default: recomputer_r11
          name_i18n:
            zh: 边缘计算设备
      links:
        github: https://github.com/78/xiaozhi-esp32
      name_i18n:
        zh: 大屏投屏
      badge_i18n:
        zh: 推荐
      description_i18n:
        zh: 把小智对话投射到电视/大屏
    - id: face_recognition
      name: Face Recognition
      description: Add face recognition to Xiaozhi - greet family by name
      architecture_image: gallery/demo.svg
      device_groups:
        - id: voice_assistant
          name: Voice Assistant Device
          type: single
          required: true
          options:
            - device_ref: sensecap_watcher
          default: sensecap_watcher
          name_i18n:
            zh: 语音助手设备
      links:
        github: https://github.com/78/xiaozhi-esp32
      name_i18n:
        zh: 人脸识别
      description_i18n:
        zh: 给小智装上"眼睛"，认识家人朋友
  summary_i18n:
    zh: 让AI助手认识你、记住你、主动服务你——适用于家庭、办公室、展厅的空间智能化
  description_file_i18n:
    zh: description_zh.md
deployment:
  guide_file: guide.md
  selection_mode: sequential
  guide_file_i18n:
    zh: guide_zh.md
name_i18n:
  zh: 打造空间AI智能体
