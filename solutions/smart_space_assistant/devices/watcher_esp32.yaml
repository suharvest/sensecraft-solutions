version: "1.0"
id: watcher_esp32
name: Xiaozhi ESP32 Firmware
type: esp32_usb

detection:
  method: usb_serial
  # Watcher uses WCH USB-UART chip
  usb_vendor_id: "0x1a86"
  usb_product_id: "0x55d2"
  # Fallback patterns for different platforms
  fallback_ports:
    - "/dev/tty.wchusbserial*"
    - "/dev/cu.wchusbserial*"
    - "/dev/tty.usbserial-*"
    - "/dev/cu.usbserial-*"
    - "/dev/ttyUSB*"
    - "/dev/ttyACM*"

firmware:
  source:
    path: https://sensecraft-statics.seeed.cc/solution-app/smart_warehouse/assets/watcher_firmware/xiaozhi-merged-91bf9963.bin
    checksum:
      sha256: de6b73a23b797e3f028aad84790755a8739ed2547e343fc0aa9c1c8aa4aed3da
  flash_config:
    chip: esp32s3
    baud_rate: 921600
    flash_mode: dio
    flash_freq: 80m
    flash_size: 32MB
    partitions:
      - name: merged_firmware
        offset: "0x0"
        file: https://sensecraft-statics.seeed.cc/solution-app/smart_warehouse/assets/watcher_firmware/xiaozhi-merged-91bf9963.bin
  # 按 App 界面语言选择小智固件（部署时引擎按当前语言挑对应变体，缺省回退到上面的 source）。
  # TODO: 目前 zh/en 都指向同一基础固件 merged-binary.bin；待真正的中/英文固件就绪后，
  #       仅替换对应 file（必要时补 source.checksum）即可，无需改引擎代码。
  language_variants:
    zh:
      partitions:
        - name: merged_firmware
          offset: "0x0"
          file: https://sensecraft-statics.seeed.cc/solution-app/smart_warehouse/assets/watcher_firmware/xiaozhi-merged-91bf9963.bin
    en:
      partitions:
        - name: merged_firmware
          offset: "0x0"
          file: https://sensecraft-statics.seeed.cc/solution-app/smart_warehouse/assets/watcher_firmware/xiaozhi-merged-91bf9963.bin

user_inputs:
  - id: serial_port
    name: Serial Port
    type: serial_port
    required: true
    description: 'Watcher ESP32 port — Windows: name contains SERIAL-B; macOS: ends with 3'
    auto_detect: true

    name_i18n:
      zh: 串口
    description_i18n:
      zh: Watcher 的 ESP32 串口 —— Windows 选带 SERIAL-B 的，macOS 选结尾是 3 的
pre_checks:
  - type: serial_port_available
    description: Check if serial port is accessible
  - type: esptool_available
    description: Check if esptool is installed

post_deployment:
  reset_device: true
  wait_for_ready: 3
name_i18n:
  zh: 小智 ESP32 固件
