version: "1.0"
id: d1001_esp32
name: Xiaozhi D1001 Firmware
type: esp32_usb

detection:
  method: usb_serial
  # ESP32-P4 native USB-Serial-JTAG
  usb_vendor_id: "0x303a"
  usb_product_id: "0x1001"
  fallback_ports:
  - "/dev/cu.usbmodem*"
  - "/dev/tty.usbmodem*"
  - "/dev/ttyACM*"

firmware:
  # Built from xiaozhi-esp32 fork, branch feat/reterminal-d1001,
  # app segment at commit 7ec3edd (wake-tag, threshold and Wi-Fi scan-race fixes).
  # Multi-segment flash (no merged image: the face-model partition sits at
  # 0x1E00000 and a merged binary would carry ~20MB of 0xFF padding).
  source:
    path: 
      https://sensecraft-statics.seeed.cc/solution-app/smart_space_assistant/assets/d1001_firmware/xiaozhi-6878d2d1.bin
    checksum:
      sha256: 6878d2d131cd973a9cd4b016310148c5d52bb6c1092eb22d3b2227f5d0b3745c
  flash_config:
    chip: esp32p4
    baud_rate: 921600
    flash_mode: dio
    flash_freq: 80m
    flash_size: 32MB
    partitions:
    - name: bootloader
      offset: "0x2000"
      file: 
        https://sensecraft-statics.seeed.cc/solution-app/smart_space_assistant/assets/d1001_firmware/bootloader.bin
    - name: partition_table
      offset: "0x8000"
      file: 
        https://sensecraft-statics.seeed.cc/solution-app/smart_space_assistant/assets/d1001_firmware/partition-table.bin
    - name: ota_data
      offset: "0x10d000"
      file: 
        https://sensecraft-statics.seeed.cc/solution-app/smart_space_assistant/assets/d1001_firmware/ota_data_initial.bin
    - name: app
      offset: "0x200000"
      file: 
        https://sensecraft-statics.seeed.cc/solution-app/smart_space_assistant/assets/d1001_firmware/xiaozhi-6878d2d1.bin
    - name: assets
      offset: "0x1000000"
      file: 
        https://sensecraft-statics.seeed.cc/solution-app/smart_space_assistant/assets/d1001_firmware/generated_assets.bin
    - name: face_model
      offset: "0x1E00000"
      file: 
        https://sensecraft-statics.seeed.cc/solution-app/smart_space_assistant/assets/d1001_firmware/human_face_detect.espdl
