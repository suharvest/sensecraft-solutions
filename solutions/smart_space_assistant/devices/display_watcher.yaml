version: "1.0"
id: watcher
name: SenseCAP Watcher
type: esp32_usb

detection:
  method: usb_serial
  # Watcher uses WCH USB-UART chip
  usb_vendor_id: "0x1a86"
  usb_product_id: "0x55d2"
  # Fallback patterns for different platforms
  fallback_ports:
    - "/dev/tty.wchusbserial*"
    - "/dev/cu.wchusbserial*"
    - "/dev/tty.usbserial-*"
    - "/dev/cu.usbserial-*"
    - "/dev/ttyUSB*"
    - "/dev/ttyACM*"

firmware:
  source:
    path: https://sensecraft-statics.seeed.cc/solution-app/smart_space_assistant/assets/watcher_firmware/xiaozhi-merged-d762b68d.bin
    checksum:
      sha256: 7551773b260c9964c5043ba2d5c692dad93f392263df8393648608b3cac9eb57
  flash_config:
    chip: esp32s3
    baud_rate: 921600
    flash_mode: dio
    flash_freq: 80m
    flash_size: 32MB
    # Opted in to targeted erasing: no full-chip erase. The merged image is
    # written from 0x0 and already covers NVS and otadata.
    erase_regions: []
    partitions:
      - name: merged_firmware
        offset: "0x0"
        file: https://sensecraft-statics.seeed.cc/solution-app/smart_space_assistant/assets/watcher_firmware/xiaozhi-merged-d762b68d.bin

user_inputs:
  - id: serial_port
    name: Serial Port
    type: serial_port
    required: true
    description: Select the USB serial port connected to Watcher
    auto_detect: true

    name_i18n:
      zh: 串口
    description_i18n:
      zh: 选择连接到 Watcher 的 USB 串口
pre_checks:
  - type: serial_port_available
    description: Check if serial port is accessible
  - type: esptool_available
    description: Check if esptool is installed

post_deployment:
  reset_device: true
  wait_for_ready: 3
name_i18n:
  zh: SenseCAP Watcher
