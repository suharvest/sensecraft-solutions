version: "1.0"
id: watcher
name: SenseCAP Watcher
type: esp32_usb

detection:
  method: usb_serial
  # Watcher uses WCH USB-UART chip
  usb_vendor_id: "0x1a86"
  usb_product_id: "0x55d2"
  # Fallback patterns for different platforms
  fallback_ports:
    - "/dev/tty.wchusbserial*"
    - "/dev/cu.wchusbserial*"
    - "/dev/tty.usbserial-*"
    - "/dev/cu.usbserial-*"
    - "/dev/ttyUSB*"
    - "/dev/ttyACM*"

firmware:
  source:
    path: https://sensecraft-statics.seeed.cc/solution-app/smart_warehouse/assets/watcher_firmware/xiaozhi-merged-01c69c62.bin
    checksum:
      sha256: 3faf2c35ee126b30e3b4429129d381420aaf99a36496717dcfa2a19839ce17fe
  flash_config:
    chip: esp32s3
    baud_rate: 921600
    flash_mode: dio
    flash_freq: 80m
    flash_size: 16MB
    partitions:
      - name: merged_firmware
        offset: "0x0"
        file: https://sensecraft-statics.seeed.cc/solution-app/smart_warehouse/assets/watcher_firmware/xiaozhi-merged-01c69c62.bin

user_inputs:
  - id: serial_port
    name: Serial Port
    type: serial_port
    required: true
    description: Select the USB serial port connected to Watcher
    auto_detect: true

    name_i18n:
      zh: 串口
    description_i18n:
      zh: 选择连接到 Watcher 的 USB 串口
pre_checks:
  - type: serial_port_available
    description: Check if serial port is accessible
  - type: esptool_available
    description: Check if esptool is installed

post_deployment:
  reset_device: true
  wait_for_ready: 3
name_i18n:
  zh: SenseCAP Watcher
