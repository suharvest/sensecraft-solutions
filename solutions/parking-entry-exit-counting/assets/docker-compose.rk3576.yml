# Image: published nrd-parking-rk:20261009b, pinned by digest (override with PARKING_IMAGE).
# config/counting-rk3576.json (vb.config/1) is rendered from the deploy inputs
# by the device YAML's after_upload step, which also writes .env with the host
# library paths it finds on the board. The defaults below are the reComputer
# RK3576 Debian paths and apply only when .env does not set a value.
services:
  parking:
    image: ${PARKING_IMAGE:-sensecraft-missionpack.seeed.cn/solution/nrd-parking-rk:20261009b@sha256:ca72f50c883432dae805aad169905048bb885301f06b787f043d6167942e305c}
    container_name: ${PARKING_CONTAINER_NAME:-edge-parking-counting-rk3576}
    restart: unless-stopped
    privileged: true
    network_mode: host
    devices:
      - "${PARKING_DRI_DEVICE:-/dev/dri}:/dev/dri"
    environment:
      GST_PLUGIN_PATH: "/opt/vb/host-gst"
      GST_PLUGIN_SYSTEM_PATH: "/usr/lib/aarch64-linux-gnu/gstreamer-1.0"
      LD_LIBRARY_PATH: "/opt/vb/host-gst-runtime:/opt/vb/lib:/opt/vb/host-libs:/usr/lib/aarch64-linux-gnu:/usr/lib"
      GST_REGISTRY_1_0: "/tmp/gst-registry.bin"
    tmpfs:
      - /root/.cache
    volumes:
      - type: bind
        source: ${PARKING_CONFIG:-./config/counting-rk3576.json}
        target: /config/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_MODELS_DIR:-./models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_DATA_DIR:-./data}
        target: /data/edge-parking
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_MPP_PLUGIN:-/lib/aarch64-linux-gnu/gstreamer-1.0/libgstrockchipmpp.so}
        target: /lib/aarch64-linux-gnu/gstreamer-1.0/libgstrockchipmpp.so
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_MPP_LIB:-/usr/lib/aarch64-linux-gnu/librockchip_mpp.so.1}
        target: /lib/aarch64-linux-gnu/librockchip_mpp.so.1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_RGA_LIB:-/usr/lib/aarch64-linux-gnu/librga.so.2}
        target: /lib/aarch64-linux-gnu/librga.so.2
        read_only: true
        bind:
          create_host_path: false
      # Host GStreamer runtime + h264parse (videoparsersbad). Measured on radxa
      # (RK3588, host GStreamer 1.22.9) with image 6a5c781d: without these the
      # pipeline fails with "GStreamer element unavailable: h264parse".
      - type: bind
        source: ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/libgstreamer-1.0.so.0
        target: /opt/vb/host-gst-runtime/libgstreamer-1.0.so.0
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/libgstbase-1.0.so.0
        target: /opt/vb/host-gst-runtime/libgstbase-1.0.so.0
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/libgstvideo-1.0.so.0
        target: /opt/vb/host-gst-runtime/libgstvideo-1.0.so.0
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/libgstallocators-1.0.so.0
        target: /opt/vb/host-gst-runtime/libgstallocators-1.0.so.0
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/libgstcodecparsers-1.0.so.0
        target: /usr/lib/aarch64-linux-gnu/libgstcodecparsers-1.0.so.0
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_MPP_PLUGIN:-/lib/aarch64-linux-gnu/gstreamer-1.0/libgstrockchipmpp.so}
        target: /opt/vb/host-gst/libgstrockchipmpp.so
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_HOST_LIB_DIR:-/lib/aarch64-linux-gnu}/gstreamer-1.0/libgstvideoparsersbad.so
        target: /opt/vb/host-gst/libgstvideoparsersbad.so
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PARKING_RKNNRT_LIB:-/usr/lib/librknnrt.so}
        target: /usr/lib/librknnrt.so
        read_only: true
        bind:
          create_host_path: false
    command: ["--config", "/config/config.json"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
