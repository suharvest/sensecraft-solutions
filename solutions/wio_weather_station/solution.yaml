version: "1.0"
id: wio_weather_station
name: Wio Terminal Weather Station & SenseCAP Starter Kit
name_i18n:
  zh: "Wio Terminal 气象站与 SenseCAP 入门体验套装"
intro:
  summary: "Standard meteorological deployments connect industrial sensors to SenseCAP PaaS. For developers without full outdoor weather stations, this self-contained Wio Terminal and Grove starter kit provides a plug-and-play desktop evaluation platform featuring an on-device dark-mode dashboard (4 joystick-switched pages), onboard sound/light sensing, optional Home Assistant integration, and bridging to the SenseCAP meteorological cloud."
  summary_i18n:
    zh: "气象站标准方案采用工业级传感器直连 SenseCAP 气象云平台；针对暂无专业气象站硬件的用户，本方案提供基于 Wio Terminal 与 Grove 的自包含桌面入门体验套装，支持 2.4 寸 LCD 4 屏暗黑仪表盘（五向摇杆切换）、板载声光传感与扩展插槽，并可按需接入 Home Assistant 与 SenseCAP 平台，低成本跑通全链路体验。"
  description_file: description.md
  description_file_i18n:
    zh: description_zh.md
  category: environmental_sensing
  solution_type: solution
  tags:
    - wio-terminal
    - grove
    - weather-station
    - sensecap
    - home-assistant
    - mqtt
    - iot
    - starter-kit
  output_interfaces:
    - type: serial
      endpoint: "USB CDC"
      description: "Serial telemetry and debugging"
      description_i18n:
        zh: "USB CDC 串口遥测与调试"
    - type: network
      description: "MQTT telemetry via Wi-Fi and SenseCAP PaaS data forwarding (optional)"
      description_i18n:
        zh: "基于 Wi-Fi 的 MQTT 遥测及 SenseCAP 平台数据上报（可选）"
  input_requirements:
    - type: network
      required: false
      description: "2.4 GHz Wi-Fi and reachable Home Assistant MQTT Broker (optional, required only for Home Assistant and cloud integration)"
      description_i18n:
        zh: "2.4 GHz Wi-Fi 网络及可达的 Home Assistant MQTT Broker（可选，仅接入 Home Assistant 及云端时需要）"
  presets:
    - id: default
      name: "Wio Weather Station & SenseCAP Starter Kit"
      name_i18n:
        zh: "Wio Terminal 气象站与 SenseCAP 入门体验部署"
      badge: "Starter Kit"
      badge_i18n:
        zh: "入门套装"
      description: "Deploy weather station starter kit to Wio Terminal for standalone desktop evaluation, Home Assistant integration, and SenseCAP cloud data onboarding without waiting for industrial weather stations."
      description_i18n:
        zh: "将气象站入门套件固件烧录至 Wio Terminal，在暂无工业气象站时快速实现桌面环境监控，并按需打通 Home Assistant 联动与 SenseCAP 气象云平台接入。"
      verified:
        - hardware
deployment:
  guide_file: guide.md
  guide_file_i18n:
    zh: guide_zh.md
  selection_mode: sequential
