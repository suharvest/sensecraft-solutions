# Retail Voice — merged backend and platform ASR.
services:
  speech:
    # Pushed and reachable: sha256:184e9336847a6a0c246c94b311b11d0379d4c90366b8ea0ad6afa0a688b91a58
    # (verified with `docker manifest inspect`, 2026-09-09).
    # rk-20260803b and rk-20260903.10, the two tags previously referenced here,
    # both predate openvoicestream 2815186 (2026-08-25), which moved RK3576
    # onto the activation-rescaled SenseVoice encoder
    # (sense-voice-encoder.rk3576.fp16-scaled.rknn). On plain fp16 the last
    # encoder block's FFN residual add overflows fp16 depending on clip
    # duration; measured on cat-remote (RK3576) 2026-09-09, 2 of 10 zh
    # sentences came back empty and mean CER was 24.6%
    # (seeed-solutions-hub docs/reports/retail-voice-asr-bench-matrix-2026-09-09.md,
    # sections at lines 88 and 191). rk-20260909 carries the fix.
    # The 2026-08-24 RK3576 measurement above was taken on rk-20260803b and
    # has not been re-run on this tag.
    image: sensecraft-missionpack.seeed.cn/solution/seeed-local-voice:rk-stable
    container_name: openvoicestream
    privileged: true
    init: true
    network_mode: host
    command: ["python3", "-m", "uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8621"]
    # Upstream sets 7500m for an 8 GB LubanCat. This board has 3.82 GiB.
    mem_limit: 3000m
    memswap_limit: 3600m
    volumes:
      - /dev:/dev
      - rk-asr-models:/opt/asr/models
      # SENSEVOICE_RKNN_MODEL_DIR is NOT under /opt/asr/models. Without its own
      # volume the 502 MB fp16 .rknn lands in the container's writable layer
      # and is re-downloaded (~7 min) on every --force-recreate.
      - rk-sensevoice-rknn:/opt/asr/sensevoice-rknn
      # Punctuation (CT-Transformer, 294 MB) and speaker embedding (CAM++,
      # 28 MB) land under $MODEL_DIR/{punctuation,speaker}/.
      - ovs-aux-models:/opt/models
      - seeed-local-voice-data:/opt/seeed-local-voice/data
    environment:
      - OVS_PROFILE=${OVS_PROFILE:-rk3576-sensevoice}
      - OVS_PROFILE_DEFAULT=${OVS_PROFILE_DEFAULT:-rk3576-sensevoice}
      - OVS_ASR_MODEL_ID=${OVS_ASR_MODEL_ID:-sensevoice}
      - OVS_LOG_FORMAT=json
      - OVS_ADMIN_KEY=
      - OVS_API_KEYS=${OVS_API_KEYS:?set OVS_API_KEYS in .env}
      - OVS_API_MAX_AUDIO_BYTES=${OVS_API_MAX_AUDIO_BYTES:-67108864}
      # ── ASR: SenseVoice RKNN fp16 on the NPU ────────────────────────
      - ASR_BACKEND=sensevoice_rknn
      - ASR_PLATFORM=${ASR_PLATFORM:-rk3576}
      - RK_PLATFORM=${RK_PLATFORM:-rk3576}
      - LANGUAGE_MODE=rk
      - ASR_NPU_CORE_MASK=NPU_CORE_0
      - ASR_MODEL_DIR=/opt/asr/models
      - SENSEVOICE_RKNN_MODEL_DIR=/opt/asr/sensevoice-rknn
      # Must stay 0. LANGUAGE_MODE=rk would otherwise pull the unrelated
      # qwen3/matcha artifact set (~3.35 GB) and wedge startup.
      - RK_ARTIFACT_AUTO_DOWNLOAD=0
      - RK_ENSURE_MATCHA_RESOURCES=0
      # ── VAD ─────────────────────────────────────────────────────────
      # Server-side VAD stays off: the capture client endpoints locally and
      # finalizes with an empty frame, which matches offline POST /asr quality.
      # Server VAD drops roughly one syllable at every cut (measured on an
      # 11-file corpus).
      - OVS_VAD_BACKEND=none
      # ── Punctuation + speaker embedding ─────────────────────────────
      # Both fit alongside ASR on this board (1.71 GiB total, measured).
      # Speaker embedding is what the optional voiceprint feature consumes;
      # OVS emits the 192-dim vector only, matching happens in the client.
      - MODEL_DIR=/opt/models
      - OVS_PUNCT=${OVS_PUNCT:-1}
      - OVS_SPEAKER_EMB=${OVS_SPEAKER_EMB:-1}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8621/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot downloads ~825 MB before uvicorn accepts connections
      # (502 MB SenseVoice RKNN + 294 MB CT-Transformer + 28 MB CAM++),
      # measured ~7 min on a 2.5 MB/s link.
      start_period: 900s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voice}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  voice-service:
    image: sensecraft-missionpack.seeed.cn/solution/sensecraft-voice-service:stable
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports: ["${VOICE_SERVICE_PORT:-8081}:8081"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      VOICE_API_TOKENS: ${VOICE_API_TOKENS:?set VOICE_API_TOKENS in .env}
      CAPTURE_OVS_BASE_URL: ${CAPTURE_OVS_BASE_URL:-}
      CAPTURE_OVS_API_KEY: ${CAPTURE_OVS_API_KEY:-}
      CAPTURE_OVS_MODEL: ${CAPTURE_OVS_MODEL:-sensevoice}
      CAPTURE_OVS_TIMEOUT_SECONDS: ${CAPTURE_OVS_TIMEOUT_SECONDS:-600}
      CAPTURE_REQUEST_TIMEOUT_SECONDS: ${CAPTURE_REQUEST_TIMEOUT_SECONDS:-630}
    volumes:
      - ./config/voice-service.yaml:/etc/goExample/config.yaml:ro
      - voice-service-logs:/app/logs
    group_add: ["${VOICE_CONFIG_GID:?platform configuration group is required}"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  voice-web:
    image: sensecraft-missionpack.seeed.cn/solution/sensecraft-voice-web:stable
    restart: unless-stopped
    command: ["node", "/app/proxy-server.cjs"]
    volumes:
      - ./voice-web-proxy.cjs:/app/proxy-server.cjs:ro
    depends_on: {voice-service: {condition: service_healthy}}
    ports: ["${VOICE_WEB_PORT:-3000}:3000"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UPSTREAM_HOST: voice-service
      UPSTREAM_PORT: "8081"

  capture-gateway:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on: {voice-service: {condition: service_healthy}}
    command: ["python", "/app/ovs-capture-gateway.py"]
    ports: ["${CAPTURE_GATEWAY_PORT:-18621}:18621"]
    environment:
      CAPTURE_UPSTREAM_HOST: voice-service
      CAPTURE_UPSTREAM_PORT: "8081"
      OVS_UPSTREAM_TIMEOUT: "660"
    volumes: [./ovs-capture-gateway.py:/app/ovs-capture-gateway.py:ro]

volumes:
  rk-asr-models:
    name: rk-asr-models
  rk-sensevoice-rknn:
    name: rk-sensevoice-rknn
  ovs-aux-models:
    name: ovs-aux-models
  seeed-local-voice-data:
    name: seeed-local-voice-data
  mysql-data:
  minio-data:
  voice-service-logs:
