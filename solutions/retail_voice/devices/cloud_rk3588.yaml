  user_inputs:
    - id: host
      name: Device IP
      name_i18n: {zh: 设备 IP}
      type: text
      required: true
    - id: username
      name: SSH Username
      name_i18n: {zh: SSH 用户名}
      type: text
      default: recomputer
      required: true
    - id: password
      name: SSH Password
      name_i18n: {zh: SSH 密码}
      type: password
      required: true
