version: "1.0"
id: local_j30
name: reComputer J3011 Speech Service
type: docker_deploy

# Single source-of-truth device YAML. Backend derives docker_local and
# docker_remote views via derive_docker_views().
#
# device_class=jetson injects the shared iptables raw-table workaround
# (scope=remote — fires on remote Jetson only, not on a developer Mac
# previewing locally) plus the /etc/nv_tegra_release detection probe.
# The legacy local file had no actions of its own; the legacy remote
# file's hand-written "Fix Docker iptables for JetPack 6.2" action was
# byte-for-byte equivalent to the profile's "JetPack 6.x" entry, so
# dropping it here is safe — the profile is the single source of truth.
device_class: jetson

docker:
  compose_file: assets/docker/docker-compose.jetson.yml
  compose_dir: assets/docker
  options:
    project_name: openvoicestream
  environment:
    OVS_PROFILE: "jetson-sensevoice-c64"
    SPEECH_IMAGE: "sensecraft-missionpack.seeed.cn/solution/seeed-local-voice:jetson-stable"
  services:
    - name: speech
      port: 8621
      health_check_endpoint: /readyz
      required: true

ssh:
  port: 22
  default_user: recomputer

pre_checks:
  - type: disk_space
    min_gb: 10
    description: At least 10GB for speech service Docker image

post_deployment:
  open_browser: true
  url: http://localhost:8621

name_i18n:
  zh: Jetson 语音服务

# ---------------------------------------------------------------- local view
# Local deploy: the app runs on this device. Actions run with the deployment
# workspace (a mirror of the solution directory) as their working directory,
# so the paths below are relative to it, and compose runs from its
# assets/docker/. There is no upload step, so `after_upload` runs straight
# after `before`. The remote view does not use this block:
# remote_overrides.actions replaces it in full.
actions:
  before:
    - name: Fix Docker iptables for JetPack 6.x
      # The jetson device profile applies this over SSH (remote view only).
      # Run locally it needs passwordless sudo; without it the step prints the
      # commands and continues, because both containers in this stack use host
      # networking and do not depend on Docker's iptables rules.
      ignore_error: true
      run: |
        set -e
        CONF="/etc/systemd/system/docker.service.d/disable-raw-table.conf"
        if [ -f "$CONF" ] && grep -q "DOCKER_INSECURE_NO_IPTABLES_RAW=1" "$CONF" 2>/dev/null; then
          echo "Docker iptables fix already applied"
          exit 0
        fi
        if ! head -1 /etc/nv_tegra_release 2>/dev/null | grep -q "R36"; then
          echo "Not JetPack 6.x — fix not needed"
          exit 0
        fi
        if ! sudo -n true 2>/dev/null; then
          echo "WARNING: Docker iptables fix not applied (needs sudo). To apply it, write" >&2
          echo "  [Service]" >&2
          echo "  Environment=\"DOCKER_INSECURE_NO_IPTABLES_RAW=1\"" >&2
          echo "to $CONF, then run: sudo systemctl daemon-reload && sudo systemctl restart docker" >&2
          exit 1
        fi
        echo "Applying Docker iptables raw table fix for JetPack 6.x..."
        sudo mkdir -p /etc/systemd/system/docker.service.d
        printf '[Service]\nEnvironment="DOCKER_INSECURE_NO_IPTABLES_RAW=1"\n' | sudo tee "$CONF" > /dev/null
        sudo systemctl daemon-reload
        sudo systemctl restart docker
        sleep 2
        echo "Docker iptables fix applied"
      name_i18n:
        zh: 修复 JetPack 6.x Docker 网络问题

  after_upload:
    - name: Configure client transcription upload
      # Local view: this edits the mirrored assets/docker/config/voice-client.yaml
      # in the deployment workspace. That copy keeps the values from the last
      # deploy (the workspace sync does not overwrite a file the deploy has
      # changed), so each field is set by its key rather than by its
      # __PLACEHOLDER__ marker; a redeploy with new form values replaces the
      # old ones. Same validation as the remote view.
      env:
        LANGUAGE: '{{LANGUAGE}}'
        AUDIO_CARD_ID: '{{AUDIO_CARD_ID}}'
        RETAIL_BACKEND_URL: '{{RETAIL_BACKEND_URL}}'
        RETAIL_BACKEND_API_KEY: '{{RETAIL_BACKEND_API_KEY}}'
        RETAIL_SPEAKER: '0'
      run: |
        set -eu
        python3 - assets/docker/config/voice-client.yaml <<'PY'
        import json, os, re, sys, tempfile
        from pathlib import Path
        url = os.environ['RETAIL_BACKEND_URL']
        key = os.environ['RETAIL_BACKEND_API_KEY']
        language = os.environ['LANGUAGE']
        card = os.environ['AUDIO_CARD_ID']
        speaker = os.environ['RETAIL_SPEAKER']
        m = re.fullmatch(r'https?://[A-Za-z0-9.-]+(?::([0-9]{1,5}))?/?', url)
        if not m:
            raise SystemExit('Enter a backend origin URL without a path.')
        if m.group(1) is not None and not 1 <= int(m.group(1)) <= 65535:
            raise SystemExit('The backend URL port must be between 1 and 65535.')
        if not re.fullmatch(r'[A-Fa-f0-9]{64}', key):
            raise SystemExit('The backend access key must contain 64 hexadecimal characters.')
        if language not in ('zh', 'en') or not re.fullmatch(r'[0-9]+', card) or speaker not in ('0', '1'):
            raise SystemExit('Invalid language, microphone card or speaker setting.')
        p = Path(sys.argv[1])
        text = p.read_text()
        fields = [
            (r'^(  default_language: ).*$', json.dumps(language)),
            (r'^(    card_id: ).*$', json.dumps(card)),
            (r'^(  speaker:\n    enabled: ).*$', 'true' if speaker == '1' else 'false'),
            (r'^(  base_url: ).*$', json.dumps(url.rstrip('/'))),
            (r'^(      X-API-Token: ).*$', json.dumps(key)),
        ]
        for pattern, value in fields:
            text, count = re.subn(pattern, lambda m: m.group(1) + value, text, flags=re.M)
            if count != 1:
                raise SystemExit('Client configuration layout not recognised: %r matched %d times.' % (pattern, count))
        config_lines = '\n'.join(line for line in text.splitlines() if not line.lstrip().startswith('#'))
        if re.search(r'__[A-Z_]+__', config_lines):
            raise SystemExit('Client configuration has unresolved placeholders.')
        fd, tmp = tempfile.mkstemp(prefix='.voice-client.', dir=str(p.parent))
        try:
            with os.fdopen(fd, 'w') as handle:
                handle.write(text)
            os.chmod(tmp, 0o600)
            os.replace(tmp, p)
        finally:
            if os.path.exists(tmp):
                os.unlink(tmp)
        print('Client text upload configured.')
        PY
      name_i18n:
        zh: 配置客户端转写上传

user_inputs:
  - id: LANGUAGE
    name: Recognition language
    name_i18n: {zh: 识别语种}
    type: select
    default: zh
    required: true
    options:
      - {value: zh, label: Chinese, label_i18n: {zh: 中文}}
      - {value: en, label: English, label_i18n: {zh: 英文}}
  - id: AUDIO_CARD_ID
    name: Microphone card ID
    name_i18n: {zh: 麦克风声卡编号}
    type: text
    default: "1"
    required: true
  - id: RETAIL_BACKEND_URL
    name: Retail backend URL
    name_i18n: {zh: 零售后台地址}
    type: text
    required: true
    validation:
      pattern: "^https?://[A-Za-z0-9.-]+(:([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?/?$"
  - id: RETAIL_BACKEND_API_KEY
    name: Retail backend API key
    name_i18n: {zh: 零售后台 API 密钥}
    type: password
    required: true
    validation:
      pattern: "^[A-Fa-f0-9]{64}$"

remote_overrides:
  remote_path: /home/{{username}}/openvoicestream
  compose_dir: assets/docker
  detection:
    method: network_scan
    manual_entry: true
  actions:
    after_upload:
    - name: Configure client transcription upload
      env:
        CLIENT_DEPLOY_DIR: /home/{{username}}/openvoicestream/local_j30
        LANGUAGE: '{{LANGUAGE}}'
        AUDIO_CARD_ID: '{{AUDIO_CARD_ID}}'
        RETAIL_BACKEND_URL: '{{RETAIL_BACKEND_URL}}'
        RETAIL_BACKEND_API_KEY: '{{RETAIL_BACKEND_API_KEY}}'
        RETAIL_SPEAKER: '0'
      run: |
        set -eu
        cd "$CLIENT_DEPLOY_DIR"
        python3 - <<'PY'
        import json, os, re
        from pathlib import Path
        url = os.environ['RETAIL_BACKEND_URL']
        key = os.environ['RETAIL_BACKEND_API_KEY']
        language = os.environ['LANGUAGE']
        card = os.environ['AUDIO_CARD_ID']
        speaker = os.environ['RETAIL_SPEAKER']
        m = re.fullmatch(r'https?://[A-Za-z0-9.-]+(?::([0-9]{1,5}))?/?', url)
        if not m:
            raise SystemExit('Enter a backend origin URL without a path.')
        if m.group(1) is not None and not 1 <= int(m.group(1)) <= 65535:
            raise SystemExit('The backend URL port must be between 1 and 65535.')
        if not re.fullmatch(r'[A-Fa-f0-9]{64}', key):
            raise SystemExit('The backend access key must contain 64 hexadecimal characters.')
        if language not in ('zh', 'en') or not re.fullmatch(r'[0-9]+', card) or speaker not in ('0', '1'):
            raise SystemExit('Invalid language, microphone card or speaker setting.')
        p = Path('config/voice-client.yaml')
        text = p.read_text()
        for marker, value in {'__LANGUAGE__': language, '__AUDIO_CARD_ID__': card, '__RETAIL_BACKEND_URL__': url.rstrip('/'), '__RETAIL_BACKEND_API_KEY__': key}.items():
            text = text.replace('"' + marker + '"', json.dumps(value))
        text = text.replace('__SPEAKER_ENABLED__', 'true' if speaker == '1' else 'false')
        config_lines = '\n'.join(line for line in text.splitlines() if not line.lstrip().startswith('#'))
        if re.search(r'__[A-Z_]+__', config_lines):
            raise SystemExit('Client configuration has unresolved placeholders.')
        p.write_text(text)
        os.chmod(p, 0o600)
        print('Client text upload configured.')
        PY
  environment:
    OVS_PROFILE: "jetson-sensevoice-c64"
  pre_checks:
    - type: disk_space
      min_gb: 3
      description: At least 3GB for speech service Docker image
  post_deployment:
    open_browser: false
  user_inputs:
    - id: host
      name: Device IP
      type: text
      required: true
      name_i18n:
        zh: 设备 IP
    - id: username
      name: SSH Username
      type: text
      default: recomputer
      required: true
      name_i18n:
        zh: SSH 用户名
    - id: password
      name: SSH Password
      type: password
      required: true
      name_i18n:
        zh: SSH 密码
    - id: LANGUAGE
      name: Recognition language
      name_i18n: {zh: 识别语种}
      type: select
      default: zh
      required: true
      options:
        - {value: zh, label: Chinese, label_i18n: {zh: 中文}}
        - {value: en, label: English, label_i18n: {zh: 英文}}
    - id: AUDIO_CARD_ID
      name: Microphone card ID
      name_i18n: {zh: 麦克风声卡编号}
      type: text
      default: "1"
      required: true
    - id: RETAIL_BACKEND_URL
      name: Retail backend URL
      name_i18n: {zh: 零售后台地址}
      type: text
      required: true
      validation:
        pattern: "^https?://[A-Za-z0-9.-]+(:([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?/?$"
    - id: RETAIL_BACKEND_API_KEY
      name: Retail backend API key
      name_i18n: {zh: 零售后台 API 密钥}
      type: password
      required: true
      validation:
        pattern: "^[A-Fa-f0-9]{64}$"
