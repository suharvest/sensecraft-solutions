version: "1.0"
id: rk3576_plate
name: reComputer RK3576 Plate Recognition
type: docker_deploy

# 2026-10-08 已在 RK3576 板上验证部署与输出链路（本文件的 before / after_upload 步骤 +
# assets/rk3576/docker-compose.yml + 已发布的 nrd-parking-rk:20261008 + plate_rk3576 模型包）。
# config/plate.json 是 vb.config/1 预设，after_upload 只改站点、流和 broker。

docker:
  compose_file: assets/rk3576/docker-compose.yml
  compose_dir: assets/rk3576
  options:
    project_name: edge_plate
    remove_orphans: true
  environment:
    PARKING_MODELS_DIR: "/home/{{username}}/edge-parking/rk3576_plate/models"
  services:
    - name: edge-parking
      required: true

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password
  connection_timeout: 30
  command_timeout: 600

pre_checks:
  - type: disk_space
    min_gb: 6
    description: RKNN models and the container image live on the device

post_deployment:
  open_browser: false

files:
  # plate_rk3576: 5540641 bytes, published 2026-10-08; after_upload unpacks it into models/.
  - url: https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/plate_rk3576-dbd43c252024.tar.gz
    remote_path: /home/{{username}}/edge-parking/rk3576_plate/models/plate_rk3576-dbd43c252024.tar.gz
    checksum:
      sha256: dbd43c2520247d1c5785a83493a0132ea0f6f05f7fd6d9c2fca9755c30464655

actions:
  before:
    - name: Check the RKNN runtime and host libraries
      name_i18n:
        zh: 检查 RKNN 运行时与宿主机库
      run: |
        set -eu
        # The compose file mounts these host files into the container (paths
        # can be overridden with the PARKING_* variables in docker-compose.yml).
        missing=0
        for f in \
          "${PARKING_RKNNRT_LIB:-/usr/lib/librknnrt.so}" \
          "${PARKING_RGA_LIB:-/usr/lib/aarch64-linux-gnu/librga.so.2}" \
          "${PARKING_MPP_LIB:-/usr/lib/aarch64-linux-gnu/librockchip_mpp.so.1}" \
          "${PARKING_MPP_PLUGIN:-/lib/aarch64-linux-gnu/gstreamer-1.0/libgstrockchipmpp.so}" \
          /lib/aarch64-linux-gnu/libgstreamer-1.0.so.0 \
          /lib/aarch64-linux-gnu/libgstbase-1.0.so.0 \
          /lib/aarch64-linux-gnu/libgstvideo-1.0.so.0 \
          /lib/aarch64-linux-gnu/libgstallocators-1.0.so.0 \
          /lib/aarch64-linux-gnu/libgstcodecparsers-1.0.so.0 \
          /lib/aarch64-linux-gnu/gstreamer-1.0/libgstvideoparsersbad.so; do
          if [ -e "$f" ]; then echo "found $f"; else echo "missing $f" >&2; missing=1; fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "Install the RKNN runtime (rknpu2), Rockchip MPP/RGA and gstreamer1.0-plugins-bad + gstreamer1.0-rockchip on this board first" >&2
          exit 1
        fi
        echo "RKNN runtime and host libraries OK"

  after_upload:
    - name: Fetch and unpack the model bundle
      name_i18n: {zh: 获取并解包模型包}
      timeout: 1800
      run: |
        set -eu
        MODELS_DIR="/home/{{username}}/edge-parking/rk3576_plate/models"
        BUNDLE="plate_rk3576-dbd43c252024.tar.gz"
        BUNDLE_SHA="dbd43c2520247d1c5785a83493a0132ea0f6f05f7fd6d9c2fca9755c30464655"
        URL="https://sensecraft-statics.seeed.cc/solution-app/nrd-artifacts/20261008/plate_rk3576-dbd43c252024.tar.gz"
        mkdir -p "$MODELS_DIR"
        have_models() {
          echo "859f70bf62bea907c944c2cb65f382d060ecf6b6a90432636f712a08ce9dbf0e  $MODELS_DIR/plate_det_yolox_tiny_640.rk3576.int8.rknn" | sha256sum -c - >/dev/null 2>&1 || return 1
          echo "1c916574dedd7993684696b231e45c93d6cf0e428e823a48d784454c6eefbf2c  $MODELS_DIR/plate_rec_cn_96x32.rk3576.int8.rknn" | sha256sum -c - >/dev/null 2>&1 || return 1
        }
        if have_models; then
          echo "Model files already present"
        else
          if ! echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE" | sha256sum -c - >/dev/null 2>&1; then
            # files: 字段在 after_upload 之前放好 bundle；本地部署与不认 files: 的老引擎走这里的下载兜底。
            curl -fSL --retry 3 -o "$MODELS_DIR/$BUNDLE.part" "$URL"
            echo "$BUNDLE_SHA  $MODELS_DIR/$BUNDLE.part" | sha256sum -c -
            mv -f "$MODELS_DIR/$BUNDLE.part" "$MODELS_DIR/$BUNDLE"
          fi
          tar -xzf "$MODELS_DIR/$BUNDLE" --no-same-owner --strip-components=1 -C "$MODELS_DIR"
          echo "859f70bf62bea907c944c2cb65f382d060ecf6b6a90432636f712a08ce9dbf0e  $MODELS_DIR/plate_det_yolox_tiny_640.rk3576.int8.rknn" | sha256sum -c -
          echo "1c916574dedd7993684696b231e45c93d6cf0e428e823a48d784454c6eefbf2c  $MODELS_DIR/plate_rec_cn_96x32.rk3576.int8.rknn" | sha256sum -c -
        fi
        ls -l "$MODELS_DIR"
    - name: Write the plate recognition config
      env:
        SITE_ID: '{{site_id}}'
        CAMERA_ID: '{{camera_id}}'
        RTSP_URL: '{{rtsp_url}}'
        MQTT_HOST: '{{mqtt_host}}'
        MQTT_PORT: '{{mqtt_port}}'
        MQTT_USERNAME: '{{mqtt_username}}'
        MQTT_PASSWORD: '{{mqtt_password}}'
      run: |
        set -e
        # The compose file mounts ./config/plate.json; render the vb.config/1
        # preset in place next to it. Remote view: compose_dir is uploaded to
        # /home/<user>/edge-parking; local view: assets/rk3576 in the solution.
        CONFIG=""
        for root in "/home/{{username}}/edge-parking" "assets/rk3576"; do
          if [ -f "$root/docker-compose.yml" ] && [ -f "$root/config/plate.json" ]; then
            CONFIG="$root/config/plate.json"; break
          fi
        done
        if [ -z "$CONFIG" ]; then
          echo "config/plate.json not found next to docker-compose.yml (tried /home/{{username}}/edge-parking and assets/rk3576)" >&2
          exit 1
        fi
        mkdir -p "$(dirname "$CONFIG")/../data"
        python3 - "$CONFIG" <<'PY'
        import json, os, sys

        path = sys.argv[1]
        with open(path) as handle:
            config = json.load(handle)
        if config.get("schema") != "vb.config/1":
            raise SystemExit(f"{path} is not a vb.config/1 preset")

        site_id = os.environ["SITE_ID"]
        camera_id = os.environ["CAMERA_ID"]
        mqtt_port = int(os.environ["MQTT_PORT"])
        device_id = f"{site_id}-{camera_id}"
        app = config.setdefault("app", {}).setdefault("options", {})
        config["device_id"] = device_id
        app["site_id"] = site_id
        mqtt = config.setdefault("mqtt", {})
        mqtt["host"] = os.environ["MQTT_HOST"]
        mqtt["port"] = mqtt_port
        mqtt["client_id"] = device_id
        mqtt["username"] = os.environ.get("MQTT_USERNAME", "")
        mqtt["password"] = os.environ.get("MQTT_PASSWORD", "")
        mqtt["topic_root"] = f"{site_id}/parking/{device_id}"
        app.setdefault("mqtt", {})["host"] = os.environ["MQTT_HOST"]
        app["mqtt"]["port"] = mqtt_port
        app["mqtt"]["username"] = os.environ.get("MQTT_USERNAME", "")
        app["mqtt"]["password"] = os.environ.get("MQTT_PASSWORD", "")
        template = (config.get("streams") or [{}])[0]
        config["streams"] = [{
            "stream_id": camera_id,
            "url": os.environ["RTSP_URL"],
            "name": "",
            "transport": template.get("transport", "tcp"),
            "score_threshold": None,
            "options": template.get("options", {"codec": "h264"}),
        }]

        tmp = path + ".tmp"
        with open(tmp, "w") as handle:
            json.dump(config, handle, indent=2, ensure_ascii=False)
            handle.write("\n")
        os.replace(tmp, path)
        print(f"config  = {path}")
        print(f"site_id = {app['site_id']}")
        print(f"stream  = {config['streams'][0]['stream_id']}")
        PY
      name_i18n:
        zh: 写入车牌识别配置


user_inputs:
  - id: rtsp_url
    name: Camera RTSP URL
    type: text
    required: true
    placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
    description: Test this address in VLC first — a wrong path or wrong credentials is the most common failure
    name_i18n:
      zh: 摄像头 RTSP 地址
    description_i18n:
      zh: 先用 VLC 测一下这个地址——路径或用户名密码写错是最常见的失败原因
  - id: site_id
    name: Site ID
    type: text
    default: "demo-lot"
    required: true
    description: First MQTT topic segment — one per parking site
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 站点编号
    description_i18n:
      zh: MQTT 主题第一段——一个停车场一个
  - id: camera_id
    name: Camera ID
    type: text
    default: "gate-a"
    required: true
    description: Identifies this lane/camera in events and topics
    validation:
      pattern: "^[A-Za-z0-9_-]+$"
    name_i18n:
      zh: 摄像头编号
    description_i18n:
      zh: 在事件与主题里标识这条车道/这台摄像头
  - id: mqtt_host
    name: MQTT Broker Host
    type: text
    required: true
    placeholder: "192.168.1.50"
    description: Usually the reComputer R1124-10 that runs the gate service
    name_i18n:
      zh: MQTT 服务器地址
    description_i18n:
      zh: 通常是跑开闸服务的 reComputer R1124-10
  - id: mqtt_port
    name: MQTT Port
    type: text
    default: "1883"
    required: true
    name_i18n:
      zh: MQTT 端口
  - id: mqtt_username
    name: MQTT Username
    type: text
    required: false
    description: Leave empty if the broker allows anonymous clients
    name_i18n:
      zh: MQTT 用户名
    description_i18n:
      zh: broker 允许匿名连接就留空
  - id: mqtt_password
    name: MQTT Password
    type: password
    required: false
    name_i18n:
      zh: MQTT 密码

remote_overrides:
  remote_path: /home/{{username}}/edge-parking
  compose_dir: assets/rk3576
  environment:
    PARKING_MODELS_DIR: "/home/{{username}}/edge-parking/rk3576_plate/models"
  detection:
    method: network_scan
    manual_entry: true
  # Remote view replaces the base inputs wholesale (same semantics as
  # recamera_heatmap_grafana), so it must carry the full set: app inputs
  # plus the SSH connection fields.
  user_inputs:
    - id: rtsp_url
      name: Camera RTSP URL
      type: text
      required: true
      placeholder: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
      description: Test this address in VLC first — a wrong path or wrong credentials is the most common failure
      name_i18n:
        zh: 摄像头 RTSP 地址
      description_i18n:
        zh: 先用 VLC 测一下这个地址——路径或用户名密码写错是最常见的失败原因
    - id: site_id
      name: Site ID
      type: text
      default: "demo-lot"
      required: true
      description: First MQTT topic segment — one per parking site
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
      name_i18n:
        zh: 站点编号
      description_i18n:
        zh: MQTT 主题第一段——一个停车场一个
    - id: camera_id
      name: Camera ID
      type: text
      default: "gate-a"
      required: true
      description: Identifies this lane/camera in events and topics
      validation:
        pattern: "^[A-Za-z0-9_-]+$"
      name_i18n:
        zh: 摄像头编号
      description_i18n:
        zh: 在事件与主题里标识这条车道/这台摄像头
    - id: mqtt_host
      name: MQTT Broker Host
      type: text
      required: true
      placeholder: "192.168.1.50"
      description: Usually the reComputer R1124-10 that runs the gate service
      name_i18n:
        zh: MQTT 服务器地址
      description_i18n:
        zh: 通常是跑开闸服务的 reComputer R1124-10
    - id: mqtt_port
      name: MQTT Port
      type: text
      default: "1883"
      required: true
      name_i18n:
        zh: MQTT 端口
    - id: mqtt_username
      name: MQTT Username
      type: text
      required: false
      description: Leave empty if the broker allows anonymous clients
      name_i18n:
        zh: MQTT 用户名
      description_i18n:
        zh: broker 允许匿名连接就留空
    - id: mqtt_password
      name: MQTT Password
      type: password
      required: false
      name_i18n:
        zh: MQTT 密码

    - id: host
      name: RK3576 IP
      type: text
      required: true
      placeholder: "192.168.1.100"
      name_i18n:
        zh: RK3576 IP
    - id: username
      name: SSH Username
      type: text
      default: recomputer
      required: true
      name_i18n:
        zh: SSH 用户名
    - id: password
      name: SSH Password
      type: password
      required: true
      name_i18n:
        zh: SSH 密码


name_i18n:
  zh: reComputer RK3576 车牌识别
