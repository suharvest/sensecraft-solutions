version: "1.0"
id: recomputer_r_deploy
name: reComputer R (Local or Remote)
type: docker_deploy

# Single source-of-truth device YAML for the `openclaw_recomputer_r`
# preset. Derives docker_local and docker_remote views via
# derive_docker_views().
#
# No `device_class` is set: reComputer R is positioned as a generic
# ARM64 Linux Docker host (no Hailo identity check, no RK iptables
# workaround, no NPU-specific actions in the legacy YAMLs). Any docker
# host can run the local target; remote SSH targets are validated via
# the docker_remote `requirements` block.

docker:
  compose_file: assets/recomputer_r/docker-compose.yml
  environment:
    OPENCLAW_WORKSPACE_VOLUME: "{{workspace_dir}}"
  options:
    project_name: openclaw_recomputer_r
    remove_orphans: true
  services:
    - name: openclaw-gateway
      port: 18789
      health_check_endpoint: /healthz
      health_check_timeout: 600
      required: true

ssh:
  port: 22
  default_user: recomputer
  auth_methods:
    - password

user_inputs:
  - id: workspace_dir
    name: Local File Access (optional)
    type: text
    default: "~/openclaw_docs"
    placeholder: "/home/user/documents"
    description: "Let OpenClaw read files from this directory. Useful for letting AI reference local documents. Leave empty to skip."
    name_i18n:
      zh: 本地文件访问（可选）
    description_i18n:
      zh: "让 OpenClaw 能读取此目录中的文件，方便 AI 参考本地文档。留空则跳过。"

actions:
  before:
    - name: Validate workspace directory
      run: |
        set -e
        WORKSPACE="{{workspace_dir}}"
        if [ -z "$WORKSPACE" ]; then
          echo "No workspace directory specified, using default Docker volume"
          exit 0
        fi
        # Expand ~ to home directory
        case "$WORKSPACE" in
          "~"/*) WORKSPACE="$HOME/${WORKSPACE#\~/}" ;;
          "~") WORKSPACE="$HOME" ;;
        esac
        # Check if path is absolute
        case "$WORKSPACE" in
          /*) ;;
          *) echo "ERROR: Workspace path must be absolute (start with /): $WORKSPACE"; exit 1 ;;
        esac
        echo "RESOLVED_WORKSPACE=$WORKSPACE"
        if [ ! -d "$WORKSPACE" ]; then
          echo "WARNING: Directory does not exist: $WORKSPACE"
          echo "Creating directory..."
          mkdir -p "$WORKSPACE" || {
            echo "ERROR: Failed to create directory: $WORKSPACE"
            echo "Please create it manually or choose a different path."
            exit 1
          }
          echo "Directory created: $WORKSPACE"
        else
          echo "Workspace directory exists: $WORKSPACE"
        fi
      timeout: 10
      name_i18n:
        zh: 校验工作目录
  after:
    - name: Enable execution permissions
      run: |
        set -e
        docker exec openclaw-gateway node -e '
          const fs = require("fs");
          const p = "/home/node/.openclaw/openclaw.json";
          const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
          let changed = false;
          // Commands config
          if (!cfg.commands) cfg.commands = {};
          if (cfg.commands.native !== "auto") { cfg.commands.native = "auto"; changed = true; }
          if (cfg.commands.nativeSkills !== "auto") { cfg.commands.nativeSkills = "auto"; changed = true; }
          // Tools config: coding profile + only exec/bash to keep token count low for small models
          const wantTools = {
            profile: "coding",
            allow: ["exec", "bash"],
            deny: [],
            exec: { host: "gateway", security: "full", ask: "off" }
          };
          if (JSON.stringify(cfg.tools) !== JSON.stringify(wantTools)) {
            cfg.tools = wantTools;
            changed = true;
          }
          if (changed) {
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
            console.log("Execution permissions and tools configured");
          } else {
            console.log("Execution permissions already configured");
          }
        '
      timeout: 30

      name_i18n:
        zh: 启用执行权限
    - name: Restart OpenClaw to apply configuration
      run: |
        set -e
        echo "Restarting OpenClaw gateway to apply configuration changes..."
        docker restart openclaw-gateway
        echo "Waiting for gateway to be ready..."
        for i in $(seq 1 60); do
          if curl -sf http://127.0.0.1:18789/healthz >/dev/null 2>&1; then
            echo "Gateway is ready"
            exit 0
          fi
          sleep 2
        done
        echo "WARNING: Gateway may still be starting up"
      timeout: 180

      name_i18n:
        zh: 重启 OpenClaw 使配置生效
    - name: Display gateway address
      run: |
        set -e
        # No token on the local view: the gateway binds loopback only, so it
        # is reachable from this machine's browser and nowhere else. The
        # upstream image only demands a token for wider binds.
        echo ""
        echo "=========================================="
        echo "  OpenClaw / 访问地址"
        echo "=========================================="
        echo ""
        echo "  URL: http://localhost:18789"
        echo ""
        echo "  Gateway is bound to loopback — no token required."
        echo "  网关仅绑定本机回环地址，无需访问令牌。"
        echo ""
      timeout: 30

      name_i18n:
        zh: 显示访问地址

pre_checks:
  - type: disk_space
    min_gb: 2
    description: At least 2GB for OpenClaw Docker image

post_deployment:
  open_browser: true
  browser_url: "http://localhost:18789"

name_i18n:
  zh: reComputer R（本机或远程）

remote_overrides:
  remote_path: /home/{{username}}/openclaw_recomputer_r
  compose_dir: assets/recomputer_r
  detection:
    method: network_scan
    manual_entry: true
  pre_checks:
    - type: disk_space
      min_gb: 4
      description: At least 4GB for OpenClaw Docker image and workspace
  actions:
    before:
      - name: Validate workspace directory
        run: |
          set -e
          WORKSPACE="{{workspace_dir}}"
          if [ -z "$WORKSPACE" ]; then
            echo "No workspace directory specified, using default Docker volume"
            exit 0
          fi
          # Expand ~ to home directory
          case "$WORKSPACE" in
            "~"/*) WORKSPACE="$HOME/${WORKSPACE#\~/}" ;;
            "~") WORKSPACE="$HOME" ;;
          esac
          # Check if path is absolute
          case "$WORKSPACE" in
            /*) ;;
            *) echo "ERROR: Workspace path must be absolute (start with /): $WORKSPACE"; exit 1 ;;
          esac
          echo "RESOLVED_WORKSPACE=$WORKSPACE"
          if [ ! -d "$WORKSPACE" ]; then
            echo "WARNING: Directory does not exist: $WORKSPACE"
            echo "Creating directory..."
            mkdir -p "$WORKSPACE" || {
              echo "ERROR: Failed to create directory: $WORKSPACE"
              echo "Please create it manually or choose a different path."
              exit 1
            }
            echo "Directory created: $WORKSPACE"
          else
            echo "Workspace directory exists: $WORKSPACE"
          fi
        timeout: 10
        name_i18n:
          zh: 校验工作目录
      - name: Ensure docker compose command
        run: |
          set -e
          docker compose version >/dev/null 2>&1 || docker-compose --version >/dev/null 2>&1 || {
            echo "Docker Compose is unavailable. Need either 'docker compose' (v2 plugin) or 'docker-compose' (standalone)."
            echo "Install it: sudo apt-get install -y docker-compose-plugin"
            exit 1
          }
          echo "Docker Compose is available"
        name_i18n:
          zh: 确保 docker compose 可用
      - name: Check system resources
        run: |
          set -e
          FREE_GB=$(df -BG / | awk 'NR==2{gsub(/G/,"",$4); print $4}')
          [ "${FREE_GB:-0}" -ge 4 ] || {
            echo "Need at least 4GB free disk, current: ${FREE_GB:-0}GB"
            exit 1
          }

          MEM_GB=$(awk '/^MemTotal:/ {print int(($2 + 1048575) / 1048576)}' /proc/meminfo)
          [ "${MEM_GB:-0}" -ge 2 ] || {
            echo "Need at least 2GB system memory, current: ${MEM_GB:-0}GB"
            exit 1
          }
          echo "System resources OK: ${FREE_GB}GB disk free, ${MEM_GB}GB RAM"
        name_i18n:
          zh: 检查系统资源
      - name: Initialize OpenClaw config
        run: |
          set -e
          VOL="openclaw_openclaw-config"
          docker volume create "$VOL" 2>/dev/null || true
          WS_VOL="openclaw_openclaw-workspace"
          docker volume create "$WS_VOL" 2>/dev/null || true
          docker run --rm --network none -v "$VOL":/data -v "$WS_VOL":/ws ${DOCKER_REGISTRY_PREFIX}alpine sh -c '
            chown 1000:1000 /data /ws
            if [ ! -f /data/openclaw.json ]; then
              cat > /data/openclaw.json <<VOLCFG
          {"gateway":{"controlUi":{"dangerouslyAllowHostHeaderOriginFallback":true}},"commands":{"native":"auto","nativeSkills":"auto"},"tools":{"profile":"coding","allow":["exec","bash"],"deny":[],"exec":{"host":"gateway","security":"full","ask":"off"}}}
          VOLCFG
              chown 1000:1000 /data/openclaw.json
              echo "Initial config written"
            else
              echo "Config exists, skipping"
            fi
          '

        name_i18n:
          zh: 初始化 OpenClaw 配置
    after_upload:
      - name: Generate gateway access token
        run: |
          set -e
          # The upstream image refuses to bind anything wider than loopback
          # without a token, and — unlike the third-party image this solution
          # used before — it does NOT write one into its own config. It only
          # accepts OPENCLAW_GATEWAY_TOKEN / --token, so the token has to come
          # from compose interpolation, i.e. an .env beside the compose file.
          #
          # Locate that file rather than hardcoding the layout: the deployer
          # decides where compose_dir lands under remote_path.
          BASE="/home/{{username}}/openclaw_recomputer_r"
          COMPOSE=$(find "$BASE" -maxdepth 2 -name docker-compose.yml 2>/dev/null | head -1)
          if [ -z "$COMPOSE" ]; then
            echo "ERROR: could not locate docker-compose.yml under $BASE"
            exit 1
          fi
          ENV_FILE="$(dirname "$COMPOSE")/.env"

          # Reuse an existing token so a redeploy doesn't invalidate the one
          # the user already pasted into the control UI.
          if [ -f "$ENV_FILE" ] && grep -q '^OPENCLAW_GATEWAY_TOKEN=.\+$' "$ENV_FILE"; then
            echo "Reusing existing gateway token from $ENV_FILE"
            exit 0
          fi

          TOKEN=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')
          if [ -z "$TOKEN" ]; then
            echo "ERROR: failed to generate a gateway token"
            exit 1
          fi
          umask 077
          printf 'OPENCLAW_GATEWAY_TOKEN=%s\n' "$TOKEN" > "$ENV_FILE"
          echo "Generated a new gateway token in $ENV_FILE"
        timeout: 30
        name_i18n:
          zh: 生成网关访问令牌
    after:
      - name: Enable execution permissions
        run: |
          set -e
          docker exec openclaw-gateway node -e '
            const fs = require("fs");
            const p = "/home/node/.openclaw/openclaw.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            let changed = false;
            // Commands config
            if (!cfg.commands) cfg.commands = {};
            if (cfg.commands.native !== "auto") { cfg.commands.native = "auto"; changed = true; }
            if (cfg.commands.nativeSkills !== "auto") { cfg.commands.nativeSkills = "auto"; changed = true; }
            // Tools config: coding profile + only exec/bash to keep token count low for small models
            const wantTools = {
              profile: "coding",
              allow: ["exec", "bash"],
              deny: [],
              exec: { host: "gateway", security: "full", ask: "off" }
            };
            if (JSON.stringify(cfg.tools) !== JSON.stringify(wantTools)) {
              cfg.tools = wantTools;
              changed = true;
            }
            if (changed) {
              fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
              console.log("Execution permissions and tools configured");
            } else {
              console.log("Execution permissions already configured");
            }
          '
        timeout: 30

        name_i18n:
          zh: 启用执行权限
      # The .env token only reaches the gateway process as an environment
      # variable. A config volume carried over from an older deployment can
      # still hold a gateway.auth.token of its own — the third-party image this
      # solution used before wrote one — and that stale value wins, so the CLI
      # authenticates with the .env token and is rejected by the config's. The
      # symptom is a bare "unauthorized: gateway token mismatch" followed by a
      # silent fall back to the embedded agent. Fresh installs never hit it;
      # upgrades always do.
      - name: Align gateway token in config
        run: |
          set -e
          docker exec openclaw-gateway node -e '
            const fs = require("fs");
            const p = "/home/node/.openclaw/openclaw.json";
            const tok = process.env.OPENCLAW_GATEWAY_TOKEN;
            if (!tok) {
              console.error("ERROR: container has no OPENCLAW_GATEWAY_TOKEN");
              process.exit(1);
            }
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.gateway = cfg.gateway || {};
            cfg.gateway.auth = cfg.gateway.auth || {};
            cfg.gateway.remote = cfg.gateway.remote || {};
            if (cfg.gateway.auth.token === tok && cfg.gateway.remote.token === tok) {
              console.log("Gateway token already aligned");
            } else {
              cfg.gateway.auth.mode = "token";
              cfg.gateway.auth.token = tok;
              cfg.gateway.remote.token = tok;
              fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
              console.log("Aligned gateway.auth.token and gateway.remote.token with the deployment token");
            }
          '
        timeout: 30

        name_i18n:
          zh: 对齐网关令牌配置
      - name: Restart OpenClaw to apply configuration
        run: |
          set -e
          echo "Restarting OpenClaw gateway to apply configuration changes..."
          docker restart openclaw-gateway
          echo "Waiting for gateway to be ready..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18789/healthz >/dev/null 2>&1; then
              echo "Gateway is ready"
              exit 0
            fi
            sleep 2
          done
          echo "WARNING: Gateway may still be starting up"
        timeout: 180

        name_i18n:
          zh: 重启 OpenClaw 使配置生效
      - name: Display gateway access token
        run: |
          set -e
          # Read the token back from the .env the after_upload step wrote.
          # The upstream image keeps the token in its environment only — it
          # never persists one into openclaw.json, which is where the previous
          # third-party image put it.
          BASE="/home/{{username}}/openclaw_recomputer_r"
          COMPOSE=$(find "$BASE" -maxdepth 2 -name docker-compose.yml 2>/dev/null | head -1)
          ENV_FILE=""
          [ -n "$COMPOSE" ] && ENV_FILE="$(dirname "$COMPOSE")/.env"

          TOKEN=""
          if [ -n "$ENV_FILE" ] && [ -f "$ENV_FILE" ]; then
            TOKEN=$(sed -n 's/^OPENCLAW_GATEWAY_TOKEN=//p' "$ENV_FILE" | head -1)
          fi

          if [ -z "$TOKEN" ]; then
            echo "WARNING: Could not read gateway token from $ENV_FILE"
          else
            echo ""
            echo "=========================================="
            echo "  OpenClaw Gateway Token / 网关访问令牌"
            echo "=========================================="
            echo ""
            echo "  Token: $TOKEN"
            echo ""
            echo "=========================================="
            echo ""
            echo "  URL: http://{{host}}:18789"
            echo ""
          fi
        timeout: 30

        name_i18n:
          zh: 显示网关访问令牌
  post_deployment:
    open_browser: false
