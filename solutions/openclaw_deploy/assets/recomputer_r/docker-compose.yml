services:
  openclaw-gateway:
    image: openclaw/openclaw:2026.6.33-slim
    container_name: openclaw-gateway
    restart: unless-stopped
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - openclaw-config:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_VOLUME:-openclaw-workspace}:/home/node/.openclaw/workspace
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - OPENCLAW_SKIP_SERVICE_CHECK=true
      # Written to .env next to this file by the "Generate gateway access
      # token" after_upload action. The upstream gateway refuses to bind
      # anything wider than loopback without it, and unlike the previous
      # third-party image it does NOT auto-populate a token in its config.
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    # `openclaw` prefix is required: the official image's entrypoint is
    # `tini -s --`, so a bare "gateway" would be exec'd as a program name.
    # No explicit --bind: inside a container the gateway already defaults to
    # 0.0.0.0, while passing "lan" trips its refuse-without-auth check.
    command: ["openclaw", "gateway", "--allow-unconfigured"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openclaw-config:
  openclaw-workspace:
